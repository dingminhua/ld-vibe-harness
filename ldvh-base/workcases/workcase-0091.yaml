    summary: 修订 WorkCase 独立复核规则、行动模板与必要字段登记
    target_scope: specs/21-WorkCase-工作项.md、specs/31-事实对象判定与受控创建行动模板.md、specs/34-WorkCase获批计划执行行动模板.md、必要 specs/attachments
    effect_scope: 允许局部修改目标规则源与登记；不修改其它事实对象
    risk_summary: 可能改变 WorkCase Gate1 fingerprint、review 方法闭集和跨环境编排语义；错误会使既有对象或生命周期失配
    rollback_summary: 按逐文件 diff 回退本 WC 新增区块，保留所有既有及无关修改
