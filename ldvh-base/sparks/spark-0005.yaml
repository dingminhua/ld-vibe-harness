title: Web 完整阅读、Markdown 呈现与 Helper 渐进式阅读的边界
intent: 保留 Web 对当前事实对象的完整 Markdown 阅读与 Helper 渐进式阅读之间的边界，避免后续将 Human 页面做成 Helper 投影、将派生视图误作事实权威，或重复定位读取与渲染问题。后续需判断共享只读读取核心的必要性、性能、复杂度和第二权威风险。
status: implemented
summary: "**当前结论**\n\n- Web 面向 Human 的完整阅读与 Helper 面向 AI 的渐进式阅读已经形成清晰、可执行的边界：Web 独立读取当前 Working Tree 的完整事实对象并忠实呈现 Markdown、条件字段、关系以及 invalid、partial、error 等实际状态；Helper 继续按 F0–F4 提供有界候选、完整对象和必要来源展开。\n- 两条读取路径复用当前事实 Schema 与确定性读取语义，但 Helper 信封、Web DTO、缓存和界面均不成为第二事实权威，也不反向要求事实对象缩短正文。\n- 完整对象传输、Working Tree 变化后的重新读取、错误传播、Markdown 结构呈现和浏览器契约验证均已进入现行规则、实现与测试边界；原议题范围内没有仍需独立判断或分流的内容。\n\n**处置边界**\n\n本结论只结束该 Spark 的阅读架构议题，不表示所有未来页面体验、性能优化或新事实类型的呈现自动完成；新的具体缺口应按自身范围另行判断。"
evolution:
- at: '2026-07-19T08:33:54.065365+08:00'
  summary: 初始关注点是让 Human 通过 Web 直接查看 V4 当前事实、状态、关系、证据与长文本；Helper 只承担底层读取与一致性核对，Web 需以 bridge、read/list/detail 与 DTO 投影接管生产读取，但不扩大写入范围。
- at: '2026-07-22T10:47:49+08:00'
  summary: 重新界定两种消费方式的边界：Web 应独立提供完整的 Human 阅读，Helper 的 F0–F4 渐进式投影服务 AI 上下文控制；两者可复用只读读取核心，但不得让 Helper envelope、DTO、缓存或 UI 成为第二事实权威。
- at: '2026-07-22T13:36:18+08:00'
  summary: 迁移比较确认 Web 完整阅读还必须保留 Markdown 边界：YAML/结构化字段仍为权威，长文本字段可直接以 Markdown 承载；外部 Markdown 正文会改变事实源组织，须另行判断，不能被当前阅读实现默认引入。
- at: '2026-08-01T01:58:26+08:00'
  summary: 当前规则、实现与契约验证已完整覆盖 Web 完整阅读和 Helper 渐进式阅读的分工，原先的架构与验证候选从待判断问题收敛为直接落实边界，因此不再需要独立跟踪。
disposition_summary: 原议题已由现行 Web 完整事实阅读契约与实现、Markdown 忠实呈现、错误与部分读取边界，以及 Helper 渐进式阅读契约直接落实。两类消费投影的职责、共同读取语义和第二权威禁令均已明确，相关契约验证已覆盖原先列出的剩余问题；没有事实承接目标，也没有原范围内的剩余责任。
