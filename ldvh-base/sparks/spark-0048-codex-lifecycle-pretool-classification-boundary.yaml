evolution:
  - at: '2026-07-07T00:00:00+08:00'
    summary: |
      新建 Spark，暂存 Codex lifecycle 验收与 PreToolUse 动作分类边界问题。当前临时结论是：Codex PreToolUse 真实触发并能阻断可以成立；runtime adapter session-start 能产出 receipt 可以成立；但 Codex session_start integrated 和 Codex lifecycle integrated 均不能成立。下一步不应继续让 Human 手动跑技术命令，而应先审计并设计 PreToolUse 工具 / 动作分类、read_plan 消费链路和自然语言验收卡边界。

      待评审问题：
      1. 是否同意当前问题定义不是单个 hook bug，而是验收标准、动作分类和 read_plan 链路边界混杂？是否同意将三者拆为三层分别归口（验收标准归 01 §6.6、动作分类归 PreToolUse 设计、read_plan 链路归 runtime cache 消费链路）？
      2. 是否同意当前不能声明 Codex lifecycle integrated？
      3. 是否同意优先修 PreToolUse 动作分类，而不是继续补单个命令白名单？是否同意分两步推进：第一步让只读调用的放行不依赖 read_plan 消费证据（按 operation+target 判断写入性质，只读操作跳过消费证据检查）；第二步再细化写入类动作的强制检查项？
      4. 子 agent 审核、review 等工具是否需要独立 Gate？倾向判断：按 operation+target 分类，同一工具的只读调用归只读协作 / 外部过程输出（02 §4 已定义过程输出回主控 AI），其写入调用仍走 PreToolUse，不设独立 Gate。是否同意此分类依据统一为 operation+target 而非工具名称？
      5. 01 §6.6 的 6 项最小依据中，payload、rollback、Stop/completion 已被覆盖，不缺；值得追问的是：(a) trust 是否需从第 1 项"已授权或无待授权"中独立显化为硬验收维度？(b) 01 §6.6 目前是"点"检查（每个事件单独达标），是否需补充 session_start→pre_tool_use 之间 receipt/read_plan 的"链路传递验证"，以防点达标但链断裂？
  - at: '2026-07-07T06:24:00+08:00'
    summary: |
      依据评审意见修改 description 与 evolution 待评审问题（Human 已授权，specs/20 §10 第 6 条）。主要修改：description 显式回指 01 §6.6 的 6 项最小依据，说明本 Spark 不重定义验收标准；动作分类依据统一为 operation+target 而非工具名称，明确只读调用放行不依赖 read_plan 消费证据；Human 验收职责措辞改为 AI 提出候选结论、Human 最终确认；待评审问题 3 拆两步、问题 4 统一分类依据、问题 5 区分已覆盖项与待追问项（trust 显化、receipt 链路传递验证）。
  - at: '2026-07-07T06:49:58+08:00'
    summary: |
      第一阶段实现已落到 Codex shim：新增 ActionClassification，将 operation、target、command / patch payload 和 side_effect_class 汇总为 requires_preflight 判断。只读命令、显式 read / review 操作和只读协作过程输出不再因缺少 read_plan 消费依据被误阻断；写入工具、patch payload、非只读 shell、显式写入 operation 和未知动作仍默认进入 PreToolUse preflight。新增测试覆盖显式 read 放行、协作 review 放行、协作 write 阻断；子 agent 只读审核未发现 P0/P1/P2 阻断问题。残留增强点：当前实现仍保留少量工具名辅助判断，后续可继续收敛为更明确的 side_effect_class 规则表。
