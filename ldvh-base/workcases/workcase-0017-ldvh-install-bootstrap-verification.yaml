      expected_output: |
        在 specs/33 中明确安装前 bootstrap 不受 Runtime receipt 门禁约束；Runtime Protocol 只在安装完成后参与验收和日常运行；Rules/Hook 双路径安装验收必须通过 Code 执行。
      status: pending
      blocking_reason: ''
