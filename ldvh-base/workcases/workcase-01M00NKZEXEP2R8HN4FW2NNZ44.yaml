status: closed
title: 建立 DeepSeek Harness 平台机制事实卡与 WorkCaseRunController 消费合同
goal: 为 DeepSeek Harness 建立与 09.Att.03（WorkBuddy）、09.Att.04（Cindy）同型的 LDVH 平台机制事实卡，并形成一份非权威的 DeepSeek Harness WorkCaseRunController 运行时消费合同：登记 DeepSeek Harness 承载 WC 独立复核的协作 Worker/subagent 机制事实（复核载体、模型路由、权限语义、消息排队与异步回送）、把 21 §4.5 的 WorkCase 复核控制点映射为 DeepSeek Harness 动作，并以消费合同冻结 session↔WorkCase 绑定、fresh Helper 投影消费、settlement notice / FIFO / workflow 前台收集语义与幂等恢复边界。全部机制陈述绑定当次可观察证据或如实标记 unverified/unsupported；不复制 LDVH 规则正文，不新增环境 Hook/插件/adapter 接入层，不宣称真实接入、部署或递达已发生。
scope: "在当前 LDVH worktree 内：\n(1) 新建 specs/attachments/09.Att.05-DeepSeek-Harness平台机制事实.md（attachment_key: deepseek-harness-platform-facts），骨架与 09.Att.03/09.Att.04 同型：平台机制事实表、执行注意事项、WC 控制点承接映射、单一事实保护、观察时间与核验；内容只承载平台机制事实，不复述 21/31/34 规则；\n(2) 修改 specs/09-环境接入规范.md 两处：frontmatter authorized_attachments 增加 deepseek-harness-platform-facts，§8 增加一条参照 09.Att.03 既有授权登记句句式的 deepseek-harness-platform-facts 授权登记句（当前 §8 仅有 09.Att.03 一条授权登记句，09.Att.04 只有 frontmatter 授权）；\n(3) 同步 code/tests/specs/test_repository.py 的规范仓库文档数量断言；\n(4) 新建 code/plans/deepseek-harness-workcase-run-controller.md 非权威消费合同，以 code/plans/cindy-workcase-run-controller.md 为结构参照，平台事件与动作一节替换为 DeepSeek Harness 当次实际机制（continuable subagent settlement notice 异步回送、send_message FIFO 排队、workflow 前台收集、未定位宿主 pre-yield/Stop 事件），逐项标注证据级别；\n(5) 验证：./ldvh check 规范机械检查、code/tests/specs 相关聚焦测试、两份交付文件写后回读与 SHA-256、本 WC 事实写后 check-fact-integrity、pre-existing dirty paths 逐文件基线比较。\n机制事实来源闭集：本部署 node_modules/@deepseek-ai 各包 README 与类型定义、~/.dsh/settings.yaml 当次内容、本会话可观察工具面与运行时上下文、一次已实际完成的只读 workflow 分派探针（deepseek-official/deepseek-v4-flash 返回 PROBE_OK）。\n排除：Git commit/push/PR/release/deploy；修改 DeepSeek Harness 源码、~/.dsh 或 settings.yaml 等任何宿主配置；部署或同步 skill、Git Hook、Stop gate 等真实接入动作；真实生产事件或端到端验证；创建或修改其它事实对象；修改任何既有 dirty 文件；逆向私有 API、外部轮询 daemon、新 adapter 或第二状态机。"
