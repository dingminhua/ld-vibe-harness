规范10:
  - "1) 任何新增颜色只能来源于 ldvh 主题 token 或已存在语义映射 key。"
  - "2) 禁止新增裸露十六进制色值（#RRGGBB）。"
  - "3) 禁止新增 tailwind 语义色类（text-/bg-/border-*-400/500 等）直接表达业务语义。"
  - "4) 同一语义必须单点定义（Single Source of Truth）。"
  - "5) 分类色仅来自 category 映射文件。"
  - "6) 生命周期状态色仅来自 status 映射体系。"
  - "7) 流程态颜色仅来自 executionFlow 映射体系。"
  - "8) signals/优先级/重要性颜色仅来自 signal 映射。"
  - "9) 禁止悬空 token 使用（如 text-tertiary），必须先补齐 token 或移除引用。"
  - "10) 所有受控例外必须有理由、最小影响范围与复检时间。"

key_findings: |
  - 主题层已存在 ldvh 系列主题 token（light/dark）。
  - 分类、生命周期状态、执行流程和信号已具备集中映射入口。
  - 当前阶段存在少量 hardcoded 例外，不阻塞第一阶段交付；进入专项阶段再收敛。
  - 颜色治理分为 4 个 study：冻结、语义审计、硬编码清单、token 健康与回归。
