        - specs/32-environment-entry-adaptation-环境入口落地与适配检查.md
      expected_output: 在 30-59 未占用编号中建立 candidate/draft 草案，分别承接记录对象归口、Study 研究行动产物和 WorkCase 行动承接，不激活成员。
      status: done
      result_summary: |
        已检查 30-59 现有成员：30 和 31 为 active；32 为 draft/candidate；33、34、35 未占用。本轮新增三个候选成员主文件，均为 `v2_spec.status=draft`、`v2_spec.authority=not_active_until_human_approved`、`v2_action_member.collection_status=candidate`，并明确不得被 Rules、Skill、Agent、Hook、Code、Web 或 AI 默认当作 active 流程执行。

        候选拆分：

        - `specs/33-record-object-routing-recall-记录对象归口与召回.md`：只管 Spark、ADR、Pitfall 三类记录对象的归口、创建前召回、出库召回、状态使用、冲突识别和 Human Gate；WorkCase 与 Study 只作为出口。
