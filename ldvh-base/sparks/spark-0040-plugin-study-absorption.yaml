description: |
  本 Spark 承接对 CodebaseMemory、TaskmasterAI、Firecrawl 三个插件/工具的并行调研。研究产物应分别形成三个 Study，并同时覆盖产品/工作流调研、技术实现调研和 LDVH 可吸收改造建议三类内容。

  本轮执行方式由 Human 明确：调研必须联网，不需要最后汇总，使用新建三个对话同步进行。三个 Study 只承载稳定报告正文；本 Spark 保持为待处理入口，用于后续判断哪些能力应进一步分流到 WorkCase、ADR、Pitfall、docs、规范、Code、Web 或运行时扩展。
