title: 非权威关系导航与代码库索引
intent:
  保留事实候选、关系导航与代码索引如何帮助定位而不形成第二权威的问题，避免把旧知识地图、派生图谱、相似度或第三方工具结果误作正式关系、事实语义或自动决策依据。后续需分别判断三类导航能力的真实需求、重建边界和验证范围。
status: open
priority: P2
summary: "**当前判断**\n\n- 事实候选、关系导航和代码索引都可帮助减少重复读取、定位责任和影响，但三者必须区分来源、可信度与失败语义。\n- 05
  的 F0–F4 事实召回直接扫描当前 Working Tree，形成恢复清单、候选卡与有界摘录；需要完整语义时再精确进入 F3，不建立持久 embedding、相关性分数或第二事实权威。\n\
  \n**三类导航的边界**\n\n- 关系导航只来自当前 `relations` 与类型规则；反向关系、路径和图形可以派生，但不得回写第二份关系或按标题相似创造正式关系。\n\
  - 若采用代码索引，必须可重建、带生成版本与失效状态并回指源文件；仍需决定语言/仓库范围、增量更新、删除重建、查询预算、原文件回读和实际效果验证。\n- 需要分别判断事实候选是否满足
  AI 恢复、Human 是否需要正式关系的反向导航，以及代码任务是否真值得引入符号、调用链或影响索引。\n\n**边界**\n\n- 不恢复旧 Knowledge
  Map、tool-plan、会话记忆或路由状态，不把候选、反向视图或代码图谱当作权威事实。\n- 不授权 embedding、语义评分、自动关系写回、第三方 MCP
  安装或代码索引实施；索引只能缩小阅读范围，领域判断仍需回到当前对象、源码、Specs 和实际验证。"
evolution:
- at: '2026-07-22T13:57:58+08:00'
  summary: 迁移复核保留 V3 的定位与影响发现需求，但移除机械 Git 来源、旧知识地图和第三方能力断言；当前分开审视事实召回、关系导航与代码索引。
