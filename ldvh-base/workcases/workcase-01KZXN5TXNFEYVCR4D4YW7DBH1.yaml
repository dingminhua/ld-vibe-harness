title: 验证 Spark 单对象 CAS 分流流程
status: closed
goal: 验证并收敛既有单对象更新能力如何在 Spark 已被一个或多个已获 Gate 1 批准的 WorkCase 完整承接时，安全地将该 Spark 以完整 after 路由为 routed；不建立多对象原子事务。
scope: 仅覆盖当前规则与既有 update-fact-object 单对象 CAS 的适用边界，以及隔离 fixture 中对完整 Spark after、幂等 no_change、指纹冲突/写入失败零写入和回读的定向测试。允许仅在测试揭示既有单对象实现缺口时，对 code/ldvh/helper/operations/fact_object_operation.py、code/ldvh/facts/update_application.py、code/ldvh/facts/relations.py 和对应定向测试作最小修正。排除全局锁、整库或根目录复制、snapshot、journal、新专属 Helper 操作、所有真实 Spark/其它事实对象写入、Git 与外部动作。
success_criterion_definitions:
- criterion_id: criterion-full-after
  statement: 隔离测试证明只有在 Spark 全部原始内容已由一个或多个合法目标完整承接时，调用方才能通过既有单对象 CAS 一次提交该 Spark 的完整 after：open→routed、全部 routed-to 关系与 disposition_summary 同时成立；本 WC 不修改真实 Spark。
- criterion_id: criterion-retry
  statement: 隔离测试证明指纹冲突、写入或回读失败不把 Spark 表述为已分流；重新读取并重建 after 后可安全重试，已等同的完整 after 只得到 no_change，不重复关系或错误路由。
- criterion_id: criterion-boundary
  statement: 实现和测试明确这只是单个 Spark 载体的完整 CAS 替换，不承诺 WC 与 Spark 多对象原子性，也不引入全局锁、整库复制、snapshot、journal 或新专属操作。
success_criterion_results:
- criterion_id: criterion-full-after
  outcome: satisfied
  summary: 隔离用例验证完整 after 在一次 CAS 中同时形成 routed、disposition_summary 与两条 routed-to；两个稳定目标均未被写入。
- criterion_id: criterion-retry
  outcome: satisfied
  summary: 隔离用例验证过期 CAS 零源写、相同双目标完整 after 为 no_change；现有定向用例覆盖读回失败条件回滚及同指纹并发仅一方成功。
- criterion_id: criterion-boundary
  outcome: satisfied
  summary: 实现仍是单个 Spark 完整替换；本案只改隔离测试，未引入全局锁、整库复制、snapshot、journal、新专属操作或真实事实写入。
result_summary: 已验证既有单对象 Spark CAS 可在调用方完成承接判断后，以一个完整 after 可靠记录单目标或多目标分流；本案未修改运行时实现或真实 Spark。
validation_summary: 通过：code/tests/facts/test_relations.py 与 test_update_application.py 55 项；code/tests/helper/test_fact_update_operation.py 核心 7 项（含双目标完整 after）。未验证：真实 Spark 的业务承接判断与写入，仍需在未来具体授权场景独立执行。
closure_outcome: completed
disposition_summary: 本 WorkCase 已完成对既有单对象 Spark CAS 完整分流流程的隔离验证；该结论只覆盖 fixture 与既有单对象 CAS，不代表任何真实 Spark 已完成承接或写入，也不证明 WC/Spark 多对象原子性。
