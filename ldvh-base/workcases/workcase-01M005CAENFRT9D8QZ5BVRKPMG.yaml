- criterion_id: criterion-02
  outcome: satisfied
  summary: 31 §5.2.1 B.1 对齐第 1 档来源（R2a），B.2 澄清逐档判断不等于逐档询问（R2b），与 D.1/B.3 语义一致、不新增冗余规则。
- criterion_id: criterion-03
  outcome: satisfied
  summary: git diff 精确回读确认 21 §4.5.1 第 6 条与 31 §5.2.1 B.1/B.2 两处改动，与方案 R1/R2 一致、未越出 scope。
result_summary: 已在 21 §4.5.1 新增第 6 条「第 1 档判据来源」（R1），并在 31 §5.2.1 B.1/B.2 对齐 R2a（第 1 档来源）与 R2b（逐档判断不等于逐档询问）。改动经 git diff 精确核验，未越出 scope（仅 21/31 两份规范相关章节）。
