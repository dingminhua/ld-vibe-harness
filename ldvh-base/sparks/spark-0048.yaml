title: 可信签发与验签根的授权边界
status: implemented
intent: 保留可信签发与验签根如何使授权证据无法由 AI 伪造，以及历史 change_log 如何在专用受控边界中迁移并由 Web 端到端消费的问题，避免把可由调用方填写的引用字段、局部机械校验或提交署名误作有效授权。后续需判断可接受的信任根、签发与验签边界、迁移策略与验证责任，以及何时值得形成独立实施责任。
summary: "## 当前判断\n\n议题已由研究结论与既有实现承接，不再作为未处置议题保留：\n\n- **可信签发与验签根**：study-0027（AI 代理授权边界的行业实践调研）确认行业等价物是“绑定 Human 决策 + 执行点 fail-closed”，LDVH 的 WC 机制（21 §6.5 Gate1 批准绑定 baseline_fingerprint 与真实 Human source_refs、§7.3 专属写入口机械校验）已实现该等价闭环；引入 Keychain、私钥或独立信任服务属于可推迟且当前无净价值的选项，非必要设施。\n- **专用遗留 change_log 迁移**：已由 workcase-0052 落地为长期可发现的单对象受控操作 `migrate-legacy-change-log`（05 §11.7.1 声明、32 §C 承接、Helper/Code 实现与定向测试建立），并完成 spark-0044 的受控迁移与收口。\n- **迁移后 Web 端到端消费**：可信根前提已消失（无需外部信任设施），Web 两字段 change_log 读取契约在 workcase-0049 已通过定向验证（criterion-contract 部分 satisfied）；迁移后流水即普通两字段流水，Web 读取契约已覆盖。\n\n## 边界\n\n本议题不授权安装 Keychain、私钥、独立服务或其它外部信任设施；现有 change_log 与 Git footer 不因此具备不可伪造的责任证明，其审计价值仍限于结构、时间绑定与署名一致性。"
disposition_summary: 已落实：授权证据不可伪造的行业等价物是绑定 Human 决策（WC Gate1 批准的 baseline_fingerprint 与真实 Human source_refs），LDVH 无需引入外部可信签发与验签根设施；遗留 change_log 迁移能力已由 migrate-legacy-change-log 受控操作落地（workcase-0052 收口 spark-0044）；迁移后 Web 消费由既有两字段读取契约覆盖。workcase-0049 路由至本议题的三项剩余责任均已承接，无剩余待处置内容，不新增 routed-to。
