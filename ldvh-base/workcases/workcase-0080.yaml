title: 签名字段三元组更名与取值校验落地
goal: 把 LDVH 责任签名字段与 Git 提交 trailer 按「模型id、宿主名称、会话id」三元组语义更名并强化取值校验，使新写入的 change_log 与提交署名取值稳定、可比较、可审计。
scope: 覆盖规范、事实 Schema、Git footer 契约、Helper 注入链、机械校验和历史口径登记的受控修订计划；不执行实现、不提交 Git、不批量改写历史事实。具体包括：\n\n1. 修订 specs/attachments/05.Att.01 字段登记、取值约定与示例，使用 model_id、host_name、session_id，并去掉宿主示例中的系统名后缀。\n2. 修订事实 Schema 与校验：新条目严格写新字段名，历史旧形状仅宽容读取、不迁移改写。\n3. 修订 specs/03 footer 契约及 code/ldvh/commits/validation.py：Agent-ID→Model-ID、Host-Environment→Host-Name，Session-ID 不变。\n4. 同步 specs/attachments/04.Att.01 与 requests.py、fact_creation、fact_update、workcase_update 的 observed_context.signature 注入字段。\n5. 加入 model_id 命中已知产品别名闭集、host_name 含括号系统后缀的拒绝或警告校验，并补充测试。\n6. 在规范中明确签名是执行会话的声明（attestation），不是已验证身份；模型id的平台可验证注入在当前架构保持 unsupported。\n7. 集中登记历史不一致对象的共存口径，至少覆盖 workcase-0026、spark-0040、spark-0046、spark-0049、spark-0056；不批量追加更正流水。
success_criterion_definitions:
- criterion_id: criterion-new-triple
  statement: 新条目与新提交 trailer 使用 model_id、host_name、session_id 及 Model-ID、Host-Name、Session-ID；三者取值分别为模型id、无系统后缀的宿主名称、会话id，并保持跨载体一致。
- criterion_id: criterion-dual-read
  statement: 新条目写入严格使用新字段名，历史旧形状可机械有效地宽容读取且不被批量迁移或改写。
- criterion_id: criterion-validation
  statement: 已知模型产品别名与含括号系统后缀的宿主名称触发约定的拒绝或警告，且签名 attestation 定性与 unsupported 边界写入规范。
- criterion_id: criterion-regression
  statement: 既有测试全部通过，并新增覆盖双轨读取、字段/trailer 更名和机械排雷的测试。
