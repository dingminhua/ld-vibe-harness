title: 交付中解释关键术语与代码标识
status: active
decision_question: AI 面向 Human 使用中文沟通时，如何表达可能影响理解的技术术语及代码标识，使其语义可理解，又保留与技术来源的准确对应？
decision: 决定在面向 Human 的中文自然语言交付中，对会影响理解、判断、授权或验收的技术术语，以及出现于说明、方案、审核或代码讨论中的常量名、变量名、方法名、类名、字段名等代码标识，在首次有意义使用处给出简短、贴合当前语境的中文语义解释；原术语、英文名或精确标识仍保留以便回指。后续重复不机械复述。代码标识可以原样置于代码、路径、命令或引用中；当它在对话中承载判断、选择、风险、行为或结果说明时，在相邻自然语言中说明“它在这里表示什么、起什么作用或不代表什么”。术语密集时可以集中列出小型中文释义，而不逐词翻译。该 ADR 在其 applicability 内约束中文交付；它不改写精确标识，也不替代具体 Specs 或 Human 授权。
applicability: 适用于 LDVH 中 AI 向 Human 的中文回复、方案、审核、报告、说明和需要 Human 作出理解、选择、授权或验收的自然语言交付，尤其包括对代码、配置、接口、事实对象或测试的讨论。它不改写 Specs、事实对象、代码、命令、路径、字段名或外部原文的精确文本；这里的决定是在面向 Human 的相邻中文说明中解释这些标识的语义，而不是修改其名字。已解释过且当前语境未变化的术语或标识无需重复展开；Human 对篇幅、语言或术语表另有明确要求时，按其当次要求调整表达方式。
rationale: 技术术语的原文、直译或代码标识本身往往不足以让 Human 判断其在当前问题中的作用、边界和后果。尤其常量、变量、方法名和字段名虽然精确，却不能自然说明它们保存什么、触发什么或限制什么；若只保留名字，Human 无法可靠参与判断。保留原术语或标识并给出中文语义，能够兼顾可追溯性与共同理解。未选择“只解释自然语言术语”，因为它把最不透明的代码标识排除在外；未选择“逐个标识字面翻译”，因为字面翻译仍可能误导且会掩盖当前作用。
consequences: 采用这一决定时，代码标识会被视为可能需要解释的技术表达：例如首次讨论一个常量时说明其控制的阈值或开关，讨论变量时说明其承载的数据或状态，讨论方法时说明其执行的动作、输入输出或边界。回复会在必要处略增篇幅，但精确术语、来源和代码标识仍可定位。该决定不把中文解释升级为技术事实或技术完成声明，也不要求在代码块内重命名、翻译或注释每一个无关标识；解释深度与其对 Human 当前理解和决定的影响相称。
trigger_signal: 编写或修改面向 Human 的中文技术说明、代码标识解释、术语翻译、验收说明
