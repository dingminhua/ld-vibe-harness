title: WorkCase 编排控制面与可执行状态
intent: 保留 WorkCase 应提供哪些稳定、可验证的编排状态而不变成调度器的问题，避免把执行期线程、工具调用、子 Agent API 或测试通过误作 WorkCase 状态推进或关闭。后续需判断当前字段能否支持恢复、协作与验证，并识别真实字段缺口。
status: implemented
summary: "**当前结论**\n\n- WorkCase 已被定义为稳定控制面：保存目标、范围、成功标准、计划版本、工作项、依赖、状态与阶段、阻塞与恢复入口、Controller 自检、独立复核、Human Gate 和关闭判断；运行期线程、工具调用、子 Agent API 与调度器状态不进入事实对象。\n- 获批计划执行模板已经把跨检查点写回、同一稳定检查点的窄例外、阻塞/恢复、结果复核与关闭链组织成可恢复序列，同时明确模板不是调度器，也不能把代码存在、测试通过或子 Agent 返回自动解释为 WorkCase 推进。\n- 相关实施与验证已证明当前字段和动作边界足以支撑执行接续；原议题不再存在需要新增控制面字段、自动推进机制或外部任务系统的剩余内容。\n\n**处置边界**\n\n本结论只说明该 Spark 限定的控制面与可执行状态问题已落实，不表示任一具体 WorkCase 已完成，也不把运行期平台能力升级为事实语义。"
evolution:
- at: '2026-07-22T13:53:39+08:00'
  summary: 迁移复核保留 V3 关于协作结果回收与 WorkCase 控制面的价值，但移除旧 Git 来源、状态机和实现断言；当前问题收敛为稳定工作契约是否足够且不越界。
- at: '2026-08-01T01:58:26+08:00'
  summary: 当前 WorkCase 类型规则与获批计划执行模板已把控制面、检查点、恢复和审核关口完整落到可执行边界，原先的字段充分性与调度器风险已收敛，不再需要独立跟踪。
disposition_summary: WorkCase 控制面、检查点写回、阻塞恢复、Controller/Reviewer/Human Gate 链和“不是调度器”的边界已经由现行类型规则、获批计划执行模板及其实施验证直接落实。相关 WorkCase 结果仅作为落实依据，不作为本 Spark 的事实承接目标；原范围内没有剩余责任。
