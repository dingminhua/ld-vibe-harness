title: Agent 友好的 LDVH Helper 与提交流程
intent: 保留 AI 在 Helper 事实创建、更新与受管辖 Git 提交流程中的重复发现、请求拼装、机械检查、诊断和回读负担，避免为了表面上的一步操作而削弱候选与 diff 审核、真实 Index 预检、原生 commit-msg Hook 或提交后回读。后续需判断哪些执行编排、诊断与输出优化能降低端到端成本，同时不恢复两阶段提交、第二权威或新的持久事务状态。
status: open
priority: P2
summary: "## 当前结论\n\n- 真实提交 `c7515314c9f3292e1e95784ccb7a6bf8038d3c10` 已验证：当前流程已经从旧两阶段、alternate Index 和 prepared 状态收敛为正常的 `git add + precheck + git commit + 回读`；真实 `commit-msg` Hook 在原生提交事件中执行并放行。\n- 当前主要成本已经不是 Git 提交模型，而是外围编排：模板发现与全文读取、多个只读检查串行、事实完整性重复扫描、冗长 message、用完整 Git trace 证明 Hook 执行，以及 Helper 成功响应和提交后回读输出过大。\n- 优化目标是减少往返、重复观察和无关输出，不降低机械检查，不把“审查”扩张为通用代码或文档语义评审。\n\n## 不可删除的核心闸门\n\n1. AI 明确当次候选文件，并逐文件审核对应 diff；真实 Index 必须精确等于候选，不能误带无关改动。\n2. 对同一真实 Index 和完整 message 执行必要机械预检；失败、不可验证或能力不可用均停止。\n3. 使用不带 `--no-verify` 的原生 `git commit`，让真实 `commit-msg` Hook 作为最终固定机械闸门重新检查事件输入。\n4. 提交后回读 HEAD、message、精确文件范围、Index 与剩余 Working Tree；不自动 push。\n5. 候选含事实载体时，受控写入、精确回读和事实完整性审计仍须成立。\n\n## 优化规划\n\n### 第一优先级：不改变规范语义的执行优化\n\n- 并行执行互不依赖的只读检查：Git 状态与候选 diff、事实完整性、Hook inspect、规则身份读取。\n- 正常成功路径只返回结论、候选路径、快照身份和问题；来源、管辖证据与完整诊断仅在失败或 diagnostic 模式展开。\n- 所有提交统一具备准确 header、唯一 `关键变更:`、至少一个据实的非空列表项和必要 trailers，不把单文件或非 breaking 当作省略 body 的捷径；`动机:`、`影响边界:`、`验证结论:`、`风险与后续:` 仅按规则触发或实际需要增加，避免固定五段负担；事实候选仍准确声明全部新增流水的 Session-ID。\n- 将最终 Index/Hook 核对、原生 commit 与提交后只读回读组织为因果连续但往返更少的执行批次，不建立新的持久状态。\n\n### 第二优先级：最小来源与 Code 调整\n\n- 明确定义何时可消费最近一次受控事实写入附带的完整性审计：只有事实集合、规则源、实际 worktree 和相关内容指纹均未变化时才复用；否则重新扫描。目标是消除同一稳定快照上的重复全库检查，而不是建立长期缓存或审计凭证。\n- 让真实 `commit-msg` Hook 通过时输出一行简洁、可回查的成功证据，失败时继续输出 `stage/code/path/field` 诊断，从而不再需要 `GIT_TRACE=1` 的整段日志来证明 Hook 实际触发。\n- 评估在不增加第二权威的前提下合并“行动模板定位 + 内容读取”，并为 Helper 成功响应提供更窄的摘要输出；完整来源仍可按需展开。\n- 合并提交后 HEAD、message、paths、Index 与剩余状态的只读回读输出，但不减少实际检查对象。\n\n## 明确排除\n\n- 不恢复或新建两阶段提交、提交服务、prepared token、handle、witness、challenge、journal、持久事务状态或 alternate Index。\n- 不把 precheck 与最终 Hook 合并为一次检查，也不删除真实 Hook、候选 diff 审核或提交后回读。\n- 不引入 pip、wheel、sdist、editable install、插件部署或 push 自动化。\n- 不以“流程优化”为由增加新的 Human Gate、固定 subagent 审核或通用语义内容审查。\n\n## 待验证\n\n- 分别用普通代码提交、事实对象提交和混合提交测量工具往返数、端到端耗时、输出量、诊断修正次数和误带防护结果。\n- 判断完整性审计复用所需的最小新鲜度绑定是否能保持简单；若绑定成本接近重新扫描，应保留扫描而不引入复杂缓存。\n- 判断 Hook 成功证据和窄响应能否在不污染正常 Git 输出、不过度暴露内部细节的前提下稳定支持 AI 回读。\n- 若执行层优化已经达到可接受速度，不再为了减少少量调用新增公开操作或提交包装器。"
