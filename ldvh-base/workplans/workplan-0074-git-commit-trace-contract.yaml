    status: done
    result_summary: 已选择删除对象手写字段；关联提交由 Git 历史、对象 ID 和路径派生。WorkPlan/ADR/Pitfall/Memo/Study 规范、CLI 模板、Validator 和测试夹具已同步，并补充全局 `related_changes` 写入/校验拦截。
