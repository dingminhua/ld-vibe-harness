title: Helper 读交互优化
status: open
priority: P2
intent: 保留 Helper 只读操作在真实任务中是否存在响应过重、每次读回完整对象、无法选择字段或按条件过滤、无法批量读的交互摩擦，并判断哪些只读 operation 的具体窄化能产生可观察的成本改善，而不依赖固定模型统计对比或大规模测试框架。
summary: "## 当前状态\n\nHelper 只读操作（read-fact-objects、read-action-template-candidates、read-specification-candidates 等）当前每次按完整对象返回，缺少字段选择、条件过滤与批量读取能力；一项目常查询往往需要读入完整内容，实际需要的只是少量字段。\n\n## 实测证据（2026-08-16，dev-v4 @ 83eb9f4a）\n\n在真实 worktree 上对只读响应做体积分解：\n\n- read-fact-objects（父 Spark 大对象）：总响应 26.4KB，其中 fact_object 本体 10.1KB，sources 段 4.0KB；title/status/priority/intent/summary 五核心字段仅 3.96KB；\n- read-action-template-candidates：总响应 14.0KB，result 5.2KB，sources 4.1KB，verification 4.4KB；\n- read-specification-candidates：总响应 24.0KB，result 7.7KB，sources 4.4KB，verification 4.4KB；\n- capabilities 全量：65KB，result.operations 51.6KB，sources 12.4KB。\n\n每次调用都无条件携带 sources + verification 段（合计约 8–16KB），即使调用方只需要 result。`--fields` 投影已确认有效：`--fields \"result.items\"` 把 read-fact-objects 响应从 26.4KB 降到 11.5KB（裁剪 sources/gaps/follow_up 等包装段）。\n\n## 已确认代码级限制：--fields 无法进入数组\n\n`code/ldvh/cli_projection.py::_lookup_object_path` 只支持逐层 dict 导航，遇数组（如 result.items）即判 missing：`--fields \"result.items.fact_object.title\"` 实测返回 missing（报\"selector 语法无效\"实为数组路径不支持）。这正是本 Spark 描述的核心摩擦点——调用方无法只取 items[] 内的少量字段，被迫读回完整对象。\n\n\n## 实施结果（2026-08-16）\n\n窄 WorkCase workcase-01M062YSRWFS58GRXT8C51Q7TQ 已 Gate1 批准执行并经 Gate2 关闭（closed/completed）：Helper CLI --fields 现支持数组内字段选择（如 result.items.fact_object.title），实现为结构保持的 list 逐元素投影 + 按索引深合并，现有 object-only 投影与公共契约保持。真实 worktree 实测四类只读操作选择少量字段即可降低 payload 87.9%-98.3%，全部 missing=[]；93 个相关测试通过，2 轮独立结果复核全部 feedback 已处置。\n\n本 Spark 的\"数组内字段选择\"摩擦点已收敛；\"批量读、条件过滤、compact profile\"仍为待判断候选，须先有真实任务摩擦证据再评估是否形成窄 WorkCase。\n\n## B 方向调研结论（2026-08-16）\n\n批量读与条件过滤能力**已存在**：read-fact-objects 支持 1-128 引用批量读，find-fact-object-candidates 支持 statuses/fact_type_keys/text_match/分页过滤。剩余摩擦为 F2 卡片字段固定不可定制（盘点需 F2 过滤 20-42KB + read 字段选择两步）。该摩擦点已由窄 WorkCase workcase-01M066ZNTWFV3TSXW1K7HREM3H 实现 F2 卡片 arguments.fields 字段定制并关闭（closed/completed）；实测整体降幅约 2%（卡片大头为摘要摘录 excerpts 64% 与溯源 source_refs 21%，fields 仅占 8%），如实记录不夸大。\n\n下一步候选：摘录（excerpts）控制（占卡片 64%，潜在降幅最大）、source_refs 精简（21%）、compact profile（须先有\"调用方不需要溯源段\"的真实证据）。\n\n## 摘录控制候选方向（2026-08-16 讨论）\n\n**问题**：spark F2 卡片恒带 intent/summary 的有界摘录（512 字符上限），即使盘点场景（只要 title/status）不需要正文。单卡 3073B 中 excerpts 占 1973B（64%）。\n\n**拟议设计**（待窄 WorkCase 确认）：\n- fields 提供时自动省略 excerpts（盘点语义上\"只要 title/status\"就不该带正文摘录）；未传 fields 时保持现状（完整投影 + 摘录）；\n- 范围限于 spark 卡片 excerpts 生成逻辑（_card() 中 F2+spark 分支），其它类型无摘录不受影响；\n- 预期收益：spark 盘点从 34424B → 预期约 12KB（-65%），为已实现 fields 定制（-2%）的 30 倍；\n- 需改契约（fields 语义扩展）+ specs/05 更新 → 走窄 WorkCase。\n\n## 其余优化候选盘点（2026-08-16）\n\n- **source_refs 精简**：单卡溯源段 647B（21%）；批量盘点（几十张卡片）时每张都带完整 source_ref（规则引用+working_tree 观察）。候选：批量卡片用轻量引用、单卡 F3 读时带全量溯源；未量化细节。\n- **跨页 fields 一致性验证**：设计确认 fields 不进查询指纹（只影响投影），但未做跨页实测边角；低成本补一条验证。\n- **F1 层 fields 静默忽略**：已修复（2026-08-16）——fields 加入 _F2_ONLY_FIELDS，F1 请求携带时 invalid_request，与 F1 拒绝其它 F2 过滤字段一致；新增测试锁定。\n- **active workcase 派生字段边界**：请求 fields 子集时 workcase 卡片仍恒含 work_item_counts（§9.1 派生字段），需在 spec 说明\"派生字段不受 fields 约束\"；已在 closed WorkCase 保留 follow_up。\n- **验证层**：聚焦回归 90-133 passed；全量 code/tests 801 passed、1 failed（js-yaml 环境依赖缺失，与实现无关，新增 YAML 已用 js-yaml 交叉验证通过）；Spark 门槛要求\"可比较真实任务\"摩擦证据，可把两个已关闭 WorkCase 的实际使用记录整理回本 Spark 支持后续判断。\n\n\n## 2026-08-17 会话摩擦复现（摘录控制真实任务证据成立）\n\n在一次真实盘点任务（判断本 Spark 是否仍有优化空间）中复现了摘录控制摩擦，满足 Spark 边界要求的\"可比较真实任务摩擦证据\"门槛：\n\n- 盘点目标只需 title/status/intent 判断，F2 卡片却强制带回 intent/summary 摘录（1973B，单卡 64%），summary 摘录 512 字符截断（complete=false）后看不全，反而要再开一次文件读取兜底。\n- 关联 WorkCase 反查（relation_targets 传 spark 的 fact_type_key+object_id）返回 total_matching=0，实际关联对象 relations 用 object_uid 指向；关系查询未命中，被迫退化为 ls + grep + read yaml 兜底。此为 Spark 此前未记录的新摩擦。\n- find-fact-object-candidates exact_refs 参数 3 轮试错：第1轮顶层字段报\"未知共同字段\"（须包 arguments）；第2轮 exact_refs 只传 object_id 报\"缺少 legacy 字段 fact_type_key/governed_project_id\"（三字段必全）；第3轮才成功。capabilities --example 骨架不含 exact_refs 完整形状。此为 Spark 此前未记录的新摩擦。\n\n结论：摘录控制的真实任务摩擦证据已成立，可作为窄 WorkCase 证据铺垫。source_refs 精简与关系反查失败同属盘点类摩擦，但前者证据更充分。\n\n\n\n## 2026-08-17 写回环节摩擦评估（写回链路读取过重——新方向）\n\n对本次 Spark 反写过程（update-fact-object）做事后评估，发现写回链路暴露了比读取环节更多、更重的新摩擦，均不在现有候选清单内：\n\n### 写回链路读取过重（新方向，当前候选清单未覆盖）\n\n一次 update 实际经历\"写前读 → 凑 after → capabilities 校验 → 写入 → 写后回读\"五步，其中三次读取都带了不必要重量：\n\n- 写前读（read-fact-objects 无 fields）：22.9KB，需 fingerprint+完整 fact_object 作 after 基础，无法安全投影；\n- 写前 capabilities 校验（capabilities update-fact-object --request）：约 67KB 全量，调用方只要\"请求能否过\"的结论，却被迫带回全量 operations（51.7KB）+ sources（11.5KB）；\n- 写后回读（read-fact-objects 无 fields）：22.9KB，实际只需 content_fingerprint + change_log 末条 + updated_at（<500B），因规范未明确精确回读是否允许 --fields 投影，保守用全量。\n\n三次读取总 payload 约 113KB，其中写后回读至少 19KB 为浪费。Spark 此前只记\"只读操作响应过重\"，未记\"写回触发的读取过重\"。\n\n### 契约形状试错在写入口同样存在（新摩擦）\n\nobserved_context 位置：第一次 update 失败（observed_context 解析失败：LDVH 署名必须是 object），因把 signature 塞进 fact_object.change_log 末条，而写入口要求 observed_context 放请求顶层与 arguments 同级。与 exact_refs 三字段试错同构——调用方第一次用某写入口时几乎必然试错。capabilities --example 骨架虽有正确形状，但调用方未先读 example 就凭 update-fact-object 的 example 凑，仍会错。\n\n### 精确回读的 --fields 边界模糊（规范边界，新方向）\n\nSpark §11.0 要求\"事实写入后的精确回读仍是必需步骤\"，但规范未说明回读是否允许 --fields 投影。若允许 --fields \"result.items.fact_object.change_log,result.items.fact_object.updated_at\"，写后回读可从 22.9KB 降至约 1KB；若不允许，写回链路读取过重为规范强制。这是规范与实现的边界模糊，需 spec 明确。\n\n### 只读环节补充发现\n\n- read-action-template-content 单模板 20.9KB，content 16.8KB 必要，但 sources 1.8KB + verification 831B 为固定 tax（2.6KB/次）；\n- read-action-template-candidates 全量 11.9KB，verification（4.1KB）比 result（2.8KB）还大；\n- --fields 投影返回嵌套结构（projection.response.result.items[0]...），小响应包装比高达 94%（title 24B + 包装 385B = 409B）；\n- capabilities --summary 从 67KB 降至 20.6KB，但 sources 仍 11.5KB（56%）未裁剪。\n\n### 候选方向更新\n\n写回链路读取过重（写前 capabilities 校验 67KB + 写后回读 22.9KB×2）是当前最大未被覆盖的优化方向，与精确回读 --fields 边界（规范边界）相关但不同：前者是\"读什么\"问题，后者是\"能否投影\"问题。两者如能同时解决，写回链路读取总 payload 可从约 113KB 降至约 1.5KB（-98.7%）。\n\n\n\n## 2026-08-17 近期更新覆盖评估\n\n将本次会话发现的全部摩擦与近期 commit 逐一比对，确认 6 个 commit 直接优化了部分摩擦，但覆盖不完整。\n\n### 已被近期更新优化的摩擦\n\n| 摩擦 | commit | 解决方式 | 覆盖 |\n|---|---|---|---|\n| capabilities 全量 67KB 不可定位 | 78b0ce92 --summary | 新增 --summary 中间档 67KB→20.6KB；invalid_request follow_up 自动填 response_fields | 部分：sources 仍 11.5KB(56%)未裁 |\n| --example 不含完整形状 | 78b0ce92 + ab6ae0a5 | --example 带 response_fields+result_contract；read-fact-objects 补 input_examples(UID+legacy 两种) | 部分：find-fact-object-candidates 的 exact_refs 三字段形状仍无 input_examples |\n| --fields 无法进入数组 | 1e303064 | _lookup_object_path 改为结构保持 _project_path，list 逐元素投影 | 已解决：实测降幅 87.9%-98.3% |\n| F2 卡片字段固定不可定制 | ecc07f8c | F2 支持 arguments.fields 定制 | 已解决（实测降幅仅 2%，大头是 excerpts） |\n| 署名 trailer 字面量 null | 9407aabc | _SIGNATURE_LITERAL_NULL_VALUES 拒绝 null/none/n/a，稳定码 signature_trailer_literal_null | 已解决（本次实测 LDVH-Model-Name: null 被拒） |\n| product_name 碰撞 governance_instance_name | 5e3cf699 | 管辖配置改用 governance_instance_name，共享碰撞闸门 | 已解决 |\n| observed_context 强制注入签名 | 7faa539e | 强制 observed_context 注入流水签名，拒绝空 observed | 部分：规范了注入，但 observed_context 顶层 vs fact_object 内的形状试错仍在 |\n| prepare-commit-msg 残留 status surface | e5ded375 | 删除退休的 prepare-commit-msg status surface 与识别模板 | 已解决（同类清理） |\n\n### 本次发现但近期未覆盖的摩擦（13 项）\n\n提交环节（7 项）：\n- precheck OSError 异常（内联 JSON 触发，换文件可绕过但无诊断）\n- precheck 缺 work_object_locators 试错（--example 仍只给 message 骨架）\n- precheck contract.checks 为空（issues 只在有错时报，通过时无逐项明细）\n- 长 message 须 JSON 转义，无 --message-file 入口\n- --no-verify 误用（行动模板有 Stop Condition #9 但无机械防止）\n- /tmp 临时文件未清理（行动模板有要求但无机械检查）\n- 提交后回读无单一入口，多 git 命令拼凑\n\n读取环节（3 项）：\n- excerpts 占 64% 强制返回（fact_candidate_operation.py L706-718 仍无条件生成）\n- relation_targets 反查关系失败（传 object_id 不命中 object_uid 指向，0 匹配）\n- sources/verification 固定 tax（每次只读无条件携带 2.6-4.1KB）\n\n写回环节（3 项）：\n- 写后回读全量 22.9KB（精确回读是否允许 --fields 边界模糊）\n- capabilities 校验返回全量 67KB（capabilities <op> --request 仍全量）\n- --fields 投影嵌套结构包装比 94%（小响应 projection.response.result.items[0]... 多层嵌套）\n\n### precheck-git-commit issues 机制实测发现\n\n本次实测发现 precheck 的 issues 列表在有错时是有内容的（staged 文件 + null trailer 测试返回 body_required/key_changes_required/signature_trailer_literal_null 三个具体 issue），但正式提交时因 message 合规返回 issues:[]（空）。说明 issues 是\"有错才报\"机制，不是\"逐项展示检查了什么\"。调用方无法从\"通过\"结论学习检查项，contract.checks 始终为空数组。\n\n### 覆盖评估结论\n\n近期更新确实优化了一部分摩擦（--fields 数组选择、F2 字段定制、--summary 发现入口、--example 形状补齐、null trailer 拒绝、署名碰撞防护均为真实有效改动），但本次发现的 21 项摩擦中仍有 13 项未覆盖，集中在三个方向：\n\n1. precheck-git-commit 自身入口摩擦（OSError、缺 work_object_locators、无 --message-file、checks 不透明）——最近一次改动 78b0ce92 只补了 response_fields，未碰入口形状和错误处理；\n2. 写回链路读取过重（写后回读全量、capabilities 校验返回全量、精确回读 --fields 边界模糊）——完全未覆盖；\n3. 盘点类摩擦（excerpts 强制返回、relation_targets 反查失败、sources/verification 固定 tax）——excerpts 有候选方向但未实施，其余未触及。\n\n最值得收敛的下一步：excerpts 控制已有设计+量化+真实任务证据（-65%，范围窄）；precheck 入口摩擦是新发现但证据充分；写回链路读取过重是最大未覆盖方向但需 spec 先明确精确回读 --fields 边界。\n\n## 待判断问题\n\n- 哪些只读 operation 的响应存在稳定过量或重复传输，导致 AI 调用成本上升；\n- fields 选择（含数组内字段）、compact profile 或批量读是否能在不改变完整性语义的前提下降低往返次数与 payload；\n- 变化的边际成本与收益是否支持实际实施。\n\n## 边界\n\n- 不依赖固定模型可比性、统计区间或 go/no-go 判断；\n- 不修改生产 Helper 公共契约（除非经窄 WorkCase 批准）；\n- 与受控写入优化独立，仅通过 related-to 关联追溯共同线索。"
