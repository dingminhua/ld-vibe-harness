type: change
title: 实现 ADR Tools 受控写入能力
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  ADR 主规范和 21.04-Tools.md 已将 ADR Tools 受控写入能力识别为完整支撑 ADR Skill 流程和对象模型落地初始化的关键能力。
  用户要求实现 ADR Tools 受控写入能力与测试。
decision: |
  扩展 `tools/adr_index.py`，在原有 list、search、status、show、stats、validate、related 只读和校验命令基础上，新增 next-id、draft、create、transition、link-rule、deprecate 和 supersede 命令。
  所有写入命令必须携带 `--human-gate-confirmed`、`--confirmed-by` 和 `--confirmation-context`，Tools 只执行已授权、可机械化、可校验的写入，不生成授权，不替代 ADR 准入判断、流程性判断或 Human Gate 编排。
  `create`、`transition`、`link-rule`、`deprecate` 和 `supersede` 支持在携带 `--write-change` 时生成 Change YAML 记录。
  更新 `tests/tools/test_adr_index.py`，覆盖写入授权、编号生成、草案生成、创建、非法状态流转阻止、合法状态流转、关联规则回写、废弃和推翻。
  更新 `specs/21.04-Tools.md`，将 ADR Tools active 状态同步为包含受控写入执行能力，并保留边界：不写 specs 或 Rules 正文，不替代 Human Gate。
consequences: |
  - ADR Tools 已具备 ADR YAML 创建、状态流转写入、关联规则回写、废弃写入、推翻写入、Change 记录生成和写入前校验能力。
  - 写入命令缺少 Human Gate 确认参数时会拒绝写入。
  - ADR Tools 仍不承担 ADR 准入判断，不生成授权，不直接写 specs 或 Rules 正文。
  - 后续 ADR 落地初始化可重新评估，但仍需 Human Gate 确认是否创建 `ldvh-base/adrs/` 目录或初始 ADR 实例。
affects:
  - tools/adr_index.py
  - tests/tools/test_adr_index.py
  - specs/21.04-Tools.md
related_rules:
