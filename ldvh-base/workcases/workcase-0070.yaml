title: 重跑 A 簇提示卡摩擦对照实验
status: open
goal: 在不预设正向结果且不修改生产契约的前提下，使用 WorkCase-0069 的可审计测量基础设施，对固定任务集执行本地 Helper 的 baseline/candidate 对照，判断提示卡是否仅呈现受正确性约束的方向性摩擦信号。
scope: 仅允许修改 code/ldvh/testing/ 与 code/tests/testing/。真实 trial 只能调用当前本地 Helper 的冻结只读 allowlist；任务包、提示卡、原始响应哈希、trial record、统计输入和范围 manifest 只能写入每批由 SafeTrialTempRoot 新建、经创建身份、realpath 与 lstat 校验的仓库外临时根。明确排除生产 Helper/调用入口/能力契约、规格、文档、配置、其它事实对象、Git、网络、依赖安装、WorkCase-0068/0069 更正及未登记的额外 trial。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 在任何真实调用前冻结并记录 12 个任务、condition-blind gold rubric、baseline prompt、candidate source-bound card、任务与提示哈希、模型/推理/权限、runner/schema/Helper/rule/capability fingerprints 以及随机种子和顺序；baseline/candidate 配对使用独立零历史上下文且除卡片外条件相同，任一指纹漂移中止该批次。
- criterion_id: criterion-02
  statement: 每个计划 trial 都形成完整严格 schema 终态 record，并自动采集调用分类、invalid_requests、原始响应 bytes、原始响应或转录 hash、monotonic duration、timeout/failure；schema、allowlist 或路径验证失败时 fail-closed，不形成合格 24-record run。
- criterion_id: criterion-03
  statement: 在冻结只读 allowlist 内完成 12 baseline 加 12 candidate trial，且所有任务材料、记录、统计输入和 before/after 范围 manifest 均只位于经验证的 SafeTrialTempRoot；未发生事实写入、任务包外操作或范围外文件变更。
- criterion_id: criterion-04
  statement: 预先定义 primary paired friction calculation、timeout/failure/missing-data 处置和“仅方向性信号”阈值；任何方向性表述必须同时满足 condition-blind correctness guardrail 与 terminal failure 不恶化，且不得声称统计显著性、因果证明或产品净收益。
- criterion_id: criterion-05
  statement: 独立复核者能够验证冻结哈希、重新生成或校验来源绑定卡、校验全部 records、从原始材料重算描述统计并单独核对范围 manifest；复核不得把随机 agent 重跑表述为相同结果或创建未登记的新批次。
