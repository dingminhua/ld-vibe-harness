title: HV1-HV5 下位承接与现状对齐
status: closed
goal: 以 commit f7188e00e 已生效的 specs/00 为唯一上位基线，使当前仍重述价值边界、直接承载 Human 价值或仍使用旧 H1-H6 的下位规范、术语、公开入口、Web 设计文档和 spark-0037 当前状态获得最小充分、一致、可验证的承接；明确保留 HV4「积累效用直观可见」尚未充分实现的能力缺口，不把文案对齐冒充产品能力完成。
scope: 纳入 specs/01、specs/attachments/01.Att.01、specs/05、specs/08 的直接矛盾或缺口；审计 specs/03、06、07、20–24、30–34，并只对被证明确需承接 HV1-HV5 的段落作最小修改；纳入 README、web/docs/02-CognitionCenter.md 及经直接依赖审计确认必要的相邻 Web 文档、i18n 或契约测试，但 README 可正常隔离执行，当前 dirty 的 web/docs/01、02、05、10 与 web/tests/api/web-design-consistency-contract.test.ts 必须先由原工作线独立提交且相对新 HEAD clean 后才能编辑；通过 Helper 更新 spark-0037 的当前摘要与 evolution，记录 2026-07-29 旧策略已被 Human 本次决定取代、HV1-HV5 已在 f7188e00e 生效、HV4 仍待加强，并保持 status=open；包含必要测试、回读、diff 检查和只含本案改动的本地 Git commit。排除再次修改 specs/00、新增或实现 Web 模块/指标/仪表盘/HV4 产品机制、修改事实 schema/lifecycle/Helper 行为、重写历史 study-0017、修改 specs/25/FileAsset 提案/环境接入报告等并行工作线、覆盖或夹带现有无关 dirty 改动，以及 push、PR、发布或其它外部动作。
success_criterion_definitions:
- criterion_id: criterion-value-boundary
  statement: 当前下位规范不再以“只允许 V1-V8”否定直接 Human 价值；统一按实际服务对象选择 V1-V8、HV1-HV5 或分别成立，同时主要服务 AI 的规则未被机械追加无依据的 HV 声明。
- criterion_id: criterion-terminology
  statement: 双语术语表登记 HV1-HV5 / Human Value Criteria，引用 specs/00 当前标题与编号；不存在由本次变更造成的旧标题、旧编号或当前术语悬空。
- criterion_id: criterion-carrier-boundary
  statement: 直接价值载体的规范映射与能力边界准确，HV4 被明确写为待加强能力而非现有完成项，且事实类型 schema、生命周期与 Helper 行为没有因本案改变。
- criterion_id: criterion-public-web
  statement: 在既有 Web dirty 改动先由原工作线独立提交并形成 clean 新基线后，README 与 Web 设计层使用 HV1-HV5 和 specs/00 当前来源，现行旧 H1-H6 声明得到清理；派生只读、来源边界与“文档对齐不等于能力实现”保持清楚，历史 study-0017 与 spark-0037 既有 evolution 不作为清理目标。
- criterion_id: criterion-fact-history
  statement: spark-0037 经 Helper 回读为 mechanically_valid，当前结论、决定取代关系、commit f7188e00e 与 HV4 缺口可查；既有历史内容保留、status 保持 open，study-0017 相对执行前 HEAD 无差异。
- criterion_id: criterion-validation-isolation
  statement: 相关 specs tests、触及 Web 时的契约测试、git diff --check 与 Helper 回读通过；specs/00 不产生本案差异，提交只包含可归属于本案的 hunks，现有无关 dirty 或 staged 内容不进入提交。
