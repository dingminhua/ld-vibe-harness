title: ZCode 插件 Hook 注册后需在环境设置中启用/信任才能实时触发
status: active
applicability: 适用于通过 filesystem 方式在 ZCode 中安装 LDVH 插件的场景：插件已部署到用户级插件目录、Hook 已注册、data 文件完整、手动脚本可执行，但新会话未触发实时 Hook。它不说明通过 ZCode 官方插件市场分发、或其他 AI 环境（如 Trae CN、Codex、Cursor）的信任机制，也不适用于无法通过环境设置手动启用/信任插件的场景。
validation_summary: |-
  2026-07-26 在 ZCode 完成两轮验证的对比：

  第一次安装（2026-07-24）：
  - 资产完整性：初始失败（data 目录缺 ldvh.json），后补全
  - 可执行性：手动脚本可返回 work-context
  - 实时触发：未通过，已注册 Hook 但无 hook_run_started/hook_run_completed
  - 结论：误以为 data 补全即可修复，未检查环境设置中 Hook 信任状态

  第二次重装（2026-07-26）：
  - 按 README 指引完成安装后，先在 ZCode 设置中确认插件已启用、Hook 已被信任
  - 启动新的 cold startup 会话
  - 实时触发：通过，启动日志中出现 hook_run_started/hook_run_completed，执行目录有对应产物
  - 完整接入声明：SessionStart 已 verified

  对比两轮结果，确认第一次失败的根因是：Hook 已注册但未在 ZCode 设置中被信任/允许执行，而非 Data 文件完整性问题。
symptoms: "1. 插件已部署到用户级插件目录，~/.zcode/plugins/ 中有完整文件结构\n2. 启动日志中报告 hookCount:1，证明 Hook 已注册\n3. data 文件（ldvh.json）完整，手动执行 hook 脚本可返回 work-context\n4. 新会话中没有 hook_run_started/hook_run_completed 记录\n5. 执行目录为空，无 Hook 执行产物\n6. 会话中可能出现 work-context，但来自 hydrate 恢复而非实时触发"
trigger_conditions: "1. 通过 filesystem 方式部署 ZCode 插件，插件 manifest 声明了 SessionStart Hook\n2. 插件文件已安装到正确目录，enabledPlugins 已启用\n3. 验证者只检查了文件存在、Hook 注册日志和手动脚本可执行性\n4. 未检查 ZCode 设置中该插件的 Hook 是否已被信任/允许执行\n5. 目标环境（ZCode）将插件部署和 Hook 信任分离为两个独立步骤"
root_cause: "失败机制是把文件安装和 Hook 注册等同于实时触发授权：\n\n1. ZCode（以及多数 AI 开发环境）将插件安装和 Hook 执行权限分离——文件安装只证明资产到位，Hook 注册只证明环境知道该 Hook 存在，两者都不等于环境已授予该 Hook 实时执行权限\n2. 需要在 ZCode 设置中显式启用/信任该插件的 Hook，环境才会在生命周期事件中调度它\n3. 容易误判：因为手动执行 hook 脚本可以成功，就认为环境事件也会自动调用它\n4. 验证层级的混淆：把资产完整性（第 1 层）和可执行性（第 2 层）的证据错误地当作实时触发（第 3 层）的证据"
resolution: "1. 安装完成后，去 ZCode 设置中找到 LDVH 插件，确认其 SessionStart Hook 已被信任/允许执行\n2. 关闭当前会话，启动一次新的 cold startup 会话（非 hydrate/恢复）\n3. 检查启动日志中是否有 hook_run_started 和 hook_run_completed 记录\n4. 检查执行目录中是否有对应的 Hook 执行产物\n5. 确认会话中的 work-context 与本次实时执行记录对应\n6. 只有上述全部通过，才能确认 Hook 已实时生效\n\n该方法已在 2026-07-26 的第二次安装中验证通过。"
avoidance: |-
  后续在 ZCode 或其他 AI 环境中排查 Hook 不触发问题时：

  1. 首先区分四个证据层级：资产完整性 → Hook 注册 → 手动可执行性 → 实时触发，不能以低层级证据证明高层级结论
  2. 安装完成后将"去环境设置中启用/信任 Hook"列为强制步骤，而非可选
  3. 验证实时触发时，必须使用新 cold startup 会话，不能使用 hydrate 恢复的会话
  4. 如果实时触发仍不通过，检查环境设置中是否有额外的安全策略、权限开关或信任白名单
  5. 本经验应在环境接入规范（specs/33）的安装后操作步骤中体现
