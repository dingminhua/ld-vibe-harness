status: closed
title: 为 AI 提供高频显式规范与事实检查入口
goal: 交付低成本、显式且可高频调用的 LDVH 检查命令，使 AI 在处理当前规范源或当前 worktree 的管辖事实源后立即获得可消费的机械检查反馈；保留现有精确回读、事实完整性审计与 Git Gate，不实现常驻 watcher。
scope: 只新增 ldvh check 所必需的公开合同/接口说明、LDVH CLI 或 Helper 实现、测试，以及 Study 0029 的受控方向更新。命令在实际 worktree 中解析当前规则源和完整管辖事实源，分别运行来源定义的机械检查，并结构化报告各子检查原始结果、gaps、实际规则源范围、完整事实源范围及未覆盖或不可用范围。普通业务代码、构建产物、临时文件不进入输入。默认调用一次性、只读、无 watcher、无轮询、无后台驻留、无 Web/build/全仓测试；它不替代事实写后的精确回读或完整性审计，也不变更 Git Hook/Gate。
success_criterion_definitions:
- criterion_id: criterion-check-contract
  statement: ldvh check 在实际 worktree 中解析并报告当前规则源与完整管辖事实源，调用相应既有机械检查，并输出机器可消费的范围和子结果。
- criterion_id: criterion-result-semantics
  statement: 公开合同逐项保留全部下游结果和 gaps，并明确可回指的阻断 gap 判定；子检查失败、partial、unavailable 或合同定义的阻断 gap 时，组合结果不得声称 passed。
- criterion_id: criterion-low-cost-boundary
  statement: 默认 ldvh check 保持一次性只读：不启动 watcher、轮询或后台进程，不扫描普通业务或临时文件，不触发全量构建或测试；不改变精确回读、事实完整性审计和 Git Gate 的职责。
- criterion_id: criterion-regression-evidence
  statement: 定向测试覆盖成功、失败/partial/unavailable、范围报告、业务或临时文件不影响输入及 linked worktree；交付时完成风险匹配验证和完整测试计划。
- criterion_id: criterion-study-alignment
  statement: Study 0029 的首期建议调整为高频显式 check，watcher 仅保留为可选后续增强，且不创建 ADR。
success_criterion_results:
- criterion_id: criterion-check-contract
  outcome: satisfied
  summary: 真实 ./ldvh check 在当前 result-validation worktree 解析并报告当前规则源与完整管辖事实库，保留两个子检查及其范围、verification 与 gaps；组合结果 status=passed。
- criterion_id: criterion-result-semantics
  outcome: satisfied
  summary: 实现逐项保留规则与事实下游结果、顶层 gaps 和 diagnostics，并以未完成范围交集判定阻断；facts partial/unavailable/error 不会被另一子检查掩盖为 passed。
- criterion_id: criterion-low-cost-boundary
  outcome: satisfied
  summary: 真实入口为一次性只读调用；实现未启动 watcher、轮询或后台进程，输入范围固定为当前规则源与当前 worktree 完整事实库，不扫描普通业务、构建产物或临时文件，也未修改 Git Hook/Gate。
- criterion_id: criterion-regression-evidence
  outcome: satisfied
  summary: 定向操作、CLI、事实完整性与 Ruff 验证通过；独立复核确认覆盖成功、partial/unavailable、范围排除、linked worktree，并实际复跑全仓 1625 passed、17 skipped、0 failed。
- criterion_id: criterion-study-alignment
  outcome: satisfied
  summary: Study 0029 已受控对齐为首期显式 ldvh check，不建 ADR、不实现 watcher，watcher 仅保留为后续可选研究。
result_summary: 已交付一次性只读的 ldvh check：当前源码 worktree 可通过稳定入口检查当前规则源与完整管辖事实库，结构化保留规则/事实子报告、范围、gaps、diagnostics 与阻断语义；Study 0029 已同步首期显式检查方向。
validation_summary: 真实 ./ldvh check：outcome=ok、result.status=passed；规则与事实两个 verification 均 passed，facts status=complete、object_count=210、problems=[]，顶层保留 2 个非阻断资格 gaps。定向新增操作测试 5 passed，相关 CLI/Helper/事实完整性测试与 Ruff passed；全仓测试 1625 passed、17 skipped、0 failed。git diff --check passed。未验证真实外部环境、watcher、Git Hook/Gate 事件、Web/build 与远端发布；均不在本 WorkCase 执行范围。
