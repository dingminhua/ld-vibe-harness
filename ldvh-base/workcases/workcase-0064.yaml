title: 简化 macOS POSIX 原子写入结果模型与耐久策略，保留事实安全内核
goal: 在不削弱原子发布、no-overwrite、CAS、路径安全、异常后命名空间回读和写后验证的前提下，简化 POSIX 原子写入的内部结果模型与上层消费逻辑，使 macOS 路径不再承担无实际决策价值的状态组合和缺少规范依据的 durability 领域准入策略。
scope: 承接 spark-0062。含：更新 Code Implementation Plan；保留同目录临时文件、文件 fsync、原子发布、目录 fsync best-effort、dir_fd/O_NOFOLLOW、no-overwrite、CAS、写后回读及异常后的 namespace reconciliation；把 AtomicWriteResult 重构为受约束结果形状；上层仅按提交状态、操作语义和冲突决策，sync/cleanup 继续作为诊断证据；移除或隔离缺少规范依据的 durability 领域准入策略；补测试、macOS 验证、独立结果复核和本地受控提交。不含：修改 Specs；删除安全原语；改变 Windows 行为；修改 Spark 状态；push、PR、发布。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: Code Implementation Plan 明确记录安全内核、简化目标、平台边界和验证方案，并说明不修改 Specs、不改变 Windows 行为。
- criterion_id: criterion-02
  statement: POSIX 原子写入继续保留同目录临时文件、文件 fsync、原子发布、directory fsync best-effort、dir_fd/O_NOFOLLOW、no-overwrite、CAS、写后回读和异常后的 namespace reconciliation，测试证明未被弱化。
- criterion_id: criterion-03
  statement: 内部结果采用受约束的 committed、not_committed、uncertain 形状或等价模型，不再允许四个独立维度任意组合形成不可达或无意义状态。
- criterion_id: criterion-04
  statement: 上层只以提交状态、操作语义和冲突决定业务结果；sync scope 与 cleanup residue 不再充当业务准入条件，但仍在 diagnostics、verification 或 gaps 中可观察且可测试。
- criterion_id: criterion-05
  statement: durable_writes_enabled 或等价的 os.name == posix 判断不再定义事实写入的领域允许语义，本次不得改变 Windows 写入行为。
- criterion_id: criterion-06
  statement: 受影响的 filesystem、Helper 与事实操作测试通过，并在 macOS 验证创建、替换、冲突、目录同步失败、清理残留和 replace 异常后 reconciliation 等关键路径。
- criterion_id: criterion-07
  statement: 完整结果经只读独立复核确认与 00 一致；本地提交仅含授权范围内的计划、实现与测试变更并通过提交前机械预检。
