success_criterion_definitions:
- criterion_id: criterion-01
  statement: 02 明确定义项目外 workspace 根仍为
    non_governed，与可交还的登记项目候选是不同结论。候选仅来自有效配置登记和现场 Git identity
    并确定性去重、排序；仅在新来源明确允许的唯一机械条件成立时形成 selected binding，零个或多个候选、配置无效、身份或来源不完整一律
    unresolved，并给出候选证据和 Human 决策需求；不得枚举任意子目录、猜测或把 workspace 根改写为 governed。
- criterion_id: criterion-02
  statement: 对唯一已解析项目完整分页读取全部 open/blocked WorkCase F1，并校验查询、对象集与 cursor
    连续性。只有环境或上层明确提供精确 current_workcase_ref 时才声明当前绑定并展开 F3；没有精确绑定时，唯一对象最多作为 sole
    mechanical candidate 展开且 current_binding=unresolved。零个或多个候选、partial、cursor
    失效、无效或不可读对象、预算中断均 unresolved，coverage 未完整时不得把已返回卡片解释为全量。不得按标题、Git
    dirty、priority 或数组顺序裁决。候选投影 status、phase、summary、resume_from、waiting_on，以及
    active_items[] 中全部 in_progress/blocked item 的 item_id、status、goal 和实际存在的
    current_summary、resume_from、blocking_summary、evidence locator，按 item_id
    排序；不得补造 evidence 或推断唯一焦点。
- criterion_id: criterion-03
  statement: 对两个固定回归 fixture，以完整 Codex additionalContext 的 UTF-8 bytes
    计，新有界输出分别不超过 13,915 bytes 和 4,830 bytes，即不超过当前 27,831 与 9,660 bytes 原样输出基线的
    50%；测试包含 adapter 固定前缀和共享投影，并隔离时间戳、临时路径长度等非目标波动。同时完整保留实际
    operation、outcome、scope/coverage、来源 locator、gap/diagnostic 摘要、binding
    状态和按需展开入口，不内联完整 Helper JSON、事实对象或规则全文。fixture 或必保字段改变需要调整阈值时必须递增
    plan_version、重审并重新进入 Human Gate。
- criterion_id: criterion-04
  statement: bounded recovery projection、内部 binding 状态与按需展开入口由共享 Code 实现拥有，不新增
    Helper 公开操作、事实字段或规则副本；adapter 只验证和传递 Codex 实际 payload
    与共享投影，不重新解释项目、WorkCase、coverage 或错误，不复制规则、Schema 或状态机。startup/resume
    的成功、部分、歧义、失败和不可用映射忠实；clear/compact/SubagentStart 的 contract/packaging
    防回归成立但不扩大真实验证结论，内部接口兼容性与配置版本变化据实处理。
- criterion_id: criterion-05
  statement: 规则、共享实现、adapter、packaging 正反与边界测试及 full-v4 通过。当前 Codex 只读基线记录为
    0.145.0-alpha.18；写入前重新读取版本、安装路径、配置与插件、LDVH 管理对象、未知用户资产和回滚方向，按 33
    形成精确安装计划并单独进入 09 Human Gate。只有 Human 批准该精确环境、对象和副作用后才升级并取得 startup/resume
    成功、歧义、主要失败及停用/恢复真实证据；README 最终声明只绑定实际重新验证的 macOS、用户、Codex 版本与事件，0.144.2
