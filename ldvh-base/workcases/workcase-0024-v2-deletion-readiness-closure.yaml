id: workcase-0024
type: workcase
title: V2 删除准备度收口
goal: |
  在准备删除本地 V2 前，完成 LDVH V3 的删除准备度收口：清除 active specs、事实对象和实现域文档中仍把本地 V2 当作后续迁移来源、稳定运行线或整体切换前提的活依赖，并建立可复查的验证检查，确保 V2 删除后 V3 主线仍自足。

  本 WorkCase 不以“继续迁移更多 V2 内容”为默认目标，而是逐项判断现有 V2 活引用应归入已迁入、不迁入或转为 V3 自身待办。Git history 仅作为审计追溯、争议复核或历史取证的备份渠道，不作为活依赖收口方式。只有仍支撑当前 V3 规则成立、Code 消费或事实对象关闭判断的内容，才进入 V3 正式规范或事实对象。
status: human_plan_confirming
created: '2026-07-07T12:48:59+08:00'
updated: '2026-07-07T13:11:20+08:00'
priority: P0
description: |
  Human 指出：既然迁移模板预期是迁移完成后 V2 准备删除，那么当前 V3 中仍存在“后续从 V2 筛选 / 判断 / 迁入”的待补齐事项就需要重新审核。

  2026-07-07 已完成三路只读审计：
  - specs/attachments 审计结论：不具备删除准备度；P0 阻断集中在 `specs/03`、`specs/05`、`specs/06` 仍把 V2 附件或行动成员写成后续筛选来源。
  - Code/tests/runtime 审计结论：通过；未发现删除本地 V2 会坏掉的活依赖，旧路径主要是 stale path 检测和测试 fixture。
  - README/事实对象/实现域文档审计结论：不具备删除准备度；`spark-0039` 和 `workcase-0022` 仍以未关闭状态保留“v2 继续稳定服务 / 待整体迁移”的活承诺。

  本 WorkCase 用于承接后续逐步修补，不替代具体 specs 修改、事实对象关闭、测试或最终删除决策。
success_criteria: |
  - [ ] `specs/03-事实源与Git溯源规范.md` 不再把本地 V2 `07.Att.*` 写成后续筛选来源；commit type/scope/body 已迁入部分、非事实源排除清单、过程输出回写、读取策略等逐项判定为已迁入、不迁入或 V3 后续待办。
  - [ ] `specs/05-事实模型基础规范.md` 不再把本地 V2 `02.Att.*`、20-24 成员文件或 WorkCase orchestration 长表写成活迁移来源；已由 `05.Att.01`、`21.Att.01`、20-24 成员规范、Code/tests schema 承接的内容完成收口。
  - [ ] `specs/06-行动模板基础规范.md` 不再写“后续从 V2 30-36 和 WorkCase 流程筛选”；候选行动模板改为 V3 自身候选清单、明确后续 WorkCase 或明确不迁入。
  - [ ] `specs/07`、20/22/23/24、21 的过期待补齐事项完成清理，避免未来 AI 误以为仍需回本地 V2 做字段或实现来源判断。
  - [ ] `spark-0039` 和 `workcase-0022` 的旧路线活承诺被关闭、废弃或改写为历史背景；不再以 pending / open 状态要求 V2 继续稳定服务或等待整体迁移。
  - [ ] README、code/docs 和实现域保留必要 stale V2 path 检测，但不把旧 V2 路径、旧插件或旧运行线写成当前依赖。
  - [ ] 新增或更新 Code/tests 检查，阻止 active specs 再出现“后续从本地 V2 筛选 / 判断 / 迁入”的活依赖句式，并阻止把 Git history 写成未迁内容承接或验收出口；允许 `migration_sources: v2:...`、历史审计语境和 stale path 检测。
  - [ ] 最终验证包含 specs validation、相关 targeted tests、子 agent 复审和工作区 clean 检查。
