id: workcase-0002
type: workcase
title: 管辖项目事实对象语义边增强
goal: |
  在已排除历史图谱、Git 图谱、Web 短期实现和 Human 自然查询体验之后，增强管辖项目事实对象之间的语义关系密度、一致性校验和任务导航中的语义边可见性。
status: human_closure_confirming
created: '2026-06-24T08:46:30+08:00'
updated: '2026-06-24T09:12:00+08:00'
priority: P1
description: |
  当前知识地图的 Code 侧核心形态已经成立：active specs、runtime extensions、governed_projects、entry_navigation、raw 片段和 read_plan 均可用；历史图谱、Git 图谱、Web 短期实现和 Human 自然查询体验已明确不作为当前推进目标。

  剩余主要缺口集中在管辖项目事实对象之间的语义关系质量：entry 层为了渐进式读取会呈现较多 `related`，具体对象邻接/展开层已经能看到 `consumes`、`validates` 等语义边，但事实对象字段使用、关系一致性诊断和任务导航摘要中的语义边可见性仍需增强。

  Human 已确认执行。本 WorkCase 按审核约束完成规范口径、Code 摘要和只读 review hints、测试夹具验证与校验闭环；未为了图谱密度改写真实事实对象的状态、关闭字段或收敛字段。
success_criteria: |
  - [x] 明确管辖项目事实对象字段到知识地图关系类型的最小语义口径，至少覆盖 `input_refs`、`depends_on`、`blocked_by`、`evidence_refs`、`verification_refs`、`resolved_to`、`related_*` 和 `source_*`。
  - [x] Code 增加或增强关系质量诊断，能提示“应使用语义边却只留下弱关联”的对象级缺口，且诊断输出不写入缓存或事实源。
  - [x] 知识地图任务导航或 `impact_summary` 能提示语义边分布，使 entry 层不展开全量语义边时也不误导为“只有 related”。
  - [x] 选择小样本事实对象进行最小修复或验证夹具覆盖，优先考虑 `workcase-0001`、`spark-0016` 和 `study-0006`，不进行全量补字段运动。
  - [x] 通过工作对象事实源校验、知识地图相关 Code 测试、active specs 诊断和必要的格式检查。
source: |
  用户在 2026-06-24 询问：在已排除历史图谱、Git 图谱、Web 短期实现和 Human 自然查询体验之后，当前知识地图剩余主要推进点“增强管辖项目事实对象之间的语义关系密度、一致性校验和任务导航中的语义边可见性”应如何推进、要做什么。

  主控 AI 给出分阶段建议：先定义关系语义，再增加 Code 诊断，再做小样本事实对象修复，最后增强任务导航中的语义边可见性。用户要求建立 WorkCase，走审核流程，并在执行前让 Human 确认。
orchestration:
  mode: sequential
  execution_items:
  - id: item-1
    title: 定义事实对象语义边口径
    role: specs
    mode: single
    input_refs:
    - specs/01-规范体系基础规范.md
    - specs/04-Code确定性执行规范.md
    - specs/attachments/01.Att.01-知识地图关系类型表.md
    - specs/attachments/04.Att.05-知识地图输入范围表.md
    - specs/attachments/04.Att.06-知识地图投影Schema表.md
    - specs/21-WorkCase-工作项.md
    - specs/20-Spark-火花.md
    - specs/24-Study-研究报告.md
    expected_output: |
      明确字段到关系类型的最小映射和边界：`related_*` 只表达弱关联，不能替代 `consumes`、`validates`、`impacts` 或 `derives_from`。
    status: done
    result_summary: |
      已在 01.Att.01 补充管辖项目事实对象字段到知识地图关系类型的最小语义口径，明确 `related_*` 只表达弱关联，不能替代 `consumes`、`validates`、`impacts` 或 `derives_from`；已在 04.Att.06 同步语义边摘要字段。
    evidence_refs:
    - specs/attachments/01.Att.01-知识地图关系类型表.md
    - specs/attachments/04.Att.06-知识地图投影Schema表.md
    blocking_reason: null
  - id: item-2
    title: 增加关系质量诊断和语义边摘要
    role: code
    mode: single
    input_refs:
    - code/spec_checks/knowledge_map.py
    - code/spec_checks/v2.py
    - code/specs_validate.py
    - tests/code/specs_validate_checks/test_v2.py
    expected_output: |
      Code 能报告管辖项目事实对象关系语义缺口，并在知识地图输出中呈现语义边分布或等价摘要；诊断只作为当次输出，不写入事实源。
    status: done
    result_summary: |
      已增强 Code 实时投影：`impact_summary` 增加当前投影语义边计数和被渐进层级省略的语义边计数；文本输出展示这两个摘要；管辖项目事实对象输出只读 review hints，提示弱关联和语义字段重复表达、以及具体 start_node 上仅有弱关联的潜在升级点。未写入缓存或事实源。
    evidence_refs:
    - code/spec_checks/knowledge_map.py
    - code/spec_checks/v2.py
    - tests/code/specs_validate_checks/test_v2.py
    blocking_reason: null
  - id: item-3
    title: 小样本事实对象关系修复或夹具验证
    role: facts
    mode: single
    input_refs:
    - ldvh-base/workcases/workcase-0001-knowledge-map-entry-navigation.yaml
    - ldvh-base/sparks/spark-0016-kg-best-practice-ldvh-review.yaml
    - ldvh-base/studies/study-0006-ldvh-kg-practice-review.md
    expected_output: |
      只对少量代表性对象或测试夹具做最小修复，验证 `consumes`、`validates`、`impacts` 等语义边能被稳定投影；不得进行全量批量改写。
    status: done
    result_summary: |
      按审核约束选择测试夹具覆盖小样本语义关系：夹具验证跨管辖项目命名空间、`input_refs -> consumes`、同一目标的 `related_*`/语义字段重复提示、entry 层省略语义边摘要和 neighbors/raw 层语义边可见性。未修改 `workcase-0001`、`spark-0016` 或 `study-0006` 的状态、`resolved_to`、关闭字段或归档字段。
    evidence_refs:
    - tests/code/specs_validate_checks/test_v2.py
    blocking_reason: null
  - id: item-4
    title: 验证闭环和关闭材料准备
    role: verification
    mode: single
    input_refs:
    - code/fact_validate.py
    - code/specs_validate.py
    - tests/code/
    - specs/07-事实源边界与Git追溯规范.md
    expected_output: |
      运行必要验证，记录验证证据、残留风险和 Git 追溯要求；准备结果自检与后续关闭材料。
    status: done
    result_summary: |
      已完成定向测试、active specs 检查、entry_navigation 检查、WorkCase 事实源校验、综合 specs 校验、固定运行时扩展检查、能力资产环境矩阵检查和 `git diff --check`。所有已执行校验均通过。
    evidence_refs:
    - code/fact_validate.py
    - code/specs_validate.py
    - tests/code/specs_validate_checks/test_v2.py
    blocking_reason: null
  plan_review:
    orchestration_owner: main_controller
    workflow_ref: null
    review_policy:
      selection_reason: |
        本方案会影响事实对象字段语义、知识地图关系质量诊断、Code 输出摘要和少量事实对象样本写入，需要在执行前从规范语义、Code 实现、事实对象治理和 AI 任务导航四个视角审核。
      required_perspectives:
      - 规范语义边界
      - Code 诊断实现
      - 事实对象治理
      - AI 任务导航可用性
      optional_perspectives: []
      tool_method_requirements:
      - 只读分析当前仓库，不修改文件。
      - 检查方案是否符合实时投影、无缓存、渐进式读取、项目命名空间和 Git 原生追溯边界。
      - 判断执行项是否足够小，是否存在必须先由 Human 裁决的范围或事实源风险。
      aggregation_rule: |
        若任一视角给出 fail 或 needs_human_gate，主控不得提交执行确认，必须先修改方案或列出需要 Human 裁决的问题。若均为 pass 或 pass_with_followups，主控可吸收 follow-up 并进入 human_plan_confirming，等待 Human 执行前确认。
    review_items:
    - id: plan-review-1
      role: 规范语义边界
      agent_name: Faraday
      requested_at: '2026-06-24T08:50:00+08:00'
      prompt_context:
        objective: |
