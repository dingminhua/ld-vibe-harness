status: closed
title: WorkCase 独立复核跨环境能力路由落地
goal: 将 spark-0065 已澄清的能力解锁、三档 Reviewer 路由、Human 模型选择冻结、每轮视角上限与版本化重复复审机制，固化为可执行、可校验并可正确呈现的 WorkCase 规则与实现。
scope: 包含：修订 specs/21、31、34 及必要附件和字段登记；实现 code/ldvh/facts、范围匹配 Helper/投影及 Python 测试；实现 Web API、shared 类型、列表/详情中英文呈现及 Web 测试；完成目标回归、事实完整性检查与一次 current Working Tree full-v4。明确区分瞬时入口 permission/preflight 与持久 reviewer policy/review event，定义 collaboration Worker → native subagent → same-AI 的 1→2→3 路由、每轮最多 3 个视角及 PlanΔ/ResultΔ fresh review。排除：Git commit/push、插件部署、外部网络与包安装、倒写 closed WC0066、修改其它 WorkCase/Spark、清理/覆盖/stage/restore 无关 dirty changes。当前重叠 Web 文件只允许逐文件保留 baseline diff 后做局部增量；无法安全合并即停止 item-3。
success_criterion_definitions:
- criterion_id: criterion-1
  statement: 当前规则源一致定义入口 Human 显式启用门槛、解锁后重新探测、collaboration Worker → native subagent → same-AI 的 1→2→3 路由，以及 permission_required/not_authorized/unknown 与 unavailable 的区别；能力解锁和模型询问均不成为第三个 Human Gate，方案侧与结果侧两个固定位置允许不限轮次的 fresh review。
- criterion_id: criterion-2
  statement: 最小充分持久模型已定义并登记：Gate 1 reviewer policy 冻结 Human-selected model、mapped collaboration agent、effort/fast、preferred method、fallback order、每轮视角上限、activation 与 same-AI 限制边界；实际 review event 据实记录 actual method/agent/model/evidence，并定义出现条件、fingerprint、PlanΔ/ResultΔ 失效和跨会话重新解锁边界。
- criterion_id: criterion-3
  statement: Code/Helper 对新形状完成 Schema、projection、transition 与 fingerprint 支持，同时保持现有 mechanically valid WorkCase 兼容；permission_required/not_authorized/unknown 被误写为 unavailable 或误触发 fallback、未按 collaboration Worker → native subagent → same-AI 顺序探测、每轮超过 3 个视角、方法与条件字段不匹配、版本变化后复用旧 review 等非法组合被机械拒绝并由正反测试覆盖。
- criterion_id: criterion-4
  statement: Web API 与中英文列表/详情分层呈现冻结 reviewer policy 和实际 review event 的 agent/model/method/evidence/assurance gap；缺失或 unknown 不默认显示为 unavailable，policy/quality gate 不被显示为已实际独立复核。
- criterion_id: criterion-5
  statement: 范围匹配的 specs、Python、Web 目标测试与 git diff --check 通过，且同一实际 worktree 的 check-fact-integrity 外层 outcome=ok、result.status=complete。
- criterion_id: criterion-6
  statement: 一次绑定最终 current Working Tree 的 full-v4 运行 final status=passed；该结果只证明合并 Working Tree，不冒充对本 WC 变更的单独归因。
