  当前 04.06 正文已实质承担 Trae Work CN、Codex App、Claude Code CLI 三环境承接矩阵入口，但矩阵字段、证据来源、04.07/04.08 迁移、Claude Code CLI refs、42 消费口径和 Code 校验尚未闭合。

