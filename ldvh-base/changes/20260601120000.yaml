type: change
title: 术语体系统一与模型子文档规范提取
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  1. ADR 事实模型落地初始化后，主模型经历了两次实质性变更（Human Gate 强化、规则层级从 L2 提升至 L0），
     但未重新走落地前决策流程。落地初始化清单第 8 项（Tools 校验覆盖）未达标。
  2. adr_index.py 在没有契约子文档的情况下创建，字段名与主模型不契合（adr_id vs id），
     自行扩张了非规范字段（supersedes），遗漏了 rejected 状态，缺少校验功能。
  3. 13 §4.6 和 14 §4.6 的子文档通用规则 90%+ 逐字相同，存在重复维护问题。
  4. 13 叫"生产对象基础规范"、14 叫"行动模型基础规范"，命名不对称，
     14 §4.1 出现"行动模型模型"冗余表述。
decision: |
  1. 创建 specs/04-LDVH模型子文档规范.md，提取 13/14 共享的子文档通用规则
  2. 将"生产对象"全面重命名为"事实模型"，实现与"行动模型"的命名对称
  3. 13 重命名为 13-LDVH事实模型基础规范.md，13/14 §4.6 通用内容改为引用 04
  4. 14 §4.1 消除"行动模型模型"冗余
  5. 创建 specs/21.06-Contract.md，定义 ADR YAML schema
  6. 修正 tools/adr_index.py，对齐 21.06 契约
  7. 更新 01 编号分区表（04 从保留变为已占用，20-49 从"生产对象规范"改为"事实模型规范"）
consequences: |
  - 术语体系统一：事实模型 vs 行动模型，完全对称
  - 子文档通用规则单一事实源：04 是权威位置，13/14 引用 04
  - ADR 契约子文档为工具实现提供字段 schema 依据
  - adr_index.py 字段名、状态覆盖、校验功能与主模型对齐
