      expected_output: |
        将事实模型成员、Rules 同步和环境适配中的 `degraded_accepted`、长期降级、记录降级、环境适配降级、Rules 降级提示等语义迁移为取消/部分完成、Human Gate + ADR、Spark/WorkCase/ADR/Pitfall 分流、环境入口缺口、工具不可用报告、权威回读和后续分流。`specs/32` 当前不是 active 权威来源，清理时需标明其状态边界。
      status: done
      result_summary: |
        已迁移 20-24、30、31、32：事实模型成员的未接管场景改为临时核对动作；WorkCase 关闭结果不再推荐 `degraded_accepted`，目标未达成走 `cancelled` 或 `partial_completed`，长期风险接受回到 Human Gate + ADR；Rules 同步和环境入口候选改为问题原因、缺口提示、原文回读、待确认和后续分流。
      evidence_refs:
        - specs/20-Spark-火花.md
        - specs/21-WorkCase-工作项.md
        - specs/22-ADR-决策.md
        - specs/23-Pitfall-踩坑经验.md
        - specs/24-Study-研究报告.md
        - specs/30-rules-entry-sync-review-Rules入口同步审查.md
        - specs/31-git-commit-action-Git提交行动编排.md
        - specs/32-environment-entry-adaptation-环境入口落地与适配检查.md
      blocking_reason: null
    - id: item-4
      title: 迁移全量命中附件中的字段、状态、DTO 和回归语义
      role: specs-attachments
      mode: sequential
      input_refs:
        - specs/attachments/
        - specs/attachments/04.Att.03-Code结构化输出Schema表.md
        - specs/attachments/04.Att.04-Code诊断码表.md
        - specs/attachments/04.Att.05-知识地图输入范围表.md
        - specs/attachments/04.Att.06-知识地图投影Schema表.md
        - specs/attachments/05.Att.01-DTO与API契约表.md
        - specs/attachments/05.Att.02-页面与API映射矩阵.md
        - specs/attachments/05.Att.06-Human-facing态势语义表.md
        - specs/attachments/05.Att.08-缓存与同步状态矩阵.md
        - specs/attachments/06.Att.05-保障要求承载矩阵.md
        - specs/attachments/06.Att.06-能力缺口分流核对表.md
        - specs/attachments/06.Att.08-适配状态表.md
        - specs/attachments/07.Att.06-过程输出回写核对表.md
        - specs/attachments/08.Att.05-Code完整验证入口表.md
        - specs/attachments/08.Att.07-失败阻断核对表.md
        - specs/attachments/08.Att.08-等价验证适用表.md
      expected_output: |
        以 item-0 的全量命中清单为准迁移附件。附件字段和状态不再定义泛化“降级”机制；保留 legacy 字段时必须标明兼容边界和待迁移方向，并与主干规范的替代语义一致。不得只处理本执行项列出的重点附件而漏掉 01/02/03/04/05/06/08 系其它命中附件。
      status: done
      result_summary: |
        已按全量命中清单迁移附件：字段、状态、DTO、回归、运行时承载、环境适配、过程回写和失败阻断附件均改为问题原因、受限状态、临时核对动作、未承接项、Human Gate 或后续分流。附件中保留的 `degraded` 均标注为 legacy 兼容字段或旧 Code 兼容值。
