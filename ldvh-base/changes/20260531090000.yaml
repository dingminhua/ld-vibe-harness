summary: 附件型实践子文档"机制不需要时"通用规则与 41.02 简化
date: 2026-05-31
reason: |
  1. 41.02 标题"Skill 边界实践"不准确——既然 Skill 不需要创建，叫"边界实践"暗示有边界要展开；
     改为"Skill 标准化复用实践"，对齐 Skill 机制本质定义。
  2. 41.02 内容冗余——§三"不承载内容"、§四"可建议边界"、§五"检查项"都是对不存在之物的约束，
     "不创建"本身就是最明确的边界，简化为只写不创建理由。
  3. 06 §4.5 和 07 §4.6 缺少"机制不需要时子文档怎么写"的通用规则，导致未来其他行动模型
     遇到同类情况时无据可依。在两处补充通用规则。
actions:
  - 41.02 标题从"Skill 边界实践"改为"Skill 标准化复用实践"
  - 41.02 内容简化为"定位 + 不创建理由"，去掉§三§四§五
  - 06 §4.5 附件型实践子文档命名表后加"机制不需要时"通用规则
  - 07 §4.6 附件型实践子文档命名表后加"机制不需要时"通用规则
  - 41 主文档 §15.2 表格 41.02 描述简化
  - 41 主文档 §18 第2条引用描述简化
affected_files:
  - specs/41.02-Skill.md
  - specs/06-LDVH生产对象基础规范.md
  - specs/07-LDVH行动模型基础规范.md
  - specs/41-multi-role-thinking-多角色思考.md
verification:
  - 41.02 标题为"Skill 标准化复用实践"，内容只含定位和不创建理由
  - 06 §4.5 包含"机制不需要时"通用规则
  - 07 §4.6 包含"机制不需要时"通用规则
  - 41 §15.2 表格 41.02 描述为"说明多角色思考不需要创建 LDVH 版 Skill 的理由"
  - 41 §18 第2条为"Skill 不创建理由由 41.02-Skill.md 承接"
