title: 知识预检与复用效用的配对实验
goal: 在不修改 Helper、事实 Schema、规则语义或 Web 的前提下，以预注册、可重放、固定模型的配对任务实验，判断 source-bound F2→F3 与 ADR/Pitfall/Study 三段知识预检组合包是否在冻结的代表性只读判断任务中提高适用性判断、减少重复研究或错误选择，并量化新增读取与上下文成本；结果只形成当前任务包的 harness-delivered/behavior-consistent 证据，为两个既有 open Spark 提供依据。
scope: 仅新增 code/ldvh/testing/knowledge_precheck_factorial.py 及直接测试，并形成 docs/metrics/knowledge-precheck-protocol-v1.json、knowledge-precheck-results-v1.json、knowledge-precheck-report-v1.md 三份冻结产物；results-v1 内嵌 allowlisted 原始结构化 attempt records 与 exclusion ledger。运行固定 gpt-5.6-sol fresh native subagent treatment/control 和 condition-blind scoring，只读当前 facts/Helper。严格排除 Helper operation/contract、Specs、事实 Schema/状态、Web、依赖安装、外部网络/消息、其它事实更新、Git commit/push/PR/release、P2/P3/F1 delta/MCP，以及启动前已有 dirty 文件与 WC-C ignored artifacts。
success_criterion_definitions:
- criterion_id: criterion-protocol-freeze
  statement: 任何 retained execution 前冻结并散列 protocol/task/gold/prompt/packet：精确 12 个 pair IDs（ADR decision、Pitfall implementation/debug、Study research 各 4），覆盖 positive、negative/non-use、ambiguity；逐任务定义 applicable 与 tempting-nonapplicable refs、admissible answers、duplicate/wrong-selection taxonomy、first-legal-action/source 与 adjudication。两条件使用同 task/output/deliberation/procedure skeleton；control 使用结构尽量匹配的 source-free neutral packet，treatment 独有 source-bound F2/F3 与 applicability instruction，estimand 只称 combined source-bound precheck package。pair members 使用 fresh independent contexts、无共享状态，顺序 6/6 counterbalance；泄漏为技术 exclusion。目标恰 12 retained pairs，最多 15 pair attempts/3 replacements，closed technical codes 为 missing_structured_output/model_technical_failure/runner_failure/cross_condition_leakage；wrong/adverse/null/surprising 永不排除，停止规则与结果方向无关。
- criterion_id: criterion-balanced-records
  statement: 取得恰 12 个 identity-matched retained pairs，或如实形成未满足/阻塞材料；每次 attempt 的 allowlisted structured record 含随机 attempt id、condition（scorer 输入剥离）、pair/order/fresh-context identity、全部 hashes、固定 model/agent、structured validity/exclusion、fact reads/expansions、first action、selection/non-use、response chars、prompt/packet/material chars，以及 observable input/output token、usage/cache、wall/queue latency；不可观察字段显式 unavailable。全实验 0 state-changing Helper calls。
- criterion_id: criterion-blind-knowledge-value
  statement: 客观字段由 deterministic scorer 计算，语义字段由独立 native subagent 在不见 condition/order/treatment provenance 的随机 attempt IDs 上按冻结 gold/rubric condition-blind 评分；默认一视角，仅预注册 ambiguity/disagreement 启用第二视角与冻结 adjudication。报告对 applicability/correct choice/non-use/duplicate avoidance/first legal action 给出 paired estimate 与 CI 或 exact paired test，并分列新增读取、prompt/packet/context 与可观察 usage/latency 成本；fact reads 只算 behavior，不冒充 reuse/value。
- criterion_id: criterion-reproducibility
  statement: runner/parser tests 覆盖 malformed records、privacy allowlist/denylist、hash、balance/order、technical codes、attempt/replacement ceiling、blind scorer packet、retention 与 deterministic analysis；三份冻结产物可由 records byte-identical 重建。canonical result projection 前实际运行 focused tests、Ruff、diff check、ldvh check 与 fact integrity，并保留 item-local 输出；失败或 unavailable 如实记录。只有 production import/public contract/shared core 实际变化时才触发 full suite。
- criterion_id: criterion-evidence-boundary
  statement: 结论严格区分 ldvh-prepared、harness-delivered、host-received、behavior-consistent 与 causal-effect；无 provider receipt 时 host-received=unavailable，只对冻结 corpus 报告 task-specific behavior-consistent estimate，不关闭 broad service-quality Spark、不声称 HV4 一般成立；null、adverse 或成本高于收益均为可接受结果。
success_criterion_results:
- criterion_id: criterion-protocol-freeze
  outcome: satisfied
  summary: 在首个 retained member 前冻结 12-task protocol/task/gold/prompt/packet；ADR/Pitfall/Study 各4，覆盖 positive/negative-non-use/ambiguity，6/6 counterbalance 与 12/15/3 ceilings。加强后的 validator 已从 frozen task/materials 重算 task/prompt/packet hashes 和 chars、assignment sequence 与 fixed model/agent；fresh-context hashes 24/24 唯一，实际 freshness 仍只作为本次独立 agent 创建记录的执行证据，不由 hash 本身证明。
- criterion_id: criterion-balanced-records
  outcome: satisfied
  summary: 12 pair attempts 产生恰 12 identity-matched retained pairs/24 records，6 control-first/6 treatment-first，technical replacements=0，state-changing Helper calls=0。validator 强制 allowlist/denylist、task/prompt/packet binding、sequence、structured validity、zero writes、unavailable usage/latency、response sizes、context-hash shape/uniqueness；opaque hash 不升级为 host freshness proof。
- criterion_id: criterion-blind-knowledge-value
  outcome: satisfied
  summary: 每 attempt 一项 condition-blind 第一视角，8 个 ambiguity attempts 有独立第二视角，7 个 disputed fields 仅按 frozen gold adjudicate。combined source-identity-plus-content package 下 selection_correct nominal mean difference=+0.666667，95% CI [0.416667,0.916667]，unadjusted exact p=0.0078125；六个质量指标未做 multiplicity adjustment，其它指标 null/mixed。
- criterion_id: criterion-reproducibility
  outcome: not_satisfied
  summary: 原标准要求三份 artifacts 从 records source-completely byte-identical 重建。当前测试只能从既有 results + frozen protocol 重算 record-bound hashes、paired analysis、evidence fields 与 report；sample/scoring failure/perspectives/adjudication provenance 仍由既有 results 提供，protocol 也是额外输入。因此 derived-field replay 通过但 records-only 原要求未满足，不能以 byte equality 自证。
- criterion_id: criterion-evidence-boundary
  outcome: satisfied
  summary: 结果区分 ldvh-prepared、harness-delivered、host-received unavailable 与 frozen-corpus behavior。selection 只描述 source identity/content/instruction 不可分的 combined package nominal scoring difference，不声称 knowledge/reuse improvement、broad causal effect 或 multiplicity-adjusted discovery；不关闭 broad Spark、不授权 Phase3/MCP。
result_summary: WC-D 完成 12 个固定模型 fresh-context 配对（24 members，0 replacements，0 写 Helper）。在 selected frozen corpus 中，combined source-identity-plus-content package 的 selection_correct nominal difference 为 +0.666667（95% CI 0.416667–0.916667；unadjusted exact p=0.0078125）；source identity、content 与 instruction 不可分，六质量指标未做 multiplicity adjustment，其它质量结果 null/mixed。treatment 每 pair 增加 2 candidate expansions、约 194.75 prompt chars、230.75 packet/material chars 与 56.33 response chars；usage/latency unavailable。四项标准满足；records-only source-complete reproduction 原标准未满足。
validation_summary: 'Artifacts: protocol 1197e337f2964e3e427e4024c74a0a839e68d79f40b929094bf629638c9a5f1f; results 0773ebf7e920872c0f1d024f0848216822870f71902c919da8b1736aea6e0e3a; records 98653684a1b2b7873878447f982ea0360ca76f24387b2031540d57547f44a472; report a6f9a02d46fb25d230131ab214a5a469305e60737c203bc5dc8340528f5f0cac; module ff1feb09d13fa80da23e12698e3ae38384b3a22d59614c690bac346303f5255d; tests 9a1807d0d2119b8485b78bb4348301216bc1fdbca435a7adf2c835e32b54435e. Focused 12 passed; Ruff passed; git diff --check clean; ldvh check passed with existing 7/67 disclosures; fact integrity complete/259/0. Validator recomputes hashes/sizes/sequence/fixed runtime/zero-write/unavailable/context-hash uniqueness. Derived-field replay from existing results+protocol is byte stable but not source-complete records-only reconstruction; full suite not triggered because no production import/public contract/shared core change. Host receipt, tokens/cache/wall/queue unavailable.'
