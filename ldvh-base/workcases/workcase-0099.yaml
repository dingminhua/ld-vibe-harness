title: 退役 Git prepare-commit-msg 署名自动注入
status: open
summary: 单 commit-msg Hook 已部署；正在完成真实验证、复核与受控提交准备。
priority: P1
goal: 从正式 Hook bundle 退役 prepare-commit-msg 的 LDVH_SIGNATURE 自动署名注入，保留显式 trailer 与 commit-msg Gate。
scope: 覆盖提交署名规则、环境接入规范和附件、Hook bundle 版本/部署/升级/回滚、显式 trailer 校验、真实 Git 事件测试及本地提交。排除事实 change_log 署名、Web、push、PR、发布和任何产品自动注入适配器。
success_criterion_definitions:
- criterion_id: criterion-1
  statement: 规则和 Skill 一致规定提交署名由执行会话显式提供，LDVH_SIGNATURE 不再是默认接入接口。
- criterion_id: criterion-2
  statement: Hook bundle 仅管理 commit-msg；升级只删除可识别的 LDVH prepare Hook，未知或自定义 Hook 停止并交由 Human 决定。
- criterion_id: criterion-3
  statement: 预检与 commit-msg Gate 共享三字段 trailer 的解析、归一和拒绝规则，缺署名、旧署名或三项全空不能通过。
- criterion_id: criterion-4
  statement: 显式完整提交允许；自动 Git merge message、无正文或无署名提交被拒绝；真实 Git 事件覆盖安装、升级、回滚和 linked worktree common-dir 边界。
- criterion_id: criterion-5
  statement: 目标与相关回归、事实完整性、diff 检查和受控本地提交通过；不执行 push。
