title: 提交预检机械诊断的修正信息权威来源策略
status: active
decision_question: 提交预检对未知 scope、未知 type、未知正文小标题等能准确定位，但只报告错误值，不给当前允许值、最小合法示例或精确继续读取入口。后续应通过什么机制向诊断补充修正信息，使 AI 可据诊断直接修正，同时不复制规则正文、不形成第二权威？
decision: "决定将诊断的修正信息来源按以下分层策略处理：\n\n1. 确定性约束——诊断直接附带允许值闭集。对于不依赖规则附件投影、在规范生命周期内不变或仅通过 Code 提交本身变更的硬编码闭集，在诊断 message 中直接列出允许值。当前适用：body 固定小标题（_FIXED_HEADINGS：动机:、关键变更:、影响边界:、验证结论:、风险与后续:）、Platform-Affected/Platform-Verified 枚举值（macos/windows/both/unaffected/none）、必需 footer trailer 名（Session-ID、Agent-ID、Host-Environment）。上述值已在诊断中部分附带（Platform 类），其余待补齐（body_heading_unknown 应列出 _FIXED_HEADINGS 闭集）。\n\n2. 规则驱动值——由调用方通过 contract projection 注入诊断。对于 type_tokens、scope_tokens 等从 03.Att.01 动态投影的值，不在诊断中硬编码允许列表，而是利用 validate_commit() 已接收的 CommitContractProjection 参数，在构造 type_unknown/scope_unknown 诊断时将 contract.type_tokens/contract.scope_tokens 格式化进 message。该注入不建立第二权威，因为注入源是同一规则投影的运行时消费，而非独立硬编码副本。\n\n3. 精确读取入口——以锚点路径文本并入诊断 message 实现，不扩展 _issue(code, message) 的响应 schema。当允许值列表过长（如 scope_tokens 可能超过 20 项）不适合直接嵌入 message 时，或在确定性/规则驱动值之外需要 caller 阅读完整规则上下文的场景，诊断在 message 中附加精确读取入口指向 03.Att.01 对应表格的章节路径。若未来确需结构化 source 字段，另立 WorkCase 评估。"
applicability: 适用于 code/ldvh/commits/validation.py 及 precheck.py 中所有返回给 AI 调用的机械诊断构造；不改变 Hook 的原生 Git 输出（commit-msg Hook 仍保持简洁）。本 ADR 约束的是 Helper 操作 precheck-git-commit 返回的 issues[*].message 字段内容策略，不改变诊断的 code、stage 或校验逻辑本身。
rationale: "当前 type_unknown/scope_unknown 只报告“未知 type: xxx”和“未知 scope: xxx”，AI 必须额外查询规则附件才能知道正确值，造成一次无谓往返。但若直接在 Code 中硬编码 type_tokens 列表，则随 03.Att.01 新增 type 时 Code 必须同步更新，否则诊断值与实际规则不一致——这正是 spark-0019「明确排除」中禁止的「第二权威」（Code 成为规则副本，与规范附件漂移风险）。\n\n分层策略的核心权衡：确定性约束不会漂移（_FIXED_HEADINGS 是规范正文定义的固定闭集，改变它需要修改规范本身，该修改必然伴随 Code 同步变更），因此直接在诊断中输出是安全的。规则驱动值会漂移（type/scope 由附件表格定义，可独立于 Code 变更），因此必须从运行时投影消费，而非硬编码。\n\n调用方注入方案（方案 a）直接复用 validate_commit() 已持有的 contract 参数，无需新输入、新依赖，仅改变 message 格式化方式，改动最小、风险最低。精确读取入口方案（方案 c）作为补充层，解决允许值列表过长时的 message 噪声问题，但不替代注入方案——因为纯入口引用仍要求 AI 额外读取，增加往返。\n\n否决的备选方案：\n- Code 硬编码允许值（方案 b）：违反 spark-0019「明确排除」中「不建立第二权威」条款。type_tokens/scope_tokens 可随 03.Att.01 独立变更，Code 中硬编码副本会与附件漂移，且无机械机制保证同步。即使增加注释警告或测试，仍然属于 Code 成为规则的事实副本，不符合「规范是唯一权威」的 LDVH 架构原则。\n- 仅给精确继续读取入口（方案 c 作为唯一方案）：虽然完全避免第二权威风险，但将修正负担完全转移给 AI，每次 type/scope 错误 AI 需先读取 03.Att.01 表格、解析 markdown 表格、提取允许值，再修正重试。这保留了 spark-0019 summary 中「剩余摩擦」描述的问题——不减少往返。适合作为补充策略（当允许值列表过长时），但不适合作为替代方案。"
consequences: "正面：type_unknown/scope_unknown 诊断将附带当前允许值列表（如“未知 type: xxx，允许值: fix, feat, chore, test, docs, refactor, perf, style, ci, build, revert”），AI 可一步修正，消除一次规则读取往返。确定性约束诊断（body_heading_unknown 等）补齐允许值闭集。\n\n负面与限制：type_tokens 较长时 message 变长，但 scope_tokens 可能更长——届时应降级为「读取入口」策略而非全量嵌入。message 中的允许值列表是快照性质（绑定到校验时的 contract 投影），不保证调用方使用该值到提交完成之间规则未变，但 content_fingerprint 已经绑定到同一快照，变化会被 source_fingerprint_mismatch 捕获。\n\n本决定不建立第二权威：注入源是 contract 参数，该参数来自 project_commit_contract() 的运行时投影，每次校验重新派生，不以独立副本形式存在于 Code 中。\n\n边界说明：\n- type_unknown（规则驱动）：从 contract.type_tokens 注入允许值，来自 03.Att.01 动态投影。\n- scope_unknown（规则驱动）：从 contract.scope_tokens 注入允许值，超长时降级为读取入口。\n- body_heading_unknown（确定性）：直接列出 _FIXED_HEADINGS 闭集，硬编码闭集由规范正文定义。\n- platform_trailer_invalid（确定性）：已列允许值，维持现状。\n- signature_trailer_missing（确定性）：已说明必需 trailer 名，维持现状。\n\n第三层「精确读取入口」以锚点路径文本并入诊断 message 实现，不扩展 _issue(code, message) 的响应 schema；若未来确需结构化 source 字段，另立 WorkCase 评估。\n\n后续：若 scope_tokens 增长到使 message 过于冗长，应统一为「type 全量 + scope 读取入口」的混合策略，而非恢复硬编码。"
