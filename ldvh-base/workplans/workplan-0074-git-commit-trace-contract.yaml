  ## 验证计划

  检查 0074 补救后是否满足当前阶段的规格边界、Code 拦截、Web 表达和工作对象事实源自洽要求；同时保留未完成的 Web 共享 commit DTO 后续项。

  ## 验证命令

  ```bash
  python3 -m pytest tests/code/test_commit_validate.py tests/code/test_fact_cli.py tests/code/test_fact_validate.py -q
