avoidance: |
  1. **永远不要使用 `transition-all`**：Tailwind 项目中应始终指定明确的过渡属性列表
     （如 `transition-[opacity,transform]`、`transition-colors`、`transition-[margin]`）
  2. 新增 UI 组件或修改现有组件的 transition 时，检查是否使用了 `transition-all`
  3. 对容器元素显式设置 border-radius（即使为 0），避免依赖浏览器默认值
  4. 如需排查类似"莫名出现的圆形/圆角动画"，用 DevTools 检查元素的 computed border-radius
     和 transition 属性，特别关注是否有 `transition: all`
applicability: |
  所有使用 Tailwind CSS 的前端项目，特别是 React + Vite + Tailwind 技术栈。
  任何涉及页面切换、路由变化或动态渲染容器的场景。
