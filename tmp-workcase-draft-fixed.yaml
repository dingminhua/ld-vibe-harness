title: "ADR/Pitfall 差异化触发生产接入"
goal: >
  将 v7 验证的 ADR/Pitfall 差异化触发机制（supports-family-differentiated-trigger）接入
  生产 Helper 的 find-fact-object-candidates 操作，使 ADR 和 Pitfall 在 F2 候选发现阶段
  采用类型化触发策略：ADR 使用信号命中即触发 + 轻排除（signal_hit AND NOT light_exclusion），
  Pitfall 使用信号 + 症状/风险锚点匹配（signal_hit AND symptom_risk_anchor）。
  复用 v7 冻结的 18 个 task/gold 与触发规格，按预注册门槛验证生产实现的触发精度与激活质量
  不回退现有基线，并将差异化触发逻辑固化到 Helper 代码与测试中。
scope: >
  仅修改 code/ldvh/helper/ 目录下的触发逻辑实现（fact_candidate_operation.py 或新建
  触发策略模块）及对应测试（code/tests/helper/）。复用 v7 的 18 个冻结 task/gold
  （A1-S6、6 情形、9 applicable/9 non-use/6 no-trigger gold）与差异化触发规格
  （docs/metrics/knowledge-precheck-v7/protocol-draft/adr-pitfall-differentiation-spec.md）。
  不修改 specs/22/23 的类型规范 Schema、不修改 05.Att.01 字段登记、不修改 Web 层、
  不修改 v5/v6/v7 实验代码（只读复用依据）、不创建新的事实对象类型、不修改 Git Hook
  或环境接入配置。
priority: P1
status: open
phase: human_plan_confirming
plan_version: 1
work_items:
  - item_id: item-design-trigger-spec
    goal: >
      设计 ADR/Pitfall 差异化触发的生产规格：将 v7 实验的触发策略
      （adr-pitfall-differentiation-spec）转化为可在 Helper 代码中实现的
      生产级触发规则，明确 signal_hit、light_exclusion、symptom_risk_anchor
      的判定逻辑、输入参数与输出格式。
    expected_result: >
      形成一份触发规格文档，包含 ADR 和 Pitfall 各自的触发公式、判定条件、
      边界案例处理方式，以及与现有 find-fact-object-candidates 接口的兼容方案。
    status: pending
  - item_id: item-implement-trigger
    goal: >
      实现 ADR/Pitfall 差异化触发逻辑：在 Helper 代码中实现类型化触发策略，
      使 find-fact-object-candidates 对 ADR 和 Pitfall 返回类型化候选卡，
      卡片包含触发原因（matched 信号/锚点）供 AI 判断。
    expected_result: >
      Helper 代码支持差异化触发，ADR 候选卡包含 signal_hit/light_exclusion 信息，
      Pitfall 候选卡包含 signal_hit/symptom_risk_anchor 信息；
      现有非差异化场景（Spark/WorkCase/Study）不受影响。
    status: pending
  - item_id: item-write-tests
    goal: >
      编写 focused tests 覆盖差异化触发逻辑：ADR 触发正确率、Pitfall 触发正确率、
      轻排除逻辑、症状/风险锚点逻辑、边界案例（f2-no-f3、pure-non-use、
      纯假设未来）、以及与现有测试的回归兼容。
    expected_result: >
      focused tests 覆盖 v7 规格的全部触发场景，现有 tests 不被破坏，
      ruff check 和 py_compile 通过。
    status: pending
  - item_id: item-run-verification
    goal: >
      运行测试验证：执行 focused tests 和回归测试，确认差异化触发的
      触发精度（ADR trigger_correct >= 5/6、Pitfall trigger_correct >= 4/6）
      和 unnecessary_f2（ADR <= 1、Pitfall <= 2），以及现有基线指标不回退。
    expected_result: >
      全部 focused tests 通过，回归测试通过，触发精度指标满足预注册门槛。
    status: pending
success_criterion_definitions:
  - criterion_id: criterion-adr-trigger-accuracy
    statement: >
      ADR 触发正确率（trigger_correct）>= 5/6（6 个 ADR 情形中至少 5 个触发判定正确）。
      基于 v7 冻结的 6 个 ADR 情形（A1-A6），逐对评估触发判定是否与 gold 一致。
  - criterion_id: criterion-pitfall-trigger-accuracy
    statement: >
      Pitfall 触发正确率（trigger_correct）>= 4/6（6 个 Pitfall 情形中至少 4 个触发判定正确）。
      基于 v7 冻结的 6 个 Pitfall 情形（P1-P6），逐对评估触发判定是否与 gold 一致。
  - criterion_id: criterion-no-false-f3-increase
    statement: >
      unnecessary_f2 不超过 v7 baseline 臂实测值（ADR <= 1、Pitfall <= 2），
      即不增加误触发。
  - criterion_id: criterion-regression-pass
    statement: >
      现有 focused tests 和回归测试全部通过，ruff check 和 py_compile 通过，
      现有 v5/v6/v7 sealed bundle 未被修改。
  - criterion_id: criterion-baseline-no-regression
    statement: >
      现有 find-fact-object-candidates 对 Spark/WorkCase/Study 的候选发现行为
      不受影响（回归测试覆盖）。
execution_authorization:
  authorized_actions:
    - action_id: authorization-design-spec
      summary: "设计差异化触发生产规格文档"
      target_scope: "docs/ 目录下新建触发规格文档"
      effect_scope: "仅新增文档文件，不修改现有代码或事实对象"
      risk_summary: "低风险：纯文档新增"
      rollback_summary: "删除新增文档即可回滚"
      rule_refs:
        - "fact-model-foundation::11.4 事实对象受控创建输入与结果"
    - action_id: authorization-implement-trigger
      summary: "修改 Helper 触发逻辑代码"
      target_scope: "code/ldvh/helper/ 目录下的 Python 文件"
      effect_scope: "修改 fact_candidate_operation.py 或新建触发策略模块；不修改 specs/、05.Att.01、Web 层"
      risk_summary: "中风险：修改核心候选发现逻辑可能影响现有行为；需回归测试覆盖"
      rollback_summary: "git checkout 恢复修改前的文件"
      rule_refs:
        - "fact-model-foundation::11.4 事实对象受控创建输入与结果"
    - action_id: authorization-write-tests
      summary: "编写 focused tests"
      target_scope: "code/tests/helper/ 目录下的测试文件"
      effect_scope: "新增测试文件，不修改现有测试"
      risk_summary: "低风险：纯测试新增"
      rollback_summary: "删除新增测试文件即可回滚"
      rule_refs:
        - "fact-model-foundation::11.4 事实对象受控创建输入与结果"
    - action_id: authorization-run-tests
      summary: "运行 pytest 验证"
      target_scope: "本地测试环境"
      effect_scope: "仅读取代码和运行测试，不写入事实对象"
      risk_summary: "无风险：只读操作"
      rollback_summary: "无需回滚"
      rule_refs:
        - "fact-model-foundation::11.4 事实对象受控创建输入与结果"
  action_ceiling: >
    单次运行最多修改 5 个 Python 文件（含测试），新增 1 个文档文件，
    不得创建事实对象、提交 Git commit（需另行授权）、或修改非 code/ 目录。
  prohibited_actions:
    - "修改 specs/ 目录下的任何规范文件"
    - "修改 specs/attachments/ 目录下的字段登记文件"
    - "修改 web/ 目录下的任何文件"
    - "修改 .git/hooks/ 或环境接入配置"
    - "创建新的事实对象类型"
    - "修改 v5/v6/v7 实验代码（code/ldvh/testing/knowledge_precheck_*.py）"
    - "提交 Git commit（需另行授权）"
    - "创建事实对象（create-fact-object）"
  allowed_adjustments: >
    Gate1 后 Controller 可在不改变 goal/scope/criteria 的前提下调整
    代码实现方式（如触发逻辑的模块划分、函数签名）、测试用例设计、
    规格文档措辞；不得改变触发公式语义或放宽/收紧预注册门槛。
  verification_and_rollback: >
    每次代码修改后运行 pytest 验证；失败时 git checkout 恢复。
    focused tests 覆盖触发精度和回归兼容；ruff check 确保代码风格。
    已知不可回滚部分：无。
  out_of_bounds_handling: >
    发现未授权修改（如修改了 specs/ 或 Web 层）时立即停止，
    git checkout 恢复受影响文件，在 current_summary 中记录超界事实，
    将受影响 item 据实记为 cancelled 并转入结果链。
  quality_gates:
    - gate_id: "independent-result-review"
      reviewer_mode: "independent-read-only"
      delegation_action_id: "authorization-run-tests"
      result_review_action_id: "authorization-write-tests"
