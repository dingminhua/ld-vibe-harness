description: |
  当前 ADR 拥有独立工具 adr_index.py，而其他 6 个 active 对象（Intent/Task/Memo/Profile/Pitfall/Change）
  全部共用 fact_cli.py + fact_validate.py。ADR 不应有独立工具，其专属能力应合并进统一工具。
  adr_index.py 比 fact_cli.py 多出的能力及归属：
  - search / stats / related：通用查询增强，已进入 fact_cli.py
  - draft：fact_cli.py 的 create 已有骨架生成
  - link-rule：ADR 字段回写，已进入 fact_cli.py
  - deprecate / supersede：本质是状态流转 + 关联字段回写，已进入 fact_cli.py
  - Human Gate 参数强制：统一工具已强制，不是 ADR 专属
  - Change 记录生成：fact_cli.py 的 ADR create/transition 已支持 --write-change
  本任务将 adr_index.py 的 ADR 专属能力合并进 fact_cli.py，然后删除 adr_index.py。
  同时更新 21.04-Tools.md 规范引用和 ADR Skill 中的工具调用路径。
