title: LDVH 价值审计
status: open
priority: P2
intent: LDVH 已形成完整的规范、事实、Helper、Git Gate、Web 与环境接入能力，但这些能力的实际复用收益、持续成本和积累效用仍缺少稳定的周期性判断。本议题保留一个与具体缺陷和实施路线解耦的价值审计入口，用于后续基于证据判断各能力应继续保留、简化、替代还是退出；若不跨行动保留，后续会反复承担重新定位审计边界、重建评价维度、区分价值问题与实现缺陷以及恢复历史基线的成本。
summary: "## 定位\n\n本议题只承载 LDVH 的价值审计，不作为缺陷清单、实施路线图或改造项目。审计结论用于形成有证据的保留、简化、替代或退出建议；任何具体改动仍需另行判断和授权。\n\n## 当前基线\n\n- LDVH 已具备五类事实对象、Helper CLI、Git Gate、Web 认知中心、薄 Skill 与环境接入链路。\n- 既有优化议题已完成或撤销多项直接缺陷，原有 13 项清单不再作为当前路线图。\n- 仍值得持续核实的核心张力是：实际复用与积累效用是否足以覆盖规范、代码、操作和维护成本。\n- `spark-0067` 保留此前优化探索、实测结果与历史判断；本议题不复制其缺陷明细。\n\n## 审计维度\n\n1. **结果价值**：是否更快定位事实、充分理解上下文、可靠接续并减少重复分析。\n2. **积累效用**：事实与决策是否被真实复用，项目是否因积累而更易推进。\n3. **使用摩擦**：规则读取、能力发现、对象写入、Human Gate 与恢复路径的成本是否与风险匹配。\n4. **复杂度成本**：规范、代码、Web、测试和环境接入的维护负担是否获得相称收益。\n5. **覆盖缺口**：哪些目标价值仍缺证据、表现薄弱或只在设计上成立。\n6. **采用情况**：dogfood 与外部项目是否形成持续事实，而不只是完成脚手架接入。\n\n## 每轮产出\n\n每次审计应给出：证据与观察范围、已验证价值、成本与摩擦、证据不足项、候选处置（保留/简化/替代/退出）、影响与风险，以及建议优先级。不得把机械通过、对象数量或功能存在直接当成价值成立。\n\n## 复审触发\n\n在出现重大架构变化、事实规模或使用方式显著变化、新项目形成真实采用证据，或 Human 明确要求重新评估时复审。常态优先级为 P2。\n\n## 当前不确定性\n\n- HV4“积累效用直观可见”是否已由真实使用证据改善。\n- 各能力的维护成本与实际节省成本如何可比。\n- 哪些复杂度属于必要治理成本，哪些已成为可安全缩减的负担。"
