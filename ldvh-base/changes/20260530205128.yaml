summary: 建立主文档完整建模与附件型实践子文档按需拆分标准
changes:
  - 修改 01 §5.3：明确模型实践子文档是附件型实践承接文档，不是模型完整性的默认要求
  - 修改 01 §7.3：补充附件型实践子文档不得承载主模型核心规则的边界
  - 修改 01 §7.6：扩展落地初始化、落地审计与合规检查的术语定义和三者关系
  - 修改 06 §4：生产对象模型标准组成改为主文档完整建模、附件型实践子文档按需拆分，并加入落地初始化、落地审计和合规检查
  - 修改 06 §8-§9：更新 Human Gate、写作检查和待补齐事项中的附件型实践子文档与合规检查术语
  - 修改 07 §4：行动模型标准组成改为主文档完整建模、附件型实践子文档按需拆分，并加入落地初始化、落地审计和合规检查
  - 修改 07 §8-§9：更新 Human Gate、写作检查和待补齐事项中的附件型实践子文档与合规检查术语
  - 修改 11：将 ADR 的模型实践子文档表述调整为附件型实践子文档按需创建，并同步 06 §4.6 新术语
  - 修改 41：声明 41 主文档为完整行动模型，41.01-41.05 为附件型实践子文档，并新增落地初始化、落地审计和合规检查章节
  - 追加修改 41：移除历史、参考、迁移、旧版、早期等表述，使多角色思考作为 LDVH 全新行动模型自洽定义，不依赖任何历史 Skill、旧资料或参考来源
reason: 用户确认采用“主文档完整建模、机制子文档按需拆分”的标准，并强调子文档应视为附件型实践内容承接，落地初始化、落地审计和合规检查的术语边界应先在 01 中树立。随后用户进一步要求完全去掉参考性质表述，抛开历史包袱，把多角色思考作为更好的全新行动模型定义。
impact:
  - 生产对象和行动模型不再要求默认规划 NN.01-NN.05 子文档
  - 主文档成为对象模型或行动模型的完整权威定义入口
  - 子文档保留为按需创建的附件型实践承接文档
  - 具体模型文档需要区分落地初始化、落地审计和合规检查
  - 41 不再依赖或指向任何历史 Skill、旧版资料、参考输入或迁移来源
