title: ZCode 本地插件安装 data 目录缺失导致 Hook 不生效
status: active
applicability: 仅适用于已观察到的 ZCode 本地 filesystem 安装：插件声明 hooks、运行时实际选用的 data/ldvh@zcode-plugins-official/ 目录为空，且将其中的 ldvh.json 补入后重启。marketplace 安装、其它插件或 data 路径、SubagentStart、未来升级、compact/resume 稳定性及多个注册来源的运行时选择均未验证，不得据此复用。
validation_summary: "在已观察场景中，将 ldvh.json 补入运行时选用的 data 目录并重启后，SessionStart 成功触发并返回 work-context，且可观察到 hook 执行记录。以下范围仍未覆盖：\n\n1. SubagentStart 是否也正常触发\n2. 未来插件版本升级后 data 目录是否再次失效\n3. compact/resume 后是否每次都触发\n4. 同时存在 ldvh@local 与 ldvh@zcode-plugins-official 时运行时如何选择 data 目录"
symptoms: "1. 插件在 config.json 中已启用但 SessionStart 时无任何效果\n2. 日志中只有 rpc:register channel
  'hooks' 但无 hook 执行事件（无 fired/completed/failed）\n3. 手动模拟 hook 脚本（codex_context.py）可以正常返回
  work-context\n4. 以为是 hook 配置错误，但 hooks/hooks.json 结构正确、事件名合法\n5. 日志中无任何 hook 超时/失败/阻断记录，说明
  hook 运行时从未执行该 hook"
trigger_conditions: "1. 通过 filesystem 方式安装 ZCode 插件（marketplace: 'local', source:
  'filesystem'），而非 marketplace 安装\n2. 插件含有 hooks 声明（plugin.json 中 hooks: 'hooks'）且
  hooks/hooks.json 内容正确\n3. 插件 cache 目录中有 data/ldvh.json 但 data/ldvh@plugin-name/
  目录为空\n4. 插件在 config.json 的 enabledPlugins 中标记为 true\n5. 插件有两个注册来源（ldvh@local 和 ldvh@zcode-plugins-official），前者指向实际项目，后者指向空
  data 目录"
root_cause: "在已观察的本地 filesystem 安装中，运行时实际选用的 data/ldvh@zcode-plugins-official/ 目录没有 ldvh.json；hook 脚本因此无法读取定位 helper 所需的配置，表现为 SessionStart 没有触发。该判断只解释这个已观察目录、注册来源和安装状态，不证明所有 filesystem 安装或 ZCode 版本都缺少同步步骤。"
resolution: "在已观察场景中，先确认运行时实际选用的 data 目录，再将对应缓存中的 ldvh.json 复制到该目录并重启 ZCode。该处理恢复了 SessionStart；不把它表述为对 SubagentStart、升级后安装或其它注册来源的通用修复。"
avoidance: "本地 filesystem 安装后，先确认运行时实际选用的 data/<plugin-name>/ 目录是否有 ldvh.json，再通过新 SessionStart 的实际触发确认 Hook 生效。手动脚本成功或配置已声明都不足以代替触发确认；marketplace 安装是否自动同步 data 目录仍是未验证的另一条路径。"
object_id: pitfall-0001
fact_type_key: pitfall
