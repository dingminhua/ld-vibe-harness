id: workplan-0080
type: workplan
title: 固定能力资产登记制与最佳实践规范收敛
status: closed
created: '2026-06-20T10:12:08+08:00'
updated: '2026-06-20T20:32:15+08:00'
workarea: workarea-0012
priority: P1
description: |
  spark-0017 暴露出 10 号 Git 提交规范落地时的前置治理缺口：LDVH 需要明确 Rules、Skill、Agent、Hook 等固定能力资产如何登记、如何声明来源规范、如何接受质量审查、如何同步 specs 变化，以及如何区别权威资产与不同运行环境中的薄引用或部署副本。

  本计划只承接固定能力资产登记制、资产类型最佳实践标准和同步监督规则的规范收敛。10 号提交规范的 commit-msg hook、ldvh-git-commit Skill 和提交门禁具体落地继续由 workplan-0074 承接；最佳实践文档内容方向可与 workplan-0024 并行推进。
success_criteria: |
  - [x] 04.02 明确固定能力资产采用登记制，未登记资产不得被 Code、Web、Rules 或工作流程当成稳定保障机制
  - [x] 01 明确 rules/、skills/、agents/、hooks/ 等目录定位，区分权威固定资产、候选环境适配资产和说明性资产
  - [x] Rules、Skill、Agent、Hook 的资产元信息、来源规范、权威路径、边界说明、同步触发、验证入口和质量审查要求形成统一规则
  - [x] 明确 AI 生成能力资产的多视角审核要求，覆盖 Human、Code、Web、AI 执行和行业实践
  - [x] 明确 specs 变化后能力资产同步监督链路，避免 Rules、Skill、Agent、Hook、Code、Web 和部署入口漂移
  - [x] 明确固定能力资产与运行环境部署副本的分层边界，不把环境内同名文件长期分叉为第二事实源
  - [x] 形成多视角行业最佳实践 Study，并将可吸收结论回写到 04.02 的资产类型最佳实践标准
  - [x] 将 10 号提交规范所需的 ldvh-git-commit Skill 和 commit-msg hook 作为后续可登记固定能力资产的试点约束，而不在本计划中实现其具体文件
  - [x] 相关 specs、Code 检查缺口、Web 展示边界和后续 WorkPlan/Spark 分流记录清楚
source: |
  用户在讨论 spark-0017 时确认该 Spark 会关联多个可并行 WorkPlan，并要求先按 10 号规范提交已完成修改，再按计划继续执行。

  Human Gate 记录：
  - 触发原因：创建新的 WorkPlan 承接固定能力资产登记制与最佳实践规范收敛。
  - 影响范围：04.02、01、Rules / Skill / Agent / Hook 资产边界、后续 Code 派生索引、Web 展示和 10 号提交规范落地资产。
  - 确认依据：用户明确说“好，先按10要求提交，然后按你计划执行”。
  - Human 决策：批准按计划执行，并允许为 spark-0017 的第三条治理线创建独立 WorkPlan。
  - 后续回写位置：本 WorkPlan、spark-0017、相关 specs、必要 Code/Web 缺口和后续 Git commit records。
  - 残留风险：资产类型最佳实践标准尚未正式收敛；如果 40/41/42/43 派生型审核能力边界发生架构变化，可能需要与本计划联动调整。
