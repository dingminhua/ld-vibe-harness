  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-review-delegation
    result_review_action_id: authorization-result-review
  action_ceiling: 仅允许列明 Python code/tests、只读 Helper、目标验证与两固定 review 位置；不扩展为规则修订、Web/Helper API、事实写入、successor 创建、Spark 迁移或 multi-object atomicity。
  reviewer_policy:
    model: gpt-5.6-sol
    collaboration_agent: native-subagent
    effort: medium
    fast: false
    preferred_method: subagent-read-only
    fallback_order:
    - subagent-read-only
    max_perspectives: 1
    activation: native subagent 可用且仅承担只读 creation/PlanΔ/result review
    same_ai_limit: 禁止降级到 same-AI；能力/权限不成立时停止对应 review。
  allowed_adjustments: 只允许在列明 Python code/tests 内进行最小实现或测试修正，以及同范围失败重试；不得扩大文件、对象、状态、关系语义、事实写入或多对象能力；若需要修改 specs、Web、Helper API/schema 或无法区分 dirty baseline，立即停止。
  verification_and_rollback: 先记录 update_application.py、relations.py 与相关测试的现有 dirty baseline；逐块审 diff，仅叠加可归属增量。每个稳定检查点运行目标测试、Ruff、git diff --check 与 check-fact-integrity；不回退或覆盖无关 dirty。
  out_of_bounds_handling: 发现事实写入、successor 创建/迁移、spark-0034/workcase-0092 修改、multi-object 行为、spec/Web/Helper API 扩围、提交发布或无法安全区分 dirty 时，立即停止相关动作并交还新范围。
  prohibited_actions:
  - 不得写入任何 canonical fact；不得创建或更新 Spark/WorkCase/Study/ADR/Pitfall。
  - 不得创建 successor、迁移 spark-0034 或用多次单对象写入伪造整体分流成功。
  - 不得修改 specs、Web、Helper API/schema、WorkCase 状态机或 multi-object atomicity。
  - 不得 commit、push、PR、release、部署、安装依赖或发送外部消息。
  - 不得清理、覆盖、stage、restore 或回退无关 dirty changes。
  human_prerequisites:
  - Human Gate 1 必须批准本 plan_version=1 与完整 execution_authorization 后，才可修改列明代码或测试；本创建对象本身不带 execution approval。
