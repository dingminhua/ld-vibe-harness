title: 外部研究与网页证据获取边界
intent: 保留外部网页资料何时值得获取、如何记录来源与限制、以及外部服务如何不成为 LDVH 核心依赖的问题，避免把过期产品资料、抓取结果、模型抽取或一次网络成功误作事实成立、成本可接受或默认接入授权。后续需判断真实证据缺口、能力准入与风险边界。
status: open
priority: P2
