id: spark-0034
type: spark
title: 适配层 payload 断裂与安装验收缺口：Hook 未稳定转发真实工作对象
status: pending
created: '2026-06-27T03:05:00+08:00'
updated: '2026-06-27T04:11:15+08:00'
description: |
  在 WorkBuddy 环境中实际使用 LDVH 时发现：适配脚本 `ldvh-hook-dispatch.sh` 通过 `exec python3 dispatcher run "$EVENT" --trigger-source hook` 调用 dispatcher，但既没有转发 WorkBuddy 通过 stdin 传入的 JSON payload（包含 tool_name、tool_input.file_path、session_id 等），也没有传 --cwd 和 --target 参数。

  结果是 dispatcher 只能用 shell 进程的 Path.cwd() 做兜底，拿到的是工作区父目录 `/Users/dmh2002/poker_hud_projects`，不在管辖项目 `ld-vibe-harness` 路径内，于是每次都判定 `not_governed` → no-op。

  这不是 specs 的问题（specs/06 第132行明确要求 target-first），也不是 dispatcher 的问题（hook_dispatch.py 完整实现了 payload 提取和 target-first 逻辑），而是连接 WorkBuddy 和 dispatcher 的 23 行 shell 适配脚本没有把 payload 传过去——典型的适配层断裂。

  与 workcase-0014 已完成的 worktree 管辖识别不是同一层：workcase-0014 解决"拿到 cwd/target 后，如何通过 Git common_dir 判断 worktree 是否属于管辖项目"；本 Spark 暴露的是更前一环："Hook / adapter 必须把真实工作对象 payload/target 传给 dispatcher，否则 target-first 和 worktree 识别没有机会生效"。

  收敛方向：
  1. 适配层修复与登记边界：Hook adapter 原样转发 stdin JSON payload 和可推导工作对象字段（cwd、session_id、tool_name、tool_input、target）；若 adapter 属于仓库受管资产，可登记其固定资产身份和验证命令；若只是现场脚本，只能沉淀模板、doctor/verify 核对项和安装说明，不得把当前用户环境安装状态写入 06.Att.02。
  2. Dispatcher 自防御：trigger_source=hook 且只能 cwd-fallback、缺少 payload/target 时，输出 diagnostic `adapter_payload_gap`，让断裂在第一次调用就可见。
  3. 一致性测试：模拟真实 payload 端到端验证适配脚本，期望 governed=true，否则测试挂。
  4. No-op 可观测性：cwd-fallback 时加 confidence: "low"，区分"确实不管辖"和"不知道管不管"。
  5. 安装验收封装：将 specs/33 的安装行动落成可执行 verify/doctor Code，并由 `ldvh-install` bootstrap skill 调度，不依赖 LDVH runtime 已安装或 receipt 已存在；安装成功后日常工作才交给 Hook / Rules / Runtime Protocol。
source: conversation
source_detail: |
  在 WorkBuddy 会话中操作 ld-vibe-harness/开发者的话.md 时，观察到每次工具调用的 hook 系统消息都返回 governed=false, subject_source="cwd-fallback", status="not_governed"。通过阅读 hook_dispatch.py 源码和 ldvh-hook-dispatch.sh 适配脚本，定位到适配层未转发 stdin payload 和 target 参数。后续对话进一步确认：worktree 管辖识别已由 workcase-0014 修复，本 Spark 应聚焦 adapter payload/target 传递、dispatcher 自防御、安装验收 Code、`ldvh-install` bootstrap skill，以及安装后非管辖项目低打扰体验。
priority: P1
