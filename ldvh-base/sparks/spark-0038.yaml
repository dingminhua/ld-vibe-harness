title: 补齐 WorkCase 执行编排与事实类型行动入口
intent: 需要稳定保留 WorkCase 获批计划的执行编排：存在跨检查点推进或恢复价值时，先据实写回工作项状态再继续实施；局部结果在同一稳定检查点形成时，保留直接完成例外。并判断五类事实对象如何更清楚地复用统一创建与生命周期模板而不复制规则。若不跨行动保留，执行者仍可能绕过 21 已定义的检查点直接实施，或为改善可发现性拆出重复模板，增加状态失真、规则漂移和接续复核负担。
status: open
priority: P1
