title: 纠正身份停止规则并重新执行代表性 Helper 测试
status: open
priority: P1
goal: 将代表性 Helper 测试的产品名/模型名身份门槛纠正为仅二者都不可得时才因身份信息停止；当前 product_name=Cindy、model_name 不可得时继续形成产品绑定、模型未验证的可审计测试证据，同时禁止把它提升为固定模型可比性、operation residual、go/no-go 或 Helper 整体质量结论，并受控纠正旧 WorkCase 的错误关闭记录。
scope: 保留已提交的 v1 代码与 protocol/results/report 工件作为历史证据。仅允许修改 code/ldvh/testing/representative_task_retrial.py 与 code/tests/testing/test_representative_task_retrial.py，并新增 docs/metrics/representative-task-retrial-protocol-v2.json、docs/metrics/representative-task-retrial-results-v2.json、docs/metrics/representative-task-retrial-report-v2.md。新协议明确区分两层门槛：试验身份层仅在 product_name 与 model_name 同时不可得时因身份停止；事实 change_log 与 Git commit 层仍在每次写入/提交前重新取得 product/model/runtime 三字段快照，只有三项均不可得才停止相应写入或提交。当前 Cindy/模型不可得只允许 product-bound/model-unverified 证据，禁止固定模型评分、区间和 go/no-go。允许在不超过 42 次的上限内启动安全可审计的只读或隔离代表性 attempts，逐项记录 planned、started、completed、retained、excluded 与 family evidence_unavailable；runner/session trace/fixture 能力不可得时如实记录能力缺口，不伪造 attempts 或 retained，也不回退成 model-missing 的零尝试身份停止。通过专属 Helper 对 closed WorkCase workcase-01M0579NAPFVTT5PFJM9KNYBVA 做最小事实更正：旧对象保持 closed 与 closure_outcome=completed，完整保留原 v1 scope、五项 success criterion definitions/results、技术 metrics/hashes、Spark suggestion、relations 和全部既有 change_log；只把 disposition_summary 改为“当前记录所称 Gate 2 授权仅来自 UI 回包，Human 现明确否认曾作出该文字授权；closed/completed 技术分类不得解释为 Human 已接受 Gate 2。”，并由 Helper 严格追加一条新更正日志。旧对象不新增 routed-to、residual responsibility 或 relation；本 WorkCase 独立承接后续 v2 责任，现有从本 WorkCase 指向旧对象的单向 related-to 已足够。更正必须基于旧对象完整 closed after、源指纹、实际独立复核和 Human 对该精确语义的明确普通聊天文字决定。当前其它事实零 trial 写入。明确排除修改生产 Helper、Specs、09、Web、Schema、MCP、其它事实对象、网络/外部消息、依赖安装、push、PR、release、deploy、历史重写与归属不明文件清理。
success_criterion_definitions:
- criterion_id: criterion-identity-rule
  statement: 实现和 v2 协议均证明：试验身份层只有 product_name 与 model_name 同时不可得才产生身份硬停止；当前 Cindy/null 不因模型单独不可得而停止，且事实写入/提交的三字段署名门槛保持独立、不被混同。
- criterion_id: criterion-safety-boundary
  statement: model_name 不可得的任何记录均显式为 product-bound/model-unverified，不进入 fixed-model comparable、operation residual、统计区间或 go/no-go；runner、entrypoint、permission、prompt、fixture、事件证据、隐私和当前事实零写入等其它守卫继续失败关闭。
- criterion_id: criterion-execution-evidence
  statement: 目标和复用测试实际执行并报告；代表性 attempts 在不超过 42 次上限内按 planned/started/completed/retained/excluded 逐项记账，各 family 的 evidence_unavailable 精确披露，既不伪造启动/保留数量，也不把 trace/fixture 能力缺口改写成模型单独不可得导致的身份停止。
- criterion_id: criterion-history-correction
  statement: v1 代码与工件不覆写；旧 closed WorkCase 仅经 correct-closed-workcase 在完整 after、源指纹、独立复核和 Human 明确普通聊天文字决定成立后做最小更正：保持 closed/completed 并保留原 v1 scope、五项标准定义/结果、技术证据、Spark suggestion、relations 与全部既有 change_log，只改 disposition_summary 并严格追加一条新日志，不新增 routed-to、residual responsibility 或 relation。
- criterion_id: criterion-v2-report
  statement: v2 protocol/results/report 具有可复核 hash 与隐私边界，明确 product_name=Cindy、model_name unavailable、实际 attempts/retained/exclusions 以及能证明和不能证明的范围，不形成生产改造授权。
phase: human_closure_confirming
plan_version: 2
work_items:
- item_id: item-closed-record-correction
  goal: 形成并执行旧 closed WorkCase 的最小合规事实更正。
  expected_result: 旧 WorkCase 的完整 after 保持 closed 与 closure_outcome=completed，原 v1 scope、五项标准定义/结果、技术 metrics/hashes、Spark suggestion、relations 和全部既有 change_log 原样保留；仅 disposition_summary 澄清 UI 回包不是 Human Gate 2 文字授权，并由 Helper 追加一条更正日志；不写 routed-to、residual 或新 relation。
  status: completed
  approach_summary: 以源指纹 dacafd9a3ced20a7bdc734f725242c05360cdc3283b1fffeb4645c6b87100e9d 的完整 closed 当前快照形成 after，逐字段验证除 disposition_summary 与严格追加的 change_log 外均保持；取得独立复核和 Human 对该精确语义的普通聊天文字批准后才调用专属 Helper。不重开、不直接编辑 ldvh-base。
  result_summary: 已通过 correct-closed-workcase 对源指纹 dacafd9a…e9d 完成最小更正，写后指纹 b032ca0e8ddf67d354e6c4c63b056e141ded2e50ae533e3e94c864bbe41f5a03；旧对象保持 closed/completed，17 条旧日志、v1 历史、Spark suggestion 与 related-to 原样保留，仅 disposition_summary 变化并追加第 18 条澄清日志，route_target_fingerprints=[]。
- item_id: item-protocol-v2
  goal: 冻结修正身份门槛和结论边界的 v2 协议。
  expected_result: 新增 protocol v2 并 hash 绑定：Cindy/null 进入 product-bound/model-unverified；product/model 同时 null 才身份停止；其它安全守卫独立；v1 保持不变。
  status: completed
  result_summary: protocol-v2 已冻结并校验：schema /2，18 frames、36 slots、42 attempts、最多 6 replacements；仅 product_name 与 model_name 同时不可得才身份停止。当前 Cindy/null 进入 product-bound/model-unverified，禁止 fixed-model comparability、operation residual、CI 与 go/no-go。canonical SHA-256=42a8e371b652d89938021084afc96ed232adbc6f47a6f1708e1251e7791c207d；v1 文件未改。
- item_id: item-tooling-tests
  goal: 实现身份分层、披露和不可评分分支并补齐直接测试。
  expected_result: 模块与直接测试覆盖完整模型身份、仅产品可得、产品/模型均不可得、carrier drift、事件/fixture 缺口、隐私、hash 和当前事实零写入；产品绑定记录永不产生评分或 go/no-go。
  status: completed
  depends_on:
  - item-protocol-v2
  result_summary: 实现 v1/v2 schema 分派、RunnerPreflight 的 model_bound/product_bound/unavailable 身份分层、product-bound canonical fingerprint 与 disclosures、v2 attempt ledger 连续索引/receipt/fact-zero-write/replacement 校验，以及 model_unverified 结果分支；产品绑定分支不产生 fixed-model scoring、CI、operation residual 或 go/no-go。直接测试 16 passed；目标与复用模块 101 passed；Ruff、git diff --check 通过；v1 三工件未改。
- item_id: item-representative-retest
  goal: 在当前安全能力边界内重新执行代表性 Helper 测试。
  expected_result: 不超过 42 次 actual attempts；对每个 family 如实记录 planned/started/completed/retained/excluded 与 evidence_unavailable，当前 Cindy/null 不在 attempt 1 前因模型单独不可得而停止，且没有不可审计证据被伪造成 retained 或 fixed-model 可比。
  status: completed
  depends_on:
  - item-tooling-tests
  approach_summary: 只读任务使用精确当前快照；状态变化任务仅在可证明隔离且受控的 fixture 中执行。session trace 或隔离 fixture 能力不足时记录实际缺口并停止受影响 attempt，不触碰当前其它事实。
  result_summary: 已按冻结 schedule 实际启动连续 slots 1–3 共 3 次 attempts：read-01 completed 且唯一命中目标 Spark；fact-update-01 与 workcase-update-01 均因无法证明隔离受管 fixture 而 aborted_before_target。三次前后当前 WorkCase 指纹均为 4955b48d…b1c6，state-change guard 通过；receipt SHA-256 分别为 46a3e718…50a0、b58be391…b9b、0b427233…974。产品身份 Cindy 可得、模型身份不可得，故 3 次全部 excluded、0 retained，只形成 product-bound/model-unverified 描述性证据，不评分、不生成 CI 或 go/no-go。
- item_id: item-v2-report
  goal: 形成产品绑定、模型未验证的 v2 结果与报告。
  expected_result: results/report v2 绑定 protocol hash，报告真实 attempts/retained/exclusions、三类 family 状态和证据缺口，明确不证明模型固定、跨模型可比、operation residual、因果/业务收益或 Helper 整体质量。
  status: completed
  depends_on:
  - item-representative-retest
  result_summary: 已新增并复核 v2 protocol/results/report：protocol canonical SHA-256=42a8e371b652d89938021084afc96ed232adbc6f47a6f1708e1251e7791c207d（file=518dfdea…1614）；results payload=e51954af…a05、file=290a1ad7…557；report file=48ff3ea6…686。结果为 product_bound/model_unverified、3 attempts/0 retained；三类 family 均显式 model_unverified，attempt ledger 逐项披露 1 completed/2 aborted_before_target、排除原因和 evidence_unavailable。无 fixed-model scoring、operation residual、CI 或 go/no-go。101 个目标/复用测试、Ruff、git diff --check、schema/hash/privacy 与报告确定性重渲染均通过；v1 三工件未改。
execution_authorization:
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-delegation
    result_review_action_id: authorization-result-review
  authorized_actions:
  - action_id: authorization-v2-files
    summary: 修改两处已有复验代码/测试并新增三个 v2 metrics 工件，保留 v1。
    target_scope: 仅 code/ldvh/testing/representative_task_retrial.py、code/tests/testing/test_representative_task_retrial.py、docs/metrics/representative-task-retrial-protocol-v2.json、docs/metrics/representative-task-retrial-results-v2.json、docs/metrics/representative-task-retrial-report-v2.md。
    effect_scope: 允许修改前两文件并创建后三文件；禁止覆写 v1 或修改其它代码、规则、事实和文档。
    risk_summary: 身份分层可能误把 model=null 提升为固定模型可比，或 artifact schema/hash 与实现错位。
    rollback_summary: 仅撤销可证明属于本 WorkCase 的列明普通文件；事实和提交不以直接文件恢复或历史重写伪造回滚。
    rule_refs:
    - workcase-fact-type::6.5 执行授权基线
    - code-engineering-practices::测试与证据边界
  - action_id: authorization-representative-attempts
    summary: 执行有上限的只读或可证明隔离的代表性 Helper attempts。
    target_scope: 最多 42 个一次一任务 attempts；只读当前快照或本次创建且身份/realpath 可核对的隔离 fixture；不得写当前其它事实。
    effect_scope: 允许启动、观察和记录 planned/started/completed/retained/excluded；能力不足时只记录 evidence_unavailable 并停止受影响 attempt。
    risk_summary: session trace、隔离或身份观察不足会使证据不可评分；误用当前事实会造成污染。
    rollback_summary: 只清理可证明归属本次的临时工件；不确定时保留最小脱敏现场并停止，不改当前事实。
    rule_refs:
    - workcase-approved-plan-execution::临时工件与失败关闭
    - fact-model-foundation::受控事实写入边界
  - action_id: authorization-closed-correction
    summary: 受控澄清旧 closed WorkCase 的 Gate 2 授权记录，不改变 v1 技术完成分类。
    target_scope: 仅 workcase-01M0579NAPFVTT5PFJM9KNYBVA 当前指纹 dacafd9a3ced20a7bdc734f725242c05360cdc3283b1fffeb4645c6b87100e9d 的完整 closed after；route_target_fingerprints=[]。
    effect_scope: 仅在完整 after、源指纹、实际独立复核与 Human 明确普通聊天文字决定成立后调用 correct-closed-workcase；保持 closed/completed，原 v1 scope、criteria definitions/results、技术 metrics/hashes、Spark suggestion、relations 与全部既有 change_log 原样保留；只改 disposition_summary 并由 Helper 严格追加一条更正日志；不新增 routed-to、residual responsibility 或 relation。
    risk_summary: 若改动旧技术完成分类、删除旧日志或回写后来形成的 v2 责任，就会把后来事实冒充原关闭事实；本次更正只能澄清Human Gate 2 未获文字授权，且不能声称历史已恢复。
    rollback_summary: 不直接恢复 YAML；失败保持最近已精确回读的合法状态。成功后仍不能删除旧错误日志，只能按新事实再次走专属 Helper。
    rule_refs:
    - workcase-fact-type::correct-closed-workcase 输入与结果
    - fact-object-lifecycle-change::closed 终态更正
  - action_id: authorization-delegation
    summary: 创建有界 trial 与只读 reviewer subagents。
    target_scope: 最多 42 个一次一任务 trial subagents、旧 closed 更正的一次只读复核、当前 result_version 的一次只读结果复核。
    effect_scope: trial 仅只读或在授权隔离 fixture 内行动；reviewer 只读；禁止网络、外部消息、安装、远端 Git、当前其它事实和范围外文件写入。
    risk_summary: subagent 上下文和模型不可证明一致，相关证据只能按实际 identity_scope 使用。
    rollback_summary: 发现越界或漂移立即停止后续委派；模型输出不可回滚，只保留脱敏结果和缺口。
    rule_refs:
    - workcase-fact-type::4.4 受控创建
    - workcase-approved-plan-execution::委派边界
  - action_id: authorization-result-review
    summary: 对 canonical result projection 执行实际独立只读复核。
    target_scope: 仅本 WorkCase 当前 result_version、v2 protocol/results/report hash、diff 与验证摘要。
    effect_scope: 只读反馈，无文件/事实/网络副作用；Reviewer 不推进 phase、不修改结果、不替代 Controller 或 Human。
    risk_summary: 只读复核可能遗漏问题，不证明环境级独立。
    rollback_summary: 无状态副作用；需要 fresh review 时新增事件，不覆盖旧结论。
    rule_refs:
    - workcase-fact-type::6.5 质量关口
  - action_id: authorization-workcase-lifecycle
    summary: 仅通过 Helper 记录本 WorkCase 自身的执行、结果和关闭准备事实。
    target_scope: 仅本 WorkCase canonical 对象。
    effect_scope: 按当前 WorkCase 规则与 CAS 更新；禁止直接编辑 ldvh-base。
    risk_summary: 错误写回会造成生命周期失真。
    rollback_summary: 事实不直接文件回滚；失败时停在最近合法回读并受控收敛。
    rule_refs:
    - workcase-fact-type::7. AI 写回与受控操作
  - action_id: authorization-local-commit
    summary: 在全部验证、事实审计和精确 diff 审核后创建一次不 push 的本地 commit。
    target_scope: 仅五个 v2 代码/测试/metrics 路径、本 WorkCase canonical 文件，以及经 authorization-closed-correction 实际形成并精确回读的旧 WorkCase canonical 文件。
    effect_scope: 允许一次本地 stage/commit并触发真实 commit-msg Gate；禁止 push、PR、release、deploy、amend、reset、rebase 或其它历史重写。
    risk_summary: 错误 Index 可能带入无关 diff，提交不自动证明语义正确。
    rollback_summary: 提交后不改写历史；需要修正必须另行取得新受控提交授权。
    rule_refs:
    - git-commit-action-template
    - source-of-truth-traceability::Git Gate
  action_ceiling: 仅影响精确列明的五个 v2 普通文件、新旧两个 WorkCase 的授权事实变化、本次可证明归属的临时工件、最多 42 次 attempts 与一次不 push 本地 commit。
  prohibited_actions:
  - 覆写 v1 protocol/results/report 或删除历史证据
  - 修改生产 Helper、Specs、09、Web、Schema、MCP 或未列明普通文件
  - 直接编辑 ldvh-base 或写当前其它事实对象
  - 把 model=null 或 evidence_unavailable 纳入 fixed-model 评分、CI 或 go/no-go
  - 伪造 planned/started/completed/retained/excluded 数量或 session trace
  - 安装依赖、访问网络、发送外部消息或调用外部系统
  - restore/reset/rebase/amend、删除归属不明内容或改写 Git 历史
  - push、PR、release 或 deploy
  - 在旧 WorkCase 写入 v2 新责任、routed-to、residual responsibility 或新 relation，或删除/改写其既有 change_log
  - 使用隐藏 UI 回包或 Reviewer 结论推定 Human Gate 1、旧 closed 精确更正决定或新 WorkCase Gate 2
  allowed_adjustments: v2 protocol 冻结前可在不改变两层身份门槛、精确文件范围、42 次上限、model-unverified 禁止评分、当前其它事实零写入和风险上限的前提下修正文案、字段和测试组织；冻结后不得修改身份规则、排除、阈值、隐私或证据口径。
  verification_and_rollback: 运行直接/目标/复用测试、Ruff、git diff --check、v1 不变检查、v2 hash/schema/privacy 校验、attempt ledger 一致性、当前事实指纹检查；旧 WC 更正逐字段验证仅 disposition_summary 与严格追加的一条 change_log 变化，route_target_fingerprints=[]；每次事实写后公开精确回读并要求 check-fact-integrity 外层 outcome=ok/result.status=complete；提交另过 precheck 与真实 commit-msg Gate。失败停在最近合法状态，只撤销可证明归属的普通文件，不直接回滚事实或改写历史。
  out_of_bounds_handling: 发现未授权路径、旧 closed 完整 after/独立复核/Human 普通文字决定不成立、旧历史字段将被改变、隔离或 trace 不可审计、新风险、基线变化或关键指标不可得时，不执行或停止受影响动作，按实际取消、记录 evidence_unavailable 或安全收敛；不在执行中索取扩权，不把缺口写成成功。
