summary: "**当前定位**\n\n- 这是 P2 级未来发展方向，不是当前版本的成熟度缺口，也不要求立即形成 WorkCase。\n- 当前多项目登记、单项目选择、身份绑定和隔离能力可以继续独立使用；是否增加聚合与联动，须由未来真实规模、协作频率和 Human 产品决定驱动。\n\n**可继续评估的方向**\n\n- 多项目只读聚合：在 Web 或 CLI 中汇总已验证项目的信息，同时逐项保留项目归属、`projectId@objectId` 身份、覆盖范围、观察时间和局部失败，不把部分读取表达为全局完整。\n- 跨项目导航与联动：允许从一个项目的信息明确跳转到另一项目的稳定对象或视图；是否进一步支持正式跨项目关系，必须先定义授权、缺失目标、循环、失败和审计语义。\n- 配置便利层：评估默认工作区、默认项目或用户级指针的净价值及冲突规则，但不建立第二份管辖主登记或第二事实源。\n- Helper 与可观察性：评估跨项目只读汇总、批量状态观察及各项目 Git Hook/Gate 状态总览；各结果仍需保留实际项目、worktree、common-dir 与独立失败边界。\n- 协作场景：关注同号对象消歧、跨项目依赖发现、组合看板、多个项目共同交付时的进展对照，以及一个项目不可用时其它项目能否安全继续呈现。\n\n**明确排除**\n\n- 本 Spark 不承诺当前实现“全部项目”页面、跨项目关系、跨项目写入、联合事务或联合 Git Gate。\n- 在新规则和授权成立前，事实写入、关系校验、完整性审计和 Git Gate 继续严格绑定单一项目及实际 worktree；不得用聚合读取弱化隔离。\n- 不把项目注册存在、单项目切换或某个聚合视图单独视为跨项目联动闭环。\n\n**未来启动条件**\n\n当真实多项目使用显示频繁切换和重复定位已造成稳定成本，且能够明确只读聚合范围、身份模型、授权边界、局部失败语义与验证方案时，再拆分为具体 Study、ADR 或 WorkCase。"
