adr_id: "001"
title: "将 ldvh-base 目录提升至工作区根目录"
status: superseded
created: 2026-05-31
updated: 2026-05-31
context: |
  ldvh-base 原位于 ld-vibe-harness/ldvh-base/，但其内容（changes、adrs 等）
  关联到每个管辖项目，不仅限于 ld-vibe-harness。放在项目内部导致其他项目
  无法自然访问。
decision: |
  将 ldvh-base/ 从 ld-vibe-harness/ldvh-base/ 移动到工作区根目录
  /Users/dmh2002/trae_projects/ldvh-base/，与 L0 规则同层级。
consequences: |
  - 所有项目均可通过工作区根目录访问 ldvh-base
  - 需更新所有引用 ldvh-base 路径的文档
  - ADR 索引工具路径需相应调整
affects:
  - ldvh-base/
  - ld-vibe-harness/specs/
related_rules:
  - specs/13-LDVH生产对象基础规范.md
  - specs/11.01-Rules机制规范.md
superseded_by: "002"
