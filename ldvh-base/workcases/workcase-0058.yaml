status: closed
title: 消除单文件提交消息的正文省略捷径
goal: 把所有受管辖新提交的消息最低要求收敛为不可按文件数省略的普遍机械基线：准确 header、唯一 `关键变更:` 标题、其下至少一个符合规范选定语法的非空列表项以及必要 trailers；breaking 等条件只追加要求。由当前规则投影驱动同一 validator，使 Helper 预检与真实 commit-msg Hook 对单文件提交也执行一致、清晰、不可静默降级的机械阻断，同时保持真实性与充分性由 AI 语义审核。
scope: 规范先行，最小修订 specs/03 §9.4–§9.5 与 specs/attachments/03.Att.01：把最低正文定义为所有受管辖新 commit 的普遍不变量，并形成 `all-commits-minimum-body`（最终稳定名称以规范为准）的唯一机械投影；breaking-marker 只追加 `影响边界:`，审查并退役或重述 multiple-paths/revert-type 的旧正文责任，高影响等非机械条件只保留按实际需要补充上下文的语义要求。同步修改 code/ldvh/commits/contract_source.py、validation.py 及其直接测试，确保 validator 消费规则投影而非另写第二份触发规则；定义每个已出现固定标题的唯一性和非空要求、未知标题边界、列表语法、trailers 边界及一次性可行动诊断。覆盖 validator、Helper precheck、native commit-msg gate、临时仓库安装 Hook 后的真实 git commit 正反事件和全部有效消息 fixture 迁移，并验证事实候选、footer、真实 Index 隔离等既有边界不回归。通过 Helper 修正 spark-0019 中可能暗示单文件可省正文的表述；specs/30 仅在直接引用确需对齐时最小修改，不复制 03 权威。当前 common-dir Hook 只做静态只读复核；因其指向 v4 源码 launcher，预期无需部署或替换，但必须以真实事件验证。排除历史 commit 迁移、Hook 部署/替换、core.hooksPath 变更、pip/打包/插件、push/PR、历史改写及任何无关 dirty 文件。Gate 1 后允许一次仅含精确候选的本地原生 git commit，不使用 --no-verify。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 03 与 03.Att.01 明确所有受管辖新 commit 的普遍最低正文不变量，文件数、revert 与普通非 breaking 类型均不能成为省略正文的理由；breaking 等只追加要求，旧提交不追溯迁移，30 不形成第二权威。
- criterion_id: criterion-02
  statement: contract_source 从当前规则附件形成唯一机械投影并由 validator 实际消费；`all-commits-minimum-body` 缺失、重复、未知或顺序异常时 fail-closed，不在 validation.py 另写一套与规则脱节的 trigger 真相。
- criterion_id: criterion-03
  statement: 任何提交缺少唯一 `关键变更:`、其下符合选定语法的非空列表项或必要 trailers 时均机械失败；每个出现的固定标题必须唯一且结构非空，未知标题的停止/归属边界明确，列表不得跨未知标题、其它固定标题或 trailer 区域被误认。真实性与语义充分性仍明确由 AI 审核，Hook 不冒充内容审查。
- criterion_id: criterion-04
  statement: 错误诊断一次性列出当次可机械发现的全部缺失结构；Helper 与真实 Hook 使用稳定 `validation/<code>` 和可行动中文说明。breaking 无正文时不得要求 AI 修一处后才发现下一处。
- criterion_id: criterion-05
  statement: 测试矩阵覆盖单路径非 breaking 的无正文阻断与最小正文放行，以及空/重复标题、空白列表项、错误标题归属、未知标题、trailers 后伪正文、CRLF、Git 注释、breaking、revert、多路径和所选列表 marker 的正反例；所有现有有效 message fixture 有意迁移。
- criterion_id: criterion-06
  statement: Helper precheck、native gate 与安装后的真实 commit-msg Hook 对同一单文件消息给出一致结论；真实 git commit 中无正文案例被阻断且 HEAD 不变、staged 内容保留、stderr 可定位，最小正文案例放行；facts/footer/Session-ID、候选快照和真实 Index 边界不回归。
- criterion_id: criterion-07
  statement: 静态复核当前 common-dir Hook 仍为 managed、可执行并指向 v4 源码 launcher；本案不部署、不替换 Hook。定向与全量相关回归、事实完整性、diff 检查和独立结果复核通过；若执行本地提交，精确候选经 diff 审核、precheck 通过、真实 Hook 被触发，且不误带、不 push。
success_criterion_results:
- criterion_id: criterion-01
  outcome: satisfied
  summary: 03 §9.4–§9.5 与 03.Att.01 已把所有受管辖新 commit 的唯一关键变更非空列表和 trailers 设为普遍最低基线；单路径、revert 与普通非 breaking 均无省略捷径，breaking 只追加影响边界，旧提交不迁移且 30 未复制权威。
- criterion_id: criterion-02
  outcome: satisfied
  summary: contract_source 从当前附件投影 exact trigger 闭集与顺序，缺失、重复、未知、非法 mechanical 值和乱序均 fail-closed；validator 消费 all-commits-minimum-body 与 breaking-marker 投影，已移除按路径数和 revert 硬编码触发。
- criterion_id: criterion-03
  outcome: satisfied
  summary: validator 对所有非空消息检查唯一关键变更、非空行首 - 列表、固定标题唯一与非空、未知标题闭集和最终 trailer 边界；breaking 追加唯一非空影响边界。规范明确真实性与充分性仍由 AI 审核，Hook 仅作机械审查。
- criterion_id: criterion-04
  outcome: satisfied
  summary: 缺少正文一次返回 body_required 与 key_changes_required；breaking 无正文同时返回 impact_boundary_required。独立审核发现非法 header 会跳过独立结构诊断后，已修正为同时报告 header、body、关键变更与署名 trailer 缺陷，Reviewer 复审确认关闭。
- criterion_id: criterion-05
  outcome: satisfied
  summary: 测试覆盖单路径最小正文、revert、多路径、breaking、空白/重复/未知标题、跨标题归属、空列表、trailers 后正文、CRLF、Git 注释、Helper/native gate 与真实安装 Hook；全部有效 fixture 已显式迁移。
- criterion_id: criterion-06
  outcome: satisfied
  summary: Helper precheck、native gate 与安装后的真实 commit-msg Hook 使用同一 validator；临时仓库无正文提交被 block 且 HEAD 不变、staged 保留、stderr 含稳定 validation/code 与中文提示，最小正文提交 allow。真实本地提交再次通过同一 Hook。
- criterion_id: criterion-07
  outcome: satisfied
  summary: 当前 common-dir Hook 静态 inspect 为 managed、文件可执行并指向 v4 源码 launcher，本案未部署或替换 Hook。全量回归 1409 passed、10 项原生 Windows 条件测试 skipped；ruff、format、diff、145 对象事实完整性、独立提交前复审和提交后回读均通过。commit e96e5a0d6ce22dca9cf357b1ea072d17f454e4f4 精确含 11 个候选，未 push。
result_summary: 所有受管辖新提交现在都必须通过同一规则驱动的最低正文机械闸门：准确 header、唯一关键变更标题、至少一个非空行首列表项和必要 trailers；breaking 额外要求影响边界。Helper 预检与真实 commit-msg Hook 共享 validator，未知、重复、空标题及非法 header 下的独立缺陷均可一次性诊断。规范、投影、实现、测试、Spark 和 WorkCase 已由本地 commit e96e5a0d6ce22dca9cf357b1ea072d17f454e4f4 固定；该 commit 精确包含 11 个获批文件，真实 Hook 已执行，Index 提交后为空，无关改动未误带且未 push。提交后的 WorkCase 结果生命周期写回是当前未提交的本案事实残留。
validation_summary: 修补后的全量 pytest 为 1409 passed、10 skipped，跳过项全部要求原生 Windows；相关扩展回归 250 passed，非法 header 聚合修正后的定向回归 73 passed。Ruff check 与 format --check、git diff --check、145 个事实对象完整性检查均通过。临时仓库真实 Hook allow/block 事件通过；当前共享 Hook 为 managed、可执行并指向 v4 launcher，未部署或替换。最终真实 Index precheck mechanical_outcome=passed，快照 sha256:0cdf40832610d131588f0603b2d57cc9f85296b8a35a7934ec792ced9c0c6ea4；Git trace 明确调用 commit-msg Hook。commit e96e5a0d6ce22dca9cf357b1ea072d17f454e4f4 的 message、11 路径、空 Index和剩余无关工作树已回读；未 push。非 Windows 环境未执行 10 项原生 Windows 测试。
