type: change
title: specs 文档章节编号统一规则
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户确认先完成第一步，即先更新 `specs/03-Specs文档规范.md`，将 specs 全部 Markdown 文档的正文章节标题统一为阿拉伯数字层级编号要求。
  该规则覆盖正式规范文档、子文档、模型实践子文档、契约子文档、索引文档、`specs/evals/` 项目评估文档和 `specs/refs/` 外部资料引用文档。
decision: |
  更新 `specs/03-Specs文档规范.md`，明确 specs/ 目录内所有 Markdown 文档的正文章节标题应统一使用阿拉伯数字层级编号。
  明确一级章节使用 `## N. 标题`，二级章节使用 `### N.N 标题`，三级章节按需使用 `#### N.N.N 标题`。
  明确正文引用章节时统一使用 `§N`、`§N.N` 或 `§N.N.N`。
  明确同一文档内不得混用中文大写章节编号、罗马数字编号和阿拉伯数字章节编号。
  明确章节编号统一只约束文档结构和引用定位，不改变 `specs/evals/` 与 `specs/refs/` 的执行效力和事实源性质。
  同步更新 03 文档自身的章节索引、正文标题、文档骨架模板和文档写作检查项。
consequences: |
  - 后续新增或修改 specs/ 下 Markdown 文档时，应使用阿拉伯数字层级章节编号。
  - 后续迁移既有 specs 文档时，需要逐步统一正文标题编号，并同步检查章节引用。
  - `specs/evals/` 和 `specs/refs/` 只接受结构格式约束，不因章节编号统一而改变项目评估或外部资料引用的事实源性质。
affects:
  - specs/03-Specs文档规范.md
related_rules:
