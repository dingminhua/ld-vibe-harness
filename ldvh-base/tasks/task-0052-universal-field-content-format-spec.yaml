description: |
  ## 背景

  LDVH 事实对象 YAML 中，description、acceptance、verification、closure_evidence、notes 等长文本字段当前缺少统一的内容格式规范。AI 写入时不知道哪些字段可以写 Markdown、Web 不知道哪些字段应该走语义组件渲染、Validator 不知道哪些字段需要格式校验。

  ## 目标

  创建 docs/specs/05.01-工作字段内容格式规范.md，定义 LDVH 工作模型字段内容格式类型、字段映射、Tools 校验消费规则和 Web 语义化渲染消费规则。

  ## 边界

  - 不改变 ldvh-base/ YAML 事实源权威边界
  - 不引入外部 .md 正文引用机制
  - 不创建 Narrative / Checklist / Evidence 等独立工作模型
  - 不修改对象状态机或字段契约定义（仍由 21-27 各对象规范负责）
  - 如执行中发现需改变事实源边界，应另建 ADR
