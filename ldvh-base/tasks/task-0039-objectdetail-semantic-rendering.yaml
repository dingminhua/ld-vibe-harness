description: |
  将 ObjectDetail 页面的字段渲染从通用文本展示升级为语义化组件渲染，
  按 07-内容可读性深度研究 §3.2 定义的 6 类字段组件实现：
  - ChecklistCard：acceptance 字段，显示完成比例和每项状态
  - ReferenceCard：blocked_by、source_intent、parent_task，显示对象 ID、标题、状态
  - SummaryText：description、context、consequences 等长文本，默认摘要可展开
  - DocPreviewLink：related_docs，点击触发右侧扩展区预览
  - EvidenceBlock：closure_evidence，突出验证命令、文件路径和结果
  - 折叠代码块：YAML source 保持现有折叠行为
  Task 视图优先展示 acceptance、blocked_by、related_docs 字段。
