title: WorkCase 执行阶段两个设计缺口：item 状态更新易遗漏与阶段 Goal 未有效防中途停下
status: implemented
intent: Human 观察到两个重复出现的执行阶段问题：(1) 推进 WorkCase 时 item 状态（pending/in_progress/completed）容易被忘记更新，导致 WorkCase 的 work_items 不反映实际进展，而完整 fact_object 替代式写入不检测 item 状态是否已变，item_event 路径又太窄且只限 executing 阶段；(2) 虽已在 specs/31 和 specs/34 中定义了非持久化环境阶段 Goal 概念，但规范用「可」(may) 而非「必须」(must)，且无 Code 自动创建阶段 Goal，导致 Gate 1 获批后 AI 仍可在中途停下而不被阻止。需要系统分析两个缺口的设计遗漏并确定改进方向。
disposition_summary: 本 Spark 的三个待判断问题（缺口一改进方向、缺口二改进方向、公共根因与是否统一解决）已由 workcase-01M0AVJD0XFK6APB33SMGQR6CZ 在其范围内直接落实并关闭（closure_outcome=completed）。该 WorkCase 不表示规范正文已修订或 Code 已改——后续修订由新建 WorkCase/Spark 承接（closed WC 保留 follow_up spark suggestion）。
summary: "## 当前状态\n\nWorkCase 执行阶段两个设计缺口的分析已由 workcase-01M0AVJD0XFK6APB33SMGQR6CZ（已关闭，closure_outcome=completed）完整承接并落实。\n\n### 核心结论\n\n**缺口一（item 状态更新易遗漏）**：根因为 item_event 与 fact_object 路径覆盖不对等。采纳改进：complete-work-item 同事务投影 executing→controller_checking（高优先级）、增加 cancel-work-item 事件（中优先级）、行为清单条目（中）、漂移提示不阻断（低）。\n\n**缺口二（阶段 Goal 未防中途停下）**：根因为阶段 Goal 作为非持久化环境能力无法机械强制。采纳改进：投影增加 stage_goal_status 观察字段（中优先级）、行为约束升级为\"应尝试并记录\"（低）。排除 may→must、Goal 存在预检、Stop gate 联动（破坏 fail-open/宿主中立）。\n\n**公共根因**：机械层与行为层覆盖缝隙。不统一解决（破坏各自设计前提），但同原则分别补强——机械层增可见性不阻断，行为层增约束强度。\n\n### 后续\n\n统一改进清单 6 项已形成，closed WC 保留 follow_up_opportunity spark suggestion，建议新建 WorkCase/Spark 承接规范正文与 Code 修订。分析文档见 docs/workcase-design-gap-analysis/。\n\n## 边界\n\n- 不修改 WorkCase 状态机、事实 Schema 或投影的基本设计\n- 保持宿主中立，不要求宿主专用 API 名称进入规范正文"
