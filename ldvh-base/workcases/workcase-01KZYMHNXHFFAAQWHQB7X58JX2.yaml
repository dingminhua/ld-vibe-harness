status: closed
title: 规则精确读取任务族等价复验（WFPQDZ 延续）
goal: 以 session_comparability 模块的执行可比性判定为评分前门槛，在等价执行载体（同一模型、同一工具入口、同一 runner）下复验规则精确读取任务族（WFPQDZ 延续）：评分管线直接消费机器记录，每个任务与条件增加重复样本，先过 comparable 判定，再判断 required 缺失与 excluded 增加是否形成可重复且有实际幅度的差异。
scope: 复用 rule_read_contract.py 已冻结的 contract（SHA-256 1f4fc351…）、任务、rubric 与三变体协议，以及 trial_measurement.py 的 SafeTrialTempRoot 与通用测量设施；在 code/ldvh/testing 下新增等价复验 runner 与机器化评分模块及聚焦测试；集成 session_comparability 的可比性判定作为评分前门槛。排除：修改正式规则语义、行动模板、Helper 公共契约；建立健康分、遥测、Dashboard 或告警；Git commit、push、release；其他执行中 WorkCase 的事实文件和作用范围；上游 Spark 的任何写入；不保存原始会话/试次内容（只进受限临时根）。
success_criterion_definitions:
- criterion_id: criterion-carrier
  statement: 等价执行载体冻结并验证：复验使用同一模型、同一工具入口、同一 runner；每个试次的执行可比性经 session_comparability 判定为 comparable 后才进入评分，载体不一致标 not_comparable 且不进入比较。
- criterion_id: criterion-protocol
  statement: 复验沿用 WFPQDZ 冻结的 contract（指纹 1f4fc351…）、任务与 rubric，三变体（full_contract/required_removed/irrelevant_added）协议不变；执行记录机器化（结构化事件而非自然语言转述）。
- criterion_id: criterion-samples
  statement: 每个任务 × 条件至少 3 个重复样本（3 任务 × 3 变体 × ≥3 样本）；样本归属、载体指纹与可比性判定随机器记录保存。
- criterion_id: criterion-scoring
  statement: 评分管线直接消费机器记录（调用、响应、事件图、可比性判定），不依赖自然语言转述；评分一致性经独立复核或客观 rubric 检查。
- criterion_id: criterion-judgement
  statement: 先过执行可比性门槛再判断上下文效果：comparable 样本才进入 required 缺失/excluded 增加差异比较；样本不足或不可比时只报告不确定，不形成'有帮助/过量'结论；结果与 Study 一致区分证据层级，不写因果结论或总体服务改善证据。
success_criterion_results:
- criterion_id: criterion-carrier
  outcome: satisfied
  summary: 等价执行载体冻结机制与 session_comparability 可比性门槛已交付并验证：每试次机器事件线经 audit_events+judge_comparability 判定，多模型/配对缺失标 not_comparable 且不进入评分。
- criterion_id: criterion-protocol
  outcome: satisfied
  summary: 复验沿用 WFPQDZ 冻结 contract 指纹 1f4fc351…、三变体（full_contract/required_removed/irrelevant_added）与任务包哈希绑定；执行记录为结构化机器事件线，非自然语言转述。
- criterion_id: criterion-samples
  outcome: not_verified
  summary: 真实 LLM 重复样本试跑未执行：当前会话载体不稳定（实测会话存在模型切换），无法保证同一模型/工具入口跨试次；以真实会话事件线做了 3 样本管道验证，但不等价于冻结载体的重复试跑。
- criterion_id: criterion-scoring
  outcome: satisfied
  summary: 评分管线 assess_trial/summarize_batch 直接消费机器记录（rubric 谓词评估 + claim_boundary），14 项聚焦测试 + 复用边界 233 passed + Ruff passed；真实会话汇总输出正确。
- criterion_id: criterion-judgement
  outcome: satisfied
  summary: 先过可比性门槛再评分；真实 LLM 等价试跑条件不成立时如实报告不确定，未形成'有帮助/过量'或因果/总体改善结论；claim_boundary 与证据层级边界保持。
result_summary: 交付等价复验 runner、session_comparability 可比性门槛集成与机器化评分管线（equivalence_retrial.py + 14 项测试，复用边界 233 passed + Ruff passed），并经真实会话事件线验证管道；真实 LLM 重复样本试跑因执行载体不稳定（模型切换）未执行，按停止边界如实报告，不构成因果或总体改善结论。
validation_summary: 14 项聚焦测试 passed；复用边界（code/tests/testing）233 passed；Ruff passed；真实会话事件线管道验证通过（1 comparable/2 not_comparable，claim_boundary 正确）；临时根已清理；criterion-samples 因载体不稳定未验证，如实记录不改写。
