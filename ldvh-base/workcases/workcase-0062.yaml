status: open
title: 独立审核语义定义——在 LDVH 规范层明确定义"独立审核"的判断视角独立性优先级
goal: "在 LDVH 规范层（21 号规范）明确定义「独立审核」的语义，使 AI 在 WC 执行期能够理解判断视角的独立性优先于执行环境的独立性，不再因字面理解「独立」而默认调用 subagent 导致执行卡住。"
scope: "含：21 号规范新增「独立审核」定义章节（覆盖语义：判断视角独立性优先于执行环境独立性；可接受执行方式闭集及其适用优先级：切换视角自审、checklist 审核、Helper 只读检查、委派一个或多个只读 subagent 并行复核——subagent 数量由 Controller 根据审核范围、复杂度和风险判断，不固定——且所有方式均为只读，不修改任何文件或状态；明确不可接受行为：冒充独立视角、虚假审核声明、没有可用的 subagent 能力时硬等不推进）；34 号模板中独立复核步骤说明与 21 号定义保持一致；spark-0061 承接范围据实记录。不含：任何 Code/tests 变更；phase 定义或状态机修改；Helper 操作新增或修改；Human Gate 流程修改；subagent/spawn 能力实现或声明。"
success_criterion_definitions:
- criterion_id: criterion-01
  statement: "21 号规范中存在可机械定位的「独立审核」定义条文，覆盖语义（判断视角独立性优先于执行环境独立性）、可接受执行方式闭集（切换视角自审、checklist 审核、Helper 只读检查、委派一个或多个只读 subagent 并行复核——subagent 数量由 Controller 根据审核范围、复杂度和风险判断，不固定——所有方式均为只读，不修改任何文件或状态）及适用优先级、不可接受行为（冒充独立视角、虚假审核声明、没有可用的 subagent 能力时硬等不推进）。"
- criterion_id: criterion-02
  statement: "34 号模板中独立结果复核步骤的说明与 21 号定义一致，不再暗含「必须委派 subagent」的默认假设。"
- criterion_id: criterion-03
  statement: spark-0061 承接范围据实记录（保持 open 并写明残留：subagent 环境能力声明与独立性证明机制需后续规范处理）。
- criterion_id: criterion-04
  statement: 修订经 30 模板受控提交、Git Gate 通过，commit 路径闭集仅含本 WorkCase 实际变更，提交后 check-fact-integrity 外层 ok 且 result.status=complete。
