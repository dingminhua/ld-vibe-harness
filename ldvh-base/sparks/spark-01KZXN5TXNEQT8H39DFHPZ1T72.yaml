title: Helper 只读交互优化
status: implemented
intent: 承接 spark-0019 路由的模板内容重复传输问题（read-action-template-content 同时返回 content 与 source_content），以及更广泛的 Helper 只读操作（read-action-template-candidates、read-fact-objects、find-fact-object-candidates 等）的窄输出、自解释性和 AI 可消费性优化。后续需判断哪些只读操作的输出可以收缩为正常路径最窄定义、完整来源按需展开，以及失败诊断能否给出结构化修正提示。
summary: "## 已落实范围\n\n- 只读 `invalid_request` 响应已能给出缺失/无效字段与允许输入闭集等结构化修正提示，降低了依赖自然语言猜参的失败成本。\n- `read-action-template-content` 已移除 `content` 与完整 `source_content` 的重复传输；正常路径保留行动步骤、Human Gate 与 Stop Conditions，完整同源规范继续按需经 `read-specification-content` L4 展开。\n- CLI 已交付 `--request`、`--example` 与 `--fields`，为请求文件化、来源绑定骨架和调用方结果投影提供机械辅助。\n- 40 会话固定模型对照显示 Phase 1 将目标只读任务中的 invalid-request 命中从 22 降到 0，但直接 Helper 调用数未下降，命令字符平均增加 151.1；该结果不支持继续对全部只读响应统一删减或增加孤立 flags。\n\n## 收口边界\n\n本 Spark 创建时明确提出的失败诊断、行动模板重复传输和只读交互机械辅助已由聚焦 WorkCase 直接落实，因此入口责任结束。未来若某个具体只读 operation 在可比较真实任务中出现稳定过量、额外规则回读或修复成本，将由“LDVH 面向 AI 的服务质量评估与持续改进”先判断证据幅度，再决定是否形成新的窄 WorkCase；普通 `related-to` 只用于追溯共同线索，不表示责任路由或该 P1 Spark 已完成。"
