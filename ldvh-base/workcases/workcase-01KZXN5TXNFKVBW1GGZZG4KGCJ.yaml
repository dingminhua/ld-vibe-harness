title: git Gate 事实机械校验与完整性校验一等化
status: closed
goal: 让 git commit-msg Gate 在 Index 候选包含事实布局内、object_id 合法且有暂存内容的 ldvh-base/ 路径时，对候选事实文件执行与事实读取同核（carriers、validate_fact_object、object_id 与文件名身份核对、内容指纹、大小预算）的机械校验，使 adr-0006 第三条既定的「事实完整性终闸」成立；同时将事实完整性机械校验一等化为 Helper 公开操作并合同化输出，供行动模板与 Skill 引用；在同一边界内完成 spark-0022 多人未同步 ID 冲突 Gate 的合并评估并给出归属结论。
scope: 覆盖 specs/03 §9 扩展（触发条件、校验层、结果并入 mechanical_outcome/issues、删除与改名状态语义）、specs/05（及必要时 04）公开操作登记、05 校验向 commits 链路投影复用、code/ldvh 的 commits/git_hooks/hooks/helper 与 facts 复用面、双入口同步、相应测试、spark-0022 与 spark-0039 受控写回。分寸约束（2026-07-31 Human 指令，机械承接）：校验严格限于当次 Index 候选中的事实文件；提交链路不做全库或全量验证；不引入全量测试默认要求；AI 侧验证声明按候选范围适度。排除：远端刷新型 ID 冲突 Gate 的实现（只评估归属）；语义审核进 Gate；全库扫描进提交链路；历史 commit 追溯；新增 console 入口与 pyproject 改动；spark-0039 其余待办项；specs/08、web/*、docs/ 并行会话文件；adr-0006 本文。
success_criterion_definitions:
- criterion_id: criterion-candidate-fact-validation
  statement: commit-msg Gate 对 Index 中有暂存内容的合法事实路径触发与事实读取同核校验：invalid 时 failed/block 且诊断精确到文件与失败项；删除、改名出布局不误报；无事实候选时零额外开销（惰性，不投影不读 blob，spy 可判定）。
- criterion_id: criterion-first-class-integrity
  statement: 事实完整性机械校验作为 Helper 公开操作在 specs/05 公开操作表登记，capabilities 可发现、可直调、输出合同化，行动模板与 Skill 可引用。
- criterion_id: criterion-id-conflict-boundary
  statement: spark-0022 多人未同步 ID 冲突 Gate 归属有明确结论（并入后续或保持 open 另立），其 evolution 补记评估过程。
- criterion_id: criterion-measured-scope
  statement: 提交链路（ldvh.commits/hooks/git_hooks）不引入全库扫描，由 import 边界测试机械判定；全库扫描只存在于独立的一等化入口。
- criterion_id: criterion-same-validator
  statement: Gate 与事实读取消费同一校验实现，无第二份 schema 解析逻辑；validator 保持纯函数；暂存 blob 由观察层按 Index oid（事件自身 GIT_INDEX_FILE）提供；双入口一致性与投影同步测试通过。
- criterion_id: criterion-tests-docs
  statement: specs/03 §9 与 specs/05 登记同钉住测试一致；specs/commits/git_hooks/hooks/helper/facts/docs 受影响测试集通过。
success_criterion_results:
- criterion_id: criterion-candidate-fact-validation
  outcome: satisfied
  summary: 03 §9.9 契约建立（4ccad7397）并由提交链路实现（8160630fc）：暂存合法事实路径触发与读取同核校验；端到端烟测非法候选 failed 且诊断精确到路径与字段、删除/改名出布局不误报、非法 object_id 拦 fact_object_id_invalid；零候选惰性由 spy 测试钉住（不投影不读 blob）。
- criterion_id: criterion-first-class-integrity
  outcome: satisfied
  summary: check-fact-integrity 已在 specs/05 §11 公开操作表登记并合同化输出（§11.9/§11.10，57a7bf897）；capabilities 可发现、真实库直调 outcome ok、status=complete、object_count=92；行动模板与 Skill 可正式引用。
- criterion_id: criterion-id-conflict-boundary
  outcome: satisfied
  summary: spark-0022 归属结论明确：保持 open 另立、本 WorkCase 不吸收；评估过程与三条理由已补记 evolution 并建立 related-to 关系（0d6d4834c）。
- criterion_id: criterion-measured-scope
  outcome: satisfied
  summary: 提交链路（ldvh.commits/hooks/git_hooks）不引入全库扫描，由 test_import_boundary.py import 边界测试机械判定；全库扫描只存在于独立一等化入口 check-fact-integrity。
- criterion_id: criterion-same-validator
  outcome: satisfied
  summary: facts/content.py 为单一同核校验实现，repository.py（读取）与 commits/validation.py（Gate）共同消费，无第二份 schema 解析；validator 保持纯函数；暂存 blob 由观察层按 Index oid（GIT_INDEX_FILE）提供；双入口一致性与投影同步测试通过。
- criterion_id: criterion-tests-docs
  outcome: satisfied
  summary: specs/03 §9 与 specs/05 登记同钉住测试一致；受影响测试集全过：facts 423、commits+hooks+git_hooks 111、helper 411+、specs+testing 221、validator 26、integrity 操作 5 例。
result_summary: 交付六项：①specs/03 §9.9 事实候选机械校验契约（4ccad7397）；②提交链路同核消费：新建 code/ldvh/facts/content.py 纯同核、repository.py 重构消费、commits/validation.py 增加事实层与 StagedFactCandidate、commits/git_adapter.py 按 Index oid 读 blob、commits/precheck.py 惰性投影（8160630fc）；③八类测试向量钉住行为（e2898304d）；④check-fact-integrity 一等化为 Helper 公开操作，specs/05 §11 登记与 §11.9/§11.10 合同化（57a7bf897）；⑤spark-0022 归属评估写回，结论保持 open 另立（0d6d4834c）；⑥spark-0039 待办 1、2 项标记完成并 related-to 关联（5051eebcc）。已观察影响：提交终闸对暂存事实候选的机械完整性成立，schema-invalid 事实对象不再能随合规 message 原样放行；事实完整性检查从测试层内部能力升为一等公开入口。
validation_summary: 验证方法与覆盖：受影响测试集按分寸约束运行（未做全量测试）——facts 423、commits+hooks+git_hooks 111、helper 全目录 411+、specs+testing 221、validator 26、integrity 操作 5 例全部通过；真实库直调 check-fact-integrity：outcome ok、status=complete、object_count=92；端到端烟测：非法暂存事实候选 failed（诊断精确到路径+字段）、合法候选 passed、非法 object_id 拦 fact_object_id_invalid；每次提交均经 precheck-git-commit 机械校验 passed 后落账。未验证范围：全量测试套件未运行（分寸约束）；多环境 git hook 安装后实测未做；远端交互场景属本 WorkCase 禁止项未覆盖。
closure_outcome: completed
disposition_summary: WorkCase 按 completed 停止：六条成功标准全部 satisfied，独立复核（pass_with_followups）逐条确认并在 HEAD 干净树独立复现全部验证数字，原 scope 内无未满足或未验证责任，无剩余责任需要 route_existing、suggest_spark 或 accept_stop。验证结论以 HEAD 干净树为锚：当前活工作树因并行 FileAsset 工作流污染（30 个 tracked 脏文件）暂使一等化入口不可用、12 个测试失败，属该并行工作的既有责任（相关文件在 Gate1 前已脏，本 WorkCase 全程未触碰），后续任何验证声明须在 HEAD/干净树运行。复核三条跟进项处置：F1 采纳为上述验证边界纪律；F2（创建复核决议表述与批准基线文本错位）与 F3（计划文本编码机械契约禁止的 routed-to 关系，执行期被写前机械检查依规拦截）作为创建复核质量经验，保留为一条 follow_up_opportunity Spark 建议，供 Human 日后独立判断是否立项。
