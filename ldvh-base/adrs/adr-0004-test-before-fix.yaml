id: adr-0004
type: adr
title: 先完善机制或测试再修复问题
status: accepted
created: '2026-06-03'
updated: '2026-06-03'
date: '2026-06-03'
context: '当前修复 bug 或代码问题时，AI 可能直接修改代码而不先补充测试或完善机制，导致修复缺乏回归保护、相同问题可能重复出现、修复方案未经人类审查就执行。

  [Human Gate 确认记录: 确认人=user, 确认时间=2026-06-03, 确认上下文=用户确认创建 ADR 0004，补充修复后确认过程]

  [Human Gate 确认记录: 确认人=user, 确认时间=2026-06-03, 确认上下文=用户确认接受 adr-0004 决策：先完善机制或测试再修复问题]'
decision: 1) 修复 bug 或代码问题前，应先补充或完善对应的测试用例或机制保障，确保修复有回归保护；2) 修复方案需经 Human Gate 确认后才执行，不得自行直接修改；3)
  修复完成后应运行相关测试验证；4) 修复验证通过后，需经 Human Gate 确认修复结果，确认后才算完成。
consequences: 所有 bug 修复和代码问题修改必须先有测试或机制保障，修复方案必须经人类确认，修复完成后必须经人类确认结果；可能增加修复前后的工作量，但提升修复质量、可追溯性和人类可控性。
alternatives: 直接修复不补充测试（缺乏回归保护）；仅对高风险问题补充测试（边界模糊难以判断）
affects:
- 所有 bug 修复和代码问题修改场景
