title: Web 项目内容统一绑定当前管辖项目
intent: 需要持续保留 Web 项目级内容与顶部当前管辖项目的一致性问题，避免文件、变更、提交、事实对象或仪表盘分别使用页面内选择、固定根目录、环境默认或旧缓存，导致同一界面同时展示不同项目。后续需判断项目级页面清单、统一请求与服务端解析边界、切换时的数据失效和性能复用；若不跨行动保留，后续单页修补会反复遗漏其它入口，并增加重新定位数据来源、比较页面语义和排查跨项目误读的负担。
status: implemented
summary: "**当前结论**\n\n- Web 当前存在的项目级内容统一消费顶部选中的管辖项目身份；浏览器传递稳定项目 ID，服务端只把它解析为登记配置中的当前受管项目及实际 worktree，不信任任意路径或页面私有默认值。\n- 文件、工作区变更、提交、事实对象列表与详情、认知和阅读入口共享同一项目请求上下文；项目切换会隔离旧项目结果，避免旧响应覆盖新选择，也不会以相同对象编号跨项目混读。\n- 当前请求解析、页面路由与契约测试已覆盖项目绑定和错误边界；已移除或不存在的页面不构成本 Spark 的残余。多项目切换及“全部”聚合的独立产品语义仍由 `spark-0021` 保持相关，但不影响单一已选项目绑定已落实。\n\n**处置边界**\n\n本结论不授权跨项目聚合写入，也不表示所有未来新增页面自动获得项目上下文；新增入口仍须复用现行项目解析契约并单独验证。"
