type: change
title: P1 深度整改：价值审查提炼、六槽位决定明确、机制关系声明补充
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  specs 根目录自身规范符合性审查 P1 暂缓项整改：
  1. 13/14 价值与要素审查内容复制（P1 #8）：6 条审查标准在两个文件中逐字重复，构成第二事实源风险；
  2. 04 §4.2 强制 6 槽位（P1 #11）：规范要求 6 个子文档槽位但未说明设计理由，AI 可能误判为可放宽；
  3. 11/12/14 缺失机制关系声明（P1 #7）：三个基础规范缺少 03 §6 要求的机制关系声明章节。
decision: |
  1. 在 00 总纲 §3.4 新增"价值与要素审查标准"，定义通用 6 条审查清单；13 和 14 只保留模型特定审查要点，引用 00 §3.4；
  2. 在 04 §4.2 明确六槽位是 LDVH 设计决定，说明理由：确保每个规范模型对六类机制都有明确结论，避免隐式跳过；
  3. 为 11、12、14 各新增 §N 机制关系声明章节（11 §8、12 §8、14 §8），后续章节编号顺延，跨文件引用同步更新。
consequences: |
  - 价值与要素审查标准权威位置统一到 00 §3.4，消除第二事实源风险；
  - 04 六槽位要求有明确设计理由，AI 不会误判为可放宽；
  - 11/12/14 机制关系声明与 13 和其他基础规范保持一致；
  - 05 中对 14 §8 的引用已更新为 §9。
affects:
  - specs/00-LD-Vibe-Harness理念与纲要.md
  - specs/04-LDVH模型子文档规范.md
  - specs/11-LDVH-AI协作规范.md
  - specs/12-LDVH工具基础规范.md
  - specs/13-LDVH事实模型基础规范.md
  - specs/14-LDVH行动模型基础规范.md
  - specs/05-Trae-Solo AskUserQuestion使用规范.md
related_rules:
  - specs/03-Specs文档规范.md
  - specs/04-LDVH模型子文档规范.md
human_gate:
  required: false
  reason: 价值审查提炼消除第二事实源；六槽位明确为已有决定而非新增规则；机制关系声明是 03 已要求的章节补充。三者均不新增规则或改变语义。
validation: |
  00 §3.4 包含价值与要素审查标准 6 条清单。
  13 和 14 的价值与要素审查引用 00 §3.4，只保留模型特定要点。
  04 §4.2 明确六槽位是设计决定。
  11 §8、12 §8、14 §8 为机制关系声明章节。
  05 对 14 的引用已更新为 §9。
  tools/check_03_specs_references.py 检查通过。
