  Human 在 2026-06-25 与 AI 讨论 WorkBuddy 和 Codex 中 SVG 可视化表达的差异：WorkBuddy 可在回复中输出 SVG 源码并渲染，Codex 更适合通过 SVG 文件链接或图片引用展示。Human 进一步询问 SVG 是否应进入正文、Markdown 能否渲染 SVG、临时 SVG 保存后如何处理，并要求先建立一个 Spark，之后再考虑。
