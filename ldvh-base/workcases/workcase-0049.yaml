status: closed
title: 以受控授权与不变量防范 AI 越权和伪造流水
goal: 使无匹配授权、伪造 change_log、遗留 Signer-Type、事实与提交署名不一致及 Web 读取旧契约等情形被机械拒绝或暴露。
scope: 限 LDVH 的 Helper 受控写入、change_log 验证与迁移、Git 提交预检/Gate、共享读取契约、Web 本地读取和负向测试；不承诺阻止普通文件工具直接改源码，不覆盖未安装或被绕过的 Git Hook、外部系统或发布。
success_criterion_definitions:
- criterion_id: criterion-authorization
  statement: Helper 对动作类型、模式、对象或路径、副作用、有效期与撤销绑定可验证授权；仅 Spark 创建授权不能通过实现、规范更新、其它事实写入或 Git 提交路径，且授权证据根不可由 AI 自签。
- criterion_id: criterion-change-log
  statement: 新建事实的 change_log 仅由 Helper 或 Code 生成首条记录；更新仅追加一条实际事件记录；缺失历史只能走专用迁移；AI 提供多条初始历史、伪造时间或署名均被拒绝。
- criterion_id: criterion-git-link
  statement: Git Gate 拒绝 Signer-Type，要求 Session-ID、Agent-ID、Host-Environment 各恰一条，并在涉及事实流水时核对新增条目与 footer 的会话及两字段署名一致。
- criterion_id: criterion-contract
  statement: Web 与 Helper 采用同一两字段 change_log 契约，Web 可消费迁移后记录；授权缺失、伪造历史、Signer-Type、署名不一致和读取失败均有端到端负向测试。
success_criterion_results:
- criterion_id: criterion-authorization
  outcome: not_satisfied
  summary: 现有授权回指仍可由调用方构造；未实现 AI 不可伪造的可信签发与验签根，已转交 spark-0048。
- criterion_id: criterion-change-log
  outcome: not_satisfied
  summary: 已形成首条、单次追加与时间绑定不变量；可信责任字段派生和专用历史迁移尚未实现，已转交 spark-0048。
- criterion_id: criterion-git-link
  outcome: satisfied
  summary: Git Gate/预检拒绝 Signer-Type，并对 Session-ID、Agent-ID、Host-Environment 与事实新增流水进行精确比对，定向回归已通过。
- criterion_id: criterion-contract
  outcome: not_verified
  summary: Web 两字段读取和关键负例已验证；依赖可信根的迁移后流水端到端场景尚未具备可验证实现，已转交 spark-0048。
result_summary: 已落实 change_log 的结构、单条追加和 Code 时间绑定，Git footer 与事实流水的三字段比对，以及 Web 两字段读取契约；可信签发与验签根、专用历史迁移及迁移后 Web 端到端验证未实施，均已转交 spark-0048。
validation_summary: 已通过 change_log、WorkCase、Git 提交校验和 Web 读取的定向回归及独立复核修正；完整 Web API 套件仍有一项既存的 commit-label-contract 失败。可信根、专用迁移及迁移后端到端验证未执行，已转交 spark-0048。
