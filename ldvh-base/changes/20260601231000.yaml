type: change
title: 明确模型子文档状态与骨架判定规则
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户确认执行最小可执行改法，目标是避免将 not-created 说明型子文档误判为 active 子文档缺少完整骨架。
  此前审查中，51.02-Skill.md 和 51.05-Web.md 已具备本文定位、不创建理由和检查项，但因 51 主文档状态表标注为 active，被误判为缺少 Human Gate 章节。
decision: |
  更新 specs/04-LDVH模型子文档规范.md，明确 not-created 状态不表示子文档文件不存在，而表示该机制实体不创建、不展开完整实践；不得将子文档文件已创建误判为 active。
  更新 specs/04-LDVH模型子文档规范.md，新增状态与骨架审查顺序，要求先判断正文意图，再检查主文档状态表与适用骨架的一致性。
  更新 specs/03-Specs文档规范.md，在文档写作检查表中新增模型子文档状态与骨架检查项。
  更新 specs/51-multi-role-thinking-多角色思考.md，将 51.02 和 51.05 的状态由 active 调整为 not-created，与正文不创建说明型性质保持一致。
consequences: |
  - 后续审查模型实践子文档时，应先判断正文意图和状态一致性，不得仅凭主文档状态表机械套用完整骨架。
  - not-created 子文档可存在于 specs 根目录，用于说明不创建理由和检查项。
  - 51.02-Skill.md 与 51.05-Web.md 不再被误判为 active 子文档缺少 Human Gate 章节。
affects:
  - specs/04-LDVH模型子文档规范.md
  - specs/03-Specs文档规范.md
  - specs/51-multi-role-thinking-多角色思考.md
related_rules:
