title: ADR、Pitfall 与 Study 的作用强化及触发事件
status: open
priority: P1
intent: 在 v0.2 否定 L0 产品化、v0.3 否定通用 L1-specific 后，两轮实验共同揭示信息结构与消费架构之间的语义断裂是更底层根因——F2 候选卡缺少"读完后对当前行动意味着什么"的桥梁信号，限制了触发策略的有效空间。保持三类知识如何在真实工作流中产生可观察效用的未决问题。下一方向是字段结构修正：ADR 补 trigger_signal（什么动作触达决策边界）、Pitfall 补 scope_of_impact（当前任务在影响范围什么位置）、Study 补 action_relevance（该发现对当前行动意味着什么），再以修正后的触发策略重测。任何生产接入仍须另行形成 WorkCase 并经过 Human Gate。
summary: "## 当前结论（v0.3 后结构分析）\n\nv0.2（L0 产品化验证）和 v0.3（L1 触发策略精度验证）两轮 source-complete 配对实验均已严格按预注册门槛完成并得出否定结论。但实验积累的逐样本失败模式揭示了一个更深层的根因：**信息结构与消费架构之间的语义断裂**——F2 候选卡告诉模型的是\"这是什么\"（对象属性），而不是\"这对当前行动意味着什么\"（行动指引）。\n\n### 结构层的断裂证据\n\n**ADR：** F2 卡含 decision_question（什么选择问题）、decision（选了什么）、applicability（适用于什么范围）。applicability 是静态边界声明，不描述\"什么动作会触达该决策边界\"。\n- 实验验证：A2（exact-positive）被 L1-specific 过度 veto。模型无法从任务语义推导出它触达了 ADR-01KZXN5TXNED08TVYQVTS3BX6X 的决策边界，因为 applicability 只说\"适用于中文交付\"（范围），不说\"你正在写中文技术说明时该决策已被触达\"（行为）。\n\n**Pitfall：** F2 卡含 symptoms（失败表现）和 trigger_conditions（什么前置条件触发）。trigger_conditions 面向历史——描述\"什么条件下这个坑会踩到\"，不描述\"当前任务落在该失败机制影响范围的什么位置\"。\n- 实验验证：P3（boundary-partial）被过度 veto。技能加载异常的任务处于\"可能命中 P3 scope 也可能不命中\"的边界，但 trigger_conditions 只描述\"什么条件下失败发生\"，不给模型判断\"当前情形是否在影响范围内\"的锚点。\n\n**Study：** F2 卡含 abstract（研究发现了什么）和 recommendation_summary（建议项目做什么）。两者是研究导向的，不告诉\"这个发现对当前具体行动意味着什么\"。\n- 实验验证：S1/S2 在两个 arm 上 strong_reuse 都是 0。模型读到了 abstract 但不知道该拿它做什么——它需要的是\"你现在正在设计 L1 触发实验，这份研究告诉你应该按边界/症状建模而非任务类型平铺\"的桥梁。\n\n### 触发策略层的断裂证据\n\nL1-specific 的 positive+veto 机制表现为两类失败：\n1. **过度 veto（A2、P3）：** veto 条件太宽，把部分适用场景排除。但如果 F2 卡本身有更精确的行动指引信号，veto 就不需要做得这么激进——F2 候选集本身已经更精确。\n2. **f2-no-f3 失败（A6/P6/S6）：** 应 F2 但不应 F3 的场景中触发策略行为不一致。这本质上是 F2 卡信息密度不够——如果 F2 卡含有\"这条知识告诉你应该做什么不同的动作\"，模型在 F2 阶段就能做出更准确的适用判断。\n\n### 结论\n\n**结构是更底层的问题。** 它限制了触发策略的有效空间。无论 trigger policy 怎么调优，如果 F2 卡告诉模型的是\"这是什么\"而不是\"这对当前行动意味着什么\"，模型的 F2→F3 决策和 F3→行动转化都会受阻。\n\n触发策略也需要修正——不是微调，而是架构性退让：从 v0.3 的\"精确 veto\"回到更接近 v0.2 的宽触发 + F2 内容过滤，因为 F2 卡补了行动指引信号后，内容本身就能承担过滤功能。\n\n## v0.2 实验（L0 产品化验证）\n\n- 设计：`L1-only` 对 `L0 + 完全相同 L1`，12 个 retained pairs / 24 个 member runs，6/6 条件首发；零 replacement。\n- 主指标 `knowledge-adjusted first legal action correct`：净增 **3/12**，达到至少 3/12 门槛。\n- `strong_reuse`：干预净增 **1**，未达到至少 2 门槛。\n- `selection_correct`：净增 **0**，满足\"不下降\"。\n- 三个空样本 A2/P2/S2 并非全部 `correct_non_use`，门槛失败。\n- `false_f3_expansion`：总增量 **0**，满足最多 2 门槛。\n- 结论：**do-not-support-productizing-l0**。不支持产品化 L0 公共知识包。\n\n## v0.3 实验（L1 触发策略精度验证）\n\n- 设计：`L1-baseline` 对 `L1-specific`，ADR/Pitfall/Study 各 6 个情形，共 18 retained pairs、9 个 applicable 与 9 个 non-use，其中 6 个 no-trigger gold。\n- 运行账本：21 pair attempts、3 次整对 member 技术 replacement、42 次 member launches；36 个 retained blind scores，另有 5 次无效 scorer 输出作为技术失败原件保留，共 41 个 scorer contexts，未超过 42 上限。\n- trigger correct：**13/18 → 14/18**；未达到 specific 至少 15/18，净增也未达到 +3。\n- applicable strong reuse：**7/9 → 5/9**；绝对门槛 7/9 与净增 +2 均失败。\n- correct non-use：**1/9 → 4/9**；有改善，但未达到全部 9/9。\n- first legal action correct：**11/18 → 9/18**，违反\"不下降\"门槛。\n- selection correct：**14/18 → 17/18**，满足\"不下降\"。\n- false F3 expansion：**6 → 0**；specific non-use false F3=0，且 no-trigger unnecessary F2=0，相关门槛通过。\n- F3 expansions：**15 → 8**；Helper calls：**31 → 16**，显示成本下降。\n- 结论：**do-not-support-adopting-l1-specific**。误触改善被复用与行动质量回退抵消。\n\n## v0.3 逐样本失败模式（关键）\n\n| pair | family | case_kind | baseline | specific | 失败模式 |\n|---|---|---|---|---|---|\n| A2 | ADR | exact-positive | ✅ strong reuse | ❌ 被 veto | trigger_signal 缺失，决策边界无法被任务语义推导 |\n| A6 | ADR | f2-no-f3 | ✅ trigger | ❌ 未触发 | f2-no-f3 场景策略行为不一致 |\n| P3 | PIT | boundary-partial | ✅ strong reuse | ❌ 被 veto | scope_of_impact 缺失，无法判断\"当前在影响范围什么位置\" |\n| P6 | PIT | f2-no-f3 | ✅ trigger | ❌ 未触发 | f2-no-f3 场景策略行为不一致 |\n| S1 | STU | exact-positive | ❌ strong reuse=0 | ❌ strong reuse=0 | action_relevance 缺失，读了 abstract 不知该拿它做什么 |\n| S2 | STU | exact-positive | ❌ strong reuse=0 | ❌ strong reuse=0 | 同上 |\n| S6 | STU | f2-no-f3 | ✅ trigger | ❌ 未触发 | f2-no-f3 场景策略行为不一致 |\n\n## 根因分析\n\n**结构是更底层的问题，触发策略是次级问题。** 两者都欠，但结构同时削弱了触发策略的有效空间。\n\n### 每类对象的最小字段修正\n\n**ADR 补 trigger_signal**\n- meaning：\"当 AI 正在执行以下类型的动作时，该决策可能已被触达\"\n- not_meaning：该决策的适用范围（那是 applicability）、该决策的内容（那是 decision）\n- constraint：必填非空；必须是动作/行为描述而非范围描述；一个 ADR 可以有多个 trigger_signal\n- 预期修复：A2 任务（\"面向 Human 的中文验收说明首次出现 content_fingerprint 与 CAS\"）——如果 ADR-01KZXN5TXNED08TVYQVTS3BX6X 的 trigger_signal 是\"编写或修改面向 Human 的中文技术说明\"，模型在 F2 阶段就能建立任务↔决策的桥梁\n\n**Pitfall 补 scope_of_impact**\n- meaning：\"该失败机制在哪些当前活动类型、工具交互或技术栈组合中具有潜在影响\"\n- not_meaning：触发失败的前置条件（那是 trigger_conditions）、经验适用范围（那是 applicability）\n- constraint：必填非空；必须使用活动/工具/交互类型的描述，而非历史症状\n- 预期修复：P3 任务（\"Cindy/Codex 中技能文件存在但未加载\"）——如果对应 Pitfall 的 scope_of_impact 是\"与技能文件部署、加载或环境适配相关的异常\"，模型在 F2 阶段能判断\"当前技能加载异常属于该经验的影响范围\"\n\n**Study 补 action_relevance**\n- meaning：\"该研究的关键发现对当前项目下一步行动的具体改变：执行者应因此做什么不同的动作\"\n- not_meaning：研究发现了什么（那是 abstract）、研究建议项目做什么（那是 recommendation_summary）\n- constraint：active 时必填非空；必须是动作/计划层面的改变描述，而非发现层面的总结\n- 预期修复：S1 任务（\"设计 L1 family-specific 触发实验\"）——如果 study-01M03DH7VPFJQVR9G1K7BDP0AA 的 action_relevance 是\"实验设计应区分三层触发信号：ADR 以决策边界触达、Pitfall 以症状/模式匹配、Study 仅索引可见；不使用任务类型平铺\"，模型就能在 F2 阶段建立\"这份研究对我的实验设计意味着什么\"的桥梁\n\n## v4 实验（结构验证：行动指引字段）\n\n- 设计：`struct-baseline`（剥离 trigger_signal/scope_of_impact/action_relevance）对 `struct-enhanced`（原样含三字段），两臂共享同一 L1-baseline trigger policy，唯一差异为 F2 卡片是否含新字段。复用 v0.3 的 18 个冻结任务（A1–S6、6 情形、9 applicable/9 non-use/6 no-trigger）。\n- 运行账本：36 member runs、18 对配对、source-complete sealed。\n- F2 触发正确：**13/18（baseline）→ 12/18（enhanced）**，增强臂略退，未达 15/18 绝对门槛 ❌。\n- strong reuse：**6 → 4** ❌；首合法动作正确：**13 → 11** ❌；unnecessary F2：**5 → 6**（略升）❌。\n- selection correct：9 → **10**（略升）✅；false F3：18 → **15**（略降）✅。\n- 统计：配对 sign test 全部 **p ≥ 0.375**，多个指标 `zero_differences ≥ 16`（18 对里 16-17 对完全无变化）。\n- 结论：**do-not-support-enhanced-fields**。在 18 个冻结任务上，行动指引字段（trigger_signal/scope_of_impact/action_relevance）对模型 F2→F3 决策无独立可观测改善，不进入 Phase 2 生产规范修订。\n- 含义：字段**存在性**不是瓶颈。模型读到了字段但行动不变（zero-difference 主导），指向**信息呈现方式**（字段如何在 F2 卡中组织/措辞/排序）或**触发边界校准**为更上层杠杆。\n- sealed bundle：`docs/metrics/knowledge-precheck-v4/`（manifest/records/results/protocol/source-snapshot/source-observations）；Git 提交 `84f2d97d`、`16dfe420`。\n\n## 验证路线图（v4 后修订）\n\n### 阶段一：结构验证 — ❌ 已完成（v4，do-not-support-enhanced-fields）\n- 结果：行动指引字段存在性对 18 个冻结任务的 F2→F3 决策无独立可观测改善。\n- 字段处置：三个字段（trigger_signal/scope_of_impact/action_relevance）已在 22/23/24 类型规范与 05.Att.01 字段登记中落地；经 v4 验证为**非独立瓶颈**，**保留**为类型字段，但不依赖其单独产生效用。不因 v4 否定而启动规范修订回退——保留成本低、语义成立，回退本身是多来源变更，风险高于保留。\n\n### 阶段二：知识激活（新主方向）\n- 根因上移：三轮实验共同证伪的是「知识编码层」假设（L0 产品化、L1 触发策略、F2 字段存在性），真正瓶颈是「知识激活」——知识是否在正确时机、以对行动有意义的方式到达模型并改变行为；呈现方式只是激活三环节之一。\n- 三层框架：召回（被动检索 → 主动/就近触发，按类型差异化——ADR 决策边界触达、Pitfall 症状/风险匹配、Study 新领域检索，承接 study F6 分工表）；呈现（对象属性 → 行动指引「这对你当前行动意味着什么」）；效用（记录对象存在 → 记录命中且改变行动，形成 V8/HV4 复用闭环）。\n- 价值判断：被正确启用的重要性高于成本——漏检成本（重复踩坑/决策/研究）远大于误检成本（多花 token/一次 F3），故召回偏 recall、宁可误报不可漏报；激活强度按类型梯度（ADR/Pitfall 漏检代价高、强激活；Study 漏检代价中等、按需），成本降为正确激活前提下的次级约束。\n- 上位依据：根规范 00 §1 设计哲学——「模型分级」（默认轻量、资源投向最需可靠性的环节）与「多角度对抗」（不以单一视角自我确认）。\n- 字段减法与三层分离：三个行动指引字段（trigger_signal/scope_of_impact/action_relevance）从对象 Schema 移除——它们是「激活层」信息误入「存储层」，v4 已证伪其独立价值；对象字段回到精炼的「知识本体」（内容/边界/状态），行动指引改为激活层动态投影（知识本体 × 当前行动上下文）。三层分离：存储层（对象字段）+ 激活层（独立机制：触发匹配 / 行动投影）+ 度量层（效用闭环）。\n- 任务集与门槛：参数冻结后另经 31 行动模板与 Gate 1 评估；核心指标为「正确激活率」（漏检率 + 行为改变率），成本为次级观测项。\n\n### 阶段三：触发边界校准（备选，需重新框架化）\n- v0.3 已证伪 L1-specific 精确 veto；除非按动作语义（而非任务类型）重新框架触发边界，否则重复风险高。作为阶段二不成立时的备选方向保留。\n\n### 新增诊断指标\n\n- **f2_decision_accuracy**：F2 阶段模型做出的展开/停止/跨 family 判断的正确率。v0.3 的 strong_reuse 回退本质上都是 F2→F3 决策出了问题，直接测量这个节点比间接推断更可靠。\n- **action_bridge_score**：从 F3 全文读取到最终行动选择之间的桥梁质量（0=完全没用到知识、1=引用但没改变行动、2=改变行动但不精确、3=精确应用并改变实质行动）。能区分 strong_reuse=0 是因为模型没读到（不太可能）还是因为读到了不知道该拿它做什么（更可能）。\n\n## 范围边界\n\n- 本分析及后续方向不授权创建 WorkCase 或实现自动注入机制；参数冻结后另经 31 行动模板与 Gate 1 评估。\n- 字段修正（trigger_signal / scope_of_impact / action_relevance）涉及 22（ADR）、23（Pitfall）、24（Study）类型规范和 05 统一字段登记，需走规范修订流程。\n- 本 Spark 保持 open/P1。\n\n## 证据绑定\n\n### v0.2\n- 报告：`docs/metrics/knowledge-precheck-v2/compiled/report.md`\n- 结构化结果：`docs/metrics/knowledge-precheck-v2/compiled/results.json`\n- 记录：`docs/metrics/knowledge-precheck-v2/compiled/records.json`\n- sealed evidence bundle：`docs/metrics/knowledge-precheck-v2/evidence-bundle`\n- evidence manifest SHA-256：`844489c3d577fa0f36cc0d3035d8a68d0174ec52d8cc0e37b2ec5067741c5009`\n\n### v0.3\n- 报告：`docs/metrics/knowledge-precheck-v3/compiled/report.md`\n- 结构化结果：`docs/metrics/knowledge-precheck-v3/compiled/results.json`\n- 记录：`docs/metrics/knowledge-precheck-v3/compiled/records.json`\n- sealed evidence bundle：`docs/metrics/knowledge-precheck-v3/evidence-bundle`\n- evidence manifest SHA-256：`ae675eff19624323e33471476b39edfb5ec0e0095560b3586058b01c8776065c`\n\n### v4\n- 报告：`docs/metrics/knowledge-precheck-v4/report.md`\n- 结构化结果：`docs/metrics/knowledge-precheck-v4/results.json`\n- 记录：`docs/metrics/knowledge-precheck-v4/records.json`\n- sealed bundle：`docs/metrics/knowledge-precheck-v4/`（manifest、protocol、source-snapshot、source-observations）\n- Git 提交：`84f2d97d`、`16dfe420`\n\n### 关键研究\n- study-01M03DH7VPFJQVR9G1K7BDP0AA（知识对象的使用与触发时机：行业实践调研）\n\n## 可解释范围与限制\n\n- 18 个冻结 pair 与当前知识快照不建立广泛因果效应。\n- 原生协作 runtime 的底层模型名、token usage 与 model-only latency 不可得。\n- 三轮实验评价冻结的 L0、L1 policy 与 F2 字段结构；v4 评字段存在性而非呈现方式。不授权生产接入、Specs/Helper/Web 修改。\n- 结构分析是 AI 综合实验证据的推理判断，不是对照实验结论，需下一轮 WorkCase 验证。\n\n## 后续方向\n\n1. **主方向：知识激活**——从「知识编码」上移到「知识激活」三层（召回主动化 + 呈现行动化 + 效用闭环），确立「正确激活优先于成本」（漏检 >> 误检、recall 优先、激活强度按类型梯度）。参数冻结后另经 31 行动模板与 Gate 1 评估。\n2. 三个行动指引字段（trigger_signal/scope_of_impact/action_relevance）保留为类型字段，标注为已验证非独立瓶颈；不启动规范修订回退。\n3. 备选方向：触发边界校准（按动作语义重新框架），仅在阶段二不成立时启用。\n4. 新增 WorkCase 前继续冻结 applicable/non-use/no-trigger gold、首个合法动作、整对 replacement 与 scorer 技术失败原件；不可用模型/成本字段不得补造。\n5. 任何生产接入仍须另行形成 WorkCase 并经过 Human Gate。\n"
