title: LDVH 常用行为清单与并行摩擦记录框架
status: open
priority: P2
intent: LDVH 项目目前缺乏一份系统化的常用行为清单，AI 在每次执行时重复探索同一套操作模式，效率低且容易遗漏步骤。同时，执行过程中遇到的各种摩擦（工具限制、契约模糊、信息不足等）也没有被系统化记录，导致同类问题反复出现。需要建立一份结构化的 LDVH 常用行为清单，并以该清单为基础安排并行 subagent 执行，每路 subagent 将执行中遇到的摩擦独立记录，最终由主控 AI 汇总成一份完整的实践沉淀文档。
summary: "## 当前状态\n\nLDVH 项目经过多次迭代，已形成一套相对稳定的操作流程，但此前缺乏系统化的常用行为清单。\n\n## 最新进展\n\n已通过 WorkCase（workcase-01M09Z1KKFE76RDSTSV99QA841）完成以下工作：\n\n1. **常用行为清单已创建为 Study**：`ldvh-base/studies/study-01M09ZNYA8F3K8FW1VBDYTYXCB.md`，覆盖五类事实对象（Spark/WorkCase/ADR/Pitfall/Study）的创建、更新、状态转换、终态处置四环节\n2. **每条行为步骤标注 Helper CLI 操作**：含具体 bash 命令示例和参数提示\n3. **跨类型交叉引用**：生命周期交互表格说明 6 种流转场景\n4. **符合 24 规范**：研究问题/输入与边界/关键发现/建议/后续分流五段 H2 齐全\n\nWorkCase 当前处于独立结果复核阶段，四条 success criteria 全部满足。\n\n## 剩余问题\n\n- 本 Spark 的并行执行与摩擦记录部分尚未展开，建议后续由 WorkCase 承接\n- 关联 Spark-01M09PNH9CEAVBMQS4JXNC74W6 与本清单交集部分待其结论形成后吸收\n\n## 边界\n\n- 不修改 LDVH 核心源码或规范\n- 摩擦记录只记录事实，不替代正式的规范修订或 WorkCase\n- 行为清单是经验总结，不替代正式规范作为权威来源"
