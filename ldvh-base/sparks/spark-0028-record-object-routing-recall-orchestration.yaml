  Human 在 2026-06-25 与 AI 讨论“火花、决策、经验”三类记录对象如何和行动编排挂钩。讨论从三个独立编排收敛为一个统一编排：Spark、ADR、Pitfall 属于记录对象，WorkCase 是行动承接，Study 是 AI 行动产物；记录对象编排应同时覆盖入库分流和出库召回。Human 随后要求建立一个 Spark，把对话重点写入 Spark。
