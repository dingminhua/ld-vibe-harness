summary: 06 生产对象基础规范补强：对齐 07 行动模型基础规范的结构和深度
date: 2026-05-31
reason: |
  06 与 07 对比发现 06 缺少落地前决策、价值与要素审查、与行动模型的关系、
  AI 协作适配通用原则、事实源回写适配原则、证据留存适配原则等内容，
  导致 06 对 11-39 具体对象规范的指导力不足。本次补强对齐 07 的结构和深度，
  确保 06 和 07 在落地链路、AI 协作、回写和证据方面保持一致。
actions:
  - §4.1 模型定义增加事实源回写要求、证据留存要求、落地前决策、价值与要素审查
  - §4.2 标准组成从 14 项扩展为 18 项，增加事实源回写要求、证据留存要求、落地前决策、价值与要素审查
  - 新增 §4.4 生产对象模型与行动模型，含维度对比表和双向约束规则
  - 原 §4.4→§4.5，原 §4.5→§4.6，原 §4.6→§4.7，原 §4.7→§4.8
  - §4.6 主文档定义内容增加事实源回写要求、证据留存要求、落地前决策、价值与要素审查
  - §4.7 从"落地初始化、落地审计与合规检查"扩展为"落地前决策、价值与要素审查、落地初始化、落地审计与合规检查"
  - §4.7 增加落地前决策定义、价值与要素审查定义（含 6 项审查覆盖）、审查不通过处理规则
  - §4.7 合规检查范围增加事实源回写、证据留存、AI 协作适配
  - §4.8 完整方案形成流程从 6 步扩展为 7 步，增加落地前决策和价值与要素审查步骤
  - §5.4 准入条件原则从 §6.1 移入 §五，与分类原则并列
  - §六 通用规范重新编号，增加 §6.5 AI 协作适配原则、§6.6 事实源回写适配原则、§6.7 证据留存适配原则
  - §8.1 Human Gate 触发条件从 11 条扩展为 13 条，增加 AI 协作适配边界和行动模型交互边界
  - §8.2 检查要求表从 12 行扩展为 17 行，增加落地前决策、价值与要素审查、AI 协作适配、事实源回写、证据留存检查项
  - §九 待补齐事项增加落地前决策和价值与要素审查的执行证据格式
  - 头部增加 07 为相关规范，增加最后更新日期
affected_files:
  - specs/06-LDVH生产对象基础规范.md
verification:
  - 06 §4.2 标准组成包含 18 项，与 07 §4.2 的 19 项结构对齐
  - 06 §4.4 生产对象模型与行动模型含维度对比表和双向约束规则
  - 06 §4.7 包含落地前决策、价值与要素审查、落地初始化、落地审计和合规检查完整链路
  - 06 §4.8 完整方案形成流程包含落地前决策和价值与要素审查步骤
  - 06 §六 包含 AI 协作适配、事实源回写适配、证据留存适配通用原则
  - 06 §5.4 准入条件原则位于 §五
  - 06 §8.1 Human Gate 包含 AI 协作适配边界和行动模型交互边界
  - 06 §8.2 检查要求表包含落地前决策、价值与要素审查、AI 协作适配、事实源回写、证据留存检查项
