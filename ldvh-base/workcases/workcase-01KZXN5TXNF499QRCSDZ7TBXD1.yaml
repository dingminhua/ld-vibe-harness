title: 防止 WorkCase 生命周期关口误入执行项
status: closed
goal: 在 WorkCase 唯一类型规范与获批计划执行模板中建立可执行的防误建模边界，使方案形成、方案复核和获批计划执行都能识别并拒绝把 controller_checking、independent_reviewing、closure_preparing、human_closure_confirming 等 WorkCase 生命周期关口或 Human Gate 写成 work item；同时以真实负例测试固定该边界，避免再次形成“item 等待 review，而 review 又要求全部 item terminal”的循环。
scope: 覆盖 specs/21-WorkCase-工作项.md 的 workcase-item 语义、创建审核要求、Stop Conditions 与最小验证；覆盖 specs/34-WorkCase获批计划执行行动模板.md 的逐项消费前语义检查、命中后的停止和 plan_revising 交还；覆盖 code/tests 中与上述规则及模板交付直接相关的负例或契约测试。明确区分“执行中形成验证材料”与“全部 item terminal 后的 Controller 自检、独立结果复核和 Human 关闭决定”。排除：修改 WorkCase 字段、status 或 phase 闭集；新增自然语言 NLP/lint 或让 Code 代替 AI 判断语义；修改 specs/07、31、32；重新打开或改写 workcase-0018；修改、批准或执行 workcase-0015；Web 改动；Git commit、push 或 PR；以及当前 Working Tree 其它无关改动。
success_criterion_definitions:
- criterion_id: criterion-rule-source
  statement: specs/21 唯一明确 work item 不得承载 WorkCase phase 或 Human Gate，方案复核必须逐项检查，命中即返修。
- criterion_id: criterion-runtime-consumption
  statement: specs/34 在执行每项前消费该语义边界，并以 Stop Condition 停止和交还 plan_revising，不复制 WorkCase 字段或状态机。
- criterion_id: criterion-negative-verification
  statement: 测试包含将独立结果复核误写为 item 的真实反例，持续检查规则与模板交付包含该边界；相关测试通过，且不宣称 Code 能理解自然语言。
- criterion_id: criterion-responsibility-boundary
  statement: 21、34 与测试的职责一致且未越过排除边界；Controller 自检、独立结果复核和 Human 关闭决定仍由 WorkCase phase 链承担。
success_criterion_results:
- criterion_id: criterion-rule-source
  outcome: satisfied
  summary: 21 §4.3、§4.4、workcase-item 定义、验证要求与 Stop Conditions 已共同明确生命周期关口/Human Gate 不得成为 item，创建前 Controller 与 Reviewer 必须逐项检查并在命中时返修。
- criterion_id: criterion-runtime-consumption
  outcome: satisfied
  summary: 34 在输入、执行分支、验证表和 Stop Conditions 中消费 21 的语义边界；命中时停止未来执行并交还 plan_revising，未复制字段或 phase 状态机。
- criterion_id: criterion-negative-verification
  outcome: satisfied
  summary: 已用“全部实现完成后安排独立结果复核”作为显式坏计划，契约测试同时检查 21 来源与 Helper 交付的 34 完整来源；行动模板测试 6 项、完整 Specs 测试 131 项和 git diff --check 均通过。
- criterion_id: criterion-responsibility-boundary
  outcome: satisfied
  summary: 主控检查确认本案没有新增自检/复核 item，没有修改字段、status/phase 闭集、07/31/32、Web、0015 或 0018；Controller 自检、独立结果复核与 Human 关闭决定继续由 phase 链承接。
result_summary: 已为 WorkCase 计划建立生命周期关口防误建模闭环：21 定义 item 语义、创建复核和停止边界，34 在消费获批计划前检查并于命中时回到 plan_revising，测试以 0015 类错误的明确反例固定两处来源交付。未增加自然语言检测器、字段、状态或第二状态机。
validation_summary: 实际运行 code/tests/helper/test_action_template_operation.py：6 passed；运行 code/tests/specs：131 passed；运行 git diff --check：通过；并用精确文本检索回读 21、34 与负例测试的非法 item、plan_revising 交还和 Code 语义边界。未验证任意自然语言计划的自动识别，因为本案明确不实现 NLP/lint，Code 仍不能据关键词判断语义；未执行 Web、全量 Code 测试、Git commit、push 或 PR。
closure_outcome: completed
disposition_summary: plan_version=1 批准范围内的四项成功标准均已满足：21 已建立生命周期关口不进入 work item 的唯一语义、创建复核与停止边界，34 已建立消费前检查及命中后返回 plan_revising 的执行分支，显式坏计划的来源与 Helper 交付契约测试通过，未新增 NLP validator、字段或第二状态机。主控与独立复核分别确认行动模板测试 6 项、Specs 测试 131 项通过；主控的 git diff --check 结论只覆盖已跟踪差异，Reviewer 另对未跟踪 34/0019 完成 no-index 空白检查并通过。当前工作树其它既存 dirty 改动不纳入本案结果，Git 不能独立证明其作者归属。原 scope 内没有剩余责任，无需转交或建立后续建议。
