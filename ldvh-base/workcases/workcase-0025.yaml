  suggestion_kind: constrained_responsibility
  summary: 以正确的 07 路径完成 FileAsset 跨规范政策收束并恢复可判定的规范测试基线。
  restriction_reason: 当前 workcase-0025 的冻结 Gate1 authorization 仅列出不存在的 07 文件路径；实际 07 变更超出本次准确 target_scope。与此同时，specs 测试被独立的表格拆分附件工作树变更造成的硬编码数量断言漂移阻断。
  impact_summary: criterion-07 与 criterion-verification 仍为 not_satisfied，当前 WorkCase 只能形成 partial 结果；不得把 09/24 的局部完成写成全部政策收束或完整 specs 测试通过。
  resume_condition: Human 在当前 WorkCase Gate2 后独立决定是否建立新的 WorkCase，并在其 Gate1 中明确授权实际 07 路径及所需验证范围；表格拆分附件变更应先或同次明确测试预期的承接责任。
  follow_up_summary: 如 Human 决定继续，创建新的受控 WorkCase：先精确读取实际 07 与当前 FileAsset 规则，形成正确文件 target_scope、独立审核和 Gate1；随后编辑、运行定向验证，并对 specs 测试数量预期漂移建立独立、可回指的修复或承接。
