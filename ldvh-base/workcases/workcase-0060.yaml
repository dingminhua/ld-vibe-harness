title: 撞号处置程序规范增补（跨 clone/多机事实对象身份冲突）
status: open
phase: executing
priority: P1
plan_version: 1
goal: 把跨 clone/多机场景下“同 ID 不同内容”事实对象的发现、判定、处置与验证程序增补进规范本体（05 为主），使 mac↔Windows 双机与多 worktree 协作有明确可执行规则，承接 spark-0022 的处置方向。
scope: 含：01 §13 门槛判断与逐条核对记录；05 最小充分增量（合并前身份扫描操作化、A/B 判定、合并路径、改号路径、引用重定向、验证闭环，仅用当前机械边界表达）；spark-0022 承接范围据实记录；spark-0055 待判断项输入（三层必要性结论与全库审计实测基线）；spark-0004 方向记录（Windows 工作放到 Windows 上做）。不含：任何 Code/tests 变更、提交 Gate 前置拦截实现、Windows 实测与验收矩阵执行、Skill/Git Hook 部署、09 §6.3 平台声明修订。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 05 中存在可机械定位的增补条文，覆盖发现/判定/合并/改号/引用重定向/验证六环节，且完成 01 §13.5 独立复核（复核记录载体为 item-03 的 result_summary，不嵌入 05 正文）。
- criterion_id: criterion-02
  statement: item-01 记录门槛结论（属 05 既有责任边界内补充）与逐条核对表，证明增补与现有条款无重复转述。
- criterion_id: criterion-03
  statement: spark-0022 承接范围据实记录（预期保持 open 并写明残留：Gate 前置拦截实现与远端观察边界），spark-0055 吸收本次结论、spark-0004 记录方向，三者更新均经同一 worktree 回读确认。
- criterion_id: criterion-04
  statement: 修订经 30 模板受控提交、Git Gate 通过，commit 路径闭集仅含本 WorkCase 实际变更，提交后 check-fact-integrity 外层 ok 且 result.status=complete。
work_items:
- item_id: item-01
  goal: 完成 01 §13 门槛判断（确认属 05 既有责任边界内补充具体规则）并逐条核对候选规则与现有承担
  expected_result: 门槛结论、依据（01 §13 定义与 05 §3/§4 既有责任）与逐条核对表，载体为本 item 的 result_summary 与后续 commit message
  status: completed
  result_summary: 门槛结论：本次属 01 §13 定义的"在已有责任边界内补充具体规则"，非实质责任改变——05 §3 第 7 项（事实对象在冲突、合并、替代或删除时的验证与边界）与 §4 第 6 项（事实对象间冲突）已承担本领域责任。逐条核对（候选规则 vs 现有承担）：R1 发现操作化——05 §11.4 仅有原则句（合并前全局身份扫描拒绝冲突），时点/入口/责任未操作化，缺口成立；R2 冲突分类（A/B 判定）——§7.4 仅有禁止静默，无分类判据，缺口成立；R3 合并路径——§9.3 有不得丢失原则，操作化细节可补；R4 改号路径——无条文，缺口成立；R5 引用重定向——§7.3 三元组与 relations 定义存在，但改号时入向引用必须枚举更新无条文，缺口成立；R6 验证闭环——00 §8.2 已承担写后回读+审计通用要求，只回指不重复；R7 能力缺口声明——§11.4 已声明跨 clone 未解决，补充明确边界；禁止静默——§7.4 已完整承担，不重复转述。结论：新增 R1/R2/R4/R5，操作化 R3/R7，回指 R6 与禁止项；落点为 05 §9 新增小节。
- item_id: item-02
  goal: 起草并落文 05 最小充分增补条文（六环节处置程序）
  expected_result: 05 中可机械定位的增补条文；仅用当前机械边界（单 worktree check-fact-integrity、read-fact-objects、Git 合并机制与 AI/Human 步骤）表达；未实现能力据实标为缺口
  status: completed
  depends_on:
  - item-01
  result_summary: 05 新增 §9.4「跨 clone 与多机合并中的事实对象身份冲突处置」（行 329–341）：覆盖发现（合并后 check-fact-integrity 时点与冻结）、冲突分类（A/B 语义判定、Human 定向）、合并路径、改号路径（含引用重定向与 multi_object_disposition 分类）、验证闭环六环节；能力诚实（跨 clone 前置拦截无 Helper 操作，据实标缺口，回指 §11.4）；同步纪律仅作预防边界描述、不形成新机械入口。Helper L3 精确回读通过，结构机械校验 ok。
- item_id: item-03
  goal: 委派 01 §13.5 规范增量独立复核并由 Controller 处置反馈
  expected_result: §13.5 复核记录（载体为本 item 的 result_summary）与 Controller 处置结论
  status: completed
  depends_on:
  - item-02
  result_summary: §13.5 独立复核（独立只读 subagent，未参与初始判断）结论 changes_required：归口正确、机械引用全部核实一致、能力声明属实、无更小方案被忽略；反馈 4 项——[major] 改号路径分类断言与 32 §D.5/E.4 存在分支张力；[minor] 行 333 几近逐字重引 §7.4；[nit] 合并路径分类枚举缺 content_update；[nit] 需澄清与 03 §9.9 提交链路边界。Controller 全部接受处置：改号路径补"各步独立形成完整有效对象、中间状态可保存恢复、按 32 合法多步序列逐对象 CAS"前提句；§7.4 触发条件压缩为纯引用并保留冻结后果；合并路径枚举改为 content_update/fact_correction/single_object_lifecycle；补"该检查是合并/拉取事件触发的独立入口，不改变 03 §9.9 提交候选校验边界"。修订后条文经 Helper L3 回读通过（行 329–341）。
- item_id: item-04
  goal: 按 30 模板执行受控提交并完成提交后验证
  expected_result: Git Gate 通过的单个 commit（Index 路径闭集仅含本 WorkCase 实际变更），提交后 check-fact-integrity 外层 ok 且 result.status=complete
  status: in_progress
  depends_on:
  - item-03
  - item-05
  current_summary: 规范增补与三火花更新均已完成并验证，准备按 30 模板执行受控提交
  resume_from: 读取 30 模板当次内容，按选 b 将 spark-0055/0019 既有条目并入，git add 限定路径闭集后 precheck-git-commit 并提交
- item_id: item-05
  goal: 完成三个关联火花的承接处置
  expected_result: spark-0022 承接范围据实记录（预期 open+残留）、spark-0055 吸收结论、spark-0004 记录方向，均经同一 worktree 精确回读确认
  status: completed
  depends_on:
  - item-02
  result_summary: 三火花承接处置完成并回读确认：spark-0022 保持 open，summary 记录承接现状（规则层已由 05 §9.4 承接；残留：Gate 前置拦截实现与远端观察边界）并 related-to workcase-0060；spark-0055 吸收三层必要性结论与审计实测基线（待判断项收窄），保持 open；spark-0004 记录方向决定（Windows 工作放到 Windows 执行、入口引导测试为验收起点），保持 open。spark-0022/0004 为缺 change_log 遗留对象，已先按 05 §11.7.1 受控迁移建立可信流水起点（历史据实标注不可得）再更新。全库审计 complete（151 对象、0 问题）。
