closure_evidence: |-
  根因定位：通过 Playwright 连续帧截图 + CSS dump 确认，白色圆圈动画由 ObjectDetail.tsx
  主容器（第198行）的 `transition-all duration-300` 导致。Chrome 对该元素设置默认 border-radius=8251.97px，
  transition-all 使其在页面加载时从大值过渡到实际值（0px），产生"圆→方框"轮廓动画。

  修复措施：
  1. ObjectDetail.tsx 第198行：`transition-all` → `transition-[margin]`（仅过渡 margin）+ 添加 `rounded-none`
  2. index.css：全局清除 focus ring、tap-highlight 和浏览器默认按钮样式

  验证结果：Playwright 帧截图对比确认修复后无圆形轮廓；ReadingPanel margin 过渡正常。
  经验已沉淀至 pitfall-0007。

  ## 验证结果

  根因确认为 transition-all 导致 border-radius 动画，修复后 Playwright 帧截图对比确认无圆形轮廓，ReadingPanel margin 过渡正常。

  ## 结论

  任务完成，人工确认关闭。
