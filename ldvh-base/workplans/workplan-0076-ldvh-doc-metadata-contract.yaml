verification_evidence: |
  ## 验证计划

  验证 `ldvh_doc` 是否已经从概念设计落到 specs 规范、当前 specs 文件、Code 解析诊断、Web 消费边界和测试校验，并确认普通文档元信息头部已从 specs 根目录规范文档中清退。

  ## 验证命令

  ```bash
  python3 -m pytest tests/code/specs_validate_checks/test_index.py -q
  python3 code/specs_validate.py index --fail-on-diagnostics
  python3 code/specs_validate.py all --fail-on-diagnostics
  npm run check
  python3 code/fact_validate.py ldvh-base/workplans/workplan-0075-specs-metadata-landing-hardening.yaml ldvh-base/workplans/workplan-0076-ldvh-doc-metadata-contract.yaml
  git diff --check
  ```

  ## 验证结果

  落地内容：
  - `specs/03-文档基础规范.md` 和 `specs/03.01-规范文档规范.md` 已定义 `ldvh_doc` 的职责、字段、位置、与普通头部和 `ldvh_member` 的分工。
  - `specs/03.01-规范文档规范.md` 已明确 `ldvh_doc` 标准字段必须全量出现；是否允许为空、空值形态和默认值按字段逐项定义；`updated` 必须非空，首次创建时与 `created` 相同，后续内容变更时更新为最近变更日期，且不得早于 `created`；字段值要求使用硬边界表达，不使用“建议”等软词表达字段契约；正式规范骨架已改为 `ldvh_doc` 标准模板。
  - `specs/03.02-工作模型文档规范.md`、`specs/03.03-工作流程文档规范.md`、`specs/07-Code确定性执行实现规范.md`、`specs/08-Web信息同步实现规范.md` 已同步 `ldvh_doc` 消费边界。
  - `specs/03.02-工作模型文档规范.md` 和 `specs/03.03-工作流程文档规范.md` 的专用骨架已同步改为 `ldvh_doc` + `ldvh_member` 双结构化模板，不再示范普通文档元信息头部。
  - 当前 specs 根目录 30 个 Markdown 文件已补齐顶层 `ldvh_doc` 的完整标准字段，并清退正文前普通文档元信息头部；03.01 因正文包含示例块，已额外补真实顶层块。
  - `code/spec_checks/index.py` 已解析顶部元信息区中的 `ldvh_doc`，并诊断 `LDVH_DOC_FIELD_ABSENT`、`LDVH_DOC_FIELD_EMPTY`、`LDVH_DOC_DATE_INVALID`、`LDVH_DOC_UPDATED_BEFORE_CREATED`、doc_kind/status、doc_id、canonical_path、title、普通头部重复和 `ldvh_member` 冲突。
  - `tests/code/specs_validate_checks/test_index.py` 已覆盖正常解析、缺失诊断、标准字段缺席、`updated` 为空、日期格式非法、`updated` 早于 `created`、普通头部重复、编号/路径/类型冲突，以及正文示例不应被误读为真实元信息。
  - 当前 specs 根目录 8 个原 `updated: ""` 文件已补齐为非空日期；无精确更新时间的文件按“首次创建时 `updated = created`”规则补齐。
  - `web/docs/00-Architecture.md` 已明确 Web 只读消费 `ldvh_doc` 和 Code 诊断，不反向制造、迁移、编辑事实源，也不使用普通头部替代 `ldvh_doc`。

  校验结果：
  - `python3 -m pytest tests/code/specs_validate_checks/test_index.py -q`：53 passed。
  - `python3 code/specs_validate.py index --fail-on-diagnostics`：通过，diagnostics=0。
  - `python3 code/specs_validate.py all --fail-on-diagnostics`：通过；Specs § 引用、规范落地要求、Human Gate 最小证据结构、投影漂移、LDVH 能力资产、一致性、字段注册表和管辖项目配置检查均通过。
  - `npm run check`：通过；Web 类型检查、Web build、Web API 测试、239 条 Python 测试和 specs 检查均通过。
  - `python3 code/fact_validate.py ldvh-base/workplans/workplan-0075-specs-metadata-landing-hardening.yaml ldvh-base/workplans/workplan-0076-ldvh-doc-metadata-contract.yaml`：通过，files=2 errors=0 warnings=0。
  - `git diff --check`：通过，无空白错误。

  ## 结论

  `ldvh_doc` 统一结构化文档元信息契约已完成 specs、Code、Web 三侧落地，并完成当前 specs 文件迁移和普通文档元信息头部清退；计划进入 review_needed，等待 Human closure review。
