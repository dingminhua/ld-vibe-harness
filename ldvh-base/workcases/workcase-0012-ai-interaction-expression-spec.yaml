id: workcase-0012
type: workcase
title: AI 交互与表达规范 09 设计落地
goal: |
  承接 spark-0030，设计并推动候选 `09-AI交互与表达规范.md` 的最小规范方案，统一治理 AI 与 Human 协作中的表达方式路由、选择式确认、Human Gate 问法、视觉辅助、对话结论分流和不同运行环境的呈现差异。
status: subagents_plan_reviewing
created: '2026-06-25T20:18:00+08:00'
updated: '2026-06-25T20:18:00+08:00'
priority: P1
description: |
  Human 在讨论 SVG 可视化辅助表达时进一步指出：问题不只是 SVG 存放或触发，而是 LDVH 缺少一层 AI-Human 交互与表达规范。Human Gate 需要更稳定的选择模式确认，AI 对建议、风险、优先级、边界和视觉辅助的表达也需要统一约束。若只把规则分散写入 03、06、07 或工作对象成员规范，容易导致规则碎片化。

  spark-0030 已记录：SVG 只是首个场景；WorkBuddy visualizer 指南提供了一个成熟参考，包含“正文说明与视觉输出分离”、视觉类型路由、SVG 固定生成契约、安全/可访问性约束和环境渲染能力。LDVH 需要从这些输入中抽象环境无关规则，再分别回指 03 行动编排、06 运行时扩展、07 事实源边界、20-22 工作对象和后续 Code/Web 校验。

  本 WorkCase 只负责候选 09 的规范设计与最小落地方案，不在方案确认前直接新增或修改 specs。实际创建 `specs/09-AI交互与表达规范.md`、修改 01 当前目录登记、调整 Rules 入口或引入 Code 校验前，必须进入 Human 方案确认。
success_criteria: |
  - [ ] 明确 09 的规范定位：交互表达总入口，而不是事实源、行动编排、运行时扩展或工作对象规范的替代品。
  - [ ] 形成 09 与 01/03/06/07/20/21/22/04/05/08 的职责分工表，避免同一规则散落或反向定义事实源。
  - [ ] 提出 09 的最小章节骨架，至少覆盖表达方式路由、Human Gate 问法、选择模式确认、视觉辅助投影、对话结论分流、环境呈现适配和安全/可访问性约束。
  - [ ] 明确 SVG 作为 09 首批场景的规则：触发条件、正文边界、临时/正式资产位置、Codex/WorkBuddy 展示差异和“不替代事实源”声明。
  - [ ] 判断是否需要同步 01 规范目录、03 Human Gate、06 运行时扩展、07 事实源边界、Code 校验、Web 展示或 Rules 入口。
  - [ ] 形成可提交 Human 方案确认的执行计划：哪些文件会新增/修改、验证命令、Human Gate 点、回滚方式和不做事项。
