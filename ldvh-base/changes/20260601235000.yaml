type: change
title: P1 批量修正：术语冗余、引用格式和待补齐条件更新
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  specs 根目录自身规范符合性审查 P1 项整改：
  1. 14-LDVH行动模型基础规范.md 中"行动模型模型"冗余表述 19 处，与 13 的"事实模型"术语模式不一致；
  2. 11-LDVH-AI协作规范.md §5.3 使用"本文第五节"而非标准 §N 引用格式；
  3. 7 个文件的待补齐事项中"13/14 稳定后"条件已满足但未更新。
decision: |
  1. 14 全文"行动模型模型"替换为"行动模型"，与 13 的"事实模型"术语模式对齐；
  2. 11 §5.3 和 §4 中"本文第五节"替换为"本文 §5"，符合 03 章节引用规范；
  3. 7 个文件中引用 13 或 14 的"稳定后"条件移除，改为直接列出补齐内容和依据文件：
     - 11 §9、12 §9、11.01 §11、11.03 §10、12.01 §12、12.02 §12
consequences: |
  - 14 术语与 13 保持一致，消除"模型模型"冗余；
  - 11 引用格式符合 03 规范；
  - 待补齐事项不再包含已满足的前提条件，明确为可执行工作项。
