id: workcase-0017
type: workcase
title: LDVH 安装验收 Code 与 ldvh-install bootstrap skill
goal: |
  承接 spark-0034 的安装体系收口部分，把 specs/33 的安装行动从纯流程文本推进为可执行、可诊断、可复用的安装验收能力。目标是新增确定性 verify/doctor Code，并设计 `ldvh-install` bootstrap skill 作为安装前入口，避免用户在 Codex、WorkBuddy、Claude Code、Trae 等不同环境部署 LDVH 时因为插件、Rules、Hook payload 或 receipt 验收不完整而复发。
status: subagents_plan_reviewing
created: '2026-06-27T04:10:00+08:00'
updated: '2026-06-27T04:10:00+08:00'
priority: P1
description: |
  specs/33 已定义 LDVH 安装与首次配置行动，但目前仍主要依赖 AI 按文字流程引导。Human 指出 `ldvh-install` skill 才应是安装前入口，同时也指出启动悖论：LDVH 尚未安装时，不能依赖 LDVH Runtime Protocol、Hook receipt 或 Rules 入口来调度安装。

  本 WorkCase 聚焦安装前 bootstrap 与安装后验收之间的边界：`ldvh-install` skill 是 bootstrap skill，不要求 runtime 已生效；确定性 Code 负责环境检测、插件/Rules 检查、target-first smoke、Hook payload smoke、receipt smoke 和 doctor 输出；安装成功后，日常工作才交给 Runtime Protocol / Hook / Rules。
success_criteria: |
  - [ ] specs/33 明确 bootstrap 边界：安装行动不得假设 LDVH runtime 已经生效；安装前入口可以是 `ldvh-install` skill 或独立命令。
  - [ ] 新增安装验收 Code（如 `code/ldvh_runtime_install.py` 或等价入口），提供 verify / doctor 能力，避免把安装验收只写在 prose 中。
  - [ ] verify 覆盖 workspace root + target-first、项目目录 smoke、Hook payload target、receipt / last_pre_tool_use、非管辖 no-op、坏 adapter 诊断。
  - [ ] doctor 能区分插件未安装、Hook 未触发、adapter payload 缺失、target-first 失败、receipt 缺失、read_plan 未消费、非管辖 no-op 等不同失败原因。
  - [ ] 设计 `ldvh-install` skill：只读取 specs/33 并调用安装验收 Code，不复制第二套安装逻辑；skill 不要求 session receipt 或 governed 项目已存在。
  - [ ] specs/04 入口表、08 完整验证表和 specs/33 安装验收表同步新增安装验收 Code / skill 的入口和输出边界。
  - [ ] 验证证明安装验收不会让明确非管辖项目进入高打扰模式。
source: |
  来源 Spark：`ldvh-base/sparks/spark-0034-adapter-payload-gap-workbuddy.yaml`。

  Human 指出：如果只靠 specs/33 人工执行，跨环境部署仍可能再次出现 adapter / plugin 安装错误；但 `ldvh-install` skill 又不能依赖 LDVH 已经安装。因此需要将安装前 bootstrap skill、确定性验收 Code 和安装后 Runtime Protocol 分层。
orchestration:
  mode: sequential
  execution_items:
