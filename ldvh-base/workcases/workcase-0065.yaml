title: Gate 1 能力限制披露与切换角色审核降级
goal: 在保持审核只读和如实留痕的前提下，使缺少独立 subagent 能力的运行环境能够在 Gate 1 前结构化披露能力限制，并以 same-ai-switched-role-read-only 完成明确属于较低保证的 creation review；Gate 1 向 Human 同时呈现该实际审核方式、保证缺口和后续 fallback policy，由 Human 决定是否接受这些材料作为执行基线，并仅在批准后允许被覆盖类别的 PlanΔ/result fallback；禁止将 switched-role 方式冒称为 subagent 审核、执行环境独立审核或等价保证。
scope: 修改 specs/21-WorkCase-工作项.md，建立无 subagent 环境的 Gate 1 前 bootstrap：当前观察与证据确认 creation_review 所需 subagent 不可用时，可在 Gate 1 前由同一 AI 切换 Reviewer 角色完成明确低保证、只读且如实标注的 creation review；该 review 是已经发生的实际方法，Gate 1 不追溯授权它发生，而是向 Human 呈现能力限制、实际方法、保证缺口和后续 fallback policy，由 Human 决定是否接受这些材料作为执行基线，拒绝时不进入执行。PlanΔ/result fallback 只在 Gate 1 已批准 policy、类别、当前证据、stop conditions 与 fingerprint 同时匹配时准入。同步建立 authorization baseline/fingerprint 绑定、实际方法闭集、兼容和生命周期校验；在 specs/attachments/05.Att.01-事实对象统一字段登记.md 登记新增统一字段，仅在新增机械检查确需登记检查入口时修改 specs/attachments/05.Att.02-事实对象机械校验目录.md；更新 specs/34-WorkCase获批计划执行行动模板.md、specs/08-Web 呈现与交互规范.md 及必要的 specs/attachments/08.Att.01-Web API 阅读契约字段表.md，令 Gate 1 分别展示已发生 creation review actual method/assurance 与未来 policy，不把预计方式显示为事实；实现必要的事实模型验证、canonical authorization projection/fingerprint、创建/转换校验、Schema、Web 类型与详情展示，补 bootstrap、正反、兼容、fingerprint、Web 实际展示测试及全库完整性验证。不新增 Gate 0、临时对象形状、phase、status 或 Helper operation。Gate 1 批准后仅通过 Helper 将仍 open 的 spark-0061 合法转换为 routed：status=routed、移除 priority、形成完整 disposition_summary、建立 routed-to 稳定三元组并更正把 WC0062 说成已实现目标的失真载体文字；这是 Spark 自身的前瞻性终态处置，不是 WC0062 residual 的转交或补路由。全部 item terminal、验证和隔离成立后才允许本地受控提交。不修改 WC0062 的 cancelled/accept_stop 终态、residual_responsibilities、历史结论或 change_log；不实现 spawn/subagent 平台能力；不 push、PR、发布；不混入 WC0063、WC0064 或用户无关改动。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: capability_limitations 形成可机械校验的最小契约：记录当前环境不支持独立 subagent 的当前观察与可复核证据、受影响审核类别闭集 creation_review/plan_delta_review/result_review、fallback_policy、assurance_gap 与 stop_conditions；能力状态未知、未观察或证据不足时停止而不得推断 fallback；字段缺失表示无 fallback，已有合法 WorkCase 不因新增条件字段失效。
- criterion_id: criterion-02
  statement: capability limitation 与 fallback policy 进入 Gate 1 canonical authorization baseline/fingerprint；creation fallback 的实际记录在 Gate 1 前形成并随材料呈现，Gate 1 批准表示 Human 接受该较低保证作为执行依据及批准后续 policy，不追溯把它变成独立审核；未批准不得进入执行，PlanΔ/result fallback 未纳入 fingerprint 或未获批准必须拒绝。
- criterion_id: criterion-03
  statement: review 实际方法闭集至少区分 subagent-read-only 与 same-ai-switched-role-read-only；actual method 只能随真实 review 形成；same-AI 记录必须引用当前 capability limitation、适用类别、证据与 assurance_gap，绝不标成 subagent、执行环境独立或等价保证。
- criterion_id: criterion-04
  statement: 默认优先真实 subagent。creation_review 在当前证据确证 subagent 不可用、limitation 覆盖 creation_review 且 policy 与 stop conditions 允许时，可在 Gate 1 前由 same-AI switched-role 完成低保证只读审核，Human 在 Gate 1 看到实际方法和缺口后决定是否执行；PlanΔ/result 仅在 Gate 1 已批准 policy 覆盖类别，且当前证据、stop conditions 与 fingerprint 匹配时才可 same-AI；未知、证据不足或不匹配均停止。已有 limitation 但实际 subagent 可用时仍使用真实 subagent。
- criterion_id: criterion-05
  statement: Gate 1 Web 详情与 API 阅读契约分栏展示实际已发生的 creation review method/assurance 与未来 fallback policy；未发生的 PlanΔ/result 不生成 actual method；Human 决定文案明确为接受较低保证并允许执行及后续 policy，不表述为追溯授予独立性；字段缺失或不可解析时显式报告问题。
- criterion_id: criterion-06
  statement: 测试覆盖 bootstrap 正反：无 subagent、有当前证据且 limitation 覆盖 creation_review 时可形成 Gate 1 前 switched-role review 并到达 Gate 1；Human 拒绝时不执行；creation fallback 不错误要求 prior execution_approval。并覆盖真实 subagent、limitation 存在但 subagent 可用、能力未知或证据不足、PlanΔ/result 未批准、类别或模式不匹配、虚假 subagent 标注、旧对象兼容、fingerprint 稳定排序与语义变化、Web 实际字段展示及缺失或不可解析提示；相关与全量测试以及 check-fact-integrity 通过。
- criterion_id: criterion-07
  statement: spark-0061 形成完整合法 after：status=routed、priority 不存在、disposition_summary 说明 WC0065 对原始信息需求的完整承接及下游未完成边界、routed-to 目标为 {ldvh, workcase, workcase-0065}，且失真文字被更正；WC0062 无写入；受控提交仅含本 WC 精确路径闭集并通过 Git Gate，不执行 push、PR 或发布。
