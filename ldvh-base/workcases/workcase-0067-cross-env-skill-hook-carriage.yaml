    status: done
    result_summary: |-
      verification: ## 验证计划

      - 只读检索 ECC 相关 refs、research、specs 或历史材料，优先查找能力适配、触发机制、Hook、Skill、自动化承接、降级和运行投影相关内容。
      - 对照 LDVH `skills/`、`hooks/`、`agents/`、`rules/` 资产定位，以及 04.03、04.06、11.01 当前表述，形成跨环境能力差异处理方案。
      - 至少给出一个具体案例：Codex 的 Skill + Hook 组合如何在 Trae 只有 Skill 的情况下承接或降级。

      ## 验证结果

      2026-06-11 已完成只读研究，覆盖 ECC 预处理材料、ECC 源资料、LDVH 04/11 规范与 Trae/Codex/Claude Code refs。

      结论：Codex 的 Skill + Hook 组合迁到 Trae Skill-only 时，不能声明等价承接。应拆分为 Skill 承接流程、Rules / Instructions 承接入口约束、Command / Code / CI 承接显式校验、Human Gate 承接授权、Task / open_items 记录缺口；矩阵类型应标为“指令承接”或“人工降级”，最多在存在薄入口和验证证据时标为“适配承接”。

      Skill 是可复用任务能力或流程说明，不提供事件级强制触发；Hook 是事件驱动自动化，适合工具执行前后或会话生命周期节点；Rules / Instructions 适合入口可见约束；Agent 适合独立上下文和专项审查；Code / Command / CI 适合把 Hook 原本做的确定性检查迁成显式命令、校验脚本或 CI。

      具体案例：Codex/Claude Code 风格的 verification-loop Skill + Stop/PostToolUse Hook，在 Trae Skill-only 中应改为 Trae Skill 说明最终响应前验收流程，配合 Rule 要求修改后显式运行校验，可选 Command 封装 `/verify-before-final`，并明确这不是 Stop/PostToolUse Hook，不会自动触发。

      后续 Task 边界：修改 04.03，补充跨环境组合能力必须拆分到具体能力面；修改 04.06，新增组合能力矩阵卡片或字段级校验要求；修改 11.01，补充第三方 Skill 不得冒充 Hook/自动触发能力；扩展 Code 校验，检查 Hook/lifecycle 承接项是否包含承接降级、不可模拟能力、验证命令或待补齐事项。

      closure_evidence: ## 验证结果

      已完成跨环境 Skill / Hook 能力承接差异只读研究，明确 Skill-only 不能等价承接 Skill + Hook 组合效果，必须拆分到 Skill、Rules / Instructions、Command / Code / CI、Human Gate、Task / open_items 等能力面。

      ## 结论

      本 Task 只产出研究结论，不直接修改 04.03、04.06、11.01 或 Code 校验。后续应通过独立 Task 把组合能力拆分规则写入规范和校验，且不得把 Trae Skill-only 标为 Hook 等价或原生承接。
