title: WorkCase 执行期 Human 输入处理规则——消除获批执行后 AI 非预期停止
status: open
priority: P1
intent: workcase-0091 Gate 1 批准后，AI 在 executing 阶段停下来询问 Human '是否开始执行 item-1'，而非按 34 §5.2 的 Controller 持续收敛链自动继续。审核与分析确认根因是回合制对话模型（Human 输入→AI 输出→停等）与 LDVH 的 Controller-owned 收敛链（读投影→消费 next_required_control_step→继续直到合法退出）不匹配。规则层面缺少一条针对 AI 回合制模型的显式指令：Human 在 executing 阶段的输入不自动成为交还信号，Controller 必须读投影判断是否到了合法退出点才停下。本 Spark 承接该缺口，在 34 §5.2 中增加显式执行期 Human 输入处理规则与单次回合执行边界判定，在 21 §9.3 投影表中补注 handoff_narrative_key 语义，并同步评估是否需要配合 Code 层微调。
summary: "## 问题\n\nworkcase-0091 在 Gate 1 批准（human_plan_confirming → executing）后，AI 没有按 34 §5.2 的执行循环自动继续，而是停下来询问 Human '是否开始执行 item-1'。\n\n### 分析根因\n\n独立审核确认了 7 个语义盲区中的核心问题：\n\n1. **回合制思维 vs Controller 收敛链**：AI 的默认行为模式是 Human 输入→处理→输出→停等。但 LDVH 的规则要求 Gate 1 获批后，executing 阶段的 Controller 持续消费 projection 中的 next_required_control_step，直到命中 34 §5.4 的合法退出条件才停下。\n2. **waiting_on 移除后失去指引**：human_plan_confirming 时 waiting_on 指向 Human，转换到 executing 后 waiting_on 被移除，且 executing 不允许 Human 作为等待对象。AI 的'没有明确等待对象=不知道该做什么=问 Human'倾向与规则冲突。\n3. **34 §5.4 合法退出清单未被引用**：pending item 被明确列为'不是完成出口'。批准后所有 item 均为 pending，没有任何合法退出条件成立，AI 本应据此知道不能停。\n4. **投影 handoff_narrative_key 语义未被检查**：executing 的 handoff_narrative_key 是 item_execution_in_progress，不是任何等待类 key。检查这个 key 就能直接判断当前不是等待 Human 的位置。\n\n### 审核员纠正\n\n原分析中'在转换同事务中启动 item-1 为 in_progress'的建议不准确。21 §6.3.3 转换表只要求写入 approval、进入 executing、移除 Human waiting，不要求同事务启动 item。正确关系是：转换事务只完成 phase 切换，后续执行循环的稳定检查点中再读 projection 并开始 item。\n\n### 审核员补充的遗漏\n\n- 34 §5.4 合法退出清单：pending item 不是合法出口\n- 投影 handoff_narrative_key=item_execution_in_progress 不是等待类 key\n- next_required_control_step=advance_current_work_item 已足够精确指导下一步\n\n## 待判断\n\n1. 34 §5.2 是否需要增加显式规则：'executing 阶段且 waiting_on 不存在时，Controller 必须自动继续执行未完成的 item，不得向 Human 询问下一步'？\n2. 是否需要增加'单次回合执行边界'规则，把'何时停下'从'Human 说话了'（回合制默认）改为'投影 handoff_narrative_key 指向合法退出'（LDVH 规则驱动）？\n3. 21 §9.3 投影表是否需要补注 handoff_narrative_key 语义，显式列出哪些 key 是等待类、哪些是执行类？\n4. Code 层是否需要配合调整？例如 workcase_projection.py 在转换后 projection 中强化 next_required_control_step 语义？\n5. 是否需要增加一条'Human 输入判断流程'规则，帮助 AI 在每次 Human 输入后正确判断是否属于合法交还点？"
