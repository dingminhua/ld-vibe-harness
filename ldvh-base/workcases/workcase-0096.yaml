  outcome: satisfied
  summary: 规则仅以 responsibility_key 加精确 H2/H3 读取；Study 仅以稳定 study fact_ref 加固定 H2 读取。缺失、失活、机械不合格、范围不完整或边界不匹配均明确拒绝或不可用，无模糊回退。
- criterion_id: criterion-baseline
