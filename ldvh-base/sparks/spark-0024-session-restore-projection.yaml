title: 会话恢复投影器：用事实源缓解 AI 无状态
status: pending
created: '2026-06-24T10:49:34.205232'
updated: '2026-06-25T01:16:19+08:00'
description: |
  最新知识地图价值评估报告把“缓解无状态”仍评为中，原因是知识地图能实时重建事实结构，但不能替代跨会话记忆。这个判断是合理的：LDVH 不应让知识地图缓存会话结论或变成第二事实源，而应从 WorkCase、ADR、Spark、Pitfall、Study、specs、Rules 和 Git commit records 中实时投影当前局面。

  本 Spark 记录一个候选能力：增加只读的会话恢复投影器，例如 `session-restore` 或等价 Code 入口。它在新会话、`/compact`、线程恢复或上下文恢复后输出当前 HEAD、dirty files、未关闭 WorkCase、待 Human Gate、最近验证结论、残留风险、推荐 `start_node` / `task_type` 和下一条知识地图查询。

  该能力的边界是：只读投影，不保存记忆，不写回事实源，不替代 WorkCase 关闭、ADR 决策或 Git 追溯。若要长期保留判断，仍必须写入对应事实对象或 Git commit。
source: conversation
priority: P1
source_detail: 用户追问“缓解无状态：中”是什么意思，以及如何把它提升；主控解释后形成“会话恢复投影器”候选方向，并建议与入口触发链拆成两个 Spark。外部输入文件《LDVH-知识地图价值重新评估报告-v2-20260624.md》仅提炼“会话恢复投影”需求，不建立文件级关系引用。
