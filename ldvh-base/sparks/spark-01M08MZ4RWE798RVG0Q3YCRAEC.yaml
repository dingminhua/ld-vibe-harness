title: sources/verification 固定 tax 优化
status: open
priority: P2
intent: 保留 Helper 每次响应都无条件携带 sources 与 verification 段（合计约 2.6-4.1KB/次）是否存在稳定过量传输的交互摩擦，判断是否应引入 compact profile 或轻量引用机制，而不依赖固定模型统计对比。
summary: "## 来源\n\n从 spark-01M05X08QQE09TVT8EVXAP6ZMM「Helper 读交互优化」中分离出的独立出口。该 Spark 的 P2 候选「sources/verification 固定 tax」经审核确定与写回链路读取过重（P1）是两件事，共享 common_response() 代码点但问题本质不同，应单独跟踪。\n\n## 当前状态\n\n每次只读操作无条件携带 2.6-4.1KB sources + verification 段，即使调用方不需要。\n\n## 实测量化\n\n| 操作 | 总响应 | sources | verification | 无用比例 |\n|---|---|---|---|---|\n| read-action-template-candidates | 11.9KB | 4.1KB | 4.4KB | 71% |\n| read-action-template-content | 20.9KB | 1.8KB | 0.8KB | 12% |\n| capabilities --summary | 20.6KB | 11.5KB | 0 | 56% |\n\n最极端情况：read-action-template-candidates 的 verification（4.1KB）比 result（2.8KB）还大。\n\n## 代码位置\n\n`code/ldvh/helper/responses.py` L72-102（`common_response()` 恒带 sources/verification，即使调用方不需要）。\n\n## 候选方向\n\n1. **批量/盘点场景用轻量 source_refs**：仅引用 key，不展开 details；单卡 F3 读时带全量溯源\n2. **新增 compact profile 参数**：调用方请求 compact 时省略 sources/verification；默认保持现状\n3. **按需延迟生成**：只在调用方明确请求时才填充 sources/verification（风险高，改变现有契约行为）\n\n## 当前状态\n\n待证据积累。P2 门槛需要跨多个真实任务统计「调用方不需要溯源段」的频率，目前仅有单次体积分解的实测数据。\n\n## 与原 Spark 的关系\n\n与 spark-01M05X08QQE09TVT8EVXAP6ZMM 共享 common_response() 代码点，但问题本质不同：\n- 原 Spark Step 4 是「写回链路的三次读取太重」（读什么的问题）\n- 本 Spark 是「所有只读响应固定带 tax」（包装层的问题）\n\n两者独立解决。如果先做 compact profile 机制，原 Spark 的 capabilities 校验子项会顺带受益。"
