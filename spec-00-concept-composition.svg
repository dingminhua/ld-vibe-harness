<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SPEC 00 理念与构成：LDVH Harness 构成图</title>
  <desc id="desc">基于 00 文档重新理解后的图形化表达：LDVH 把不稳定的自然语言意图，通过事实源边界、保障衔接层、五类构成要素、Human Gate 与 V1-V9 价值标尺，约束成可执行、可验证、可交还的 AI 工作系统。</desc>
  <defs>
    <radialGradient id="bgCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 560) rotate(28) scale(650 430)">
      <stop offset="0" stop-color="#253BFF" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#060810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1270 260) rotate(116) scale(430 300)">
      <stop offset="0" stop-color="#FFD36A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#060810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgRed" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 1025) scale(860 260)">
      <stop offset="0" stop-color="#FF3D7F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#060810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitStroke" x1="270" y1="190" x2="1260" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.82"/>
      <stop offset="0.52" stop-color="#8B5CF6" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#F4C76B" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="gateStroke" x1="105" y1="935" x2="1495" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4D7D"/>
      <stop offset="0.55" stop-color="#FF86A5"/>
      <stop offset="1" stop-color="#F4C76B"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="580" y1="422" x2="980" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D2B68" stop-opacity="0.98"/>
      <stop offset="0.52" stop-color="#251B58" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0B2530" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="softShadow" x="-80" y="-80" width="1760" height="1360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="cyanGlow" x="-80" y="-80" width="1760" height="1360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#22D3EE" flood-opacity="0.28"/>
    </filter>
    <filter id="goldGlow" x="-80" y="-80" width="1760" height="1360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#F4C76B" flood-opacity="0.30"/>
    </filter>
    <filter id="redGlow" x="-80" y="-80" width="1760" height="1360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#FF4D7D" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="0.7" fill="#FFFFFF" opacity="0.05"/>
      <circle cx="12" cy="13" r="0.55" fill="#FFFFFF" opacity="0.035"/>
      <circle cx="16" cy="6" r="0.55" fill="#F4C76B" opacity="0.04"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGold" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#F4C76B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPink" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#FF4D7D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #EEF2FF; }
      .muted { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #A8B1C7; }
      .mono { font-family: "Share Tech Mono", "JetBrains Mono", monospace; fill: #98A4BD; letter-spacing: 2px; }
      .num { font-family: "Orbitron", "Noto Sans SC", sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#060810"/>
  <rect width="1600" height="1200" fill="url(#bgCore)"/>
  <rect width="1600" height="1200" fill="url(#bgGold)"/>
  <rect width="1600" height="1200" fill="url(#bgRed)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <rect width="1600" height="1200" fill="url(#grain)"/>

  <text x="72" y="74" class="mono" font-size="24">LD VIBE HARNESS · SPEC 00</text>
  <text x="72" y="142" class="label" font-size="64" font-weight="900">理念与构成</text>
  <text x="72" y="190" class="muted" font-size="30">把 00 读成一个让 AI 稳定工作的 Harness：少猜、少漂移、可验证、可交还。</text>
  <line x1="72" y1="226" x2="1528" y2="226" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- left instability funnel -->
  <g filter="url(#softShadow)">
    <path d="M86 303C86 282 103 265 124 265H382C403 265 420 282 420 303V836C420 857 403 874 382 874H124C103 874 86 857 86 836V303Z" fill="#0D1424" fill-opacity="0.86" stroke="#334155" stroke-width="1.5"/>
    <text x="122" y="320" class="mono" font-size="18">UNSTABLE FIELD</text>
    <text x="122" y="370" class="label" font-size="32" font-weight="900">没有 Harness 时</text>
    <text x="122" y="410" class="muted" font-size="23">自然语言目标进入概率性推理，</text>
    <text x="122" y="442" class="muted" font-size="23">如果缺少事实、状态和验证，</text>
    <text x="122" y="474" class="muted" font-size="23">产出会逐渐变成维护负担。</text>

    <g transform="translate(122 536)">
      <rect width="240" height="62" rx="18" fill="#351222" stroke="#FF4D7D" stroke-opacity="0.55"/>
      <circle cx="32" cy="31" r="13" fill="#FF4D7D" fill-opacity="0.18" stroke="#FF4D7D"/>
      <path d="M27 25L37 37M37 25L27 37" stroke="#FF86A5" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="26" class="label" font-size="21" font-weight="800" fill="#FFAAC0">概率性推理</text>
      <text x="58" y="51" class="muted" font-size="18">不是确定性编译</text>
    </g>
    <g transform="translate(122 626)">
      <rect width="240" height="62" rx="18" fill="#221A4A" stroke="#8B5CF6" stroke-opacity="0.58"/>
      <circle cx="32" cy="31" r="13" fill="#8B5CF6" fill-opacity="0.20" stroke="#A78BFA"/>
      <path d="M24 31H40M32 23V39" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="26" class="label" font-size="21" font-weight="800" fill="#D8B4FE">上下文依赖</text>
      <text x="58" y="51" class="muted" font-size="18">缺失或过载都会漂移</text>
    </g>
    <g transform="translate(122 716)">
      <rect width="240" height="62" rx="18" fill="#0B3438" stroke="#22D3EE" stroke-opacity="0.54"/>
      <circle cx="32" cy="31" r="13" fill="#22D3EE" fill-opacity="0.18" stroke="#67E8F9"/>
      <path d="M24 38C29 24 36 24 41 38" stroke="#A5F3FC" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="26" class="label" font-size="21" font-weight="800" fill="#A5F3FC">无状态断裂</text>
      <text x="58" y="51" class="muted" font-size="18">跨会话依据易丢失</text>
    </g>
  </g>

  <!-- arrow to harness -->
  <path d="M430 565C470 565 494 565 528 565" stroke="#22D3EE" stroke-width="4" stroke-opacity="0.85" marker-end="url(#arrowCyan)"/>
  <text x="450" y="535" class="mono" font-size="17" fill="#22D3EE">被约束进入</text>

  <!-- central harness diagram -->
  <g filter="url(#cyanGlow)">
    <ellipse cx="780" cy="565" rx="356" ry="290" stroke="url(#orbitStroke)" stroke-width="2.5" stroke-opacity="0.74"/>
    <ellipse cx="780" cy="565" rx="282" ry="222" stroke="#8B5CF6" stroke-width="1.6" stroke-opacity="0.40"/>
    <ellipse cx="780" cy="565" rx="212" ry="166" stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.30" stroke-dasharray="10 14"/>
  </g>

  <!-- fact boundary and bridge layer as foundation rails -->
  <g filter="url(#softShadow)">
    <rect x="522" y="808" width="254" height="50" rx="25" fill="#062F35" stroke="#22D3EE" stroke-opacity="0.75"/>
    <text x="582" y="840" class="label" font-size="23" font-weight="850" fill="#A5F3FC">事实源边界</text>
    <text x="545" y="886" class="muted" font-size="19">有 Git，可溯源 · 有组织，可消费</text>

    <rect x="804" y="808" width="288" height="50" rx="25" fill="#2E2310" stroke="#F4C76B" stroke-opacity="0.78"/>
    <text x="875" y="840" class="label" font-size="23" font-weight="850" fill="#FDE68A">保障与衔接层</text>
    <text x="826" y="886" class="muted" font-size="19">内部保障 · 外部衔接 · 行动指南</text>
  </g>

  <!-- core -->
  <g filter="url(#softShadow)">
    <rect x="592" y="440" width="376" height="238" rx="42" fill="url(#coreFill)" stroke="#B4C6FF" stroke-opacity="0.58" stroke-width="1.6"/>
    <circle cx="780" cy="518" r="55" fill="#101A3A" stroke="#22D3EE" stroke-opacity="0.72" stroke-width="2"/>
    <path d="M752 518C752 500 765 488 780 488C795 488 808 500 808 518C808 536 795 548 780 548C765 548 752 536 752 518Z" fill="#22D3EE" fill-opacity="0.18" stroke="#A5F3FC" stroke-width="2"/>
    <path d="M735 518H752M808 518H825M780 473V488M780 548V563" stroke="#A5F3FC" stroke-width="3" stroke-linecap="round"/>
    <text x="694" y="610" class="label" font-size="38" font-weight="950">AI 执行者</text>
    <text x="650" y="648" class="muted" font-size="22">第一服务对象，不是自由发挥主体</text>
    <text x="694" y="688" class="mono" font-size="18" fill="#67E8F9">understand · plan · judge · dispatch · generalize</text>
  </g>

  <!-- five elements nodes -->
  <g filter="url(#softShadow)">
    <rect x="610" y="274" width="340" height="86" rx="24" fill="#101729" stroke="#A78BFA" stroke-opacity="0.70"/>
    <text x="640" y="312" class="label" font-size="28" font-weight="900" fill="#DDD6FE">规范体系</text>
    <text x="640" y="344" class="muted" font-size="20">定义产品、边界、保障要求</text>
    <path d="M780 360V438" stroke="#A78BFA" stroke-width="3" stroke-opacity="0.55" marker-end="url(#arrowCyan)"/>

    <rect x="464" y="432" width="244" height="86" rx="24" fill="#062A32" stroke="#22D3EE" stroke-opacity="0.75"/>
    <text x="496" y="470" class="label" font-size="28" font-weight="900" fill="#A5F3FC">事实模型</text>
    <text x="496" y="502" class="muted" font-size="20">事实、状态、证据、经验</text>
    <path d="M708 492C735 500 755 510 780 518" stroke="#22D3EE" stroke-width="3" stroke-opacity="0.58" marker-end="url(#arrowCyan)"/>

    <rect x="852" y="432" width="274" height="86" rx="24" fill="#0C2B20" stroke="#7DD9A6" stroke-opacity="0.70"/>
    <text x="884" y="470" class="label" font-size="28" font-weight="900" fill="#BBF7D0">行动模板</text>
    <text x="884" y="502" class="muted" font-size="20">复用路径、验证、交还</text>
    <path d="M852 492C820 505 800 514 780 518" stroke="#7DD9A6" stroke-width="3" stroke-opacity="0.56" marker-end="url(#arrowCyan)"/>

    <rect x="544" y="694" width="244" height="84" rx="24" fill="#2C2410" stroke="#F4C76B" stroke-opacity="0.78"/>
    <text x="578" y="731" class="label" font-size="28" font-weight="900" fill="#FDE68A">Code</text>
    <text x="578" y="763" class="muted" font-size="20">确定性校验与反馈</text>
    <path d="M690 694C720 664 744 642 764 620" stroke="#F4C76B" stroke-width="3" stroke-opacity="0.56" marker-end="url(#arrowGold)"/>

    <rect x="812" y="694" width="264" height="84" rx="24" fill="#351222" stroke="#FF4D7D" stroke-opacity="0.72"/>
    <text x="846" y="731" class="label" font-size="28" font-weight="900" fill="#FFAAC0">Web</text>
    <text x="846" y="763" class="muted" font-size="20">Human-facing 状态与证据</text>
    <path d="M920 694C890 660 862 640 832 620" stroke="#FF4D7D" stroke-width="3" stroke-opacity="0.52" marker-end="url(#arrowPink)"/>
  </g>

  <!-- right value gauge -->
  <g filter="url(#goldGlow)">
    <rect x="1166" y="265" width="348" height="610" rx="42" fill="#171207" fill-opacity="0.88" stroke="#F4C76B" stroke-opacity="0.70" stroke-width="1.8"/>
    <text x="1210" y="324" class="label" font-size="36" font-weight="950" fill="#FDE68A">V1–V9 行动标尺</text>
    <text x="1210" y="363" class="muted" font-size="22">判断机制是否真正减少 AI 负担</text>

    <g transform="translate(1210 418)">
      <rect width="252" height="74" rx="20" fill="#2E2410" stroke="#F4C76B" stroke-opacity="0.45"/>
      <text x="26" y="32" class="label" font-size="24" font-weight="850" fill="#FDE68A">读得准</text>
      <text x="26" y="60" class="muted" font-size="20">V1 定位 · V2 理解 · V3 判断</text>
    </g>
    <g transform="translate(1210 514)">
      <rect width="252" height="74" rx="20" fill="#1E1B4B" stroke="#8B5CF6" stroke-opacity="0.55"/>
      <text x="26" y="32" class="label" font-size="24" font-weight="850" fill="#DDD6FE">做得稳</text>
      <text x="26" y="60" class="muted" font-size="20">V4 执行 · V5 确认 · V6 验证</text>
    </g>
    <g transform="translate(1210 610)">
      <rect width="252" height="74" rx="20" fill="#073035" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="26" y="32" class="label" font-size="24" font-weight="850" fill="#A5F3FC">回得准</text>
      <text x="26" y="60" class="muted" font-size="20">V7 格式回写</text>
    </g>
    <g transform="translate(1210 706)">
      <rect width="252" height="74" rx="20" fill="#351222" stroke="#FF4D7D" stroke-opacity="0.55"/>
      <text x="26" y="32" class="label" font-size="24" font-weight="850" fill="#FFAAC0">人能判，体系能长</text>
      <text x="26" y="60" class="muted" font-size="20">V8 范式交互 · V9 主动迭代</text>
    </g>
    <path d="M1166 570C1128 570 1102 570 1068 570" stroke="#F4C76B" stroke-width="3" stroke-opacity="0.62" marker-end="url(#arrowGold)"/>
  </g>

  <!-- top anchor badge -->
  <g filter="url(#goldGlow)">
    <rect x="1204" y="72" width="324" height="92" rx="30" fill="#1E1A0D" fill-opacity="0.82" stroke="#F4C76B" stroke-opacity="0.75" stroke-width="2"/>
    <text x="1240" y="112" class="label" font-size="30" font-weight="950" fill="#FDE68A">最高价值锚点</text>
    <text x="1240" y="145" class="mono" font-size="20">active · canonical spec</text>
  </g>

  <!-- human gate -->
  <g filter="url(#redGlow)">
    <rect x="86" y="944" width="1428" height="150" rx="42" fill="#250817" fill-opacity="0.90" stroke="url(#gateStroke)" stroke-width="3"/>
    <circle cx="154" cy="1019" r="42" fill="#33101F" stroke="#FF4D7D" stroke-width="4"/>
    <rect x="139" y="991" width="11" height="58" rx="6" fill="#FF4D7D"/>
    <rect x="160" y="991" width="11" height="58" rx="6" fill="#FF4D7D"/>
    <text x="230" y="1008" class="label" font-size="38" font-weight="950" fill="#FF7AA2">Human Gate</text>
    <text x="472" y="1008" class="muted" font-size="27">影响最高锚点、事实源边界、五类要素或 V1–V9 时，必须暂停。</text>
    <text x="230" y="1057" class="label" font-size="25">AI 可以准备事实、影响范围、风险和选项；但不能把自己的结论、工具成功或 Web 展示替代 Human 确认。</text>
  </g>

  <!-- bottom thesis -->
  <text x="72" y="1162" class="muted" font-size="23">我的图解：00 不是普通说明文档，而是 LDVH 的价值坐标系——所有机制都要证明自己能让 AI 更稳定、更可验证、更可交还。</text>
</svg>
