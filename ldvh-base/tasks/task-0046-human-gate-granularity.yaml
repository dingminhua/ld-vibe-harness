description: |
  当前 LDVH 的 Human Gate 是全有或全无，借鉴 Gstack 可配置确认粒度和 BMAD Headless 豁免，
  为 LDVH 引入按风险级别配置的 Human Gate：
  1. 高风险操作（规范修改、Contract 变更、删除事实源）强制确认
  2. 中风险操作（Task 状态流转、字段更新）默认确认但可配置
  3. 低风险操作（文档格式调整、注释修改）可自动通过
  此任务涉及 Human Gate 机制变更，需先产出 ADR 再修订规范。
