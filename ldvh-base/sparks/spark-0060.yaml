title: 全量测试耗时预估 — 使 AI 在启动前了解测试预期耗时以编排工作流程
status: open
priority: P2
intent: LDVH 的 full-v4 全量测试包含 6 个步骤（ruff lint、pytest code/tests、fact-integrity、web typecheck、web tests、web build），当前无任何耗时预估机制，AI 在启动前不知道预期耗时多长，无法合理编排工作流程。若不做此功能，AI 要么盲目启动全量测试后长时间等待，要么因怕耗时过长而不敢启动，影响回归验证的效率与意愿。
summary: "**问题**\n\n当前 full-v4 全量测试执行没有耗时预估机制：\n- AI 调用 `tools/run_full_tests.py start` 前不知道每个步骤的预期耗时\n- 测试运行记录（`test_runs.py` 的 v1/v2 record）不登记 step 级别的耗时统计\n- Web 测试结果展示无历史耗时对比\n- AI 无法根据耗时长短决定：是否排队后台运行、是否缩小测试范围、是否在当前上下文等待\n\n**现状数据**\n\n- Python 测试：~85 个测试文件（code/tests/），包含 57+ 收集用例（当前 76 个 collection errors），全量运行耗时较长\n- Web 测试：33 个 API 契约测试文件（web/tests/api/），使用 tsx --test 运行\n- full-v4 plan 固定 6 步：[code-lint, code-tests, fact-integrity, web-typecheck, web-tests, web-build]\n\n**需求**\n\n1. **运行记录侧**：在 `test_runs.py` 的 v2 record 中，为每个 step 登记实际耗时（duration_seconds 或从 started_at/ended_at 派生）；积累历史运行数据后提供分步耗时统计（最近 N 次的均值/中位数）\n2. **查询接口**：让 AI 在调用全量测试前能通过 `status` 或新增查询获取历史耗时预估（\"最近 3 次 code-tests 平均耗时 X 秒\"）\n3. **Web 展示**：在 Web 测试运行结果页面或测试记录详情中展示每步耗时和总耗时，并可选展示历史对比\n4. **AI 决策依据**：AI 获得耗时预估后，可根据上下文剩余容量决定：排队后台运行（`start` 返回后继续其它工作）、缩小范围（只跑相关 tests）、或等待结果\n\n**边界**\n\n- 本议题不要求改变 full-v4 的 6 步固定计划，只要求在现有框架内增加耗时登记与查询\n- 不要求实时进度估算（ETA），只要求基于历史数据的事前预估\n- 历史数据积累前，可以先登记固定经验值（如：lint ~5s、code-tests ~60s、fact-integrity ~10s、web-typecheck ~30s、web-tests ~120s、web-build ~60s），实际运行后逐步替换为真实统计数据\n- 不要求新增 full-v4 的步骤或改变现有步骤的执行逻辑\n\n**候选方向**\n\n1. 在 v2 record 的 step 结构中增加 `duration_seconds` 字段（可从已有的 `started_at`/`ended_at` 派生，或直接登记）\n2. 在 `test_runs.py` 或新增模块中维护最近 N 次运行的分步耗时统计（JSON 文件，随运行记录一起管理）\ngit 3. 在 `tools/run_full_tests.py` 的 `status` 命令输出中增加耗时预估信息，或新增 `estimate` 子命令\n4. Web 端在测试运行详情页展示每步耗时条/图表\n5. 在 07 §10.1 或测试行动模板中补充：AI 启动全量测试前应查询耗时预估并据此决策\n\n**待判断**\n\n- 耗时统计的持久位置：依附于 `.ldvh-test-runs/` 下的运行记录，还是独立的统计文件\n- 历史窗口大小：最近 3 次、5 次还是全部\n- Web 展示的颗粒度：是否需要趋势线，还是简单数字即可\n- 是否需要区分首次运行（无历史数据）和后续运行（有历史数据）的预估行为"
