name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog entry for this tag
        run: |
          TAG="$GITHUB_REF_NAME"
          python - "$TAG" <<'PYEOF'
          import re
          import sys

          tag = sys.argv[1]
          version = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = re.compile(
              rf"^## \[v{re.escape(version)}\] - .*?(?=^## \[v|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match:
              print(f"::error::CHANGELOG 中未找到 v{version} 条目，请先按 03 §9.10 记录变更日志")
              sys.exit(1)
          open("release-body.md", "w", encoding="utf-8").write(match.group(0).strip())
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
