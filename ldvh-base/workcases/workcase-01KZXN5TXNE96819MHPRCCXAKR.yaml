title: 事实候选正向一跳关联导航
created_at: '2026-07-23T21:14:32.785735+08:00'
updated_at: '2026-08-13T15:03:57Z'
status: closed
goal: 在不让 Helper、Code 或环境入口裁决语义相关性、规则适用、授权或完成的前提下，扩展既有 find-fact-object-candidates， 使 AI 能从已知事实稳定种子取得来源定义的一跳正向关系、可继续精确读取的 F2 候选以及可识别的未解析范围。
scope: 仅覆盖 05 中既有 find-fact-object-candidates 的 F2 契约、实现与测试：新增事实源稳定引用和可选关系键的确定性筛选， 交付边级来源、目标身份、候选卡、继续读取入口、分页、coverage、cursor 与 gaps。严格排除新增 operation_key、修改 00/01/04/09/20–24、 规则种子、跨要素边、语义相似或排序、自动多跳、自动 F3、环境自动调用、写回和持久知识图。 实现前必须记录并保护 specs/05-事实模型基础规范.md、fact_candidate_request.py、fact_candidate_operation.py、 test_fact_candidate_operation.py 的既有未提交 Study/invalid 修复差异；方案 C 只能在该基线上非覆盖合并。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 05 对既有 find-fact-object-candidates 明确定义正向一跳关系源输入、关系键过滤、边与来源回指、F2/精确读取边界、稳定排序、分页、 partial、cursor 和 gaps；候选、边或排序不被表达为语义相关、规则适用、行动许可或完成结论。
- criterion_id: criterion-02
  statement: 给定有效事实源，Helper 仅按该对象 relations 返回一跳正向边和对应 F2 候选；终态显式关系目标不会因默认候选状态被静默遗漏， 且不会自动读取 F3 或递归展开。
- criterion_id: criterion-03
  statement: 目标缺失、invalid、unavailable、被类型/状态/关系键过滤、预算或分页未展开的关系边均可回指源、relation_key、目标与原因， 不会从结果中静默消失；cursor 与种子、过滤、worktree 和对象集连续性绑定。
- criterion_id: criterion-04
  statement: 实现和 contract tests 覆盖字段闭集、跨项目/重复/非法源引用、非法关系键、正反向过滤共存、终态、源或目标不可读、过滤可观察性、 分页与 cursor 失效、多边同目标、自指/环一跳呈现，以及无语义评分、无自动递归；相关测试和规范回读通过。
success_criterion_results:
- criterion_id: criterion-01
  outcome: satisfied
  summary: 05 已明确 relation_source_refs/relation_keys、来源和边回指、F2/F3 边界、单一边分页、partial、cursor 与 gaps； 候选和边未被表达为语义或授权结论。
- criterion_id: criterion-02
  outcome: satisfied
  summary: Helper 仅沿输入事实对象的直接 relations 返回 F2 目标；终态直接目标测试通过，未实现自动 F3 或递归。
- criterion_id: criterion-03
  outcome: satisfied
  summary: 目标缺失和 invalid、来源自身 invalid、键/类型/状态过滤与分页均可观察；后续失败边由同一 cursor 继续而不提前泄露。
- criterion_id: criterion-04
  outcome: satisfied
  summary: 针对性测试覆盖输入拒绝、正反向 AND、终态、source/target invalid、多边同目标、自指、边分页与 cursor； 规范检查、实际 CLI 与独立结果复核通过。
result_summary: find-fact-object-candidates 已支持从有效事实源按显式 relations 和可选 relation_key 取得一跳正向边及 F2 目标， 并交付可回指来源、分页、coverage、cursor 与 gaps。来源或目标失效、过滤及未展开范围均可观察； 未新增递归、自动 F3 或语义判断。
validation_summary: 四项成功标准均有当前结果支持：05 已定义一跳关系来源、边级分页和范围披露；Helper 仅沿显式直接关系返回 F2 目标； 失败、过滤和分页范围可观察；相关契约测试、规范结构检查、实际 CLI 调用和独立结果审核均已通过。 全仓全量回归未执行，原因是工作区存在本 WorkCase 范围外的并行未提交改动；本记录不将其表述为已验证。
closure_outcome: completed
disposition_summary: 本 WorkCase 原范围内不存在未满足、未验证或需移交的残余责任：能力已在既有候选发现操作中按限定边界实现并经相关验证和独立审核。 未执行全仓全量回归是范围外验证限制，不构成原成功标准残余或新的承接责任。
