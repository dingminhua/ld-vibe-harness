title: 三字段署名精简为二字段：移除 agent_runtime_name，统一为两字段必填
status: closed
goal: 将事实署名与 Git 提交署名的三字段合同（product_name / model_name / agent_runtime_name）精确收敛为两字段（product_name / model_name）：change_log.signature
  与 Git footer 均不再记录 agent_runtime_name，两字段均必填，任一不可观察时受控写入与受控提交必须停止并报告；历史数据保持只读不回写。
scope: 署名契约的两处消费面：1) 事实对象 change_log.signature（05 事实模型基础规范 11.0、05.Att.01 字段登记、facts/validation.py、signature.py 及其消费方 Helper
  写入口）；2) Git 提交 footer（03 事实源与信息溯源规范 9.4、03.Att.01、commits/validation.py、commits/contract_source.py、git hook 与 precheck-git-commit
  共享的 validator 链）。配套：signature_guard、Web 展示（web/shared/signature.ts、web/api/services/git.ts、CommitSignatureMeta.tsx）。不影响：governance_instance_name、历史既有对象
  change_log 与历史提交 footer（只读保留）。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 机械契约统一完毕：change_log.signature 与 Git footer 的当前契约均只含两字段（product_name、model_name 均必填，无 agent_runtime_name），05 11.0、05.Att.01、03
    9.4、03.Att.01 与 21/30/31/32/33/34 行动模板中所有声明与新写入形状一致；唯一实现不再接受或产出 agent_runtime_name。
- criterion_id: criterion-02
  statement: 两字段必填且失败即停止：change_log 新流水与 Git footer 中 product_name 或 model_name 任一不可观察/缺失/空值时，受控写入与受控提交机械失败并停止，AI 必须报告缺失项与原因。
- criterion_id: criterion-03
  statement: 历史数据只读不回写：既有事实对象 change_log 历史流水与既有 Git 提交 footer 中的 agent_runtime_name / 三字段形状保持原样可读，不被改写、迁移或删除；Web 对历史提交署名仍可兼容呈现。
- criterion_id: criterion-04
  statement: 测试与验证完备：Python 与 Web 测试覆盖两字段必填的正反例（含仅一个字段可观察、null literal、旧三字段形状被拒绝）、Git Hook 真实触发验证、写后回读与 check-fact-integrity
    通过。
