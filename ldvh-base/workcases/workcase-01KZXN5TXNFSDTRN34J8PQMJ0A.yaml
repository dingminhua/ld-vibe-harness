title: 退役 Git prepare-commit-msg 署名自动注入
status: closed
goal: 从正式 Hook bundle 退役 prepare-commit-msg 的 LDVH_SIGNATURE 自动署名注入，保留显式 trailer 与 commit-msg Gate。
scope: 覆盖提交署名规则、环境接入规范和附件、Hook bundle 版本/部署/升级/回滚、显式 trailer 校验、真实 Git 事件测试及本地提交。排除事实 change_log 署名、Web、push、PR、发布和任何产品自动注入适配器。
success_criterion_definitions:
- criterion_id: criterion-1
  statement: 规则和 Skill 一致规定提交署名由执行会话显式提供，LDVH_SIGNATURE 不再是默认接入接口。
- criterion_id: criterion-2
  statement: Hook bundle 仅管理 commit-msg；升级只删除可识别的 LDVH prepare Hook，未知或自定义 Hook 停止并交由 Human 决定。
- criterion_id: criterion-3
  statement: 预检与 commit-msg Gate 共享三字段 trailer 的解析、归一和拒绝规则，缺署名、旧署名或三项全空不能通过。
- criterion_id: criterion-4
  statement: 显式完整提交允许；自动 Git merge message、无正文或无署名提交被拒绝；真实 Git 事件覆盖安装、升级、回滚和 linked worktree common-dir 边界。
- criterion_id: criterion-5
  statement: 目标与相关回归、事实完整性、diff 检查和受控本地提交通过；不执行 push。
success_criterion_results:
- criterion_id: criterion-1
  outcome: satisfied
  summary: 规则、接入附件、Skill 与模板已明确提交署名由执行会话显式提供，LDVH_SIGNATURE 不再是默认接口。
- criterion_id: criterion-2
  outcome: satisfied
  summary: Hook bundle 仅部署 commit-msg；迁移仅删除精确识别的旧 LDVH prepare Hook，未知 Hook 保持停止边界。
- criterion_id: criterion-3
  outcome: satisfied
  summary: 预检与 commit-msg Gate 共享三字段解析归一；正向夹具直接使用新字段，退休字段只在拒绝断言中出现。
- criterion_id: criterion-4
  outcome: satisfied
  summary: 测试覆盖显式提交允许、自动 merge/无正文/无署名拒绝，以及安装、升级、回滚和 linked worktree common-dir 边界。
- criterion_id: criterion-5
  outcome: satisfied
  summary: 相关回归、完整性和 diff 检查通过；本地提交 fb6af9f0、79f7a7d1 与 bd30b529 已创建，未执行 push。
result_summary: 正式 bundle 仅保留 commit-msg Gate；提交署名使用显式 LDVH 三字段。两轮独立复核发现并消除了测试中旧 trailer 被视为合法、以及测试夹具静默转换旧 trailer 的残留。
validation_summary: 提交契约、契约来源与 commit-msg Hook 相关回归 118 passed；git diff --check passed；bd30b529 预检和原生 commit-msg Gate passed。尚待 result_version=3 的独立只读复核。
closure_outcome: completed
disposition_summary: 全部 5 项成功标准均为 satisfied，原 scope 内没有未满足或未验证责任；无 route_existing、suggest_spark 或 accept_stop 需要。Hook bundle 已安全迁移为仅 commit-msg，旧 prepare-commit-msg 署名自动注入已退役，显式三字段 trailer 已落地。
