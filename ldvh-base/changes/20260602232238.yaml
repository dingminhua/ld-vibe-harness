type: change
title: 明确 Human Gate 的 AskUserQuestion 可执行入口
author: ai
status: done
created: 2026-06-02
updated: 2026-06-02
context: |
  L1 项目规则中原有“Human Gate 由 AskUserQuestion 实现，入口见 specs/05-Trae-Solo AskUserQuestion使用规范.md”表述过于笼统，只说明机制来源，未说明 Human Gate 确认机制应如何由 AskUserQuestion 承载，运行时不可直接执行。用户进一步指出该机制应写入 L0，且 L0 已承载时 L1 不应重复维护，并要求引用使用完整文档名。
decision: |
  1. 更新 specs/05-Trae-Solo AskUserQuestion使用规范.md §8.3，将 Rules 注入模板改为可执行入口摘要；
  2. 在模板中明确 Human Gate 由 AskUserQuestion 承载确认机制：需要确认时先暂停拟执行动作并问询，问询按 specs/05-Trae-Solo AskUserQuestion使用规范.md §6 设计并包含暂停/暂缓选项，取消按 specs/05-Trae-Solo AskUserQuestion使用规范.md §7 停止等待；
  3. 将 Human Gate 机制摘要写入 ../.trae/rules/ldvh-l0-rules.md；
  4. 删除 .trae/rules/ldvh-l1-rules.md 中重复的 Human Gate 机制摘要，只保留 L1 项目专属硬约束；
  5. 将相关章节引用从短文件代号改为完整文档名引用。
consequences: |
  - Human Gate 的 AskUserQuestion 确认机制由 L0 工作区规则承载，避免 L0/L1 重复维护；
  - specs/05-Trae-Solo AskUserQuestion使用规范.md §8.3 明确 L0/L1/L2 Rules 的注入边界和去重要求；
  - AskUserQuestion 的详细参数契约仍由 refs/12 承载，05 与 Rules 不重新定义平台工具本身。
affects:
  - specs/05-Trae-Solo AskUserQuestion使用规范.md
  - ../.trae/rules/ldvh-l0-rules.md
  - .trae/rules/ldvh-l1-rules.md
related_rules:
  - specs/05-Trae-Solo AskUserQuestion使用规范.md
  - specs/11.01-Rules机制规范.md
human_gate:
  required: true
  reason: 修改 L0/L1 Rules 中 AskUserQuestion 使用要求，并同步修改 specs/05-Trae-Solo AskUserQuestion使用规范.md §8.3 的 Rules 注入模板，属于 specs/05-Trae-Solo AskUserQuestion使用规范.md §10.1 与 specs/11.01-Rules机制规范.md §10 需要评估 Human Gate 的规则变更。已通过 AskUserQuestion 获得用户确认，并按用户后续指示调整为 L0 承载、L1 去重。
validation: |
  已检查 specs/05-Trae-Solo AskUserQuestion使用规范.md §8.3、§9、§10.1 与 specs/11.01-Rules机制规范.md §7、§8、§10：本次变更保持 Rules 只写入口摘要，不复制完整规范正文；L0 承载通用机制，L1 不重复维护；机制关系声明中 L0/L1 同步触发条件覆盖该变更；已追加本 Change 记录。
