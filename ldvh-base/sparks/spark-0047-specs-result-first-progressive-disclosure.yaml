id: spark-0047
type: spark
title: specs 规则结果优先消费与按需披露缺口
status: pending
created: '2026-07-05T18:01:56+08:00'
updated: '2026-07-05T18:01:56+08:00'
description: |
  本 Spark 记录一个 specs 消费方式缺口：很多 specs 文档定义的是规则、限制、字段闭集、状态闭集、Human Gate、验证要求或行动边界。这些内容不应在每次 AI 使用相关规则时都整段进入上下文。更合理的方式是，Code 或行动指南先把规范定义编译成当前任务需要的“结果”：例如当前 target 的必读结果、可用字段、状态判断、阻断条件、验证要求、source_refs 和下一步分流建议。

  只有当 AI 要修改对应 spec / attachment、需要解释规范限制、发现规则冲突、Code 派生结果不足、source_refs 不可信、Human Gate 或 Stop Conditions 被触发时，才应展开对应规范章节或全文。若只是使用该文档定义的一些规定，AI 理应优先消费派生结果和来源回指，而不是消费规范正文细节本身。

  当前初步判断是：LDVH v3 已部分做到这点，但还没有完整做到。现有 `code/ldvh_specs.py` 可以从 Markdown specs 中解析身份块、保障需求、字段表、状态闭集、事实对象实例、read_plan、stop_conditions、validation_guard、source_refs 和 preflight 诊断；`action-guide` 也能输出当前任务的读取计划和缺口。但当前输出仍以文件路径级 `task_read_plan` / `required_read_plan` 为主，例如 session_start 仍要求 00/01/02 P0 文件读取，preflight 对 spec / attachment 目标也会追加目标文件本身。系统尚未显式区分“规则结果消费”“短契约消费”“章节读取”和“全文读取”，也没有稳定字段表达何时只给结果、何时展开限制、何时必须回读源文档。

  后续若推进，应优先审计现有行动指南、preflight、runtime 和 specs validator 的消费粒度，明确哪些场景只需要结果，哪些场景需要 source_refs，哪些场景必须读章节或全文。可能的承接方向包括：为 read_plan 增加 `read_mode` 或等价字段；把常用 specs 规则编译为可审计短契约和结果对象；为 spec 修改场景单独触发边界章节读取；为 source_refs 不足、规则冲突或高影响变更保留全文回读和 Human Gate。
source: conversation
source_detail: |
  Human 提醒：很多 specs 文档定义的内容，应该只在 AI 需要的时候给到 AI。比如要修改某个文档时，AI 才需要知道该文档的限制；如果只是使用这个文档定义的一些规定，那么只要知道结果即可。Human 追问当前是否已经做到这一点。
