title: Phase 1 CLI 请求文件化、请求骨架与结果投影
status: closed
goal: 在不改变 Helper 公开操作领域语义、事实发布主干或 Git Gate 职责的前提下，为当前源码 launcher 交付 --request、--example、--fields 三项显式 CLI 机械辅助，并闭合事实写入署名请求骨架与 Git trailer 示例；以已冻结 baseline-v1 的重跑一致性作为代码改动前锚点，只交付功能与机械验证，不作因果效果结论。
scope: 仅修改 specs/04-Helper CLI 服务规范.md、specs/attachments/04.Att.01-Helper CLI 请求与响应字段表.md，及真实 footer 示例确有必要时的 specs/03-Git协作规范.md；修改源码 launcher ldvh、code/ldvh/cli.py、可选新增的 code/ldvh/cli_projection.py、形成 source-bound example 所需的最小 operation metadata，以及直接受影响的 tests。--request 只读取一个调用方显式指定的普通 UTF-8 JSON 文件并与非空 stdin 冲突；--example 只投影当前 capabilities 的 operation metadata、required_inputs 与 input_examples，真实 observed signature 每次仍由 AI 直接观察，不缓存、不推导；--fields 只在完整 Helper response 形成后做确定性 object dotted-path 投影，缺失、非法和重复路径不静默。不新增 Helper operation_key，不改变 CommonRequest、领域 result、事实 Schema/状态机、完整对象 CAS、原子替换、回读审计、Hook 或 Git Gate 责任。排除 Phase 2 WorkCase 事件输入、通用 patch、MCP/环境 adapter、因果验证、其它事实更新、依赖安装、外部网络、Git commit/push/PR/release，以及启动前已存在的两个 Spark 差异。
success_criterion_definitions:
- criterion_id: criterion-cli-contract
  statement: 04 与 04.Att.01 精确定义 --request、--example、--fields 的命令语法、互斥矩阵、默认完整机器响应、显式 projection 输出、错误与退出码，并保持全部不带新 flag 的当前入口行为和领域语义兼容；必要的 03 footer 示例只投影既有提交合同。
- criterion_id: criterion-request-file
  statement: --request 对调用方显式普通文件的 UTF-8 原文与相同 stdin 原文进入同一 handle_request；文件缺失、目录、非普通文件、超限、不可读、非 UTF-8、缺值、未知选项及与非空 stdin 冲突均形成稳定结构化 invalid_request、原 Helper exit code 边界和零领域副作用，不猜 workspace、环境变量、glob 或 URL。
- criterion_id: criterion-example-signature
  statement: capabilities 单操作 --example 只从当前 source-bound operation metadata 形成可填写而非可直接盲用的请求骨架；覆盖 required input path 与既有 arguments_fragment，事实写骨架使用当前三字段闭集的 null 占位并明确全空不可执行、不得缓存/推导，precheck-git-commit 骨架提供能够由现行合同验证的 trailer 排列；--example 不调用目标操作或产生写副作用。
- criterion_id: criterion-fields-projection
  statement: --fields 仅在完整 Helper response 形成后按闭合 object dotted-path 语法保留嵌套形状并返回原 ServiceResult exit code；成功投影不输出未选大字段，空、非法、重复、缺失路径或穿越 array 均形成结构化诊断，不抛 KeyError、不把 absent 伪装为 null，也不把 projection 表述为完整 common response。
- criterion_id: criterion-validation-boundary
  statement: 代码改动前 baseline-sessions-v1.json 与 baseline-calls-v1.json 的冻结脚本重跑结果逐对象完全一致且 SHA-256 分别为 bc098c8fef056b40c2664538be69914ddcea00debfe9ea4ad109d0654933ea72 与 157bb38c2b8f07a1ac3e597e0d92f16427daf6e8109345a842f6446349e9fd54；三 flag 的直接 CLI 正反、launcher、signature、service 与相关回归测试按实际结果记录，测试通过不冒充因果改善、全模型外推或 MCP 必要性。
success_criterion_results:
- criterion_id: criterion-cli-contract
  outcome: satisfied
  summary: 04/04.Att.01 定义三 flag、non-symlink/live-pipe 输入、单次 general-discovery metadata-only example、完整 metadata/path fail-closed、fields core invariant/回退与旧入口兼容；不新增领域 operation/CommonRequest。
- criterion_id: criterion-request-file
  outcome: satisfied
  summary: --request 通过 symlink 预拒绝和可用时 O_NOFOLLOW、fstat、有界 strict UTF-8 读取；tty 无第二源，非 tty 仅 closed-empty EOF 允许，非空或 live writer pipe 均零等待 invalid_request，领域调用前失败。
- criterion_id: criterion-example-signature
  outcome: satisfied
  summary: --example 成功/失败均只调用一次通用 capabilities discovery，再精确筛选 key；不做 request-check/availability/目标写调用。不可投影由 CLI invalid_request；metadata/path 完整校验，写骨架 FIELD_NAMES 三 null，precheck trailer 连续且来源绑定。
- criterion_id: criterion-fields-projection
  outcome: satisfied
  summary: --fields 只在完整 ServiceResult 后投影；校验 common core/gaps，不完整回退来源响应；成功保留原 exit/status core/gap count，missing/null/array 分离，不因 selector 缺失诱导重试。
- criterion_id: criterion-validation-boundary
  outcome: satisfied
  summary: version 3 full 1990 passed/15 skipped，focused 279 passed，Ruff/diff/ldvh/fact checks 通过；baseline 两 JSON 与冻结对象相等。两轮 review feedback 全部实现，不宣称因果改善、native Windows 实测或 MCP 结论。
result_summary: Phase 1 CLI 三项机械扩展已交付并完成两轮独立 review 返工：--request 提供 non-symlink、有界 UTF-8 文件输入和双源 fail-closed；--example 用单次通用 discovery 形成完整校验的 source-bound 骨架、null 署名与 Git trailer 示例，绝不进入 request-check；--fields 在完整响应后安全窄投影并保留原结果/exit。Helper 领域语义、事实发布和 Git Gate 未改变。
validation_summary: result_version=3：full code/tests 1990 passed、15 skipped；focused suite 279 passed；Ruff、git diff --check、ldvh check、check-fact-integrity 通过；baseline sessions/calls 相等且 SHA 保持 bc098c8f…3ea72 / 157bb38c…9fd54。native Windows 为 skipped；外部严格消费者、真实 AI 使用质量与 Phase 1 因果效果未验证。
closure_outcome: completed
disposition_summary: WC-A 的 Phase 1 CLI 机械实现、规则合同、署名/footer 骨架和风险匹配验证已完成，并经两次 changes_required 修复循环后由 fresh result_version=3 独立 review pass。没有 WC-A 内部残余决策或 Spark 建议；WC-B WorkCase 写入减负与 WC-C 因果比较按 Human 已定分立路线继续，不由本关闭结果提前宣称。未创建 Git commit。
