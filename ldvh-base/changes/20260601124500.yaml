type: change
title: 建立 pytest 测试基础设施并登记 tests 目录
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  specs/12.01-Tools辅助规范.md 已明确 Python Tools 默认使用 pytest，测试文件统一放在项目根目录 tests/tools/ 下。
  当前项目已有 tools/adr_index.py，但此前没有 pytest 配置、tests 目录或 Tools 自动化测试用例。
  为保证后续 Tools 新增或修改具备可重复验证环节，需要建立测试基础设施，并在目录说明中登记 tests/ 一级目录。
decision: |
  1. 新增 pyproject.toml，声明项目 Python 版本、PyYAML 运行依赖、pytest 测试依赖和 pytest 发现规则。
  2. 新增 tests/tools/test_adr_index.py，覆盖 adr_index.py 的日期格式化、ADR 读取、ADR 批量加载、关键词搜索、关联查询和校验输出。
  3. 更新 specs/01-LDVH目录说明.md，将 tests/ 登记为自动化测试目录，明确其事实源性质为非最终事实源。
consequences: |
  - 后续可通过 pytest 运行 Tools 自动化测试。
  - Tools 测试落点与 specs/12.01-Tools辅助规范.md §九保持一致。
  - tests/ 下测试代码、测试夹具和测试结果不得替代 Git 文件事实源。
affects:
  - pyproject.toml
  - tests/tools/test_adr_index.py
  - specs/01-LDVH目录说明.md
related_rules:
  - specs/01-LDVH目录说明.md
  - specs/10-事实源边界与承载规范.md
  - specs/12.01-Tools辅助规范.md
