title: ADR、Pitfall 与 Study 的作用强化及触发事件
status: open
priority: P1
intent: 保留 ADR、Pitfall 与 Study 如何在真实工作流中产生可观察效用、应由哪些事件触发提请、召回、复核或创建的未决问题，避免这些对象仅被被动存档或凭标题、记忆和临时判断使用。后续需判断各类型的最小有效触发事件、触发后的行动边界、去重与反误触发机制，以及如何验证其确实改善决策质量和重复故障规避；若不跨行动保留，后续需要重新区分已有类型规则、已有对象和拟议运行机制的边界。
summary: "## 探索目标\n\n判断如何增强 ADR、Pitfall 与 Study 在 LDVH 工作流中的实际作用：它们不只保存既有内容，还应在合适的工作事件出现时，帮助执行者获得需要的决策边界、复用已验证的规避经验或快速获取已知的研究结论。\n\n## 待探索的问题\n\n- **ADR：**哪些事件应当触发对既有 ADR 的主动提请或复核，例如出现跨行动持续影响的选择、既有决定的适用边界被触及、关键假设失效，或需要形成新的方向取舍？需要明确提请、阅读、冲突处理、新建、替代和不触发的边界，避免把一般实现细节或未成熟探索误作长期决定。\n- **Pitfall：**哪些事件应当触发对既有 Pitfall 的召回、适用性复核或新经验形成，例如相似症状、已知触发条件、风险方案、调查或验证故障？需要区分\"候选命中\"\"经验实际适用\"\"允许执行规避动作\"和\"已形成新 Pitfall\"，避免仅因关键词相同就自动采用经验。\n- **Study：**哪些事件应当触发对既有 Study 的主动召回或复核，例如进入新领域或新方案时先检索已有研究报告，或当已有研究发现被新证据挑战时触发复审？需要区分\"候选命中\"\"适用性核对\"\"结论采纳\"和\"发现过时需要更新\"，避免在已有明确结论的方向上重复研究。\n- **共同机制：**触发信息应如何保持可定位、可解释、可复核，并与事实对象的既有生命周期、Human Gate、行动模板和渐进式读取协作；应评估是否需要规则、Helper 候选/关系能力、界面提示、流程检查或其它承载，但不预设实现方案。\n\n## 当前明确诉求：三段知识预检\n\n在管辖项目中，优先评估并定义三段与高影响行动绑定的知识预检：\n\n1. **决策预检（ADR Review）：**准备形成、重议或改变具有跨行动持续影响的选择前，完整审阅 active ADR 的 F1 决策卡；对可能适用的 ADR 继续读取 F3 全文，并明确适用、不适用、未完成分页或不可读范围。随后才进入相应的决策、计划批准或 ADR 形成行动。\n2. **实施预检（Pitfall Scan）：**开始实现、排错、修复或验证前，依据行动目标、方法、技术栈、环境、版本和已知风险请求 active Pitfall 的 F2 候选；对可能适用的对象读取 F3，并交还采用、规避或不适用的判断及 coverage、命中依据和未检查范围。\n3. **研究预检（Study Review）：**开始新方案调研、技术选型或方向分析前，检索 active Study 的 F2 候选，判断是否已有相关研究报告覆盖了当前问题；对可能适用的对象读取 F3，明确其结论是否仍适用、是否需要更新或补充，避免在已有明确结论的方向上重复投入研究资源。\n\n该诉求要求区分流程义务、可审计的读取证据与目标环境中的硬阻断：当前事实召回和行动模板可以支撑前两者，但不能把\"已读即已理解\"或\"未命中即绝无相关经验\"机械化，也不预设所有 shell、编辑或外部工具调用已经存在统一阻断入口。\n\n## 已知边界与相邻议题\n\n- 当前 ADR 的定位是已作出且具有跨行动持续影响的选择；Pitfall 的定位是已发生、查明、解决并验证且可迁移复用的失败机制与规避经验。因此本议题不把未决选择或未经验证的现场观察直接升级为 ADR 或 Pitfall。\n- spark-0033 已关注多类事实对象的字段职责一致性；本 Spark 关注的是 ADR、Pitfall 与 Study 的运行时作用、触发事件和效用验证，后续如发现字段职责是根因，再明确分流或关联。\n- study-0026 的评估结论确认了 Study 与 ADR/Pitfall 共享同一根因（关系稀疏），因此本 Spark 扩展覆盖 Study，与 spark-0067 缺陷4（关系稀疏）形成互补：spark-0040 负责\"消费机制设计\"，spark-0067 负责\"数据侧补齐\"。\n\n## 成功判据（待细化）\n\n形成可评审的触发事件模型和最小行动链：每类触发都有输入、适用性核对、允许与禁止动作、去重/冲突处理、Human 判断边界与验证方式；同时能说明哪些事件不应触发，及如何证明机制提升了决策复用、故障规避或研究结论复用，而非只增加记录负担。"
