id: workplan-0074
type: workplan
title: Git 提交规范收口
status: active
created: '2026-06-19T02:48:00+08:00'
updated: '2026-06-21T03:44:19+08:00'
workarea: workarea-0012
priority: P1
description: |
  当前 LDVH 已确认旧变更对象不应继续作为工作对象存在，而应回到 Git commit records 作为事实源修改追溯证据。
  本计划已将旧 25 号工作模型文件删除，并新增 `specs/10-Git提交规范.md`，同步清理
  specs、Code、Web、测试和文档中的旧工作对象入口；为消除迁移痕迹，Study 工作模型应从 26 补位到 25。

  本计划负责承接后续行动准备：明确迁出目标、提交记录格式、简体中文提交语言要求、Web 派生视图调整、
  Code 校验和字段命名同步，确保迁出后工作模型集合保持自洽，Git 历史仍可被 AI 和 Human 高效使用。
success_criteria: |
  - [x] specs 中旧变更对象不再作为工作对象出现在 20-39 工作模型集合中
  - [x] Human Gate 和编号决策已收口：新规范落在 10，旧 25 号工作模型文件删除，不做短期兼容对象
  - [x] Study 工作模型由 26 补位为 25，现行 specs、Code、Web、测试和事实源引用不再出现 `specs/26-Study` 或 26 号 Study 入口
  - [x] 新的 Git 提交规范明确采用 Conventional Commits、提交内容使用简体中文、固定 footer 字段禁用，以及哪些规则可机器校验、哪些由 Human 审查兜底
  - [x] 旧 `related_changes` 字段最终策略明确为删除对象手写字段，关联提交完全由 Git 历史、对象 ID 和路径派生
  - [x] Code 校验、CLI、测试和索引不再把旧变更对象当作工作对象处理
  - [x] Web 中 `/changelog`、Dashboard 最近提交、ProjectFiles 提交历史和右侧阅读面板统一表达为 Git 提交记录派生视图
  - [x] Web API 共享同一 commit DTO 或解析函数，并结构化返回 type、scope、description、body、breaking、文件摘要或 diff 入口
  - [x] LDVH 自身仓库提供或启用提交前 message 校验入口；未启用 Git hook 前，AI 提交前必须运行等价预检
  - [x] `ldvh-git-commit` Skill 已按 04.02 固定能力资产登记制落地，承接 AI 提交准备、拆分、消息编写、预检和交还流程
  - [ ] 迁出完成后，现行 specs、Code、Web 和测试中不存在会误导 AI 的旧工作对象入口；历史资料中的旧称必须被明确判定为允许历史引用或待迁移残留
  - [ ] `python3 code/specs_validate.py all --fail-on-diagnostics`、`python3 code/fact_validate.py ldvh-base`、相关 Code 测试和 Web 检查通过
source: |
  用户在 2026-06-18 至 2026-06-19 围绕旧变更对象提出：变更更像提交记录规范，不应作为工作对象继续存在。
  经讨论和多视角评估，建议将其从工作模型集合迁出，改为 Git commit records 的追溯规范。
  用户进一步要求提交语言必须为简体中文，并要求在行动前了解 Web 当前实现和影响面。

  当前 Web 已存在 `/changelog` 和 ProjectFiles 两套 Git 相关入口：前者只读取提交标题，后者已能读取完整提交详情和文件 diff。
  后续迁出必须同时处理 specs、Code、Web 和测试，避免只改文案而留下事实源边界漂移。
orchestration:
  mode: sequential
  execution_items:
