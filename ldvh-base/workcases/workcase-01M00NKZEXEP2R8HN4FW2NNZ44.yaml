execution_authorization:
  action_ceiling: 仅限 scope 列出的四个交付文件、本 WorkCase 自身事实写入与只读复核委派；项内重试不超过 3 次，超限停止并按真实状态报告
  allowed_adjustments: scope 内文件内容、附件编号细节与测试断言数值调整；不改变 goal/scope/criteria、动作上限、风险接受或禁止项
  authorized_actions:
  - action_id: authorization-spec-write
    summary: 新建 09.Att.05 附件，并在 specs/09-环境接入规范.md 做 frontmatter 与 §8 两处授权登记
    target_scope: specs/attachments/09.Att.05-DeepSeek-Harness平台机制事实.md（新建）、specs/09-环境接入规范.md（frontmatter authorized_attachments 一处、§8 一处）
    effect_scope: 仅限上述两文件的上述位置；不改动其它规范、附件或既有平台卡内容
    risk_summary: 附件契约或授权登记不合规会被 ./ldvh check 与结构测试机械发现；不回改既有附件，无连锁语义风险
    rollback_summary: 新建附件为未跟踪文件可直接删除；specs/09 两处修改可经 git diff 精确回退
    rule_refs:
    - environment-integration::8. 环境机制核验与能力判定
  - action_id: authorization-contract-write
    summary: 新建 DeepSeek Harness WorkCaseRunController 非权威消费合同
    target_scope: code/plans/deepseek-harness-workcase-run-controller.md（新建）
    effect_scope: 仅此一个新建文件；不修改 Cindy 合同或 code/plans 下其它文件
    risk_summary: 合同被误读为权威来源——文件首部明示非权威并逐项回指权威来源，且明确未验证范围
    rollback_summary: 新建文件可删除，无既有内容改动
    rule_refs:
    - workcase-fact-type::4.5 审核方法与保证边界
  - action_id: authorization-test-sync
    summary: 同步 code/tests/specs/test_repository.py 的规范仓库文档数量断言
    target_scope: code/tests/specs/test_repository.py（仅文档数量/附件计数断言）
    effect_scope: 仅限断言数值；不改动测试逻辑或其它测试文件
    risk_summary: 断言数值错误会被测试运行直接发现
    rollback_summary: git diff 可精确回退
    rule_refs:
    - environment-integration::8. 环境机制核验与能力判定
  - action_id: authorization-fact-write
    summary: 本 WorkCase 自身事实对象的活动期写入（item 推进、结果与关闭阶段更新）；不含创建本身——创建由受控创建行动在 Gate 1 前完成，不归本授权包管辖
    target_scope: 仅本 WorkCase 自身的事实对象文件（ldvh-base/workcases/ 下本对象）
    effect_scope: 仅写入本对象；不创建或修改其它 Spark/Study/ADR/Pitfall/WorkCase
    risk_summary: 事实写入按 CAS 原子操作，写后精确回读 + check-fact-integrity 验证；不涉及其它对象则无跨对象污染风险
    rollback_summary: 更新操作使用 CAS 原子替换，写入失败保留 before；整库完整性检查可发现残留
    rule_refs:
    - workcase-fact-type::7. AI 写回与受控操作
    - fact-model-foundation::11.7 事实对象单对象 CAS 更新输入与结果
  - action_id: authorization-delegate-review
    summary: 委派执行期独立结果复核给 DeepSeek Harness 只读复核执行体（第 1 档 workflow agent() 协作 Worker，经 deepseek-official/deepseek-v4-flash 路由；不可用时按冻结降级顺序降第 2 档一次性 subagent）
    target_scope: 本 WorkCase 执行期 independent_reviewing 阶段的结果复核委派
    effect_scope: 委派只读复核执行体，不授权其写入任何文件或事实对象
    risk_summary: 复核为只读第二视角；DeepSeek Harness 模型侧无 per-call 机械强制只读工具裁剪，只读边界由分派指令与委派策略（沙箱继承、approval 钉死 never）承载，该保证差距如实登记在复核记录中
    rollback_summary: 复核结论不修改被审内容；Controller 处置 feedback 后再更新投影
    rule_refs:
    - workcase-fact-type::4.5 审核方法与保证边界
    - workcase-fact-type::6.6 canonical result projection 与结果版本
  - action_id: authorization-perform-review
    summary: 执行实际结果复核（只读 subagent/workflow 或 Gate1 冻结的 fallback 方法）
    target_scope: 本 WorkCase 的 canonical result projection 的实际只读复核
    effect_scope: 只读审查，不修改任何文件、不创建或更新事实对象、不改变任何状态
    risk_summary: 复核为只读，无写入风险；实际方法据实记录在 result_reviews 字段中
    rollback_summary: 复核结论不修改被审内容；Controller 可处置 feedback
    rule_refs:
    - workcase-fact-type::4.5.1 核心语义
    - workcase-fact-type::4.5.2 可接受的执行方式（闭集）
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-delegate-review
    result_review_action_id: authorization-perform-review
  reviewer_policy:
    model: deepseek-v4-flash
    collaboration_agent: workflow-agent
    effort: default（deepseek-official 适配器默认 high；DeepSeek Harness 模型侧复核分派不支持 per-call effort 设置）
    fast: false
    preferred_method: collaboration-worker-read-only
    fallback_order:
    - collaboration-worker-read-only
    - subagent-read-only
    max_perspectives: 1
    activation: Human 于本会话明确允许本 WC 在独立复核时按需启用只读协作 Worker 或 subagent（一次授权覆盖第 1、2 档），并以自由文本指定复核模型 "deepseek flash"；已映射为 DeepSeek Harness 的 deepseek-official/deepseek-v4-flash（适配器默认目录成员，无需新增配置），并经创建前一次只读 workflow 分派探针实际验证路由可用（2026-08-15 本会话 workflow 运行 reviewer-route-probe 返回 PROBE_OK）
    same_ai_limit: 本 WC 不预授权 same-ai-switched-role-read-only fallback（subagent 能力当前可用，无法如实登记 availability=unavailable 的 capability limitation）；执行期若协作 Worker 与 subagent 两档均不可用，按 21/34 停止并如实交还，不在执行期请求扩权。第 2 档降级时 DeepSeek Harness 一次性 subagent 无法 per-call 携带冻结模型（继承主控模型），据实记录 actual_model 与保证差距
  human_prerequisites:
  - 无待办 Human 前置：只读复核启用授权与复核模型选择已在创建前由 Human 当前会话明确作出；deepseek-official/deepseek-v4-flash 路由已经只读探针实际验证
  prohibited_actions:
  - Git commit、push、PR、release、deploy
  - 修改 DeepSeek Harness 源码、~/.dsh、settings.yaml 或任何宿主配置
  - 部署、同步或验证 skill、Git Hook、Stop gate 等真实接入动作
  - 创建或修改其它事实对象（Spark/Study/ADR/Pitfall/WorkCase）
  - 修改任何既有 dirty 文件
  - 真实生产事件、真实端到端验证或外部账号/服务写入
  - 逆向私有 API、外部轮询 daemon、新 adapter 或第二状态机
  out_of_bounds_handling: 发现未授权写入、新风险或基线改变时，不执行该动作、取消受影响 item，全部 item terminal 后进入结果链；不请求执行期新授权
  verification_and_rollback: code/tests/specs 相关聚焦测试 + ./ldvh check 规范机械检查 + 两交付文件写后回读 SHA-256 + pre-existing dirty paths 逐文件基线比较；新建文件可删除、修改文件可 git 回退；未验证范围如实报告不虚构
