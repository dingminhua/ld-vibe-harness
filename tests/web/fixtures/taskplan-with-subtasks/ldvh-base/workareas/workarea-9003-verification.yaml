id: workarea-9003
type: workarea
title: 验证与关闭工作域
status: active
created: '2026-06-12T11:05:00'
updated: '2026-06-13T09:30:00'
description: |
  这是一个用于检查 WorkArea 详情页完整字段展示的测试工作域。
  它覆盖验证中、已验证、待关闭、已关闭材料齐备和缺失等状态，
  方便在 Web 详情页中观察长期范围描述、范围边界、约束、来源和关联材料如何分层呈现。
scope: |
  - 包含：验证收口计划、待关闭计划、关闭材料记录和关联材料预览。
  - 包含：工作域详情页的描述、范围、约束、来源、状态历史和归档原因字段。
  - 不包含：具体 Task / SubTask 的执行步骤和关闭证据，它们应留在 TaskPlan 或 Task 详情页。
constraints: |
  - 只作为 Web 测试夹具使用，不代表真实项目范围。
  - 工作域不能承载一次性完成判断，不能因为某个计划关闭而改成 closed。
  - 关联对象和文档必须可在右侧扩展阅读区预览或以降级方式展示。
source: |
  用户要求补齐 WorkArea 测试数据的所有字段，以便检查工作域详情页的信息层级和字段渲染问题。
