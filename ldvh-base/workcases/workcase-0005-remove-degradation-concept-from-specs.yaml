id: workcase-0005
type: workcase
title: specs 降级概念取消与替代语义迁移
goal: |
  以 spark-0025 的逐项结论为来源，取消 LDVH active specs 中“降级”作为正式机制概念、状态、路径、说明、关闭结果和 Human-facing 展示态的用法，并建立“问题原因 + 当前影响 + 是否阻断 + 后续承接位置”的替代语义体系。
status: closed
created: '2026-06-25T01:31:00+08:00'
updated: '2026-06-25T03:14:07+08:00'
priority: P0
plan_confirmed_at: '2026-06-25T02:05:54+08:00'
review_requested_at: '2026-06-25T02:25:45+08:00'
description: |
  Human 已确认：LDVH 中很多所谓“降级”场景不存在真实可接受的替代路径；继续要求提供降级说明或措施，会遮掩工具、能力、证据、事实冲突、环境入口、验证和关闭判断中的真实问题，使 LDVH 难以进步。

  spark-0025 已完成 D01-D15 逐项收敛：Rules、Code、知识地图、能力缺口、环境适配、等价验证、失败阻断、行动分流、长期暂不实现、WorkCase `degraded_accepted`、Web/Human-facing `degraded` 和降级说明回写等场景，均不应继续把“降级”作为主概念。相关语义应拆为工具不可用、工具输出不足、输入不足、能力缺口、证据不足、事实冲突、环境入口缺口、未验证、失败阻断、取消、延期实现、风险接受、残留风险和受控回写。

  本 WorkCase 是总控迁移项。第一阶段聚焦 `specs/`、`specs/attachments/` 和两个 Rules 入口中的派生表达；Code、Web 和 tests 的字段、状态和展示迁移先作为后续执行项登记，不在同一轮中进行未审核的硬改。

  方案审核后补充约束：执行必须由包含“降级”、`degraded`、`degraded_accepted`、旧复合表达（原称“人工降级”）、“长期降级”“适配降级”“降级说明”“降级路径”“降级态”“降级提示”“降级兜底”的全量命中清单驱动，覆盖 `specs/`、`specs/attachments/` 和 `rules/`，并将每个命中项分类为正式机制、legacy compatibility、反例、历史迁移说明或无需修改。保留 `degraded` 或“降级”时必须说明保留理由和兼容边界。
success_criteria: |
  - [ ] active specs 不再把“降级”作为独立正式概念、状态、路径、关闭结果、验证方式、长期接受方案或 Human-facing 主展示态。
  - [ ] 建立全局替代语义表，明确工具不可用、工具输出不足、输入不足、能力缺口、证据不足、事实冲突、环境入口缺口、未验证、失败阻断、取消、延期实现、风险接受、残留风险和受控回写的处理口径。
  - [ ] Code Schema 相关 specs 将 `degraded` 从 active 契约收敛为 legacy compatibility / 待迁移对象，并设计 `result_status + issue_causes + suggested_action` 或等价替代字段。
  - [ ] Web/Human-facing 相关 specs 不再要求展示泛化“降级态”，改为展示具体原因态势、不可证明范围、验证状态、阻断原因、Human Gate 和后续承接位置。
  - [ ] WorkCase 相关 specs 不再推荐 `degraded_accepted`；目标未达成时走 `cancelled` 或 `partial_completed`，长期暂不实现走 Human Gate + ADR。
  - [ ] Rules 入口中的“降级兜底/降级提示”和旧复合表达检测样本，迁移为工具不可用报告、权威事实源回读、问题原因说明、修复建议和后续分流。
  - [ ] Code/Web/tests 中仍需兼容的 `degraded` 字段、状态和测试，已明确作为后续迁移对象、兼容边界和验证入口。
  - [ ] 执行前和结果复核时均完成 `specs/`、`specs/attachments/` 和 `rules/` 的全量命中扫描，并解释所有保留的 `degraded` 或“降级”是否属于 legacy compatibility、反例或历史迁移说明。
  - [ ] 完成 WorkCase 事实源校验、相关 specs 诊断、Rules 入口同步审查和必要格式检查；无法完成的实现迁移必须记录残留风险和后续 WorkCase/Spark/ADR。
source: |
  用户在 2026-06-25 基于 spark-0025 的 D01-D15 讨论结论，确认“现在就是要在 specs 全面取消降级这个概念”，并同意以下决策：

  1. 第一阶段先清理 `specs/` 和 `specs/attachments/`，同步两个 Rules 入口的派生表达；Code/Web/tests 先作为后续迁移对象登记。
  2. specs 中取消 `degraded` 作为 active 契约，只保留 legacy compatibility / 待迁移说明。
  3. active 机制中不允许泛化“降级”残留；只允许历史兼容、迁移说明、旧字段引用或反例说明中出现，并必须标明不作为正式概念。
  4. `degraded_accepted` 立即降为历史兼容/待迁移枚举，不再作为推荐关闭结果。
  5. “应该做，但现在不做，并允许系统长期带缺口运行”统一进入 Human Gate + ADR。
  6. 建立总控 WorkCase 承接“specs 降级概念取消与替代语义迁移”。

  来源 Spark：`ldvh-base/sparks/spark-0025-degradation-concept-convergence.yaml`。
orchestration:
  mode: sequential
  execution_items:
    - id: item-0
      title: 建立全量命中清单与分类口径
      role: inventory
      mode: single
      input_refs:
        - specs/
        - specs/attachments/
        - rules/
        - ldvh-base/sparks/spark-0025-degradation-concept-convergence.yaml
      expected_output: |
        使用覆盖“降级”、`degraded`、`degraded_accepted`、旧复合表达（原称“人工降级”）、“长期降级”“适配降级”“降级说明”“降级路径”“降级态”“降级提示”“降级兜底”的扫描命令检查 `specs/`、`specs/attachments/` 和 `rules/`，形成迁移清单，并将命中项分类为正式机制、legacy compatibility、反例、历史迁移说明或无需修改；后续执行项必须以该清单为准，不得只依赖手写 input_refs。
      status: done
      result_summary: |
        已用全量命中扫描驱动迁移，扫描模式覆盖旧复合表达（原称“人工降级”）和相关“降级”词组。中文旧概念命中已在 specs/rules 清零；剩余 `degraded` 均分类为 legacy 字段、旧接口兼容、历史兼容枚举或后续实现迁移对象。
      evidence_refs:
        - specs/
        - rules/
      blocking_reason: null
    - id: item-1
      title: 建立全局替代语义和禁用原则
      role: specs
      mode: single
      input_refs:
        - ldvh-base/sparks/spark-0025-degradation-concept-convergence.yaml
        - specs/01-规范体系基础规范.md
        - specs/attachments/01.Att.08-规范表达清单.md
        - specs/attachments/01.Att.02-术语表.md
      expected_output: |
        在全局规范表达层建立“降级不再作为正式机制概念”的原则，并给出替代语义表：工具不可用、工具输出不足、输入不足、能力缺口、证据不足、事实冲突、环境入口缺口、未验证、失败阻断、取消、延期实现、风险接受、残留风险和受控回写。每个替代项必须说明问题原因、当前影响、是否阻断、禁止写成什么、后续承接事实源和是否需要 Human Gate；其中“风险接受”必须绑定 Human Gate、ADR、触发/退出条件和残留风险。
      status: done
      result_summary: |
        已在 01 建立“问题原因 + 当前影响 + 是否阻断 + 后续承接位置”替代语义，并把工具不可用、输出不足、输入不足、能力缺口、证据不足、事实冲突、环境入口缺口、未验证或失败阻断、取消/部分完成、延期实现或风险接受纳入统一表。01 附件的表达清单、术语和保障要求类型同步改为缺口、临时核对动作、Human Gate、ADR 和后续分流口径。
      evidence_refs:
        - specs/01-规范体系基础规范.md
        - specs/attachments/01.Att.02-术语表.md
        - specs/attachments/01.Att.03-规范保障要求类型表.md
        - specs/attachments/01.Att.08-规范表达清单.md
      blocking_reason: null
    - id: item-2
      title: 迁移行动、Code、Web、运行时、回写和测试主干规范
      role: specs
      mode: sequential
      input_refs:
        - specs/03-行动编排规范.md
        - specs/04-Code确定性执行规范.md
        - specs/05-Web信息同步规范.md
        - specs/06-运行时扩展规范.md
        - specs/07-事实源边界与Git追溯规范.md
        - specs/08-测试基础规范.md
      expected_output: |
        将主干规范中的“降级路径/降级说明/长期降级/失败降级”、旧复合表达和 `degraded` 状态等表达替换为具体问题原因、阻断规则、缺口分流、受控回写、验证声明、Human Gate 和后续承接位置。
      status: done
      result_summary: |
        已迁移 03/04/05/06/07/08 主干规范：行动编排、Code、Web、运行时、事实源回写和测试不再使用泛化旧概念；工具不可用改为直接报告问题原因，输出不足改为补诊断/来源/范围，失败和未验证阻断完成或关闭。04/05/08 中 `degraded` 仅保留为 legacy compatibility 字段。
      evidence_refs:
        - specs/03-行动编排规范.md
        - specs/04-Code确定性执行规范.md
        - specs/05-Web信息同步规范.md
        - specs/06-运行时扩展规范.md
        - specs/07-事实源边界与Git追溯规范.md
        - specs/08-测试基础规范.md
      blocking_reason: null
    - id: item-3
      title: 迁移事实模型成员、Rules 同步和环境适配规范
      role: specs
      mode: sequential
      input_refs:
