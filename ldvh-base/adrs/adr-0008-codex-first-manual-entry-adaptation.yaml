id: adr-0008
type: adr
title: Codex 优先适配与用户手动薄入口
status: active
created: '2026-06-17T03:00:00'
updated: '2026-06-17T03:20:00'
date: '2026-06-17'
context: |
  Human 在当前会话提出两个环境适配方向，需要作为长期决策记录，避免后续继续按旧路线推进。

  Human Gate 记录：
  - 触发原因：本决策候选会改变 LDVH 的环境适配目标、入口部署方式和后续 04 系列规范口径。
  - 确认事项：是否创建 proposed ADR 记录该方向，暂不创建 Task。
  - 影响范围：04 系列环境适配规范、Rules 入口、管辖项目接入说明、后续用户安装或接入指引。
  - 确认依据：用户明确说明 Task 机制当前尚未完善，ADR 可以建立；当前讨论尚未完成，不应直接升级为 accepted 规则。
  - Human 决策：确认先建立 ADR，不创建 Task。
  - 确认人/时间：Human，2026-06-17
  - 后续动作：围绕本 ADR 继续沟通落地方式；确认后再决定是否接受并修改 specs。
  - 回写位置：本 ADR、后续 Change / commit。
  - 残留风险：在 accepted 前，本 ADR 只作为候选决策，不作为正式执行规则。

  Human Gate 记录：
  - 触发原因：用户要求“接下来你行动吧”，授权将本 ADR 的方向推进到 04 系列规范和 Rules 入口。
  - 确认事项：是否接受 Codex 优先适配与用户手动薄入口作为正式方向，并据此修改 04、04.02、04.03 和 `rules/LDVH-AI-ENTRY.md`。
  - 影响范围：04 系列环境适配规范、Rules 入口、后续环境接入说明、非 Codex 环境支持边界。
  - 确认依据：用户明确说明只适配 Codex，其他环境只给方向；薄入口应提供语句让用户自行加入环境规则入口，而不是默认自动写入。
  - Human 决策：确认接受并落地。
  - 确认人/时间：Human，2026-06-17
  - 后续动作：更新 04 系列和 Rules 入口，并运行 specs / ADR 校验。
  - 回写位置：本 ADR、相关 specs、Rules 入口和 Change / commit。
  - 残留风险：Codex Hook、配置入口和 trust 规则仍需后续补充官方来源与当前版本证据。

  背景一：LDVH 之前希望适配 Trae、Trae CN 和 Codex 三种环境，但多环境同时承诺完整适配成本高、边界复杂，也容易形成未验证的完整支持声明。

  背景二：薄入口之前倾向由系统或 AI 自动设置，但实际存在两类场景：一类是系统级或用户级环境入口，一类是多项目并列放在同一工作区，LDVH 与用户其他项目是并列关系。自动写入容易越过用户环境边界，也容易把一次本机写入误当成长期事实。
decision: |
  决策方向：

  1. LDVH 官方适配目标收敛为 Codex App。
     - LDVH 维护 Codex 场景下的稳定入口、恢复提示、校验路径和降级方式。
     - Trae、Trae CN 或其他环境不再作为同等完整适配目标。
     - 对其他环境仅提供适配方向、薄入口文本原则和检查思路，由使用者按自身环境能力自行接入。

  2. LDVH 不默认自动写入用户环境入口。
     - LDVH 可以生成一段薄入口语句，说明应指向 `rules/LDVH-AI-ENTRY.md`，并包含上下文压缩或恢复后的重读要求。
     - 用户自行把该语句加入自己的系统级、用户级、工作区级或项目级规则入口。
     - AI 不应默认静默写入、覆盖或维护用户环境入口；需要写入时必须由 Human 明确授权并评估影响范围。

  3. 管辖项目接入仍以管辖项目配置为中心。
     - 多项目并列工作区中，LDVH 与其他项目可以是同级目录。
     - 当前哪些项目受 LDVH 管辖，应由工作区根目录 `LDVH-GOVERNED-PROJECTS.yaml` 判断。
     - 薄入口只负责把 AI 引向 LDVH 入口和管辖配置，不承载具体管辖项目事实。
consequences: |
  ## 正向价值

  - 服务 V1 快速定位：官方稳定适配目标收敛为 Codex App，AI 入口不再在多个未完全验证环境之间摇摆。
  - 服务 V3 正确判断：减少自动写入用户环境入口带来的权限、边界和信任风险。
  - 服务 V8 可靠回写：入口写入结果不是长期事实源，后续是否生效以现场检查为准。
  - 多项目工作区中，LDVH 不需要接管其他项目入口，只通过薄入口和管辖配置完成路由。

  ## 逆向价值

  - 逆向削弱 V1 快速定位和 V2 完整理解：非 Codex 用户无法获得同等完整的官方适配保障，需要自行承担环境差异处理。
  - 逆向削弱 V4 稳定执行：手动加入薄入口会让首次接入体验更慢，且更依赖人正确放置入口。

  ## 实施成本

  - 04 系列、Rules 入口和相关说明需要重新收口。

  ## 风险评估

  - 旧说明若未同步，可能仍暗示 Trae、Trae CN 和 Codex 三环境完整适配或自动部署。
  - 用户可能把薄入口生成误解为 LDVH 已经自动接管环境入口。

  ## 注意事项

  - Codex App 是当前官方维护的环境适配目标。
  - 其他环境只保留抽象自助适配原则，不维护具体目录、Hook 事件或安装步骤。
  - 薄入口模板放在 04.03，Rules 入口只保留导航和执行边界。
