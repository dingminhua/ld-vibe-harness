title: v4 结构验证实验：行动指引字段对 F2→F3 决策的独立效应
goal: 实现并运行一个 source-complete、条件盲评的 v4 配对实验，比较 F2 卡片有无 trigger_signal / scope_of_impact / action_relevance 三个新字段时，模型在 F2 触发决策与 F2→F3 消费上的差异。复用 v0.3 的 18 个冻结任务、宽触发策略（L1-baseline）、盲评 rubric 与 scorer 校验基础设施，两臂共享同一 trigger policy，唯一实验差异为 F2 卡片是否含新字段。把严格预注册的采用或不采用判断写回相关 Spark。
scope: 仅新增 code/ldvh/testing/knowledge_precheck_v4.py、code/ldvh/testing/knowledge_precheck_v4_trial.py、code/tests/testing/test_knowledge_precheck_v4.py、code/tests/testing/test_knowledge_precheck_v4_trial.py 与 docs/metrics/knowledge-precheck-v4；v3 代码只允许作为只读 import/复用依据，docs/metrics/knowledge-precheck-v3 sealed bundle 与 compiled artifacts 不得修改。复用 v0.3 的 18 个 task/gold（含 A1–S6、6 情形、9 applicable/9 non-use/6 no-trigger）和 L1-baseline 宽触发策略文本（1050 B / 9 行）。两臂同一 trigger policy（L1-baseline），唯一差异为 F2 卡片是否含新字段：struct-baseline 剥离 trigger_signal/scope_of_impact/action_relevance，struct-enhanced 含新字段。只允许真实 Helper F2/F3 只读调用及字段闭集证据留存；source-complete 报告成立后，允许经 Helper CAS 更新 Spark UID 019ffb52-ebb5-74e8-aac0-3cd3d73d15fc。排除生产 L1 接入、L0 复评、Specs、Helper contract、事实 Schema、Web、其它事实对象、v3 证据改写、Git commit/push/PR/release、部署和网络发布。
success_criterion_definitions:
- criterion_id: criterion-frozen-v4-protocol
  statement: 冻结 v4 protocol（schema_version=ldvh-knowledge-precheck-v4/1）、18 个 task/gold（复用 v0.3 的 A1–S6）、当前事实集合与 source snapshot（含双卡集：family_cards_enhanced + family_cards_stripped）、L1-baseline 宽触发策略文本（两臂共享同一 policy）、9/9 条件首发顺序平衡、模型/runner 身份策略与盲评 rubric。采用门槛预注册为：trigger_correct 增强臂对基线无显著回退（sign-flip p ≥ 0.05），且增强臂绝对 ≥ 15/18 或对比 v0.3 baseline 有显著改善；f2_decision_accuracy 以 trigger_correct + selection_correct + false_f3 为成分，paired sign test p < 0.05 才算支持新字段；strong_reuse / correct_non_use / first_legal_action_correct 增强臂不得显著低于基线；policy_capacity 与 source_complete_replay 成立。任一门槛失败或证据不足即 do-not-support-enhanced-fields。
- criterion_id: criterion-dual-card-gateway
  statement: v4 Gateway 在 expected_f2_cards 校验后，按 condition 对返回给模型的 cards 做投影剥离：struct-baseline 从每张卡的 fields 中删掉三个新字段（trigger_signal/scope_of_impact/action_relevance）并重构字段序；struct-enhanced 原样返回生产 F2 卡。snapshot 中存两套卡（family_cards_enhanced + family_cards_stripped），防止裸字段漂移逃逸。condition_from_packet 改为按 packet 中显式 card_layer/condition 字段区分臂（两臂 policy 完全一致，无法用 policy hash 区分）。盲评 packet、scorer 上下文不得含 struct- 字样。任何 write/unknown、arguments.workspace_root、跨 family、F3-before-F2、source drift 或条件泄漏均 fail closed 且零实验事实写入。
- criterion_id: criterion-v4-source-complete-replay
  statement: 独立 sealed evidence bundle 从 protocol/task/gold、source snapshot（含双卡集）、raw Helper exchanges、模型结构化输出、盲评 packet/评分及 adjudication ledger 字节一致重建 records、results 与 report；trigger correctness、unnecessary F2、false F3、selection、first action、strong reuse 与 correct non-use 由 frozen gold 加 raw response/trace 确定性重算。缺失、额外、篡改、hash drift、score/packet 不绑定或 post-hoc override 均被拒绝。
- criterion_id: criterion-v4-automated-verification
  statement: v4 focused tests 实际覆盖 protocol 闭集与双卡/双条件结构、dual-card gateway 的剥离/漂移/condition 泄漏拒绝、真实只读 fixture、byte replay、blind packet 脱敏（无 struct- 字样）、fresh context/scorer 唯一性、attempt/replacement/launch/time ceiling 与 technical-exclusion 闭集；同时重跑 v3 non-live-source focused tests 证明 sealed v3 行为与产物未被改变。
- criterion_id: criterion-v4-paired-measurement
  statement: 实际取得恰 18 retained pairs；最多 21 个 pair attempts、3 个仅由预注册技术排除触发的整对 replacements、42 个 member launches 与 42 个 scorer contexts，每个 member 最多 600 秒、无单臂重试、总运行不超过 6 小时。报告逐 family/情形及总体的 trigger confusion matrix、unnecessary F2、F3 precision/recall、selection、knowledge-adjusted first legal action、strong_reuse、correct_non_use、false F3、Helper 调用/F3 数量及可观察成本，并严格按冻结联合门槛给出 supports-enhanced-fields 或 do-not-support-enhanced-fields；错误、null、负效应和不利 family 结果不得排除。
- criterion_id: criterion-spark-v4-writeback
  statement: 仅在 v4 source-complete 报告成立后，目标 Spark UID 019ffb52-ebb5-74e8-aac0-3cd3d73d15fc 的公开精确回读包含报告绑定、实测指标、各门槛通过/失败、运行时可观察性与因果限制，以及严格的 supports-enhanced-fields 或 do-not-support-enhanced-fields 判断；写后 check-fact-integrity 外层 outcome=ok 且 result.status=complete。
priority: P1
work_items:
- item_id: item-freeze-v4-protocol
  goal: 冻结 v4 protocol：基于 v0.3 的 18 个 task/gold（A1–S6）和 L1-baseline 宽触发策略（9 行/1050 B），构建 v4 protocol（schema_version=ldvh-knowledge-precheck-v4/1），含双条件（struct-baseline/struct-enhanced）、9/9 首发顺序平衡、预注册门槛、盲评 rubric、artifact denylist、ceilings（18 pairs/21 attempts/3 replacements/42 launches/42 scorer contexts/600s per member/6h total)。
  status: completed
  expected_result: v4 protocol.json 已冻结，全部 18 个 task/gold、双条件、9/9 首发顺序、预注册门槛、盲评 rubric、ceilings 经测试验证
  result_summary: v4 协议已冻结完成
- item_id: item-capture-v4-source-snapshot
  goal: 捕获 v4 source snapshot：真实 Helper 捕获三类 F2 卡（含新字段 trigger_signal/scope_of_impact/action_relevance）+ F3 指纹；从捕获中派生 stripped 卡集（删除三个新字段 + 重构字段序），两者 hash 绑定存入 snapshot 双卡集。
  status: completed
  expected_result: source-snapshot.json 已捕获，含 family_cards_enhanced、family_cards_stripped 双卡集及 F3 指纹
  result_summary: 双卡集快照已捕获完成
- item_id: item-implement-v4-runner
  goal: 实现 v4 runner + gateway：剪裁 v3 代码创建 knowledge_precheck_v4.py（Schema v4、双卡剥离 Gateway、source snapshot 双卡集、18 任务复用、编译/回放/反篡改）和 knowledge_precheck_v4_trial.py（运行编排 CLI）。
  status: completed
  expected_result: knowledge_precheck_v4.py 和 knowledge_precheck_v4_trial.py 已实现，v4 Gateway 双卡剥离、编译/回放/反篡改通过
  result_summary: v4 runner 与 gateway 已实现完成
- item_id: item-write-v4-tests
  goal: 实现 v4 测试：test_knowledge_precheck_v4.py（协议闭集/双卡剥离/gateway 漂移拒绝/source-complete 回放/盲评脱敏/篡改拒绝）和 test_knowledge_precheck_v4_trial.py（真实只读 F2/F3 fixture/跨臂剥离正确性/ledger 上限/fresh context）。
  status: completed
  expected_result: test_knowledge_precheck_v4.py 和 test_knowledge_precheck_v4_trial.py 已实现，全部测试通过
  result_summary: v4 focused tests 全部通过
- item_id: item-run-v4-experiment
  goal: 运行 36 个 member run（18 对 × 2 臂）+ 18 对盲评：真实子代理，600s/attempt 上限，按 v4 protocol 编排；记录全部原始证据、触发 trace、Helper exchange、F3 决策、最终输出和盲评评分。
  status: completed
  depends_on:
  - item-implement-v4-runner
  - item-freeze-v4-protocol
  - item-capture-v4-source-snapshot
  expected_result: 36 个 member run + 18 对盲评已完成，ledger 完整，全部在上限内
  result_summary: 36 个 member run 与 18 对盲评已全部完成
- item_id: item-compile-sealed-bundle
  goal: compile sealed evidence bundle：source-complete 回放，byte-identical 重建 records/results/report；manifest 闭合，SHA-256 校验全部文件。
  status: completed
  depends_on:
  - item-run-v4-experiment
  expected_result: sealed evidence bundle 已 compile，byte-identical 重建 records/results/report 通过
  result_summary: sealed evidence bundle 已编译完成
- item_id: item-spark-writeback
  goal: 写回结果到相关 Spark（现有 spark-01KZXN5TXNEKMANG1WTFBKT5FW.yaml，保持 open/P1），记录 v4 结论（supports-enhanced-fields 或 do-not-support-enhanced-fields）与方向。
  status: in_progress
  depends_on:
  - item-compile-sealed-bundle
  expected_result: Spark UID 019ffb52-ebb5-74e8-aac0-3cd3d73d15fc 已受控写回，check-fact-integrity outcome=ok/status=complete
  current_summary: v4 结论写回 Spark（do-not-support-enhanced-fields）
  resume_from: 完成 v4 结论写回 Spark 与 check-fact-integrity 验证
