id: spark-0032
type: spark
title: Hook 与 Agent 双层运行链路：建立 LDVH AI 工作调度范式
status: pending
created: '2026-06-26T10:30:00+08:00'
updated: '2026-06-26T10:40:00+08:00'
description: |
  Human 明确收敛当前最高优先级：不是继续展开其它 P0 议题，而是先确保 LDVH 在真实环境中能正常运作，并把 AI 体验作为本 Spark 的显式目标。这里的 AI 体验不是界面观感，而是 AI 进入 LDVH 后能否低摩擦地识别项目、读取事实源、遵守 STOP / Human Gate、保留运行证据，并在新对话、子 Agent、上下文恢复、工作树切换和 Skill 调用等机制中稳定延续同一条运行链路。

  本 Spark 不要求一次完成所有后续 Spark / WorkCase 所需的能力，也不应把 Skill、subAgent、worktree、新对话等机制的全部产品化细节都收进 0032。0032 的前置目标是“先把路走通”：建立一套可复用的工程范式，使后续工作能够按同一调度机制展开，而不是每个任务重新定义入口、委派、工作树、事实源回读和证据回收。

  该问题分为两个部分：

  1. **部署到环境里**：支持 AI Hook 的环境应通过插件或等价环境入口触发 Runtime Protocol，使 SessionStart / PreToolUse 等生命周期事件能稳定进入 `code/hook_dispatch.py`，生成或查验 receipt，并让 AI 按 read_plan 与 STOP 条件行动。不支持 AI Hook 的环境应通过 Rules / Agent / instructions 等方式模拟 Hook 入口，显式触发同一套 canonical event，而不是另写一套平行流程。Git `commit-msg` 属于 Git 提交层机制，不是 AI Hook，但它也是 LDVH 正常运作的提交规范保障，应由 native Git hook 或后续 server-side gate 兜住真实提交路径。
  2. **让 LDVH 正常开展工作**：当前留下的 Spark、WorkCase、Spec、Rule 和运行时代码，本质上都是为了加强 LDVH，让 AI 更稳定地完成事实源驱动工作。0032 需要证明这些资产能被 AI 在真实工作中自然消费，而不是只证明某个脚本或 hook 被触发。AI 应能从统一入口进入同一条链路：识别 governed 项目，获得 read_plan，回读 P0/P1 事实源，执行或委派任务，遇到 STOP / Human Gate 停住，并把证据反馈到会话、工作树、子 Agent、新线程和提交链路中。0032 在这一部分的交付重点是前置调度机制：明确何时调用 Skill、何时拆给 subAgent、何时创建或切换 worktree、何时开启新对话，以及这些动作如何继承 Runtime Protocol、事实源优先级和验收证据。

  因此，Hook 层和 Agent 层不是两条割裂路径，而是通向同一条 LDVH 运行链路的两种入口：

  - **Hook 层保障**：由环境原生生命周期事件自动进入 Runtime Protocol，适合 Codex 等支持 AI Hook 的环境。
  - **Agent 层保障**：由 AI 在 Rules / Agent / instructions 中自觉模拟 Hook 入口，适合无 AI Hook 环境、子 Agent、线程恢复、上下文压缩、插件不可用或 Skill 调用等场景。

  本 Spark 作为当前唯一 P0，用来聚焦“Hook / Agent 两种入口如何共同打通同一条 LDVH 运行链路，并建立后续 LDVH 工作可复用的 AI 调度范式”。在该主线完成前，其它原 P0 Spark 和 WorkCase 先调整为 P1，避免优先级噪声稀释当前主线。

  当前已具备的事实基础：

  - `code/hook_dispatch.py` 已能识别 Codex payload，并通过 `~/.codex/ldvh/session-receipts/<session_id>.json` 保留会话 receipt。
  - 当前仓库已安装 native Git `commit-msg` hook，真实 `git commit` 会调用 `git.commit-msg` 事件并执行 `code/commit_validate.py`。
  - `specs/06`、`rules/LDVH-RUNTIME-PROTOCOL.md`、`hooks/ldvh-hooks.yaml` 和 `specs/33` 已记录 Hook / Rules 双路径与提交层 hook 的边界。
  - `workcase-0011` 已完成多环境 Hook Probe，但它只证明环境能力和适配矩阵，不等于 Hook / Agent 双入口已经打通为 AI 可持续消费的运行链路。

  后续应优先转化为一个或多个 WorkCase，先收掉以下前置问题。它们不是要求 0032 完成所有机制的最终形态，而是要求形成最小可运行、可复用、可验收的工程范式：

  1. Codex 插件方式是否已在当前用户环境稳定启用、受信任、可在新对话中自动产生 receipt，并能被 AI 消费；
  2. WorkBuddy / Claude Code 插件资产是否具备可安装、可卸载、可验证的最小分发形态；
  3. Trae 等无 AI Hook 环境的 Rules / Agent 入口是否能稳定让 AI 自觉执行 Runtime Protocol；
  4. Skill 调用、子 Agent、新线程、上下文压缩恢复和工作树切换是否都有明确入口、调度规则和证据回收方式，不依赖主线程记忆，也不绕过 read_plan / STOP；
  5. native Git `commit-msg`、后续 CI / server-side gate 与 AI Hook 的边界是否在安装和验证流程中清晰呈现；
  6. 安装验收是否覆盖“脚本触发、receipt 存在、AI 消费、事实源校验、Skill / subAgent / 工作树 / 新对话调度范式、提交规范兜底、卸载/禁用边界”这一最小闭环。
