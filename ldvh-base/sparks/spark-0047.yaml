title: 记录型授权被误判为实施授权的越权重现与阻断
status: implemented
intent: 应如何让系统可机械判定并阻断：Human 仅授权创建或更新事实对象（例如建立 Spark）时，AI 却把前序背景需求推定为代码、规范、测试或 Git 提交的实施授权。
summary: "## 当前判断\n\n问题已由既有机制机械解决，不再作为未处置议题保留：\n\n- 21 §6.3.1/§6.3.2 状态机：WorkCase 创建初态即 `human_plan_confirming`，进入 `executing` 的唯一合法边要求 Gate1 批准并同事务写入绑定真实 Human `source_refs` 与 baseline fingerprint 的 `execution_approval`；无批准则只能 `SafeConvergenceShape` 收敛，不存在“跳过 Gate1 直接实施”的合法转换。\n- 21 §7.3 专属写入口：WorkCase 活动期写入只能走 `update-workcase`/`close-workcase`/`correct-closed-workcase`，Code 机械校验状态、版本、review 与 approval 绑定；通用 `update-fact-object` 不接受 WorkCase。\n- 30 模板 Git 提交授权：commit 必须有 Human 当前指令，或 WC `execution_authorization` 逐项列明且 `execution_approval` 有效；模板命中、测试通过、文件已修改都不授予 commit 权限。\n\n因此“先记录为 Spark”只创建事实对象、不产生任何实施或提交授权；正式实施必须经 WorkCase Gate1，而 Gate1 已被状态机机械限制。study-0027（AI 代理授权边界的行业实践调研）确认该形态与行业“授权决策外部化 + 绑定 Human 决策 + 执行点 fail-closed”等价。\n\n## 剩余边界\n\n不建立 WorkCase、也不创建 Git 提交、直接修改代码/规范/测试文件的普通直写动作没有机械执行点，属于薄 Skill 劝告级约束与事后审计范围；这是流程纪律边界而非本 Spark 所述越权形态的机械缺口。"
disposition_summary: 已落实：记录型授权（如“先记录为 Spark”）不构成实施/规范修改/测试/提交授权，实施必须经 WorkCase Gate1 批准（21 §6.3.1/§6.3.2 状态机、§7.3 专属写入口、30 模板 commit 授权要求共同机械承接）；spark-0047 所述越权形态已被既有机制阻断，不再需要新的阻断设施。无剩余待处置内容，无 routed-to；普通文件直写属薄 Skill 劝告级约束与审计边界，不作为本议题的机械缺口继续跟踪。
