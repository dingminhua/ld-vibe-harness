id: workplan-0070
type: workplan
title: 标准化 specs 文件元信息契约
status: draft
created: '2026-06-18T09:11:44'
updated: '2026-06-18T09:11:44'
workarea: workarea-0012
priority: P1
description: |
  将 LDVH specs Markdown 顶部 `> 字段：值` 头部元信息从格式建议升级为人、AI、Code、Web
  可共同消费的稳定契约。变更重点是明确字段语义、适用文档类型、必填/可选规则和 Code 检查边界；
  不把头部改成 YAML frontmatter，不把 `ldvh_member` 字段搬进普通头部，也不重复成员自描述事实。
success_criteria: |
  - [ ] `specs/03-文档基础规范.md` 明确头部元信息是机器可读契约，而非普通文档装饰
  - [ ] `specs/03.01-规范文档规范.md` 列出 specs 正式规范、子文档、studies、sources 的头部字段规则
  - [ ] `specs/03.02-工作模型文档规范.md` 明确 20-39 普通头部不得重复 `ldvh_member` 成员自描述字段
  - [ ] `specs/03.03-工作流程文档规范.md` 明确 40-59 普通头部不得重复 `ldvh_member` 成员自描述字段
  - [ ] 设计结论写清头部元信息契约与成员自描述契约的边界
  - [ ] 仅记录后续 Code 检查候选，不贸然扩大 `code/spec_checks/index.py` 判定范围
source: |
  Plan creation requested by dmh2002 on 2026-06-18:
  用户要求评估并设计 LDVH specs 文档的“标准文件元信息契约”，保持现有 `> 字段：值` 格式，
  把它明确为稳定机器接口；同时要求注意 20+ / 40+ 双层元信息，不把 `ldvh_member` 字段搬进普通头部，
  不新增会与成员自描述冲突的头部字段。
  独立 specs 元信息契约审批子 Agent 已返回 APPROVE；本计划仍需 Human 明确批准后才能开始执行。
