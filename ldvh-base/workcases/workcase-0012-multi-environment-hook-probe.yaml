id: workcase-0012
type: workcase
title: Codex WorkBuddy Trae 三环境 Hook Probe 测试
goal: |
  承接 spark-0032，建立并执行 Codex、WorkBuddy、Trae 三个环境的 Hook Probe 测试工作，先用最小 probe 收集各环境 Hook 的真实事件、输入字段、输出语义、blocking 能力、注册方式、信任机制和卸载路径，再判断 LDVH Hook 入口适配层如何设计。
status: closed
created: '2026-06-25T08:59:00+08:00'
updated: '2026-06-26T09:52:45+08:00'
priority: P1
description: |
  spark-0025 已经把 LDVH 入口触发链收敛为"Hook 强制握手 + receipt 消费入口链"的终态方向；spark-0032 进一步指出，多环境 Hook 接入不能混在 spark-0025 中处理，因为 Codex、WorkBuddy、Trae 的事件名称、参数字段、注册方式、blocking 语义、信任机制和可注入上下文可能不同——且 spark-0032 已确认 Trae 缺少可安装、可验证、可阻断的 AI lifecycle Hook，不属于 LDVH 正式支持范围。

  本 WorkCase 只负责三环境 Probe 测试：Codex 和 WorkBuddy 走 AI Hook Probe 路径（对应插件方式）；Trae 只记录“不具备正式接入能力”的证据，不建立替代环境入口。测试不直接实现完整 LDVH 握手，不直接替换用户 AGENTS.md，不直接启用生产 Hook。测试目标是先取得真实证据：每个环境到底能触发哪些事件、传入哪些字段、是否能阻断、如何返回 additional context 或等价上下文、如何安装/启用/卸载，以及如何做到非 LDVH 项目 no-op。

  环境范围固定为：Codex、WorkBuddy、Trae。若后续加入其他环境，应追加 revision_history 或新 WorkCase，不在本 WorkCase 隐式扩大范围。
success_criteria: |
  - [x] 形成一个最小 Hook Probe 方案：只记录事件 payload、环境变量、cwd、退出码和输出处理结果，不执行 LDVH 业务逻辑，不写用户项目事实源。
  - [x] 在 WorkBuddy 环境完成 SessionStart、UserPromptSubmit、PreToolUse、PostToolUse 至少四类事件的触发与 payload 采样，并记录 settings / 插件两种注册路径的可行性判断。
  - [x] 在 Codex 环境完成 Hook 能力实测：确认可用事件、注册方式、payload 字段、blocking 语义、上下文注入能力和不可用项，不沿用 WorkBuddy 假设。
  - [x] 在 Trae 环境完成能力边界确认：确认 Trae 缺少可安装、可验证、可阻断 AI lifecycle Hook 后，记录为不属于 LDVH 正式支持范围，不试图安装、模拟或寻找替代入口。
  - [x] 形成三环境适配矩阵：事件名、触发时机、输入字段、输出格式、blocking 能力、信任/启用机制、安装路径、卸载路径、no-op 规则和安全边界。
  - [x] 明确 LDVH 内核与环境 adapter 的边界：LDVH 内核只消费统一 normalized event，环境差异只留在 adapter。
  - [x] 给出是否可以把 spark-0025 的 Hook 入口推进到实现 WorkCase 的判断，以及需要同步哪些 specs/06、Att.09、Att.10、Att.12、Rules 或插件资产。
source: |
  来源 Spark：`ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml`。
  Human 要求：测试要在 Codex、WorkBuddy、Trae 三个环境进行，并允许建立 WorkCase 安排。
orchestration:
  mode: sequential
  execution_items:
    - id: item-1
      title: 设计最小 Hook Probe
      role: probe-design
      mode: single
      input_refs:
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
        - ldvh-base/sparks/spark-0025-entry-trigger-chain.yaml
        - specs/06-运行时扩展规范.md
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
      expected_output: 形成跨环境通用的 Hook Probe 设计：采集 stdin、argv、环境变量、cwd、事件名、退出码和环境输出处理结果；明确只读、不写用户项目、不执行 LDVH 业务逻辑。
      status: done
      result_summary: |
        已实现 code/hook_probe.py v0.1.0：跨环境最小 Hook 探针。
        - 采集：fingerprint（OS/版本/Python/CODEBUDDY/WORKBUDDY/TRAE 前缀）、stdin JSON payload、argv、env（前缀过滤，不泄露敏感信息）、cwd、退出码。
        - 每次运行在 --evidence-dir 下按时间戳创建独立子目录：fingerprint.json / stdin.json / argv.txt / env.txt / cwd.txt / exit_code.txt / summary.json。
        - 本地验证通过：stdin 传入模拟 SessionStart JSON，正常解析并写入 6 个文件 + summary。
        - 不写用户项目，不执行 LDVH 业务逻辑，退出码可配置。
        - 已补全 plan-review 需要的 raw evidence 清单和环境指纹字段。
      evidence_refs:
        - code/hook_probe.py
      blocking_reason: null
    - id: item-2
      title: 实测 WorkBuddy Hook
      role: environment-probe
      mode: sequential
      input_refs:
        - specs/06-运行时扩展规范.md
        - hooks/ldvh-hooks.yaml
        - code/hook_dispatch.py
      expected_output: 在 WorkBuddy 中验证 SessionStart、UserPromptSubmit、PreToolUse、PostToolUse 的 payload、matcher、blocking、additionalContext 或等价输出能力，并记录 settings 与插件注册路径差异。
      status: done
      result_summary: |
        WorkBuddy Hook Probe 已完成，采样目录为 .probe-evidence/workbuddy/。
        - 已采集四类事件：SessionStart 2 次、UserPromptSubmit 19 次、PreToolUse 12 次、PostToolUse 49 次。
        - raw evidence 每次运行均包含 fingerprint.json / stdin.json / argv.txt / env.txt / cwd.txt / exit_code.txt / summary.json。
        - payload 实测字段包括 session_id、transcript_path、cwd、hook_event_name、tool_name、tool_input、permission_mode、client、version、model 等；PreToolUse 可观察 Write/Edit 输入。
        - settings 路径可作为 probe 验证入口，但长期分发不应直接混写用户 settings；WorkBuddy 支持插件 hooks/hooks.json，LDVH 终态应走插件调用 dispatcher。
        - 生产路径不保留 probe evidence，不写用户项目事实源；no-op 由 dispatcher 读取 LDVH-GOVERNED-PROJECTS.yaml 后按 cwd 判定。
      evidence_refs:
        - code/hook_probe.py
        - ldvh-base/sparks/spark-0025-entry-trigger-chain.yaml
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
      blocking_reason: null
    - id: item-3
      title: 实测 Codex Hook
      role: environment-probe
      mode: sequential
      input_refs:
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
        - specs/06-运行时扩展规范.md
      expected_output: 在 Codex 环境中验证实际可用事件、注册方式、payload 字段、blocking 语义、上下文注入能力和不支持项；不得把 WorkBuddy 实测结论直接迁移为 Codex 事实。
      status: done
      result_summary: |
        Codex Hook Probe 已完成，采样目录为 .probe-evidence/codex/。
        - 已采集四类事件：SessionStart 2 次、UserPromptSubmit 6 次、PreToolUse 10 次、PostToolUse 9 次。
        - payload 实测字段包括 session_id、turn_id、transcript_path、cwd、hook_event_name、model、permission_mode、tool_name、tool_input、tool_use_id 等。
        - Codex 支持插件自带 hooks/hooks.json；插件 Hook 需通过 /hooks 审查信任后生效，并向 Hook 注入 PLUGIN_ROOT / PLUGIN_DATA。
        - Codex 与 WorkBuddy 字段相近但不能互相推断；adapter 只负责把原生事件映射到 LDVH canonical event。
        - 子 Agent 不按环境 Hook 自动消费 SessionStart；主 Agent spawn 子 Agent 时应提示其走 Rules 路径自觉触发 session-start。
      evidence_refs:
        - code/hook_probe.py
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
      blocking_reason: null
    - id: item-4
      title: 实测 Trae AI lifecycle Hook 能力边界
      role: environment-probe
      mode: sequential
      input_refs:
        - specs/06-运行时扩展规范.md
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
      expected_output: 确认 Trae 缺少可安装、可验证、可阻断 AI lifecycle Hook 后，记录不属于 LDVH 正式支持范围；不尝试安装、模拟或寻找替代入口，不把 Git hook、MCP、CI 或 Human Gate 写成 AI Hook 替代。
      status: done
      result_summary: |
        Trae 路径已按 Human 确认和 spark-0032 收敛完成：Trae 的问题不是没有插件系统，而是缺少可安装、可验证、可阻断的 AI Agent 生命周期 Hook。
        - 不得把 Git hook、MCP、CI、server-side gate、Human Gate、本地脚本或兼容配置写成 Trae AI Hook 替代。
        - Trae 不沿用 Codex / WorkBuddy / Claude Code 的事件、stdin 字段、blocking 语义、上下文注入或信任机制假设。
        - Trae 不建立替代环境入口；正式 LDVH 接入必须等目标环境具备插件、扩展包、package 或 runtime adapter 形态的 lifecycle Hook。
        - 旧非 Hook 路径已废止，不能作为平等接入方式。
      evidence_refs:
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
        - specs/06-运行时扩展规范.md
        - git-history:rules/LDVH-RUNTIME-PROTOCOL.md
        - specs/33-ldvh-install-action-LDVH安装行动编排.md
      blocking_reason: null
    - id: item-5
      title: 形成三环境适配矩阵
      role: adapter-design
      mode: single
      input_refs:
        - ldvh-base/workcases/workcase-0012-multi-environment-hook-probe.yaml
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
        - specs/06-运行时扩展规范.md
      expected_output: 输出三环境 Hook 适配矩阵与 LDVH normalized event 边界：哪些字段进入内核，哪些留在 adapter，哪些能力受限或需要 Human Gate。
      status: done
      result_summary: |
        三环境适配矩阵已收敛为协议统一、执行分层：
        - LDVH core 只消费 canonical event：session-start、pre-tool-use、git.commit-msg。
        - WorkBuddy / Codex：有 AI Hook 能力，推荐插件方式；原生 SessionStart / UserPromptSubmit / PreToolUse / PostToolUse 由 adapter 映射到 canonical event，trigger_source=hook。
        - Trae：缺少 AI lifecycle Hook 能力，不属于 LDVH 正式支持范围；不建立替代环境入口。
        - no-op 规则统一由 dispatcher 读取工作区根目录 LDVH-GOVERNED-PROJECTS.yaml 并按 cwd 判定；未命中管辖项目时静默退出。
        - 环境差异保留在 adapter：原生事件名、payload 字段、信任/启用机制、插件路径、上下文注入和 blocking 语义不得进入 LDVH core。
      evidence_refs:
        - specs/06-运行时扩展规范.md
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
        - specs/33-ldvh-install-action-LDVH安装行动编排.md
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
      blocking_reason: null
    - id: item-6
      title: 评估 spark-0025 Hook 入口实现条件
      role: implementation-readiness-review
      mode: single
      input_refs:
        - ldvh-base/sparks/spark-0025-entry-trigger-chain.yaml
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
        - ldvh-base/workcases/workcase-0012-multi-environment-hook-probe.yaml
        - specs/06-运行时扩展规范.md
        - specs/attachments/01.Att.03-环境入口类型表.md
        - specs/attachments/06.Att.10-部署检查核对表.md
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
        - git-history:rules/LDVH-RUNTIME-PROTOCOL.md
      expected_output: 判断是否具备将 spark-0025 推进为 Hook 入口实现 WorkCase 的条件，并列出需同步的 specs、Rules、Hook registry、dispatcher、插件或受限接入说明。
      status: done
      result_summary: |
        可以把 spark-0025 推进到 Hook 入口实现；当前结论已由 2026-07-06 Hook-only 决策修订：
        - 支持 AI Hook 的环境：插件 hooks/hooks.json 或等价 package 调用 hook_dispatch.py / runtime_adapter.py，adapter 映射原生事件到 canonical event，trigger_source=hook。
        - 缺少可安装、可验证、可阻断 AI lifecycle Hook 的环境：不属于 LDVH 正式支持范围，不能通过非 Hook 机制、Rules 或 instructions 作为环境入口替代。
        - spark-0025 此前关于非 Hook 环境替代路径的设想已废止；后续实现 WorkCase 应聚焦插件资产、adapter、dispatcher receipt 和旧入口路径清理。
      evidence_refs:
        - ldvh-base/sparks/spark-0025-entry-trigger-chain.yaml
        - ldvh-base/sparks/spark-0032-multi-environment-hook-compatibility.yaml
        - specs/06-运行时扩展规范.md
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
        - git-history:rules/LDVH-RUNTIME-PROTOCOL.md
      blocking_reason: null
  plan_review:
    orchestration_owner: main_controller
    workflow_ref: null
    review_policy:
      selection_reason: 本 WorkCase 涉及多个外部环境的 Hook 接入、用户环境配置、blocking 能力和插件/设置注册路径；执行前需要确认测试边界，避免静默修改用户环境或把单环境观察写成通用事实。
      required_perspectives:
        - 多环境适配边界
        - 用户环境安全与 no-op
        - Hook payload 与 blocking 证据
      optional_perspectives: []
      tool_method_requirements:
        - 先 probe 后适配，不直接启用生产 LDVH Hook。
        - 不静默修改用户 settings、AGENTS、插件配置或外部环境入口。
        - 不把 WorkBuddy 的 Hook 能力直接声明为 Codex 或 Trae 能力。
        - 每个环境都必须记录真实 payload、注册方式、退出码/输出语义和卸载路径。
      aggregation_rule: 存在 fail 或 needs_human_gate 结论时不得进入实际环境测试或后续实现，必须先处理或提交 Human 裁决。
    review_items:
      - id: plan-review-1
        reviewer: subagent-multi-environment-adapter
        role: 多环境适配边界
        agent_name: subagent-multi-environment-adapter
        requested_at: '2026-06-25T01:32:00+08:00'
        perspective: 多环境适配边界
        result:
          status: fail
          summary: |
            方案方向合理，已限定 Codex、WorkBuddy、Trae 分别实测，并明确 adapter 与 LDVH 内核边界。但需要补充每次 probe 的环境指纹，包括环境版本、客户端/插件版本、OS、配置路径、sandbox/权限/approval/trust 状态和 Hook 注册来源；适配矩阵也需要增加失败/缺失项字段，例如不支持原因、降级入口和 Human Gate 条件。
          key_findings:
            - 方案方向合理，已限定 Codex、WorkBuddy、Trae 分别实测，并明确 adapter 与 LDVH 内核边界。
            - 仍需补充每次 probe 的环境指纹、失败/缺失项字段和 Human Gate 条件。
          required_changes:
            - 补充每次 probe 必须记录环境指纹：环境版本、客户端/插件版本、OS、配置路径、sandbox/权限/approval/trust 状态、Hook 注册来源。
            - 适配矩阵增加失败/缺失项字段：不支持原因、降级入口、Human Gate 条件。
          evidence_refs: []
        required_changes:
          - 补充每次 probe 必须记录环境指纹：环境版本、客户端/插件版本、OS、配置路径、sandbox/权限/approval/trust 状态、Hook 注册来源。
          - 适配矩阵增加失败/缺失项字段：不支持原因、降级入口、Human Gate 条件。
        risk_notes:
          - 实测前仍需 Human 授权；当前 WorkCase 不能直接进入环境配置修改或测试。
      - id: plan-review-2
        reviewer: subagent-environment-safety
        role: 用户环境安全与 no-op
        agent_name: subagent-environment-safety
        requested_at: '2026-06-25T01:32:00+08:00'
        perspective: 用户环境安全与 no-op
        result:
          status: needs_human_gate
          summary: |
            方案已声明不替换用户 AGENTS.md、不启用生产 Hook、不静默修改 settings/插件配置，并要求记录卸载路径。但修改环境入口/配置前必须 Human Gate；执行前还需补充 probe 的 no-op 判定、卸载/恢复验收证据，以及 blocking 测试只能在 Human 授权的沙箱或测试入口中进行。
          key_findings:
            - 方案已声明不替换用户 AGENTS.md、不启用生产 Hook、不静默修改 settings/插件配置，并要求记录卸载路径。
            - 修改环境入口/配置前必须 Human Gate。
            - 仍需补充 no-op 判定、卸载/恢复验收证据和 blocking 测试边界。
          required_changes:
            - 补充非 LDVH 项目的 no-op 判定：识别方式、退出码/输出、是否写日志、日志位置。
            - 补充卸载/恢复验收证据：settings、插件、Hook 注册项如何回滚并验证。
            - 明确 blocking 测试只在 Human 授权的沙箱/测试入口中进行，不影响真实用户工作流。
          evidence_refs: []
        required_changes:
          - 补充非 LDVH 项目的 no-op 判定：识别方式、退出码/输出、是否写日志、日志位置。
          - 补充卸载/恢复验收证据：settings、插件、Hook 注册项如何回滚并验证。
          - 明确 blocking 测试只在 Human 授权的沙箱/测试入口中进行，不影响真实用户工作流。
        risk_notes:
          - 最大风险是测试阶段误写用户环境入口或插件配置。
          - Codex、WorkBuddy、Trae 能力不得互相推断，也不得声明环境完整支持。
          - 未获 Human 确认前不得进入实际环境测试。
      - id: plan-review-3
        reviewer: subagent-hook-evidence
        role: Hook payload 与 blocking 证据
        agent_name: subagent-hook-evidence
        requested_at: '2026-06-25T01:32:00+08:00'
        perspective: Hook payload 与 blocking 证据
        result:
          status: fail
          summary: |
            方案已要求采集 stdin、argv、env、cwd、事件名、退出码和输出处理结果，并覆盖 SessionStart、UserPromptSubmit、PreToolUse、PostToolUse。但未定义原始证据格式、样本命名、stdout/stderr/exit-code 组合矩阵，也未要求对 additionalContext 做“文档假设 vs 实测回显”区分。
          key_findings:
            - 方案已要求采集 stdin、argv、env、cwd、事件名、退出码和输出处理结果，并覆盖 SessionStart、UserPromptSubmit、PreToolUse、PostToolUse。
            - 仍需定义原始证据格式、样本命名、stdout/stderr/exit-code 组合矩阵和 additionalContext 区分。
          required_changes:
            - 为每个环境新增 raw payload 证据清单：stdin.json、argv.txt、env.txt、cwd.txt、stdout/stderr、exit_code、宿主最终处理结果。
            - 增加 blocking 正/反例：退出码非零是否阻断、输出是否展示、是否可注入上下文。
            - normalized event 只能由 raw evidence 映射，字段缺失需标注 unknown。
          evidence_refs: []
        required_changes:
          - 为每个环境新增 raw payload 证据清单：stdin.json、argv.txt、env.txt、cwd.txt、stdout/stderr、exit_code、宿主最终处理结果。
          - 增加 blocking 正/反例：退出码非零是否阻断、输出是否展示、是否可注入上下文。
          - normalized event 只能由 raw evidence 映射，字段缺失需标注 unknown。
        risk_notes:
          - 执行 WorkBuddy、Codex、Trae Probe 前仍需 Human Gate，避免修改 settings、插件或环境入口。
    controller_resolution:
      resolved_at: '2026-06-25T09:03:00+08:00'
      resolver: main_controller
      source_review_item_ids:
        - plan-review-1
        - plan-review-2
        - plan-review-3
