type: spark
title: “人工”用语清理与执行主体命名治理
status: pending
created: '2026-06-25T00:29:32+08:00'
updated: '2026-06-25T02:51:28+08:00'
description: |
  本 Spark 记录 LDVH 中“人工”一词的用法清理问题，并作为后续调查线程的议题入口。

  Human 指出：在“人工降级检查”等表达中，“人工”一词存在执行主体混淆。若实际动作是 AI 回读文件、核对原文或不用工具投影完成判断，把它称为“人工”会把 AI 拟人化，并模糊 Human、AI、Code 工具和环境承载物之间的责任边界。

  本 Spark 当前只建立主要议题，不展开全量调查和批量修改。后续调查可由其他线程按议题分工完成。

  主要议题：

  1. 执行主体边界：梳理 LDVH 文档中“人工”是否真实表示 Human 介入；若不是，应区分 Human、主控 AI、Code 工具、环境入口、外部系统和手动命令。
  2. “人工降级检查”：该表达同时存在“降级”遮掩问题和“人工”拟人化问题；需要判断哪些位置应改为原文核对、文件事实源核对、非工具投影核对、Human Gate、能力缺口或未接管缺口。
  3. “人工核对 / 人工检查 / 人工复核”：仅当执行主体确为 Human 时保留；若由 AI 执行，应改为原文核对、事实源核对、手动命令核对或 AI 回读核对。
  4. “人工降级路径 / 人工降级方式 / 人工降级步骤”：调查这些表达是否实为工具能力缺口、环境未接入、行动编排未接管或测试覆盖不足；不得把缺口写成完整支持。
  5. 保障机制与承载矩阵中的“人工”：检查该词是否被用来替代明确的责任归口、验证方式、接管状态和后续解决入口。
  6. Human Gate 与 Human-facing 边界：保留 Human 相关术语的正当用法，但要求它只指真实 Human 判断、授权、确认或展示对象，不泛化为 AI 的普通核对动作。
  7. 后续清理产物：建议形成用语清单、替换词典、按文件分布的风险分级、需要 Human Gate 的修改范围，以及是否需要升级为 WorkCase 或 ADR 的建议。

  阶段性命名原则：

  1. LDVH 的主要服务对象是 AI；在没有特别说明时，规则、入口和事实源中的默认执行主体应视为 AI 或主控 AI，不使用“人工”作为默认主语。
  2. 需要真实人类参与、判断、授权、确认或取舍时，必须使用 Human、Human Gate 或 Human 确认；不使用“用户确认”作为 LDVH 规范口径。“用户”仅在安装者、环境所有者、项目所有者等非 Gate 身份语境中保留。
  3. 需要确定性执行、结构化解析、机械校验、诊断或确定性派生输出生成时，主语应为 Code；AI 草拟、总结或自然语言生成不得被写成 Code 生成。
  4. 需要页面展示、交互、同步态势或 Human-facing 信息呈现时，主语应为 Web。
  5. 规范定义、授权、禁止和约束应以 specs 或具体规范为主语。
  6. 入口路由、读取顺序和 STOP 点应以 Rules 入口为主语。
  7. 环境可触达性、部署、适配和是否可声明支持，应以环境或运行时扩展为主语；固定能力资产存在、已部署副本存在与当前环境已支持必须拆开表达。
  8. Skill、Agent、Hook、MCP 等具体承载能力应以能力资产或具体资产名为主语；MCP 作为工具或连接器能力时，归入运行时扩展承载物或具体能力资产名。
  9. 子 Agent 指接受主控 AI 协调工作的 Agent；它可以承担被分配的调查、复查、分析或执行片段，但不替代主控 AI 的编排责任，也不替代 Human Gate、Code 确定性执行、Web 展示或事实源权威；子 Agent 不直接写入事实源，不独立决定状态流转，也不拥有独立事实源状态。
  10. Git 追溯、提交记录和事实源修改证据应以 Git 或 Git commit records 为主语；测试、回归、验证声明和失败阻断应以 Tests 或验证为主语，涉及机械执行时归入 Code。
  11. WorkCase、Spark、ADR、Pitfall、Study 只承载事实、问题、决策、经验或报告，不拟人化为执行主体；判断、执行、确认或展示应回到 AI、Human、Code、Web 或其它明确主体。

  子 Agent 审核结论：

  - 结论为“可行但需修正”：主体划分方向与 03、04、05、06、08 的职责边界基本一致，但必须避免把“人工”机械替换成新的含混主体。
  - 需要拆分 Human 与用户、环境所有者、项目所有者：只有真实确认、授权和取舍场景使用 Human / Human Gate。
  - 需要拆分 AI、主控 AI 与子 Agent：默认执行、最终编排和隔离审查不是同一主体。
  - 需要拆分环境、运行时扩展、固定能力资产和已部署副本：资产存在不等于当前环境已经支持。
  - 最大落地风险是全局机械替换“人工”表达，尤其是“人工降级检查”。清理时应先按主体和问题类型分类标注，再决定替换词；不得用 AI、Code 或 Human 直接覆盖能力缺口、工具不可用、环境未接入、Human Gate 或等价验证差异。

  调查约束：

  - 其他线程应先调查和分类，不直接批量替换。
  - 每个问题都应保留来源路径、语境和建议替代词。
  - 若修改会影响 specs、Rules 入口、Human Gate、行动编排或事实源边界，应先回到对应规范和 Human 确认。
