title: LDVH 开源发布就绪与公共契约
intent: 保留 LDVH 面向开源发布前的整体就绪条件与公共契约边界，避免将局部实现、版本规则或发布准备误作已可公开发布，或在没有明确授权时启动发布执行。后续需判断哪些公共承诺、保障条件与未决风险必须先收敛。
status: implemented
summary: "LDVH 面向开源发布的整体就绪条件与公共契约已全部落地并完成首次实战（v4.0.1）。\n\n**已落地（发布纪律与工程基础）**\n\n- LDVH 为纯源码分发（无 wheel/sdist 打包、无 registry 发布），发布即 git tag + CHANGELOG 更新；不需要独立发布规范或行动模板（原 spark-0023 已废弃并入）。\n- 发布纪律已通过 03 §9.10「发布与版本公共契约」与 03.Att.01 落地（2026-08-08 受控修订，独立复核通过）：\n  - `release` 成为 03 提交契约 type 闭集成员；\n  - 版本号遵循 SemVer，pre-release 用 `-alpha`/`-beta`/`-rc.N` 后缀；tag 用 `v` 前缀且与版本号严格一致；版本声明点不得互相矛盾；\n  - 每个对外版本必须在 CHANGELOG.md 记录条目（Added/Changed/Fixed/Removed/Known 分区）；\n  - 部署件变更标注：触及 skill/SKILL.md 或 Git Hook 部署件时 CHANGELOG 必须醒目分区并给更新方式（03 §9.10 第 6 条）；\n  - 发布是 Human 决定：打 tag 与 push 只在 Human 明确授权后执行。\n- 工程验证基础：GitHub Actions CI（code pytest+ruff、web tsc+test+build）与自动 Release 工作流（push v* tag 时自动从 CHANGELOG 建 Release 页）已上线。\n- 版本方向按 G1 处理：文档对齐既有 tag `v4.0.0`；v4.0.1 完成新契约下的首次完整发布演练（release 提交 → tag → push → GitHub Release 页）。\n- hotfix 分支策略与发布就绪核对清单已写入 README「版本与发布」小节（项目正式来源）。\n\n**未决项处置**\n\n- hotfix 分支策略：已由 README「版本与发布」承担（main 直接修复 + PATCH 递增 + 回合并 dev-v4）；\n- GitHub Release 远端操作边界：由 03 §9.10 授权边界与 03 §12 Human Gate 承担（force-push 需 Human 授权），实操路径已通过 v4.0.1 演练走通。"
disposition_summary: 使命完成：发布纪律（版本号、tag 一致性、CHANGELOG 契约、部署件变更标注、授权边界）经 03 §9.10 与 03.Att.01 受控修订落地；CI 与自动 Release 工作流上线；hotfix 与发布就绪核对写入 README 项目正式来源；v4.0.1 完成首次完整发布演练并已公开。无剩余待处置责任。
