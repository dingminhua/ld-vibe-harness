type: change
title: 建立普通 specs 文档机制关系声明与 Rules 关联治理
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户指出 `.trae/rules/` 下存在多个 Rules 实体文件，若没有 specs 文档声明其规范来源、维护边界和同步关系，会导致 Rules 文件与 specs 权威文档之间缺少关联。
  经讨论，确认不采用 11.01 集中登记全集的方式，而是在 `specs/03-Specs文档规范.md` 中建立普通 specs 文档的最小机制关系声明规则。
  同时明确 20-49 事实模型和 50-79 行动模型不使用普通机制关系声明，继续通过 `specs/04-LDVH模型子文档规范.md` 的 NN.01-NN.06 模型实践子文档承接机制关系。
decision: |
  在 `specs/03-Specs文档规范.md` 中新增机制关系声明规则，定义最小声明原则、声明条件、普通 specs 文档与 Rules / Skill / Agent / Tools / Web / Contract 实体的同步判断标准，并声明 03 与 `ldvh-l2-specs-rules.md` 的 Rules 关系。
  在 `specs/11.01-Rules机制规范.md` 中增加 Rules 与机制关系声明的衔接规则，明确普通 specs 文档与 Rules 实体的关系由对应 specs 文档依据 03 §六维护，11.01 不集中登记所有 Rules 实体清单。
  更新 `ldvh-l2-specs-rules.md`、`ldvh-l0-fact-model-rules.md`、`ldvh-l0-rules.md` 和 `ldvh-l1-rules.md` 的规范来源、维护边界或关联说明。
  将 `ldvh-l0-fact-model-rules.md` 收敛为事实实例编辑入口规则，不复制 ADR、字段契约、状态机或 Human Gate 细则。
consequences: |
  - 普通 specs 文档只有在规则被机制实体稳定消费且变更会触发同步检查时，才声明对应机制关系。
  - 不涉及的机制不再占位声明，避免模板噪音。
  - 事实模型和行动模型继续通过 04 的 NN.01-NN.06 模型实践子文档承接机制关系。
  - Rules 文件头部应声明规范来源和维护边界，避免成为游离规则或第二事实源。
affects:
  - specs/03-Specs文档规范.md
  - specs/11.01-Rules机制规范.md
  - .trae/rules/ldvh-l2-specs-rules.md
  - ../.trae/rules/ldvh-l0-fact-model-rules.md
  - ../.trae/rules/ldvh-l0-rules.md
  - .trae/rules/ldvh-l1-rules.md
related_rules:
  - specs/03-Specs文档规范.md
  - specs/04-LDVH模型子文档规范.md
  - specs/11.01-Rules机制规范.md
  - specs/13-LDVH事实模型基础规范.md
  - specs/14-LDVH行动模型基础规范.md
human_gate:
  required: true
  confirmed_by: user
  confirmation_context: 用户确认按建议执行，建立普通 specs 文档最小机制关系声明，并区分事实模型和行动模型的 NN.01-NN.06 机制说明体系。
validation: |
  1. 已在 `specs/03-Specs文档规范.md` 新增机制关系声明规则和检查项。
  2. 已在 `specs/11.01-Rules机制规范.md` 对接 03 的分布式机制关系声明。
  3. 已更新相关 Rules 文件的规范来源、维护边界和关联说明。
  4. 已执行后续一致性检查和测试，结果见本次对话总结。
