    - specs/22-ADR-决策.md
    - specs/23-Pitfall-踩坑经验.md
    - specs/24-Study-研究报告.md
    - specs/07-事实源边界与Git追溯规范.md
    expected_output: 输出对象数量、状态分布、路径残留类型、校验错误类型和当前可安全处理范围；不得修改事实对象。
    status: done
    result_summary: |
      已建立基线：迁移前 ldvh-base 共 129 个文件，fact_validate 报告 349 errors、32 warnings；对象分布为 WorkCase 81、Spark 21、ADR 10、Pitfall 8、Study 9。错误主要为旧 v1 specs 路径导致的 PATH_NOT_FOUND 与 EVIDENCE_REF_PATH_NOT_FOUND。第一批确定性迁移后，全量 fact_validate 降为 0 errors、10 warnings，剩余 warning 均为既有 WORKCASE_REVIEW_ITEM_SELF_SIGNED。
    evidence_refs:
    - /tmp/ldvh-base-fact-validate.json
    - /tmp/ldvh-base-fact-validate-after2.json
    blocking_reason: null
