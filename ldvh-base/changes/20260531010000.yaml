scope:
  - specs/41-multi-role-thinking-多角色思考.md
  - specs/41.06-Contract.md
summary: 完成多角色角色契约对系统 Agent 和自定义 Agent 建议的独立性审查与补强
changes:
  - 在 41.06 中增加角色独立性原则，明确默认角色集合必须能脱离当前环境预装系统 Agent 独立使用
  - 明确系统 Agent、自定义 Agent 文件和外部推荐 Agent 清单只能作为角色视角、触发场景和审查维度的抽象素材
  - 明确不复制和维护外部 Agent 完整 Prompt，不把外部 Agent 名称作为运行前提
  - 扩展产品价值、用户体验、UI、前端、后端、API、数据模型、QA、验证证据、性能、安全、治理、AI 协作、工具链、文档、DevOps、WebTools 和复盘改进等角色的 focus、triggers 和 prompt_template
  - 在 41 主规范的角色定义原则中补充删除、禁用或未安装外部 Agent 不影响主上下文轻量模式
reason: 用户计划后续删除当前环境中已设置的系统 Agent，要求 LDVH 多角色思考机制吸收现有系统 Agent、自定义 Agent 建议和 AI 自身判断，确保用户安装产品后无需依赖预装 Agent 也可直接使用
impact:
  - LDVH 默认角色集合成为多角色思考的稳定能力来源
  - 当前环境系统 Agent 从依赖前提降级为可选执行容器或抽象素材
  - 主上下文轻量模式可在无外部 Agent 的环境中直接运行
  - 多系统子 Agent 模式只依赖当前可调用 Agent 容器和运行时角色参数注入
human_gate:
  status: confirmed_by_user
  reason: 用户明确要求进行审查并根据吸收内容丰富角色契约，属于规范内容补强
validation:
  status: done
  notes: 已检查 41.06 中角色独立性原则、默认角色集合补强内容，以及 41 主规范中角色机制不依赖外部 Agent 的边界说明
