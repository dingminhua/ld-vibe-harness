acceptance: |
  - [ ] 桌面端 ObjectDetail 页面布局改为三段式：左侧导航 + 中间主内容 + 右侧扩展阅读区
  - [ ] 点击 related_docs 条目时右侧面板预览 Markdown 文件内容
  - [ ] 点击 related_tasks/related_adrs 条目时右侧面板展示对象摘要卡片（ID、标题、状态）
  - [ ] 右侧面板支持关闭按钮，关闭后恢复双栏布局
  - [ ] 移动端（< 1024px）右侧扩展区降级为底部抽屉
  - [ ] 右侧面板不写入任何事实源，只读取已有数据
  - [ ] TypeScript 编译和 ESLint 通过
