title: 全量测试提速 — code-tests (pytest) 并行化与慢测试收敛
goal: 将 full-v4 全量测试 code-tests 步骤耗时从当前实测基线 270–444s 显著降低，同时保持全部既有测试用例与断言强度不变，使回归验证不再成为工作流瓶颈
scope: 覆盖：1) 现状测量（pytest collection errors 数量与原因、--durations=25 慢测试画像、子进程型测试耗时占比）；2) 引入 pytest-xdist 并行执行并处置共享状态/锁冲突；3) 收敛画像中 top-10 慢测试的可收敛项（真实 sleep、可批量子进程调用）；4) 以一次完整 full-v4 运行验证提速事实。排除：不改变 full-v4 固定 6 步计划结构（DAG 并行属规范级变更，另行议题）；不改 web 侧 4 个步骤；不承接 spark-0060 与 workcase-0088/0089 的耗时预估范围；不做增量/changed plan；不做 Git 提交。
priority: P2
success_criterion_definitions:
- criterion_id: criterion-1
  statement: 测试基线画像已登记：pytest collection errors 数量与原因分类、--durations=25 慢测试清单、子进程型测试（32 个文件）耗时占比
- criterion_id: criterion-2
  statement: code-tests 支持并行执行（pytest-xdist 或等效机制），并行模式下全部收集用例通过，共享状态冲突已处置或据实登记不可行原因
- criterion_id: criterion-3
  statement: 一次完整 full-v4 运行 passed，其 record 显示 code-tests 实测耗时较保守基线 270.8s（最近 passed 运行实测）下降 ≥40%，即 ≤162s；判定运行与基线同机进行，并在 item 结果中登记 pytest cache 冷/热状态以防预热缓存假性达标
- criterion_id: criterion-4
  statement: 提速未以删除或跳过既有测试用例为代价：collected 用例数 ≥1143、无测试文件删除、无新增 skip/xfail 标记、断言强度未放宽
work_items:
- item_id: item-1
  goal: 测量测试基线与慢测试画像
  expected_result: collection errors 数量与原因分类（含对 spark-0060 所记 76 个的复验结论）、--durations=25 慢测试清单、子进程型测试耗时占比登记到 item 结果
  status: completed
  approach_summary: 运行 pytest --collect-only 复验 collection errors 现状，并经 tools/run_full_tests.py 耐久运行取得 --durations 画像（规避交互超时）
  result_summary: 基线画像已取得（2026-08-09，与历史基线同机）：① collection errors=0，1610 用例 0.57s 收集完成，spark-0060 所记 76 个 collection errors 已不成立（无需修复）；② 全量运行 1597 passed / 13 skipped / 369.89s，slowest-25 画像显示最慢用例 12.27s（git_hooks/test_commit_msg.py），top-25 全部位于 git_hooks 与 helper/test_commit_precheck_operation.py，均为真实 Git 操作与 CLI subprocess 型测试，无单一离群点、无 time.sleep 主导项；③ 32 个测试文件使用 subprocess 拉起 CLI，耗时呈宽尾分布（2.9–12.3s），提速主路径为 xdist 并行而非单点收敛。pytest cache 状态：本次为冷启动首次画像运行。证据：.ldvh-test-runs/wc0090-item1-durations.log；备注：实际 collected=1610 高于创建时静态统计的 1143（参数化展开），criterion-4 的 ≥1143 护栏成立。
- item_id: item-2
  goal: 引入 pytest-xdist 并行执行
  expected_result: requirements-dev.txt 增加 pytest-xdist，-n auto 并行运行全部测试通过，共享状态冲突（临时目录、锁、固定路径）已隔离处置
  status: completed
  depends_on:
  - item-1
  approach_summary: 先小范围验证 worker 隔离，再全量并行；冲突点逐一隔离为 per-worker 资源；对 -n 取值做实测比较并在 item 结果中登记选定 -n 的实测依据（承接 subprocess 型测试叠加的 CPU 过订阅风险）
  result_summary: pytest-xdist 3.8.0 已引入并默认启用：requirements-dev.txt 增加 pytest-xdist>=3.8,<4，pyproject.toml addopts 增加 -n auto，普通 pytest 调用与 full-v4 code-tests 步骤均自动并行。冲突验证：最重的真实 Git 型 git_hooks 文件 -n 2 先行验证 14 passed 无共享状态冲突；全量并行 1597 passed / 13 skipped，与串行基线 1597/13 精确一致，零 flaky。-n 实测比较（同机、10 核）：-n auto(10 worker) 80.34s，-n 4 114.10s，未见 CPU 过订阅退化（测试为 subprocess/IO 等待主导），选定 -n auto。相对串行 369.89s 提速 4.6 倍，已低于 criterion-3 的 ≤162s 目标。证据：.ldvh-test-runs/wc0090-item2-xdist-auto.log、wc0090-item2-xdist-n4.log
- item_id: item-3
  goal: 收敛 top-10 慢测试的可收敛项
  expected_result: 画像 top-10 慢测试中的真实 sleep 与可批量子进程调用已收敛，不可收敛项据实登记理由
  status: completed
  depends_on:
  - item-1
  approach_summary: 逐项判断慢根因，只收敛不改变被测行为语义的部分
  result_summary: top-10 慢测试逐项处置完成（依据 item-1 画像 + 独立只读分析）：6 项可收敛已收敛——git_hooks 三项（independent_clone 8.22→0.22s、real_git_commit 5.62→2.52s、inspect_and_uninstall 4.02→0.46s）以 render_commit_msg_hook 直写字节级一致 Hook 替换纯 fixture 性质的 install（字节一致性由 uninstall 字节绑定测试反向验证）；helper 三项（capability_profiles 4.34→1.40s、mechanical_failure 4.28→1.43s、empty_candidate 3.87→1.39s）memoize 进程内重复的规则源解析（patch 点在消费方共享的 inspect_repository，与分析方案的偏差已据实记录并验证语义不变）。4 项不可收敛据实登记：test_install_uses_common_dir(12.27s)、migrates_legacy_override(5.29s)、effective_directory_failure(4.01s)、second_legacy_unset_failure(3.92s)——其测试目标就是 install/Hook 真实管线行为（含 preflight 与迁移回滚），每次 CLI 拉起都是被测对象，唯一提速路径是产品侧规则源解析缓存（870ms/次×每次调用），超出本 WC 范围，已登记为后续候选方向。验证：三文件 41 passed（xdist），Controller 独立抽查 git_hooks 14 passed 且收敛项全部跌出 top-5；无删除用例、无新增 skip/xfail、改动限 code/tests 三文件。
- item_id: item-4
  goal: 全量回归验证提速事实
  expected_result: 一次 full-v4 运行 passed，record 实测 code-tests ≤162s 且 collected 数 ≥1143
  status: completed
  depends_on:
  - item-2
  - item-3
  approach_summary: 经 tools/run_full_tests.py start/wait 完成一次完整 full-v4 运行并回读 record；与基线同机判定，登记 pytest cache 冷/热状态
  result_summary: full-v4 全量回归验证通过：run-8760e87e901d4dea874c970fd327155b 六步全部 passed，record 实测 code-lint 0.1s / code-tests 49.5s / fact-integrity 1.4s / web-typecheck 4.5s / web-tests 5.4s / web-build 8.1s，全程约 69s。criterion-3 达成：code-tests 49.5s ≤ 162s，较保守基线 270.8s 下降 81.7%（同机判定；pytest cache 为当日热状态，对照 item-1 当日冷启动画像 369.89s 亦下降 86.6%）。criterion-4 达成：1597 passed / 13 skipped 与串行基线精确一致（collected 1610 ≥ 1143），git diff 仅 3 个测试文件修改 + requirements-dev.txt + pyproject.toml，无测试文件删除、无新增 skip/xfail。证据：.ldvh-test-runs/run-8760e87e901d4dea874c970fd327155b/record.json 与 output.log
