title: Helper 只读交互优化
status: open
priority: P2
intent: 承接 spark-0019 路由的模板内容重复传输问题（read-action-template-content 同时返回 content 与 source_content），以及更广泛的 Helper 只读操作（read-action-template-candidates、read-fact-objects、find-fact-object-candidates 等）的窄输出、自解释性和 AI 可消费性优化。后续需判断哪些只读操作的输出可以收缩为正常路径最窄定义、完整来源按需展开，以及失败诊断能否给出结构化修正提示。
summary: "## 来源\n\n- 从 spark-0019 路由：read-action-template-content 正常成功响应同时返回模板定义 content 与包含同一内容的完整 source_content，造成规则重复传输、输出膨胀和上下文占用。\n- 更广泛的只读操作也存在类似问题：成功路径输出过多无关信息，失败路径缺少自解释修正提示。\n\n## 相关 Study\n\n- study-0030 建议一：先建设双源共用的只读编辑辅助（精确局部读取、候选 diff、范围保持证据、stale 反馈），不改变写权限。\n\n## 范围\n\n- 只影响 Helper 只读操作的输出契约与 AI 可消费性，不改变写操作、Git 提交或校验逻辑。\n- 正常成功路径只返回完成行动所需的最窄定义，完整来源保留为按需展开。\n- 不包括规范源或事实源的直接编辑能力（由 study-0030 另行评估）。\n\n## 排除\n\n- 不改变写操作（create、update、close、correct）的契约或校验。\n- 不改变事实对象的 Schema 或字段定义。\n- 不引入新的公开操作、持久缓存或第二权威。\n\n## 当前承接状态\n\n- 失败诊断结构化提示部分已由 WorkCase（workcase-01KZYRQF21F9V87EFJKQZA8P0Z「Helper 只读操作失败诊断结构化提示」，承接自本 Spark）完成：只读操作 invalid_request 类响应在 diagnostics[0].details.hints 提供 missing_required_inputs / allowed_inputs / minimal_examples，写操作与其它失败路径不变；helper 全量回归 533 passed / 5 skipped。\n- source_content 去重与成功路径窄输出契约收缩（06 §9.6 契约变更）仍为本 Spark 待承接部分：read-action-template-content 成功响应仍同时返回 content 与完整 source_content，造成重复传输与输出膨胀；需独立规范修订流程后由新 WorkCase 承接。"
