title: 建立 WorkCase 两次 Human 确认与执行授权包闭环
status: open
summary: 完整 completed 关闭提案已形成，正在等待 Gate2。
priority: P1
goal: 建立 WorkCase 单次运行最多两次由系统主动请求的 Human 确认契约：第一次统一确认需求、计划与完整执行授权包，之后自动推进执行、Controller 自检、独立 subagent 结果复核与关闭准备；第二次只确认关闭分类及剩余责任处置。超出授权包的行动不执行，也不触发第三次确认，而是自动安全收敛到关闭确认。
scope: 覆盖 Specs 06、08、21 及事实字段/机械校验附件，行动模板 30、31、32、34 与必要的领域授权消费衔接，WorkCase 批准基线、真实 Human 来源证明、状态机、Helper/Code 校验，Web 完整 Gate1 材料与只含 plan/closure 的待决定入口，以及活动 WorkCase 0008、0013、0015、0017、0019 的一次性精确迁移和相关回归测试。明确替换 0019 在 21/34 中遗留的执行期 plan_revising 后再次批准分支，但不回写或重开 0017、0018 的历史结果。排除再次修改 00、全局权限 token、动作白名单或统一授权枚举，排除宣称存在自动调度/spawn 运行时，排除自动授权未知或超界高风险行动，排除改写 closed WorkCase、保留旧形状运行时兼容层、无关脏工作区变化及未经当前 Gate1 逐项列明的 push、PR、发布或外部副作用。
success_criterion_definitions:
- criterion_id: criterion-two-human-gates
  statement: WorkCase 单次运行只有 human_plan_confirming 与 human_closure_confirming 两个系统主动请求 Human 决定的关口；Gate1 后禁止再次进入计划确认或因 PlanDelta 再批准，Gate2 只可原子关闭，Gate1 未批准或发生实质超界时也能无第三次确认地安全收敛。
- criterion_id: criterion-approval-baseline
  statement: Gate1 材料完整呈现 goal、scope、成功标准、工作项、方法、验证、委派与独立性、高影响动作、已知风险、保护措施、明确排除及超界处置；批准事实绑定冻结基线 fingerprint 与真实 Human 来源，不补造授权证明。
- criterion_id: criterion-safe-convergence
  statement: 授权包内的实施调整、重试和修复经 fresh 独立复核后可自动继续；超出授权包或出现未知高风险时不执行相应动作，将受影响工作项据实取消并保留已形成事实，自动进入 Controller 自检、独立结果复核与关闭链。
- criterion_id: criterion-template-consumption
  statement: 行动模板 30、31、32、34 及实际需要的领域衔接可以直接消费当前 WorkCase Gate1 中逐项列明的授权与委派边界，不因进入模板步骤或切换 subagent 再次请求 Human，也不推定未列明行动获准。
- criterion_id: criterion-mechanical-enforcement
  statement: Code 与 Helper 对批准基线 fingerprint、真实来源、字段结构和合法状态转换执行零写入机械校验，并能机械阻止第三次 Human 等待；实现不宣称 Code 可以判断任意自然语言行动是否在授权包内。
- criterion_id: criterion-web-two-decisions
  statement: Web 详情、Gate1 Card、复制决定摘要与 Cognition 收件箱共同呈现完整批准材料和当前授权依据；收件箱只包含 plan 与 closure 两类待决定事项，blocked 仍在对象详情如实呈现但不成为第三类 Human 决定。
- criterion_id: criterion-migration-and-tests
  statement: 活动 WorkCase 0008、0013、0015、0017、0019 按所处阶段一次性分类迁移：未获 Gate1 者形成新材料，已执行但缺授权证明者不补造也不继续越权执行，结果/关闭链对象只完成收敛，closed 对象零改写；Specs、Code、Helper、模板、Web 与端到端回归测试全部通过。
phase: human_closure_confirming
plan_version: 1
work_items:
- item_id: item-01
