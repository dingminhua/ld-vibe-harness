id: spark-0034
type: spark
title: Windows 系统支持：跨平台运行链路与安装验收缺口
status: pending
created: '2026-06-27T02:00:11.365803'
updated: '2026-06-27T02:02:00+08:00'
description: |
  Human 提出“如果要让 LDVH 支持 Windows 系统需要做哪些事情”，本 Spark 记录 Windows 支持议题，避免把它混入已有多环境 Hook 兼容或运行时部署主线中。

  当前 LDVH 的 Code、Rules、Hook、Git hook、Web 与文档入口大体以 macOS / Unix-like 环境为隐含基线：README 使用 `python3`、bash 风格命令和 `npm --prefix web`；`code/install_git_hooks.py` 生成 `#!/bin/sh` 的 native Git `commit-msg` hook；`code/hook_dispatch.py`、管辖项目判定和 receipt 逻辑依赖 `Path`、`os.sep`、home 目录与 Git 路径解析；Web 启动还存在 `web/restart.sh` 等 shell 入口。Windows 支持不能只理解为“Python 能跑”，而应覆盖从安装、入口触发、路径判定、提交门禁、Web 开发、测试到文档验收的完整链路。

  后续若转为 WorkCase，应至少拆解并验证以下事项：

  1. **Python / CLI 入口跨平台化**：明确 Windows 上使用 `py -3`、`python` 还是 `python3`；README、Rules、hooks registry、等价手动检查命令和测试脚本不得只给 Unix 命令。需要确认 `code/bootstrap_code.py`、`code/specs_validate.py`、`code/fact_validate.py`、`code/hook_dispatch.py` 在 Windows 终端、PowerShell 和 Git Bash 下的调用方式。
  2. **路径语义与管辖判定**：验证 Windows drive letter、反斜杠、大小写、UNC 路径、Git worktree common-dir、软链接 / junction、`Path.resolve()` 异常和 `os.sep` 前缀判断是否会影响 governed project 命中、target-first 判定和 receipt 匹配。路径比较应形成可测试的规范化函数，而不是散落在各处的字符串拼接。
  3. **Git hook 安装与执行**：当前 `install_git_hooks.py` 写入 POSIX shell `commit-msg`。Windows 上 Git for Windows 通常可执行 shell hook，但 PowerShell / cmd / 企业 Git 环境未必一致。需要确认 hook 文件换行、可执行位语义、`/bin/sh` 可用性、消息文件路径带空格、`python3` 命令存在性，以及是否需要生成 `.cmd` / PowerShell 或通过 Git Bash 固定执行的等价入口。
  4. **AI Hook / 插件入口**：Codex、WorkBuddy、Claude Code 等插件 Hook 在 Windows 上的命令、环境变量、`PLUGIN_ROOT` / `PLUGIN_DATA`、stdin JSON、cwd、信任机制和阻断语义需要独立验证。不能把 macOS 的插件安装成功直接推导为 Windows 成功。
  5. **Rules 路径自觉消费**：无 AI Hook 或 Hook 不稳定时，Windows 文档应给出 PowerShell / cmd 可执行的 `session-start`、`acknowledge-read-plan`、`pre-tool-use`、`git.commit-msg` 等等价命令，保证 Trae 等环境仍能走同一 Runtime Protocol。
  6. **Web / npm 开发链路**：确认 `npm install`、`npm run check`、`npm run test:web:api`、`npm run web:restart` 或替代启动方式在 Windows 可用。`web/restart.sh` 是 Unix shell 脚本，Windows 需要 npm 脚本、Node 脚本或明确 Git Bash 依赖，不能把清端口和重启能力只放在 `.sh` 中。
  7. **测试矩阵与 CI**：增加 Windows 验证入口，至少覆盖 Python 单测、fact/spec 校验、hook dispatcher CLI、Git hook 渲染或安装 dry-run、Web API 测试和路径规范化单测。若引入 GitHub Actions，应加入 `windows-latest`，并明确哪些检查是必须通过、哪些是环境能力探测。
  8. **安装与文档验收**：README、`specs/32`、`specs/33`、`rules/LDVH-RUNTIME-PROTOCOL.md`、`hooks/ldvh-hooks.yaml` 中的命令示例和环境要求应区分 macOS/Linux 与 Windows。文档不应只说“支持 Windows”，而应列出最低依赖、推荐 shell、已验证 AI 环境、已知限制和等价手动步骤。

  本 Spark 的核心判断是：Windows 支持应被视为一次跨平台运行链路验收，而不是单点兼容修复。它与 spark-0032 的“多环境 Hook 接入兼容”相关，但关注维度不同：0031 关注 AI 协作环境能力差异，本 Spark 关注操作系统层的路径、shell、安装、Git 与测试差异。它也与 spark-0033 相关，因为生产运行链路若要可靠，最终应证明同一套 Runtime Protocol 在 Windows 上也可被 Hook 路径或 Rules 路径消费。
