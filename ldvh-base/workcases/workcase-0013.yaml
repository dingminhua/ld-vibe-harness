title: 环境安装、部署、接入与验证契约收束
goal: 将环境安装、部署、接入与验证的职责边界，以及逐事件验证交还契约收束到当前规则源和入口文档， 使接入行动不能把静态、直调或 hydrate 等有限观察写成真实环境接入通过。
scope: 覆盖 specs/09、33 及 09.Att.01、README 和直接文档测试引用：将 33 迁移为 specs/33-环境安装、部署、接入与验证行动模板.md，保持 spec_key/template_key；在 09 定义安装/部署/接入/验证四层与环境专属事件表责任， 在 33 定义每次行动的逐事件矩阵和最终交还；更新全部直接路径/标题断言。矩阵是一次行动交还，不是永久环境状态、事实对象或跨厂商注册表。 排除生产 Code/CLI/Doctor/Helper/Git Gate、ZCode 或其他 adapter/manifest/cache/data、实际环境配置、运行时诊断/启动、 升级/重装/信任/重启、填写具体事件表和更新 Spark/Pitfall。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 09 明确安装、部署、接入、验证四层和环境专属事件表责任；新增 manifest、script 或 adapter 仍分流至独立 Code 计划。
- criterion_id: criterion-02
  statement: 33 要求一次行动对本接入单元承接的每个事件交还矩阵行，覆盖环境/版本/单元、来源事件/范围、静态部署、核心直调、真实事件、 主风险、证据/时间、未验证项及回滚或不适用依据；只有适用层、成功和风险证据完整时才可写通过。
- criterion_id: criterion-03
  statement: README 与 09.Att.01 引导新环境执行者先读取规则、形成矩阵并等待所需授权，不虚构环境接入命令或通过结论。
- criterion_id: criterion-04
  statement: 33 的标题和路径、规范内 canonical path、所有直接引用及文档测试一致，稳定 spec_key/template_key 保持不变。
- criterion_id: criterion-05
  statement: 只运行规则和文档范围测试；不把测试通过表述为环境接入通过，并保留既有无关 Working Tree 差异。
success_criterion_results:
- criterion_id: criterion-01
  outcome: satisfied
  summary: 09 §6.1 明确安装、部署、接入、验证四层，并明确 AI 生命周期所用环境 Hook 采用目标环境原生用户级插件，具体实现仍由环境来源定义。
- criterion_id: criterion-02
  outcome: satisfied
  summary: 33 的逐事件矩阵与验证边界保持；新增环境 Hook 限制调查和 Human 受限操作请求，避免 AI 仅报告 unverified 而不交还 Human 可执行动作。
- criterion_id: criterion-03
  outcome: satisfied
  summary: README 已作为 Human 快速上手入口保留 Web 启动说明和可复制提示；09.Att.01 继续引导新环境先读取规则、确认来源声明事件、 形成矩阵并取得 Human 授权；AI 的详细执行边界由 33 承接，且不再预设任何具体厂商插件结构。
- criterion_id: criterion-04
  outcome: satisfied
  summary: 33 的新标题、canonical path、README、附件和测试引用仍一致，稳定 spec_key/template_key 未改变。
- criterion_id: criterion-05
  outcome: satisfied
  summary: 直接文档测试与差异检查的既有结果保持；字段登记数量漂移已由 workcase-0020 的当前字段登记与测试基线收敛，最新 code/tests/specs 为 131 passed，未将其表述为真实环境接入通过。
result_summary: 09 已形成安装、部署、接入、验证四层与环境专属事件责任边界；33 已迁移到新标题和路径，并要求逐事件验证矩阵、 环境 Hook 限制调查及 Human 受限操作请求；README 与 09.Att.01 已同步入口。未新增 adapter、命令、环境状态或事实对象。
validation_summary: 既有直接文档测试 3 passed 与 git diff --check 结果保留；2026-07-30 复跑当前 code/tests/specs 为 131 passed，原字段登记数量阻塞已解除。没有执行或声称任何真实环境事件验证，也没有以迁移继续实施新动作。
status: closed
closure_outcome: completed
