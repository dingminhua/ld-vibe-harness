          result:
            status: fail
            summary: |
              整体方向成立，但进入执行前必须补 WorkCase 字段契约、结果复核策略、knowledge-map 删除 Human Gate 前置、Rules 同步审查输入和跨项目读取措辞收窄。
            key_findings:
              - execution_items 缺少 result_summary 和 evidence_refs。
              - result_review.review_policy 为空，不符合新建 WorkCase 草案应预置结果复核视角的要求。
              - 删除 knowledge-map 的 Human Gate 前置条件不够硬；删除/重命名 Code 命令、固定 Rules/Runtime 入口或关键回归入口必须先完成影响扫描、等价能力验证、测试、Rules 同步审查和 Human Gate。
              - “所有管辖项目事实源默认纳入可查询/可召回/可影响判断范围”应收窄为默认可发现/可按条件查询，不是默认读取或注入。
              - 迁移影响面缺少 specs/30 Rules 入口同步审查作为明确输入。
            required_changes:
