- criterion_id: criterion-spec-python-exact-equality
  statement: 测试解析所得 7 个 open phase 映射与 PHASE_PRESENTATION、closed 行与 CLOSED_PRESENTATION 逐键逐值完全相等；解析器仅位于测试侧且不得被 production Code 导入或复用，21 继续是唯一语义权威，Python 继续是唯一运行时投影实现点。
- criterion_id: criterion-no-duplicate-behavior-model
  statement: 本增量不在新测试中重建 blocked overlay、Gate 2 禁语、unresolved 或 phase 转换表；这些行为只由既有投影与 Controller tests 继续验证，不新增第二份状态或话术成立条件。
- criterion_id: criterion-generated-web-chain-preserved
  statement: 既有 test_generated_web_contract_matches_python_renderer 继续证明 generated TypeScript 与 Python renderer 字节一致；不新增或修改 Web test，不手改 generated contract，不让 TypeScript 或 Web 成为另一投影权威。
- criterion_id: criterion-validation-review-and-isolation
  statement: Code Implementation Plan、目标 source-contract test、既有 WorkCase presentation/Controller/generated-contract tests、git diff --check、路径白名单、WorkCase 精确回读、全库事实完整性、受保护 dirty 哈希隔离和独立只读结果复核全部完成；若发现规范表无法机械唯一定位或需生产行为/Specs 变更，则停止并返回 Human。
