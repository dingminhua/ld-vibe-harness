goal: 使 LDVH V4 web/ 在 LDVH 规范符合性与行业工程规范两个维度达到可信基线，消除已知明文违规，并建立防止回归的验证。
scope: 覆盖 i18n 合规、事实读取语义（空列表掩盖与治理 YAML
  自行解析）、五类事实对象统一读取路径（直读本地文件机械映射、不校验、缺失标注）、巨石组件拆分、api/src 边界、tsconfig
  双配置、vite.config 清理。范围限于
  web/src、web/api、web/tests、web/tsconfig*、web/vite.config.ts。明确排除：不改动 Python 端
  ldvh 包与 web_machine 协议定义；不改动 specs/ 任何规范；不新增 Web 写入能力（create-spark 仍走既有 Python
  桥与 loopback 边界）；不做与整改无关的 UI 重设计；不做 tsconfig strict（留作 followup）；Git
  日志(changelog)读取保留现状走 git 子进程。统一读取原则：事实对象 YAML/MD 由 Web 直读机械映射；治理/协议类 YAML 仍经
  Code 受控路径；Git 日志走 git 子进程。
