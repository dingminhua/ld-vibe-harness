status: closed
title: 将 LDVH 迁移为源码唯一接入并部署 common-dir Git Gate
goal: 完成从 Python distribution 接入模型到源码仓库唯一能力本体的迁移，使环境接入、管辖配置核验、common-dir Git Hook 部署与验证四项工作形成可执行闭环；六个源码 surface、源码 Doctor 和第三方依赖准备形成单一交付链，并在不中断当前 Git Gate 的前提下退役 packaging 与 installed snapshot。
scope: 写入范围限定为当前 ld-vibe-harness-v4 worktree 内与本次迁移直接相关的 specs、attachments、Code、tests、tools、仓内 README 与仓内 Skill 源文件，以及 workcase-0055 自身生命周期；实现单一源码 dispatcher 或等价稳定源码入口，覆盖 helper、work-context、context-recovery、doctor、git-commit-msg、git-hook 六个 surface；修复 work-context 标题漂移；将 Doctor 改为源码身份；将 Hook manager 改为 common-dir；迁移当前 common-dir 下可证明由 LDVH 管理的旧 worktree-local Hook；改造 native Windows 验证为第三方依赖准备加源码入口；退役 setup/build/snapshot 与 LDVH 本体 pip 路径。排除已部署到用户环境的 Skill、未知用户 Hook 或配置、独立 clone、管辖配置 writer、通用 Skill installer、push、PR、发布、外部消息、Git commit、其它事实对象、历史事实改写、其它项目及无关 worktree。
success_criterion_definitions:
- criterion_id: criterion-source-only-rule-model
  statement: 当前 specs 与授权附件不再把 installed_release_snapshot 或 Python distribution 作为活跃规则源、能力本体或默认交付载体，并明确只允许为第三方依赖准备使用依赖工具，禁止 pip install .、pip install -e .、wheel/sdist build 与发布。
- criterion_id: criterion-six-source-surfaces
  statement: helper、work-context、context-recovery、doctor、git-commit-msg、git-hook 六个 surface 均有稳定、可验证且绑定当前源码仓库的调用形态，不受 cwd、PATH 或已安装 LDVH 副本误导。
- criterion_id: criterion-governance-config-validation
  statement: 当前仓库的管辖配置可由源码入口只读核验项目标识、规则源与仓库绑定；缺失、漂移或歧义均 fail-closed，且不引入配置 writer。
- criterion_id: criterion-source-doctor
  statement: Doctor 使用源码身份、revision、工作树状态、源码 surface 和管辖解析形成诊断，不依赖 distribution metadata 或同目录 console scripts。
- criterion_id: criterion-common-dir-hook
  statement: Git Hook manager 从 actual worktree 解析 common-dir，一次部署覆盖当前 common-dir 下主 worktree、全部可安全验证的既有 linked worktree，并以受控临时 linked worktree证明后续 worktree 自动覆盖；独立 clone 明确不受影响；发现未知 core.hooksPath、未知 Hook 文件或来源不明覆盖时 fail-closed 且零写入。
- criterion_id: criterion-gate-continuity
  statement: 新 common-dir Hook 在 prepare、语法与所有权校验以及真实 allow/block 验证完成前不切换或删除旧 Hook；验证无需创建业务提交，可使用真实 Hook 入口和受控临时 message、index、worktree 证明各事件绑定自身 worktree、Index 与 message；仅删除有 LDVH 所有权证据的旧覆盖或资产。
- criterion_id: criterion-packaging-retired
  statement: packaging、installed snapshot、LDVH 本体 pip 安装与 console-script 默认路径已从当前产品实现和测试中退役；native Windows 验证资产保留并改为第三方依赖准备加源码入口，Windows 未验证范围如实保留。
- criterion_id: criterion-validation-and-review
  statement: 适用 specs、unit、integration 与完整回归验证通过，git diff 检查无误，workcase-0055 通过 Helper 精确回读并完成独立结果复核；未发生未授权外部动作或 Git 提交。
success_criterion_results:
- criterion_id: criterion-source-only-rule-model
  outcome: satisfied
  summary: 现行 01/04/09 与授权附件只承认 working_tree 源码规则源；LDVH 本体 pip、wheel/sdist 与 installed snapshot 已从活跃实现和测试退役，requirements 只准备第三方依赖。
- criterion_id: criterion-six-source-surfaces
  outcome: satisfied
  summary: 根目录 ldvh dispatcher 提供 helper、work-context、context-recovery、doctor、git-commit-msg、git-hook 六个源码 surface；Doctor 当次验证 6/6 available。
- criterion_id: criterion-governance-config-validation
  outcome: satisfied
  summary: 源码 Doctor 经 Helper 回读 workspace 配置 valid、scope governed_single、governed_project_id=ldvh；未引入配置 writer。
- criterion_id: criterion-source-doctor
  outcome: satisfied
  summary: Doctor 当次以 v4 源码根、Git revision、dirty 工作树、源码 surface 与管辖解析形成 ready 结果，不依赖 distribution metadata。
- criterion_id: criterion-common-dir-hook
  outcome: satisfied
  summary: 新 Hook 位于共享 common-dir；6 个 live worktree 无 core.hooksPath 覆盖且逐个 inspect=managed。后续 linked worktree 与独立 clone 边界由 12 项 manager 回归覆盖；其他项目使用不同 common-dir。
- criterion_id: criterion-gate-continuity
  outcome: satisfied
  summary: 失效旧 common Hook 已按原 hash 备份，v3 旧 Hook原样保留；新 Hook 带 digest 所有权标记。v2、v3、v4 使用临时 Index/message 的真实事件均阻断非法消息并放行合法消息，未创建 commit。
- criterion_id: criterion-packaging-retired
  outcome: satisfied
  summary: setup、snapshot 与发行生命周期路径已退役；Windows runner 改为第三方依赖加源码入口。当前 macOS 未冒充 Windows 实机，10 项 native Windows 验证保持 skipped/unverified。
- criterion_id: criterion-validation-and-review
  outcome: satisfied
  summary: 1440 项 Python 测试可收集，各目录可运行分片通过，10 项 native Windows 跳过；变更相关 Web 类型检查与 12 项 API 测试通过，Hook 12 项与 Reviewer 相关回归 50 项通过。Ruff、format、diff check、Helper 回读及独立审核均通过；未提交 Git。
result_summary: LDVH 已完成从 distribution/installed snapshot 到源码仓库唯一能力本体的迁移；环境接入、管辖配置核验、common-dir Git Hook 部署与验证四项工作形成闭环。共享 common-dir 的 6 个 live worktree 现统一使用调用 v4/ldvh 的 digest-owned commit-msg Gate；旧 common Hook 与 v3 Hook均保留为不生效审计/回滚资产，其他 Git 仓库未被改变。
validation_summary: 源码 Doctor status=ready、6/6 surfaces available、配置 valid/governed_single；6 个 live worktree inspect=managed 且无 core.hooksPath；v2/v3/v4 真实 Hook block_rc=1、allow_rc=0。Hook 回归 12 passed，独立审核相关回归 50 passed，Ruff/format/diff check 通过；Python 共收集 1440 项，10 项 native Windows 保持 skipped。变更相关 Web check 与 12 项 API 测试通过；完整 Web 套件另有 7 项既有且与本次改动无关的 UI/docs contract 失败，未被误报为本次通过。
