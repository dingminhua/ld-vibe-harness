status: closed
title: 收敛 WorkCase 独立审核为 Subagent 与显式 same-AI 兜底
goal: 将 LDVH 的 WorkCase 审核机制收敛为“Subagent 是唯一独立审核方式；仅当 Controller 在自身上下文完成工具发现并实际无法创建 Subagent 时，披露后直接使用 same-AI 切换只读视角”，并移除 Orca、collaboration Worker、三层路由、平台模型选择及 09.Att.03/04/05 平台卡。
scope: 包含：修订与 WorkCase 审核相关的当前规范、行动模板、字段登记和环境接入附件；将 09.Att.03/04/05 退出当前规则源并清理当前引用；调整 Python Code/Helper 的 WorkCase Schema、校验、projection、兼容边界及测试；调整 Web API、类型、详情呈现与中英文文案；清理当前代码计划和文档中的 Orca/Worker 审核路由。明确由 Controller 基于自身完整工具面和实际 spawn 结果判断 Subagent 能力，不采用 Subagent 对 Controller 能力的结论。保留历史 closed WorkCase 的可读性与机械有效性，不回写历史对象。完成后由 Helper 更新源 Spark 为 implemented。排除：Git commit/push、发布、插件或环境部署、外部网络操作、修改无关事实对象、重写历史 closed WorkCase。
success_criterion_definitions:
- criterion_id: criterion-1
  statement: 当前规则源一致规定 Subagent 是唯一独立审核方式；Controller 只能依据自身当前会话的完整工具发现与实际 spawn 结果判断能力，Subagent 对自身或 Controller 能力的结论不得作为不可创建证据；创建失败时只需向 Human 披露保证差距即可直接使用 same-ai-switched-role-read-only，不新增 Human Gate，并记录 actual_method、Controller 证据、披露内容与披露时点。
- criterion_id: criterion-2
  statement: 当前规则源与行动模板不再包含 collaboration Worker、Orca Worker、三层 Reviewer 路由、平台模型目录/选择/映射责任；09.Att.03、09.Att.04、09.Att.05 已按规范退出，全部当前引用已清理或改为平台无关边界。
- criterion_id: criterion-3
  statement: WorkCase 当前 Schema、字段登记、Code/Helper 校验与 canonical projection 只支持新建/活动对象使用 subagent-read-only 或满足披露条件的 same-ai-switched-role-read-only；same-AI 最小记录包含 actual_method、Controller 自身工具发现/实际创建失败证据、向 Human 披露的保证差距与披露时点；既有历史 closed WorkCase 的旧枚举、projection、引用可读性与机械有效性保持，相关正反测试覆盖 Controller/子上下文能力边界和 fallback 条件。
- criterion_id: criterion-4
  statement: Web API、共享类型、详情呈现和中英文文案不再展示或要求 Worker/Orca、模型选择、三层 preferred/fallback 路由；实际审核方法与 same-AI 保证差距仍能正确呈现。
- criterion_id: criterion-5
  statement: 范围匹配的规范、Python、Web 测试与 git diff --check 通过，且当前 worktree 的 LDVH 机械检查与事实完整性检查均达到各自完整成功状态。
- criterion_id: criterion-6
  statement: 源 Spark 01M03J02PGEST9HHF4YKW09M0V 在实现和验证完成后由 Helper 更新为 implemented，并准确记录最终职责边界；不回写或改写历史 closed WorkCase。
success_criterion_results:
- criterion_id: criterion-1
  outcome: satisfied
  summary: 当前规则明确 Subagent 是唯一独立审核方式；Controller 自行发现工具并实际尝试创建，失败时披露后直接 same-AI，记录要求完整。
- criterion_id: criterion-2
  outcome: satisfied
  summary: 当前规则和行动模板已移除旧的多层审核、预冻结降级边界与平台模型责任；09.Att.03/04/05 已退出且当前引用清理完成。
- criterion_id: criterion-3
  outcome: satisfied
  summary: Schema、字段登记、校验与 canonical projection 已支持两态新语义；完整历史事实库机械检查通过，既有 closed 对象保持可读有效。
- criterion_id: criterion-4
  outcome: satisfied
  summary: Web API、共享类型、详情、列表与中英文文案已收敛，只呈现 Subagent 与 same-AI 披露边界。
- criterion_id: criterion-5
  outcome: satisfied
  summary: 范围 Python 回归 517 项、TypeScript check、WorkCase Web 合约测试 50 项、git diff 检查、当前规则源检查和事实完整性检查均通过。
- criterion_id: criterion-6
  outcome: satisfied
  summary: 源 Spark 已经 Helper CAS 更新并精确回读为 implemented，历史 closed WorkCase 未被回写。
result_summary: 已把 LDVH 的 WorkCase 审核机制收敛为 Subagent 唯一独立审核与披露后 same-AI 兜底；Controller 自主判断工具能力，宿主负责模型选择；旧的多层审核、预冻结降级边界和三张平台卡已退出当前机制，Code 与 Web 同步完成。
validation_summary: 修正后范围 Python 回归 518 项通过；TypeScript 构建检查通过；三组 WorkCase Web 合约测试共 60 项通过；git diff --check 通过；ldvh 当前规则源检查为 passed，完整事实库 265 个对象检查为 complete。未执行 Git commit/push、发布或外部网络验证，均在批准排除范围内。
closure_outcome: completed
disposition_summary: 获批范围内的规则、Code、Web、验证与源 Spark 处置均已完成；独立 Subagent 结果复核通过，没有需要路由或接受停止的剩余责任。
