title: 无 Hook 执行记录被误写为运行时未执行
status: retired
applicability: 适用于调查 Hook、插件或 adapter 时，日志只显示注册信息而没有 fired、completed、failed 等可见执行记录的场景；不适用于已有直接运行时追踪、错误码或其它能够确认实际执行阶段的场景。
validation_summary: 2026-07-24 对 pitfall-0001 的实际 ZCode 回读发现，原说明把“没有可见 hook 执行记录”写成“运行时从未尝试执行”。复核后只能确认日志未交付可见记录，无法区分未尝试执行、执行后脚本失败或执行结果未被处理；相应内容已改写为观察、当前判断和未知机制三部分。该复核不验证 ZCode 内部失败环节本身。
symptoms: 调查说明把日志中没有 hook fired、completed 或 failed 记录，直接表述为 Hook 运行时“从未尝试执行”。
trigger_conditions: Hook 的可观察性只包含注册信息和缺失的执行记录，缺少能够区分调用、脚本失败或结果处理阶段的直接运行时信息。
root_cause: 已观察事实是日志没有可见执行记录；当前根因判断是把“未观察到记录”错误提升为“未发生执行”的结论，混淆了观察范围与运行时机制。未知的是 ZCode 在该场景中实际停在何一内部阶段。
resolution: 处理时将说明拆为已观察记录、当前有界判断和未知机制；只有存在直接运行时信息时才声明具体执行阶段。成功信号是读者能够从对象文本区分三者，不再把无日志当作未执行。若已有直接追踪信息，则按该信息继续调查，不套用本经验。
avoidance: 复用前先核对日志、追踪和错误码实际覆盖的范围。缺少可见记录时只写“未观察到可见执行记录”，并保留调用阶段未知；处理后检查根因和症状没有越过观察范围。需要形成强制表达规则时进入正式规范，而不把本经验当作授权。
