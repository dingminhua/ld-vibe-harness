summary: "**当前判断**\n\n- 原始过程事件、工具运行结果、最终领域状态、可复核证据和面向 Human 的表达必须分层。机器输出与 Human 输出可以是同一可观察结果的不同投影，Human 摘要不能替代原始结果或证据。\n- AI 负责判断与叙述，Code 只报告实际执行和机械检查，Web 或其它界面只负责呈现；过程输出不能因显示完整而自动成为正式事实、验证结论或 Human 决定。\n\n**需要决定的契约**\n\n- 计划、进度、工具运行、局部失败、验证、风险和最终交接哪些需要稳定机器字段，哪些只属于 Human 叙述。\n- 紧凑输出与诊断输出如何保持同一事实语义；过程事件如何与最终事实对象、证据引用和 trace 对齐。\n- 取消、超时、部分成功、未验证和等待 Human 决定如何明确表达，以及由 Helper 公共契约、具体领域操作、Agent host 还是呈现层承担。\n\n**边界**\n\n- 本 Spark 不建立新的 Helper 字段、trace Schema、事实类型或 Web 实现授权，不要求暴露模型内部推理。\n- 旧 Envelope、产品比较与字段候选不是当前规则；正式字段、接口和实现仍须按当前 Specs 单独设计、验证和受控推进。"
