  expected_result: 06、08、21 及字段登记/机械校验附件形成无冲突的当前契约，明确替换 0019 的再次批准分支，并定义 Gate1、Gate2、授权基线、PlanDelta 和超界收敛边界。
  status: completed
  approach_summary: 先以单个 WorkCase 单次运行的授权基线为对象定义状态机硬约束，再向下分配字段和机械检查；不建立跨任务 token、动作白名单或旧形状兼容 profile。
  result_summary: 06、08、21、字段登记与机械校验目录已形成双 Gate、execution authorization、baseline fingerprint、SafeConvergenceShape 和一次性迁移当前契约；code/tests/specs 131 passed，Helper capabilities outcome=ok。
- item_id: item-02
  goal: 同步行动模板和领域规则的授权消费与委派边界。
  expected_result: 30、31、32、34 及必要领域衔接能消费 Gate1 逐项批准的写入、Git、事实操作和 subagent 复核授权，删除执行期重复确认分支，同时保留未列明行动的禁止边界。
  status: completed
  depends_on:
