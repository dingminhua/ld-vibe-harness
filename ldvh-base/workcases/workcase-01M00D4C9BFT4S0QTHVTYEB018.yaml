title: 最小执行证据协议定义与验证
status: closed
goal: 定义并验证 LDVH 最小执行证据协议：冻结 task/contract/payload/runner 四类身份定义、事件来源分级规则与评分前可比性门槛，形成可机器消费的结构化协议模块与会话级证据回放验证，为第 3–5 项优化（读写契约统一、read→update 契约闭合、签名拼装减负、只读去重）提供「是否真有效」的评估前置机制；协议以会话事件日志（harness-delivered 层级）为证据来源，不提升为 host-received。
scope: 在 code/ldvh/testing 下新增 evidence_protocol.py 协议定义模块（只读，纯数据/常量，不写事实源）与对应聚焦测试；协议冻结 task/contract/payload/runner 身份形状、事件来源分级规则（LDVH prepared / harness-delivered / host-received / behavior-consistent / causal-effect 五级）、评分前可比性门槛（复用 session_comparability 的 comparable 判定与事件图配对完整性）。在 code/ldvh/testing/equivalence_retrial.py 的评分管线中集成协议身份记录：每个 trial 记录 task/contract/payload/runner 四类身份指纹，协议身份不匹配的 trial 在评分前标 not_comparable 或 out_of_protocol。新增 code/tests/testing/test_evidence_protocol.py 聚焦测试与 code/tests/testing/test_equivalence_retrial.py 的协议集成测试。以当前环境真实 DSH 会话日志为样本做协议级会话回放验证：每个会话按协议输出身份指纹、事件来源分级标记与可比性判定，验证结果汇总记录在 WorkCase 的结果/验证记录中（不保存原始会话内容）。在 code/plans/ 下形成一份最小执行证据协议的规范草案（markdown，只读文档，不修改正式 specs/）。排除：修改正式规则语义、行动模板、Helper 公共契约；建立健康分、遥测、Dashboard 或告警；Git commit、push、release；其他执行中 WorkCase 的事实文件和作用范围；上游 Spark 的任何写入；不保存原始会话/试次内容（只进受限临时根）。
success_criterion_definitions:
- criterion_id: criterion-identity
  statement: 协议冻结 task/contract/payload/runner 四类身份定义与来源分级规则：evidence_protocol.py 以只读常量/纯数据形式交付四类身份形状、五级事件来源分级与评分前可比性门槛规则，且不读取消息正文/工具结果内容。
- criterion_id: criterion-integration
  statement: 协议集成到评分管线：equivalence_retrial.py 每个 trial 记录四类身份指纹，协议身份不匹配的 trial 在评分前标 not_comparable/out_of_protocol 且不进入比较；聚焦测试覆盖。
- criterion_id: criterion-protocol-doc
  statement: 在 code/plans/ 下形成最小执行证据协议规范草案（markdown），涵盖身份定义、来源分级、可比性门槛与消费规则；文档不修改正式 specs，回读与实际内容一致。
- criterion_id: criterion-samples
  statement: 以当前环境至少 5 个真实 DSH 会话日志为样本做协议级回放，每个会话输出身份指纹、来源分级标记与可比性判定；回放结果可由人工逐项核对（执行期人工检查材料，不构成独立结果复核），汇总记录在 WorkCase 验证记录中，不含原始内容。
- criterion_id: criterion-boundary
  statement: 协议明确区分 harness-delivered 可观察与 host-received unavailable，不把协议通过写成因果结论或总体服务改善证据；与 Study/上游 Spark 边界一致。
success_criterion_results:
- criterion_id: criterion-identity
  outcome: satisfied
  summary: evidence_protocol.py 392 行只读纯数据/常量：四类身份（task/contract/payload/runner）、五级来源分级常量与评分前门槛函数；不读消息正文/工具结果内容
- criterion_id: criterion-integration
  outcome: satisfied
  summary: equivalence_retrial.py +48 行：trial 记录四类身份指纹，reference 不匹配标 out_of_protocol 并排除评分；test_equivalence_retrial.py 集成测试通过
- criterion_id: criterion-protocol-doc
  outcome: satisfied
  summary: code/plans/evidence-protocol-draft.md 119 行七节覆盖身份/分级/门槛/消费规则/实现参考/边界；未修改正式 specs
- criterion_id: criterion-samples
  outcome: satisfied
  summary: 7 个真实 DSH 会话协议级回放（≥5），每会话身份指纹/来源分级/可比性判定，7/7 comparable；记录不含原始内容，claim_boundary 明示非因果结论
- criterion_id: criterion-boundary
  outcome: satisfied
  summary: 五级分级显式区分 harness-delivered 可观察与 host-received unavailable；claim_boundary 声明不构成因果或总体服务改善证据；未写入 Spark/Study
result_summary: 最小执行证据协议已定义并验证：evidence_protocol.py 冻结四类身份/五级来源分级/评分前可比性门槛；equivalence_retrial.py 评分管线集成协议身份并排除 out_of_protocol trial；规范草案与 7 会话真实回放验证完成，全程不含原始会话内容。前会话实施后事实未同步，由本接手会话逐项机械核实后如实写回，无补造中间历史。
validation_summary: 聚焦测试 42 passed（test_evidence_protocol.py + test_equivalence_retrial.py）；全量 code/tests 1919 passed / 15 skipped / 0 failed；验证记录 7/7 会话 comparable 且无原始内容。续接缺口如实记录：Stop gate 绑定不可建立（LDVH_WORKCASE_STOP_BINDING 未设、无 .ldvh-stop-bindings/ 部署、宿主会话标识不可观察），按 specs/34 §5.5 记录不伪造。
closure_outcome: completed
disposition_summary: 全部 5 项成功标准 satisfied，四项 work items 全部 completed；无 not_satisfied/not_verified 标准、无未完成 scope 责任，无剩余责任与转交。交付物：code/ldvh/testing/evidence_protocol.py（只读协议模块：四类身份/五级来源分级/评分前可比性门槛）、equivalence_retrial.py 评分管线协议身份集成（out_of_protocol 评分前排除）、code/plans/evidence-protocol-draft.md 规范草案、evidence-protocol-verification-record.json（7 真实 DSH 会话回放，无原始内容）。验证：聚焦测试 42 passed，全量 code/tests 1919 passed / 15 skipped。复核结论 pass_with_followups，两条 feedback 已处置（命令确认由 Controller 实跑闭合；assess_trial 加固建议记录不采纳，非阻断）。边界：协议通过不构成因果效应、host receipt 或总体服务改善证据；按禁止项未执行 Git commit，改动留待 Human 决定提交
