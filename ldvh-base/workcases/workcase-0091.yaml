    effect_scope: 允许产生既有测试/构建缓存和 .ldvh-test-runs 记录；不修改事实对象正文
    risk_summary: full-v4 耗时并使用 CPU/IO；当前 dirty Working Tree 使失败归因与本 WC 不能天然一一对应
    rollback_summary: 测试缓存和运行记录无需作为源码回滚；据实保留结果与归因边界
