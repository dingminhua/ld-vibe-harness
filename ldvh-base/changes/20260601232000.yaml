type: change
title: 落地 05 AskUserQuestion 使用规范至 L0/L1 Rules
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户要求根据 specs/05-Trae-Solo AskUserQuestion使用规范.md 进行落地。
  05 §8.3 要求在 L1/L2 Rules 中声明 AskUserQuestion 使用要求。
  05 §9 机制关系声明要求 L0/L1/L2 Rules 与 05 保持同步。
decision: |
  1. 在 L1 Rules（ldvh-l1-rules.md）新增"Human Gate 实现"章节，声明本项目使用 AskUserQuestion 实现 Human Gate，引用 05 §5-6 和 §7。
  2. 在 L0 Rules（ldvh-l0-rules.md）新增"Human Gate 入口"章节，声明 Human Gate 通过 AskUserQuestion 实现，指向各项目 L1 和 05 规范。
  3. 更新 L0/L1 压缩保护行，新增 HumanGate 相关条目。
consequences: |
  - AI 进入本项目时，L1 Rules 自动注入 Human Gate 实现声明，AI 可知悉应使用 AskUserQuestion。
  - L0 Rules 提供跨项目 Human Gate 入口，新接入项目可参照 L1 模式声明。
  - refs/12 内容分工合规，无需修改。
  - Skill 模板暂缓（无 .trae/skills/ 目录），待后续按需创建。
affects:
  - .trae/rules/ldvh-l1-rules.md
  - .trae/rules/ldvh-l0-rules.md
related_rules:
  - specs/05-Trae-Solo AskUserQuestion使用规范.md
  - specs/11.01-Rules机制规范.md
human_gate:
  required: false
  reason: 本次变更是将已确认的 05 规范落地到 Rules，未修改 05 规范本身的触发场景、设计规范或降级策略。
validation: |
  L1 Rules 包含"Human Gate 实现"章节且引用 05 §5-6 和 §7。
  L0 Rules 包含"Human Gate 入口"章节且引用 05。
  L0/L1 压缩保护行包含 HumanGate 条目。
