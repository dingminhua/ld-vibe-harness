status: closed
title: 规范修订：独立审核能力判断来源（协作 Worker vs subagent）
goal: 修订 21 §4.5 与 31 §5.2.1，把 WorkCase 独立审核第 1 档（协作 Worker，可设模型）的可用性判断从 AI 推断改为显式来源（Human 明确确认或当次可观察/登记证据），并明确确认高档可用后不再单独询问低档，消除 AI 对观察不到对象的判断与冗余询问；不改变三档路由顺序、保证边界或 same-AI fallback 约束。
scope: 仅修改 specs/21-WorkCase-工作项.md 的 §4.5 与 specs/31-事实对象判定与受控创建行动模板.md 的 §5.2.1；34、05.Att.01、Code、tests、Web 均不改动；不新建独立 spec、不新增或修改字段闭集与结构。修改完成以精确回读 + 对照方案核验为准。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 21 §4.5 新增第 1 档可用性判据来源规则——AI 不得推断，来源闭集为 Human 明确确认或当次可观察/登记证据，二者不可得时为 unknown（不得记 unavailable 或可用），且措辞不与现行 21 §4.5 第 128 行、§4.5.1 已有规则重复。
- criterion_id: criterion-02
  statement: 31 §5.2.1 对齐第 1 档来源（R2a）并补优先级消解（R2b：能力解锁询问为一次覆盖两档的启用授权，确认第 1 档可用后第 2 档仅作 fallback、不再单独询问），且不新增冗余规则。
- criterion_id: criterion-03
  statement: 修改后的 21/31 两份文件经精确回读，实际改动与方案 R1/R2 一致，未越出 scope 声明范围。
