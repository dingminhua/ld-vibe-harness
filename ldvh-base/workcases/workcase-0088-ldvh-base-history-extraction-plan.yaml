id: workcase-0088
type: workcase
title: ldvh-base 事实源快速迁移与价值提取
goal: |
  快速推进 ldvh-base 事实源迁移：不创建额外旧事实源目录，直接修复当前事实对象中的失效引用，把旧 v1 规范证据指向已有 history/specs-v1，并继续提取仍有价值的内容进入 v2 当前事实。
status: closed
created: '2026-06-23T23:47:14+08:00'
updated: '2026-06-24T01:10:00+08:00'
priority: P1
plan_confirmed_at: '2026-06-23T23:50:54+08:00'
description: |
  v2 active 规范、Code 默认检查、Rules / Skill / Hook 入口和项目根 README 已完成收敛，但 ldvh-base 中仍保留大量 v1 时代的工作对象、旧 specs 路径、关闭证据、迁移过程证据和未分流的长期经验。

  这些内容不能被简单删除，也不能直接视为当前 active 事实源继续消费。当前阶段不再创建额外“旧事实源”目录；旧事实源已经由 Git 历史、history/specs-v1 和当前对象中的历史证据承载。迁移应直接作用于当前 ldvh-base：失效的 v1 规范引用改为已有历史规范路径，仍有当前价值的需求、决策、风险、经验、证据和未完成事项再按 v2 事实模型重写进入当前事实。

  本 WorkCase 不移动或重命名 ldvh-base 目录，不创建旧事实源目录，不通过复制目录制造第二事实源。后续若涉及对象删除、关闭、批量改写语义、重建当前事实源入口或改变事实源边界，仍必须单独 Human Gate。
success_criteria: |-
  - [x] 完成 ldvh-base 当前对象清单和校验基线，至少覆盖 WorkCase、Spark、ADR、Pitfall 和 Study 的数量、状态分布、明显 v1 路径残留和当前阻塞类型
  - [x] 建立第一批对象处理规则：旧 v1 specs 失效路径直接迁移到已有 history/specs-v1；同名 active 20-24 事实模型路径保持指向 active specs
  - [x] 建立价值提取规则，明确旧对象中的需求、决策、风险、经验、研究材料、验证证据和未完成事项分别应进入哪类 v2 事实模型或规范/Code/Web/运行时扩展工作
  - [x] 明确不创建旧事实源目录；旧事实追溯依赖 Git 历史、history/specs-v1 和当前对象中的历史证据引用
  - [x] 收口旧 WorkCase 自签审核 warning，使 `ldvh-base` 全量事实源校验达到 0 errors / 0 warnings
  - [x] 按 Human 最新口径清空 ADR 与 Pitfall 当前事实对象，并修复结构化证据断链
  - [x] 给出分批执行顺序和每批验证口径，避免知识地图、Web 或 Code 把历史残留误读为当前事实
  - [x] 对所有会移动、删除、关闭、批量重写或改变事实源边界的动作列出 Human Gate 条件
  - [x] 形成可执行的下一阶段 WorkCase 或行动编排候选，并在执行前提交 Human 方案确认
source: |
  用户在 v2 active 收敛后说明整体路线：先把 v2 完整迁移过来，再让 v1 退出历史，把 v2 变为正式规范；当前事实源全部成为历史记录，从历史记录里提取还有价值的内容，转入新的事实源，然后再说知识地图。

  在完成非根 README 清理后，主控复核发现 active specs 与 Code 检查已稳定，但 `python3 code/fact_validate.py ldvh-base/` 仍出现大量旧 v1 specs 路径和历史对象残留。主控建议下一步先建立 ldvh-base 历史事实源收口计划，用户回复“按你计划执行”。

  Human Gate 记录：
  - 触发原因：创建 WorkCase，规划后续可能涉及事实源历史化、对象分类、价值提取、批量重写和事实源边界调整的高影响工作。
  - Human 决策：允许先建立本控制计划。
  - 追加决策：用户指出“我们现在要做的是迁移事实源，你就不需要创建旧的事实源了……现在要快速推进”。
  - 追加决策：用户明确“Pitfall 和 ADR 可以全部清空，WorkCase 可以重点清理，Spark 和 Study 要保留”。
  - 追加决策：用户在查看 WorkCase A-E 批分流计划后明确“一次性都按你计划处理吧”，授权按分流计划收口旧 WorkCase。
  - 当前授权边界：允许快速修复当前 ldvh-base 中确定性的失效历史引用；允许按已记录的 A-E 批分流计划关闭旧 WorkCase；不创建旧事实源目录，不移动或删除 WorkCase 文件，不关闭 Spark / Study，不重建事实源。
