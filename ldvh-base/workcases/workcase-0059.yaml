status: closed
title: 降低 LDVH 本地提交的重复审计与 Hook 取证成本
goal: 在完整保留 LDVH 提交八条底线和原生 commit-msg Hook 最终闸门的前提下，减少本地提交中两项已确认的非必要成本：用真实 Hook 自身的稳定单行 allow 证据替代完整 GIT_TRACE 取证；对受控事实写入已经完成的全量完整性审计，只在 Code 能即时证明提交候选仍处于严格同一快照时复用，否则无条件保留并执行公共全量扫描。以普通代码、纯事实和混合候选三类流程的可复现测量判断实际收益，不以新增包装层或状态换取表面提速。
scope: 以 spark-0019 记录的八条提交底线为冻结边界，先测量普通代码、纯事实和混合候选的 Helper 调用数、Git 子进程、耗时、输出量和失败诊断轮次；测量仅只读当前 worktree，需要写入的样本全部位于可清理的隔离临时仓库或既有测试 fixture。Hook 优化只允许在 code/ldvh/hooks/commit_msg.py 及直接测试中输出一条由真实 Gate 当次计算的 passed、source_fingerprint、snapshot_identity 证据，失败诊断、退出码、fail-closed 和共享校验核心不变。事实审计复用仅允许在 specs/05、30、31、32，code/ldvh/facts/candidate_discovery.py，code/ldvh/helper/operations/fact_operation_support.py、fact_integrity_operation.py、fact_integrity_request.py、fact_candidate_operation.py、fact_candidate_request.py、commit_precheck_operation.py、commit_precheck_request.py 及列明直接测试内形成严格 Go/No-go；Go 必须由 Code 即时绑定实际 worktree/common-dir、当前规则与 Schema 投影、完整 canonical 事实路径及内容集合、每个 staged 事实候选与已审计 Working Tree 对象内容和真实 Index 关系，任一对象、目录、规则、Index 或候选漂移均回退公共 check-fact-integrity；若证明近似完整重扫或需要 token、witness、receipt、cache、持久状态，则 No-go 并保留现状。specs/03、09、30 只在 Hook 成功证据边界确需澄清时最小修改。排除行动模板 candidate+content 读取契约变更、precheck/Gate 合并、diff/readback/AI 语义审查削弱、两阶段提交、prepared token、witness、journal、alternate Index、聚合 wrapper、Hook 部署或 core.hooksPath 变更、pip/打包/插件、push/PR/release、Spark 修改及任何未列明 dirty/untracked 文件。Gate 1 后仅在存在精确候选且全部验证通过时允许一次原生本地 commit，不使用 --no-verify；No-go 本身不强迫形成事实复用代码，验证失败或候选不清时不提交。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 普通代码、纯事实与混合候选三类流程形成可复现基线，分别记录 Helper 调用、Git 子进程、墙钟耗时、输出量和诊断轮次，区分八条底线要求的必要检查与已证实的重复成本；测量不改当前项目事实或既有脏文件，也不以单次样本宣称普遍性能结论。
- criterion_id: criterion-02
  statement: 真实 commit-msg Hook 的 allow 路径恰好输出一条稳定最小证据行，内容只来自当次 Gate 计算的 passed、source_fingerprint 与 snapshot_identity，足以证明该原生 Hook 事件已执行；不读取环境变量或复用 precheck 结果，不扩张为语义审核、Hook 部署状态或提交整体正确性证明，失败诊断、退出码与 fail-closed 行为不变。
- criterion_id: criterion-03
  statement: 事实完整性审计复用形成明确且可验证的 Go/No-go：Go 时由 Code 即时证明实际 worktree/common-dir、当前规则与 Schema 投影、完整事实路径和内容集合、每个 staged 事实候选与已审计对象内容及真实 Index 关系全部同快照，任一漂移自动回退公共全量扫描；No-go 时现有 check-fact-integrity 全量扫描保持不变。对象数、时间戳、单一总指纹、Git 状态或 AI 比较历史输出均不得单独作为复用依据。
- criterion_id: criterion-04
  statement: 实现不产生 token、witness、receipt、journal、cache、持久状态或替代 Index，不新增聚合提交 wrapper，不改变行动模板 candidate+content 读取契约，不合并 precheck 与 Gate，也不减少候选声明、逐文件 diff、AI 语义审查、真实 Index precheck、原生 Hook、提交后回读中的任何一项。
- criterion_id: criterion-05
  statement: 定向与相关全量测试覆盖 Hook allow/block、稳定证据格式、失败诊断、facts/footer、同快照与各类 worktree/common-dir/规则/Schema/目录/对象/Index/候选漂移回退；ruff、format、diff 与事实完整性检查通过，未在当前平台执行的条件测试如实披露。
- criterion_id: criterion-06
  statement: 若形成本地 commit，其候选仅来自本案列明文件并逐文件审核，真实 staged 集合精确一致，Helper precheck 通过，原生 git commit 未绕过 Hook 且观察到新的单行 allow 证据，提交后 HEAD/tree/message/paths/Index/工作树回读一致；无关 dirty 不误带且不 push。若 No-go 后没有需提交候选、验证失败或候选边界不清，则据实保留结果且不创建 commit。
success_criterion_results:
- criterion_id: criterion-01
  outcome: satisfied
  summary: 三类隔离流程均完成三轮可复现测量，记录 Helper/Gate 时间、输出量和 Git 读取数；当前 146 对象公共扫描另作五次基线。测量未改当前事实或既有脏文件，并明确仅代表该 fixture 与观察时点。
- criterion_id: criterion-02
  outcome: satisfied
  summary: 真实 commit-msg Hook allow 只从当次 Gate result 输出一行 passed、64 位来源指纹和 sha256 Index 快照；缺任一绑定字段即返回 1。真实 commit 正反例锁定单行格式、block 诊断、退出码、HEAD 与 Index 行为。
- criterion_id: criterion-03
  outcome: satisfied
  summary: 严格判定为 No-go：低于全量重扫的 Code 即时同快照证明无法成立；未实现复用，公共 check-fact-integrity 每次继续全量扫描，因此不存在用旧审计覆盖对象、目录、规则、Schema、Index 或候选漂移的路径。
- criterion_id: criterion-04
  outcome: satisfied
  summary: 没有新增 token、witness、receipt、journal、cache、持久状态、替代 Index、提交 wrapper 或入口合并；候选声明、逐文件 diff、AI 语义审核、真实 Index precheck、原生 Hook 和提交后回读均保留。
- criterion_id: criterion-05
  outcome: satisfied
  summary: Hook allow/block、成功格式、缺失绑定证据 fail-closed、失败诊断、footer/facts 与 Helper/Gate 同核由相关回归 30 项覆盖；No-go 分支没有新增同快照复用或漂移回退代码，公共全量扫描以 146 对象 complete 对照通过。ruff、format 和 diff 检查通过。
- criterion_id: criterion-06
  outcome: satisfied
  summary: 本地 commit b4ee14815cfa769b69573a75f9a29e58b597e34b 只含 Hook、直接测试和 workcase-0059 三个候选；预检 passed，真实 Hook 单行证据的来源指纹与快照和预检一致。提交后 HEAD/tree/message/路径/空 Index 回读成立，无关 dirty 未带入且未 push。
result_summary: LDVH 原生 commit-msg Hook 的成功取证已从完整 GIT_TRACE 收敛为真实 Gate 自身的一条绑定证据：它明确给出 passed、当前规则来源指纹和真实 Index 快照，绑定字段缺失时失败关闭，失败诊断与共享机械校验不变。事实完整性审计复用经严格判断为 No-go，因为同等可信的跨调用证明成本接近全量重扫或必须引入被禁止状态；因此保留公共全量扫描，没有为表面提速增加包装层或安全捷径。实现和 WorkCase 已由本地 commit b4ee14815cfa769b69573a75f9a29e58b597e34b 固定，精确包含 3 个文件且未 push；提交后的 WorkCase 结果生命周期写回是当前未提交事实残留。
validation_summary: 相关 Hook 与 Helper 测试 30 passed（54.48s），未报告 skipped；ruff check、ruff format --check 与 git diff --check 通过。公共 check-fact-integrity 对 146 个对象返回 ok/complete，当前 common-dir Hook inspect 为 managed。真实 Index precheck mechanical_outcome=passed，source_fingerprint=9cb312d2a0efad819def6f18e025b16890cd0a8ab4f7759519460944d7e0e06f，snapshot_identity=sha256:656611c23b7c0df8c2a0fc028c3b02e85e49e05c901e86e6744b7483d9d88ca9；原生 commit 输出同一单行 Hook 证据。commit b4ee14815cfa769b69573a75f9a29e58b597e34b、tree 106f9761afd92b44e3c13aa33287274d41de571b、完整 message、3 个路径和空 Index 已回读；既有无关工作树变化仍在且未误带，未 push。三类性能数字来自隔离 fixture，不代表其它仓库或平台；事实复用为 No-go，故未执行不存在的复用漂移分支测试。
