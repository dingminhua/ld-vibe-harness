title: work item 吸收生命周期关口的机械拦截——创建时禁止将受控提交/结果复核写成 item
intent: WorkCase 创建时 Controller 与 Reviewer 必须逐项审核 work item 是否吸收生命周期关口（21 §4.3），但 WC-0067 创建时 item-05（goal=全部 item terminal 后本地受控提交）明确违例却未被拦截通过。需要判断：是否应把 21 §4.3 禁止的典型反例在 Code 层面做机械拦截，使 create-fact-object 在校验 work items 时检测已知关键词闭集并拒绝创建，不再仅依赖 AI 语义审核。
summary: "## 问题\n\nWC-0067 创建时，item-05 的 goal 为「全部 item terminal 后本地受控提交」。规范 21 §4.3 明确禁止把受控提交写成 item——「应在全部 item terminal 后由受控提交承接」，且模板 34 §5.2 停止条件也要求检测「任一 item 吸收受控提交」。但创建时 Controller/Reviewer 未拦截，导致该违例 item 进入获批计划并执行。\n\n## 根因\n\n规范 21 §4.3 和模板 34 §5.2 的规则明确，但依赖 AI 逐项语义审核——无机械保障。当 AI 语义审核漏过时，唯一防线失效。\n\n## 候选方向\n\n1. **纯规范层强化**：在模板 34 增加创建前强制逐项核对清单，列出典型反例（受控提交、结果复核、关闭准备等），让 Controller 创建前逐项问「这个 goal 是不是生命周期关口」。成本低，但仍靠 AI 语义审核。\n\n2. **Code 机械拦截**：在 create-fact-object 的 work items 校验中，检测 goal/expected_result 是否命中已知生命周期关口关键词闭集（如「受控提交」「本地提交」「结果复核」「完整结果投影」「关闭准备」「Gate」），命中则拒绝创建并报「生命周期关口误建模」。机械拦截能覆盖已知关键词，不能覆盖任意自然语言换说法。\n\n3. **两者兼用**：机械拦截抓已知关键词，模板核对清单兜底任意自然语言变体。\n\n## 边界\n\n- 不改规范 21 正文（§4.3 已明确禁止，规则正确）\n- 不改 00/02/05 等正文与字段表\n- 只讨论「work item 吸收生命周期关口」这一种违例，不泛化到其他 item 合规问题\n- 机械拦截只检测关键词闭集，不用自然语言理解判断任意语义\n- 不改 Code 的 resolver.py/configuration.py/filesystem.py 等核心模块\n\n## 参考\n\n- 规范 21 §4.3（生命周期关口边界）\n- 模板 34 §5.2（停止条件核对项）\n- WC-0067 item-05 实际违例实例\n- spark-0055（LDVH 流程复杂度是否过度设计——宏观议题）\n\n## 关系\n\n本 Spark 与 spark-0055 有交集——如果机械拦截被判定为合理，它是「以 Code 机制保障规范边界」的实例，可支撑或反驳 spark-0055 的宏观判断。如果机械拦截被判定为过度设计，则本 Spark 结论可以关闭为 discarded 并记录理由。"
