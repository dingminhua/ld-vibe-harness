title: change_log 与提交署名取值约定及注入责任
status: open
priority: P2
intent: LDVH 的 change_log 责任签名（signature.agent_id / host_environment）与 Git 提交署名（Agent-ID / Host-Environment trailer）目前只有字段结构与必填约束，缺少取值约定和注入责任：各执行会话自行填值（codex 填 Codex Desktop/Cindy，workbuddy 填 WorkBuddy macOS/WorkBuddy），大小写不统一、host_environment 被误用为 agent 名重复、模型身份与宿主环境混淆。不定义清楚时，流水和提交的责任记录不可比较、不可审计，同一 Agent 在不同会话的签名不一致，后续追溯与合规检查无法可靠进行。
summary: "**当前判断**\n\n- change_log signature 由统一登记（05.Att.01）定义字段结构与必填约束（agent_id + host_environment 必须同时含、非空），但未定义取值约定与注入责任：Code 只做机械透传，specs 未规定由平台注入还是 AI 自填，也未给出建议值/大小写/环境标识规则。\n- 实测样例不一致：workcase-0048 为 codex/Codex Desktop，spark-0046 为 codex/Cindy，spark-0049 为 workbuddy/WorkBuddy macOS，workcase-0026 关闭流水曾出现 WorkBuddy/WorkBuddy（host_environment 重复 agent 名），已追加更正流水修正。\n- Git 提交署名（commits/validation.py 读取 Agent-ID / Host-Environment trailer）同样依赖执行会话填写，取值规范与 change_log 相同缺失。\n\n**拟议约定（Human 当前倾向，待确认）**\n\n- agent_id = 实际驱动模型/Agent 身份：如 Deepseek-V4-Flash（模型）、codex；当执行主体是 WorkBuddy 且模型明确时，agent_id 填模型名（如 Deepseek-V4-Flash）。\n- host_environment = 工作环境/宿主工具：如 workbuddy（WorkBuddy 工具）、Codex Desktop（codex 环境）；用于区分同一 agent 在不同宿主下的记录，不承载模型身份。\n- 提交 trailer 与 change_log 对齐：commit message 尾部携带\n  Agent-ID: Deepseek-V4-Flash\n  Host-Environment: workbuddy\n  与同事务 change_log 条目的 signature 保持一致。\n\n**待判断事项**\n\n- 上述拟议分配（agent_id=模型、host_environment=工具）是否采纳为规范约定；若采纳，现有样例（codex/Codex Desktop、workbuddy/WorkBuddy macOS）是否需要统一口径或允许历史共存。\n- 已知 agent 闭集与大小写约定：workbuddy、codex 等是否统一小写；模型名（Deepseek-V4-Flash）是否允许含大小写/连字符。\n- 注入责任：signature 与提交 trailer 是否统一由平台/执行会话按实际运行环境自动注入，AI 不应手填；迁移与手工补录场景如何取得一致签名。\n- 校验强度：Code 是否强制 change_log signature 与提交 trailer 一致（同一事务），以及格式（非空、闭集）校验范围。\n\n**影响范围**\n\n- specs/attachments/05.Att.01 的 change-log-signature 字段登记（补取值约定约束行）。\n- specs/05 §11.7.1 迁移操作 migration_signature 说明（与拟议约定对齐）。\n- 提交署名校验（code/ldvh/commits/validation.py）与相关提交规范。\n\n**验收标准**\n\n- 新写入的 change_log 与提交 trailer 遵循同一约定（agent_id=模型/Agent、host_environment=宿主工具）。\n- 约定写入规范后，新增对象/更新的签名样例一致，Code 校验通过。\n- 既有历史对象不回溯改写，仅追加更正流水（如 workcase-0026 已实践）。\n\n**边界**\n\n- 本 Spark 不授权修改规范、Code 或建立行动模板；只承接议题与结论，修订由后续受控流程执行。\n- 不回溯改写已写入的历史 change_log（追加式设计，历史条目不可改写）。"
