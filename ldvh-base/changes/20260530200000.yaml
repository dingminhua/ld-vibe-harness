id: change-20260530200000-update-self-built-mcp-entry-boundary
type: evals_update
created_at: "2026-05-30T20:00:00+08:00"
actor: AI
scope:
  - specs/evals/07-LDVH自建MCP评估.md
summary: 补充自建 MCP 与 Python 程序多入口关系，明确 MCP 不是 AI 调用程序辅助能力的唯一入口
changes:
  - 在 2.3 补充自建 MCP 不表示 AI 不能直接调用 tools/ 中 Python 程序，也不表示所有程序辅助能力都必须 MCP 化
  - 新增 3.3 自建 MCP 与 Python 程序入口关系，区分 CLI、Skill、Web API 和 MCP 入口
  - 新增 5.5 MCP 化准入条件，明确何时应将程序辅助能力封装为 MCP
  - 新增 8.6 误把 MCP 当作唯一程序入口的风险与缓解措施
  - 在第十章补充自建 MCP 与直接调用 Python 程序可并存的关系说明
reason: 避免将自建 MCP 误解为 Python 程序的唯一调用方式，明确 Python 程序是程序辅助层能力实现，MCP 只是面向 Agent 的结构化协议入口之一
impact:
  - specs/evals/07-LDVH自建MCP评估.md 的自建 MCP 边界更清晰
  - 不改变正式规范，不将 evals 结论升级为强制规则
  - 为后续判断哪些 tools/ 能力需要 MCP 化提供准入依据
validation:
  status: done
  notes: 已检查补充内容仍保持自建 MCP 是程序辅助层 Agent 接口的定位；已确认补充内容未改变 05 工具边界和 05.01 程序辅助层职责；已保留 evals 文档内部调研性质
