<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
  <title id="title">LDVH 为什么存在</title>
  <desc id="desc">临时解释图：Vibe Coding 在持续演进中因概率性推理、上下文依赖和无状态风险导致负担增长，LDVH 通过六类构成要素形成稳定支撑。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .label { font: 700 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .pillText { font: 700 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#shadow); }
      .softBlue { fill: #e0f2fe; stroke: #0284c7; }
      .softAmber { fill: #fff7ed; stroke: #ea580c; }
      .softRed { fill: #fef2f2; stroke: #dc2626; }
      .softGreen { fill: #ecfdf5; stroke: #059669; }
      .softIndigo { fill: #eef2ff; stroke: #4f46e5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.6; marker-end: url(#arrow); }
      .arrowRed { fill: none; stroke: #b42318; stroke-width: 2.6; marker-end: url(#arrowRed); }
      .arrowGreen { fill: none; stroke: #0f766e; stroke-width: 2.6; marker-end: url(#arrowGreen); }
      .dashed { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="1024" height="640"/>
  <text class="title" x="50" y="62">LDVH 为什么存在</text>
  <text class="subtitle" x="50" y="94">解决 Vibe Coding 持续演进中“产出越多、负担越重”的失控问题</text>

  <g transform="translate(50 140)">
    <rect class="card softBlue" width="250" height="138" rx="8"/>
    <text class="section" x="22" y="36">Vibe Coding 带来</text>
    <text class="body" x="22" y="70">自然语言表达目标</text>
    <text class="body" x="22" y="96">AI 推理生成实现</text>
    <text class="body" x="22" y="122">门槛低、反馈快、产出多</text>
  </g>

  <path class="arrow" d="M 314 209 L 374 209"/>

  <g transform="translate(386 140)">
    <rect class="card softAmber" width="280" height="138" rx="8"/>
    <text class="section" x="22" y="36">AI 生成代码的硬伤</text>
    <text class="body" x="22" y="70">概率性推理：不是确定性编译</text>
    <text class="body" x="22" y="96">上下文依赖：缺失或过载会漂移</text>
    <text class="body" x="22" y="122">无状态：跨会话不天然保留依据</text>
  </g>

  <path class="arrowRed" d="M 680 209 L 732 209"/>

  <g transform="translate(744 140)">
    <rect class="card softRed" width="250" height="138" rx="8"/>
    <text class="section" x="22" y="36">持续演进失控</text>
    <text class="body" x="22" y="70">衔接断裂：需求、状态、验证</text>
    <text class="body" x="22" y="96">表现：回归、失据、漂移</text>
    <text class="body" x="22" y="122">结果：逐渐难以继续做</text>
  </g>

  <g transform="translate(112 356)">
    <rect class="card softGreen" width="800" height="174" rx="8"/>
    <text class="section" x="26" y="38">LD Vibe Harness 的作用</text>
    <text class="body" x="26" y="70">用可追踪的规范、事实、行动、工具和桥接界面，</text>
    <text class="body" x="26" y="94">把持续演进重新组织成可控闭环。</text>

    <g transform="translate(42 118)">
      <rect class="softIndigo" width="94" height="38" rx="8"/>
      <text class="pillText" x="47" y="24" text-anchor="middle">规范体系</text>
    </g>
    <g transform="translate(164 118)">
      <rect class="softBlue" width="94" height="38" rx="8"/>
      <text class="pillText" x="47" y="24" text-anchor="middle">事实模型</text>
    </g>
    <g transform="translate(286 118)">
      <rect class="softGreen" width="94" height="38" rx="8"/>
      <text class="pillText" x="47" y="24" text-anchor="middle">行动编排</text>
    </g>
    <g transform="translate(408 118)">
      <rect class="softAmber" width="80" height="38" rx="8"/>
      <text class="pillText" x="40" y="24" text-anchor="middle">Code</text>
    </g>
    <g transform="translate(512 118)">
      <rect class="softRed" width="80" height="38" rx="8"/>
      <text class="pillText" x="40" y="24" text-anchor="middle">Web</text>
    </g>
    <g transform="translate(616 118)">
      <rect class="softIndigo" width="108" height="38" rx="8"/>
      <text class="pillText" x="54" y="24" text-anchor="middle">运行时扩展</text>
    </g>
  </g>

  <path class="arrowGreen" d="M 512 356 C 620 318, 746 312, 850 286"/>
  <text class="small" x="604" y="306">LDVH 结构化约束 AI 风险</text>

  <g transform="translate(190 558)">
    <rect x="0" y="-28" width="644" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="label" x="322" y="-3" text-anchor="middle">目标：启动有序少读、推理有据少猜</text>
    <text class="label" x="322" y="23" text-anchor="middle">行止有规可依、结果有证可验</text>
  </g>
</svg>
