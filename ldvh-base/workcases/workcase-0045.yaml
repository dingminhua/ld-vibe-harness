title: 固定 WorkCase 投影规范与 Code 的漂移检测
status: closed
goal: 在保持 specs/21 为 WorkCase 当前快照投影语义唯一权威、Python 为唯一运行时投影实现点、TypeScript 继续只由 Python 生成的前提下，为 21 §9.3 非 blocked phase/closed 基表与 Python PHASE_PRESENTATION/CLOSED_PRESENTATION 建立精确 source-contract 一致性测试，使规范表与 Code 映射任一漂移都不能静默通过；不新增运行时 Markdown 解析、事实字段、phase 语义或 Web 状态模型。
scope: 覆盖 specs/21 §9.3 投影基表、code/ldvh/facts/workcase_presentation.py、既有 TypeScript 生成器与 generated contract、直接相关 Python/spec tests 的只读基线核对；新增编码前 code/plans/workcase-presentation-source-contract.md 并更新 code/plans/README.md；优先只新增 code/tests/specs/test_workcase_presentation_source_contract.py，只有测试确实无法通过当前公开常量完成时才允许对 workcase_presentation.py 作无行为的可测试性暴露调整；执行既有 Python 投影、Controller 负矩阵与 Python→generated TypeScript 字节一致性测试；受控更新 workcase-0045 并按语义交付单位形成隔离本地 commit。测试解析器只用于断言且禁止被 production Code 导入或复用。排除 specs 修改、Web/API/i18n/docs 修改、generated TypeScript 手工修改、运行时读取 Markdown、新事实字段或持久派生判断、blocked overlay/Gate 2 规则重建、Helper/Schema/phase 转换修改、resume_from/summary/quality-gate 结构迁移、其它事实对象、push、PR、发布、外部消息和破坏性 Git。现有 spark-0040、workcase-0036 至 0039 和截图保持隔离。
success_criterion_definitions:
- criterion_id: criterion-exact-spec-table-contract
  statement: 新增测试精确定位 21 §9.3 的唯一非 blocked 基表，锁定当前六列表头及顺序、7 个 open phase 行和 1 个 closed 行；只接受反引号包裹的确定 token 与裸 null。标题/表头/列序、缺行、增行、重复行、未知 token、null 格式或单元格值漂移均确定性失败。
- criterion_id: criterion-spec-python-exact-equality
  statement: 测试解析所得 7 个 open phase 映射与 PHASE_PRESENTATION、closed 行与 CLOSED_PRESENTATION 逐键逐值完全相等；解析器仅位于测试侧且不得被 production Code 导入或复用，21 继续是唯一语义权威，Python 继续是唯一运行时投影实现点。
- criterion_id: criterion-no-duplicate-behavior-model
  statement: 本增量不在新测试中重建 blocked overlay、Gate 2 禁语、unresolved 或 phase 转换表；这些行为只由既有投影与 Controller tests 继续验证，不新增第二份状态或话术成立条件。
- criterion_id: criterion-generated-web-chain-preserved
  statement: 既有 test_generated_web_contract_matches_python_renderer 继续证明 generated TypeScript 与 Python renderer 字节一致；不新增或修改 Web test，不手改 generated contract，不让 TypeScript 或 Web 成为另一投影权威。
- criterion_id: criterion-validation-review-and-isolation
  statement: Code Implementation Plan、目标 source-contract test、既有 WorkCase presentation/Controller/generated-contract tests、git diff --check、路径白名单、WorkCase 精确回读、全库事实完整性、受保护 dirty 哈希隔离和独立只读结果复核全部完成；若发现规范表无法机械唯一定位或需生产行为/Specs 变更，则停止并返回 Human。
success_criterion_results:
- criterion_id: criterion-exact-spec-table-contract
  outcome: not_satisfied
  summary: 未新增 source-contract test。v1 把表内空值输入冻结为裸 null，但 21 §9.3 当前载体为 inline-code `null`；继续实现会同时违反获批标准或权威 Specs。
- criterion_id: criterion-spec-python-exact-equality
  outcome: not_satisfied
  summary: 未形成规范表到 PHASE_PRESENTATION/CLOSED_PRESENTATION 的逐值一致性测试；产品代码与既有测试保持原样。
- criterion_id: criterion-no-duplicate-behavior-model
  outcome: satisfied
  summary: 没有新增 blocked、Gate 2、unresolved、phase transition 或其它运行时/测试侧第二行为表，也没有修改 production Code。
- criterion_id: criterion-generated-web-chain-preserved
  outcome: satisfied
  summary: 未修改 Web、generator 或 generated TypeScript；既有 test_generated_web_contract_matches_python_renderer 在相关回归 30/30 中通过。
- criterion_id: criterion-validation-review-and-isolation
  outcome: not_satisfied
  summary: 目标 source-contract 与 Code Plan 最终产物未形成，因此该完整标准不满足；但候选普通文件已撤回，git diff --check、相关回归、dirty 哈希隔离、Helper 回读与全库事实完整性已完成。
result_summary: workcase-0045 未形成产品实现。执行前精确核对发现获批 v1 成功标准要求裸 null，而 21 §9.3 权威表使用 inline-code `null`；该成功标准属于 Gate 1 baseline，不能在执行期改写、升版或由 Code Plan/实现解释覆盖。Controller 已撤回候选 Code Plan 普通文件，零写入 production/test/Specs/Web，并取消剩余实现与原验证项。
validation_summary: 相关既有投影与 Controller tests 30/30 passed，包含 Python→generated TypeScript 字节一致性；git diff --check passed；本案候选 Code Plan 文件与 README 变化已撤回，未生成目标 test，Index 为空。spark-0040、workcase-0036 至 0039、聚焦页及四张详情截图的 SHA-256 与执行前基线逐值相同；Helper 每次事实写回均已精确回读且全库事实完整性 complete。未运行不存在的目标 source-contract test，也不把零实现写成目标满足。
closure_outcome: partial
disposition_summary: 本 WorkCase 形成了两项稳定边界价值：确认未建立重复行为模型并保持 Python→generated TypeScript 链；但核心规范→Python 漂移检测、对应 Code Plan 最终产物与完整验证未交付，三项标准为 not_satisfied。执行中发现原因是 Gate 1 baseline 将空值输入错误冻结为裸 null，而 21 权威表使用 inline-code `null`；候选普通文件已撤回、产品实现零写入、独立结果复核 pass。建议接受本案 partial 停止，并把正确 inline-code 合同作为受限后续，由新的 WorkCase/Gate 1 重新授权，不在本案内改 Specs、改 baseline 或补造实现。
spark_suggestions:
- suggestion_id: suggestion-correct-projection-source-contract
  suggestion_kind: constrained_responsibility
  summary: 用正确的 inline-code `null` 输入合同重新建立 21 §9.3→Python 投影漂移检测。
  restriction_reason: workcase-0045 的 Gate 1 baseline 明确要求裸 null，但 21 §9.3 当前权威表使用 inline-code `null`；success_criterion_definitions 参与 approval baseline fingerprint，执行期不能改写后继续复用原批准。
  impact_summary: criterion-exact-spec-table-contract、criterion-spec-python-exact-equality 与 criterion-validation-review-and-isolation 为 not_satisfied；当前仍缺规范表到 Python 映射的机械漂移检测。
  resume_condition: Human 在 workcase-0045 Gate 2 后决定继续，并以新的 WorkCase/Gate 1 明确采用当前 21 表真实语法：值单元格为 inline-code token，`progress_step` 的 `null` token 映射 Python None。
  follow_up_summary: 新 WorkCase 应重新精确读取 21 §9.3 与 Python 常量，形成不改 Specs/production/Web 的测试侧 Code Plan；严格锁定六列表、7 个 open 行与 1 个 closed 行、inline-code token 格式和逐值相等，再运行既有生成链回归、事实审计与独立复核。
