id: workcase-0010
type: workcase
title: Codex 并行执行行动编排落地
goal: |
  承接 spark-0028 与 study-0011，把 Codex worktree、新建对话、同目录线程、子 Agent 和一层嵌套子 Agent 的使用方式沉淀为 LDVH 行动编排能力；明确行动编排决定如何调度这些执行资源，WorkCase 只承载具体目标和证据，环境适配只说明能力是否可用。
status: human_plan_confirming
created: '2026-06-25T04:13:45.180773'
updated: '2026-06-25T04:26:00+08:00'
priority: P1
description: |
  Human 已明确：Codex worktree / 子 Agent / 新建对话能力的研究内容应关联到 Spark，并与行动编排联系起来；具体如何执行由行动编排决定。这不是 ADR 主问题，也不能把 WorkCase 自身承担的目标、环境适配负责的能力可用性和行动编排负责的调度机制混在一起。

  本 WorkCase 只负责把 spark-0028 和 study-0011 的研究结论推进为行动编排设计与落地方案，不直接修改业务 WorkCase 的执行内容，不把环境能力声明写成行动规则，不把一层嵌套子 Agent 作为长期风险 ADR 处理。若涉及环境是否支持，应回到运行时扩展/环境适配；若涉及具体业务目标，应由对应 WorkCase 承接。
success_criteria: |
  - [x] 明确三分法：worktree 用于写入隔离和可提交闭环；同目录线程用于轻量只读咨询或短复核；子 Agent 用于读多写少、局部调查、复核、日志分析和完成后检查。
  - [x] 设计行动编排中的主控职责：任务卡、范围禁止项、入口读取、Human Gate、轮询、回收、验证、提交、合并顺序、冲突处理和结果复核。
  - [x] 明确子 Agent 调用子 Agent 的使用边界：只允许一层、默认只读或复核、不得直接写事实源、不得绕过主控合并权威。
  - [x] 区分行动编排、WorkCase 和环境适配：行动编排决定怎么调度；WorkCase 承载目标、证据和关闭；环境适配说明能力是否可用和如何接入。
  - [x] 给出应落入 `specs/03-行动编排规范.md` 或新行动编排成员的具体变更方案，并完成执行前子 Agent 方案审核。
source: |
  来源 Spark：`ldvh-base/sparks/spark-0028-codex-worktree-subagent-thread-practices.yaml`。
  来源 Study：`ldvh-base/studies/study-0011-codex-worktree-subagent-thread-practices.md`。
  Human 补充要求：研究内容要关联到 Spark，并和行动编排联系起来；行动编排决定具体怎么执行，这不是 ADR 问题，也不能和 WorkCase 职责或环境适配混在一起。
