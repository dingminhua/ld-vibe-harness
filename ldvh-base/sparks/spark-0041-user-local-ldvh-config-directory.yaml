description: |
  本 Spark 承接 `_migration/24A-user-local-ldvh-config-candidate.md` 中关于用户级 LDVH 配置目录、工作区根配置、当前项目根配置和配置生成位置选择的候选讨论。

  当前已确认的是“把候选内容转入 Spark 继续跟踪”，不是确认启用用户级配置目录，也不是确认修改配置解析顺序、创建 `~/.ldvh`、写入 `%APPDATA%\ldvh`、移动 `LDVH-GOVERNED-PROJECTS.yaml`、安装 Hook 或声明任何环境入口 integrated。

  后续若推进，应先回答配置生成位置与用户级目录边界，再决定是否进入 WorkCase、ADR、specs/10、10.Att.01、Code resolver、安装初始化模板或 tests。
source: conversation
priority: P1
priority_detail: |
  该议题影响安装初始化、管辖项目配置发现、跨项目本机默认值和 Human Gate 位置选择。它不阻断 V3 当前主线，但如果后续要生成或发现用户级配置，必须先收敛。
source_detail: |
  Human 在 V3 后置收口过程中确认“Spark 先创建，把内容移动进入”。来源候选记录为 `_migration/24A-user-local-ldvh-config-candidate.md`，其中明确待 Spark 可用后转入 Spark 或 WorkCase。
