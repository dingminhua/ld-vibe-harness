workcase_profile: control-contract-v2
title: Helper 事实对象机械结构校验闭环
status: closed
phase: closed
plan_version: 2
goal: 为五类事实对象建立可追溯、完整的 Code 机械校验闭环：所有由当前 Specs 明确交给 Code 判定的结构规则都有唯一清单、统一校验入口、读取/创建/更新/写后回读及候选消费的实际覆盖，以及范围匹配测试；适用检查尚未实现或无法完成时，Helper 必须返回 unavailable，不得报为 mechanically_valid。
scope: 主要修改与归属载体为 specs/05、20–24 及其字段登记和附件，覆盖其中明确归 Code 的身份、载体/路径、Schema、字段闭集、类型、必填/条件/空值、枚举、时间/版本/允许转换、引用、关系、项目级约束和诊断。item-01 还必须读取 specs/01、02、03、04 及其字段附件，逐项判断是否已有适用 Code 机械规则或公开 invalid/unavailable 字段必须最小修改；这些上游契约不因读取而自动扩张实施范围。覆盖 read-fact-objects、prepare-fact-object-draft 的对象消费判断、create-fact-object、update-fact-object、update-workcase 等类型便利写入口、CAS 零写入、写后回读和 find-fact-object-candidates。排除自然语言意图、摘要充分性、来源真实性、证据充分性、关系领域语义、是否应建对象等 AI 判断；排除 Hook 外部直写保护和批量迁移或修复已有对象。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 在不改 00 的前提下，定稿并审核适用机械规则的唯一定位、适用类型、机械/语义归属、Code owner、入口预期与 unavailable 边界；对 01–04 是否存在适用规则或须最小修改形成可回读结论。
- criterion_id: criterion-02
  statement: 形成已审核的可检测闭集：每条已归 Code 的规则均映射到共享 validator/operation、读/建/更新/便利写入/回读/candidate 入口和正反测试；任一缺失均不得报告 mechanically_valid。
- criterion_id: criterion-03
  statement: 仅按定稿 Specs 和已审核映射接入实现，使读取、创建、更新、便利写入、CAS 零写入与写后回读对同类违规给出一致 invalid 或 unavailable 处置。
- criterion_id: criterion-04
  statement: 候选发现和恢复遇到 invalid 或 unavailable 的旧对象时完整披露诊断、coverage 与 scope partial，不静默排除。
- criterion_id: criterion-05
  statement: 跨五类型的正反测试覆盖新增或收紧的机械规则；任一必要的 Specs 映射、validator、入口覆盖或对应测试缺失时，验证失败。能力声明不包含自然语言语义、Hook 防护或迁移。
work_items:
- item_id: item-01
  goal: 先完善并独立审核 Specs 的机械规则目录与硬门槛。
  expected_result: 05、20–24 及其登记/附件中的适用机械规则逐项具有唯一定位、类型、机械/语义归属、Code owner、入口预期和 unavailable 边界；01–04 及字段附件完成逐项适用性和最小修改判断，矛盾或漏项已在必要时修正并独立审核。
  status: completed
  result_summary: 新增 05.Att.02 作为唯一机械校验目录，逐项完成 01、01.Att.01、02、02.Att.01、03、04、04.Att.01 的适用判断；独立审核通过，并修复候选扫描对非 canonical 载体的静默排除及预算语义。
  approach_summary: 仅读取和修订 Specs；01–04 只在已有适用 Code 规则或公开结果字段须变更时最小修改；不改 00、不建立实现映射、不改 Helper/validator/测试。item-01 未完成即禁止后续工作项。
- item_id: item-02
  goal: 基于已定稿 Specs 建立并审核可执行的机械规则映射闭集。
  expected_result: 每条规则均映射到 validator/operation、read/create/update/类型便利写入/readback/candidate 和正反测试；05.Att.01 等字段契约作为映射输入，缺任一映射、入口或测试即明确失败。
  status: completed
  result_summary: 05.Att.02 已建立每条 rule_key 的具体实现符号、入口和正反测试映射；范围测试强制目录、入口映射和正反证据三表闭集及入口精确一致，并已通过独立审核。
  depends_on:
  - item-01
  approach_summary: 只核对现有实现和测试并形成映射/验收标准，不修改实现；与 item-01 的 Specs 规则目录严格区分。
- item_id: item-03
  goal: 仅按已审核映射完善 Helper 机械校验与全部受影响入口。
  expected_result: 共享 validator/operation 和读、建、更新、update-workcase 等便利写入、CAS 零写入、写后回读及 candidate 入口按映射一致处理 invalid/unavailable；旧违规对象和 candidate partial 均如实诊断。
  status: completed
  depends_on:
  - item-02
  approach_summary: 只作最小实现和必要 Specs 对应修正；不以 Web 或 AI 回退替代检查，不改语义判断、Hook 防护或迁移。
  result_summary: 13 条规则的实际入口链路已核对并通过独立审核；候选扫描现将错误后缀和非 canonical 载体披露为 partial/unavailable，且仅 canonical identity 消耗扫描预算。
- item_id: item-04
  goal: 完成范围匹配测试与实际 Helper 验证。
  expected_result: 跨五类型正反例、read/create/update/便利更新/CAS 零写入/写后回读/candidate partial 实测均通过；新增或收紧规则缺映射、validator、入口或测试的回归例明确失败。
  status: completed
  depends_on:
  - item-03
  approach_summary: 只运行范围匹配的单元、操作和 CLI 场景；不跑 full-v4，不用自然语言语义作为断言。
  result_summary: 规则目录映射校验、五类型事实测试 57 项、候选操作 17 项、创建/更新关键正反例 6 项及实际 CLI 读回均通过；独立审核 PASS。
summary: 复测确认机械规则目录、事实校验、候选发现、受控创建、CAS/回读和原子关闭范围均无回归；Human 已批准关闭 result_version 1。
