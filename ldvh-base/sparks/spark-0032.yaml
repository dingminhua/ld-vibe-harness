title: Obsidian 与 LDVH 的 AI 协作分层
status: discarded
disposition_summary: Human 决定关闭本 Spark：是否需要在 LDVH 引入 Obsidian 技术的判断已得出明确结论——不需要。依据 study-0026 的评估，Obsidian 的图谱可视化、双向链接、标签检索等核心能力对 AI 关联发现没有增量价值，AI 的关联发现已由现有 Helper CLI（relation_targets/text_match/F0-F4）覆盖，Human 的浏览需求已由 Web 聚焦页（CommitHotspotGraph、FactAssociationsSection）覆盖；引入 Obsidian 还会带来事实源边界模糊与第二权威风险，不符合 spec 00 §5.1、§8.1。本终态不产生承接对象；真正待加强的方向是补齐 ADR/Pitfall/Study 的关系数据，由 spark-0040 与 spark-0067 承接，不在此 Spark 内跟踪。
intent: 需要保留 Obsidian 这类本地 Markdown 知识工作区与 LDVH 是否存在协同层的未决问题：两者都可提供关联和检索，但面向 Human 的自由材料与面向 AI 的可回指规则和事实不能混作同一权威。后续需先判断是否存在真实场景和可验证收益，才考虑受控桥接；若不跨会话保留，容易把工具比较重新简化为替换选型，或在未辨明来源、覆盖和责任边界时推进接入。
summary: "## 当前判断\n\n- 把 Obsidian 用作 LLM Wiki 时，它提供的是以本地 Vault、Markdown、链接、属性、搜索或图谱视图和插件为基础的探索性材料层。它适合 Human 沉淀阅读材料、草稿和自由关联，也能让 AI 或检索层发现可能有用的内容。\n- 该层回答的是“哪些材料可能值得看”；链接、图谱、标签、搜索命中或检索排序本身不证明语义关系、规则适用、行动许可、材料当前性或已覆盖范围。\n- LDVH 面向 AI 的价值则是“当前工作可以依据什么”：来源可回指、稳定对象身份、来源定义的关系、渐进式读取、coverage/gaps、验证与 Human Gate。候选、关系和排序只用于定位与继续读取，不成为第二规则源、事实源或语义结论。\n- 两者因此更可能分层协作而非彼此替代：Obsidian 承载 Human 的广泛探索与项目背景；LDVH 承载当前规则、受管事实、工作责任和受控上下文。现有 Helper 的事实候选与一跳关系导航仍独立成立，尚未建立对任何外部知识系统的桥接。\n\n## 可能的协作方向\n\n- 若未来存在真实需求，Obsidian 只能向 AI 提供可回指的候选材料、精确读取入口、已读取范围和缺口；AI 仍需依据目标和来源自行判断相关性与下一步。\n- 若需要 Human 侧浏览，可考虑将 LDVH 受管对象投影为 Obsidian 可读视图；这不等同于让 Obsidian 成为规则或事实的权威，也不自动允许反向写回。\n\n## 尚未决定\n\n- 是否确有需要让 AI 从 Obsidian 获取候选材料的工作场景，以及相对直接读取当前来源能否带来可验证收益，而非增加一层不可靠上下文。\n- 若存在桥接，单向候选发现、只读投影、受控同步或双向修改分别需要哪些来源、冲突、覆盖与写入责任。\n\n## 当前边界\n\n本 Spark 不构成 Obsidian 接入、插件安装、数据同步、知识图谱、语义检索或全量 Vault 注入的实施授权；也不把任何 Obsidian 内容预先认定为 LDVH 的规则或事实来源，更不允许自动把链接转换为 LDVH 关系。"
