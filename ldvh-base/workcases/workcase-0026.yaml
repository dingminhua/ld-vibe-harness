status: closed
title: 验证 WorkBuddy 写入路由
goal: 验证 WorkBuddy 在 LDVH 管辖项目内执行写操作时，能正确经由受控创建路径（Helper CLI / create-fact-object）将事实对象写入预期 canonical 载体与正确管辖项目（governed_project_id=ldvh）的实际 Git worktree，且不存在绕过 Helper 的直写；同时覆盖省略 governed_project_id 时的默认解析负例，确认路由器依赖显式 id 而非静默误写。
scope: 仅覆盖写路由的验证，目标 worktree 唯一钉死为绝对路径 /Users/dmh2002/poker_hud_projects/ld-vibe-harness-v4，并明确排除 ~/.codex/** 等其它共享 common-dir 的 worktree。包括：(1) 管辖项目识别——依据 LDVH-GOVERNED-PROJECTS.yaml 中 id=ldvh 的登记项与 resolve-governance-scope 解析；(2) 事实对象受控创建入口——经 Helper 创建/更新测试样本并核对落点；(3) 写入边界核对——确认写入落在 ldvh-base/ 正确子目录，且未误写其它登记项目（poker-train-card、poker-train-video、ldvh-closure-preview）。排除：读取路径、Web 渲染、Git 提交/push、用户个人目录与 .workbuddy 配置目录的写入、WorkBuddy 非写入能力、任何规范编辑，以及创建额外的“测试用”事实对象或删除任何事实对象。
success_criterion_definitions:
- criterion_id: criterion-routing-positive
  statement: 显式 governed_project_id=ldvh 时，受控创建的 canonical 载体落于钉死 worktree 的 ldvh-base/ 下正确子目录，且 worktree 指纹匹配 /Users/dmh2002/poker_hud_projects/ld-vibe-harness-v4；创建仅经 Helper 受控路径，无直写痕迹。
- criterion_id: criterion-routing-negative
  statement: 省略 governed_project_id（仅依赖 default_project_id）时解析落到 ldvh-closure-preview（/Users/dmh2002/poker_hud_projects/ldvh-closure-preview，不同 worktree），不静默误写 ld-vibe-harness-v4，证明路由器依赖显式 id 且边界分离正确。
- criterion_id: criterion-no-bypass
  statement: 写入前后 git status --porcelain -- ldvh-base/ 基线比对，仅预期 canonical 载体变化，无直写 ldvh-base/ 的人工/脚本/重定向痕迹；另外 3 个登记项目路径确认未被触碰。
- criterion_id: criterion-integrity
  statement: 受控写入前后各运行一次 check-fact-integrity，外层 outcome=ok 且 result.status=complete；写入后精确回读成立。
success_criterion_results:
- criterion_id: criterion-routing-positive
  outcome: satisfied
  summary: 显式 governed_project_id=ldvh 的受控写入落点正确：update-workcase 返回 canonical_path=ldvh-base/workcases/workcase-0026.yaml，写入证据 locator=/Users/dmh2002/poker_hud_projects/ld-vibe-harness-v4/ldvh-base/workcases/workcase-0026.yaml，与钉死 worktree 绝对路径一致，且 namespace=committed、durability=file_and_directory、cleanup=clean；另对 spark 类型的 prepare-fact-object-draft 候选路径为同一 worktree 的 ldvh-base/sparks/spark-0046.yaml。全部写入仅经 Helper 受控路径（update-workcase），无直写痕迹。
- criterion_id: criterion-routing-negative
  outcome: not_satisfied
  summary: 判据字面断言不成立：省略 governed_project_id 时并未"解析落到 ldvh-closure-preview"，而是 prepare-fact-object-draft 直接返回 invalid_request（governed_project_id 必须是非空 string），resolve-governance-scope 在无显式 locator 时回退到 cwd（ld-vibe-harness-v4）而非 default_project_id。判据的安全实质（不静默误写 ld-vibe-harness-v4、路由依赖显式 id、边界分离正确）以更强的"缺省即拒绝"方式成立，显式指定 closure-preview locator 时也确实解析到其独立 worktree；但由于所述预期行为模型与实现不符，按事实记为 not_satisfied 而非满足，供 Human 在 Gate 2 判断是否修订判据表述或补充默认解析的规范预期。
- criterion_id: criterion-no-bypass
  outcome: satisfied
  summary: 写入前后 git status --porcelain -- ldvh-base/ 基线比对：均仅 ' M ldvh-base/workcases/workcase-0026.yaml' 一条，全仓 status 亦无其它条目，仅预期 canonical 载体变化，无直写痕迹。另外 3 个登记项目：poker-train-card 与 poker-train-video dirty=0；ldvh-closure-preview 的 29 条 dirty 经 mtime 归因（最新 2026-07-28T17:04:16）确认早于本次写入 2026-08-03T05:03:50，为既有无关变更，未被触碰。
- criterion_id: criterion-integrity
  outcome: satisfied
  summary: 受控写入前后各一次 check-fact-integrity 均为外层 outcome=ok 且 result.status=complete（object_count=126、problems=[]）；写入后精确回读成立，content_fingerprint 由 27ea8255…d012a 变为 4323e54e…c2b4，canonical_path 与 check_status=mechanically_valid 均符合预期。
result_summary: 写入路由验证完成，4 项判据中 3 项满足、1 项如实判为不满足。正向路由（criterion-routing-positive）满足：显式 governed_project_id=ldvh 时，经 Helper update-workcase 的受控写入精确落于钉死 worktree /Users/dmh2002/poker_hud_projects/ld-vibe-harness-v4 的 ldvh-base/workcases/workcase-0026.yaml，spark 草案候选路径亦落于同一 worktree 的 ldvh-base/sparks/。无绕过（criterion-no-bypass）满足：写入前后 git 基线仅预期载体变化，另外 3 个登记项目未被触碰（closure-preview 既有 dirty 已按 mtime 归因）。完整性（criterion-integrity）满足：写入前后 check-fact-integrity 均 ok/complete/126，写后精确回读与指纹迁移成立。负例（criterion-routing-negative）不满足：实现以"缺省 governed_project_id 即 invalid_request"硬拒绝，resolve-governance-scope 无 locator 时回退 cwd，均非判据所述的"默认解析落到 ldvh-closure-preview"；安全实质（无静默误写、依赖显式 id）成立且更强，但预期行为模型与实现不符，构成可交付的验证发现。
validation_summary: 核验手段与证据：(1) resolve-governance-scope（config_status=valid、scope_status=governed_single、governed_project_id=ldvh、git_worktree_root=/Users/dmh2002/poker_hud_projects/ld-vibe-harness-v4、git_common_dir=/Users/dmh2002/poker_hud_projects/ld-vibe-harness-v2/.git）；(2) read-fact-objects 写前/写后各一次精确回读（check_status=mechanically_valid，指纹 27ea8255…d012a → 4323e54e…c2b4）；(3) prepare-fact-object-draft 无副作用路径解析（spark → ldvh-base/sparks/spark-0046.yaml）；(4) update-workcase 两次受控写入，Helper 侧 verification 均 status=passed，含写后独立全库机械完整性审计；(5) check-fact-integrity 写前写后各一次，均 ok/complete/object_count=126/problems=[]；(6) git status --porcelain 写前写后基线比对（钉死 worktree 与全仓）及另外 3 个登记项目的只读 dirty 核对与 mtime 归因；(7) 负例实测两路（受控创建缺省 id、范围解析缺省 locator）。未覆盖：Helper 内部实现的形式化证明、并发写竞态、非 yaml 载体路由、以及 ldvh-closure-preview 既有 dirty 的语义成因。
closure_outcome: partial
disposition_summary: 验证达成主体目标：显式 governed_project_id 的受控写入正确落于钉死 worktree 的 canonical 载体（criterion-routing-positive satisfied）、无绕过直写（criterion-no-bypass satisfied）、写前写后完整性检查通过（criterion-integrity satisfied）。criterion-routing-negative 判据字面断言与实现不符：省略 governed_project_id 时受控创建入口 prepare-fact-object-draft 直接返回 invalid_request（governed_project_id 必须是非空 string），resolve-governance-scope 在无显式 locator 时回退到 cwd 而非 default_project_id；安全实质（不静默误写、依赖显式 id、边界分离）以更强方式成立，但"缺省解析落到 ldvh-closure-preview"的预期模型不成立，故如实判为 not_satisfied。建议 Human 决定：修订判据表述、或确立"缺省即拒绝"为规范预期（另立 Spark 固化该行为模型）。
spark_suggestions:
- suggestion_id: suggestion-default-project-id-routing
  suggestion_kind: constrained_responsibility
  summary: 记录验证发现：LDVH-GOVERNED-PROJECTS.yaml 的 default_project_id 仅在配置解析层被校验为已登记 id，不参与 resolve-governance-scope 的落点路由；省略 governed_project_id 时受控创建入口硬拒绝（invalid_request），省略 locator 时范围解析回退 cwd。建议将该行为模型固化进 specs/02 与 specs/04，或明确"缺省即拒绝"为规范预期。
  restriction_reason: 本 WorkCase 验证范围仅限写入路由验证，action_ceiling 禁止修改规范与创建额外事实对象，故该发现只能以 Spark 建议形式提交 Human 决策。
  impact_summary: 若维持现状，default_project_id 的语义与直觉不符，可能误导未来调用方依赖隐式默认解析；明确预期可消除歧义且不改变现有安全边界。
  resume_condition: Human 在 Gate 2 决定是否采纳该 Spark 建议并指派后续工作。
  follow_up_summary: 由 Human 决定修订判据/规范表述，或确立'缺省即拒绝'预期后关闭本 WorkCase。
