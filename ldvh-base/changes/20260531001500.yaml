id: change-20260531001500-multi-role-agent-container-model
类型: specs_update
created_at: "2026-05-31T00:15:00+08:00"
actor: AI
scope:
  - specs/41-multi-role-thinking-多角色思考.md
summary: 重构多角色思考行动模型的模式选择、角色定义和 Agent 调度规则
changes:
  - 将分析模式调整为主上下文轻量模式与多系统子 Agent 模式
  - 删除 Skill 辅助模式和特定 Agent 前提检查
  - 删除预制 Agent 映射表，不在稳定规范中维护运行环境可用 Agent 清单
  - 新增结构化角色定义，吸收产品、体验、前端、后端、API、数据、QA、性能、安全、治理、AI 协作、工具链、文档、DevOps、审计、Web Tools 与复盘改进等角色
  - 明确角色定义承载于 specs 稳定规范，不创建 Role 生产对象，不创建角色应用场景生产对象
  - 明确 Rules 负责触发入口，41 主文档负责执行流程，不创建 LDVH 版多角色思考 Skill
  - 明确多系统子 Agent 模式通过可调用 Agent 容器和运行时角色参数注入实现
  - 更新证据留存、Human Gate、附件型实践子文档说明、落地初始化、落地审计、合规检查和待补齐事项
reason: 根据用户确认的设计方向，41 应从 Skill/预制 Agent 前提模型调整为 Rules 触发、稳定规范角色定义、可调用 Agent 容器并行注入角色参数的模型
impact:
  - 多角色思考不再依赖 LDVH 版 Skill 或预制 Agent 映射表
  - 后续 Rules 只需提供入口提醒，不复制完整执行流程
  - 后续 Agent 实践子文档需与可调用 Agent 容器模型保持一致
  - 后续 Tools 可围绕角色字段、角色参数和报告结构做确定性校验
human_gate:
  status: confirmed_by_user
  reason: 用户明确要求删除 Agent 前提检查和预制 Agent 映射，角色内容吸收参考材料后成为 LDVH 自身内容
validation:
  status: done
  notes: 已用文本搜索确认 41 主文档中不再出现 Skill 辅助、Agent 前提、预制 Agent 映射、SOLO Agent、角色矩阵等旧模型残留关键词
