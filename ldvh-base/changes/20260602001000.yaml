type: change
title: 明确单个 Rules 文档 1000 字符上限
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  Rules 机制规范已要求规则正文短小、稳定、可检查、可引用，但未给出可机械判断的单文件长度上限，容易导致 L0/L1/L2 Rules 文件膨胀为第二事实源。
decision: |
  在 specs/11.01-Rules机制规范.md §8 明确单个 Rules 文档内容不得超过 1000 字符；超过时应回到 specs 权威文档、Skill、Agent 或 Tools 承载细节，Rules 只保留入口摘要、触发条件、压缩保护和权威引用。
  在 §10 规则检查表新增字符上限检查项。
consequences: |
  - Rules 文件长度约束具备明确检查标准；
  - Rules 审计时可直接检查单个 Rules 文档是否超过 1000 字符；
  - 超长内容应回退到权威 specs 或其他机制承载，降低 Rules 成为第二事实源的风险。
affects:
  - specs/11.01-Rules机制规范.md
related_rules:
  - specs/11.01-Rules机制规范.md
human_gate:
  required: false
  reason: 本次仅补充 Rules 设计约束的可检查长度标准，不新增、删除、重命名 Rules 文件，不改变 L0/L1/L2 生效方式或项目上下文识别机制。
validation: |
  已检查 11.01 §8 包含单个 Rules 文档 1000 字符上限。
  已检查 11.01 §10 规则检查表包含字符上限检查项。
