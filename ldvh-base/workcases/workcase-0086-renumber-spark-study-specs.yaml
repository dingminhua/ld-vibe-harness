    - 'rg -n "specs/24-Spark|specs/25-Study|24-Spark|25-Study|24 号 Spark|25 号 Study|Spark.*24|Study.*25|spec_id:
      \"24\"|spec_id: \"25\"|doc_id: \"24\"|doc_id: \"25\"" specs code tests web ldvh-base
