title: Helper 写交互优化
status: open
priority: P2
intent: 保留 Helper 受控写入操作在真实任务中是否存在步骤过多（read→prepare→补签名→补change_log→CAS写→回读→锁释放）、coordination lock release 不确定性噪音、签名要求严格但模型名常不可得导致的额外摩擦，以及是否可以通过简化 caller-completion 要求、减少往返或缩小 after 提交范围来降低写入成本，而不依赖固定模型统计对比或大规模测试框架。
summary: "## 当前状态\n\nHelper 受控写入操作（update-fact-object、prepare-fact-object-update 等）当前要求调用方完成完整 after 编排、逐次观察三字段署名、处理 coordination lock release 不确定性，每一步都需要一次完整往返。写入一个字段的更改需要 read→prepare→补签名→补 change_log→CAS write→回读 约 3 次往返，token 开销显著。\n\n## 待判断问题\n\n- 写操作的步骤简化是否能在不降低完整性语义的前提下减少往返次数；\n- caller-completion 要求是否存在可降低的额外负担（如签名自动形成、锁噪音消除）；\n- 变化的边际成本与收益是否支持实际实施。\n\n## 边界\n\n- 不依赖固定模型可比性、统计区间或 go/no-go 判断；\n- 不修改生产 Helper 公共契约或降低 CAS/回读/完整性审计的安全边界（除非经窄 WorkCase 批准）；\n- 与读交互优化独立，仅通过 related-to 关联追溯共同线索。"
