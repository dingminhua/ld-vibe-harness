title: change_log 与提交署名取值约定及注入责任
status: open
priority: P2
intent: LDVH 的 change_log 责任签名（signature.agent_id / host_environment）与 Git 提交署名（Agent-ID / Host-Environment trailer）目前只有字段结构与必填约束，缺少取值约定和注入责任：各执行会话自行填值（codex 填 Codex Desktop/Cindy，workbuddy 填 WorkBuddy macOS/WorkBuddy），大小写不统一、host_environment 被误用为 agent 名重复、模型身份与宿主环境混淆。不定义清楚时，流水和提交的责任记录不可比较、不可审计，同一 Agent 在不同会话的签名不一致，后续追溯与合规检查无法可靠进行。
summary: "**当前判断**\n\n- change_log signature 由统一登记（05.Att.01）定义字段结构与必填约束（agent_id + host_environment 必须同时含、非空），但未定义取值约定与注入责任：Code 只做机械透传，specs 未规定由平台注入还是 AI 自填，也未给出建议值/大小写/环境标识规则。\n- 实测样例不一致：workcase-0048 为 codex/Codex Desktop，spark-0046 为 codex/Cindy，spark-0049 为 workbuddy/WorkBuddy macOS，workcase-0026 关闭流水曾出现 WorkBuddy/WorkBuddy（host_environment 重复 agent 名），已追加更正流水修正。\n- Git 提交署名（commits/validation.py 读取 Agent-ID / Host-Environment trailer）同样依赖执行会话填写，取值规范与 change_log 相同缺失。\n- 多执行者提交缺口（新确认）：workcase-0026（Human→WorkBuddy→Deepseek-V4-Flash）、workcase-0048（codex 但 host 混 Codex Desktop/Cindy）、workcase-0052（claude-code 建→glm-codex-cli 完成）三个真实对象都是多次受控写累积后才首次提交，且流水跨多个 agent/多个 host。LDVH Git Gate 要求单次提交的全部新增流水签名与 footer 单值 Agent-ID/Host-Environment 一致，因此这三个对象无法通过单次提交校验——已确认机制上需要支持多 agent 提交（footer agent/host 允许多值集合，与多 Session-ID 同构）。\n\n**拟议约定（Human 当前倾向，待确认）**\n\n- agent_id = 实际驱动模型/Agent 身份：如 Deepseek-V4-Flash（模型）、codex；当执行主体是 WorkBuddy 且模型明确时，agent_id 填模型名（如 Deepseek-V4-Flash）。\n- host_environment = 工作环境/宿主工具：如 workbuddy（WorkBuddy 工具）、Codex Desktop（codex 环境）；用于区分同一 agent 在不同宿主下的记录，不承载模型身份。\n- 提交 trailer 与 change_log 对齐：commit message 尾部携带 Agent-ID / Host-Environment，与同事务 change_log 条目的 signature 保持一致。\n- 多执行者提交（新增拟议）：同一提交覆盖多 agent/多 host 流水时，footer 允许重复声明多个 Agent-ID / Host-Environment；校验规则为每条新增流水的签名必须属于 footer 声明的集合（与多 Session-ID 同构），禁止为掩盖真实执行者而虚构签名。\n\n**待判断事项**\n\n- 上述拟议分配（agent_id=模型、host_environment=工具）是否采纳为规范约定；若采纳，现有样例（codex/Codex Desktop、workbuddy/WorkBuddy macOS）是否需要统一口径或允许历史共存。\n- 已知 agent 闭集与大小写约定：workbuddy、codex 等是否统一小写；模型名（Deepseek-V4-Flash）是否允许含大小写/连字符。\n- 注入责任：signature 与提交 trailer 是否统一由平台/执行会话按实际运行环境自动注入，AI 不应手填；迁移与手工补录场景如何取得一致签名。\n- 多 agent 提交的审计语义（新增）：footer 多值放宽是否会削弱签名可审计性；是否要求多 agent 提交附带 Human 授权或执行者说明；同对象内 session 笔误（如 workcase-0048 的 919bd4d2/919bd4c6 差一位）如何识别与修正。\n- 校验强度：Code 是否强制 change_log signature 与提交 trailer 一致（同一事务），以及格式（非空、闭集）校验范围。\n\n**影响范围**\n\n- specs/attachments/05.Att.01 的 change-log-signature 字段登记（补取值约定约束行）。\n- specs/05 §11.7.1 迁移操作 migration_signature 说明（与拟议约定对齐）。\n- 提交署名校验（code/ldvh/commits/validation.py）与 specs/03 footer trailer 契约（支持多 Agent-ID / Host-Environment）。\n- 已确认受影响对象：workcase-0026、workcase-0048、workcase-0052（需在多 agent 提交契约落地后入库）。\n\n**验收标准**\n\n- 新写入的 change_log 与提交 trailer 遵循同一约定（agent_id=模型/Agent、host_environment=宿主工具）。\n- 约定写入规范后，新增对象/更新的签名样例一致，Code 校验通过。\n- 多 agent 提交契约落地后，workcase-0026/0048/0052 可通过 Git Gate 提交，且每条流水签名仍可追溯至 footer 声明。\n- 既有历史对象不回溯改写，仅追加更正流水（如 workcase-0026 已实践）。\n\n**边界**\n\n- 本 Spark 不授权修改规范、Code 或建立行动模板；只承接议题与结论，修订由后续受控流程执行。\n- 不回溯改写已写入的历史 change_log（追加式设计，历史条目不可改写）。"
