      expected_output: |
        在后续 v3 运行时扩展或行动指南规范中明确 session-start、acknowledge-read-plan、user-input、pre-tool-use 的边界；定义行动指南为 Code 生成的确定性辅助承接结果，不是规则源或授权器。
      status: pending
