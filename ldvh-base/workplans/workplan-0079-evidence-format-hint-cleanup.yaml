priority: P2
description: |
  本计划负责处理 `python3 code/fact_validate.py ldvh-base --format text` 中剩余的 `EVIDENCE_FORMAT_HINT` warning。

  `EVIDENCE_FORMAT_HINT` 表示证据字段有内容，但未按 `specs/05.02-工作模型字段内容与格式规范.md` 要求的四段式 Markdown 标题书写：
  - `## 验证计划`
  - `## 验证命令`
  - `## 验证结果`
  - `## 结论`

  本计划只处理证据字段格式，不改变历史事实结论，不改写 Git 历史，不重新解释已关闭工作对象的决策和结果。对无法安全补齐命令或结果的历史证据，应使用保守的人工验证说明或明确例外记录，避免伪造当时不存在的验证过程。
success_criteria: |
  - [x] 生成 `EVIDENCE_FORMAT_HINT` 当前清单，按对象类型、字段和状态分类
  - [x] 明确哪些历史证据可以机械改写为四段式，哪些需要人工判断或保留例外
  - [x] WorkPlan 的 `verification_evidence` 与 `closure_evidence` 不再触发可修复的 `EVIDENCE_FORMAT_HINT`
  - [x] Pitfall 的 `verification` 不再触发可修复的 `EVIDENCE_FORMAT_HINT`
  - [x] 不为历史对象伪造未发生的验证命令、验证结果或 Human Gate 结论
  - [x] `python3 code/fact_validate.py ldvh-base --format text` 达到 errors=0，且 `EVIDENCE_FORMAT_HINT` 为 0 或仅剩有明确例外说明的项
  - [x] 相关事实源修改通过抽样复核，确认只改变证据表达结构，不改变事实语义
source: |
  Human 在 2026-06-19 询问 `EVIDENCE_FORMAT_HINT` 的含义后，要求“先提交，然后新建一个 workplan 处理这个问题”。前置提交为 `d1723b8 refactor: 清理 LDVH 当前态历史残留`。

  Human Gate 记录：
  - 决策主题：是否创建独立 WorkPlan 处理剩余 evidence 四段式格式 warning。
  - Human 结论：批准先提交 0078 清理成果，再新建后续 WorkPlan。
  - 执行边界：本计划创建后不立即批量修改历史证据；后续执行时必须防止伪造历史验证过程。
