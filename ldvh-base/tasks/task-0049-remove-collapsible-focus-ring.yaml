description: |
  ObjectDetail 页面在加载/路由切换时，内容区会出现一个巨大的白色圆形轮廓动画（从圆→圆角矩形→消失），影响视觉体验。
  根因：ObjectDetail 主容器的 transition-all duration-300 导致 border-radius（浏览器默认值 8251.97px）在页面加载时做动画过渡。
