id: pitfall-0003
type: pitfall
title: 提交纪律规则在多处重复维护违反单一权威位置原则
status: archived
created: '2026-06-04T03:33:50'
updated: '2026-06-04T03:33:50'
symptoms: |
  提交纪律规则同时出现在工作区规则、项目规则、22.01-Rules.md 和场景规则中，
  违反 11.01 §5 中"同一规则只能有一个权威位置"的要求。
trigger_conditions: |
  在多个层级同时维护相同规则时触发。修改一处后容易忘记同步其他位置。
root_cause: |
  规则逐层添加时未明确权威位置，导致每层都复制了完整规则内容。
  11.01 §5 明确要求同一规则只能有一个权威位置，其他位置只能引用或摘要。
resolution: |
  识别矛盾后记录为 Pitfall，后续应通过规范审计流程统一修正：
  确定提交纪律规则的权威位置（22.01-Rules.md 或工作区规则），
  其他位置只保留入口提醒和引用。
verification: |
  ## 验证计划

  历史证据格式规范化：检查原 Pitfall 验证证据 是否保留可复查的验证对象、结果或关闭判断；本次仅补齐四段式结构，不新增或改变历史事实语义。

  ## 验证命令

  历史记录未单独记录完整的验证命令；如原字段包含命令、脚本、检查入口或人工检查动作，保留在下方原始证据摘录中。

  ## 验证结果

  原始证据摘录：

  验证方式：读取工作区规则、项目规则、22.01、场景规则四处规则进行比对；
  结果：确认重复存在，已记录。
  原文标题：验证结果

  读取工作区规则、项目规则、22.01、场景规则四处规则比对，确认提交纪律规则重复存在，已记录为 Pitfall。

  原文标题：结论

  验证通过。

  ## 结论

  本次仅完成证据字段四段式格式规范化；对象状态、关闭判断、验证结果和历史事实语义以原始证据摘录为准，未额外伪造历史验证过程。
avoidance: |
  新增规则时必须明确权威位置：
  1. 如果规则已有权威位置，其他位置只保留入口提醒和引用
  2. 如果规则需要多层入口，在每层只写"见 XX"或简短提醒
  3. 定期审计规则一致性
applicability: 所有接入 LDVH 的项目，所有规则层级
