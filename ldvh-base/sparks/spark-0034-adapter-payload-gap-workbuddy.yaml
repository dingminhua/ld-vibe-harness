  - at: '2026-06-27T03:28:00+08:00'
    summary: |
      补充问题边界和后续需求。确认 workcase-0014 已真实解决 worktree 管辖识别，本 Spark 不重复该层；新增要求包括 Hook adapter 必须转发真实 payload/target，dispatcher 在 hook + cwd-fallback + 缺 payload/target 时输出 adapter_payload_gap，自防御策略按只读 warning、写类 unknown-target blocking 分级；安装验收需要确定性 Code 统一执行 target-first、Hook payload、receipt 和非管辖 no-op smoke；安装前入口应命名为 ldvh-install bootstrap skill，不依赖 LDVH runtime 已安装或 receipt 已存在；安装后非管辖项目必须低打扰 no-op，避免 LDVH 插件使普通项目体验变差。
  - at: '2026-06-27T04:00:00+08:00'
    summary: |
      精简 description：合并原"五件事"和"五个方向"两组重叠列表为一组收敛方向；将验收级别的具体要求（非管辖项目体验分级行为）从 description 移到本条 evolution，作为待分流时的判断依据，避免 description 越界接近 WorkCase success_criteria。

      待分流时的行为判断依据（非管辖项目体验分级）：
      - 明确非管辖 target：no-op 放行，不要求读取 LDVH specs、receipt 或 acknowledge-read-plan。
      - 明确管辖 target：进入 LDVH read_plan、acknowledge-read-plan、写入/提交门禁。
      - target 不明确 + 只读工具：放行但保留 warning/diagnostic。
      - target 不明确 + 写类工具：blocking，防止误写管辖项目。
      - 安装 LDVH 后不得让非管辖项目默认进入高打扰模式；高打扰只允许出现在"已确认管辖"或"写操作但无法确认目标"的风险场景。
  - at: '2026-06-27T04:11:15+08:00'
    summary: |
      吸收 workcase-0016 执行前审核结论：将"适配脚本登记到 06.Att.02"收窄为固定资产与现场状态分层。仓库受管 adapter 才可作为固定运行时扩展资产登记；用户本机或 WorkBuddy 现场脚本只能作为过程证据、模板来源、doctor/verify 核对对象或安装说明，不得写成 06.Att.02 中的固定资产已部署事实。
