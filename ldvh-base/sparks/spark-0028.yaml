title: Helper 事实对象机械完整性校验闭环
intent: 保留 Helper 如何对所有事实对象的可机械判定结构形成完整校验闭环的问题，避免 Specs 新增或收紧结构规则后只有文字要求、读取或受控写入仍把违规对象当作有效事实。后续需判断每项结构规则的 Code 归属、共享校验入口、未实现时的如实处置，以及规则、实现和测试的同步门槛。
