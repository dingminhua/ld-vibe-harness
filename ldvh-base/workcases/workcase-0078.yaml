status: closed
title: 核验 Spark-0067 缺陷 9 的增量变化感知方案与净价值
goal: 仅针对 Spark-0067 缺陷 9，以当前可读实现、既有事实与已有测试证据核验“集合变了但无法定位变化对象”的实际边界；中立比较 per-object manifest 与 changed_since，形成符合规范 00 的实施、暂缓或 no-go 建议，不预先选择、设计或实施生产方案。
scope: 仅读取当前 manifest/F1/F2 相关实现、现有测试 fixture、Spark-0067、已关闭 WorkCase-0072 的有限结论及规范 00 价值标准；只检查已有历史快照、现有 fixture 或当前可读事实中的新增/修改/删除可比证据。0072 已取消且没有生产方案选择依据，其合成投影只能作为受限历史材料，不重启 Spark-0068、隔离 worker、提示卡或 fixture 实验。排除代码、规范、Spark 或其它事实对象修改，新增或改写样本/fixture/临时事实，任何生产 API/Schema/规范设计，外部写入、暂存、Git commit 与网络操作。若无可比较的无写入证据，相应情景明确为 unverified。
success_criterion_definitions:
- criterion_id: criterion-current-boundary
  statement: 基于当前可读实现、现有测试与事实回读，明确 object_set_fingerprint 已能和不能证明什么；对新增、修改、删除只记录已有可比较证据与未验证范围，不创建或改写样本、fixture 或事实对象。
- criterion_id: criterion-neutral-options
  statement: 分别列出 per-object manifest 与 changed_since 为满足“定位变化对象”所需的输入、输出、状态/兼容责任、锚点失效、删除、不同 worktree、响应量与维护成本；不产出具体公开 API、Schema 或规范设计。
- criterion_id: criterion-net-value
  statement: 按实际服务对象分别审查 V1-V8 与 HV1-HV5：AI 侧只在证据支持范围判断定位、接续和据实反馈收益；Human 侧没有真实使用证据的维度标为 unsupported 或 not_applicable；明确新增成本和风险能否抵消收益。
- criterion_id: criterion-decision-handoff
  statement: 形成 implement、defer 或 no-go 三选一建议及其证据、未验证范围和恢复条件；若建议实施，只说明需要另立 WorkCase 和新的 Human Gate，不授权当前 WorkCase 设计或实现功能。
success_criterion_results:
- criterion_id: criterion-current-boundary
  outcome: satisfied
  summary: 当前实现与现有测试已明确：公开 F1 响应交付当前 cards（含身份/字段）及 object_set_fingerprint；后者是唯一集合级变化锚点。由于缺少前后完整快照的逐对象内容版本和受契约支持的新增/修改/删除 delta，不能可靠定位此次变化对象。精确 diff 仅在完整、机械有效的测试专用内存投影中比较；未创建或改写样本、fixture 或其它事实。
- criterion_id: criterion-neutral-options
  outcome: satisfied
  summary: 已比较两类责任：per-object manifest 以同范围完整快照和每对象身份/版本为输入，删除由 before-only 身份表达且基线 O(N)；changed_since 需要可验证基线、历史或 tombstone、失效/并发和同 worktree 语义。现有 cursor 变化后拒绝 stale，不能作为变化查询。未产出 API、Schema 或规范设计。
- criterion_id: criterion-net-value
  outcome: satisfied
  summary: 价值审查完成但不主张正收益：AI 侧仅有测试专用定位可行性，V1–V8 中跨会话接续、响应节省、可靠性和演进收益均缺真实使用/量化证据；Human 侧 HV1–HV5 无真实使用证据，不能宣称成立。两路线新增的基线或历史、删除、兼容和维护风险目前不能被已知收益抵消。
- criterion_id: criterion-decision-handoff
  outcome: satisfied
  summary: 建议 defer，而非 implement 或 no-go：保留未来在真实、可比较的跨会话消费需求出现后重开判断的空间；届时须另立 WorkCase、取得新的 Human Gate，并先定义可观察收益与成本证据。本 WorkCase 不授权生产设计或实施。
result_summary: 结果为 completed（研究/决策范围）：当前生产候选发现会交付当前 cards 与集合级变化锚点，但没有前后逐对象版本或受契约支持的身份级 delta；精确定位仅在测试专用内存投影中证明。两种候选路线都带来完整范围锚定与额外状态/兼容责任，而真实收益、响应量基线和 Human 使用证据缺失；因此当前结论为 defer，不实施任何生产变化。
validation_summary: 本次通过 Helper 实际读取当前 WorkCase、当前 F1 响应与写后全库完整性审计（190 个对象、无问题）；PYTHONPATH=code .venv/bin/python -m pytest code/tests/testing/test_fact_change_measurement.py -q 实际通过 10 项。此前直接运行未带 PYTHONPATH 的同类命令仅因模块路径缺失而收集失败，不作为实现失败；未运行网络、外部写入、暂存或提交。
