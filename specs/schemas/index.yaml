purpose: "specs-authorized machine contracts for deterministic LDVH code"
authority_rules:
  - "specs/core/ is the parent rule authority for v3 core specs."
  - "specs/schemas/ is the machine-readable contract layer authorized by core specs."
  - "YAML instances are machine expressions after spec authorization, not parent authority by themselves."
  - "code/ consumes schemas and formatted sources, but does not own rule authority."
  - "tests/fixtures/ supplies regression material and examples, not facts or rules."
  - "ldvh-base/ stores real fact objects and must not mix in test fixtures."
authorized_by:
  - "specs/core/spec-system.md"
  - "specs/core/schema-contract.md"
contracts:
  formatted_source: "specs/schemas/formatted-source.schema.yaml"
  action_guide: "specs/schemas/action-guide.schema.yaml"
design_formula: >
  Formatted LDVH source files for specs, fact objects, and runtime assets
  are compiled by deterministic, read-only, reviewable Code into task-scoped
  action guides. An action guide organizes AI action by relationships,
  read plans, impact judgment, stop conditions, and next queries. It must be
  progressive, sufficient, back-referenceable, and stoppable.
