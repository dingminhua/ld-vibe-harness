id: workcase-0010
type: workcase
title: 记录对象归口沉淀与召回行动编排落地
goal: |
  承接 spark-0028，设计并落地统一的“记录对象归口、沉淀与召回行动编排”，用于 Spark、ADR、Pitfall 三类记录对象的入库分流、查重合并、冲突判断、出库召回和 Human Gate 识别；WorkCase 与 Study 只作为边界外出口。
status: human_plan_confirming
created: '2026-06-25T04:13:45.250316'
updated: '2026-06-25T05:16:00+08:00'
priority: P1
description: |
  spark-0028 已收敛出核心判断：Spark、ADR、Pitfall 是记录对象，不宜分别建立三个独立行动编排；它们共享同一类底层问题，即 AI 遇到输入、发现、判断、失败或经验线索时，如何判断是否需要长期记录、归口到哪类记录对象、是否已有对象可召回、是否更新旧对象、合并、新建、归档、废弃或触发 Human Gate。

  本 WorkCase 承接该 Spark，将其推进为行动编排落地方案。该编排内部区分入库模式和出库模式；WorkCase 是明确行动承接出口，Study 是研究行动产物，不与 Spark/ADR/Pitfall 并列为记录对象分支。

  Human 后续确认补充：Study 不能作为无承接记录的独立入口存在。建立 Study 前必须检查是否有关联 Spark、ADR 或 Pitfall；若没有承接对象，应优先创建 Spark 作为待研究议题入口。Study 研究行动和 WorkCase 行动承接也需要分别形成独立行动编排，但均先建立为候选或 planned，不激活；其中管理类编排应和其它行动编排一起讨论。
success_criteria: |
  - [ ] 形成记录对象行动编排的准入判断：什么时候不入库，什么时候进入 Spark、ADR、Pitfall，什么时候转 WorkCase 或研究行动并产出 Study。
  - [ ] 形成创建前召回规则：创建新 Spark/ADR/Pitfall 前必须查重、召回、比较范围、判断更新/合并/并列/冲突/Human Gate。
  - [ ] 形成出库召回规则：当前任务触发时如何召回已有 ADR、Pitfall、Spark，并决定应用、忽略、更新、归档或转行动。
  - [ ] 明确 Human Gate：同主题结论冲突、与 active ADR 冲突、推翻核心 Pitfall、长期规则/边界/取舍变化时必须暂停确认。
  - [ ] 明确知识地图和 Code 的角色：只能作为导航、召回和诊断工具，不替代权威事实源或 Human Gate。
  - [ ] 给出应落入 `specs/03-行动编排规范.md` 或新行动编排成员的具体变更方案，并完成执行前子 Agent 方案审核。
source: |
  来源 Spark：`ldvh-base/sparks/spark-0028-record-object-routing-recall-orchestration.yaml`。
  Human 补充要求：该 Spark 也要建立 WorkCase 推动，并纳入本轮安排。
orchestration:
  mode: sequential
  execution_items:
    - id: item-1
      title: 梳理记录对象编排边界
      role: design
      mode: single
      input_refs:
        - ldvh-base/sparks/spark-0028-record-object-routing-recall-orchestration.yaml
        - specs/03-行动编排规范.md
        - specs/20-Spark-火花.md
        - specs/22-ADR-决策.md
        - specs/23-Pitfall-踩坑经验.md
        - specs/21-WorkCase-工作项.md
        - specs/24-Study-研究报告.md
      expected_output: 明确 Spark/ADR/Pitfall 记录对象与 WorkCase/Study 出口的边界，形成入库/出库两种模式。
      status: done
      result_summary: |
        已形成记录对象编排边界方案：

        1. 统一行动编排的管辖对象限定为 Spark、ADR、Pitfall 三类记录对象。Spark 承载未计划化但有保留价值的输入、发现、提醒、问题、缺口和待消化议题；ADR 承载已确认且会持续约束后续执行的决策补丁；Pitfall 承载已解决、已验证且可复用的经验事实。
        2. WorkCase 和 Study 不作为同级记录对象分支。WorkCase 是明确行动承接出口，用于目标、成功标准、执行项、验证和关闭；Study 是研究行动完成后的稳定报告产物，用于调研、分析、核验或方案比较结果。
        3. 该编排应内部区分入库模式、创建前召回和出库召回，但仍保持一个成员更合适；拆成 Spark/ADR/Pitfall 三个流程会重复定义查重、冲突、Human Gate 和事实源边界。
        4. 编排只能定义 Context、Scenario、Gate、查重召回、分流判断、过程输出回写触发和失败分流；不得重新定义 20/21/22/23/24 的字段契约、状态机或实例权威边界。
        5. 知识地图和 Code 只能作为导航、召回、聚合和诊断工具；稳定事实仍以 active specs、ldvh-base 对象实例和 Git 文件事实源原文为准。
      evidence_refs:
        - specs/03-行动编排规范.md
        - specs/20-Spark-火花.md
        - specs/21-WorkCase-工作项.md
        - specs/22-ADR-决策.md
        - specs/23-Pitfall-踩坑经验.md
        - specs/24-Study-研究报告.md
        - specs/07-事实源边界与Git追溯规范.md
        - ldvh-base/sparks/spark-0028-record-object-routing-recall-orchestration.yaml
      blocking_reason: null
    - id: item-2
      title: 设计入库分流与出库召回流程
      role: orchestration-design
      mode: sequential
      input_refs:
        - specs/03-行动编排规范.md
        - specs/20-Spark-火花.md
        - specs/22-ADR-决策.md
        - specs/23-Pitfall-踩坑经验.md
        - ldvh-base/sparks/spark-0006-spark-routing-convergence-reminder.yaml
        - ldvh-base/sparks/spark-0015-reflection-record-routing-and-pitfall-boundary.yaml
      expected_output: 形成行动编排步骤、触发器、STOP 点、Human Gate、查重/合并/并列/归档/废弃规则和不入库出口。
      status: done
      result_summary: |
        已形成入库分流、创建前召回和出库召回的最小落地方案。

        入库分流闭集：
        - 不入库：当前对话即可处理、无长期复读价值、纯临时输出、与现有权威事实重复且无需补证，或未通过必要 Human Gate 的高影响结论。
        - Spark：有保留价值但尚未形成明确执行目标、长期决策、已验证经验或稳定报告的输入、发现、风险线索、缺口、偏好、提醒和待讨论议题。
        - ADR：已确认且改变长期执行方式、协作方式、事实源归属、Human Gate 边界、规范/Rules/Skill/Agent/适配措施规则，或对后续 AI/Human 有持续约束的取舍。
        - Pitfall：问题已解决、解决方式已验证、后续容易复现误判，且具备可复用规避策略和适用范围。
        - 转 WorkCase：已经有明确目标、成功标准、执行范围、验证或关闭判断，需要行动承接。
        - 触发研究行动并产出 Study：需要调研、分析、核验或方案比较，并形成稳定可读报告；Study 是研究行动产物，不是记录对象分支。Study 不应无承接对象单独存在；创建 Study 前必须召回或建立 Spark、ADR、Pitfall 承接关系。没有关联 Spark/ADR/Pitfall 时，优先创建 Spark 承接研究议题，再由研究行动产出 Study。

        创建前召回：
        1. 在新建 Spark/ADR/Pitfall 前，先按主题、对象 ID、来源、关键词、相关规范、相关 WorkCase 和关联对象搜索已有 Spark、ADR、Pitfall。
        2. 比较主题是否相同、适用范围是否相同、来源或证据是否新增、状态是否 active/pending/archived/deprecated/resolved/discarded、结论或经验是否一致，以及是否已有稳定承接事实源。
        3. 完全重复时优先更新已有对象或不入库；同主题补充新来源、证据或边界时优先合并；同主题但适用范围不同可并列；旧对象已终态时不直接重开，应新建对象并引用原对象或更新稳定承接事实源。
        4. 召回/比较不等于可作为执行依据。archived、deprecated、resolved、discarded 对象可用于追溯、避免重复和判断吸收位置，但不得直接作为当前执行依据；只有 active ADR 可作为当前优先决策补丁，只有 active Pitfall 可作为当前规避经验，pending Spark 只是待消化入口，不是已确认规则。
        5. 同主题结论冲突、与 active ADR 冲突、需要推翻核心 Pitfall 经验、改变长期规则/边界/取舍、或需要把候选升级为 ADR/Pitfall/Study/WorkCase 时，进入 Human Gate。
        6. Spark 分流、废弃或关键字段变更也必须显式评估 Human Gate，包括 pending Spark 分流为 WorkCase/ADR/Pitfall/docs/管辖项目配置，标记 discarded 且会丢失跟踪入口，修改 resolved_to、description、evolution、priority 或关键关联。

        出库召回：
        1. 当前任务涉及长期规则、边界、取舍、重复失败、工作对象创建、WorkCase 计划/关闭、修改 specs/Rules/Skill/行动编排/事实源边界时，应召回相关 ADR、Pitfall、Spark。
        2. ADR 召回后：active ADR 可作为当前优先决策补丁；archived ADR 只作追溯；deprecated ADR 不作执行依据。若当前任务需要改变 active ADR 或吸收/废弃 ADR，进入 Human Gate。
        3. Pitfall 召回后：active Pitfall 可作为规避经验；archived Pitfall 只作历史参考。若当前任务证明核心经验不再成立、需要改写根因/解决/验证/规避策略或吸收为长期规则，进入 Human Gate。
        4. Spark 召回后：pending Spark 是待消化线索和分流入口；resolved/discarded Spark 只作追溯或避免重复。若当前任务完整承接 pending Spark，应更新 evolution、关联对象和状态判断；部分承接必须保持 pending。
        5. 召回结果的处置闭集为应用、忽略并说明理由、更新/合并、归档/废弃、转 WorkCase、转研究行动、或提交 Human Gate。

        最小落地建议：
        - 不在本线程直接修改 active `specs/03-行动编排规范.md`，避免与 `workcase-0009` 同时触碰 03 的行动编排成员机制。
        - 后续宜在 30-59 新增 candidate/planned 成员主文件；`specs/03` 只需登记或引用候选/成员边界，不承载详细流程。
        - 记录对象归口、Study 研究行动产出、WorkCase 行动承接应拆为可协调的候选编排：记录对象编排负责 Spark/ADR/Pitfall 的归口与召回；Study 编排负责研究行动产物创建前的承接对象检查和 Spark 优先入口；WorkCase 编排负责行动承接、计划确认、执行、复核和关闭流转。三者先建立不激活，后续与管理类编排一起讨论是否进入 active。
        - 20/22/23/21/24 保留对象准入、状态机和字段权威；新成员只引用来源要求并编排落地。
      evidence_refs:
        - specs/03-行动编排规范.md
        - specs/20-Spark-火花.md
        - specs/21-WorkCase-工作项.md
        - specs/22-ADR-决策.md
        - specs/23-Pitfall-踩坑经验.md
        - specs/24-Study-研究报告.md
        - specs/07-事实源边界与Git追溯规范.md
        - ldvh-base/sparks/spark-0006-spark-routing-convergence-reminder.yaml
        - ldvh-base/sparks/spark-0015-reflection-record-routing-and-pitfall-boundary.yaml
        - ldvh-base/sparks/spark-0028-record-object-routing-recall-orchestration.yaml
      blocking_reason: null
    - id: item-3
      title: 执行前子 Agent 方案审核
      role: subagent-review
      mode: parallel
      input_refs:
