title: 收敛 LDVH 原生 Git 提交流程
status: open
summary: item-01、item-02 已完成；item-03 正在执行真实 Hook 事件、回归、候选审核和受控本地提交。
priority: P1
goal: 以当前 specs 为唯一权威，把受管辖项目的本地提交收敛为 AI 明确候选文件并审核对应 diff、在真实 Index 上执行必要 LDVH 机械预检、使用原生 git commit 创建本地提交、由真实 commit-msg Hook 作为不可绕过的最终闸门并在提交后回读；保持 LDVH 为源码仓库加薄 Skill 的接入方式，不引入 pip、打包或插件部署。
scope: 在现有职责体系内最小修改 specs/30，并仅在确有职责缺口时最小修改 specs/03 及其直接规范测试；specs/09 仅作为既有 common-dir Hook 和源码加薄 Skill 依据回读，不修改 00、09 或新增规范。规范先行后，精确删除旧 alternate-index 提交执行链 code/ldvh/commits/candidate_index.py、code/ldvh/commits/execution.py、其 __init__.py 导出和两份直接测试，保留 precheck.py、git_adapter.py、hooks/commit_msg.py、git_hooks/commit_msg.py、验证内核及真实事件 GIT_INDEX_FILE。补足真实 Index、无关 staged 硬停止、临时仓库真实 Hook allow/block 与回读测试。当前 common-dir Hook 只做静态只读核验，本案不部署、不替换、不修改 Hook 或 core.hooksPath。全部前置条件满足后，仅对 AI 已声明且已审核 diff 的精确候选执行一次本地原生 git commit，不使用 --no-verify，不 push。明确排除 0056 的 prepared service、token、witness、challenge、journal、持久事务状态、alternate Index 事务方案、性能预算与 linked-worktree 业务提交；排除 pip、wheel、sdist、editable install、插件部署；排除 Web 改动、spark-0037、spark-0054、workcase-0056 及执行期间出现的任何其它无关 dirty 或 staged 内容。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 03 与 30 在既有职责内明确六项最小提交要求：AI 声明候选文件并审核对应 diff、真实 Index 上的必要机械预检、本地原生 git commit、真实执行 commit-msg Hook、精确隔离且不 push、源码加薄 Skill 且无 pip/打包/插件；09 被正确引用而不复制，00 保持不变，不新增第二权威或新规范。
- criterion_id: criterion-02
  statement: 受管辖提交只使用当前真实 Index；真实 Index 必须精确等于 AI 已声明并已审核的候选。若存在无关或未知 staged 内容，流程立即停止且不得碰触、代为 unstage、覆盖或切换 alternate Index。
- criterion_id: criterion-03
  statement: 提交消息与精确真实 Index 的 precheck-git-commit 必须返回外层 ok 且机械结论 passed；不可用、失败或不可验证一律停止。当前 common-dir 中有效且可执行的 LDVH commit-msg Hook 必须在提交前静态确认；原生 git commit 不使用 --no-verify并真实触发同一校验内核，提交后完成回读；不 push。
- criterion_id: criterion-04
  statement: 仅删除 candidate_index.py、execution.py、对应 commits/__init__.py 导出及两份直接测试所构成的旧 alternate-index 执行链；不得删除合法的 candidate 术语、precheck、git_adapter、Hook 实现、验证内核或真实事件的 GIT_INDEX_FILE。
- criterion_id: criterion-05
  statement: 接入模型继续是源码仓库、薄 Skill、管辖配置与 common-dir Hook；当前产品与流程不引入 pip install LDVH、wheel/sdist、editable install、Python distribution 或插件部署。
- criterion_id: criterion-06
  statement: 定向与回归测试通过；临时 Git 仓库中的真实 commit-msg Hook allow/block 提交验证通过；最终本地提交仅包含精确候选，真实 Hook 已触发，并回读 HEAD、提交内容、Index、工作树与无关残留，确认未误带且未 push。
phase: executing
plan_version: 1
work_items:
- item_id: item-01
  goal: 先在现有规范源中固定最小原生 Git 提交契约。
  expected_result: 30 明确候选声明与 diff 审核、真实 Index 隔离、机械预检、原生 commit、真实 Hook、回读与 no-push；03 仅在必要时补足机械预检责任，09 和 00 不改，不新增规范。
  status: completed
  approach_summary: 逐段核对 03、30 与 09 的既有职责，先改 30；只有 30 无法正确引用现有 03 契约时才对 03 做最小补充，并同步直接规范测试。
  result_summary: 仅修改 specs/30-Git提交行动模板.md 及直接行动模板测试：明确 AI 候选文件与逐文件 diff 审核、真实 Index 精确匹配、无关 staged 硬停止、受管辖预检 fail-closed、有效 common-dir Hook 前置、不带 --no-verify 的原生 git commit 真实触发与提交后回读；03 已完整覆盖真实 Index 预检和同核 validator，09/00 保持不变。定向规范测试 18 passed，diff check 通过。
- item_id: item-02
  goal: 删除旧两阶段方案遗留的 alternate-index 提交执行链并收敛代码路径。
  expected_result: 精确删除 candidate_index.py、execution.py、对应导出与直接测试；保留真实 Index precheck、Git adapter、Hook 和验证内核，代码只表达规范要求的最小路径。
  status: completed
  depends_on:
  - item-01
  approach_summary: 按明确文件清单做最小清理，先检索引用再删除，不做泛化重构，不因文件名中的 candidate 或 GIT_INDEX_FILE 误删合法能力。
  result_summary: 精确删除 code/ldvh/commits/candidate_index.py、execution.py、对应 commits/__init__.py 导出，以及 code/tests/commits/test_candidate_index.py、test_commit_execution.py；全仓 Code 中旧 prepared/alternate-index 执行符号引用清零。保留 precheck.py、git_adapter.py、validation.py、Git Hook 实现及真实事件 GIT_INDEX_FILE；commits、Helper precheck 与 Hook 测试分片通过，diff check 通过。
- item_id: item-03
  goal: 验证最小流程并在硬前置条件全部满足时创建一次受控本地提交。
  expected_result: 定向和回归测试通过；当前 Hook 静态状态可证；临时仓库真实 Hook allow/block 成立；真实 Index 精确等于候选、precheck passed 后，原生 git commit 真实触发 Hook，提交后回读通过且无 push、无误带。
  status: in_progress
  depends_on:
  - item-02
  approach_summary: 先测试和只读核验，再明确最终候选文件及逐文件 diff；任何无关 staged、precheck 异常或 Hook 缺失、冲突、不可确认都硬停止。本项不部署 Hook，也不在 linked worktree 创建业务提交。
  current_summary: 规范和旧执行链清理已完成并回读；开始补充临时仓库真实 git commit Hook allow/block 测试，随后执行回归和当前 common-dir Hook 静态核验。
  resume_from: 先新增并运行真实 git commit 触发 commit-msg Hook 的 allow/block 回归。
execution_authorization:
  authorized_actions:
  - action_id: authorization-specs-write
    summary: 按 plan_version 1 最小修订原生 Git 提交规范。
    target_scope: specs/30；仅必要时 specs/03；二者直接规范测试。00、09 和其它规范只读。
    effect_scope: 当前 ldvh worktree 内的规范与直接规范测试。
    risk_summary: 职责重复或表述外溢会重新引入第二权威。
    rollback_summary: 按精确 diff 撤销本行动新增的规范和测试变更，不碰触既有用户改动。
    rule_refs:
    - specs/03-验证检查项.md
    - specs/09-Git Hook 规范.md
    - specs/30-受控提交与回读.md
  - action_id: authorization-code-cleanup
    summary: 精确清理旧 alternate-index 提交执行链并调整直接测试。
    target_scope: candidate_index.py、execution.py、commits/__init__.py 对应导出、两份直接测试，以及现行真实 Index/Hook 契约所需的直接测试。
    effect_scope: 当前 ldvh worktree 内被列明的 Code 和 tests。
    risk_summary: 过宽清理可能误删合法 precheck、Hook 或事件 Index 能力。
    rollback_summary: 恢复本行动精确删除或修改的文件与导出，不恢复 0056 两阶段设计。
    rule_refs:
    - specs/03-验证检查项.md
    - specs/30-受控提交与回读.md
  - action_id: authorization-validation
    summary: 运行规范、Code、Git 与 Hook 的必要验证。
    target_scope: 相关 specs tests、commits/Hook 单元与集成测试、临时 Git 仓库真实 Hook allow/block 提交；当前 common-dir、Hook 和 core.hooksPath 仅静态只读检查。
    effect_scope: 测试临时目录及当前仓库只读观察；不得修改当前 Hook 配置或部署状态。
    risk_summary: 把直调 Hook 或静态检查误当真实提交证据会形成假通过。
    rollback_summary: 清理测试临时资产；当前仓库与 common-dir 不应产生需回滚的部署变化。
    rule_refs:
    - specs/03-验证检查项.md
    - specs/09-Git Hook 规范.md
    - specs/30-受控提交与回读.md
  - action_id: authorization-fact-checkpoints
    summary: 通过 Helper 更新并回读 workcase-0057 生命周期检查点。
    target_scope: 仅 ldvh/workcase/workcase-0057。
    effect_scope: workcase-0057 canonical 事实文件及其 Helper 校验结果。
    risk_summary: 错误投影可能使计划、执行或结果状态失真。
    rollback_summary: 通过 Helper 的合法更正路径修正 workcase-0057，不直接编辑事实文件。
    rule_refs:
    - specs/21-WorkCase-工作项.md
    - fact-object-controlled-creation
  - action_id: authorization-local-commit
    summary: 在全部硬前置满足后创建一次本地原生 Git commit 并回读。
    target_scope: 仅 workcase-0057 及规范写入、代码清理实际产生且由 AI 明确声明并审核 diff 的精确候选文件。
    effect_scope: 当前 ldvh Git worktree、真实 Index 和一个本地 commit；不 push。
    risk_summary: Index 污染、Hook 未真实执行或回读不充分会误带内容或绕过最终闸门。
    rollback_summary: 提交前失败保持零提交且不改动无关 staged；提交创建后的异常不自动 amend、reset 或重试，先回读并交还 Human。
    rule_refs:
    - specs/03-验证检查项.md
    - specs/09-Git Hook 规范.md
    - specs/30-受控提交与回读.md
  - action_id: authorization-bounded-delegation
    summary: 委派边界明确的只读调查与独立结果审核。
    target_scope: workcase-0057 的规范、实现、验证和结果投影。
    effect_scope: 只读 subagent 分析与审核结论。
    risk_summary: 委派本身不证明独立性，也不授权被委派者扩大写入范围。
    rollback_summary: 不采纳不合格结论并重新安排合格独立审核。
    rule_refs:
    - specs/21-WorkCase-工作项.md
  - action_id: authorization-independent-result-review
    summary: 对完整结果投影执行独立只读审核。
    target_scope: workcase-0057 的完整 result_version、证据、残留与授权合规性。
    effect_scope: 独立只读审核记录；不自动改变 Controller 结论。
    risk_summary: 审核遗漏可能让未满足标准进入关闭提案。
    rollback_summary: Controller 拒绝不充分审核并补充验证或重新委派。
    rule_refs:
    - specs/21-WorkCase-工作项.md
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-bounded-delegation
    result_review_action_id: authorization-independent-result-review
  action_ceiling: 仅限 plan_version 1 明列的规范最小修订、精确旧代码清理、必要测试与只读 Hook 核验、workcase-0057 Helper 生命周期写回，以及硬前置全部满足后的一个本地原生 commit；Human Gate 1 批准前不得执行这些计划行动。
  prohibited_actions:
  - 修改 00、09、创建新 spec 10 或授权附件，或恢复 0056 的两阶段规范与实现。
  - 实现 prepared service、候选 token、witness、challenge、journal、持久事务状态、alternate Index、提交事务或性能预算。
  - 部署、替换、删除或修改当前 Git Hook，修改 core.hooksPath，或使用 --no-verify。
  - 修改、stage、unstage 或 commit spark-0037、spark-0054、workcase-0056、Web 改动或执行期间出现的任何其它无关 dirty/staged 内容。
  - push、PR、amend、reset、rebase、merge、cherry-pick、tag、release、远端写入或外部消息。
  - 对 LDVH 执行 pip 安装、editable install、wheel/sdist 打包、Python distribution 或插件部署。
  allowed_adjustments: 允许在不扩大目标、文件类别、外部副作用或授权上限的前提下调整测试命令、精确引用位置和小型实现细节；任何新增规范、Hook 部署、额外事实对象、扩大删除范围或不同提交模型必须返回 Human 重新授权。
  verification_and_rollback: 每项先检查 diff 与现有无关改动；最终提交前静态确认 common-dir Hook 有效可执行，真实 Index 精确等于 AI 声明候选且无未知 staged，precheck-git-commit 对同一消息和 Index 返回 ok/passed；随后原生 git commit 真实触发 Hook并回读。提交前失败仅撤销本 WorkCase 自有变更或停止，不碰无关内容；提交后异常不自动改史。
  out_of_bounds_handling: 立即停止，保持无关改动和 Git 状态不变，记录精确缺口并返回 Human 决定。
  human_prerequisites:
  - Human Gate 1 明确批准 plan_version 1 后方可开始 item-01。
