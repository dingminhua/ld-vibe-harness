title: 修正 WorkCase 独立审核反馈与关闭控制权
status: closed
summary: Human 已批准当前完整结果和关闭报告；workcase-0002 正式关闭。
goal: 使 WorkCase 独立审核只提供第二视角、问题和建议，由 Controller AI 独占反馈处置、结果版本、复审、阶段推进与进入 Human
  关闭确认的判断，并由 Human 对当前结果和报告作最终关闭决定。
scope: 修复仅覆盖
  specs/21-WorkCase-工作项.md、code/ldvh/facts/validation.py、code/ldvh/facts/transitions.py，以及与该状态机直接相关的
  code/tests/facts/test_validation.py、code/tests/facts/test_transitions.py 和必要的
  code/tests/helper/test_fact_update_operation.py。workcase-0002.yaml
  仅作为本案受控流程记录创建和更新，不属于实现修复范围。保留 specs/21 中 workcase-0001 已产生的既有 Working Tree
  修改。明确排除 00、其它 specs、其它 facts 模块、Helper API/Schema、Web、行动模板、workcase-0001、任何
  Spark、一般 Git/Working Tree 语义与 plan_version 机制重构；不 commit、push 或创建 PR。
success_criteria:
- 规范明确 Independent Reviewer 只提供咨询性判断，Controller AI 逐项处置反馈并独占是否复审、返回何阶段、进入关闭准备及
  Human Gate 的判断，Human 保留最终关闭决定。
- validation 只检查字段、枚举、阶段条件、版本、引用与时间绑定；四类 review conclusion 均不自动推进或阻断，同时 review 和
  controller_resolution 仍保持结构完整。
- transitions 不再根据普通结果字段差异裁决 result_version；Controller 可在处理审核反馈后选择
  executing、controller_checking、继续或再次
  independent_reviewing、closure_preparing，且首次 controller_checking 不能绕过实际独立审核。
- closure_preparing 可在同一 result_version 下新增或完善验证总结、关闭分类、处置、关系与证据而不自动使已有 review
  失效；Controller 主动升版时，审核和批准只能绑定新版本。
- human_closure_confirming 只有在 Controller 形成完整报告并主动转换后成立；Human closure_approval
  必须绑定当前 result_version，并与 status/phase=closed 在同一受控更新中写入。
- 直接单元测试和 Helper 更新测试覆盖四类审核结论、Controller 四类选择、审核记录来源与字段所有权、首次不得跳审、返回
  executing、显式升版、关闭报告不失效 review、完整报告门槛及 Human 原子关闭；聚焦验证与 full-v4 通过。
- 除限定实现与测试文件和本 WorkCase 流程记录外不产生修改；workcase-0001、Spark、既有 Working Tree 修改与 Git
  远端状态保持不变。
