id: workcase-0087
type: workcase
title: 收敛事实模型与行动编排命名职责
goal: 将 LDVH 中“工作模型 / 工作流程”的边界收敛为“事实模型 / 行动编排”的职责表达，并评估 05 系列子文档去除重复体系前缀、06 与 40-59 行动编排总协调职责、相关术语和引用的同步修改方案。
status: human_closure_confirming
created: '2026-06-21T20:20:31+08:00'
updated: '2026-06-21T22:30:56+08:00'
priority: P1
description: |
  当前讨论形成新的命名和职责判断：LDVH 中 20-39 更准确地表达为“事实模型”，用于定义什么事实值得长期承载，以及字段、状态、关系和事实源边界；40-59 更准确地表达为“行动编排”，用于定义 AI 如何围绕事实和规范行动，协调规则、能力资产、环境接入、Human Gate、验证、回写和降级。

  因此，工作流程主文件不宜再被理解为“薄入口”。“薄入口”容易把工作流程误读成跳转页、索引页或能力资产 wrapper。更合适的定位是：每个行动编排主文件承担总协调职责，承上接住来源规范的规则、边界和保障要求，启下协调 Skill、Code、Hook、Web、Agent、环境适配和 Human Gate，并横向声明与事实模型、相邻行动编排和事实源的边界。

  同一讨论中还形成了 05 系列命名方向：05 体系已经表达事实模型归属，05.01 / 05.02 / 05.03 子文档标题不必重复“工作模型字段”前缀，可考虑收敛为“字段定义与语义规范”“字段内容与格式规范”“字段注册与消费规范”等职责型标题。该方向需要在正式修改前评估术语、文件路径、canonical_path、Code 解析、Web 链接、Rules 路由和历史事实边界。

  本 WorkCase 只承接方案化和后续执行治理，不代表相关规范已经改名。正式修改前需要 Human 确认方案、范围、迁移策略和验证要求。
success_criteria: |-
  - [x] 明确“事实模型”和“行动编排”的定义、适用边界、与现有“工作模型 / 工作流程”术语的关系，以及是否采用一次性改名或渐进别名策略
  - [x] 梳理受影响规范：至少覆盖 00、01、02、03.02、03.03、05、05.01、05.02、05.03、06、20-24、40-43、04 系列、07、08、09、10、11
  - [x] 评估 05 系列子文档去除重复父体系前缀的命名方案、文件路径方案、canonical_path 迁移方案和历史引用保留边界
  - [x] 评估 06 与 40-59 是否从“工作流程”表述收敛为“行动编排”，并明确每个行动编排 md 的总协调职责
  - [x] 明确 Code、Web、Rules、Skill、Hook、测试和事实源实例需要同步的引用、解析、展示、校验和部署检查入口
  - [x] 修改前完成 Human Gate：确认术语变更范围、是否重命名文件、是否保留旧术语别名、是否同步 Web 文案和 Code 输出
  - [x] 执行后通过 specs 综合校验、事实源校验、相关 Python 测试、Web 检查、旧术语/旧路径残留扫描和提交信息预检
  - [ ] 关闭材料记录未改名或保留旧术语的原因、残留风险、后续 WorkCase / Spark 分流和 Git 提交追溯边界
source: |
  用户在围绕 40/41 派生型审核流程与能力资产边界的讨论中进一步指出：
  - “工作流程薄入口”表述不合适，更准确的是工作流程的“总协调”，每一个工作流程 md 的职责是协调、承上启下；
  - “事实模型”和“行动编排”比“工作模型”和“工作流程”更合适；
  - 05 系列的子文档也可以不需要重复父体系前缀，应该强调在 05 体系下的职责。

  Human Gate 记录：
  - 触发原因：创建 WorkCase、后续可能修改正式规范命名、canonical_path、术语和 Code/Web/Rules 展示，属于高影响规范治理变更。
  - 确认依据：用户明确回复“嗯，按这个方向建立workcase吧”。
  - Human 决策：允许创建本 WorkCase 承接方案审核、执行确认、后续修改和关闭确认。
