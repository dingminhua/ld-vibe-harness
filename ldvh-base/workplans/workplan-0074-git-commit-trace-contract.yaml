      - description、body 和 footer 值使用简体中文，机器至少检查中文字符和结构字段，简繁准确性由 Human 审查兜底，除非另行定义可靠检测规则；
      - `Refs:`、`Human-Gate:`、`Verification:`、`Risk:` 不作为 LDVH 固定 footer 字段，提交追溯由 Git 历史、对象 ID、路径和必要 diff 派生；
      - 提供正反样例并更新测试。
    status: done
    result_summary: commit_validate 已对齐 10，提交类型、可选 scope、breaking 标记、简体中文要求和固定 footer 禁用规则已更新。
