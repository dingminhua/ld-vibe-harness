summary: "**当前判断**\n\n- 单页抓取、站点遍历、URL 发现、搜索和结构化抽取是不同操作，分别存在认证、限流、超时、空结果、成本、数据处理、robots 与许可证边界。\n- 网页发现和获取不等于事实成立；Markdown、JSON、摘要和模型抽取都是可变外部输入或派生产物，必须回指原始 URL、观察时间和实际结果，并由 AI 按 Study 规则判断。\n\n**必要的证据与限制**\n\n- 若使用外部网页能力，请求、原始响应、解析产物、来源 URL、观察时间、工具版本、失败和限制必须分开保留；429、超时、空响应或局部结果只能报告未知、不完整或失败。\n- 先判断现有浏览器、官方文档访问和普通联网研究是否确实无法满足证据场景；只有存在缺口才选择单页获取、搜索、站点发现或受限 crawl，并明确服务对象。\n- 需要处理来源 manifest、缓存/去重、敏感信息、域名/页数限制、credits 预算、密钥、robots、站点条款、许可证、失败语义、人工复核与验证范围。\n\n**边界**\n\n- 外部抓取服务不是 LDVH core、事实读取、规范解析或验证的硬依赖；不得默认大范围 crawl，也不得把密钥、cookie、授权头或私有内容写入 Git。\n- Firecrawl 只是候选 provider。本 Spark 不授权安装、注册 MCP、购买服务或自托管。"
