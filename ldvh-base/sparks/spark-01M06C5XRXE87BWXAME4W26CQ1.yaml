title: AI 反馈与交互改进
status: open
priority: P3
intent: 收集和追踪 AI 在使用 LDVH 过程中发现的交互摩擦、效率瓶颈与改进机会，形成可执行的改进候选。
summary: "## 当前状态\n\nAI 在通过 Helper CLI 交互时发现以下问题，需纳入治理：\n\n### 1. 输入契约摩擦\n- `call` 子命令的 stdin 传入请求格式不被接受，必须 `--request <file>` 传入；但 `invalid_request` 错误提示 `\"arguments.fact_refs 必须是包含 1–128 项的 array\"`，误导调用方以为是参数格式问题，未指明正确传入方式\n- `--fields` 数组内字段选择（已有实现）在 `read-fact-objects` 组合同样报 missing，实际可用但需配合 `--request` 而非 stdin\n\n### 2. 操作反馈不一致\n- `find-fact-object-candidates` 在参数错误时仅返回 `exit code 5`，无结构化错误信息、无 stderr，调用方无法自纠\n- 相比 `read-fact-objects` 的 `gaps`/`diagnostics` 反馈，此操作的无反馈是明显落差\n\n### 3. 发现入口过重\n- `capabilities` 全量输出 50KB+ 被截断，渐进式发现负担重\n- 缺少单操作轻量明细的中间档（介于全量 capabilities 和 --example 之间）\n\n### 4. 关系查询跨一跳成本高\n- relations 仅存 `object_uid`，不存 `fact_type_key`/`object_id`，跨一跳需再解析才知道指向什么\n\n### 5. 无就绪状态机械信号\n- Spark 是 open/P2 还是 implemented、候选是否达到立项门槛，全靠人读语义+人工对齐姊妹对象，无状态机/候选队列提示\n\n## 待判断问题\n\n- 哪些摩擦在真实多agent会话中稳定出现，值得形成窄 WorkCase；\n- 契约提示优化的边际成本与收益是否支持实施；\n- 是否需要在 CLI 层面统一错误反馈格式。\n\n## 边界\n\n- 不替代 Helper 服务规范（04）的正式契约变更；\n- 窄 WorkCase 优先于全量重写；\n- 与其它 Spark 的 relation 仅追溯共同线索，不创建重复条目。\n\n### 6. 创建过程本身就是现场证据\n\n本 Spark 在创建过程中暴露了它要记录的问题 #1（输入契约摩擦）：\n\n- 第 1 轮：`fact_type_key` 和 `governed_project_id` 放在顶层 arguments 而非 `draft_basis` -> invalid_request\n- 第 2 轮：`model_name: \"\"` 空字符串不合契约（须非空 string 或 null）-> invalid_request\n- 第 3 轮：缺首条 change_log -> rejected\n- 第 4 轮：成功\n\n每次错误提示的 gap 准确，但没有一条给出你应该先调 `prepare-fact-object-draft` 拿到指纹、再合入 `draft_basis`、再补充 `observed_context.signature` 的完整导航。AI 需要自己拼装信息，知识分散在 capabilities、specs 和逐步暴露的错误提示中。\n\n**结论**：创建这个 Spark 的过程，比它的内容更能说明问题。该摩擦证据可作为 #1 的真实任务案例，支持后续窄 WorkCase 立项判断。\n\n### 7. 后续操作中的附加摩擦（2026-08-17 更新环节发现）\n\n本 Spark 在更新过程中暴露出更多交互摩擦，记录如下：\n\n**a) 操作结果确认信息不足**\n- 第一次 `update-fact-object` 实际已成功（outcome=ok），但用 `jq .result.post_update_fingerprint` 提取到 null（正确字段名为 `content_fingerprint`），导致误判为失败，重复执行了一次完整更新\n- 后果：supplement 内容重复，change_log 永久多出一条无效流水（§11.7 禁止删除历史流水）\n- 根因：`capabilities --example` 只给出 request 形状，不给出 response 字段闭集；调用方需查阅 specs/05 §11.7 的\"领域 result 字段闭集\"才能知悉合法字段名，信息获取链条长\n\n**b) 错误提示\"最后一公里\"缺失**\n- 所有 gap 提示准确指出\"什么错了\"，但从不指明\"下一步怎么做\"\n- 例如：`arguments 包含未知字段: xxx` 未提示\"这些字段应放入 draft_basis 中\"\n- 例如：`内容指纹已经过期` 未提示\"重新读取对象获取最新指纹再重试\"\n- 差的那一步正是 AI 最需要的——不是错误诊断，而是修复路径\n\n**c) model_name 的哲学悖论**\n- 系统提示中可观察到模型名（如 deepseek-v4-flash），但 LDVH 署名规则要求\"AI 只可使用按角色直接声明的信息\"\n- 系统提示算不算\"直接声明\"？边界模糊，保守选择 null 导致每次流水签名缺 model_name\n- 每次写入前 AI 都要做一次哲学判断，而非机械执行\n\n**d) 不可删除历史流水的纪律成本**\n- §11.7 规定\"已有流水仍必须保留完整前缀并恰追加一条\"，禁止删除或修改历史流水\n- 这保证了审计完整性，但代价是操作失误（如 a）造成的冗余永久保留\n- 本 Spark 的 change_log 中两条重复的 content_update 流水是这一 trade-off 的实例\n\n**结论**：这些摩擦与本 Spark 记录的 #1（输入契约摩擦）和 #5（操作反馈不够清晰）同源——LDVH 选择了\"机械可审计、不可篡改、严谨验证\"的路线，代价是交互重、执行门槛高、犯错成本大。本 Spark 自身的存在就是 LDVH 承认这一 trade-off 值得被追踪和改进的证据。\n\n### 8. 提交流程中的附加摩擦（2026-08-17 受控提交发现）\n\n本 Spark 在受控提交过程中暴露了更多交互摩擦，记录如下：\n\n**a) 提交模板信息过载**\n- git-commit 行动模板约 200 行，但 AI 必须完整读完才能开始执行\n- 大量内容与本次场景不相关（WorkCase 授权判断、拆分政策、push/PR 排除等），但 AI 无法提前预判哪些适用\n- \"先读完整模板再执行\"对高频提交场景偏重\n\n**b) 操作输入契约不一致**\n- `precheck-git-commit` 要求 `work_object_locators`（绝对路径），但同一条 worktree 的 `read-fact-objects`、`update-fact-object`、`check` 都不要求此参数\n- 不是不合理，但规则不统一，每次调用需猜测\"这个操作还缺什么\"\n\n**c) Hook 状态检查工具链不完整**\n- 模板要求 B-8 重新核对 Hook \"有效、可执行、无冲突\"\n- `git-hooks-status` 的 `result.deployment_status` 返回 null，无法直接消费\n- 只能回退到 `ls .git/hooks/commit-msg` + `head -5` 人工判断，最后一步靠人工信任而非工具确认\n\n**d) 署名 trailer 的 null 格式边界不明确**\n- `LDVH-Model-Name: null` 的写法是否合法？Git trailer 消费者能否解析 null 字面量？\n- 其他 commit 写的是 `deepseek-v4-flash` 等实际模型名\n- 规则说\"非空 string 或 null\"，但 Git trailer 的书写约定无明确规范\n\n**e) 重新核对 scope 不明确**\n- 模板要求多次\"重新核对\"（B-8、C-3），但每次 scope 未说明\n- 安全做法是全重读，但成本未量化；部分重读有遗漏风险\n- 没有\"从这个状态到提交完成\"的逐步指引管线，信息分散在模板、precheck 格式、Hook 状态、署名格式中\n\n**结论**：提交流程整体走得通，每一步有依据。摩擦集中在信息散布太散——模板、precheck 格式、Hook 状态、署名 trailer 格式每样都要单独查，没有一条端到端的指引管线。\n\n\n### 9. 实测数据与过时声称更正（2026-08-17 Helper 实测）\n\n对本 Spark 记录的摩擦项进行了一次真实 Helper CLI 实测（worktree: thoughtful-babbage，Python 3.12.13 venv，ruamel.yaml 已就绪）。结论如下，用于更正过时声称并补全量化数据。\n\n#### 9.1 #3 发现入口过重 — 已补全量化数据\n\n- `ldvh capabilities`（全量）实测 **69347 字节**（formatted JSON），含 **26 个公开操作**。\n- 单操作平均约 2490 字节；最大 `find-fact-object-candidates` 4753 字节、`update-fact-object` 4749 字节；最小 `read-action-template-candidates` 1356 字节。\n- `ldvh capabilities <operation_key> --example` 实测返回 **约 1544 字节**，但**只给 request 形状，不给 response 字段闭集**（keys: operation_key/request/required_input_paths/composition_note/source_refs）。\n- **结论**：#3 的核心量化成立——全量 68KB 确实重，且介于全量 capabilities 与 `--example` 之间确实缺一个\"单操作明细 + response 字段闭集\"的中间档。这一中间档同时治 #7-a（response 字段名不可知导致重复执行）。建议窄 WorkCase 同时覆盖：单操作轻量明细 + response 字段闭集披露。\n\n#### 9.2 #1 输入契约摩擦 — 部分过时，需更正\n\n- **更正**：`call` 子命令的 stdin 现在可接受合法请求。实测 `echo '{...valid...}' | ldvh call read-fact-objects` 返回 `outcome: ok` 并成功读到对象。原文\"必须 `--request <file>` 传入\"的绝对化声称**已过时**。\n- **仍成立**：当 `--request` 与非空 stdin 同时使用时，错误提示为\"`--request 不得与非空标准输入同时使用`\"，准确但不指明\"二选一\"的修复路径。\n- **仍成立**：参数错误时的 `invalid_request` 提示确实存在误导风险——例如 `read-fact-objects` 报\"`arguments.fact_refs 必须是包含 1–128 项的 array`\"，未指明应通过 `--request` 或 stdin 传入完整请求；调用方仍需自行拼装\"先 capabilities --example 拿形状、再组 request\"的路径。\n\n#### 9.3 #2 操作反馈不一致 — 部分过时，需更正\n\n- **更正**：`find-fact-object-candidates` 在参数错误时**不再仅返回 exit code 5 无反馈**。实测无参调用返回结构化 `invalid_request`，含 `gaps`（2 条）、`diagnostics.details.problems`，以及 **`hints`**（missing_required_inputs / allowed_inputs / minimal_examples 三类）。\n- **更正**：它的错误反馈现在与 `read-fact-objects` 一致，原文\"明显落差\"的声称**已过时**。\n- **仍成立**：`gaps`/`hints` 准确指出\"什么错了\"，但 `follow_up` 恒为\"当前响应没有能够由 Helper 明确的专属后续信息\"——**不指明下一步修复路径**（#7-b 原文成立）。\n- **新发现**：`invalid_request` 的进程退出码实测为 **exit 2**（原文称 exit 5）。调用方若按 exit code 分支需更新预期。\n\n#### 9.4 #4 关系查询跨一跳成本高 — 比原文更严重，升级\n\n- **原文**：relations 仅存 `object_uid`，不存 `fact_type_key`/`object_id`，跨一跳需再解析。**实测确认且更严重**：\n- `read-fact-objects` 的 relation target 确实只含 `object_uid`（`{\"relation_key\":\"related-to\",\"target\":{\"object_uid\":\"01a00bd0-...\"}}`）。\n- **关键发现**：`read-fact-objects` 的 `fact_refs` **不接受 `object_uid`**——必须提供 `fact_type_key` + `object_id`。但 relation target 只有 `object_uid`，没有 `fact_type_key`/`object_id`，因此**无法直接用 read-fact-objects 解析跨一跳目标**。\n- 实测 `find-fact-object-candidates` 的 `relation_targets`/`relation_source_refs` 接受 `object_uid`，但 `relation_targets`（正向）实测返回 0 候选；`relation_source_refs`（反向）能找到 1 个对象（确认 01a00bd0 指向 spark-01KZXN5TXNEKNA5YCZ62F8BM0K），但要求调用方**预先指定 `fact_type_keys`（1–6 项）**才能扫描——仍需猜测目标类型。\n- **结论升级**：#4 不是\"成本高\"，而是\"正向跨一跳在当前公开操作下**无机械路径**\"——除非调用方已知目标 fact_type_key 并用 `relation_source_refs` 反向查，或穷举所有 fact_type_keys。建议从\"成本优化\"升级为\"schema/操作缺口\"，作为 Study 立项（不改 04 正式契约，先评估：①relation target 补存 fact_type_key 的迁移成本；②或新增按 object_uid 直查的只读操作）。\n\n#### 9.5 推进路径更新\n\n基于实测，原推进建议更新为：\n1. **窄 WorkCase（合并）**：统一结构化错误 `follow_up` 修复路径提示 + `capabilities` 中间档（单操作明细含 response 字段闭集）。一个 WorkCase 同时治 #2 残项、#7-a、#7-b、#3。\n2. **Study**：#4 关系跨一跳 schema/操作缺口，评估 relation 补存 fact_type_key vs 新增 uid 直查操作的 trade-off。\n3. **暂缓**：#5 状态机，等交互层治好再谈。\n4. **更正归档**：#1/#2 的过时声称已在本次实测中更正，不再作为立项依据；其残项（follow_up 修复路径提示）并入窄 WorkCase。\n\n### 10. 推进决策：遵守上位 Spark 证据门槛，登记证据点暂不立项（2026-08-17）\n\n本 Spark 第 9 节实测后，原本计划直接立项窄 WorkCase（统一 `follow_up` 修复路径提示 + `capabilities` 中间档含 response 字段闭集）。但在立项前召回查重发现：\n\n**上位承接关系**：本 Spark 的 relation target（`01a00bd0-...` = `spark-01KZXN5TXNEKNA5YCZ62F8BM0K`「LDVH 面向 AI 的服务质量评估与持续改进」，status=implemented）已明确设立**证据门槛**：\n\n- 已交付基础包括「invalid_request 结构化修正提示」「CLI --request、--example、--fields 已交付」「read→update 最小桥接」——即本 Spark 第 9 节实测确认的 #1 残项（stdin 可用、--request/--example 已交付）与 #2 残项（结构化 gaps/hints 已交付）**上位 Spark 已记录为已交付**。\n- 上位 Spark 明确规定：「只有具体 operation 在可比较真实任务中出现稳定过量、额外回读或修复成本时，才形成范围匹配的候选」「后续读/写交互优化……先由本 Spark 的证据门槛判断是否值得形成窄 WorkCase」。\n- 其证据方法要求 **40 个固定模型会话的 Phase 1/Phase 2 对照基线**与 **12 对固定模型知识预检**，区分 comparable / not_comparable / inconclusive。\n\n**本实测的门槛位置**：第 9 节实测是 **N=1 单会话、单模型（glm-5.2）**，不构成上位 Spark 要求的可比基线，**不达立项门槛**。强行立项会违反上位 Spark 已设立的证据纪律。\n\n**登记的两个证据点（供未来跨会话证据收集对齐）**：\n\n1. **response 字段闭集缺失**（#7-a / #3 残项）：`capabilities <op> --example` 实测只返回 request 形状（keys: operation_key/request/required_input_paths/composition_note/source_refs），**不返回 response 字段闭集**。实测中 `update-fact-object` 成功响应的 result keys 为 actual_ref/canonical_path/carrier/previous_content_fingerprint/content_fingerprint/fact_object——但这些字段名无法在调用前从 `--example` 得知，导致调用方需读 specs/05 §11.7 的\"领域 result 字段闭集\"才能预知合法字段名（Spark #7-a 记录的 `post_update_fingerprint` vs `content_fingerprint` 误判即由此而来）。\n   - **未来证据收集对齐点**：在跨模型会话中观测\"调用方是否因字段名不可知而产生重复执行或误判\"，积累到上位 Spark 的 40 会话基线后再判断是否达立项门槛。\n\n2. **relation 正向跨一跳无机械路径**（#4 升级项）：relation target 仅存 `object_uid`，`read-fact-objects` 的 `fact_refs` 不接受 `object_uid`（必须 fact_type_key+object_id），`find-fact-object-candidates` 的 `relation_targets`（正向）实测返回 0 候选，`relation_source_refs`（反向）可查但需预猜 fact_type_keys。\n   - **门槛位置判断**：此项是**操作/schema 缺口**而非\"交互过量/回读成本\"，性质不同于上位 Spark 的读写交互优化范畴；它指向 04/05 的存储 schema 或新增只读操作。**上位 Spark 的 40 会话证据门槛不直接适用**于 schema 缺口判断。\n   - **推进形态**：作为 **Study 候选**登记，不走 WorkCase 证据门槛。Study 评估两个方向：①relation target 补存 `fact_type_key` 的存量迁移成本；②新增按 `object_uid` 直查的只读操作（不改 schema）。Study 立项门槛是\"可行性评估需求\"而非\"跨会话可比基线\"。\n\n**当前推进结论**：\n- 窄 WorkCase 暂不立项，遵守上位 Spark 证据门槛。本 Spark 第 9 节实测作为 N=1 证据点归档，待跨会话/跨模型证据积累。\n- Study 候选（#4 relation 跨一跳 schema/操作缺口）单独登记，其门槛不适用 40 会话基线，按 Study 立项判断。\n- #5（状态机）维持暂缓，等交互层证据成熟后再评估。\n\n### 11. #7-c 更正：系统提示给出的身份是直接声明，不是推导（2026-08-17 规范核验后）\n\n本 Spark 第 7-c 节原把「系统提示可见 glm-5.2，但算不算直接声明」列为「哲学悖论」，并称「保守选择 null 导致每次流水签名缺 model_name」「每次写入前 AI 都要做一次哲学判断」。**经核验 03 §9 与 05 §11.0 原文，此定性错误，更正如下。**\n\n#### 11.1 规范原文已明确支持直接采用\n\n- **05 §11.0 第 3 条**：宿主系统提示明确以显示名描述当前交互载体时，该显示名可作为对应字段的**直接声明**；「AI 不应要求该信息必须以特定格式标签（如 `product_name: X`）出现才视为声明」。本会话系统提示写明 \"powered by the model glm-5.2\"，这正是 `model_name` 的直接声明，可直接采用，无需哲学判断。\n- **05 §11.0 `model_name` 定义**：「本次会话可观察到的模型或配置模型名称，保留其可观察拼写」。系统提示给出的 glm-5.2 即当次可观察模型名。\n- **05 §11.0 示例表第一行**：「桌面端托管 Claude Code 运行时 → `product_name=Cindy`、`model_name=glm-5.2`、`agent_runtime_name=claude-code`」——与本会话承载关系一致，证明三字段均可从当次系统提示直接观察取得。\n- **03 §9**：「产品接入面只负责提供快照，LDVH 不推断产品、模型或运行时」——系统提示提供模型名是「提供快照」，AI 把它填入署名是采用快照，不是推断。\n\n#### 11.2 #7-c 不是真实规则缺口，是误读规则的自找摩擦\n\n- 03 §9 与 05 §11.0 禁止的是「**在产品、模型、运行时之间互相推导**」（例如从 product_name=Cindy 推 model_name 该是什么，或从历史 change_log 的 null 推当次也该是 null）。\n- 从**当次系统提示直接取值**方向相反，规则本就允许。原 #7-c 把「直接采用」误当成「推导」，过度保守选 null，是误读规则造成的自找摩擦，不是真实边界模糊。\n- 本会话第 9、10 节两次写入均已填 `model_name: glm-5.2` 并通过 `check_status=mechanically_valid`——机制本就采用，不是「现在不算采用」。\n\n#### 11.3 与签名 Spark（spark-01M064X95QEATV171W720V4A4J）的关系\n\n- 签名 Spark 覆盖两条轴线：①可观察性不均（点名 DSH 的 `agent_runtime_name`）；②**从历史 change_log 跨角色推导当次署名**（违反 03 §9 / 05 §11.0，已在 05.Att.01 read guardrail 收紧）。\n- 本 Spark #7-c 是**从当次系统提示直接取值**，方向与签名 Spark 第②条相反，不是同一问题，也不是签名 Spark「未覆盖的第三轴线」——它是误读，本无缺口。\n- 唯一残项：规则文本已支持直接采用，但早先 AI 仍误读为推导。这是文档清晰度的小改进机会（可考虑在 05 §11.0 补一句明确「产品接入面/系统提示当下给出的身份快照即可直接采用，无需哲学判断」），不是立项级缺口，不单独形成 WorkCase。\n\n#### 11.4 与签名 Spark 建立直接关系\n\n本 Spark 原仅与上位「服务质量评估」Spark 有 relation，与同家族的签名 Spark 无直接 relation。本次更正后补登一条 `related-to` 指向签名 Spark，使三字段署名家族线索可追溯。"
