summary: 将 ldvh-base 回退为项目内部目录，规定每个管辖项目各自拥有 base
reason: >
  ADR-001 将 ldvh-base 提升至工作区根目录的决策有误。ldvh-base 的内容虽然关联到管辖项目，
  其生产者和归属者仍然是 LDVH 项目本身，关联关系不等于归属关系。
  无论 LDVH 在项目内还是与项目并行，ldvh-base 都应在项目目录内。
  每个接入 LDVH 的管辖项目应各自拥有 ldvh-base/ 目录，由该项目自身管理。
  此次变更：
  1. 将 ldvh-base/ 从工作区根目录回退为 ld-vibe-harness/ 项目内部目录；
  2. 批量移除 28 个文件中 ldvh-base"工作区级目录"和"工作区级"路径标注；
  3. 更新 specs/01 §3.5 明确 ldvh-base 为项目内部目录，每个管辖项目各自拥有；
  4. 更新 specs/13 §3.2 明确实例由项目拥有，存放在该项目自身的 ldvh-base/ 中；
  5. 更新 adr_index.py 路径引用（parent.parent.parent → parent.parent）；
  6. ADR-001 状态改为 superseded，创建 ADR-002 推翻原决策。
changed_files:
  - ldvh-base/ (从工作区根目录回退为项目内部目录)
  - specs/01-LDVH目录说明.md
  - specs/13-LDVH生产对象基础规范.md
  - tools/adr_index.py
  - ldvh-base/adrs/adr-001.yaml
  - ldvh-base/adrs/adr-002.yaml
  - specs/ (28 个文件路径标注回退)
  - .trae/rules/ (L1/L2 路径标注回退)
verification: >
  ldvh-base/ 已回退为 ld-vibe-harness/ 项目内部目录；
  adr_index.py 路径已更新，6 个命令测试通过；
  ADR-001 状态为 superseded，ADR-002 状态为 accepted；
  specs/01 §3.5 和 specs/13 §3.2 已明确每个管辖项目各自拥有 base；
  所有文件中"工作区级目录"标注已移除。
