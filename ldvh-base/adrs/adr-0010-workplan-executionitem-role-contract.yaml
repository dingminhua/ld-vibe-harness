id: adr-0010
type: adr
title: 使用 WorkPlan 和 ExecutionItem 替代 TaskPlan / Task / SubTask
status: active
created: '2026-06-18T00:30:45'
updated: '2026-06-18T00:30:45'
date: '2026-06-17'
context: |
  Human 在讨论 LDVH 工作流程和工作模型时指出：人关心的是计划、验收、决策、审计和关闭证据；AI 具体如何拆分、并行、尝试和执行，多数属于当前运行过程，不应默认成为长期历史事实源。

  之前候选方向仍以 TaskPlan / Task / SubTask 为中心：TaskPlan 承载计划，Task 承载可委派执行单元，SubTask 承载更细的并行叶子工作。后续讨论发现，这会把 LDVH 的事实源重心拉向 AI 内部执行过程，容易产生事实源噪音，并让人需要阅读大量过程性对象才能理解一次工作是否完成。

  Human 进一步提出预设角色的重要性：例如 code 修改应由熟悉代码修改规则、验证方式和专业审查视角的 code 子 Agent 处理。若角色输入输出和权限被规范化，执行项只需要作为 WorkPlan 内部编排节点，不需要成为独立工作模型。

  独立子 Agent 审查结论支持该方向：Task 应移出 active 工作模型，合并为 WorkPlan.orchestration.execution_items；WorkPlan 保留人和历史关心的事实，执行噪音不进入长期事实源，但必须保留最小恢复、验证和关闭证据。

  Human Gate 记录：
  - 触发原因：该决策改变工作模型集合、对象命名、执行编排承载方式、Review / Audit 定位和后续 specs / Code / Web 迁移方向。
  - 确认事项：是否以 WorkPlan 替代 TaskPlan，是否将 Task / SubTask 移出 active 工作模型，是否用 ExecutionItem 作为 WorkPlan 内部编排节点，是否引入 Role Contract 作为专业子 Agent 能力契约。
  - 影响范围：`specs/00-LD-Vibe-Harness理念与纲要.md`、`specs/02-术语规范.md`、`specs/05-工作模型基础规范.md`、`specs/05.01-工作字段内容格式规范.md`、`specs/06-工作流程基础规范.md`、`specs/21-WorkPlan-工作计划.md`、`specs/24-Memo-备忘.md`、`specs/10-Git提交规范.md`、40-59 工作流程、Code、Web 和既有工作对象实例。
  - 确认依据：用户明确表达 Task 具体如何执行并不关心，也不需要记录，是 AI 内部自己的事情；同时接受使用 WorkPlan / ExecutionItem 的方向，并要求按计划推进。
  - Human 决策：接受 WorkPlan 中心模型，取消 Task / SubTask 的 active 工作模型地位，将执行编排迁入 WorkPlan 内部，并用 Role Contract 规范专业子 Agent。
  - 确认人/时间：Human，2026-06-17
  - 后续动作：先记录 Memo 和 ADR，再系统修改 specs；待核心规范稳定后再迁移 Code、Web、测试和既有实例。
  - 回写位置：本 ADR、memo-0005、后续 specs、Code / Web / tests 和 Git 提交记录。
  - 残留风险：迁移期间旧规范、Code、Web 和既有实例仍会引用 TaskPlan / Task / SubTask，需要分阶段清理，避免一次性重构造成事实源和实现同时失稳。
decision: |
  LDVH 工作模型重心从 TaskPlan / Task / SubTask 转为 WorkPlan / ExecutionItem / Role Contract。

  1. `TaskPlan` 改名为 `WorkPlan`。
     - WorkPlan 是 LDVH active 工作模型，承载一次可验收工作的目标理解、范围边界、成功标准、AI 编排摘要、角色执行摘要、验证证据、关闭判断和经验分流。
     - WorkPlan 不等同于 Codex、Claude、Trae 等环境中的 Plan Mode、临时计划、聊天计划或执行草稿。

  2. `Task` 移出 active 工作模型。
     - Task 不再作为独立 YAML 工作对象新建、关闭或分流。
     - Task 原有的执行编排职责迁入 `WorkPlan.orchestration.execution_items`。
     - 既有 Task 实例如需保留，应作为 legacy 事实处理，后续通过迁移流程吸收到 WorkPlan 或归档，不得继续作为新规范中心。

  3. `SubTask` 移出 active 工作模型。
     - SubTask 不再作为 active 工作模型。
     - `specs/21-WorkPlan-工作计划.md` 后续应转为 removed / historical placeholder，说明其职责已由 WorkPlan 内部 ExecutionItem 和必要的编排关系承接。

  4. `ExecutionItem / 执行项` 是 WorkPlan 内部编排节点，不是工作模型。
     - ExecutionItem 用于表达 AI 当前执行可恢复所需的最小结构，例如 id、title、role、status、blocked_by / depends_on、last_result、next_action、evidence_refs 和必要输出摘要。
     - ExecutionItem 不承载长期独立生命周期，不单独进入 `ldvh-base/` 目录，不作为 Human 直接管理入口。

  5. `Role Contract / 角色契约` 是专业子 Agent 能力契约。
     - Role Contract 定义角色目的、输入、必读材料、允许动作、禁止动作、输出格式、交还对象和停止条件。
     - Code、Web、Governance、Review、Audit 等专业子 Agent 不拥有独立 Task 对象，而是接收 WorkPlan 中的 ExecutionItem 与对应 Role Contract，返回标准化结果、证据、风险和建议。

  6. Review、Audit 和 Decision Review 是流程环节，不是工作模型。
     - 简单审查结果写入 WorkPlan 的 verification_evidence、review_results 或 closure_evidence。
     - 复杂审查可表现为 WorkPlan 内部 ExecutionItem 或具体工作流程，但不因此创建独立 Review / Audit 工作模型。

  7. AI 行动过程不作为长期历史事实源。
     - 不记录搜索顺序、阅读顺序、子 Agent 中间思考、临时 todo、无复盘价值的失败尝试或已被最终结论吸收的重复分析。
     - WorkPlan 只保留恢复当前工作、证明验收结果、支持关闭判断和分流长期经验所需的最小结构化证据。
consequences: |
  ## 正向价值

  - 服务 V2 完整理解：人和历史只需要围绕 WorkPlan 理解一次工作，不必阅读大量 Task / SubTask 过程对象。
  - 服务 V3 正确判断：避免 Task 独立存在带来的漂浮对象、重复分流和事实源噪音。
  - 服务 V4 稳定执行：主控负责目标、决策和汇总，专业子 Agent 在隔离上下文中执行或审查，并将标准化结果交回主控。
  - 服务 V6 强制验证：WorkPlan 可集中承载 spec、checklist、orchestration、verification、review、closure 和 learning routes，关闭判断更完整。

  ## 逆向价值

  - 逆向削弱 V9 人类确认质量：Task / SubTask 移出 active 工作模型后，人类无法再通过独立 Task 对象追踪 AI 的细粒度执行过程。
  - 逆向削弱 V1 快速定位和 V3 正确判断：ExecutionItem 只作为 WorkPlan 内部编排节点，会牺牲部分跨对象检索和独立状态管理能力。

  ## 实施成本

  - 需要系统迁移 specs 中的 TaskPlan / Task / SubTask 用语、对象集合、关系、状态机、Human Gate 和字段契约。
  - Code / Web / tests 当前可能仍以 TaskPlan / Task / SubTask 为对象类型，后续需要适配 WorkPlan 和内部 ExecutionItem。

  ## 风险评估

  - 如果 WorkPlan.orchestration 设计过薄，会损失上下文恢复、并行调度和审计能力。
  - 如果 WorkPlan.orchestration 设计过厚，又会重新制造过程噪音。
  - Role Contract 若不清晰，专业子 Agent 输出可能被误当成最终事实。

  ## 注意事项

  - WorkPlan 必须保留最小恢复证据：execution item 状态、角色、依赖、最近结果、下一步和证据引用。
  - WorkPlan 必须保留验证证据：命令、测试、独立 Review、Human Gate 和验收项结果。
  - WorkPlan 必须保留关闭证据：变更摘要、验收结果、残余风险和经验分流。
  - Role Contract 必须明确每类专业子 Agent 的输入、输出、权限和交还边界，避免子 Agent 输出直接成为最终事实。
