id: spark-0036
type: spark
title: 行动指南替代知识地图与全局管辖导航缺口
status: discarded
created: '2026-06-27T05:21:52+08:00'
updated: '2026-06-27T07:11:29+08:00'
description: |
  当前 LDVH 知识地图已经能稳定提供只读导航价值：它能约束 AI 的阅读范围、输出 read_plan、stop_conditions、next_queries，并在部分链路中给出来源回指与问题诊断。

  但从工程触达角度看，它仍停留在“被动导航层”，还没有稳定承担用户期待的更高一级职责：AI 一接到任务时，知识地图应先主动提示这次任务最该注意的事项、潜在风险、边界条件和缺口，再给出阅读路径，最后把阅读结果衔接到后续 action plan。

  进一步收敛后，问题不只是“知识地图要增强”，而是“知识地图”这个名称和工具边界已经容易误导：它像知识库、图谱查询或 GraphRAG 检索，而 LDVH 真正需要的是所有 AI 行动开始前的统一指南。新能力的正式名称应收敛为“行动指南”。行动指南不是另一个与知识地图并存的工具，而是继承、补充并最终替代知识地图；行动指南成立后，knowledge-map 作为独立工具、入口和 active 能力名应退出并删除，图关系、来源回指和读取计划只作为行动指南的内部实现细节或输出组成部分存在。

  行动指南的职责是为所有 LDVH 行动生成实时指南，而不只是为 WorkCase 或具体任务导航。它应覆盖讨论、判断、创建 Spark、处理工作对象、修改 specs/rules/code/web、运行 Hook/Skill/Agent、提交、部署、复核、分流和 Human Gate 等行动。它要回答的不是“有哪些知识节点”，而是“本次行动该怎么做、注意什么、遵守什么、用什么工具、哪里必须停、读完后怎么继续、如何验证”。

  行动指南的输入范围必须覆盖 active specs、授权附件、运行时资产和所有管辖项目事实源。更准确地说，所有管辖项目应默认纳入可查询、可召回和可做影响判断的范围，但行动指南输出仍必须 target-first、current_project 起步、P0/P1 渐进读取；只有跨项目查重、影响判断、全局召回、用户明确要求或当前 target 指向跨项目关系时，才升级到 all_governed_projects 级别。全管辖视角用于判断已有 Spark/WorkCase/ADR/Pitfall/Study 是否已承接、跨项目关系是否存在、规范或工具变更是否影响其它管辖项目。但行动指南不得把全量内容注入上下文；输出仍应只暴露本次行动必需的 P0/P1 原文、按需展开的 P2/P3、后续查询和停止条件。

  跨项目事实源边界必须写硬：行动指南必须保留项目命名空间，不得把不同项目的裸对象 ID 合并；不得越界读取未登记项目、未授权 docs 或项目根之外路径；不得把跨项目派生关系、召回结果或诊断输出回写为任一项目事实源。跨项目关系只能作为当次行动指南中的来源回指、影响提示、STOP/Human Gate 候选或后续查询建议。

  行动指南必须以此前收敛出的行动指南要求和既有知识地图能力为最低基线，只能在其上补充和加强，不得违背、弱化或反向恢复旧知识地图/Rules 长路由问题。这里删除 knowledge-map 指的是删除它作为独立工具、入口和 active 能力名的地位，不是删除既有知识地图已经验证过的能力。read_plan、stop_conditions、next_queries、impact_summary、关系投影、来源回指、问题诊断和渐进读取等能力必须被行动指南完整继承，并在行动类型、注意事项、规范来源、工具计划、Human Gate、post-read action plan 和验证建议方面增强。

  最低基线包括：
  1. 行动类型与职责对象识别；
  2. 行动前 3-5 条注意事项、风险和边界；
  3. 应遵守的 specs、事实源和来源回指；
  4. 应使用的 Code、Hook、Skill、Agent、Git 或验证工具；
  5. STOP 条件和 Human Gate 候选；
  6. read_plan、next_queries、impact_summary 等渐进读取能力；
  7. 读完后的 post-read action plan 和验证建议；
  8. 工具不可用、输出不足、事实冲突或输入不足时的问题原因与后续分流。

  这个 Spark 只记录设计收敛和迁移方向，不直接要求立即改 Code 或 specs。后续若推进实现，应把行动指南作为新的默认入口能力，并同步 Runtime Protocol、Rules、Hook receipt、preflight、Code 命令入口表、测试和 Web/文案引用；knowledge-map 不应作为长期兼容的第二入口保留。但删除顺序必须受控：不能先删除 knowledge-map 再补行动指南。必须先完成 action-guide 的 CLI/API、Schema、dispatcher receipt 消费、fallback read_plan、测试、文案和迁移验证，再删除 knowledge-map 独立命令、active specs 正式入口表述和默认引用。

  行动指南不得替代 Runtime Protocol 或 dispatcher 门禁。Runtime Protocol 仍负责 canonical event、触发时机、receipt 消费、acknowledge-read-plan、pre-tool-use 和 git.commit-msg 的协议边界；dispatcher 仍负责结构化 receipt、blocking、required_paths、next_action 和写入/提交门禁。行动指南只负责基于 specs、事实源、运行时资产和 Git 输入生成“本次行动怎么走”的实时指南，不得自行放行、阻断、授权 Human Gate 或替代 dispatcher 的管辖判定。

  需要继续收敛的方向包括：
  1. 命名与职责：正式能力名为“行动指南”，不再以“知识地图”作为 active 对外能力名；
  2. 全局输入：默认读取 active specs、运行时资产和所有管辖项目事实源，必要时结合 Git 文件事实源、target、diff 或 staged paths；
  3. 行动路由：为每类行动输出职责对象、行动类型、应读事实源、规范来源、工具计划、STOP/Human Gate 和验证建议；
  4. 渐进读取：继承 read_plan / stop_conditions / next_queries / impact_summary，但作为行动指南字段的一部分，而不是知识地图独立工具；
  5. 执行衔接：把读完之后应做什么显式转成 post-read action plan，避免停在阅读摘要；
  6. 删除迁移：行动指南成立后删除 knowledge-map 独立命令、active specs 正式入口表述和 Rules/Hook 默认引用；
  7. 验证闭环：记录行动指南是否减少错误阅读、无效回读、执行偏差、旧 Rules 长路由回潮和跨项目遗漏。

  不应混淆的边界：行动指南不是事实源，不负责维护对象状态，也不应直接替代 WorkCase、ADR、Pitfall、Study、specs、Git 文件事实源或 Human Gate。AI 仍负责把用户自然语言转为初始行动意图和目标候选；Code 只能基于可复查的 specs、事实源、运行时资产和 Git 输入输出行动指南、诊断和来源回指；Human Gate 仍保留最终授权和方向确认。

  行动指南输出至少应包含：行动类型、target/职责对象证据、3-5 条注意事项、P0/P1 read_plan、来源回指、工具计划、STOP/Human Gate 候选、diagnostics/result_status、next_queries、post-read action plan、验证建议和 fallback。Runtime Protocol 管事件与门禁，specs 管规则权威，Human Gate 管确认和授权，AI 管用户意图初判；行动指南只做基于事实源的实时行动指南。
source: conversation
priority: P1
source_detail: |
  在围绕 LDVH 知识地图是否“有用”与“工程触达是否合理”的连续讨论中，用户明确提出：知识地图如果不能在 AI 做事前先主动给出提醒和注意事项，就很难体现实际价值。随后又追问“那需要做哪些事情呢”，因此需要把这个期待沉淀为一个独立 Spark，作为后续分流与改造入口。

  后续连续收敛中，用户进一步明确：旧知识地图名称容易引起歧义；真正需要的是所有行动的指南，而不是单个任务导航；行动指南要替代旧 Rules 中很长的路由；行动指南成立后 knowledge-map 应被删除，而不是作为并存工具长期保留；行动指南必须读取 active specs 和所有管辖项目事实源，并且必须在此前行动指南要求及既有知识地图能力的基础上补充和加强，不能违背或弱化。
