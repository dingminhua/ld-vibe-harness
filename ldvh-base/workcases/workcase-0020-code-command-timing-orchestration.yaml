id: workcase-0020
type: workcase
title: 文件类型到 Code 命令映射 + subprocess 结构化错误处理
goal: |
  LDVH 有 20+ Code 命令，当前只有 3 个被 Hook 自动触发。其余全部靠 AI 记住 CLI --help。

  本 WorkCase 做两件独立的事：
  1. 建立文件类型 → Code 命令的只读导航映射表，供 wc-0019 的 tool_plan 字段导入，实现文件类型级别的命令建议
  2. 统一 dispatcher 中所有 subprocess 调用的错误处理，结构化输出并保留原始 stderr 供 AI 诊断

  本 WorkCase 不修改 pre-tool-use 的阻断逻辑、不引入自动补位 acknowledge、不在 dispatcher 层追加 command_suggestions。
  命令建议全部通过 knowledge-map 输出路径（04.Att.06 授权），不进 dispatcher 治理字段。

  执行依赖：在 wc-0019 之前执行。wc-0019 的 item-6（tool_plan）在实现 task_type 级命令映射时导入本 WorkCase 产出的文件类型映射表，实现 file_type 级命令增强。
status: human_plan_confirming
created: '2026-06-27T07:15:00+08:00'
updated: '2026-06-27T07:22:00+08:00'
priority: P1
description: |
  问题起源：本次会话从"hook 机制出了问题"出发，沿链路逐层剥开。发现入口（session-start）和出口（git commit）的 Hook 已经打通，但中间地带——AI 知道任务后、修改前、修改后——Code 命令调度是空白。20+ 命令只有 3 个被自动触发。

  审查收敛（Explore-3 + Explore-4 + Explore-10/12）：
  - 原 item-3（acknowledge 自动补位）违反 06 §7，已移除。dispatcher 不能替 AI 伪造 read_plan_consumed 证据。
  - 原 item-2（pre-tool-use command_suggestions）越权——dispatcher 职责是治理，不是操作指导。命令建议改走 knowledge-map 输出路径。
  - 原"post_change_verification"字段在 wc-0019 中不存在，已从本 WorkCase 移除。wc-0019 的 tool_plan（item-6）承担文件类型级命令建议职责。
  - 执行依赖修正为"wc-0020 先 → wc-0019 后"，wc-0019 item-6 导入本 WorkCase 的映射表做 file_type 增强。

  与 wc-0019 的分工：
  - wc-0019 管 knowledge-map 输出增强：新增 tool_plan、post_read_action、attention_points、deep_read_plan 等字段
  - wc-0020 管输入基础：提供文件类型映射表（独立共享模块），wc-0019 item-6 导入实现 tool_plan 的 file_type 级命令映射
  - 两者串联：先 wc-0020，再 wc-0019

  映射表放置位置：独立共享模块 code/constants/file_command_map.py，由 wc-0019 的 knowledge_map.py 导入，避免 hook_dispatch.py ↔ knowledge_map.py 循环依赖。dispatcher（hook_dispatch.py）在构建 session-start receipt 时透传 knowledge-map 输出中的 tool_plan 字段，不直接查询映射表。

  不改 Hook 阻断语义，不改 specs 架构。
success_criteria: |
  - [ ] 文件类型 → Code 命令映射表：基于路径目录结构判定文件类型（specs/ → spec，ldvh-base/workcases/ → workcase，ldvh-base/sparks/ → spark，code/ → code，web/ → web），映射到"修改前建议的命令"和"修改后建议的命令"
  - [ ] 映射表只包含 04.Att.02 已授权的命令（当前仅 spec 类型 preflight + v2-check），未授权类型留空列表，不伪造
  - [ ] 映射表回指 04.Att.02 和 04.Att.07 作为规范来源，不作为独立的 Code 内规则源
  - [ ] subprocess 错误处理结构化输出：{"failed_command": "...", "exit_code": N, "stderr_head": "<前 500 字符>", "stderr_summary": "<exit_code 模板>", "suggested_action": "<恢复动作>"}，保留原始 stderr 供 AI 诊断
  - [ ] _run_knowledge_map subprocess 错误处理改为结构化错误；_git_text 内部委托给 _git_text_structured 实现（路径 B），_git_text 公共签名不变
  - [ ] _acknowledge_read_plan 不纳入 subprocess 范围（它是文件 I/O，非 subprocess 调用）
  - [ ] stderr_summary 基于 exit_code 的模板映射，已知诊断码对应 04.Att.04，未知 exit_code 保留原始 head + "请人工检查"
  - [ ] 改动范围：code/hook_dispatch.py（subprocess 统一错误处理）+ code/constants/file_command_map.py（映射表共享模块）
  - [ ] 现有测试继续通过，新增测试覆盖：映射表存在且可导入、subprocess 失败返回结构化错误、stderr_head 非空
source: |
  来源：本次会话用户讨论——从 hook 机制断裂 → 知识地图能力评估 → 旧 Rules 命令表对比 → 20+ Code 命令调度空白。
  审查：Explore-3（规范边界）+ Explore-4（运行时安全）+ Explore-10/12（目标对齐），均已吸收修正。
orchestration:
  mode: sequential
  execution_items:
    - id: item-1
      title: 定义文件类型到 Code 命令的只读映射表
      role: design
      mode: single
      input_refs:
        - specs/attachments/04.Att.02-Code命令入口表.md
        - specs/attachments/04.Att.07-受控写入前检查矩阵.md
        - code/specs_validate.py
        - code/fact_cli.py
      expected_output: |
        基于 04.Att.02（Code 命令入口表）和 04.Att.07（受控写入前检查矩阵）建立文件类型 → 命令的只读映射。文件类型判定以**目录路径**为主（specs/ → spec，ldvh-base/workcases/ → workcase，ldvh-base/sparks/ → spark，code/ → code，web/ → web），扩展名为辅（同目录下 .md vs .yaml 区分）。

        只包含 04.Att.02 已授权的命令。当前可从 04.Att.02 确定性派生的命令：
        - spec 类型 → specs_validate.py preflight (before) / v2-check (after)
        - workcase/spark 类型 → fact_cli.py 命令暂时不纳入（未在 04.Att.02 授权表中），待后续补齐 04.Att.02 后再加入
        - code 类型 → pytest 暂时不纳入，测试命令归属 08 测试基础规范

        映射表为 Python dict，格式：
        {
          "spec": {
            "before_change": [{"command": "python3 code/specs_validate.py preflight --target-path <path>", "purpose": "写入前只读检查"}],
            "after_change": [{"command": "python3 code/specs_validate.py v2-check --fail-on-diagnostics", "purpose": "修改后验证"}]
          },
          "workcase": {
            "before_change": [],
            "after_change": []
          },
          "spark": {
            "before_change": [],
            "after_change": []
          },
          "python": {
            "before_change": [],
            "after_change": []
          },
          "web": {
            "before_change": [],
            "after_change": []
          }
        }

        所有命令为建议性，不要求 AI 必须执行。映射表回指 04.Att.02/07 作为规范来源。空列表附带 reason 说明（如 "04.Att.02 暂未授权该文件类型的建议命令"），帮助 AI 区分"无需操作"与"暂无授权"。

        放置位置：独立共享模块 code/constants/file_command_map.py。选择此位置的原因：
        - 避免放在 hook_dispatch.py 内导致 knowledge_map.py 跨模块导入 dispatcher 的循环依赖风险
        - 作为纯数据常量模块，knowledge_map.py（wc-0019 item-6）可直接 import 使用
        - 文件类型检测函数（基于路径目录结构判断 spec/workcase/spark/code/web）同放在此模块
      status: pending
      blocking_reason: ''
      result_summary: ''
      evidence_refs: []
    - id: item-2
      title: 统一 subprocess 错误处理
      role: code-implementation
      mode: single
      input_refs:
        - code/hook_dispatch.py (_run_knowledge_map, _git_text)
        - specs/attachments/04.Att.04-Code诊断码表.md
      expected_output: |
        抽取公共的结构化错误包装函数，统一 hook_dispatch.py 中 subprocess 实际调用的错误处理：

        输出格式：
        {
          "status": "error",
          "failed_command": "<完整命令字符串>",
          "exit_code": N,
          "stderr_head": "<stderr 前 500 字符>",
          "stderr_summary": "<基于 exit_code 的模板摘要>",
          "suggested_action": "<恢复动作>"
        }

        stderr_summary 基于 exit_code 做模板映射（参考 04.Att.04 已知诊断码），未知 exit_code 用通用模板。stderr_head 始终包含原始输出供 AI 诊断根因。

        覆盖函数：
        - _run_knowledge_map (line 559-577)：当前返回 raw stderr → 改为结构化错误
        - _git_text (line 328-341)：采用实现路径 B——重构 _git_text 内部委托给 _git_text_structured，_git_text_structured 执行 subprocess 并返回 tuple (stdout: str, error: dict | None)；_git_text 调用 _git_text_structured 后丢弃 error 返回 stdout 或空字符串。保持 _git_text 的公共签名不变，5 个现有调用者无需修改。_git_text_structured 供需要结构化错误诊断的上层逻辑使用。

        _acknowledge_read_plan (line 219-277) 不在本项范围：它做的是文件 I/O（JSON read/write），不是 subprocess 调用。
        不改变 subprocess 调用方式，只改错误返回格式。不引入新的外部依赖。
      status: pending
      blocking_reason: ''
      result_summary: ''
      evidence_refs: []
    - id: item-3
      title: 整体测试
      role: test-verification
      mode: single
      input_refs:
        - tests/code/test_hook_dispatch.py
      expected_output: |
        新增测试覆盖：
        - 映射表可导入，包含 spec/workcase/spark/python/web 类型
        - spec 类型的 before_change 和 after_change 非空（preflight + v2-check）
        - 未授权类型（workcase/spark/python/web）的 before_change 和 after_change 为空列表
        - subprocess 失败 → 返回结构化错误（含 failed_command、exit_code、stderr_head、suggested_action）
        - stderr_head 非空
        - _git_text_structured 在 _git_text 返回空字符串时返回 error dict
        - 原 _git_text 返回类型不变
        - 现有测试全部继续通过
      status: pending
      blocking_reason: ''
      result_summary: ''
      evidence_refs: []
  plan_review:
    orchestration_owner: main_controller
    workflow_ref: null
    review_policy:
      selection_reason: |
        本 WorkCase 建立文件类型映射表（作为 knowledge-map 输入，不作为 dispatcher 治理字段）并统一 subprocess 错误处理。已吸收 Explore-3（规范边界）和 Explore-4（运行时安全）审查意见：移除自动补位、命令建议改走 knowledge-map 路径、保留 stderr_head。
      required_perspectives:
        - 规范边界审查
        - Code 可实现性审查
      optional_perspectives: []
      tool_method_requirements:
        - 映射表回指 04.Att.02 和 04.Att.07，不作为独立的 Code 内规则源
        - 映射表输出为只读建议，不要求 AI 必须执行
        - stderr_head 保留原始错误输出，不替代为模板摘要
        - 不改 pre-tool-use 阻断逻辑
      aggregation_rule: 若映射表引入未授权的新命令映射或 stderr_head 被模板替代，必须修正。
      review_items:
        - id: plan-review-spec-1
          reviewer: subagent-spec-boundary
          role: 规范边界审查
          agent_name: Explore-3
          requested_at: '2026-06-27T07:17:00+08:00'
          perspective: specs-boundary
          result:
            status: needs_changes
            summary: |
              6 项 required changes。CRITICAL：acknowledge 自动回填违反 06 §7，必须移除 item-3。command_suggestions 越权须改走 knowledge-map 路径。post_change_verification 范畴外溢须移出 acknowledge handler。
            key_findings:
              - acknowledge 自动补位让机器伪造 AI 消费证据，等于门禁开锁
              - command_suggestions 跳出治理进入操作指导，属 03 领域
              - post_change_verification 确认 handler 不负责规划修改后工作流
              - 映射表须回指 04.Att.02/07
              - 改动范围声明不精确
            required_changes:
              - 移除 item-3（acknowledge 自动回填）
              - 命令建议改走 knowledge-map 输出路径
              - post_change_verification 移出 acknowledge handler
              - 映射表回指 04.Att.02/07
              - 更正改动范围
              - 指定与 wc-0019 串联执行顺序
            evidence_refs:
              - ldvh-base/workcases/workcase-0020-code-command-timing-orchestration.yaml
              - specs/04-Code确定性执行规范.md
              - specs/06-运行时扩展规范.md
              - code/hook_dispatch.py
        - id: plan-review-safety-1
          reviewer: subagent-runtime-safety
          role: 运行时安全保障审查
          agent_name: Explore-4
          requested_at: '2026-06-27T07:17:00+08:00'
          perspective: runtime-safety
          result:
            status: needs_changes
            summary: |
              CRITICAL：acknowledge 自动补位绕过消费验证。HIGH：stderr_summary 必须保留原始 stderr_head。
            key_findings:
              - auto_acknowledged=true 可观测但不能解决门禁被绕过的问题
              - 写操作才建议命令，只读不应刷屏
              - 文件类型判定算法需要基于路径目录结构
              - pre-tool-use 高频调用，自动补位 + knowledge-map 增加延迟
            required_changes:
              - 自动补位必须在输出中显式标记 auto_acknowledged=true
              - stderr_head 保留原始输出
              - 文件类型判定基于目录路径为主
            evidence_refs:
              - ldvh-base/workcases/workcase-0020-code-command-timing-orchestration.yaml
              - code/hook_dispatch.py
              - tests/code/test_hook_dispatch.py
        - id: plan-review-code-1
          reviewer: subagent-code-feasibility
          role: Code 可实现性审查（第一轮）
          agent_name: Explore-8
          requested_at: '2026-06-27T07:26:00+08:00'
          perspective: code-feasibility
          result:
            status: needs_changes
            summary: |
              3 个阻塞：映射表含未授权命令(fact_cli/pytest 不在 04.Att.02)；_acknowledge_read_plan 被错误纳入 subprocess 范围；_git_text 返回类型变更会破坏 5 个调用者。
            key_findings:
              - 仅 specs_validate.py preflight 和 v2-check 可从 04.Att.02 派生
              - _acknowledge_read_plan 是文件 I/O 非 subprocess
              - _git_text 签名变更风险 git 治理判定假阴性
            required_changes:
              - 映射表只保留 04.Att.02 授权命令
              - _acknowledge_read_plan 移出 item-2 范围
              - _git_text 保持 str 签名不变
            evidence_refs:
