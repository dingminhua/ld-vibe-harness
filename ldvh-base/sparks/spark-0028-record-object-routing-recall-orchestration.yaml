title: 记录对象归口、沉淀与召回行动编排
status: pending
created: '2026-06-25T04:11:42+08:00'
updated: '2026-06-25T04:20:00+08:00'
description: |
  本 Spark 记录一个新的行动编排候选议题：LDVH 是否应建立统一的“记录对象归口、沉淀与召回行动编排”，用于处理 Spark、ADR、Pitfall 三类记录对象的入库分流与出库召回。

  本轮讨论形成的核心判断：

  1. LDVH 当前生产对象可按职责区分为五类：WorkCase 偏行动承接，Study 是 AI 研究、分析、比较或核验行动完成后的稳定报告产物；Spark、ADR、Pitfall 是三类记录对象。
  2. Spark、ADR、Pitfall 不宜分别建立三个独立行动编排。它们共享同一类底层问题：AI 遇到输入、发现、判断、失败或经验线索时，如何判断是否需要记录、归口到哪类记录对象、是否已有对象可召回、是否更新旧对象、合并、新建、归档、废弃或触发 Human Gate。
  3. 该行动编排建议先做成一个成员，内部区分两个模式：
     - 入库模式：判断是否有记录需求；先召回已有 Spark/ADR/Pitfall；再决定不记录、直接处理、更新旧对象、合并、新建 Spark/ADR/Pitfall，或转 WorkCase / 研究行动。
     - 出库模式：当前任务触发时召回已有 Spark/ADR/Pitfall；ADR 作为长期约束，Pitfall 作为规避经验，Spark 作为待消化线索或旧议题入口。
  4. WorkCase 和 Study 是该编排的边界外出口，而不是同级记录分支：有明确目标、成功标准和马上推进需求时转 WorkCase；需要 AI 调研、比较、核验并产出报告时触发研究行动，行动产物才是 Study。
  5. 创建新记录前必须先查重与召回。完全重复时优先更新已有对象；同主题补充新来源或证据时优先合并；同主题但适用范围不同可以并列；同主题结论冲突、与 active ADR 冲突或需要推翻核心 Pitfall 经验时，必须触发 Human Gate。
  6. 该编排必须保留“不入库出口”：可以直接处理、留在当前答复、忽略、转 WorkCase 或触发研究行动；不得把所有有价值输入都塞进 Spark/ADR/Pitfall。
  7. 知识地图可作为导航和召回工具，但不能只依赖“自然命中”。行动编排中需要明确召回触发器，例如长期规则/边界/取舍、重复失败、创建新记录前、WorkCase 计划或关闭前、修改 specs/Rules/Skill/行动编排前。
  8. 本轮子 Agent 只读评审结论支持统一一个编排，不建议拆成“入库”和“出库”两个编排；拆分时机应留到未来召回发展出独立评分、排序、预算控制、跨对象推理和专门工具链之后。

  建议名称：

  - 记录对象归口、沉淀与召回行动编排

  建议核心问题：

  > 当 AI 遇到输入、发现、判断、失败或经验线索时，是否需要进入长期记录？如果需要，应先如何召回已有 Spark/ADR/Pitfall，如何判断更新、合并、新建、归档、废弃或触发 Human Gate；如果不需要记录，应如何转为直接处理、WorkCase 行动或研究行动并产出 Study。

  建议边界：

  - 负责：Spark/ADR/Pitfall 的记录需求判断、查重、冲突判断、创建/更新/合并/归档建议、召回触发、当前行动应用建议和 Human Gate 识别。
  - 不负责：执行 WorkCase、产出 Study 正文、重写 20/22/23 字段契约和状态机、替代 specs/Rules/Code/Web 正式规则、替代 Human Gate。
