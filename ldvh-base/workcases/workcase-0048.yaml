success_criterion_definitions:
- criterion_id: criterion-controlled-namespace-purge
  statement: 在 FileAsset 当前规则仍可读取时，通过一次性、来源定义且经测试的 retire-file-asset-namespace 操作精确处理 file-asset-0001/0002/0003：先完成三对象读取、namespace 成员恰等于这三项、全部 has-file-asset 入向闭包为零、CAS 与 worktree baseline 一致性检查，再以一个原子提交清除三对象与 namespace，不留下 deleted tombstone。操作返回 namespace before/after、CAS、入向闭包、原子提交或失败残留证据并完成精确 absence 回读；不得用普通文件工具直接写受管事实；任一检查、并发或原子性能力不足时零事实写入。
- criterion_id: criterion-current-rule-retirement
  statement: 当前 specs 与 attachments 不再声明 FileAsset 类型、specs/25、FileAsset 字段/递归结构、has-file-asset、类型分支、创建/删除/预览或行动模板分支；临时 purge 契约也被移除；当前规则投影与机械目录仅对 Spark、WorkCase、ADR、Pitfall、Study 五类成立。terminal 历史事实文字和 Git 历史明确不在零命中标准内。
- criterion_id: criterion-helper-code-retirement
  statement: 当前 Code、Helper、CLI、commit precheck、packaging 和 tests 不再保留 FileAsset carrier、validator、repository、relation、创建、删除或临时 purge 的产品能力；其余五类事实的读取、发现、创建、更新、关系、提交前检查、完整性与分发能力继续通过适用验证。
- criterion_id: criterion-web-doc-retirement
  statement: 当前 Web API、UI、preview、字段契约、导航、颜色、状态、详情/列表、产品文档与当前计划不再提供 FileAsset 功能或产品概念；Study 继续承载报告路径；terminal 历史事实仍可显示其原始历史文字。
- criterion_id: criterion-validation-isolation
  statement: 形成可回读的基线和精确消费者清单；覆盖 purge 的拒绝、并发、原子失败零写、真实 absence 证明；完成五类剩余事实完整性、规则/字段/机械目录、Python/Helper/CLI/packaging、Web typecheck/lint/tests、当前产品消费者扫描、git diff --check、worktree 范围隔离，并把实际通过与既有/范围外失败如实交给独立结果复核和后续受控本地语义提交。不得将旧 FileAsset 完整性检查在 purge 后的暂时不适用误报为 purge 失败，也不得跳过写后 absence 证明。
