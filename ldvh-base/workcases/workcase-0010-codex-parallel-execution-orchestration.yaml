        已形成 Codex 并行执行行动编排候选方案：worktree worker 承接写入隔离、独立验证和可提交闭环；同目录线程默认只读咨询、短复核或共享现场观察，不承担并行写入；子 Agent 默认用于读多写少调查、日志分析、方案/结果复核和摘要回收。主控必须维护任务卡、允许写入路径、禁止范围、入口读取、Human Gate、轮询、回收、授权范围核对、验证命令、提交或 diff 交还、合并顺序、冲突分类、结果复核和残留风险。worker 已提交时交还 commit hash；若只交还 diff，主控必须重新验证、提交并记录原因。合并前检查至少包含授权文件核对、git status/diff 核对、相关验证重跑、冲突分类和 Human Gate 判断。
