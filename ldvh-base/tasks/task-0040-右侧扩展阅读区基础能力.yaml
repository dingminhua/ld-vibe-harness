title: 右侧扩展阅读区基础能力
title_en: Right Side Extended Reading Panel
title_zh: 右侧扩展阅读区基础能力
status: planned
created: '2026-06-05T22:04:53.739060'
updated: '2026-06-05T22:10:00'
description: |
  在桌面端 ObjectDetail 页面增加右侧扩展阅读区面板，实现 08-网站整体性多角色审视研究 §3 定义的三段式布局。
  右侧面板用于承接"相关但不应该打断主线"的内容：
  - 点击 related_docs 时预览 Markdown 文件内容
  - 点击 related_tasks 或 related_adrs 时展示对象摘要卡片
  - 查看 YAML 原文
  移动端（< 1024px）将右侧扩展区降级为底部抽屉。
  右侧面板只读取 API 或已有文件内容，不成为新事实源。
source_intent: intent-0006
