description: |
  清退旧 TaskPlan / Task / SubTask 工作对象事实源、Code 兼容入口、Web 展示入口和当前规范中的兼容维护规则。
  此次变更不保留旧对象兼容能力，因为项目尚未推广且没有外部使用者；历史事实由 Git 历史承载，
  当前事实源只保留 active 工作模型。
success_criteria: |
  - [ ] `ldvh-base/taskplans/`、`ldvh-base/tasks/`、`ldvh-base/subtasks/` 不再作为当前事实源目录存在
  - [ ] Code 不再把 `taskplan`、`task`、`subtask` 作为可读、可写、可校验或可迁移工作对象类型
  - [ ] Web 不再暴露 TaskPlan / Task / SubTask 的默认入口、详情布局、兼容夹具或测试假设
  - [ ] specs 中旧对象兼容、迁移保留、历史夹具维护等当前规则痕迹已清理或改写为当前事实规则
  - [ ] Python、Web 和事实源校验通过，删除造成的残留问题已分流到 Memo 或后续 WorkPlan
source: |
  Plan creation requested by dmh2002 on 2026-06-18:
  用户明确要求“不需要保留兼容能力，这个项目还没推广，没有其他人用”，并要求清理历史痕迹；
  后续又要求把事项拆成三个 WorkPlan，审批后依次执行，中间问题记录到 Memo，最后总结经验用于完善流程。
  独立 Code/Web 清退审批子 Agent 已返回 APPROVE；本计划仍需 Human 明确批准后才能开始执行。
