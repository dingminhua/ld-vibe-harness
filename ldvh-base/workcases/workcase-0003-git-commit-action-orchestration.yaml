id: workcase-0003
type: workcase
title: Git 提交行动编排薄入口落地
goal: |
  将 LDVH Git 提交从“07 规则 + Skill/Hook/Code 资产已经存在”推进为 active 的 Git 提交行动编排薄入口，使 AI 准备、拆分、预检、创建和交还 commit 的执行责任有单一流程归口。
status: closed
created: '2026-06-24T09:23:35.843460'
updated: '2026-06-26T09:52:45+08:00'
priority: P1
description: |
  当前 v2 已将 commit message 契约和 Git records 追溯归口到 07，并登记了 `ldvh-git-commit` Skill、`hooks/ldvh-hooks.yaml`、`code/commit_validate.py` 和 Web commit DTO / 展示链路。但 03 所要求的 Git 提交行动编排成员尚未存在，导致“规则、资产、环境边界、执行证据和 Skill 是否真实调用”之间仍缺少薄入口接管。

  本 WorkCase 新增 active `specs/31-git-commit-action-Git提交行动编排.md`，只接管提交行动执行责任，不复制 07 的提交本体规则；并同步 01/03/07、Skill、Hook、Rules 和相关 Spark 的状态记录。
success_criteria: |
  - [x] 新增 active 31 Git 提交行动编排成员，具备 `v2_spec`、`v2_action_member` 和兼容 `ldvh_member` 身份块。
  - [x] 31 明确 Context、Scenario、Gate、执行流程、问题分流、Skill 使用证据、Code/Hook/Web 协作、环境适配边界和可测试性锚点。
  - [x] 07 明确提交行动流程由 31 接管，且 31 不复制 commit message 本体规则。
  - [x] `ldvh-git-commit` Skill 和 Hook registry 回指 31，旧“10 规范”描述被清理。
  - [x] Rules 入口能在 Git 提交准备或追溯场景定位 31、07、Skill 和 validator。
  - [x] spark-0017 / spark-0019 记录本次承接进展，避免旧 workcase-0074 口径继续误导。
  - [x] 通过 active specs、固定运行时扩展、能力环境矩阵、commit validator、Skill 快速校验、Web typecheck、commit DTO 单测和工作对象事实源校验；执行当时 Web API 全量回归被 facts 夹具空 pitfall 假设阻断，已记录边界，后续由 `workcase-0007` 承接并关闭。
source: |
