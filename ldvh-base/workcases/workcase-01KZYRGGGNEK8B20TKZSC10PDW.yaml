title: 受控写入优化：关闭候选契约闭合与写路径摩擦收敛（SIUURU 承接）
goal: 针对受控写入路径中已实证的摩擦与契约缺口，实现最小可验证改进：1) prepare-closed-workcase-candidate 输出补充关闭写入要求的新流水所需信息（route_target 形状要求：目标已有 UID 时必须保存 UID 形状），使 AI 形成 closure_proposal 时不再写错 legacy 三元组；2) 收敛日志会话实证的 read→update 契约映射缺口（read-fact-objects 返回的 fact_object 含 Code 托管字段、不能直接用作 update-fact-object 的 after），在 capabilities 契约层提供可消费的 after 示例或明确指引；3) 如实记录 correct-closed-workcase 在 UID route target 路径的 NameError 复现条件（本 WC 不修复该 Code bug）。
scope: 仅修改 Helper 关闭候选/受控写入相关实现与契约描述（code/ldvh/helper/operations/workcase_close_candidate_operation.py、read-fact-objects 与 update-fact-object 的 read→update 契约层、04.Att.01/05.Att.01 中对应写入契约描述），以及对应测试。排除：修复 correct-closed-workcase 的 NameError Code bug 本身（另立 Spark 记录，不在本 WC 授权内）；改变事实对象 Schema/字段定义/状态机；改变只读操作输出契约（由 spark-0074「Helper 只读交互优化」承接，即 ldvh@STNORJ）；Git 提交/推送/发布；其它执行中 WorkCase 的事实文件；规则源正文结构修改。
success_criterion_definitions:
- criterion_id: criterion-closure-candidate
  statement: prepare-closed-workcase-candidate 输出能支撑 AI 形成符合规范 21 §6.7/§5 的 closure_proposal：至少包含 route_target 形状要求（目标已有 UID 时必须使用 UID 形状及 content_fingerprint），使 AI 不再写出 legacy 三元组导致 Web 端『关闭提案缺失或结构不符』。
- criterion_id: criterion-read-update-bridge
  statement: read→update 的 after 构建摩擦有可验证收敛：capabilities 契约层（04.Att.01 input_examples，不改变 05 §11.2 read-fact-objects result 输出闭集）提供可消费的最小完整 after 示例（input_examples，含 signature/change_log 字段形状），或等价的可验证指引；AI 按该入口即可构造 update-fact-object after，无需手工 strip Code 托管字段。
- criterion_id: criterion-nameerror-documented
  statement: correct-closed-workcase 在 UID route target 路径的 NameError 复现条件与触发路径已如实记录到结果链，并明确本 WC 未修复该 bug、后续承接由另立 Spark 承担（承接关系作为记录内容本身，不要求 Spark 已存在）。
- criterion_id: criterion-tests
  statement: 为上述改动新增/更新聚焦测试：覆盖关闭候选输出形状、read→update 示例/指引；既有相关测试回归通过，Ruff 通过。
- criterion_id: criterion-boundary
  statement: 改动不触及事实对象 Schema/字段定义/状态机、不修复 NameError Code bug、不改变只读操作输出契约（spark-0074「Helper 只读交互优化」边界）；回归测试证明既有调用方必需字段未破坏。
success_criterion_results:
- criterion_id: criterion-closure-candidate
  outcome: satisfied
  summary: 关闭候选对 UID route target 可确定投影：排序使用稳定身份，candidate 与 mapping_basis 保留 UID 形状和 content_fingerprint，摘要及验证显式声明该要求；聚焦及最终回归通过。
- criterion_id: criterion-read-update-bridge
  outcome: satisfied
  summary: update-fact-object capabilities 发布来源绑定的 Spark 完整 after 示例，明确复用真实 UID/指纹与全部非托管字段、移除 5 个托管字段、保留并追加 change_log、另行提供 observed_context.signature；read-fact-objects 输出闭集未改。
- criterion_id: criterion-nameerror-documented
  outcome: satisfied
  summary: 结果链已记录 UID route target NameError 的历史触发路径：缺失 RouteTargetFingerprint 导入；既有提交 53f4d97c 已修复。当前精确回归通过且不复现，本 WC 未修改该路径，因此不虚构未完成的另立 Spark。
- criterion_id: criterion-tests
  outcome: satisfied
  summary: 最终相关测试集 207 passed，覆盖关闭候选、WorkCase application、capabilities、fact update、CLI 与 WorkCase 写入；所改 5 个代码/测试文件 Ruff 通过，限定 diff --check 通过。
- criterion_id: criterion-boundary
  outcome: satisfied
  summary: 变更仅涉及关闭候选 UID 投影、update capabilities 示例及其测试；未改事实 Schema/字段定义/状态机、未改只读结果输出契约、未改 correct-closed-workcase NameError 路径、未改 specs、未提交或推送。
