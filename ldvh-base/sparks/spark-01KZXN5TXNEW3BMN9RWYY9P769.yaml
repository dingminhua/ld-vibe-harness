title: 受控写入优化
status: implemented
intent: 承接 spark-0019 路由的关闭候选与写入契约不闭合问题，以及 spark-0049 更新实操中暴露的 read→update 契约映射缺失、signature 发现成本高、模板启用判断不明确等受控写入操作的 AI 可消费性优化。按 study-0030 的「公共契约层 → 类型专属层」分层结构，通过逐项 WorkCase 推进，不试图一次性解决所有写入类操作。
summary: "## 已落实范围\n\n- WorkCase 关闭候选已经按 UID route target 形状交付可消费的目标指纹要求，关闭所需的新流水要求也已显式闭合。\n- read→update 最小桥接已经进入写操作 capabilities/input examples，明确 whole-object after 需要移除 Code 托管字段、保留历史流水前缀并追加当前流水。\n- 五份行动模板已经通过同源 `activation_hint` 帮助 AI 选择下一份应读取模板，但不由 Code 推断适用、授权或可执行性。\n- CLI 已交付三字段署名的 null-safe 请求骨架和 Git trailer 排列；40 会话对照表明该机械辅助减少目标只读任务的 invalid request，但没有减少直接 Helper 往返。\n- WorkCase strict `item_event` 已为执行项 checkpoint 建立窄事件输入，并复用完整对象验证、CAS、原子替换、回读和审计主干。\n- `prepare-fact-object-update` 已正式落地：它只读返回当前对象、fingerprint 和排除托管字段的 whole-object after skeleton，调用方仍须补齐真实语义变化、fresh signature 和最新 change_log，再走正式完整对象写入口。\n\n## 收口边界\n\n本 Spark 创建时明确提出的关闭候选、read→update、模板启用判断、署名/footer 第一层机械帮助和 prepare-update/CAS 辅助均已由聚焦 WorkCase 直接落实，因此入口责任结束。Helper 是否应从同一 `observed_context.signature` 自动形成最新 `change_log.signature`，以及其它类型专属辅助，尚无足够真实任务证据，不作为本 Spark 继续 open 的理由；这些候选改由“LDVH 面向 AI 的服务质量评估与持续改进”先验证净价值。逐次重新观察、三字段不可跨角色推导、完整 CAS、写后精确回读与完整性审计，以及 Git message 显式 footer 的边界保持不变。\n\nWorkCase 语义重复创建已经有独立 P1 Spark 和窄 WorkCase 承接，不并入本入口。普通 `related-to` 只用于追溯共同线索，不表示责任路由或上位 P1 Spark 已完成。"
