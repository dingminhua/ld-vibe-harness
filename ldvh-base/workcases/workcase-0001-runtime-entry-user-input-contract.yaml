      expected_output: |
        定义 session-start 的幂等语义、receipt key、target_scope 隔离、target_changed / new_scope 状态、no-op receipt 与 governed receipt 隔离，以及禁止业务副作用的边界。测试必须证明重复 session-start 不修改项目事实源，不跨 target 复用 receipt。
      status: pending
