goal: 为五类事实对象建立可追溯、完整的 Code 机械校验闭环：所有由当前 Specs 明确交给 Code 判定的结构规则都有唯一清单、统一校验入口、读取/创建/更新/写后回读及候选消费的实际覆盖，以及范围匹配测试；适用检查尚未实现或无法完成时，Helper 必须返回 unavailable，不得报为 mechanically_valid。
scope: 覆盖 specs/05 与 20–24 明确交给 Code 的身份、位置、Schema/字段闭集、类型、必填/条件/空值、枚举、时间/版本/生命周期、引用、关系、项目级约束及相应诊断；覆盖 read-fact-objects、create-fact-object、update-fact-object 和类型便利写入口、写后回读、find-fact-object-candidates 对 invalid/unavailable 对象的处置。排除自然语言意图、摘要充分性、来源真实性、证据充分性、关系领域语义、是否应建对象等 AI 判断；排除 Hook 外部直写保护（spark-0029）和批量迁移或修复已有对象。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 形成可回读的规则→类型→验证器/入口→测试映射，覆盖全部由当前 Specs 归属 Code 的结构规则，并对未实现项明确 unavailable 处置。
- criterion_id: criterion-02
  statement: 读取、受控创建、更新/便利写入和写后回读使用同一适用规则集合，不存在任一入口把同类违规对象报为 mechanically_valid。
- criterion_id: criterion-03
  statement: 候选发现与恢复在遇到 invalid 或 unavailable 对象时完整披露，coverage 与 scope 如实为 partial，不静默排除。
- criterion_id: criterion-04
  statement: 每条新增或收紧的结构规则同步更新唯一 Specs 归属、验证器、受影响入口和正反/回归测试，测试能证明该同步门槛。
- criterion_id: criterion-05
  statement: 能力声明只覆盖已实现的机械边界，不把语义判断或 Hook 防护冒充为本 WorkCase 的完成。
work_items:
- item_id: item-01
  goal: 建立并审核机械规则清单与 Specs 同步门槛。
  expected_result: 逐条列明类型、来源、机械边界、验证器、入口、测试和未实现处置；必要的 Specs 归属与同步门槛得到修正。
  status: in_progress
  approach_summary: 交叉核对当前 05、20–24、Schema bindings 与现有实现；不修改 00 或 32。
  current_summary: 正在处理 Spark routed-to 承接对象标题：关系仍以稳定身份为权威，Web 必须显示目标当前完整 title，Helper 必须核对可解析、有效的目标及非空 title，不能以 object_id 或页面猜测替代。
  resume_from: 完成 20、05、08 与 validation/relations/Web 的精确改动和范围测试。
- item_id: item-02
  goal: 完成统一机械校验与各入口接入。
  expected_result: 读写与候选入口对清单内规则给出一致判定，并正确区分 unavailable 与 invalid。
  status: pending
  depends_on:
  - item-01
  approach_summary: 对 validation 与 operation 层作最小变更；禁止以 Web 或 AI 回退替代机械检查。
- item_id: item-03
  goal: 完成范围匹配测试与实际 Helper 验证。
  expected_result: 每类规则具备正反例、入口一致性与 candidate partial 证据；仅运行本范围测试和 CLI 场景。
  status: pending
  depends_on:
  - item-02
  approach_summary: 补充范围匹配测试与受控 CLI 场景；不运行 full-v4。
summary: 已完成 Spark routed-to 承接对象标题这一条机械规则闭环：05 明确标题只能从目标当前对象派生，20 明确 Spark 关系的稳定身份与 Helper 实读标题校验，08 明确分流区不重复目标、关联区显示完整目标标题；Helper、范围测试、实际对象回读与浏览器页面均已核对。item-01 的全量规则清单与同步门槛仍未完成。
resume_from: 继续 item-01：逐项建立 05 与 20–24 的规则→验证器/入口→测试映射；不要把本次 Spark routed-to 的完成误写为全对象校验闭环已完成。
