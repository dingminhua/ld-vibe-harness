[build-system]
requires = ["setuptools>=75", "ruamel.yaml>=0.18.10,<0.19"]
build-backend = "setuptools.build_meta"

[project]
name = "ld-vibe-harness"
version = "0.1.0"
description = "Deterministic foundations for the LD Vibe Harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ruamel.yaml>=0.18.10,<0.19",
]

[project.scripts]
ldvh = "ldvh.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["ldvh*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["code/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ldvh"]
