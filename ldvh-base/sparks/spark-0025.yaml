summary: "**当前判断**\n\n- LDVH 可以同时服务多个管辖项目，但单项目可用、项目注册存在或某个聚合页面出现，都不等于多项目治理已经形成闭环。\n\
  - “项目”边界、项目集合/分组是否需要独立对象，以及聚合能否由现有管辖配置、事实对象和消费视图承接，必须按当前事实模型和真实消费者判断；不预设新增项目集合对象。\n\
  - 多项目能力同时需要聚合与隔离：聚合应能说明对象归属和覆盖范围，隔离应保持项目身份、授权、事务、错误与同号对象的消歧边界。\n\n**全链路审视范围**\n\n\
  - 配置与项目身份、工作对象解析、共享上下文恢复，以及事实发现、读取、变更和 Helper 的失败范围。\n- 跨项目引用、同号对象消歧、Git/Hook Gate、adapter
  输入、验证证据、Web/CLI 可观察性与用户文档。\n- 所有仍隐含 `governed_single` 或“当前项目”假设的环节；每一项应判断是必须逐项目隔离、可安全聚合，还是需要
  Human 决定。\n\n**承接与未决事项**\n\n- `spark-0007` 聚焦配置拓扑，`spark-0021` 聚焦 Web 作用域；本 Spark
  只作为跨层审视和缺口分流入口，不把它们的实施方案或状态复制进来。\n- 先用实际多项目场景识别独立缺口，再分别决定是否更新现有对象、建立关系或形成 WorkCase；不把多个可独立处置的问题捆成一个实施任务。"
