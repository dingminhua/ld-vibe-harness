goal: 使 LDVH 规范、用户文档及当前可编辑的面向 Human 帮助、诊断和注释文本中的概念性 Hook 用语，能够无歧义地区分 Git Hook、环境 Hook 与 Hook Gate；在同一受影响文本单元中出现的 Gate 依其对象明确为 Human Gate、Git Gate 或 Hook Gate，且不改变既有运行行为或技术标识符。
scope: "覆盖：\n- specs/01-规范模型基础规范.md 与 specs/attachments/01.Att.01-LDVH双语术语表.md 中承接 00 的术语定义和引用边界；\n- 全部 specs、README/用户文档，以及当前可编辑的面向 Human 帮助、诊断和注释文本；\n- 对范围内 Hook/Gate 命中逐项分类为 Git Hook、环境 Hook、Hook Gate、Human Gate、Git Gate、技术标识符、第三方专名、外部原文引用或待 Human 裁决；\n- 每个拟改文本单元（段落、标题、帮助字符串、诊断文字）均先展示修改前与修改后，经 Human 确认后才写入。\n\n排除：\n- 不改 Git Hook、环境 Hook、adapter、Git Gate 或 Hook Gate 的运行行为、事件链和实现；\n- 不更名代码技术标识符、第三方专名、外部 URL 或外部来源原文；\n- 不为术语收敛而改写历史 WorkCase、Spark、审核记录或既有结果；这些对象仅可被清点、分类并交还其自身责任；\n- 不纳入当前工作区无关的 Web 改动。"
