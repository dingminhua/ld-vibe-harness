description: |
  当前 05 体系的问题不是简单把原 05.01 内容格式子文档拆成两个文件，而是 05 父规范、字段层、内容格式层和消费注册层的职责没有系统分层：
  - 05 父规范包含工作模型总纲、通用规则、字段契约原则和字段注册边界，入口说明偏厚；
  - 05.01 同时承载字段内容格式、公共字段语义、字段注册表、Code/Web 消费枚举和 AI 写入规则；
  - “不是 schema、不决定必填、不管状态机”等边界在 05 与 05.01 中重复出现；
  - Code/Web 消费语义与具体实现边界存在混写风险。

  Human 明确纠正：本计划目标是对整个 05 工作模型规范体系做系统性重构，而不是局部拆分 05.01。

  本计划负责将 05 体系重构为四层：
  - 05：工作模型基础规范，只保留工作模型定义、准入、标准组成、通用原则和 20-29 关系；
  - 05.01：工作模型字段定义与语义规范，承接字段层通用规则、公共字段语义和与 20-29 字段契约的边界；
  - 05.02：工作模型字段内容与格式规范，承接 Narrative、Checklist、验证证据、Decision、Reference、Log、Structured 和 AI 写入格式；
  - 05.03：工作模型字段注册与消费规范，承接字段注册表、注册列枚举、字段生命周期和 Code/Web 可消费元数据。
