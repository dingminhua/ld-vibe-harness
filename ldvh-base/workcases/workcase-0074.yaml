status: closed
title: 补足草案字段定义入口的运行时可发现性
goal: 在不内联枚举、约束正文或完整对象模板的前提下，让 prepare-fact-object-draft 的每个 field_contract 同时给出唯一可定位的 definition_ref 与现有 constraint_ref，使 constraint_ref=inherit 的字段仍能回到其权威定义。
scope: 仅覆盖 prepare-fact-object-draft 的 field_contracts 来源定位与草案 schema_fingerprint：specs/05-事实模型基础规范.md、code/ldvh/specs/fact_type_projection.py、code/ldvh/facts/schema.py、必要的 code/ldvh/facts/creation.py、code/ldvh/helper/operations/fact_creation_operation.py，以及对应 tests。排除 allowed_values、约束正文、最小合法 fact_object、创建/持久化/状态语义、关系导航、Worker、外部写入和 Git commit。
success_criterion_definitions:
- criterion_id: criterion-source-contract
  statement: 05 §11.3 将 field_contracts[] 定义为 field_path、json_type、presence、definition_ref、constraint_ref 的闭集；definition_ref 恒为含 field_key 的唯一 canonical 定义入口，constraint_ref 仍仅表示类型收紧位置或 inherit。
- criterion_id: criterion-projection
  statement: 所有当前类型的直接与递归草案字段都公开非空 definition_ref；priority 同时呈现 definition_ref 与类型 constraint_ref，inherit 字段可通过 definition_ref 定位权威定义，且 definition_ref 身份变化会使旧 draft basis 的 schema_fingerprint 失效。
- criterion_id: criterion-boundary-validation
  statement: 定向单元/CLI 回归通过，并断言 field_contracts 不出现 allowed_values、constraints、template 或 fact_object 等第二 schema 内容，既有 prepare/create 行为保持。
success_criterion_results:
- criterion_id: criterion-source-contract
  outcome: satisfied
  summary: 05 §11.3 现将 field_contracts 定义为五字段闭集，并明确 definition_ref、constraint_ref=inherit 与第二 schema 边界。
- criterion_id: criterion-projection
  outcome: satisfied
  summary: 五个当前事实类型的直接与递归草案字段均公开完整 definition_ref；priority 同时保留类型 constraint_ref，inherit 字段仍可回到定义，指纹覆盖 definition_ref。
- criterion_id: criterion-boundary-validation
  outcome: satisfied
  summary: 定向 schema、Helper 与 CLI 回归通过，field_contracts 闭集不含 allowed_values、constraints、template 或 fact_object，既有创建回归仍通过。
result_summary: 为 prepare-fact-object-draft 的 field_contracts 补足了唯一、可定位的 definition_ref，同时保持 constraint_ref 的类型收紧职责与原有创建语义。
