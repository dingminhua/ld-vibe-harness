title: 新增 git-hooks-status 公开操作：skill/hook 对齐检查一等公民
status: closed
goal: 把 skill 更新后的 Git Hook 部署状态与 skill 副本对齐检查提升为 Helper 一等公民公开操作 git-hooks-status（声明于 09 环境接入规范），使 Human 与 AI 都能经 ldvh call git-hooks-status 获得符合 04 机器契约的只读检查结果，替代手工拼接的检查步骤，并使检查逻辑有规范背书、可复用、可验证。
scope: 仅修改：1) specs/09-环境接入规范.md 新增 §5.9 声明 git-hooks-status 公开操作表格与 arguments/result 字段定义；2) specs/attachments/09.Att.01-环境接入面.md 新增 git-hooks-status 入口交付行；3) specs/33-环境接入行动模板.md 部署后静态回读步骤引用 git-hooks-status；4) specs/04-Helper CLI 服务规范.md §5.1 公开调用清单提及（如需要快捷入口）；5) code/ldvh/ 下 Helper 实现：注册 git-hooks-status 公开操作，复用 git_hooks/commit_msg.py 既有逻辑，skill 副本对比/Stop gate/worktree 覆盖逻辑从 tools/check_skill_sync.py 上移；6) code/tests/ 契约测试覆盖状态分类/版本/skill 对齐/worktree 覆盖；7) tools/check_skill_sync.py 保留为便捷封装。不修改 Web、既有公开操作契约、Git Hook 部署机制、事实对象 Schema、历史事实。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: git-hooks-status 作为公开操作按 04 §5.1 固定表格在 09 声明，出现在 capabilities 中，effect=read，arguments/result 字段符合 04 契约，不写事实、不推进任何状态。
- criterion_id: criterion-reuse
  statement: 实现复用 commit_msg.py 既有权威逻辑（state 分类、bundle 版本），不复制第二套检查逻辑；同一 worktree 下与既有 git-hook inspect（code/ldvh/git_hooks/commit_msg.py 提供）对 commit-msg 状态与版本判断一致。
- criterion_id: criterion-coverage
  statement: 覆盖 commit-msg 状态、bundle 版本、worktree 覆盖、skill 副本对齐、Stop gate 五个检查面；输出机器契约 JSON 且退出码语义化（0=对齐，1=有偏差）。
- criterion_id: criterion-tests
  statement: 契约测试覆盖 managed/outdated/absent/conflict 与 skill 不一致场景，全部通过；ruff lint 干净。
- criterion_id: criterion-spec
  statement: 09 §5.9、09.Att.01、33 的修订完成且互相一致；环境接入面登记 git-hooks-status 交付行。
