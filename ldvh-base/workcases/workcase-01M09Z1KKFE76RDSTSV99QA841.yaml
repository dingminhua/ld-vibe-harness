spark_suggestions:
- suggestion_id: suggestion-parallel-execution
  suggestion_kind: follow_up_opportunity
  summary: 原 Spark 中规划的并行 subagent 执行与摩擦记录部分尚未展开
  follow_up_summary: 本 WorkCase 只完成了 Spark 中行为清单部分，建议后续以此为基础，将已形成的 Study 行为清单分配给 subagent 并行执行，逐路记录摩擦，最终由主控 AI 汇总成实践沉淀文档。
- suggestion_id: suggestion-study-upkeep
  suggestion_kind: follow_up_opportunity
  summary: Study 行为清单应随规范更新而维护
  follow_up_summary: 当 specs/20~24 或 specs/31/32/34 发生实质变化时，本 Study 应同步修订。判断标准：规范状态闭集或专属操作变化后，Study 相应章节内容过时。
- suggestion_id: suggestion-pitfall-precision
  suggestion_kind: follow_up_opportunity
  summary: 将写后未精确回读即声明成功固化为 Pitfall
  follow_up_summary: 当再次观察到同类失败时，创建 Pitfall 记录该机制。判断标准：出现未 read-fact-objects 回读即把创建/更新响应写成成功的实例。
