  summary: 25 项 v3 focused tests 全部通过，覆盖协议闭集、family/情形/顺序平衡、唯一 arm 差异、fake gateway 的 write/drift/cross-family/F3-before-F2 拒绝、真实只读 fixture、byte replay、blind packet 脱敏、fresh context/scorer 唯一性、attempt/replacement/launch/time ceiling 与 technical-exclusion 闭集；v2 非 live-source 15 项回归全绿，155 个受保护 v2 文件 hash 未变。
