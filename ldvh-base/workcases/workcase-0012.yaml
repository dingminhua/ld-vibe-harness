  expected_result: 形成可回指的规则、实现、测试和合法残留映射，明确历史修改、当前偏差、无关并行差异以及来源是否充分，不修改实现。
  status: pending
  approach_summary: 只读核对当前规则、f1645554c、7ba29c6d7、7d2dd25aa 和 Working Tree；区分事实生命周期、规范模型关系、WorkCase audit、负向证明与通用 UI 兼容，不用字符串零命中替代语义审计。
- item_id: item-02
  goal: 根据 item-01 的来源审计结论，收束事实生命周期相关来源和实现。
  expected_result: 若存在规则或授权附件缺口，最小充分来源修正先完成独立复核；若来源已经充分，则保留其依据并直接核对实现。之后 Code、Helper、Web 和测试仅作范围内必要保留或最小修正。
  status: pending
