summary: "**当前判断**\n\n- LDVH 可以同时服务多个管辖项目，但单项目可用、项目注册存在或某个聚合页面出现，都不等于多项目治理已经形成闭环。\n- “项目”边界、项目集合/分组是否需要独立对象，以及聚合能否由现有管辖配置、事实对象和消费视图承接，必须按当前事实模型和真实消费者判断；不预设新增项目集合对象。\n- 多项目能力同时需要聚合与隔离：聚合应能说明对象归属和覆盖范围，隔离应保持项目身份、授权、事务、错误与同号对象的消歧边界。\n\n**承接范围（合并 0007、0021）**\n\n- 配置拓扑与用户级便利层（原 spark-0007）：工作区主登记、用户级便利层净价值、冲突边界与发现/写入选择。\n- Web 作用域与聚合呈现（原 spark-0021）：单一项目 vs「全部」聚合模式、归属与身份标识、同号对象消歧、全部模式写入边界、多项目数据来源判断。\n- 跨层审视与缺口分流（本 Spark 原有）：配置与项目身份、工作对象解析、共享上下文恢复、事实发现/读取/变更/Helper 失败范围、跨项目引用、Git/Hook Gate、adapter 输入、验证证据、Web/CLI 可观察性与用户文档；所有仍隐含 `governed_single` 或“当前项目”假设的环节。\n\n**拆解原则**\n\n- 本 Spark 是唯一的多项目总入口，统一承接 0007、0021 与原有审视职责，不复制其它 Spark 的实施方案或状态。\n- 先用实际多项目场景识别独立缺口，再分别决定是否更新现有对象、建立关系或形成 WorkCase；不把多个可独立处置的问题捆成一个实施任务。\n- Web 纯前端实现细节（切换器 UI、归属标识视觉、UI 层写入禁用）属实现期决策，不在 Spark 层保留，由实际 Web 开发时按产品需求处理。"
