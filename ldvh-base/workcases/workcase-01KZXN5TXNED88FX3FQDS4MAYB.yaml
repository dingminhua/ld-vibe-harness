title: 单路径最近祖先配置的管辖解析
status: closed
goal: 将未显式选择 workspace_root 时的单一 Git worktree 管辖解析改为：仅从该实际 worktree 根向上寻找最近的 LDVH-GOVERNED-PROJECTS.yaml；一经发现即停止，并仅在该配置的已验证登记项目与当前 worktree 或其 Git common-dir 唯一匹配时形成 governed。
scope: 仅处理未传 workspace_root、且请求可解析为单一实际 Git worktree 的自动管辖发现。最近配置有效但未登记当前 worktree/common-dir 时，保持 config_status=valid 并交还 not_governed/non_governed 的 fail-closed 结果，不再向更高祖先继续查找；最近配置无效时交还 invalid；没有配置时交还 missing。显式 workspace_root 继续只读取该精确目录，不向上回退；多 locator 聚合、自动采用配置、平行目录扫描、基于名称/remote 的匹配、Git worktree 根内配置的自动接管、事实写入、Git 提交和环境部署均不在范围内。linked worktree 只可通过已验证登记项目的相同 Git common-dir 命中，读写边界仍为其实际 worktree。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: 02 的配置发现和 resolve-governance-scope 输入/结果契约明确单一 worktree 的最近祖先停止规则、valid-but-not-governed fail-closed 结果、missing/invalid 的区别、显式 workspace_root 不变边界，以及多 locator 的保守边界。
- criterion_id: criterion-implementation
  statement: 非显式、单一 Git worktree 请求从实际 worktree 根而非 locator 子路径、cwd 或 common-dir-parent 开始，仅检查祖先目录；最近配置的已验证 path 或相同 common-dir 匹配时才形成 governed。
- criterion_id: criterion-regressions
  statement: 回归测试覆盖：父级已登记配置、最近有效但未登记且不得继续命中更上级配置、最近无效、无配置、linked worktree common-dir 匹配、自动发现跳过 worktree 根内同名文件、显式 workspace_root 精确选择，以及单一策略不扩大多 locator 行为。
- criterion_id: criterion-verification
  statement: 受影响的治理与 Helper 测试通过；完成独立只读结果复核，并由 Controller 如实记录任何未覆盖范围或失败。
success_criterion_results:
- criterion_id: criterion-contract
  outcome: satisfied
  summary: specs/02 已明确单一实际 worktree 的最近祖先停止、有效未登记时 non_governed、missing/invalid、显式根不变及多 locator 不扩展。
- criterion_id: criterion-implementation
  outcome: satisfied
  summary: 非显式单一 Git worktree 从实际根开始，仅沿父链找首个未排除配置；当前及祖先 Git root 本地文件排除，配置选定后的 common-dir 匹配保持实际 worktree 边界。
- criterion_id: criterion-regressions
  outcome: satisfied
  summary: 回归覆盖最近有效未登记、最近无效、缺失、linked worktree、当前及祖先 Git root 排除、locator 子目录起点、显式根和多 locator 既有行为。
- criterion_id: criterion-verification
  outcome: satisfied
  summary: 治理测试 50 passed、相关 Helper 测试 22 passed、定向集 72 passed；ruff 与 diff 检查通过；独立只读复核结论为 pass。
result_summary: 单一非显式实际 Git worktree 的配置发现现为从实际根沿唯一父链查找、首个未排除配置停止；有效但未登记交还 non_governed，未找到与无效分别交还 missing 与 invalid。
