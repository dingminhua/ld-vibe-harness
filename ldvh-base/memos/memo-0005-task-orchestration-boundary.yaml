id: memo-0005
type: memo
title: WorkPlan 与执行编排边界待收敛
status: pending
created: "2026-06-16"
updated: "2026-06-18"
description: |
  本 Memo 承载本轮关于 TaskPlan / Task / SubTask、WorkPlan、ExecutionItem、Role Contract、计划审核和执行证据边界的阶段性收敛。

  当前候选结论是：LDVH 不再以独立 Task 作为 active 工作模型。Human 关心的是 WorkPlan 这一层的目标、范围、成功标准、关闭判断和证据；AI 在 WorkPlan 内部使用 `orchestration.execution_items` 安排执行、角色分工、并行/串行和最小恢复信息。ExecutionItem 不是工作对象，不进入 `ldvh-base/` 独立事实源，也不作为历史事实源长期追踪。

  执行过程不作为历史事实源，含义是：不记录 AI 的临时 todo、工具读取顺序、子 Agent 中间过程、未采纳草稿或已被最终结论吸收的重复分析。WorkPlan 只保留足以恢复、验证和关闭的最小证据，包括当前推进位置、执行项结果摘要、稳定产物、测试/检查、独立复检结论、Human Gate 结果、关闭原因、残留风险和经验分流结果。

  仍需继续讨论和核对的核心问题：

  - `orchestration.execution_items` 的字段是否足以支持恢复、并行/串行编排、角色分派和关闭判断；
  - `orchestration.review` 是否只声明复检安排，还是需要更明确的专业角色审核输出格式；
  - Role Contract 应由 04 能力资产、06 流程基础、40-59 具体流程，还是其他规范承接；
  - WorkPlan 的 `verification_evidence` 与 `closure_evidence` 如何避免混淆；
  - Memo 中已经部分落地的议题，如何提示 AI 判断继续 pending、追加 evolution、分流或 resolved；
  - Code / Web 中旧 TaskPlan、Task、SubTask 实现何时迁移，迁移前哪些兼容字段可以暂留。

  建议新会话优先从 `specs/21-WorkPlan-工作计划.md` 逐段核对，然后回看 `specs/05-工作模型基础规范.md`、`specs/05.01-工作字段内容格式规范.md` 和 `specs/06-工作流程基础规范.md`，最后再处理 40-43 流程规范与 Code / Web 迁移。
evolution:
  - at: 2026-06-16
    summary: 初始问题是 TaskPlan / Task / SubTask 的边界混乱，尤其是主控、子 Agent、复检和并行任务如何编排。
  - at: 2026-06-17
    summary: 曾形成候选口径：TaskPlan 承载计划契约，Task 承载可委派执行单元，SubTask 不再作为 active 模型；并行/串行由依赖关系推导。
  - at: 2026-06-18
    summary: 进一步收敛为 WorkPlan 中心：TaskPlan 改名为 WorkPlan，独立 Task 移出 active 工作模型，执行编排迁入 WorkPlan 内部的 execution_items。
  - at: 2026-06-18
    summary: 明确 ExecutionItem 不是更小的工作对象；执行者可以在自身上下文继续拆分，但这些执行期拆分不进入 LDVH 长期事实源。
  - at: 2026-06-18
    summary: 明确执行过程不作为历史事实源，只保留最小恢复、验证和关闭证据；Review / Audit / Decision Review 属于流程环节，不是工作模型。
  - at: 2026-06-18
    summary: 联网复核 Codex、Claude Code、LangChain 和 Microsoft 多 Agent / HITL / Skills / Memory 资料后，判断 WorkPlan + ExecutionItem + Role Contract 方向符合行业趋势，并已据此修改 00、02、05、05.01、21、26、28 等相关规范和局部 Code / Web。
