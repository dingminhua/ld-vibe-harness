- at: '2026-07-29T18:28:04+08:00'
  summary: 接力发棒验证通过：Kimi 独立回读确认 wc-0017 execution_approval 完整承载 10 项决定内容且 source_refs 回指 Human 批准原话，git 提交 ae8b123f4 隔离正确，第三个 AI 仅凭事实源即可接续执行；H2 未留痕案例修正结局——approval 契约自带留痕牙齿，接力不依赖对话，残余开放项（问题与选项原文是否独立留痕）留待 Human 权衡。
- at: '2026-07-30T02:59:12+08:00'
  summary: 应 Human 要求记录 skill 路由分析：skill 路由可扛起 WorkCase 流程的程序部分，但扛不起独立性（须路由到真正隔离上下文）与 Human Gate（不可路由）；定位为 00 §7 环境 Hook/adapter 一族的程序性接入形态（00 §8.2 薄引用原则的翻版），并已 related-to 关联 wc-0013——同属环境接入契约版图，解阻塞时作为输入；三 AI 接力实证：引导语是底线能力，skill 是增强交付。
- at: '2026-07-31T20:55:57+08:00'
  summary: Human 决定正式取代 2026-07-29 的“先 Web 实践、2–3 个阶段后复评”：在保持 AI 第一服务对象定位的同时，将直接服务 Human 的价值固定进 specs/00。经逐段审议，HV1-HV5 最终为“决策提请清晰可决、授权执行受控可续、入档闭环节点可验、积累效用直观可见、项目演进脉络可循”，并由 commit f7188e00e 入库；00 同时明确当前尚未完整具备 HV4。后续下位承接由 workcase-0021 推进，本 Spark 保持 open，以继续保存一致性承接和 HV4 建设缺口。
