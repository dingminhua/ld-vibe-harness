    - specs/30-rules-entry-sync-review-Rules入口同步审查.md
    expected_output: |
      specs 明确知识地图不仅输出 nodes / edges，还输出面向 AI 的 read_plan / navigation / next_queries / stop_conditions / impact_summary，并规定 Rules 不长期维护静态读取路线。
    status: done
    result_summary: |
      已在 04 正文定义 knowledge-map 入口导航输出责任，在 04.Att.05 增加 entry_navigation 组合输入范围，并在 04.Att.06 定义 navigation、read_plan、next_queries、stop_conditions 和 impact_summary 字段契约。
    evidence_refs:
