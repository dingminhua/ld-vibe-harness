type: change
title: 统一 00 与 01 的机制落地关系章节表达
author: ai
status: done
created: 2026-06-03
updated: 2026-06-03
context: |
  用户确认 00 的“落地责任声明”和 01 的“机制关系声明”实际表达同一类需求：每个 specs 文档都需要明确自身与现有机制的关系，以便后续落地、同步、检查或审计。为降低章节命名漂移，并让 AI 更稳定识别机制联动关系，需要统一章节名和表达形态。
decision: |
  1. 将 specs/00-LD-Vibe-Harness理念与纲要.md 第 6 章从“落地责任声明”调整为“机制落地关系”；
  2. 在 00 第 6 章增加机制落地关系表，列明 Rules、Tools 和 Human Gate 的关联实体、关系类型和落地触发；
  3. 将 specs/01-LDVH目录说明.md 第 6 章从“机制关系声明”调整为“机制落地关系”；
  4. 将 01 第 6 章表头从“同步触发”调整为“落地触发”，并统一章节说明句；
  5. 更新 00 和 01 的更新日期为 2026-06-03。
consequences: |
  - 00 与 01 采用同一章节名“机制落地关系”；
  - 两个文档均使用表格表达机制关联、关联实体、关系类型和落地触发；
  - 00 仍保留 L1 Rules 落地要求作为机制落地关系下的展开说明；
  - 后续 specs 文档可复用该表达方式，以便 AI 和工具定位机制同步点。
affects:
  - specs/00-LD-Vibe-Harness理念与纲要.md
  - specs/01-LDVH目录说明.md
related_rules:
