status: closed
title: 重设计并重跑无契约泄漏的 A 簇提示卡对照实验
goal: 在不修改生产 Helper 契约且不预设提示卡收益的前提下，先以可审计的非泄漏任务设计证明 baseline/candidate 的唯一差异是来源绑定提示卡，再对当前本地只读 Helper 执行一批 12 baseline 加 12 candidate 的独立上下文对照，形成仅受正确性约束的方向性摩擦证据或如实停止结论。
scope: 仅允许修改 code/ldvh/testing/ 与 code/tests/testing/。任务包、gold rubric、baseline/candidate prompt、来源绑定卡、原始响应或转录、hash、record、统计输入和范围 manifest 只能写入每批由 SafeTrialTempRoot 新建并经创建身份、realpath 与 lstat 校验的仓库外临时根。明确排除生产 Helper/调用入口/能力契约、规格、文档、配置、WorkCase-0070 或其它既有事实对象、Git、网络、依赖安装、仓库内运行产物、任务包外操作和未登记的额外 trial。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 在真实调用前冻结 12 个任务、condition-blind gold rubric、baseline prompt、当前来源绑定 candidate card、允许操作、模型/推理/权限/runner/schema/Helper/rule/capability fingerprints、随机种子与条件顺序；共同任务与 gold 不得出现目标操作名、目标嵌套字段名、最小请求形状或等价示例，candidate card 是唯一允许提供该契约的条件差异。
- criterion_id: criterion-02
  statement: 测试性 preflight 对冻结材料执行结构化泄漏检查、条件差异检查、来源卡重算和哈希校验；发现目标契约泄漏、来源漂移、gold 非盲、allowlist 外操作或路径验证失败时 fail-closed，禁止任何真实 trial。
- criterion_id: criterion-03
  statement: 仅在 criterion-01/02 已通过且独立协议审查无未处置阻断项后，使用独立零历史上下文执行 12 baseline 加 12 candidate 本地只读 trial；每次形成严格 v2 终态 record，包含调用分类、invalid_requests、response_bytes、原始响应或转录 hash、monotonic duration、timeout/failure，且全部材料仅在 SafeTrialTempRoot。
- criterion_id: criterion-04
  statement: 预先定义 paired friction、correctness guardrail、terminal failure/missing-data 处置及“仅方向性信号”阈值；只在 candidate 不降低 condition-blind correctness 且 failure 不恶化时报告描述性方向，禁止统计显著性、因果证明或产品净收益主张。
- criterion_id: criterion-05
  statement: 独立只读结果复核者能够复算冻结哈希、检查非泄漏门禁、校验来源卡与全部 records、重算描述统计并核对范围 manifest；复核不得新增 trial 或把随机复跑表述为相同结果。
success_criterion_results:
- criterion_id: criterion-01
  outcome: satisfied
  summary: 12 个任务、condition-blind gold、相同 baseline/candidate base prompt、当前来源绑定卡、allowlist、环境 fingerprints、随机 seed/order 与 24 个 condition-specific envelope hashes 已在仓库外 SafeTrialTempRoot 冻结；共同材料未包含当前 protected contract terms。
- criterion_id: criterion-02
  outcome: satisfied
  summary: 测试性 preflight 已验证任务/gold 泄漏、条件差异、来源卡、哈希与路径边界；runner adapter 在每次 start_trial 前重验 candidate source 和完整环境 fingerprint 集，并在 dispatch 前拒绝 allowlist 外操作。
- criterion_id: criterion-03
  outcome: not_satisfied
  summary: 当前 Codex worker 共享 shell/workspace，无法保证只持有 envelope 与 runner proxy、无法阻止直接 ./ldvh 或读取协议根；因此未启动任何真实 12 baseline 加 12 candidate trial，也没有 records、transcripts 或 scope after manifest。
- criterion_id: criterion-04
  outcome: not_verified
  summary: paired friction、correctness guardrail、failure/missing-data 处置和禁止主张已预定义，但没有受隔离执行面保护的 records，不能计算或报告方向性信号。
- criterion_id: criterion-05
  outcome: not_verified
  summary: 独立协议审查已复核冻结材料和代码，但没有真实 records、统计输入或 scope after manifest 可供独立结果复算；当前环境阻断项已如实保留。
result_summary: 结果为 partial：非泄漏协议、runner-owned 采集/绑定与漂移门禁形成了稳定测试性基础；但当前环境不提供可限制 worker 仅经 runner proxy 调用 Helper 的受控执行面，无法保证隔离前提。按 fail-closed 边界，本 WorkCase 未执行任何真实 trial，也不主张提示卡收益、负效应、统计显著性、因果或产品净收益。
validation_summary: 定向试验测量测试与完整 code/tests/testing 套件均实际通过（115 passed）；Ruff 与 git diff --check 通过。最新冻结材料在 /var/folders/gh/szvhx1md1mn9qy9n6p2b2w5h0000gn/T/ldvh-wc0071-0hc2dztr，仅含 protocol 与 scope before；未观察 records、transcripts、analysis 或 scope after，未发起真实 Helper trial。
