  expected_result: 测试覆盖 executing 检查点非完成出口、independent_reviewing/closure_preparing 禁止 Gate 2 结论、blocked 不被视为自动续跑、stale/unresolved 要求重读或缺口交还、Reviewer pass 需要逐步完整 after 与回读；测试不声称控制 AI 自由文本。
