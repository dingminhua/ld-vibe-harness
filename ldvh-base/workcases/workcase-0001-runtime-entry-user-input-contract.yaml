id: workcase-0001
type: workcase
title: v3 会话入口与用户输入行动指南承接
goal: |
  将本轮讨论中确认的 v3 运行时入口要求固化为后续设计和实现的工作项：会话开始与用户输入必须分离；session-start 只负责入口 read_plan 和 receipt；用户输入阶段由 AI 主动调用 Code 获取任务行动指南；target-first 管辖判定必须覆盖 cwd/target 四象限；重复 session-start 必须幂等、按 target_scope 隔离且只产生受控运行时状态副作用。
status: subagents_plan_reviewing
created: '2026-06-28T14:20:00+08:00'
updated: '2026-06-28T14:20:00+08:00'
priority: P1
description: |
  本 WorkCase 承接 `spark-0001`。它不是要求立即修改 Runtime、Hook 或 dispatcher，而是防止当前对话里的关键机制判断遗失，并为后续 v3 运行时扩展、Code、行动指南和测试接管提供明确验收边界。

  当前已确认的链路分工：

  1. 会话开始：Hook / Rules -> Code / dispatcher -> AI。Code 主动提供入口 read_plan、stop_conditions、diagnostics、next_action 和 session receipt，AI 回读 P0/P1 后 acknowledge-read-plan。
  2. 用户输入：AI -> Code / dispatcher -> AI。AI 对用户问题做初步语义理解后，把 raw_text、cwd、target、session_id、read_plan_consumed 等上下文交给 Code，Code 返回任务行动指南。
  3. 行动指南：Code 基于事实源和当前事件生成的确定性辅助承接结果，不是规则源、不替代 AI 主控判断、不替代 Hook 实际拦截。
  4. 管辖判定：target-first、cwd-fallback。会话开始可能只知道 cwd；用户输入必须重新识别真实 target，并在 target 指向管辖项目时补跑 session-start。
  5. session-start 重复触发：允许作为入口刷新或 target 补握手，但必须幂等、按 session_id + target_scope 隔离，只写运行时 receipt，不得静默覆盖不同 target 的入口状态。

  本 WorkCase 的核心风险是：如果只把会话开始和用户输入都画成“AI 理解后判断”，就会丢掉 Hook 带动 Code 给 AI 提供入口上下文的机制；如果只看 cwd，不看用户问题里的 target，又会把普通天气查询误套 LDVH 管辖链，或把 cwd 外的真实 LDVH target 漏掉。
success_criteria: |
  - [ ] 明确会话开始和用户输入是两个独立事件，首条用户消息到达时也必须先完成入口握手，再处理任务意图。
  - [ ] session-start 只生成入口 read_plan、stop_conditions、diagnostics、next_action 和 session receipt，不执行用户业务任务，不修改 specs、事实对象、项目代码或业务文件。
  - [ ] acknowledge-read-plan 必须确认 AI 已回读 P0/P1 required_paths；session-start receipt 存在不等于 AI 已消费入口事实源。
  - [ ] 用户输入阶段必须有 `user-input` 或等价 canonical event / Code 入口，输入至少包含 raw_text、cwd、target candidates、session_id、trigger_source 和当前 read_plan_consumed 状态。
  - [ ] 用户输入行动指南输出至少包含 intent、extracted_fields、missing_fields、task_read_plan、stop_conditions、validation_guard、next_action 和 source_refs。
  - [ ] cwd 是管辖项目但用户 target 不是管辖项目时，普通外部问题不进入 LDVH 项目任务链；涉及文件、项目、规范、写入、提交或工作对象时，必须由 Code 确认 target 是否 governed。
  - [ ] cwd 不是管辖项目但用户 target 是管辖项目时，必须用 target 补跑 session-start，完成 P0/P1 回读和 acknowledge-read-plan 后再继续任务。
  - [ ] cwd 和 target 都命中管辖项目时，正常进入 LDVH 链路：入口 read_plan、任务行动指南、Hook / pre-tool-use、验证和证据回指。
  - [ ] cwd 和 target 都不命中管辖项目时，LDVH dispatcher 返回 no-op，不制造项目事实源或运行时门禁负担。
  - [ ] session-start 允许重复触发，但必须幂等：同一 session_id + target_scope 重复运行不得产生业务副作用，只能刷新或复用运行时 receipt。
  - [ ] receipt 必须按 session_id + target_scope 区分，不得仅依赖 latest receipt 跨 target 放行。
  - [ ] target 变化时不得静默覆盖旧 receipt；应返回 target_changed / new_scope 或等价状态，并要求 AI 对新 read_plan 重新 acknowledge。
  - [ ] no-op receipt 与 governed receipt 必须分开，第一次 cwd no-op 不得让后续 target governed 任务误以为入口已完成。
  - [ ] pre-tool-use、user-input 和 git.commit-msg 必须消费与当前 target 匹配的 receipt，不得拿 cwd receipt 放行另一个 target。
  - [ ] 所有新增机制必须说明归口：运行时扩展负责 Hook / Rules 入口，Code 负责确定性解析与 receipt，行动指南负责 AI 行动承接，specs 仍是规则事实源。
