    ReferenceCard null/undefined 收窄）；vite.config 移除代理调试 console.log，allowedHosts
    硬编码域名改为环境变量并保留默认值。
- criterion_id: criterion-06
  statement: 行为保持核对：除标准 2/3/4 三项明确有意变更的呈现语义外，其余既有可观察行为（路由表、API 响应 shape 字段集、既有
