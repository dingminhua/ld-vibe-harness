id: CHG-20260601220000
title: 章节索引要求从 >200 行改为所有正式规范文档必须，并补齐全部文档
date: 2026-06-01
changes: |
  1. specs/03 §4.1 章节索引规则从"超过 200 行必须"改为"所有正式规范文档必须"
  2. specs/03 §5.1 骨架模板去掉 200 行条件说明
  3. specs/10 §6.5 第 3 条去掉"超过 200 行"条件
  4. specs/04 §4.1/§4.2 去掉"超过 200 行"条件
  5. 为 specs/ 下 21 个无索引的正式规范文档补齐章节索引：
     01, 10, 11, 11.02, 11.03, 12, 12.01, 12.02,
     20, 21.01, 21.02, 21.03, 21.04, 21.05, 21.06,
     50, 51.01, 51.02, 51.03, 51.04, 51.05
reason: |
  消除 AI 读取时的决策分支（是否 >200 行），使工作流完全一致。
  小文档索引开销极小（8-12 行），维护成本可忽略。
  03 §5.1 骨架模板已包含索引段落，新建文档自动带索引。
impact: |
  - 所有正式规范文档必须提供章节索引，不再区分行数阈值
  - AI 读取工作流统一：Grep → 索引补充 → 精准读取，无分支
  - evals/ 和 refs/ 下的非规范文档不受此要求约束
validation: |
  1. specs/03 §4.1 无 200 行条件
  2. specs/03 §5.1 骨架无 200 行条件说明
  3. specs/10 §6.5 第 3 条无 200 行条件
  4. specs/04 §4.1/§4.2 无 200 行条件
  5. specs/ 下所有 *.md 正式规范文档均有章节索引
project: ld-vibe-harness
