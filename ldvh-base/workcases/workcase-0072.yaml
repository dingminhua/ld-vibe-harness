status: closed
title: 验证 D 簇增量变化定位的可行性与净价值边界
goal: 在隔离测试 fixture 中量化“集合已变化”与“精确定位变化对象身份”之间的差距，比较不落地的候选交互或投影，判断是否值得另立生产实现 WorkCase；不选择任何生产方案。
scope: 仅允许修改 code/ldvh/testing/ 与 code/tests/testing/ 下的测试性模块和测试；固定 fixture、checkpoint、原始输出与测量材料只能写入由 SafeTrialTempRoot 新建的仓库外临时根。明确排除生产 Helper、公开接口、capabilities、规格、文档、配置、网络、依赖安装、A 簇 trial、worker 隔离改动、任何其它事实对象或真实受管事实写入，以及 Git 状态变更（暂存、提交、重置、推送等）。允许当前 WorkCase 依生命周期受控写回，并允许只读 git diff --check；决策表只作为本 WorkCase 的结果投影或验证摘要保存，不新建事实、token、cache、receipt、journal 或生产持久状态。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 冻结单对象修改、新增、删除与跨检查点恢复四类相互独立的测试 fixture/checkpoint；每类明确 expected changed/unchanged stable triples，并记录规则、环境与 fixture 指纹。fixture 不读取或写入真实事实对象。
- criterion_id: criterion-02
  statement: 以当前公开候选发现和读取路径为 baseline，复现每类场景只能报告 aggregate stale 而不能直接给出精确 identity 的边界；记录为取得精确身份所需调用数、读取对象数、response bytes、定位准确率、漏报与误报，且结果可从冻结输入重跑。
- criterion_id: criterion-03
  statement: 在同一冻结 fixtures 上比较至少一项不改变生产接口、只在内存中存在的候选交互或投影；记录其输入基线、服务端扫描、输出 bytes、调用数、精确性与新增状态/泄漏风险。未达到 100% 精确定位且不引入额外持久状态或全量正文暴露时，必须形成 No-go。
- criterion_id: criterion-04
  statement: 形成方案中立的决策表：将 per-object manifest 与 changed_since 仅作为待比较类别，逐项说明各自所需的基线、持久状态和协议代价；不作生产方案选择或收益主张。
- criterion_id: criterion-05
  statement: 独立只读结果复核可从冻结 fixture、原始输出和测量输入重算全部指标；相关 pytest、ruff、git diff --check 与范围审计通过，且确认没有生产接口、其它事实对象、Git 状态或仓库内运行产物越权变更。
success_criterion_results:
- criterion_id: criterion-01
  outcome: not_verified
  summary: 测试性模块定义四个场景和受限 checkpoint 路径，但本批证据未冻结每场景 expected stable triples、before/after fixture/checkpoint 或 fixture/environment fingerprints；不得把代码定义视为已验证批次。
- criterion_id: criterion-02
  outcome: not_satisfied
  summary: 仅验证了公开响应的 aggregate-only 结构，未能以真实当前 Helper fixture 重放四类场景；因此未满足该基线复现与完整指标要求。
- criterion_id: criterion-03
  outcome: not_verified
  summary: 内存候选在四个合成投影场景均定位一个 identity 且不持久化状态，但未在真实当前 Helper fixture 上验证，不能据此判断生产可行性或收益。
- criterion_id: criterion-04
  outcome: not_verified
  summary: 仅形成 generic No-go，未交付逐项比较 per-object manifest 与 changed_since 的基线、持久状态和协议代价；不得据此声称方案中立决策表已完成。
- criterion_id: criterion-05
  outcome: not_verified
  summary: Python 3.12 兼容检查、手工覆盖测试逻辑、Ruff 与 diff-check 通过；但当前 .venv 缺 pytest，且证据根缺原始公开响应、before/after 投影输入，独立复核只能重算已写 comparison，不能全量重算指标。
result_summary: 结果为 partial：测试性模块严格区分集合变化检测与身份定位，合成完整内存投影可精确 diff；但真实 Helper fixture 重放、冻结原始输入、方案比较表与官方 pytest 均未验证，因此不具备生产方案选择依据。
validation_summary: Python 3.12 py_compile、兼容 harness、SafeTrialTempRoot 持久化检查、Ruff 与 git diff --check 通过；官方 pytest 未运行，原因是当前 3.12 venv 未安装 pytest，且授权禁止依赖安装。证据根仅能复算 comparison，不能复算原始响应 bytes/sha 或投影输入。
