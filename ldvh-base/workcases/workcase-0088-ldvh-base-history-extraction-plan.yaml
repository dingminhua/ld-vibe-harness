      批次 D：早期 Task 时代残留，不作为当前 active 工作继续推进，先判断是否已有价值被 v2 specs、Code、Web、Spark 或 Study 吸收，再决定关闭或删除候选；范围为 0023、0024、0027、0037、0043、0044、0045、0046、0047、0050、0055、0061。

