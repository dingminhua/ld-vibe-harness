context: |
  用户要求继续执行第二轮机制关系审计，并强调必须遵守 `specs/11.01-Rules机制规范.md`，避免多个事实源。
  本轮聚焦普通基础规范 00、01、02、10 与现有 L0/L1/L2 Rules 文件的稳定消费关系，只补充机制关系声明和同步触发，不复制规则正文。
decision: |
  在 `specs/00-LD-Vibe-Harness理念与纲要.md` 中补充与 L1 项目 Rules、L0 工作区 Rules 的机制关系声明。
  在 `specs/01-LDVH目录说明.md` 中补充与 L0 工作区 Rules、L1 项目 Rules、L2 specs Rules 的机制关系声明。
  在 `specs/02-LDVH术语规范.md` 中补充与 L0 工作区 Rules、L2 specs Rules 的机制关系声明。
  在 `specs/10-事实源边界与承载规范.md` 中补充与 L1 项目 Rules 的机制关系声明。
  因 00 新增机制关系声明导致 Human Gate 章节顺延，修正 01、02、03 中对 00 Human Gate 章节的引用。
  同步检查 Rules 文件来源，将 L0 工作区 Rules 的规范来源补充 00。
consequences: |
  - 00、01、02、10 已按 03 §六最小声明原则声明现有 Rules 消费关系。
  - Rules 文件仍只作为入口摘要和场景约束，不承载 specs 正式规范正文。
  - 本轮没有为无稳定实体消费的机制添加占位声明。
  - 后续若 00、01、02、10 的相关权威规则变化，应按声明同步检查对应 Rules 文件。
