        summary: |
          方案总体通过事实对象治理审核。小样本修复方向合适，且 WorkCase 已明确不进行全量批量改写、不写缓存或事实源、Human 确认前不执行修改。
        key_findings:
        - 小样本优先 `workcase-0001`、`spark-0016` 和 `study-0006`，能降低批量事实源风险。
        - 公共字段不是默认可写字段池，具体模型是否采用字段只由成员规范定义。
