title: 环境 Hook 对规范路径写入的主动保护与渐进式事实披露
intent: 保留目标环境能否在 AI 通过文件工具直接改写 ldvh 规范路径时，在写入前识别 canonical 目标、提供对应规范、行动模板和相关事实候选作为规则引导，阻止绕过 Helper 的直接改写并如实报告自身能力边界的问题，避免把只读上下文恢复误作写前保护，或以工具名和命令白名单替代实际操作与目标判断。后续需判断可用事件、输入 payload、受控写入放行、停用恢复和真实验收边界。
status: open
priority: P1
urls:
- ref: https://learn.chatgpt.com/docs/hooks
  title: Codex Hooks
  summary: 2026-07-24 读取的官方当前发行行为资料；确认 PreToolUse、PostToolUse、tool coverage、阻断与 additionalContext 输出、插件 Hook 信任以及 specialized tool opt-out。它只证明官方声明的候选能力，不证明 LDVH 插件已登记、受信任或在本机真实触发。
