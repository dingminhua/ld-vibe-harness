  summary: 迁移对照把 V3 的单点兼容检查扩展为当前的完整 Windows 运行链路验收：保留 CLI、路径、Git/AI
    入口、Web、测试和文档等验收面，同时以原生 Windows 的实际范围证据作为唯一支持结论门槛。
