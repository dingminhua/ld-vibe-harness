summary: 补充多角色思考触发语"多角度"及语义等价匹配原则
reason: >
  实际使用中发现，用户说"多角度分析"时 AI 未触发多角色思考行动模型，
  原因是 51 §7.1 触发语列表未包含"多角度"，且 L0 入口摘要只列"多角色、多视角"，
  AI 做字面匹配时遗漏了语义等价表述。此次变更：
  1. 51 §7.1 第 1 条补充"多角度"并增加语义等价表述示例；
  2. 51 §7.1 新增触发语匹配原则段落，明确"等"为非穷举、语义等价应触发、
     L0/L1/L2 入口摘要受篇幅限制以本条完整条件为准；
  3. L0 入口摘要补充"多角度"、增加语义等价提示、增加完整条件回引。
changed_files:
  - specs/51-multi-role-thinking-多角色思考.md
  - .trae/rules/ldvh-l0-rules.md
verification: >
  51 §7.1 第 1 条已包含"多角度"及语义等价表述示例；
  51 §7.1 已新增触发语匹配原则段落；
  L0 入口摘要已包含"多角度"和语义等价提示，并回引 51 §7.1 完整条件。
