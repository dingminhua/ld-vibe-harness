  - [x] 每个 WorkPlan 完成后均已安排独立专业子 Agent 做完成后检查，检查结论进入对应 WorkPlan 的 verification_evidence 或 closure_evidence
  - [x] 每个 WorkPlan 关闭前均已判断是否需要把经验写入 Memo、把可复用踩坑写入 Pitfall，或把流程改进候选分流为后续 WorkPlan
  - [x] 最终回报中明确说明三个 WorkPlan 的完成情况、校验结果、残留风险和经验总结
source: |
  Plan creation requested by dmh2002 on 2026-06-18:
  用户要求把这些事拆成三个 WorkPlan，审批后依次执行，中间不要停；若发生问题记录到 Memo，
  最后在回报中告知，并从过程中总结经验和问题，用于完善当前流程并为未来相关工作流程规范做准备。
  独立流程治理审批子 Agent 初审返回 REQUEST_CHANGES，要求明确计划审核和执行前批准门槛、过程 Memo 触发规则、
  流程改进候选稳定回写位置和专业复核要求。
  用户随后补充要求：WorkPlan 完成后还需要独立子 Agent 检查；WorkPlan 最终总结要写入 Memo 或 Pitfall；
  整个工作流程也要记录到 Memo，后续打磨成标准工作流程。
