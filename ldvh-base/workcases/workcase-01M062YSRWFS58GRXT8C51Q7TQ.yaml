status: closed
title: 实现 --fields 数组内字段选择，降低只读响应 payload
goal: 扩展 Helper CLI --fields 投影，使调用方能在不改变完整性语义与公共契约字段的前提下选择数组内字段（如 result.items[].fact_object.title），从而避免日常只读查询被迫读回完整对象；保持现有 object-only 点号导航行为不变，仅新增数组导航能力（既有断言中明确涉及数组路径的部分按新语义更新，其余全部保持），并产出可复核的 payload 降幅证据。
scope: 仅修改 code/ldvh/cli_projection.py 的字段选择与投影实现（parse_field_selectors / _lookup_object_path / _assign_object_path / project_response_fields）及其直接测试（code/tests/test_cli_projection.py、code/tests/helper/test_cli_process.py）。不改动 Helper 请求/响应公共契约字段、事实 Schema、其它 Code 模块、Web、specs、ldvh-base 事实对象，也不新增任何文档文件；不做批量读、条件过滤、compact profile 或统一删减等超出数组内字段选择的改动；不依赖固定模型统计对比；本地 commit 仅在 Human Gate 1 批准且逐项授权后执行。
success_criterion_definitions:
- criterion_id: criterion-array-field-selection
  statement: --fields 支持数组内字段选择：对 read-fact-objects 使用形如 result.items.fact_object.title 的 selector 时，返回所选字段值而不再报 missing；数组元素索引/映射语法按实现确定且与现有 selector 语法兼容。
- criterion_id: criterion-backward-compat
  statement: 现有 object-only 投影行为不变：outcome、result.items 等既有 selector 的投影结果、mandatory paths 与 missing 报告语义与改动前一致；test_cli_projection.py 与 test_cli_process.py 中除明确从数组路径 missing 改为数组导航语义的断言外，全部保持通过。
- criterion_id: criterion-evidence
  statement: 以 read-fact-objects 读取大对象为样例，实测记录数组内字段选择的响应体积与完整响应、fact_object 全量三者的字节数与降幅，形成可复核的 payload 证据，不声称 fixed-model 可比性或统一收益。
- criterion_id: criterion-quality
  statement: 目标与直接测试通过，修改文件通过 ruff 与 git diff --check；实现不绕过 Helper 写入、不直接修改 ldvh-base、不改变公共契约字段。
success_criterion_results:
- criterion_id: criterion-array-field-selection
  outcome: satisfied
  summary: --fields 现支持数组内字段选择：_lookup_object_path/_project_path 对 dict 按键、对 list 逐元素投影；真实 read-fact-objects 用 result.items.fact_object.title,result.items.fact_object.status 返回所选字段且 missing=[]；新增单测 test_project_fields_selects_into_array_members 与进程级 test_fields_selects_into_array_members_via_cli 均通过。
- criterion_id: criterion-backward-compat
  outcome: satisfied
  summary: 现有 object-only 投影行为不变：outcome/result.items 等既有 selector、mandatory paths、祖先/后代冲突检查保持原语义；test_cli_projection.py 与 test_cli_process.py 中除明确改为数组导航的断言外全部保持通过（93 passed：43+50）。
- criterion_id: criterion-evidence
  outcome: satisfied
  summary: 四类只读操作实测（全部 missing=[]）：read-fact-objects 完整响应 27322B→字段选择 477B（-98.3%），其中 fact_object 全量本体 10104B，选择 title+status 仅 477B（相对本体 -95.3%）；capabilities 70995→5769B（-91.9%）；read-action-template-candidates 14999→1651B（-89.0%）；read-specification-candidates 24525→2959B（-87.9%）。完整响应与字段选择为同一次真实调用的两个时点输出，fact_object 全量字节数取自同一对象（父 Spark）当前读取。证据可复核，不声称固定模型可比性。
- criterion_id: criterion-quality
  outcome: satisfied
  summary: 目标与直接测试通过（test_cli_projection 43、test_cli_process 51）；ruff 对三个修改文件 All checks passed；git diff --check 通过；未绕过 Helper 写入 ldvh-base、未改公共契约字段、未改其它模块。
result_summary: Helper CLI --fields 已支持数组内字段选择：_lookup_object_path 改为结构保持的 _project_path（dict 按键、list 逐元素投影），_assign_object_path 改为 _deep_merge 深合并（list 按索引合并，支持多 selector 穿过同一数组）。真实 worktree 实测四类只读操作选择少量字段即可降低 payload 87.9%-98.3%（read-fact-objects 另在实现期测得 23510B→449B 的同一机制先行验证，两次为不同时点实测）；现有 object-only 投影、mandatory paths、冲突检查全部保持。不声称固定模型可比性或统一收益。
validation_summary: test_cli_projection.py 43 passed（含 3 个新增数组测试）、test_cli_process.py 51 passed（含 1 个新增进程级数组测试）、聚焦回归 133 passed；ruff 三文件 All checks passed；git diff --check 通过；端到端真实 read-fact-objects --fields 数组选择返回正确且 missing=[]。全量非目标测试未作为本结果完成依据。
closure_outcome: completed
disposition_summary: 按 completed 关闭：--fields 数组内字段选择已实现并验证，四类只读操作 payload 降幅 87.9%-98.3%，现有 object-only 投影与公共契约保持，4 条成功标准全部 satisfied，独立结果复核通过且全部 feedback 已处置，原 scope 内无剩余责任。
spark_suggestions:
- suggestion_id: suggestion-array-nav-edge-cases
  suggestion_kind: follow_up_opportunity
  summary: 数组导航的两个边角语义（空数组子路径由 missing 变为 present-[]；异质数组多 selector 时 _deep_merge 长度不等会整体替换）已由空数组边角测试覆盖其一，异质数组长度不等语义尚未文档化。
  follow_up_summary: 该增强不是本次成功标准的剩余责任；由 Human 在本 WorkCase Gate 2 之后独立决定是否另建 Spark 或 WorkCase，当前不自动创建、不执行。
