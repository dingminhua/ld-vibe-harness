title: 原生 Windows 支持范围与真实验收
intent: 保留原生 Windows 支持范围与真实验收的独立议题，避免把其它平台的候选兼容、局部脚本可运行或某一环境的安装成功误作完整支持。后续需判断核心运行链路哪些已在授权的原生 Windows 环境得到证实、哪些仍缺少验收，以及是否值得转为明确的实施工作。
status: implemented
summary: "**当前判断**\n\n- Windows 支持不是单个 Python 命令能够运行，而是从安装、入口触发、路径判定和 Git hook，到 Web 开发、测试与文档的完整运行链路。\n- 只有在 Human 指定并授权的原生 Windows runner 上取得的范围匹配证据，才能形成该范围的支持或未支持结论；其它平台的候选兼容、回归结果或局部安装成功都不能替代。\n- 操作系统支持与多环境 AI Hook 接入是相关但不同的问题：前者关注路径、shell、安装、Git 与测试等 Windows 差异，后者不能自动证明 Windows 已可用。\n\n**需要逐项界定的验收面**\n\n- CLI 与文档入口：Python 命令、PowerShell/cmd/Git Bash 的等价调用，以及无 Hook 时的 Rules 路径。\n- 路径与管辖判定：盘符、反斜杠、大小写、UNC、worktree、链接和路径规范化是否影响目标识别与 receipt。\n- Git 与 AI 入口：hook 的 shell、换行、可执行语义、带空格路径、环境变量、stdin JSON、cwd 与阻断语义。\n- Web 与测试：npm/启动链路、核心 CLI、adapter、hook 安装或 dry-run、路径单测与文档验收是否具有 Windows 上的实际结果。\n\n**边界与未决事项**\n\n- 不预设 Windows 已支持，也不因非 Windows 环境通过而宣布支持；每一项结论必须附带实际 runner 与覆盖范围。\n- 需要先形成最小验收矩阵，再判断哪些缺口应进入 WorkCase；耐久性、最低依赖、推荐 shell、已验证 AI 环境和已知限制中需要 Human 决定的部分仍保持待决。\n\n**方向决定（2026-08-05）**\n\n- Windows 侧工作放到原生 Windows 环境执行：执行环境=目标环境，范围匹配证据链最短（33 D.5 的恢复包路径不采用）。\n- mac 侧完成平台无关规则层：撞号处置程序已由 workcase-0060 落为 05 §9.4。\n- Windows 上以入口引导测试为验收起点：clone 源码 → `ldvh doctor`/`capabilities` 即验收矩阵第一项；在 Windows 创建首个受控事实对象本身作为受控写链路的验收证据；写事实前先 pull、写完即 push。\n- 本 Spark 的验收矩阵其余项仍在 Windows 实测中形成，保持 open。"
