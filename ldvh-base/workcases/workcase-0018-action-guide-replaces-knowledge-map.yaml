        - code/specs_validate.py
        - code/spec_checks/knowledge_map.py
        - rules/LDVH-RUNTIME-PROTOCOL.md
        - specs/06-运行时扩展规范.md
      expected_output: |
        明确 action-guide 触发频率、receipt / brief / standard / full 输出模式、默认预算、同输入去重、guide_receipt 指纹、pre-tool-use 只查 receipt 的规则，以及何时因 target/diff/action_hint 变化或缺 ack 重发摘要；避免“每次行动”都刷完整指南造成高噪声高打扰。
      status: skipped
      blocking_reason: ''
      result_summary: |
        Human 确认不继续推进 action-guide；交互密度与 receipt 策略不再作为本 WorkCase 执行目标。
      evidence_refs: []
    - id: item-4
      title: 主控吸收方案审查并提交 Human 方案确认
      role: controller-synthesis
      mode: single
      input_refs:
        - ldvh-base/workcases/workcase-0018-action-guide-replaces-knowledge-map.yaml
      expected_output: |
        吸收 AI 价值审查和规范审查结论，修正 WorkCase 方案；若无未决硬问题，则填写 plan_review.controller_resolution，并将状态推进到 human_plan_confirming 等待 Human 确认执行；若仍有硬问题，保留 subagents_plan_reviewing 并安排二次审查。
      status: skipped
      blocking_reason: ''
      result_summary: |
        主控已吸收已有方案审查结论和 Human 最新关闭判断：方向曾成立但不继续执行，WorkCase 以 cancelled 结果关闭。
      evidence_refs: []
  plan_review:
    orchestration_owner: main_controller
    workflow_ref: null
    review_policy:
      selection_reason: |
        本 WorkCase 会把 LDVH 默认行动入口从 knowledge-map / 旧 Rules 长路由迁移到行动指南，并涉及 active specs、运行时资产、所有管辖项目事实源、Runtime Protocol、dispatcher、Code CLI、测试和 Web 文案。执行前必须先确认该能力是否真正服务 AI 行动价值，并确认它不冲突现有规范边界和事实源边界。
      required_perspectives:
        - AI 价值审查
        - 规范审查
        - Code 可实现性/交互密度审查
      optional_perspectives:
        - 跨项目事实源边界
      tool_method_requirements:
        - 行动指南必须在既有知识地图能力和前序行动指南要求基础上补充加强，不得违背或弱化。
        - knowledge-map 最终删除前，必须完成 action-guide CLI/API、Schema、dispatcher receipt、fallback read_plan、测试和文案迁移。
        - 所有管辖项目是可查询/可召回范围，不是全量上下文注入；输出必须 target-first、current_project 起步、P0/P1 渐进读取。
        - 行动指南不得替代 Runtime Protocol / dispatcher 门禁、specs 权威、Human Gate 授权或 AI 对用户意图的初判。
        - Code 可实现性审查必须判断 action-guide 能否从现有 specs、事实源、运行时资产和 Git 输入确定性生成；必须评估每次 AI 行动都触发指南是否过密、过长、重复或打断执行，并提出节流、摘要、模式或分级输出策略。
      aggregation_rule: |
        若 AI 价值审查认为行动指南不能显著降低 AI 错读、漏读、旧 Rules 长路由回潮或跨项目遗漏风险，本 WorkCase 不得进入实现；若规范审查发现与 04/06/07/21 或 Runtime Protocol 冲突，必须先修正方案；若 Code 可实现性/交互密度审查认为 action-guide 无法确定性生成或会造成高噪声高打扰，必须先补分级输出、节流和预算策略，再提交 Human 方案确认。
      review_items:
        - id: plan-review-ai-value-1
          reviewer: subagent-ai-value
          role: AI 价值审查
          agent_name: Anscombe
          requested_at: '2026-06-27T06:08:30+08:00'
          perspective: ai-value-review
          result:
            status: fail
            summary: |
              方向成立，但当前 WorkCase 更像设计任务单，尚不足以作为 AI 可稳定执行的行动指南契约。进入实现前需要补 AI-facing Schema 细化、读后行动计划合成规则、AI 价值成功指标、字段预算和最小调用输入。
            key_findings:
              - 缺少字段必填性、失败态、字段间合成关系、post-read action plan 结构和 fallback 分流语义。
              - 缺少 AI 在消费 P0/P1 后如何从 read_plan、stop candidates、tool_plan、Human Gate candidates 和 diagnostics 合成下一步行动的规则。
              - 缺少可验证的 AI 价值成功指标与 fixture / 回归场景。
              - 全行动范围和全管辖项目召回容易对 AI 过重，需要字段预算和渐进展开约束。
            required_changes:
              - 补 action_guide 最小 Schema：action_type、target_evidence、source_refs、must_read_p0_p1、tool_plan、stop_candidates、human_gate_candidates、diagnostics/result_status、post_read_action_plan、verification_plan、fallback。
              - 补 AI 使用流程：识别 target、生成行动指南、读 P0/P1、acknowledge、合成 post-read action plan、执行/STOP/提问、验证。
              - 补最小提示输入：用户目标、cwd、target paths、action hint、diff/staged paths、explicit project、是否跨项目召回。
              - 补成功指标和测试场景：错读防止、旧 Rules 长路由防回潮、跨项目查重、knowledge-map 不可用 fallback、读后行动计划质量。
              - 补字段预算：P0/P1 数量上限、attention points 3-5 条、P2/P3 只通过 next_queries 展开、全管辖项目只做召回/影响判断不注入全文。
            evidence_refs:
              - ldvh-base/workcases/workcase-0018-action-guide-replaces-knowledge-map.yaml
              - ldvh-base/sparks/spark-0035-knowledge-map-proactive-alerting-gap.yaml
              - specs/attachments/04.Att.06-知识地图投影Schema表.md
              - specs/06-运行时扩展规范.md
        - id: plan-review-spec-1
          reviewer: subagent-spec-boundary
          role: 规范审查
          agent_name: Aristotle
