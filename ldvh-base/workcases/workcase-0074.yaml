title: 补足草案字段定义入口的运行时可发现性
status: open
phase: human_plan_confirming
priority: P0
plan_version: 1
goal: 在不内联枚举、约束正文或完整对象模板的前提下，让 prepare-fact-object-draft 的每个 field_contract 同时给出唯一可定位的 definition_ref 与现有 constraint_ref，使 constraint_ref=inherit 的字段仍能回到其权威定义。
scope: 仅覆盖 prepare-fact-object-draft 的 field_contracts 来源定位与草案 schema_fingerprint：specs/05-事实模型基础规范.md、code/ldvh/specs/fact_type_projection.py、code/ldvh/facts/schema.py、必要的 code/ldvh/facts/creation.py、code/ldvh/helper/operations/fact_creation_operation.py，以及对应 tests。排除 allowed_values、约束正文、最小合法 fact_object、创建/持久化/状态语义、关系导航、Worker、外部写入和 Git commit。
success_criterion_definitions:
- criterion_id: criterion-source-contract
  statement: 05 §11.3 将 field_contracts[] 定义为 field_path、json_type、presence、definition_ref、constraint_ref 的闭集；definition_ref 恒为含 field_key 的唯一 canonical 定义入口，constraint_ref 仍仅表示类型收紧位置或 inherit。
- criterion_id: criterion-projection
  statement: 所有当前类型的直接与递归草案字段都公开非空 definition_ref；priority 同时呈现 definition_ref 与类型 constraint_ref，inherit 字段可通过 definition_ref 定位权威定义，且 definition_ref 身份变化会使旧 draft basis 的 schema_fingerprint 失效。
- criterion_id: criterion-boundary-validation
  statement: 定向单元/CLI 回归通过，并断言 field_contracts 不出现 allowed_values、constraints、template 或 fact_object 等第二 schema 内容，既有 prepare/create 行为保持。
work_items:
- item_id: item-source-contract
  goal: 定义 field_contracts 中 definition_ref 与 constraint_ref 的唯一职责和 inherit 阅读边界。
  expected_result: 05 的草案结果字段闭集与来源身份边界明确，不复制字段约束正文。
  approach_summary: 只修改共同草案来源，明确 canonical 参考的格式和 fingerprint 影响。
  status: pending
- item_id: item-projection
  goal: 在现有派生层保留完整 definition_ref，并将其纳入草案投影与 schema 指纹。
  expected_result: 事实类型投影、schema 与 prepare 输出从同一派生来源传递完整参考，不在运行时拼接第二套规则。
  approach_summary: 由拥有 field_key 的事实类型投影层形成 canonical ref，schema 与 Helper 原样传递。
  status: pending
  depends_on:
  - item-source-contract
- item_id: item-validation
  goal: 验证通用投影、指纹失效、CLI 输出和禁止内容边界。
  expected_result: 覆盖五类型、直接与递归字段、priority/inherit 示例、旧 basis 拒绝及既有 create/prepare 回归。
  approach_summary: 增加定向 schema、Helper 和 CLI 测试，并运行差异检查。
  status: pending
  depends_on:
  - item-projection
execution_authorization:
  authorized_actions:
  - action_id: authorization-edit-contract
    summary: 修改 05 §11.3，定义草案 field_contracts 的 definition_ref/constraint_ref 共同职责。
    target_scope: specs/05-事实模型基础规范.md
    effect_scope: 只收紧草案结果的来源定位闭集与 inherit 边界；不写枚举、约束正文或对象模板。
    risk_summary: 若引用格式不唯一或语义混淆，会形成第二定义入口或破坏调用兼容性。
    rollback_summary: 在未提交工作树中仅撤回本次授权路径差异；发现需要改动未列路径或复制约束时停止。
    rule_refs:
    - fact-model-foundation::11.3 事实对象草案准备输入与结果
  - action_id: authorization-implement-projection
    summary: 在派生投影、schema 指纹和 prepare 输出中保留完整 definition_ref。
    target_scope: code/ldvh/specs/fact_type_projection.py；code/ldvh/facts/schema.py；必要时 code/ldvh/facts/creation.py；code/ldvh/helper/operations/fact_creation_operation.py
    effect_scope: 仅扩展来源绑定 field_contract 投影与其 schema fingerprint；不改变创建、持久化、状态或关系逻辑。
    risk_summary: 引用在错误层拼接或未进入指纹会造成漂移、旧 basis 误用或第二 schema。
    rollback_summary: 在未提交工作树中撤回本次代码差异；任何需内联约束值或改动未列路径时停止。
    rule_refs:
    - fact-model-foundation::11.3 事实对象草案准备输入与结果
  - action_id: authorization-run-validation
    summary: 增加并运行 schema、Helper/CLI 定向测试、旧 basis 拒绝测试和差异检查。
    target_scope: code/tests/facts/test_schema.py；code/tests/helper/test_fact_creation_operation.py；code/tests/helper/test_cli_process.py；当前工作树只读验证输出
    effect_scope: 可修改列明测试并运行本地验证；不写事实源或外部系统。
    risk_summary: 验证可能暴露需超出计划范围的兼容性问题。
    rollback_summary: 保留验证输出；若修复需未列文件或改变草案语义则停止并呈报。
    rule_refs:
    - fact-model-foundation::11.3 事实对象草案准备输入与结果
  - action_id: authorization-delegate-result-review
    summary: 委派独立只读子代理复核实现、验证和第二 schema 边界。
    target_scope: 本 WorkCase 的已授权差异和验证材料
    effect_scope: 只读审查，不授予文件、事实或外部写入。
    risk_summary: 审查发现问题会阻止关闭。
    rollback_summary: 不产生持久副作用；按反馈修正或据实收敛。
    rule_refs:
    - workcase-fact-type::6. 状态、阶段与生命周期
  - action_id: authorization-independent-result-review
    summary: 取得并记录独立只读结果复核，以判断成功标准和范围边界。
    target_scope: 本 WorkCase 的最终 result projection 与验证输出
    effect_scope: 只读复核，不扩展实现或授权范围。
    risk_summary: 复核结论可能要求返修或 partial 收敛。
    rollback_summary: 不产生持久副作用；反馈按 WorkCase 生命周期处理。
    rule_refs:
    - workcase-fact-type::6. 状态、阶段与生命周期
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-delegate-result-review
    result_review_action_id: authorization-independent-result-review
  action_ceiling: 仅限上述规范、投影、schema、prepare 与测试路径；没有本 WorkCase 新 Gate1 批准不得开始任何实现或规范修改。
  allowed_adjustments: 可在已列文件内收紧完整 definition_ref 格式、指纹覆盖和测试断言；不得增加约束值、对象模板或新的草案语义。
  verification_and_rollback: 先运行定向 schema/Helper/CLI 测试和 diff 检查，再进行独立结果复核；所有改动保持未提交，范围或验证失败时停止。
  out_of_bounds_handling: 任何需要内联 enum/constraints、生成最小对象、改变 create/persistence/status 语义、修改未列文件或外部系统的发现，立即停止并请求新的 WorkCase/Gate1。
  prohibited_actions:
  - Git commit
  - push
  - 外部网络写入
  - 事实对象创建或修改（本 WorkCase 自身受控写回除外）
  - Worker 对照实验
  - 关系导航范围扩展
  human_prerequisites:
  - Human 对 WorkCase-0074 的完整 plan_version=1 与 execution_authorization 作出 Gate1 执行批准
