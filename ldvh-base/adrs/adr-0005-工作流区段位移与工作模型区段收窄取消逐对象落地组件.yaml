id: adr-0005
type: adr
title: 工作流区段位移与工作模型区段收窄，取消逐对象落地组件
status: accepted
created: '2026-06-05T05:55:40.548374'
updated: '2026-06-05T06:10:00.000000'
context: "LDVH specs 架构在 2026-06-05 经历重大重组：\n\
  \n\
  1. 工作流区段从 50-79 移至 40-59，原因：工作流比工作模型更靠近基础规范，上移使 40-59 紧接 00-08 基础规范区段，逻辑更清晰；\n\
  2. 工作模型区段从 20-49 收窄为 20-39，原因：当前 active 工作模型仅 7 个（21-27），49 预留过大，收窄至 39 为未来工作流程区段让出空间；\n\
  3. 现有工作流程 51-multi-role-thinking 重编号为 41-multi-role-thinking（含 6 个历史机制文件 41.01-41.06）；\n\
  4. 移除逐对象\"落地前决策\"\"价值与要素审查\"\"落地初始化\"\"落地审计\"\"合规检查\"5 个标准组件，原因：初始化/审计是产品级操作，不是每个工作模型各自选择；\n\
  5. 替换为\"对象特有实例检查\"（21-23 工作模型主规范）和产品级初始化/审计（07/08/20 定义，42/43 工作流程执行）；\n\
  6. 术语统一：模型实践子文档/附件型实践子文档→历史机制文件，契约子文档/Contract 子文档→结构化契约文件；\n\
  7. 修正旧引用：specs/10/11/12/13/14→04/05/06/07/08，50/51→08/41；\n\
  8. 00 §4.3 价值与要素审查→价值一致性判断，不再作为独立落地流程；\n\
  9. 固定 NN.01-NN.06 子文档结构取消，历史机制文件仅作为迁移前过渡资料，不作为工作模型完整性默认要求。\n\
  \n\
  变更涉及 45 个文件（+454/-788），含 7 个 rename（51→41），提交 83731f8。"
decision: "1. specs 编号体系从此稳定为：00-08 基础规范，20-39 工作模型（20 为索引），40-59 工作流程（08 同时承担区段索引）。\n\
  2. 工作模型主规范（21-27）不再包含落地前决策、价值与要素审查、落地初始化、落地审计、合规检查章节，只保留对象特有实例检查。\n\
  3. 产品初始化、产品审计是产品级工作流程，由 42/43 工作流程负责执行，不在每个工作模型主规范中重复。\n\
  4. 历史 NN.01-NN.06 机制文件不再作为工作模型或工作流程完整性默认要求，新增内容应按机制归属进入主规范、05、06、08、Rules、Skill 实体或实现目录。\n\
  5. 术语体系从此统一：历史机制文件（替代模型实践子文档/附件型实践子文档）、结构化契约文件（替代契约子文档/Contract 子文档）。\n\
  6. AI 运行 Rules 入口（.trae/rules/）必须同步更新以反映新编号体系，否则 AI 会按旧路径查找规范。"
consequences: "1. 所有引用 specs/10-14、specs/20-22、specs/50-79 的外部文档需要更新（已完成 specs/、.trae/rules/、evals/ 和 ldvh-base/*/README.md 更新）；\n\
  2. 42 产品初始化工作流程和 43 产品审计工作流程待创建，当前缺少这两个关键工作流程的正式规范；\n\
  3. 历史机制文件（21.01-27.06 等）中可能仍有旧术语残留，需逐步审计；\n\
  4. 现有工作模型主规范（21-27）的 Phase 表已清理旧行，但机制适配边界表格可能需要进一步对齐新术语。"
