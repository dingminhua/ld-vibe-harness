title: WorkCase 独立复核的跨环境能力路由与重复复审机制
status: implemented
intent: 明确 WorkCase 在方案侧与结果侧两个独立复核位置如何复用同一套跨 Agent 环境能力路由，并区分固定的审核位置与可重复发生的审核轮次。每次进入 WC 相关的新建、恢复、压缩后继续或接管对话时，必须先消除适用的 Human 明确启用门槛，再执行一次只读能力预检；在取得只读协作 Worker／subagent 的当前明确启用指令并重新探测前，不得把 `permission_required`、`not_authorized` 或 `unknown` 写成 `unavailable`；优先使用可由 Human 指定模型并新开独立、持久协作会话的模式，缺失时按一次性 subagent、same-AI 切换 Reviewer 视角的 1→2→3 顺序自动降级，第三档强制添加能力受限说明。规则还需约束创建前在确认协作模式可用时向 Human 发出一次“使用什么模型”的自由文本询问、Gate 1 冻结 reviewer policy、每轮最多三个审查视角，以及发现问题、修正后对新版本重复复审的循环，避免把两个生命周期位置误解为固定只审两次，或因环境能力不同而临时发明不一致做法。
summary: "## 已落实机制\n\n- WorkCase 当前规则已区分瞬时入口权限状态与 Gate 1 冻结的 reviewer policy，并固定 collaboration Worker → native subagent → same-AI 的三档路由顺序及各档保证边界。\n- 受控创建流程已要求在适用时完成只读 Reviewer 能力解锁、能力预检、协作模型选择与实际 agent/model 映射，并把降级顺序、每轮视角上限及 same-AI 限制写入 Gate 1 授权基线。\n- 获批计划执行模板已覆盖新建、恢复、压缩后继续与接管时的当前权限重检和能力预检；每次复核前重新确认快照有效，能力变化时按冻结 policy 选路。\n- 方案侧与结果侧均允许不限轮次的 fresh review；PlanΔ 或结果版本变化会使旧 review 失效，修正后的新版本必须重新复核，每轮按冻结上限使用 1–3 个视角。\n\n## 保证边界\n\n- 三档执行方式不得互相冒充；same-AI 仍是低保证 fallback，必须记录能力证据、保证差距和停止条件。\n- 能力解锁和模型选择不构成第三个 Human Gate，也不授权实现、事实写入、提交或其它副作用。\n- 当前规则与模板落实只结束本 Spark 的机制定义入口，不证明任何特定宿主已经提供协作能力、真实触发了复核，或每个 WorkCase 均已正确执行该机制。\n- 一般 WorkCase Controller 的推进、停止、恢复和缺口交还属于更宽的行动编排问题，不由本 Spark 的完成结论代替。"
