title: 修复聚焦页待决定事项收录与完整呈现
status: open
goal: 让聚焦页中 WorkCase 与 Pitfall 的行动性收录继续只使用既有‘待决定事项’和‘推进中事项’两个模块，不因 blocked 新增第三个行动性模块；其它既有非行动模块保持不变。所有 current_snapshot_projection resolved 且 status 为 open 或 blocked 的 WorkCase 按 progress_group 确定性进入两个行动模块之一：plan_confirmation 或 closure_confirmation 即使 blocking_overlay=true 也保留在待决定事项并显示阻塞待处置、禁止正常 Gate 等待话术；progressing 包括 blocked 继续进入推进中事项。Pitfall draft 继续进入待决定事项并呈现有判断价值的完整普通 Card；不解析 AI 或自由文本，不新增持久派生字段或第二状态模型。
scope: 覆盖编码前 Code Implementation Plan；web/api/routes/cognition.ts 的行动性收录分类与 DTO；web/src/utils/api.ts 的 inbox 类型；web/src/pages/CognitionCenter.tsx 既有待决定事项与推进中事项、计数/摘要、blocked Human-position 和 Pitfall draft Card；web/src/pages/ObjectList.tsx 及必要的新共享 Pitfall Card 内容组件；web/src/i18n/locales.ts；web/docs/02-CognitionCenter.md；直接相关 cognition、WorkCase presentation 和 Card contract tests；当前事实的本地浏览器代表性核验；workcase-0044 受控写回和隔离本地语义 commit。保留 specs/21 与 workcase-0041 的投影合同，不修改 Python、Helper、generated contract 或 Specs，不新增行动性模块，不修改近期动态、Spark 健康、近期提交热点关系等其它既有模块，不创建或修改 Pitfall 事实，不修改其它事实对象。
success_criterion_definitions:
- criterion_id: criterion-workcase-unique-action-module
  statement: 每个 current_snapshot_projection=resolved 且 status 为 open/blocked 的 WorkCase 恰好归入既有两个行动性模块之一：progress_group=plan_confirmation/closure_confirmation 进入待决定事项，其中 blocking_overlay=true 使用 blocked_resolution 且禁止 Gate 1/Gate 2 waiting；progress_group=progressing 包括 blocked 只进入推进中事项。unresolved 不进入任一行动模块，并在 API issues 与页面降级中如实可见，禁止 raw status/phase fallback。
- criterion_id: criterion-current-four-workcases-visible
  statement: 当前 ldvh 的 workcase-0008、workcase-0026、workcase-0027、workcase-0043 均按当前事实出现在聚焦行动模块：0008/0026 为方案待确认，0027 为阻塞待处置且当前位置为方案确认，0043 为关闭待确认；0027 不生成等待 Gate 1 或批准当前方案的文案。
- criterion_id: criterion-pitfall-draft-full-card
  statement: Pitfall status=draft 确定性进入待决定事项并复用共享普通 Pitfall Card；正文呈现 symptoms、trigger_conditions、resolution、avoidance、validation_summary、applicability 中当前可读且有判断价值的字段，active/discarded 不误入待确认，字段异常如实降级。当前 ldvh 没有 draft Pitfall，因此本标准由受控 fixture/API/UI contract 验证，不创建或修改事实以制造演示数据。
- criterion_id: criterion-existing-module-and-source-boundary
  statement: WorkCase/Pitfall 行动性收录只使用既有待决定事项和推进中事项，不新增第三个行动性模块；近期动态、Spark 健康、近期提交热点关系等其它既有模块不修改。没有 YAML 派生字段、waiting_on/AI 文案解析、raw status/phase downstream fallback 或第二张 phase 表；API types、i18n、docs、计数与复制摘要一致。
- criterion_id: criterion-validation-review-and-isolation
  statement: Code Implementation Plan、目标和全量 Web API tests、npm check/build、git diff --check、路径白名单、当前 WorkCase 浏览器代表性核验、Pitfall draft fixture 契约、WorkCase 精确回读、全库事实完整性、dirty 哈希隔离和独立只读结果复核在实际范围完成；浏览器与 fixture 结果、既有失败和未运行范围分开记录，不声称 live draft Pitfall 浏览器验证。
priority: P1
phase: executing
plan_version: 1
work_items:
- item_id: item-audit-cognition-action-contract
  goal: 审计聚焦行动性模块当前收录、投影消费、Pitfall Card、测试和 dirty 基线。
  expected_result: 形成 resolved/unresolved、progress_group、blocking_overlay、handoff key、Pitfall draft 与两个既有行动模块的精确消费矩阵和路径白名单。
  status: completed
  result_summary: 审计确认：Cognition 现有 API 在 blocking_overlay 时提前排除 WorkCase，导致 blocked Human-position 从待决定事项消失；Pitfall draft 已被 API 收录但页面正文返回 null。既有两个行动模块足以承接：plan/closure group 进入待决定事项，progressing 进入推进中；unresolved 不猜测。实际 Pitfall 字段已由共同事实读取合同传递，无需修改该合同或创建测试事实。
- item_id: item-form-cognition-code-plan
  goal: 在修改 Web Code 前形成并登记本增量 Code Implementation Plan。
  expected_result: code/plans/cognition-actionable-items.md 与 code/plans/README.md 记录责任、依赖、接口、诊断、回滚、验证和路径边界，不取得事实或投影语义权威。
  status: completed
  depends_on:
  - item-audit-cognition-action-contract
  result_summary: 已创建并回读 code/plans/cognition-actionable-items.md，并在 code/plans/README.md 登记稳定入口；计划固定两个既有行动模块、resolved 唯一归属、blocked 非 Gate、Pitfall 共享 Card、unresolved 零猜测、诊断/回滚/验证和 dirty 隔离，不定义领域语义。
- item_id: item-fix-workcase-action-membership
  goal: 修正 WorkCase 在待决定事项与推进中事项之间的唯一归属和 blocked Human-position 呈现。
  expected_result: resolved plan/closure group 的 blocked WorkCase 进入待决定事项并显示 blocked_resolution，实际 Gate 仍只由 handoff key 表达；progressing 包括 blocked 继续只进入推进中；unresolved 如实降级。
  status: completed
  depends_on:
  - item-form-cognition-code-plan
  result_summary: Cognition API 现由 resolved progress_group 决定两个既有行动模块的唯一归属：plan/closure group 进入待决定事项，progressing 进入推进中。blocking_overlay=true 的 Human-position 形成 blocked_resolution 并携带 lifecycle_position/isBlocked，不生成正常 Gate 类型；unresolved 继续排除并保留 issues，无 raw status/phase 或文案回退。
- item_id: item-complete-pitfall-draft-card
  goal: 补齐 Pitfall draft 在待决定事项中的共享普通 Card 内容、类型、计数和本地化。
  expected_result: Pitfall draft 使用与对象列表共享的字段级 Card 内容，API/types/UI/i18n/摘要一致；active/discarded 与坏字段负例成立，不创建测试事实。
  status: completed
  depends_on:
  - item-form-cognition-code-plan
  result_summary: ObjectList 现导出共享 PitfallCardContent，Cognition draft Card 直接复用；六个判断字段按共同字段标签与原文呈现，字段问题仍由既有读取诊断就地显示。API 仍只收录 status=draft，active/discarded 不进入；受控 preview 的 pitfall-0101 六字段 fixture 与 source contract 均通过，未创建或修改 Pitfall 事实。
- item_id: item-update-contracts-and-verify-ui
  goal: 同步 Web 文档和契约测试，并完成类型、构建、API、fixture 与当前事实浏览器核验。
  expected_result: 目标与全量验证在实际范围完成；当前四个 WorkCase 浏览器行为、Pitfall draft fixture Card、禁语、唯一归属、其它模块不变和 dirty 隔离均有可复核依据。
  status: in_progress
  depends_on:
  - item-fix-workcase-action-membership
  - item-complete-pitfall-draft-card
  current_summary: WorkCase 与 Pitfall 实现、docs/types/i18n/tests 已同步；目标测试、check、build 与实际 API 快照通过，正在收敛全量测试既有失败、浏览器工具缺口、diff/dirty 和提交验证。
  resume_from: 重跑最终 build/目标测试，记录全量 API 唯一既有失败与浏览器专用入口不可用，完成路径白名单、dirty 哈希、事实完整性和本地语义提交。
- item_id: item-independent-review-and-closure-preparation
  goal: 完成独立只读结果复核、Controller 反馈处置、结果检查和关闭准备。
  expected_result: 独立 Reviewer 核对批准基线、实际 diff、两个行动模块、Pitfall fixture、浏览器与验证边界；Controller 按真实 phase 连续形成完整结果与关闭提案，不以聊天总结替代写回。
  status: pending
  depends_on:
  - item-update-contracts-and-verify-ui
