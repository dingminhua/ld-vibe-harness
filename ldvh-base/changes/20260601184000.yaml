type: change
title: 补充现有 Rules 反向发现审计要求
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  审计 L0/L1/L2 Rules 时，不能只检查已有 Rules 文件本身，还需要读取 specs 根目录正式文档，反向发现是否存在应由 Rules 承接的稳定入口、触发或运行时约束。
  原 `specs/11.01-Rules机制规范.md` 已定义 Rules 分层、机制关系声明和 Rules 变更流程，但缺少对现有 Rules 审计时如何从 specs 根目录文档发现遗漏 Rules 需求的明确要求。
decision: |
  在 `specs/11.01-Rules机制规范.md` 的 Rules 与机制关系声明章节补充现有 L0/L1/L2 Rules 审计顺序。
  要求审计时读取 `specs/*.md` 根目录正式文档，区分普通基础规范、机制基础规范、模型基础规范、区段索引文档、具体事实模型和具体行动模型。
  要求普通 specs 文档依据 `specs/03-Specs文档规范.md` §六判断 Rules 机制关系，事实模型和行动模型通过 NN.01-Rules.md 模型实践子文档承接，不改用普通机制关系声明。
  在规则检查项中加入“反向发现”检查，要求审计现有 Rules 时确认已读取 specs 根目录正式文档并区分 Rules 需求来源。
consequences: |
  - 现有 Rules 审计从单向检查 Rules 文件，扩展为 specs 根目录正式文档到 L0/L1/L2 Rules 的反向发现。
  - Rules 文件仍只承载必要入口摘要和权威 specs 引用，不成为第二事实源。
  - 后续审计可更稳定发现 L0/L1/L2 是否缺少入口、规范来源、维护边界、生效方式、压缩保护或 L2 引导。
affects:
  - specs/11.01-Rules机制规范.md
related_rules:
  - specs/03-Specs文档规范.md
  - specs/04-LDVH模型子文档规范.md
  - specs/13-LDVH事实模型基础规范.md
  - specs/14-LDVH行动模型基础规范.md
human_gate:
  required: true
  confirmed_by: user
  confirmation_context: 用户指出应读取每个 specs 根目录文档发现是否有需要加入 L0/L1/L2 的内容，并建议在 11.01 设计检查现有规则的要求。
validation: |
  待执行一致性检查和测试。
