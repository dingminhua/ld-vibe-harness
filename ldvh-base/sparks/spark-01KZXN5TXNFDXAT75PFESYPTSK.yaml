  summary: 在 workcase-0008 完成历史正式化、恢复完整召回后，已建立 workcase-0010 承接全部机械结构校验闭环。该承接覆盖规则清单、Specs 同步、统一入口与范围测试；Spark 因入口职责已完整移交而 routed，不把 WorkCase 尚未执行误写为已完成。
