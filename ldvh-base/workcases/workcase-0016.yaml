title: 实现 WorkCase 关闭责任、Pitfall 草稿与 related-to 模型
status: open
phase: human_closure_confirming
plan_version: 1
priority: P1
summary: 完整结果、独立 pass 复核与关闭提案均已形成，正在等待 Human 决定是否按 proposed_outcome=completed 关闭。
goal: 把 spark-0036 中 Human 已确认的统一模型完整落入当前规则源、派生 Schema、Helper 受控操作、Web 呈现与验证，使 WorkCase 执行期对象创建边界、Pitfall draft/active/discarded/retired 生命周期、三类关闭责任处置和 WorkCase related-to 关系都可一致理解、机械检查并由 Human 使用。
scope: 覆盖 specs/05、20、21、23、31、32、相关附件（至少 05.Att.01、05.Att.02、08.Att.01）和 specs/08；覆盖 Code 中事实 Schema、validation、relations、Pitfall 更新或专属 lifecycle 操作、WorkCase update/close/correct、F1/F2/F3 投影与默认召回；覆盖 Web closure Card、Pitfall 状态标签与关系详情；更新直接契约/回归测试与必要文档。按 adr-0001 先修规则源再实现。必须逐段保留当前 Working Tree 已有 specs/08 与 Web 改动，不覆盖、不回退。排除：迁移或批改既有事实对象、修复 spark-0003/workcase-0015 的既有无效问题、给 closed WorkCase 补历史关系、创建或处置本案范围外事实对象、Git commit/push/PR、真实环境部署。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: 目标模型在所有责任来源与附件中完整一致，明确 execution approval 的局部作用域、四状态 Pitfall、非原子 draft→WorkCase 写边、两类 spark_suggestions 条件、route_existing 两类 target、related-to 替换/环/closed 更正规则及消费闭集，并消除旧规则矛盾。
- criterion_id: criterion-mechanics
  statement: 派生 Schema 和 Helper/Code 对新增状态、字段、条件、关系目标、转换、CAS、关闭映射和默认召回具有机械约束与正反测试；promote 只改变状态，discard 保留完整正文。
- criterion_id: criterion-web
  statement: Web 将 draft/active/discarded 显示为待确认/已确认/已废弃；closure Card 显示三类责任处置及 Pitfall 标题/状态，不在关闭卡提供 promote/discard，related-to 只进入关系详情；执行前已有未提交改动得到保留。
- criterion_id: criterion-validation
  statement: 相关 specs/docs、Helper/Code、Web 测试通过；更广验证实际执行，并如实区分本案失败与既有或范围外失败。
- criterion_id: criterion-handoff
  statement: 完成 Controller 自检与独立结果复核，逐项回指产物和验证；执行期间未借本 WorkCase 创建 Spark、ADR、Study 或新 WorkCase，只有实际满足完整准入时才允许 draft Pitfall 例外。
work_items:
- item_id: item-contract
  goal: 冻结本案机器契约并系统修订规则源与附件。
  expected_result: 规则源形成可派生的唯一完整契约，上一轮独立审计 B.1–B.8 均有明确承载且旧语义已消除。
  approach_summary: 先建立跨文件责任矩阵；将 spark_suggestions 定义为统一数组，并以 suggestion_kind=constrained_responsibility|follow_up_opportunity 及按 kind 条件化的限制、影响、恢复与跟进字段区分两类语义；采用最小充分修改，不建立第二权威。
  status: completed
  result_summary: 已完成规则源与附件修订：执行期创建边界、完整 draft Pitfall 四状态、三类关闭处置、两类 Spark 建议、route_existing 双目标与 WorkCase related-to 的来源契约已经统一，旧语义静态清扫通过。
- item_id: item-mechanics
  goal: 使派生 Schema、事实校验、关系和 Helper lifecycle/WorkCase 操作与新契约一致。
  expected_result: 新增状态、结构、转换、关系、关闭映射与召回边界均被机械执行，并具有正反回归测试。
  depends_on:
  - item-contract
  approach_summary: 从当前规则源派生修改 validation、relations、Helper 操作与投影；promote 使用状态-only 比较，避免 Code 自行解释自然语言。
  status: completed
  result_summary: 已实现四状态 Pitfall Schema 与状态边、status-only promote、保留正文 discard、WorkCase suggestions 与三类 disposition、route_existing 到 WorkCase/Spark、contributed-to 仅 draft Pitfall、related-to 成环/重叠/关闭保留及候选召回边界，并补齐正反测试。
- item_id: item-web
  goal: 按新契约更新 Human 可见的 Pitfall 状态、关闭卡和关系详情。
  expected_result: Web 准确呈现三种 Pitfall 审核状态和三类关闭责任处置，同时保留当前已有 Working Tree 改动。
  depends_on:
  - item-contract
  - item-mechanics
  approach_summary: 先逐文件检查现有 dirty diff 并在其上小步融合；只实现来源要求的展示与交互，使用页面契约测试验证。
  status: completed
  result_summary: 已完成 closure-confirming 与 closed Card 的 goal/outcome/disposition/route_existing/suggest_spark/accept_stop 展示，Pitfall 四状态类型化标签、contributed Pitfall 当前标题与状态、详情 suggestions 与 related-to 关系呈现；未加入 promote/discard 控件，生产构建通过。
- item_id: item-validation
  goal: 完成跨层一致性审计、目标测试、更广验证和结果复核准备。
  expected_result: 五项成功标准分别具有可回指证据或明确未满足项，能够进入独立结果复核与关闭判断。
  depends_on:
  - item-contract
  - item-mechanics
  - item-web
  approach_summary: 结合旧术语静态搜索、机械测试、Working Tree diff 与精确回读；不以局部测试通过替代完成判断，并如实保留既有无效对象或范围外失败。
  status: completed
  result_summary: 完成跨层一致性审计与最终验证：核心全量 1285 passed、10 项仅原生 Windows 跳过；Web 类型检查、相关契约测试与生产构建通过；全量 Web 唯一失败为范围外 commit-dto 旧断言，已明确记录；独立审计发现的完整性偏差均已修复并复跑通过。
