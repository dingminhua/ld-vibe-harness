title: 完成 Web 对 WorkCase 当前快照投影的页面迁移
status: open
goal: 让 WorkCase 列表、详情、聚焦页、阅读面板和共享进度轨道在 source-bound current_snapshot_projection 形成后，只消费该 resolved 投影及其同源只读字段，不再从 raw status/phase 重建进度分组、推进环节、Human Gate、阻塞覆盖或下一必经动作；退出无指纹 legacy Card projector，同时保留 progress_group 作为生命周期之外的四类 Web 浏览分组，并在详情中以本地化只读提示呈现 next_required_control_step，不产生授权、按钮、自动推进、优先级或完成判断。
scope: 覆盖编码前 Code Implementation Plan；web/shared/workcaseStatus.ts 与 web/api/services/facts.ts 的 legacy facade/projector 退出；web/api/routes/objects.ts、web/api/routes/cognition.ts 的同源投影 DTO、统计、Gate inbox 与推进中分组消费；WorkCaseProgressTrack、ObjectList、CognitionCenter、ObjectDetail、WorkCaseReadingLayout、workcaseDetailProjection、PanelContent、API types 与 i18n 的页面迁移；Web docs 02/03/04/10 和直接相关契约测试。API 仍可使用 raw status + phase + 实际 source_content_fingerprint 经 generated-contract facade 形成 source-bound projection，raw status/phase 也可原值显示；投影形成后，任何页面、DTO 或聚合不得再用 raw 字段推导 progress group/step、handoff、next action 或 blocking overlay。排除 Python、Helper、Specs 00/03/05/06/07/08/21/30/31/32/34、生成器和 generated TypeScript 合同语义、WorkCase YAML 派生字段、视觉重构、其它事实对象、spark-0040、workcase-0036 至 0039、push、PR、发布、外部消息和破坏性 Git。
success_criterion_definitions:
- criterion_id: criterion-downstream-projection-only
  statement: ObjectDetail header/current situation、ObjectList、CognitionCenter、阅读面板和共享轨道在 current_snapshot_projection 形成后，只消费 resolution=resolved 且绑定实际来源指纹的 lifecycle_position、progress_group、progress_step、handoff_narrative_key、next_required_control_step 与 blocking_overlay；raw status/phase 只可用于 source-bound 投影形成或事实原值显示，不得成为 downstream fallback。unresolved、错误或缺失指纹时显示不可判定，不猜测分组、步骤、Gate、阻塞覆盖或下一动作。
- criterion_id: criterion-progress-group-preserved
  statement: plan_confirmation、progressing、closure_confirmation、closed 四类 progress_group 继续作为 lifecycle phase 之外的 Web 浏览分组；列表筛选与统计、Gate inbox、推进中事项和 closed 展示保持既有产品含义。Gate inbox 依据 handoff_narrative_key 与 blocking_overlay 精确形成，blocked 不因仍位于 Human phase 而进入 Gate，也不被误作可推进或 closed。
- criterion_id: criterion-legacy-projector-retired
  statement: 无实际内容指纹的 projectWorkCaseCard、deriveWorkCaseProgressProjection、getWorkCaseProgressProjection 及同族 raw phase convenience facade 从 production/page 消费和正向测试退出；API source-bound deriveWorkCasePresentationProjection、Python 单一语义维护点和 generated contract 保持不变，Web 不建立第二张 phase 表。
- criterion_id: criterion-next-control-step-readonly
  statement: WorkCase 详情只在 resolved projection 下以本地化标签显示 next_required_control_step 对应的‘下一必经动作’；当前合同全部稳定 key 有显式本地化，unknown/unresolved 只显示不可判定且不泄漏原始 key。该提示无按钮、无自动动作，不表示授权充分、行动允许、能力可用、优先级或工作完成，也不写回事实源。
- criterion_id: criterion-web-validation-and-isolation
  statement: Code Implementation Plan、直接相关 Web API 契约测试、npm check、npm build、git diff --check、WorkCase 精确回读和事实完整性检查在实际范围通过；负测覆盖 blocked 只消费 blocking_overlay 且不进 Gate、missing/wrong fingerprint 或 unresolved 时 detail/list/cognition 不生成 group/step/next action，以及 next step 闭集本地化与 unknown 禁泄漏。spark-0040、workcase-0036 至 0039 和 specs/00 的创建基线保持隔离，未运行或既有失败据实记录。
priority: P1
phase: human_plan_confirming
plan_version: 1
work_items:
- item_id: item-audit-web-projection-consumers
  goal: 审计当前 source-bound 投影形成点、legacy projector/facade、页面与 DTO downstream 消费、Web docs/tests 和 dirty 基线。
  expected_result: 形成精确消费矩阵与路径白名单，区分允许的 source-bound formation、raw 事实原值显示和必须退出的 downstream raw fallback，并确认不存在重复 WorkCase。
  status: pending
  approach_summary: 回读 0041/0042、25ab2f507、08/21 当前边界和实际 Web 调用图；不把实现现状反向提升为规则。
- item_id: item-form-web-code-plan
  goal: 在修改 Web Code 前形成并登记本增量的 Code Implementation Plan。
  expected_result: code/plans/workcase-web-current-snapshot-consumption.md 与 README 入口列明责任、依赖、接口、诊断、路径白名单、回滚和测试映射，不定义领域语义。
  status: pending
  depends_on:
  - item-audit-web-projection-consumers
  approach_summary: 计划只分配 Web 消费迁移，不修改 generated contract、Python 或 Specs。
- item_id: item-retire-shared-api-legacy-projector
  goal: 退出无指纹 legacy Card projector 和 raw phase progress convenience facade，并使 API DTO/聚合只传递 source-bound projection。
  expected_result: facts.ts、workcaseStatus.ts、objects/cognition routes 不再暴露或消费 projectWorkCaseCard、derive/get WorkCaseProgress facade；Gate、blocked、统计和活动聚合从 resolved projection 取得对应字段，unresolved 不补造。
  status: pending
  depends_on:
  - item-form-web-code-plan
  approach_summary: 保留 deriveWorkCasePresentationProjection 作为 generated-contract 驱动的 source-bound formation；不改映射表或合同身份。
- item_id: item-migrate-pages-and-next-action
  goal: 迁移列表、详情、聚焦页、阅读面板和共享进度轨道的 downstream 消费，并在详情显示只读下一必经动作。
  expected_result: 页面 header、轨道、分组、Gate、blocked 与 next action 全部来自 resolved projection；四类 progress_group 行为保留，unresolved 统一不可判定，next action 无按钮与授权含义。
  status: pending
  depends_on:
  - item-retire-shared-api-legacy-projector
  approach_summary: 组件接收 lifecycle_position/progress_group/progress_step 等投影值，不再接收 phase 以重建进度；raw status/phase 仍可在事实阅读区原样显示。
- item_id: item-update-web-contract-tests-and-docs
  goal: 同步 i18n、Web docs 与直接相关契约测试，删除 legacy 正向断言并补齐负向矩阵。
  expected_result: docs 02/03/04/10 准确说明同源投影消费；测试覆盖 blocked、Gate、unresolved/fingerprint、四分组保持、legacy 出口消失和 next step 本地化闭集。
  status: pending
  depends_on:
  - item-migrate-pages-and-next-action
  approach_summary: 只更新实际受本增量影响的文档与列名测试，不为通过测试放宽 unresolved 或重新引入 raw fallback。
- item_id: item-verify-web-projection-migration
  goal: 验证 Web 页面迁移、类型与构建、合同测试、事实完整性和 dirty 隔离。
  expected_result: 目标 tests、npm check/build、git diff --check、路径白名单、workcase-0043 精确回读与全库事实完整性检查在实际范围完成，失败与未验证边界据实进入结果链。
  status: pending
  depends_on:
  - item-update-web-contract-tests-and-docs
  approach_summary: 全量 Web test 可在资源允许时运行；其结果与目标测试分开记录，不把 source-contract 或 build 扩大为未来 UI 行为保障。
