title: 关闭 WorkCase 候选 after 的只读确定性投影
status: open
priority: P2
intent: 保留 WorkCase 关闭时已由规则定义、但只能由调用方重复组装的 closed after 候选投影问题，避免多个脚本各自复制字段映射而与 close-workcase 校验漂移。后续需判断是否应提供严格只读的候选投影操作，以及它如何复用关闭校验的同一纯映射而不生成事实、推断 Human 决策或取得关闭授权。
summary: "## 已确认的边界\n\n- `close-workcase` 仍是唯一的受控关闭写入口：调用方提交完整 after，Helper 负责 CAS、阶段/Schema、确定性关闭映射、目标与审计检查。\n- 当前规则已把 proposal 到 closed after 的关键字段映射定义为确定性校验；现有调用方脚本只能自行读取 before、复制稳定字段、映射 proposal 字段后再提交。\n- 这不是要求 Code 自动关闭或生成自然语言事实。Human 的 Gate 2 决定、授权引用与对实际 before 的指纹绑定，必须仍由调用方在决策时点取得并提交。\n\n## 候选方向与红线\n\n- 研究一个只读操作（暂称 `prepare-closed-workcase-candidate`）：基于当前机械有效的 before 与既有 closure proposal，返回带 source fingerprint 的 closed after 候选及映射依据。\n- 它只能复制或确定性转换已有字段；不得补写、润色或选择自然语言事实，不得声称“已可关闭”，不得生成/推断 Gate 2 授权，也不得写入或预留任何事实状态。\n- 若实现，应与 `close-workcase` 的期望 after 校验复用同一内部纯映射，避免候选生成与写入校验形成两套状态机。真实关闭仍须重新读取并验证快照、Human 决定和路由目标；候选过期即重新生成。\n\n## 待判断\n\n- 该便利能力是否有足够重复使用价值，还是应继续保留为调用方胶水。\n- 最小输入/输出、拒绝条件和 target-fingerprint 观察应如何设计，才能不重复 close-workcase 的完整验证。\n- 若进入实现，应单独承接，不与 phase 投影一致性、Controller 连续写回或行动模板瘦身混为同一改动。"
