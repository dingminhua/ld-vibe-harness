title: 通用事实更新的 Spark routed-to 形成时校验
status: open
summary: 承接 workcase-0092 明确保留的 generic update_application.py 接入缺口；当前等待 Human Gate 1，不修改业务事实。
priority: P1
goal: 让 generic update_application.py 在新增 Spark routed-to 关系时，区分新形成的边与已存在的边，并在实际写入前执行 formation-time enforcement：新增加的 Spark 目标必须是同项目、mechanically valid、具有非空 title 且 status=open；既有边允许目标按自身生命周期继续变化。
scope: 仅覆盖 code/ldvh/facts/update_application.py、必要且最小的 code/ldvh/facts/relations.py 形成辅助，以及 code/tests/facts/test_update_application.py、test_relations.py、test_project_validation.py。允许读取当前 dirty baseline、只读 Helper、目标测试、Ruff、git diff --check、check-fact-integrity 与指定事实精确回读。明确排除 specs、Web、Helper API/schema、任何 canonical fact 写入、spark-0034/workcase-0092 修改、successor 创建或迁移、multi-object 原子写入、WorkCase 状态机、commit/push/PR/release/external。
success_criterion_definitions:
- criterion_id: criterion-formation
  statement: generic update_application.py 在候选对象通过普通 project/relation 机械校验后、atomic replacement 前，对 before→after 新增的 Spark routed-to 边执行形成时校验；新边目标必须同项目、mechanically valid、非空 title 且 status=open，新增指向 routed/implemented/discarded Spark 的边被拒绝。
- criterion_id: criterion-existing-edge
  statement: 已存在的 Spark routed-to 边不因目标后续变为 routed/implemented/discarded 而失效；对源对象的普通后续更新不误拒绝该既有边。
- criterion_id: criterion-relation-regression
  statement: Study、缺失、invalid、空 title、自指、跨项目和循环等既有关系约束继续拒绝；WorkCase、ADR、Pitfall 作为 Spark routed-to 的合法非 Spark 承接路径保持可用，不被本 WC 错误收紧。
- criterion_id: criterion-verification
  statement: 针对 generic update、relations 与 project validation 的正反测试、Ruff、git diff --check 和全库 check-fact-integrity 通过，并完成指定事实精确回读；无法区分 dirty baseline 时据实停止。
- criterion_id: criterion-safety
  statement: 本 WC 不产生任何 canonical business fact write，不创建 successor、不迁移 spark-0034、不实现 multi-object atomicity，不把 formation enforcement 写成 successor 分流已完成。
work_items:
- item_id: item-path-analysis
  goal: 精确定位 generic update 的 before/after、候选对象和实际替换边界，并记录现有 dirty baseline。
  expected_result: 形成可审查的最小接入位置与文件边界；无法区分已有 dirty diff 时停止，不覆盖无关修改。
  status: completed
  result_summary: 只读定位完成：generic update 的 apply_fact_update_locked 顺序为 current 读取→candidate 构造（_candidate 内已执行 validate_fact_object、validate_fact_transition 与 stabilize_project_index 普通关系/project 校验）→atomic_replace_text_if_unchanged→写后回读。最小接入点确定为 candidate mechanically_valid 后、atomic replacement 前。dirty baseline 已分块确认：update_application.py 有既存 _normalize_workbench_name/_normalized_mutable 改动；relations.py 与 test_relations.py 有前一 WC 的 Spark relation/formation 辅助与测试；test_update_application.py、test_project_validation.py 无既存 diff。
- item_id: item-formation-enforcement
  goal: 在 generic update 写入前接入 Spark successor routed-to formation-time enforcement。
  expected_result: 只对 before→after 新增的 Spark 目标边执行 open/有效性边界；保留既有边后续生命周期兼容与非 Spark 合法路径。
  status: in_progress
  depends_on:
  - item-path-analysis
  current_summary: 正在在 generic update candidate 通过普通 relation/project 校验后、atomic replacement 前接入 Spark formation-time enforcement；只新增授权范围内的最小调用与错误返回。
  resume_from: 从 apply_fact_update_locked 的 candidate 成功分支继续；复用 relations.py 已有 before/after formation validator，不收紧既有边生命周期。
- item_id: item-formation-tests
  goal: 补齐 generic update 与关系/project 校验的正反测试。
  expected_result: 覆盖新 open Spark 通过、新 routed/implemented/discarded Spark 拒绝、既有边后续状态通过、Study/缺失/invalid/title/self/cross-project/cycle 拒绝及 WorkCase/ADR/Pitfall 回归。
  status: pending
  depends_on:
  - item-formation-enforcement
- item_id: item-verification
  goal: 完成授权范围验证并记录无事实写入边界。
  expected_result: 目标 Python tests、Ruff、git diff --check、check-fact-integrity 与指定事实回读结果据实形成；保留未验证与 dirty baseline 限制。
  status: pending
  depends_on:
  - item-formation-tests
