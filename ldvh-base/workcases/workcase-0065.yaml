  out_of_bounds_handling: 发现超界、能力证据不足、审核模式失真、WC0063 无法隔离或验证失败时，立即停止受影响 item并保留准确状态、当前 phase、blocker、影响和恢复条件；必要时通过 PlanΔ 或 Human 决策处理，不以 completed、提交或关闭掩盖。
