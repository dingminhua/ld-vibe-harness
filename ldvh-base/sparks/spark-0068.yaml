title: 校准 LDVH 优化议题：从缺陷断言回到证据分层与可验证问题簇
status: open
priority: P1
intent: 围绕 spark-0067 提出的 LDVH 优化方向，保留一套经当前规则源、Helper 实测和多路独立审核校准后的独立观点：区分已有能力、运行时可发现性摩擦、响应与构造成本、独立能力缺口以及尚未证实的根因。若不跨行动保存，后续方案评审可能继续基于已被反证的能力缺失、混合口径统计或未经复现的因果链立项。本 Spark 不覆盖 spark-0067，而是要求先用固定任务集验证五个候选问题簇的净价值与优先级，再以 spark-0067 的原始缺陷判断、根因排序和行动化主张反向复审本校准，检验是否因纠错而过度削弱真实摩擦或错失低成本改进。
summary: "## 定位\n\n这是 spark-0067 的独立校准视角，不是对原对象的覆盖、更正或处置。spark-0067 保留原始探索链；本对象保存当前规则源、Helper 实测与五路独立审核所得的反证、收敛点和下一步验证条件。\n\n审计基线为 2026-08-07 的实际 Working Tree；当时 spark-0067 的内容指纹为 `cc2ae79972a26bac5a6f1f704d1c777ccdc5ce6aed30f8a0e74cce37e730a749`。规则或实现变化后，以下机械结论必须重验。\n\n## 总体判断\n\nspark-0067 的优化方向有价值，但其 13 个缺陷和 3 个根因不能整体行动化：一部分所谓缺失能力已经存在，只是运行时契约不易发现；一部分数据混用了不同分母；一部分只是成本或因果假设。真正独立且已确认的能力缺口主要是集合指纹不能定位具体变化对象。在建立固定任务集和基线指标前，不宜把任何候选问题簇直接升级为 WorkCase。\n\n## 13 项结论校准\n\n1. **F2 语义匹配契约**：撤回 text_match 参数或完整规范契约不存在的说法。规范与 capabilities 已暴露 `arguments.text_match`。剩余问题是运行时发现未给嵌套形状、条件必填、合法字段和值及最小示例。\n2. **关联对象覆盖关系**：部分成立。正反向关系导航已经存在；从关系边判断还剩什么未做仍需要语义覆盖映射和 AI 判断。\n3. **无反向关系查询**：撤回。已有 `relation_targets`、`relation_source_refs` 和 `relation_keys`；对 adr-0001 的实测能返回引用它的 Spark。\n4. **关系图稀疏**：撤回原统计直接推出根因和 P0 优先级。审计口径下，148 个非 Study 对象中 64 个有出边，共 116 条边；平均值按全部对象为 0.784，按有出边对象为 1.812。ADR 与 Pitfall 没有出边受类型关系定义影响，但存在入边，不能以零出边等同孤立或缺陷。\n5. **参数发现往返**：摩擦真实，但 study-0023 对 invalid_request 次数存在 3 次与 5 次两种口径，不能作为稳定基线。\n6. **Study 消费格式断裂**：撤回。Study 的 F2 卡已经包含 abstract；Markdown 正文与 frontmatter 是有意的混合承载。\n7. **上下文膨胀**：保留响应量问题，撤回新增重复摘要层的直接方案。F2 摘要到 F3 精读已经存在，54KB 来自显式展开；应先测 bytes、tokens 与有效信息率。\n8. **草案不暴露约束**：窄化为可发现性摩擦。prepare 结果已有 `constraint_ref`，但没有内联常用合法值和最小合法对象。\n9. **无增量变化定位**：确认是独立能力缺口。object_set_fingerprint 只能证明集合变化，不能指出具体对象；是否需要 per-object diff 或 changed_since 仍须用真实恢复场景验证。\n10. **受控更新过重导致绕过**：未证实。没有可靠证据支持九次更新、Edit 连续失败和只能直接 Write 的因果链；直接写入受规则禁止，也不能反证 Helper 失败。\n11. **全量替换**：观察真实但缺陷结论未成立。完整 after 与 CAS 是明确的正确性边界；应先测客户端构造成本，再讨论 patch 或对象可变性分层。\n12. **规范源消费摩擦**：目前只是待测假设。23 条 Stop Conditions 可复现，但固定穿越七份规范的说法不稳定，study-0023 自身也出现约十份的表述。\n13. **text_match 能力未利用**：不构成独立缺陷，应归并到第 1、5 项的运行时契约可发现性。\n\n另行撤回规范 00 缺少 spec_key 的缺口判断。01.Att.02 已明确逻辑键 `ldvh-root`，并明确不改写 00 YAML。\n\n## 五个候选问题簇\n\n### A. Helper 请求契约的运行时可发现性\n\n已证实 capabilities 能发现操作和参数名、invalid_request 的 gaps 能帮助修正请求；但首次调用仍可能缺少嵌套形状、条件必填、合法值和最小请求示例。未证实它是主路径 P0 根因，也未证实内联更多契约比当前渐进披露更省上下文。价值映射：V1、V3、V4。\n\n### B. 关系质量与覆盖解释\n\n已证实正向、反向和 relation_key 导航存在，机械关系边不能独立回答实现覆盖、遗留工作或语义相关性。未证实当前关系质量不足、应增加多少边、是否需要自动建议，以及原始稀疏度与检索失败相关。价值映射：V1、V2。\n\n### C. 响应与上下文成本\n\n已证实显式跨对象精读会产生大响应，当前已有 F1/F2/F3 渐进披露。未证实常见任务是否经常误入大响应，以及瓶颈是默认行为、调用策略还是字段冗余。价值映射：V2。\n\n### D. 增量变化定位\n\n已证实集合指纹无法定位变化对象，这是与 F2 检索不同的能力缺口。未证实恢复、跨会话同步和审计场景中的频率及收益，也未确定 per-object manifest 或 changed_since。价值映射：V1、V5、V6。\n\n### E. 完整 after 的客户端构造成本\n\n已证实常规更新要求精确读取、内容指纹和完整目标 after，这是有意的 CAS 正确性边界。未证实构造成本足以产生净负价值，也未证实 patch、字段级操作或对象可变性分层能不削弱审计性。价值映射：V4。\n\n当前不主张任何 HV 价值已由这些问题簇达成，尤其不以本审计宣称 HV4 已解决。\n\n## 立项前固定验证集\n\n1. 请求契约：首次成功率、invalid_request 次数、补充往返数、必须记忆的字段集合。\n2. 关系任务：正反向导航成功率、语义 gold set 的召回与误连、回答剩余工作所需人工判断步骤。\n3. 上下文任务：各层响应 bytes、估算 tokens、有效对象数和无效展开比例。\n4. 变化任务：单对象修改、新增、删除和跨会话恢复时，定位变化所需调用数及误判率。\n5. 更新任务：只改短字段、长字段和关系集合时，客户端读取、构造、验证的时间与失败类型。\n6. 规范消费：固定一个创建和一个更新场景，记录实际读取规范数、Stop Conditions、重复读取和错误恢复。\n\n只有某一问题簇在固定任务上表现出稳定净收益，才为该簇单独创建 WorkCase；不得把五簇打包成一次大改造。\n\n## 用 spark-0067 原始观点反向复审\n\n0068 是对 0067 的校准视角，不能由 0068 单向宣告 0067 的问题失效。下一轮必须以 0067 的原始场景、优先级和方案主张反向挑战 0068：\n\n- 对每项“撤回”或“窄化”，区分“能力机械存在”与“执行者在真实任务中能够低摩擦发现并正确使用”；前者不能自动否定后者的体验问题。\n- 对 0067 的三个根因和 P0/P0-/P1 排序，使用统一场景、统一分母和可复现指标重算，不以 0067 或 0068 任一方的单次统计直接定级。\n- 检查 0068 是否因避免误报而过度保守，把可低风险、低成本验证或修复的真实摩擦全部推迟。\n- 检查“增量变化定位”是否确实进入常见恢复主路径，以及它与 F2 可发现性之间是独立、串联还是收益依赖关系。\n- 对照结果逐项标记为“保留 0067 原判断”“采用 0068 校准”“必须实验裁决”或“双方均需改写”；没有可复现证据时不合并为新根因。\n\n复审可以使用独立子 Agent 增加反证视角，但审核方法不属于议题本体，也不自动提高任一结论的真实性。最终裁决依据仍是当前规则源、Helper 实测、固定任务集和可复现结果。\n\n## 暂不立项与明确不做\n\n- 暂不以关系密度、54KB 单例、23 条 Stop Conditions 或未核实的九次编辑经历确定优先级。\n- 暂不新增重复的反向查询、Study abstract 或 F2 摘要层。\n- 暂不修改 spark-0067，以保留原始观点与演化链。\n- 暂不把任何一轮独立审核直接等同于真实性证明；0067 与 0068 的冲突仍以可复现实验裁决。\n- 暂不选择 patch、per-object manifest、changed_since 或自动关系建议中的任何具体方案。\n\n## WorkCase-0068 的校准结果与后续前置条件\n\nWorkCase-0068 已以 `partial` 关闭。它完成 24 个 trial，并保留了两类稳定学习：F2 `text_match`、反向关系查询与约束引用等能力确实存在；小样本中观察到提示卡可能降低首次调用摩擦的方向性迹象。后者不构成收益结论：输出 schema 不一致、关键 response bytes 未采集、一个 candidate 结果不是合法 JSON、提示卡本身含错误契约描述，且临时文件曾越界。因此不得据此选择生产提示卡、提升优先级或主张净收益。\n\n下一轮首先只验证实验基础设施，不重跑结论也不修改生产契约。其前置条件是：runner 强制输出统一 JSON schema；自动采集原始响应 bytes、调用分类与耗时；输出目录经 mktemp 身份校验并对越界写入 fail-closed；提示卡从当前规则与 capabilities 校验生成。只有这条采集链通过独立验收后，才以新的 WorkCase 重跑同一 A 问题簇的对照实验。\n"
