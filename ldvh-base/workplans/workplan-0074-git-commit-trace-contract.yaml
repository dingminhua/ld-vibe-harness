    - specs/05-工作模型基础规范.md
    - specs/09-事实源边界与承载规范.md
    - specs/10-Git提交规范.md
    expected_output: |
      在执行任何 specs/code/web 迁移前，先形成 Human Gate 结论：
      - 是否确认旧变更对象退出工作模型集合；
      - 新 Git 提交规范的编号和归属；
      - 旧 25 号工作模型文件的最终处理方式；
      - 历史引用允许残留边界；
      - 是否接受分阶段迁移。
    status: done
    result_summary: 已确认旧变更对象退出工作模型集合，新规范编号为 10，旧 25 号工作模型文件删除，不保留兼容 YAML 对象。
    evidence_refs:
    - specs/10-Git提交规范.md
    - specs/01-目录说明.md
    blocking_reason: null
