        - specs/attachments/04.Att.06-知识地图投影Schema表.md
        - specs/attachments/04.Att.07-受控写入前检查矩阵.md
        - specs/06-运行时扩展规范.md
        - rules/LDVH-RUNTIME-PROTOCOL.md
        - code/specs_validate.py
        - code/spec_checks/knowledge_map.py
        - code/spec_checks/preflight.py
        - code/spec_checks/deployment_entries.py
        - code/hook_dispatch.py
      expected_output: |
        形成行动指南的职责定位、AI-facing Schema、必填字段、失败态、字段间合成关系、fallback 分流语义、输入范围、渐进读取规则、字段预算、target 解析优先级、输出授权语义、分级输出模式和分层边界草案；明确行动指南继承知识地图能力并补充行动类型、注意事项、工具计划、Human Gate candidates、post-read action plan 和验证建议。
      status: skipped
      blocking_reason: ''
      result_summary: |
        Human 确认本 WorkCase 不继续推进：行动指南替代 knowledge-map 的整体工作量过大，且当前知识地图已基本满足入口导航需求。本执行项未进入实现。
      evidence_refs: []
    - id: item-2
      title: 扫描 knowledge-map 引用与迁移影响面
      role: impact-analysis
      mode: single
      input_refs:
        - specs
        - rules
        - code
        - tests
        - hooks
        - web
        - ldvh-base
        - LDVH-GOVERNED-PROJECTS.yaml
        - specs/30-rules-entry-sync-review-Rules入口同步审查.md
        - specs/attachments/04.Att.05-知识地图输入范围表.md
        - specs/attachments/07.Att.10-事实源读取策略核对表.md
        - specs/attachments/07.Att.11-非事实源排除清单.md
      expected_output: |
        列出所有 `knowledge-map`、`知识地图`、知识地图 Schema / CLI / Runtime / Rules / test / Web 引用，并按 `LDVH-GOVERNED-PROJECTS.yaml` 登记项目核对工作对象事实源引用；分类为必须迁移到行动指南、内部实现命名调整、历史事实文本保留、删除前置条件和必须进入 Human Gate 的范围。
      status: skipped
      blocking_reason: ''
      result_summary: |
        Human 确认不继续推进 action-guide 替代路线；不再执行 knowledge-map 全量引用迁移影响扫描。
      evidence_refs: []
    - id: item-3
      title: 制定受控删除与兼容迁移顺序
      role: migration-design
      mode: single
      input_refs:
        - code/specs_validate.py
        - code/spec_checks/knowledge_map.py
        - code/hook_dispatch.py
        - rules/LDVH-RUNTIME-PROTOCOL.md
        - specs/30-rules-entry-sync-review-Rules入口同步审查.md
        - specs/attachments/04.Att.02-Code命令入口表.md
        - specs/attachments/04.Att.03-Code结构化输出Schema表.md
        - specs/attachments/04.Att.07-受控写入前检查矩阵.md
        - tests/code
      expected_output: |
        给出从 knowledge-map 到 action-guide 的受控迁移顺序：先新增 `code/spec_checks/action_guide.py` 或等价模块，复用 v2_check_build / KnowledgeMapMixin / preflight_build / deployment_entries_asset_records；再建立 action-guide CLI/API、Schema、dispatcher receipt 消费、fallback read_plan、测试、文案迁移、双跑对照或回退策略；验证 action-guide 完整继承既有能力并完成 Rules 同步审查和 Human Gate 后，再删除 knowledge-map 独立命令和 active 入口表述。短期兼容不得演变为长期双入口。
      status: skipped
      blocking_reason: ''
      result_summary: |
        Human 确认不删除 knowledge-map 独立入口；受控删除与兼容迁移顺序不再作为本 WorkCase 执行目标。
      evidence_refs: []
    - id: item-5
      title: 设计 action-guide 交互密度与 receipt 策略
      role: code-design
      mode: single
      input_refs:
