        input_refs:
        - ldvh-base/workcases/workcase-0002-governed-project-fact-semantic-relations.yaml
        - specs/01-规范体系基础规范.md
        - specs/04-Code确定性执行规范.md
        - specs/attachments/01.Att.01-知识地图关系类型表.md
        - specs/attachments/04.Att.05-知识地图输入范围表.md
        - specs/attachments/04.Att.06-知识地图投影Schema表.md
        - specs/21-WorkCase-工作项.md
        constraints:
        - 只读审核
        - 不修改文件
      context_digest: 规范语义方向成立；先写 specs 语义口径、再驱动 Code 诊断，符合文档约束先行。
      result:
        status: pass_with_followups
        summary: |
          方案语义方向成立；`related_*` 不能替代强语义边的口径适合先写入 active specs 或授权附件，再驱动 Code 诊断实现。未发现上位规范冲突。
        key_findings:
        - 01 已定义关系类型闭集和判定顺序，Code 不应直接凭实现补规则。
        - 方案排除了历史图谱、Git 图谱、Web 短期实现和 Human 自然查询体验，符合当前知识地图边界。
        - 进入 specs、Code 或样本事实对象写入前，必须经过 WorkCase Human 执行前确认。
        required_changes: []
        recommendations:
        - 若只是补充正反例或误用诊断，可优先落在 01.Att.01；若改变关系判定原则或派生规则，应回 01 主文。
        - Code 诊断应输出 warning 或 diagnostic，不自动改写事实对象。
        evidence_refs:
        - specs/01-规范体系基础规范.md
        - specs/04-Code确定性执行规范.md
        - specs/attachments/01.Att.01-知识地图关系类型表.md
        - specs/attachments/04.Att.05-知识地图输入范围表.md
        - specs/attachments/04.Att.06-知识地图投影Schema表.md
      raw_output_ref: null
      attested_at: '2026-06-24T08:52:00+08:00'
      attestation:
        signer: Faraday
        statement: 基于 prompt context 和 input refs 完成只读规范语义边界审核并对结论负责。
    - id: plan-review-2
      role: Code 诊断实现
      agent_name: Halley
      requested_at: '2026-06-24T08:50:00+08:00'
      prompt_context:
        objective: |
          判断关系质量诊断、`impact_summary` 语义边摘要和 entry 层非全量展开提示的 Code 执行方案是否可行。
        input_refs:
        - ldvh-base/workcases/workcase-0002-governed-project-fact-semantic-relations.yaml
        - code/spec_checks/knowledge_map.py
        - code/spec_checks/v2.py
        - code/specs_validate.py
        - tests/code/specs_validate_checks/test_v2.py
        - specs/04-Code确定性执行规范.md
        - specs/attachments/04.Att.06-知识地图投影Schema表.md
        constraints:
