success_criteria:
- 下位规范不再以单个文件的 Git 状态作为当前规则或事实资格门槛，且当前内容、历史读取与提交动作的职责分层一致。
- canonical 且安全的当前规则、事实对象和项目内证据不因 tracked、untracked、ignored、staged 或 committed 
  状态不同而改变资格，显式 git-revision 与 commit 专属校验仍然保留。
- Helper 读取、创建、更新与 Web 读取、direct capture 继承同一语义，规则快照、管辖 identity 和 ProjectFiles 
  Git 观察视图没有被误改。
- 规则、事实、证据、Web 和快照具有覆盖目标语义的正反测试，风险匹配的相关验证与 full-v4 验证形成可信结果，未验证范围被如实记录。
