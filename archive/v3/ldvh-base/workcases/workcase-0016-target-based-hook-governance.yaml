id: workcase-0016
type: workcase
title: LDVH Hook 目标对象管辖判定
goal: |
  将 LDVH Hook 管辖判定从 cwd-only 模型升级为 target-based governance：以本次操作实际处理的目录、文件、仓库或项目作为 governed subject；当工作对象命中管辖项目时，无论当前 cwd 是否位于项目目录内，都必须启用 LDVH lifecycle；当工作对象不在管辖范围内时 no-op。该模型必须兼容 Hook 路径和 Rules 路径，并覆盖 Git/Codex worktree 的 Git 身份匹配。
status: closed
created: '2026-06-26T23:43:04+08:00'
updated: '2026-06-27T03:15:00+08:00'
priority: P0
review_requested_at: '2026-06-27T01:20:00+08:00'
description: |
  当前 LDVH Runtime Protocol 和 dispatcher 主要以 cwd 判定管辖关系。该模型在“用户站在 workspace root，但实际处理 ldvh 子项目”的场景中会返回 governed=false，从而让 LDVH lifecycle no-op。Human 明确指出，判断应以实际处理的工作目录/文件/仓库为准：实际工作对象属于 LDVH 管辖项目，就使用 LDVH 机制；不属于管辖范围，就不使用。

  本 WorkCase 承接 workcase-0015 已完成的 Git common-dir / worktree 识别基础，进一步把判定主体从 cwd 扩展为 governed subject / operation target。该变更必须保持 Hook 路径与 Rules 路径共享同一 normalized event context、同一 dispatcher handler 和同一确定性判定函数，避免环境 Hook、AI 自觉 Rules 调用、Git hook 三条入口产生不同管辖结果。

  Runtime Protocol 的职责应收敛为“什么时候触发哪个 canonical event，以及如何把无 Hook 环境模拟成同一个 event context”。它不应承载与 Hook 路径不同的第二套处理逻辑。Rules 路径只负责在无原生 Hook 能力时按触发时机调用 dispatcher；调用之后必须走与 Hook 路径一致的 canonical handler、receipt、blocking 和 next_action 机制。

  本 WorkCase 的验收不得停留在 prose 层。相关 specs 必须使用强约束表述，把 Runtime Protocol prose、Hook registry、dispatcher handler、receipt 和 tests 的职责链写清楚；Code 必须实现这些约束；测试必须证明 Hook 路径与 Rules 路径在同一 canonical context 下结果一致。若只修改 Runtime Protocol 文本而没有 dispatcher 和测试证据，本 WorkCase 不得关闭。
success_criteria: |
  - [x] 规范层定义 governed subject / operation target：本次操作实际影响的目录、文件、仓库或项目；cwd 只是 target 缺失时的默认输入。
  - [x] specs/06 和 Runtime Protocol 明确 Hook 路径与 Rules 路径必须共享 target-based governance 判定语义。
  - [x] Runtime Protocol 明确自身只定义触发时机和 canonical event 模拟入口，不定义第二套消费、阻断或判定逻辑；Rules 路径触发后必须进入与 Hook 路径相同的 dispatcher handler。
  - [x] specs 明确：AI 执行时不得以 Runtime Protocol prose 自行判定放行、阻断或管辖命中，必须以 dispatcher 返回的结构化 receipt、blocking、required_paths 和 next_action 作为当次执行依据。
  - [x] specs/04 明确 Code 确定性判定顺序：target path、target git identity、explicit project 校验/消歧、cwd path、cwd git identity、no-op；explicit project 不得覆盖真实 target。
  - [x] 所有规范性 cwd-only 表述均替换为 target-first、cwd-fallback；不得同时保留“当前目录决定管辖”的旧口径。
  - [x] dispatcher 支持 Rules CLI 显式传入 target，并能从 Hook payload / tool_input / command 中归一化目标路径。
  - [x] canonical event context 具备稳定 schema，至少包含 event、trigger_source、cwd、target_paths、target_resolutions、operation_kind/read_write_kind、tool_name、tool_command、message_file、session_id。
  - [x] governed config discovery 支持从 target path / target Git identity 查找配置，不能只从 cwd 向上查找。
  - [x] 写操作 target 不确定时返回 unknown_target 并阻断或要求显式 target，不得回退 cwd 默认放行。
  - [x] worktree 场景通过 Git common-dir 或登记 Git 身份匹配管辖项目，不依赖路径相似、对话记忆或 AI 主观判断。
  - [x] Git identity 匹配存在多项目歧义时必须阻断并要求拆分或显式确认；remote_url 只能作为证据线索，不得单独决定管辖；common-dir 比较必须使用绝对 resolved 路径。
  - [x] 多目标规则明确并实现：同一项目允许，跨管辖项目或管辖/非管辖混合写入需要阻断、拆分或显式确认。
  - [x] receipt 记录 cwd、target_paths、target_resolutions、governed_subject、governed_via、governed_project_id 和 Git 身份线索；target_resolutions 需逐 target 记录 normalized path、git common-dir、project_id、governance status、source 和 unknown reason。
  - [x] git.commit-msg 进入同一 canonical event context，以 repo root、repo common-dir 和 staged paths 作为提交工作对象；message_file 只作为提交消息文件，不得被误当作 repo target。
  - [x] 测试覆盖 workspace root + target 命中、target 非管辖 no-op、worktree target 命中、Hook payload target 归一化、Rules CLI target、Hook/Rules parity、multi-target 边界、unknown-target 写入阻断、commit-msg repo/staged paths 兼容和 cwd-only 文案防回归。
  - [x] knowledge-map 无答案、不可用或未返回有效 P0/P1 read_plan 时，dispatcher 必须生成固定 fallback read_plan；acknowledge-read-plan 不得确认管辖项目内的空 required_paths；测试必须覆盖 fallback 和空计划阻断。
source: |
