  expected_result: 同一校验实现被双入口消费；暂存 blob 按 Index oid 读取；validator 纯函数
  approach_summary: 05 校验逻辑向 commits 链路投影复用（05 正文除操作登记外不修订）；观察层按事件自身 GIT_INDEX_FILE 取 Index oid 读 blob；复用边界钉住 carriers+validate_fact_object+身份核对+指纹+预算，不整体复用 read_fact_object
