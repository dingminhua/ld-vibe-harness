title: ADR、Pitfall 与 Study 的作用强化及触发事件
status: open
priority: P1
intent: 在 v0.2 否定 L0 产品化、v0.3 否定通用 L1-specific 后，两轮实验共同揭示信息结构与消费架构之间的语义断裂是更底层根因——F2 候选卡缺少"读完后对当前行动意味着什么"的桥梁信号，限制了触发策略的有效空间。保持三类知识如何在真实工作流中产生可观察效用的未决问题。下一方向是字段结构修正：ADR 补 trigger_signal（什么动作触达决策边界）、Pitfall 补 scope_of_impact（当前任务在影响范围什么位置）、Study 补 action_relevance（该发现对当前行动意味着什么），再以修正后的触发策略重测。任何生产接入仍须另行形成 WorkCase 并经过 Human Gate。
summary: "## 当前结论（v0.3 后结构分析）\n\nv0.2（L0 产品化验证）和 v0.3（L1 触发策略精度验证）两轮 source-complete 配对实验均已严格按预注册门槛完成并得出否定结论。但实验积累的逐样本失败模式揭示了一个更深层的根因：**信息结构与消费架构之间的语义断裂**——F2 候选卡告诉模型的是\"这是什么\"（对象属性），而不是\"这对当前行动意味着什么\"（行动指引）。\n\n### 结构层的断裂证据\n\n**ADR：** F2 卡含 decision_question（什么选择问题）、decision（选了什么）、applicability（适用于什么范围）。applicability 是静态边界声明，不描述\"什么动作会触达该决策边界\"。\n- 实验验证：A2（exact-positive）被 L1-specific 过度 veto。模型无法从任务语义推导出它触达了 ADR-01KZXN5TXNED08TVYQVTS3BX6X 的决策边界，因为 applicability 只说\"适用于中文交付\"（范围），不说\"你正在写中文技术说明时该决策已被触达\"（行为）。\n\n**Pitfall：** F2 卡含 symptoms（失败表现）和 trigger_conditions（什么前置条件触发）。trigger_conditions 面向历史——描述\"什么条件下这个坑会踩到\"，不描述\"当前任务落在该失败机制影响范围的什么位置\"。\n- 实验验证：P3（boundary-partial）被过度 veto。技能加载异常的任务处于\"可能命中 P3 scope 也可能不命中\"的边界，但 trigger_conditions 只描述\"什么条件下失败发生\"，不给模型判断\"当前情形是否在影响范围内\"的锚点。\n\n**Study：** F2 卡含 abstract（研究发现了什么）和 recommendation_summary（建议项目做什么）。两者是研究导向的，不告诉\"这个发现对当前具体行动意味着什么\"。\n- 实验验证：S1/S2 在两个 arm 上 strong_reuse 都是 0。模型读到了 abstract 但不知道该拿它做什么——它需要的是\"你现在正在设计 L1 触发实验，这份研究告诉你应该按边界/症状建模而非任务类型平铺\"的桥梁。\n\n### 触发策略层的断裂证据\n\nL1-specific 的 positive+veto 机制表现为两类失败：\n1. **过度 veto（A2、P3）：** veto 条件太宽，把部分适用场景排除。但如果 F2 卡本身有更精确的行动指引信号，veto 就不需要做得这么激进——F2 候选集本身已经更精确。\n2. **f2-no-f3 失败（A6/P6/S6）：** 应 F2 但不应 F3 的场景中触发策略行为不一致。这本质上是 F2 卡信息密度不够——如果 F2 卡含有\"这条知识告诉你应该做什么不同的动作\"，模型在 F2 阶段就能做出更准确的适用判断。\n\n### 结论\n\n**结构是更底层的问题。** 它限制了触发策略的有效空间。无论 trigger policy 怎么调优，如果 F2 卡告诉模型的是\"这是什么\"而不是\"这对当前行动意味着什么\"，模型的 F2→F3 决策和 F3→行动转化都会受阻。\n\n触发策略也需要修正——不是微调，而是架构性退让：从 v0.3 的\"精确 veto\"回到更接近 v0.2 的宽触发 + F2 内容过滤，因为 F2 卡补了行动指引信号后，内容本身就能承担过滤功能。\n\n## v0.2 实验（L0 产品化验证）\n\n- 设计：`L1-only` 对 `L0 + 完全相同 L1`，12 个 retained pairs / 24 个 member runs，6/6 条件首发；零 replacement。\n- 主指标 `knowledge-adjusted first legal action correct`：净增 **3/12**，达到至少 3/12 门槛。\n- `strong_reuse`：干预净增 **1**，未达到至少 2 门槛。\n- `selection_correct`：净增 **0**，满足\"不下降\"。\n- 三个空样本 A2/P2/S2 并非全部 `correct_non_use`，门槛失败。\n- `false_f3_expansion`：总增量 **0**，满足最多 2 门槛。\n- 结论：**do-not-support-productizing-l0**。不支持产品化 L0 公共知识包。\n\n## v0.3 实验（L1 触发策略精度验证）\n\n- 设计：`L1-baseline` 对 `L1-specific`，ADR/Pitfall/Study 各 6 个情形，共 18 retained pairs、9 个 applicable 与 9 个 non-use，其中 6 个 no-trigger gold。\n- 运行账本：21 pair attempts、3 次整对 member 技术 replacement、42 次 member launches；36 个 retained blind scores，另有 5 次无效 scorer 输出作为技术失败原件保留，共 41 个 scorer contexts，未超过 42 上限。\n- trigger correct：**13/18 → 14/18**；未达到 specific 至少 15/18，净增也未达到 +3。\n- applicable strong reuse：**7/9 → 5/9**；绝对门槛 7/9 与净增 +2 均失败。\n- correct non-use：**1/9 → 4/9**；有改善，但未达到全部 9/9。\n- first legal action correct：**11/18 → 9/18**，违反\"不下降\"门槛。\n- selection correct：**14/18 → 17/18**，满足\"不下降\"。\n- false F3 expansion：**6 → 0**；specific non-use false F3=0，且 no-trigger unnecessary F2=0，相关门槛通过。\n- F3 expansions：**15 → 8**；Helper calls：**31 → 16**，显示成本下降。\n- 结论：**do-not-support-adopting-l1-specific**。误触改善被复用与行动质量回退抵消。\n\n## v0.3 逐样本失败模式（关键）\n\n| pair | family | case_kind | baseline | specific | 失败模式 |\n|---|---|---|---|---|---|\n| A2 | ADR | exact-positive | ✅ strong reuse | ❌ 被 veto | trigger_signal 缺失，决策边界无法被任务语义推导 |\n| A6 | ADR | f2-no-f3 | ✅ trigger | ❌ 未触发 | f2-no-f3 场景策略行为不一致 |\n| P3 | PIT | boundary-partial | ✅ strong reuse | ❌ 被 veto | scope_of_impact 缺失，无法判断\"当前在影响范围什么位置\" |\n| P6 | PIT | f2-no-f3 | ✅ trigger | ❌ 未触发 | f2-no-f3 场景策略行为不一致 |\n| S1 | STU | exact-positive | ❌ strong reuse=0 | ❌ strong reuse=0 | action_relevance 缺失，读了 abstract 不知该拿它做什么 |\n| S2 | STU | exact-positive | ❌ strong reuse=0 | ❌ strong reuse=0 | 同上 |\n| S6 | STU | f2-no-f3 | ✅ trigger | ❌ 未触发 | f2-no-f3 场景策略行为不一致 |\n\n## 根因分析\n\n**结构是更底层的问题，触发策略是次级问题。** 两者都欠，但结构同时削弱了触发策略的有效空间。\n\n### 每类对象的最小字段修正\n\n**ADR 补 trigger_signal**\n- meaning：\"当 AI 正在执行以下类型的动作时，该决策可能已被触达\"\n- not_meaning：该决策的适用范围（那是 applicability）、该决策的内容（那是 decision）\n- constraint：必填非空；必须是动作/行为描述而非范围描述；一个 ADR 可以有多个 trigger_signal\n- 预期修复：A2 任务（\"面向 Human 的中文验收说明首次出现 content_fingerprint 与 CAS\"）——如果 ADR-01KZXN5TXNED08TVYQVTS3BX6X 的 trigger_signal 是\"编写或修改面向 Human 的中文技术说明\"，模型在 F2 阶段就能建立任务↔决策的桥梁\n\n**Pitfall 补 scope_of_impact**\n- meaning：\"该失败机制在哪些当前活动类型、工具交互或技术栈组合中具有潜在影响\"\n- not_meaning：触发失败的前置条件（那是 trigger_conditions）、经验适用范围（那是 applicability）\n- constraint：必填非空；必须使用活动/工具/交互类型的描述，而非历史症状\n- 预期修复：P3 任务（\"Cindy/Codex 中技能文件存在但未加载\"）——如果对应 Pitfall 的 scope_of_impact 是\"与技能文件部署、加载或环境适配相关的异常\"，模型在 F2 阶段能判断\"当前技能加载异常属于该经验的影响范围\"\n\n**Study 补 action_relevance**\n- meaning：\"该研究的关键发现对当前项目下一步行动的具体改变：执行者应因此做什么不同的动作\"\n- not_meaning：研究发现了什么（那是 abstract）、研究建议项目做什么（那是 recommendation_summary）\n- constraint：active 时必填非空；必须是动作/计划层面的改变描述，而非发现层面的总结\n- 预期修复：S1 任务（\"设计 L1 family-specific 触发实验\"）——如果 study-01M03DH7VPFJQVR9G1K7BDP0AA 的 action_relevance 是\"实验设计应区分三层触发信号：ADR 以决策边界触达、Pitfall 以症状/模式匹配、Study 仅索引可见；不使用任务类型平铺\"，模型就能在 F2 阶段建立\"这份研究对我的实验设计意味着什么\"的桥梁\n\n## 建议的验证路线图\n\n### 阶段一：结构验证（仅验证新字段是否被模型正确消费）\n- 任务集：保留 v0.3 的 18 个任务，在 L1-specific arm 中注入新字段\n- 核心指标：F2→F3 决策正确率（模型在 F2 阶段是否做出了正确的展开/停止判断）\n- 不设联合门槛，只看结构改善是否独立成立\n- 预期：A2（ADR exact-positive）和 P3（Pitfall boundary-partial）的 F2→F3 决策改善\n\n### 阶段二：触发策略修正\n- 核心变化：从 L1-specific 的\"精确 veto\"退让到\"宽触发 + F2 内容过滤\"——用新字段的 trigger_signal/scope_of_impact/action_relevance 作为 F2 卡的一部分，让模型自己判断适用性\n- 任务集：保持 18 个任务，增加 6 个新任务覆盖 f2-no-f3 场景\n- 核心指标：strong_reuse 不回退、f2-no-f3 场景的 F2→F3 决策正确\n\n### 阶段三：联合验证\n- 任务集：24 个任务（原有 18 + 新增 6 个 f2-no-f3），每 family 8 个\n- 联合门槛：与 v0.3 相同（trigger_correctness_minimum 15、strong_reuse_minimum 7 等）\n- 新增指标：f2_decision_accuracy（F2 阶段展开/停止正确率）\n\n### 新增诊断指标\n\n- **f2_decision_accuracy**：F2 阶段模型做出的展开/停止/跨 family 判断的正确率。v0.3 的 strong_reuse 回退本质上都是 F2→F3 决策出了问题，直接测量这个节点比间接推断更可靠。\n- **action_bridge_score**：从 F3 全文读取到最终行动选择之间的桥梁质量（0=完全没用到知识、1=引用但没改变行动、2=改变行动但不精确、3=精确应用并改变实质行动）。能区分 strong_reuse=0 是因为模型没读到（不太可能）还是因为读到了不知道该拿它做什么（更可能）。\n\n## 范围边界\n\n- 本分析及后续方向不授权创建 WorkCase 或实现自动注入机制；参数冻结后另经 31 行动模板与 Gate 1 评估。\n- 字段修正（trigger_signal / scope_of_impact / action_relevance）涉及 22（ADR）、23（Pitfall）、24（Study）类型规范和 05 统一字段登记，需走规范修订流程。\n- 本 Spark 保持 open/P1。\n\n## 证据绑定\n\n### v0.2\n- 报告：`docs/metrics/knowledge-precheck-v2/compiled/report.md`\n- 结构化结果：`docs/metrics/knowledge-precheck-v2/compiled/results.json`\n- 记录：`docs/metrics/knowledge-precheck-v2/compiled/records.json`\n- sealed evidence bundle：`docs/metrics/knowledge-precheck-v2/evidence-bundle`\n- evidence manifest SHA-256：`844489c3d577fa0f36cc0d3035d8a68d0174ec52d8cc0e37b2ec5067741c5009`\n\n### v0.3\n- 报告：`docs/metrics/knowledge-precheck-v3/compiled/report.md`\n- 结构化结果：`docs/metrics/knowledge-precheck-v3/compiled/results.json`\n- 记录：`docs/metrics/knowledge-precheck-v3/compiled/records.json`\n- sealed evidence bundle：`docs/metrics/knowledge-precheck-v3/evidence-bundle`\n- evidence manifest SHA-256：`ae675eff19624323e33471476b39edfb5ec0e0095560b3586058b01c8776065c`\n\n### 关键研究\n- study-01M03DH7VPFJQVR9G1K7BDP0AA（知识对象的使用与触发时机：行业实践调研）\n\n## 可解释范围与限制\n\n- 18 个冻结 pair 与当前知识快照不建立广泛因果效应。\n- 原生协作 runtime 的底层模型名、token usage 与 model-only latency 不可得。\n- 两轮实验只评价冻结的 L0 和 L1 policy；不授权生产接入、Specs/Helper/Web 修改。\n- 结构分析是 AI 综合实验证据的推理判断，不是对照实验结论，需下一轮 WorkCase 验证。\n\n## 后续方向\n\n1. 补字段结构（trigger_signal / scope_of_impact / action_relevance）——涉及 22/23/24 类型规范和 05 字段登记，走规范修订流程。\n2. 阶段一：结构验证（18 个任务，仅验证新字段是否被模型正确消费）\n3. 阶段二：触发策略修正（宽触发 + F2 内容过滤，增加 6 个 f2-no-f3 任务）\n4. 阶段三：联合验证（24 个任务，联合门槛验收）\n5. 扩展到更具代表性的真实任务前，继续冻结 applicable/non-use/no-trigger gold、首个合法动作、整对 replacement 与 scorer 技术失败原件；不可用模型/成本字段不得补造。"
