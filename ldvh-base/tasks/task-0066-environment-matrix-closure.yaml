verification: |
  ## 验证计划

  - 只读检索 ECC 相关 refs、research、specs 或历史材料，记录来源路径和关键结论。
  - 对照 LDVH `docs/specs/04.06-平台适配清单规范.md`、04.07、04.08、42 和 `tools/specs_validate.py` 当前实现，形成缺口清单。
  - 运行必要的只读检查命令，例如 `python3 tools/specs_validate.py ldvh-landing-check --format json`，确认矩阵相关缺口如何暴露。

  ## 验证结果

  2026-06-11 已完成只读研究，覆盖 LDVH 04、04.06、04.07、04.08、42、`tools/specs_validate.py`、测试、Claude Code refs，以及 ECC 的 manifest、catalog、doctor、audit、Claude Code 指南等资料。

  结论：04.06 应作为 Trae Work CN、Codex App、Claude Code CLI 三环境承接矩阵唯一入口；当前 04.06 正文已经具备三环境矩阵定位、承接类型、字段、42 使用规则和 04.07/04.08 迁移规则，缺口主要在内容吸收、Claude Code CLI refs 与实测证据、42 旧消费口径和 Code 字段级校验。

  ECC 可迁移的是模块/目标/成本/稳定性/doctor 状态/漂移检查/机器可读报告的设计方法；不可迁移 ECC 对 Claude Code、Codex、Cursor 等环境的直接支持结论到 LDVH。ECC 的 `install-modules.json`、catalog 和 doctor 机制可作为 LDVH 矩阵结构化与校验设计参考，但术语应收敛到 LDVH 的承接类型、承接检查、承接降级和待补齐事项。

  04.07 和 04.08 应继续作为 refs-only 迁移输入，不应作为长期独立环境清单被 42 硬编码消费；退场条件是有价值内容进入 04.06、42 消费口径改为 04.06、引用迁移完成、Code 校验能发现旧清单被误用，且删除/重命名/改变职责前完成 Human Gate。

  Claude Code CLI 当前 refs 仅能支撑 CLAUDE.md、commands/instructions、成本控制、上下文健康、安全配置和 Hook 候选字段；仍缺 commands、skills/plugins、subagents、MCP、settings.json、permissions、hooks 事件、doctor/status、CLI non-interactive、session/compaction 等更完整来源和实测证据。

  后续 Task 边界：A 修改 04.06 并吸收 04.07/04.08；B 修改 42 消费口径；C 扩展 `tools/specs_validate.py` 和测试，实现矩阵字段级校验；D 补 Claude Code refs 与实测证据；E 引用迁移和校验通过后评估 04.07/04.08 历史化或删除候选。
risk_assessment: |
  - 避免把 ECC 机制直接当作 LDVH 事实源；ECC 只能作为参考依据。
  - 避免在证据不足时宣称任一环境完整承接。
  - 避免直接删除 04.07 / 04.08 或重命名 04.06；这些动作需后续 Human Gate 和独立执行 Task。
  - 避免把 Code、Web、证据回写误归类为环境能力项。
