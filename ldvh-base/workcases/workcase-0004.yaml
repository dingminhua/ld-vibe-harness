  ldvh 包与 web_machine 协议定义；不改动 specs/ 任何规范；不新增 Web 写入能力（create-spark 仍走既有 Python
  桥与 loopback 边界）；不做与整改无关的 UI 重设计；Git
  日志(changelog)读取保留现状走 git 子进程。统一读取原则：事实对象 YAML/MD 由 Web 直读机械映射；治理/协议类 YAML 仍经
  Code 受控路径；Git 日志走 git 子进程。
