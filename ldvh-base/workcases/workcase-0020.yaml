  result_summary: 0008、0013、0015、0017、0019、0020 已按精确 ID/CAS 迁移并由 Helper 回读为 mechanically_valid；0008 PlanΔ v2 自动回到 Gate1，0013 安全收敛到 Gate2，其余结果链对象保留真实历史且未补造授权。临时迁移入口与 migration-only tests 已删除。Controller 实测 facts 423 passed、Specs 目录专项 2 passed、Web check 通过、Web API 131/131 passed、git diff --check 通过。
