              - 为 result_review.review_policy 预置规范一致性/事实源边界、实现与验证证据、WorkCase 治理与关闭材料等复核视角。
              - 把 knowledge-map 删除前置改成硬要求：影响扫描、action-guide 等价能力验证、测试通过、Rules 同步审查和 Human Gate 完成后才可删除旧 CLI/API/active 名称/入口。
