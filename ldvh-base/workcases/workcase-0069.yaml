title: 建立可审计的 trial 测量基础设施
status: open
goal: 交付可审计、可独立复核且 fail-closed 的 trial 测量基础设施，使后续实验能产生完整、可解释的证据；本工作项不重跑实验，也不修改生产 Helper。
scope: 仅限 code/ldvh/testing/ 与 code/tests/testing/ 下的测试性模块和测试；可只读读取现行 Helper capabilities/specification 内容以生成并校验提示卡声明；运行数据只能写入由运行器新建、并以创建身份、realpath、lstat 前后校验的 mkdtemp 临时根目录。明确排除任何真实 A/B trial、提示卡效益判断、生产 Helper/调用入口/能力契约、规格、文档、其它事实对象、Git、配置、网络、依赖安装及 WorkCase-0068 产物的修改。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 存在版本化、严格且禁止未声明字段的 JSON schema，明确 trial_id、task_package_hash、condition、runner/schema/rule/capability fingerprints、correct、first_legal、discover/target/repair/total 调用、extra_calls、invalid_requests、response_bytes、estimated_tokens、duration、timeout、failure、unavailable_reason 的类型、可空性、单位和错误语义；每种终态均能形成完整对象。
- criterion_id: criterion-02
  statement: 运行器自动采集而非由 agent 事后填写调用分类及次数、invalid_requests、成功和失败时完整原始 Helper 响应 UTF-8 bytes、monotonic clock duration、timeout/failure；token 不可得时必须为 null 并附 unavailable_reason，绝不可填 0。
- criterion_id: criterion-03
  statement: 所有运行数据仅写入运行器新建的 mkdtemp 根目录；创建前后以创建身份、realpath、lstat 校验，拒绝 ..、绝对路径、符号链接逃逸、既有或非自身创建目录及 realpath 漂移；不得回退到仓库或 ldvh-base。
- criterion_id: criterion-04
  statement: 提示卡声明由当前 capabilities/specification source 读取生成并记录 provenance 与 fingerprint；无法从当前源验证的声明必须拒绝生成。
- criterion_id: criterion-05
  statement: 正常、缺字段、额外字段、畸形 JSON、失败响应、超时、错误提示卡及全部路径逃逸均有 synthetic tests；独立复核者可重跑全量测试，并确认未发生真实 trial、生产契约变更或越权写入。
