title: git Gate 事实机械校验与完整性校验一等化
status: open
priority: P1
phase: controller_checking
plan_version: 1
goal: 让 git commit-msg Gate 在 Index 候选包含事实布局内、object_id 合法且有暂存内容的 ldvh-base/ 路径时，对候选事实文件执行与事实读取同核（carriers、validate_fact_object、object_id 与文件名身份核对、内容指纹、大小预算）的机械校验，使 adr-0006 第三条既定的「事实完整性终闸」成立；同时将事实完整性机械校验一等化为 Helper 公开操作并合同化输出，供行动模板与 Skill 引用；在同一边界内完成 spark-0022 多人未同步 ID 冲突 Gate 的合并评估并给出归属结论。
scope: 覆盖 specs/03 §9 扩展（触发条件、校验层、结果并入 mechanical_outcome/issues、删除与改名状态语义）、specs/05（及必要时 04）公开操作登记、05 校验向 commits 链路投影复用、code/ldvh 的 commits/git_hooks/hooks/helper 与 facts 复用面、双入口同步、相应测试、spark-0022 与 spark-0039 受控写回。分寸约束（2026-07-31 Human 指令，机械承接）：校验严格限于当次 Index 候选中的事实文件；提交链路不做全库或全量验证；不引入全量测试默认要求；AI 侧验证声明按候选范围适度。排除：远端刷新型 ID 冲突 Gate 的实现（只评估归属）；语义审核进 Gate；全库扫描进提交链路；历史 commit 追溯；新增 console 入口与 pyproject 改动；spark-0039 其余待办项；specs/08、web/*、docs/ 并行会话文件；adr-0006 本文。
success_criterion_definitions:
- criterion_id: criterion-candidate-fact-validation
  statement: commit-msg Gate 对 Index 中有暂存内容的合法事实路径触发与事实读取同核校验：invalid 时 failed/block 且诊断精确到文件与失败项；删除、改名出布局不误报；无事实候选时零额外开销（惰性，不投影不读 blob，spy 可判定）。
- criterion_id: criterion-first-class-integrity
  statement: 事实完整性机械校验作为 Helper 公开操作在 specs/05 公开操作表登记，capabilities 可发现、可直调、输出合同化，行动模板与 Skill 可引用。
- criterion_id: criterion-id-conflict-boundary
  statement: spark-0022 多人未同步 ID 冲突 Gate 归属有明确结论（并入后续或保持 open 另立），其 evolution 补记评估过程。
- criterion_id: criterion-measured-scope
  statement: 提交链路（ldvh.commits/hooks/git_hooks）不引入全库扫描，由 import 边界测试机械判定；全库扫描只存在于独立的一等化入口。
- criterion_id: criterion-same-validator
  statement: Gate 与事实读取消费同一校验实现，无第二份 schema 解析逻辑；validator 保持纯函数；暂存 blob 由观察层按 Index oid（事件自身 GIT_INDEX_FILE）提供；双入口一致性与投影同步测试通过。
- criterion_id: criterion-tests-docs
  statement: specs/03 §9 与 specs/05 登记同钉住测试一致；specs/commits/git_hooks/hooks/helper/facts/docs 受影响测试集通过。
