success_criterion_definitions:
- criterion_id: criterion-01
  statement: 在任何生产 Code 修改前形成并可从稳定入口定位当前 Code Implementation Plan；其记录实现起点
    ddcff52a、当前 Working Tree 覆盖、模块责任、依赖、接口和 Schema 维护、副作用、诊断、风险测试与缺口，且不把 Git
    tracked 或 committed 当有效性前提。
- criterion_id: criterion-02
  statement: 采集器按 07.Att.01 精确覆盖实际 worktree
    全部普通文件并在下探前应用唯一排除；untracked、ignored、dirty 文件按实际 bytes
    纳入，HEAD、Index、status、ls-files 和 Git 分类不参与文件集合或指纹。
- criterion_id: criterion-03
  statement: symlink/reparse、非普通条目、枚举或读取失败、读取期路径变化、NFC 冲突均 fail-closed 为合法
    incomplete 与闭集 gap；只有 governance scope 为 governed_single、请求 workspace
    精确等于唯一实际 worktree root 且项目/root/common-dir 完整唯一时才启动首个检查，其他管辖或技术结果均在检查前终止为
    unknown、DTO null 并保留诊断。
- criterion_id: criterion-04
  statement: ldvh-test-run/2 只用于新 full-v4：运行态 working_tree_evidence 固定为
    null，before 耐久 checkpoint 明确不是 DTO；正常 worker 在 finally 尝试 after 并形成合法终态
    DTO，after 身份复核不成立时形成 identity_mismatch 的 incomplete DTO；before incomplete
    仍执行五步并尝试 after，但最终为 unknown。
- criterion_id: criterion-05
  statement: v2 状态矩阵唯一成立：全 passed 且 DTO complete 为 passed；确定 failed、其后允许 not_run
    且 DTO complete 为 failed；任一步 unknown 或 DTO
    stale/incomplete/null/非法、原始输出或终态不可回读均为 unknown；evidence_complete 只对
    passed/failed 为 true，步骤状态和已确定 final_exit_code 不因 DTO 降级被抹除。
- criterion_id: criterion-06
  statement: reader 同时接受 v1/v2；v1 继续执行既有 worker 丢失和 raw-output 缺失降级规则，不因没有 DTO
    被追溯改写或补造，也不支持当前树绑定。新 probe 继续使用 v1，消费者必须同时检查 plan=full-v4，probe passed
    永不表示产品或当前 Working Tree 验证。
- criterion_id: criterion-07
  statement: 聚焦正反测试覆盖精确排除、untracked/ignored、symlink/reparse/unsupported、读写竞态、NFC
    collision、管辖拒绝矩阵、linked worktree、after identity mismatch、stale 完整
    changes、incomplete、步骤失败/unknown、worker 丢失、raw output 缺失、v1 兼容和
    probe，且不以单一平台偶然行为证明跨平台语义。
- criterion_id: criterion-08
  statement: 新 full-v4 dogfood 可按 run_id 回读合法 DTO，DTO.status=complete
    且固定五步通过，manifest 绑定当时实际 Working Tree；范围检查确认未修改规则源、B/D/E、Helper/Web/Codex/事实
    Schema、00/Sparks 或远端。随后恢复 workcase-0003，用新证据重新判断其关闭分类，不把 C 生命周期本身当作证明。
