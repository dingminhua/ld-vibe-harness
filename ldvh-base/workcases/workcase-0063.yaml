title: 署名取值可靠化——让 change_log 与提交署名精确反映当前会话模型标识并落实自动注入
goal: 让 LDVH 的 change_log 责任签名（signature.agent_id / host_environment）与 Git 提交署名（Agent-ID / Host-Environment trailer）可靠精确地反映当前执行会话的实际模型标识（如 glm-5.2），并把签名取值从 AI 手填改为由执行会话/调用方按实际运行环境注入，消除署名不一致、大小写混乱与 host_environment 误用为 agent 名等不可审计问题。
scope: 承接并落地 spark-0051 议定的规范约定：含——(1) 在 04.Att.01 共同请求字段 observed_context 子 schema 声明 signature 注入入参（agent_id、host_environment、session_id 三字段，可选出现，出现时非空且遵循取值约定）；(2) 在 05.Att.01 change-log-signature 登记补取值约定与注入责任约束行（agent_id=实际驱动模型/Agent 身份、host_environment=工作环境/宿主工具、禁止重复、由平台/执行会话自动注入而非 AI 手填）；(3) 在 Code（create-fact-object 与 update-fact-object 应用层）实现从请求 observed_context.signature 取值并机械注入 change_log signature，未提供时保留既有行为不破坏兼容；(4) 在 03 提交 Git Gate 确认 Agent-ID / Host-Environment 提交署名遵循同一注入约定；(5) 补 contract tests 验证注入正确性与缺失时的兼容回退；(6) 经 30 模板受控提交、Git Gate 通过。不含：统一重写既有历史 change_log（追加式，历史条目不可改写）；新建顶层共同请求字段或改动 04 正文共同字段行为；修改 phase/状态机、Helper 操作新增、Human Gate 流程；任何 Web/前端聚焦页面；push/PR/发布。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 04.Att.01 共同请求字段 observed_context 子 schema 中存在 signature 注入入参声明（agent_id、host_environment、session_id），出现时非空且遵循 05.Att.01 change-log-signature 取值约定。
- criterion_id: criterion-02
  statement: 05.Att.01 change-log-signature 及其成员行存在取值约定与注入责任约束，明确 agent_id=实际驱动模型/Agent 身份（如 glm-5.2）、host_environment=工作环境/宿主工具、禁止重复、由平台/执行会话按实际运行环境自动注入而非 AI 手填。
- criterion_id: criterion-03
  statement: Code 在 create-fact-object 与 update-fact-object 应用层接受 observed_context.signature 并机械注入新 change_log 条目的 signature；未提供时保留既有行为（timestamp 填充保持不变）且不破坏兼容。
- criterion_id: criterion-04
  statement: 存在 contract tests 验证：(a) 提供 observed_context.signature 时新条目 signature 精确等于注入值；(b) 未提供时新条目签名保持既有行为且 tests 通过。
- criterion_id: criterion-05
  statement: 03 提交 Git Gate 契约确认 Agent-ID / Host-Environment 提交署名遵循同一注入约定，与同事务 change_log signature 取值一致（不因本 WorkCase 移除多 Agent footer 能力，历史多执行者提交兼容不破坏）。
- criterion_id: criterion-06
  statement: 全部改动经 30 模板受控提交、Git Gate 通过，commit 路径闭集仅含本 WorkCase 实际变更，提交后 check-fact-integrity 外层 ok 且 result.status=complete。
