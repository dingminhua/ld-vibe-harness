title: LDVH 常用行为清单——五类事实对象生命周期流程
status: closed
goal: 系统化提炼 LDVH 五类事实对象（Spark, WorkCase, ADR, Pitfall, Study）的完整生命周期常用行为清单，形成一份可独立引用、具有跨行动复读价值的 Study，使 AI 执行者不再从零探索操作模式，减少步骤遗漏和摩擦重复。
scope: 只分析 LDVH 规范（specs/20-Spark, 21-WorkCase, 22-ADR, 23-Pitfall, 24-Study）、事实对象样例（ldvh-base/ 中的各类型文件）、已实现的 Helper CLI 操作（capabilities 清单），以及行动模板（31/32/34），提炼出五个事实类型各自的完整生命周期行为清单。产出物是一个 Study 文件（ldvh-base/studies/study-<uid>.md）。明确排除：不修改 LDVH 核心源码或规范正文；不创建或修改 WorkCase/Spark/ADR/Pitfall 事实对象（Study 本身除外）；不执行 Git 提交；不涉及环境接入、Git Hook 部署或 Web 修改。
success_criterion_definitions:
- criterion_id: criterion-complete
  statement: Study 中对五类事实对象（Spark, WorkCase, ADR, Pitfall, Study）每一类至少覆盖创建、更新、状态转换、终态处置四个生命周期环节，每环节有可操作的行为步骤说明。
- criterion_id: criterion-helper-commands
  statement: 每个行为步骤标注对应的 Helper CLI 操作名（如 create-fact-object, update-fact-object, read-fact-objects, update-workcase, close-workcase 等），以及必要的参数提示。
- criterion_id: criterion-cross-ref
  statement: 行为步骤之间有交叉引用，说明何时从某类流转到另一类（如 WorkCase 执行中创建 Pitfall draft、Study 的 informs 指向 WorkCase 等），形成完整的生命周期流动图。
- criterion_id: criterion-readable
  statement: Study 以 Markdown 正文组织，符合 specs/24-Study 规范的五段 H2 要求（研究问题、输入与边界、关键发现、建议、后续分流），且 frontmatter 字段完整。
success_criterion_results:
- criterion_id: criterion-complete
  outcome: satisfied
  summary: Study 中五类事实对象每类均覆盖创建、更新、状态转换、终态处置四环节，WorkCase 额外覆盖终止与更正。
- criterion_id: criterion-helper-commands
  outcome: satisfied
  summary: 每个行为步骤均标注对应的 Helper CLI 操作名，并附参数提示和 bash 命令示例。
- criterion_id: criterion-cross-ref
  outcome: satisfied
  summary: 跨类型生命周期交互表格列出 6 种流转场景，各章节内标注类间流转关系，形成完整生命周期流动图。
- criterion_id: criterion-readable
  outcome: satisfied
  summary: Study 符合 24 规范五段 H2 要求，frontmatter 字段完整，input_refs version 已修正为实际 commit SHA。
