title: 原子创建 WorkCase 并分流 Spark
status: closed
goal: 新增一个真正的多对象 Helper 操作：在调用者已明确完成语义承接判断的前提下，创建一个 WorkCase 并将一个 open Spark 在同一可恢复事务中分流为 routed；任何未能证明两个对象共同生效或共同未生效的情形均不得报告整体成功。
scope: 覆盖 Spark→新 WorkCase 承接的专属多对象事务规则与实现：05 的新公开操作和多对象事务契约、20/31/32 的分工与路由、Helper 注册/请求/操作、独立事务日志与恢复实现、独立事实/Helper/规格契约测试，以及本 WorkCase 的受控更新。04 与 04.Att.01 保持不改；当前未提交的 WorkCase 质量关口改动仅作为只读基线，禁止修改其已触及的 21、34、creation_application、workcase_validation、workcase_projection、transitions 及相应既有测试。排除 Web、既有 Spark 自动迁移、既有 WorkCase 补写、Git commit/push/PR、外部操作和环境配置。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: 05 定义 create-workcase-from-spark 的专属请求、两对象 result/scope/changes/verification、锁序、事务日志、读者隔离、恢复与停止边界；20 明确 Code 只消费调用方提供的完整承接语义 after，31/32 正确路由，04/04.Att.01 未被无必要修改。
- criterion_id: criterion-placeholder
  statement: 专属请求以仅本 operation 可用的新 WorkCase 目标占位符表达 Spark routed after；allocation 后仅确定性替换为真实 WorkCase 三元组、写入 routed-to、完成 open→routed 并移除 priority。占位符不得进入 canonical 事实载体或通用更新请求；其它 Spark 字段与关系必须显式完整，不得由 Code 推断。
- criterion_id: criterion-atomic-observability
  statement: 实现可验证的多对象事务可见性：所有前置检查在 counter 与载体写入前完成；受控读取在事务 in-progress 时不把仅一个对象可见的状态表述为完成；恢复后能确定两个对象共同生效或共同未生效，否则如实 partial 并停止后续事实写入。
- criterion_id: criterion-negative-recovery
  statement: 故障注入覆盖 allocation 后、任一载体写前/后、日志恢复前/后及读者遇到 in-progress 事务；stale/non-open Spark、非法 WorkCase 草案、关系闭包不成立或来源前提失败均零写入。counter 已消耗、残留与条件恢复按实际结果报告。
- criterion_id: criterion-verification
  statement: 新增操作的单元、Helper 及规格契约测试通过；目标对象精确回读、全库完整性检查和独立结果复核完成，并如实保留未验证范围。现有质量关口 dirty 基线未被修改；若实施必须触碰其已改文件则停止并交还。
success_criterion_results:
- criterion_id: criterion-contract
  outcome: not_satisfied
  summary: 本案仅确认原授权无法覆盖所需全局事务边界，未修改 05、20、31、32 并形成完整多对象契约；该责任转交 workcase-0033。
- criterion_id: criterion-placeholder
  outcome: not_satisfied
  summary: 未实现或验证新 WorkCase 引用占位符、Spark routed after 物化与关系闭包；该责任转交 workcase-0033。
- criterion_id: criterion-atomic-observability
  outcome: not_satisfied
  summary: 未实现跨 Spark 与 WorkCase 的共同可见性；已确认现有公开读取无法依靠事务日志隔离半完成状态。
- criterion_id: criterion-negative-recovery
  outcome: not_satisfied
  summary: 未实现事务核心，因此未执行 allocation、载体写入、日志与恢复故障矩阵；该责任转交 workcase-0033。
- criterion_id: criterion-verification
  outcome: not_satisfied
  summary: 未形成可供单元、Helper、规格契约与故障恢复测试验证的本案实现；本案事实更新的写后机械审计通过，但不证明目标功能成立。
result_summary: 本案没有形成目标多对象原子操作。已稳定确认：现有逐文件载体与公开读取边界不足以保证 Spark routed 与新 WorkCase 创建共同可见，必须引入更广的根事实快照和受控读写隔离能力。Human 已选择保留 workcase-0033 作为统一承接者，本案停止继续实施。
validation_summary: 未对 workcase-0031 形成目标实现或运行功能测试；只读调查确认原方案的半完成可见性缺口。受控状态更新已完成精确回读与写后全库机械完整性审计，但该机械检查不证明多对象事务能力。
closure_outcome: not-achieved
disposition_summary: workcase-0031 未形成目标多对象原子能力并停止继续实施；全部契约、占位符、共同可见性、恢复与故障验证责任统一转交当前 workcase-0033，workcase-0031 不再承担后续推进。
