  本次会话从"hook 机制出了问题"出发，沿链路逐层诊断：
  - 发现知识地图 diagnostics 用户不可见 → 修了 dispatcher 输出
  - 发现 workcase-0011 broken reference → 修了数据
  - 发现 20+ Code 命令只有 3 个自动触发 → 建立了 wc-0019/0020
  - 发现 AI 不知道 WorkCase 状态机规则 → 暴露了 Skill 层空白
  - 发现唯一的 ldvh-git-commit Skill 也没有触发机制

  旧 Rules 命令参考表覆盖了全部四层（读什么、检查什么、跑什么命令、用什么 Skill），新系统按层次拆分后，Skill 层始终没有建立。
