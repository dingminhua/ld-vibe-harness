title: 多管辖项目 Harness 全链路成熟度审视
intent: 保留 LDVH
  多管辖项目能力是否形成完整且可解释闭环的问题，避免把单项目可用、项目注册存在或某个聚合页面误作多项目治理已经成立。后续需判断项目边界、跨项目聚合与隔离、身份消歧和各层责任如何共同成立，并将独立缺口分流。
status: open
priority: P1
