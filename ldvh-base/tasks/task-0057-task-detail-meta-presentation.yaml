description: |
  ## 背景

  当前 Task 详情页在语义阅读布局中仍可能把分类、优先级等元信息作为独立字段或独立行呈现。此类信息不是任务阅读主线的一等内容，单独成行会打断用户对目标、验收、验证、证据和产出的连续阅读。

  ## 目标

  重新思考 Task 详情页的元信息信息架构，将分类、优先级等辅助属性从主阅读流中降级为上下文标签、摘要徽标或折叠型辅助信息，避免与任务目标、验收标准等核心内容同级呈现。

  ## 边界

  - 聚焦 Web 端 Task 详情页的信息架构和呈现方式
  - 不改变 Task YAML 字段契约
  - 不引入 Web 写事实源能力
  - 不影响非 Task 对象详情页的通用字段展示
source: 用户反馈分类和优先级都不属于需要单独一行呈现的信息，要求重新思考并建立专项任务完成。
acceptance: |
  - [x] 梳理 Task 详情页中分类、优先级及类似元信息字段的实际呈现位置
  - [x] 分类、优先级等辅助属性不再作为主阅读流中的独立大行或独立内容区呈现
  - [x] 辅助属性被整合为更低权重的上下文信息，如顶部摘要、徽标、紧凑标签或折叠信息
  - [x] 任务主阅读流仍以目标、验收、验证、关闭证据、产出与文档为核心结构
  - [x] 其他字段区域不会重新把分类、优先级提升为高权重展示
  - [x] 保持 YAML 源码折叠入口可查看完整事实源
  - [x] 运行 TypeScript 类型检查通过
