title: v3 旁路工作树与行动指南编译链探索
status: pending
created: '2026-06-27T22:40:41.783405'
updated: '2026-06-28T02:20:00+08:00'
description: |
  本 Spark 记录 LDVH v3 的旁路实验线：在同级目录创建 `../ld-vibe-harness-v3`，使用独立分支 `dev-v3`，并以 orphan-style 干净根逐步迁移必要内容。版本身份由外层 worktree、分支和工作区根目录管辖项目 `ldvh-v3` 承载；本轮只允许增加管辖配置，不改变 Runtime、dispatcher、native hook 或提交策略。v2/v3 worktree 共享 Git common_dir 时如何消歧，必须作为后续方案单独沟通确认。新工作树内部直接使用未来主线目录名，一级目录只放稳定构成面：`specs/`、`code/`、`tests/`、`rules/`、`hooks/`、`skills/` 和 `ldvh-base/`，不再使用 `specs-v3/` 或 `code-v3/` 这类临时目录。

  v3 骨架应体现权威归口：

  ```text
  ../ld-vibe-harness-v3/
    specs/
      schemas/
      attachments/
    code/
    tests/
      fixtures/
    rules/
    hooks/
    skills/
    ldvh-base/
  ```

  `specs/` 是规则权威；`specs/schemas/` 是 specs 授权的机器可读契约层，不是独立事实源，也不是 Code 私有配置；`code/` 消费 schema，但不拥有 schema；`tests/fixtures/` 是验证样例、回归输入和正反例材料，不是规则来源；`ldvh-base/` 承载真实事实对象，不混入测试假数据。简言之：schema 归 specs，fixtures 归 tests。

  v3 的目标不是重写一批 Markdown，也不是在当前 v2 主线删除知识地图入口，而是验证一条带明确边界的最小闭环：

  ```text
  面向 LDVH 规范、事实对象和运行时资产的格式化规范源文件
  -> 只读、实时、可复查、无语义猜测的确定性 Code 编译
  -> 面向当前任务和目标对象的知识地图 / 行动指南投影
  -> AI 按任务导航要素读取、判断、行动、停止、追问和验证
  ```

  这里的“格式化规范”不是泛化文档格式，而是面向 LDVH active specs、授权附件、成员身份块、字段闭集、状态闭集、关系类型、Human Gate、运行时资产和管辖项目事实对象的结构化契约。它的目标是让 Code 能确定性解析来源、状态、权威、父子关系、输入范围、读取职责和停止边界。

  这里的“确定性 Code”不是智能解释层，而是只读编译层：它只能基于显式 schema、路径、target、payload、Git 身份、管辖配置、身份块、对象状态和枚举化任务声明生成派生结果；它不猜用户自然语言意图，不替 AI 做价值判断，不替 Human Gate 授权。

  这里的“知识地图 / 行动指南”不是全量知识图谱、缓存或第二事实源，而是面向当前任务和目标对象的实时任务导航投影。它以 AI 行动所需的导航要素组织信息：相关关系、最小读取计划、影响判断、停止条件、下一步查询、工具建议、验证建议和来源回指。它的目标不是“轻量”，而是渐进、足量、可回指、可停止，并让 AI 在更少猜测下行动。

  v3 第一轮应围绕以下原则推进：

  1. **权威规则结构化**：源规范承载权威规则；薄行动入口只声明进入场景、来源、接管范围、能力资产、Gate、回写和环境边界；检查清单、读取路线和审核步骤应由 Code 从结构化规则派生，避免厚写成第二事实源。
  2. **行动指南面向当前任务行动**：行动指南的核心 schema 可压成行动身份、目标证据、P0/P1 读取计划、停止 / Human Gate 候选、诊断、后续查询、工具建议、读后行动计划、验证 / fallback 和来源回指。节点和边可以作为 compiler IR 或调试输出，但不应成为 AI 的主要消费面。
  3. **任务导航渐进、足量、可回指、可停止**：默认 target-first、current-project-first、P0/P1-first；P2/P3、跨项目召回和深挖内容通过 `next_queries` 或等价机制展开。每条读取建议、停止条件、工具建议和影响提示都必须能回指来源；缺少来源回指时只能作为诊断或非可信提示。
  4. **Code 只做确定性编译**：Code 只能解析显式 target、payload、cwd、Git common-dir、管辖配置、对象 ID、身份块、事实对象状态和枚举化 `task_type` / `action_hint`。Code 不猜自然语言意图，不判断业务价值，不声明 Human Gate 已通过，不输出 `allowed`、`approved` 或 `unblocked`。
  5. **Runtime 与行动指南分层**：行动指南只输出候选读取、候选停止、候选 Human Gate、候选工具计划和下一步建议；Runtime / dispatcher 继续负责 canonical event、receipt、ack、blocking、pre-tool-use、git.commit-msg 和写入 / 提交门禁。Hook 必须转发真实 payload / target；Rules 只能模拟同一 canonical event；Skill 负责指导 AI 把语义转成枚举声明或复用工作流，不复制 Runtime 判断。
  6. **入口顺序可观测**：目标顺序是先路由、再读取、再 acknowledge、再行动、再验证。导航不可用时仍必须返回最小 fallback read plan；管辖项目内不得确认空 required paths；写入或提交前仍应有已消费 read plan 的证据。
  7. **控制 AI 负担**：默认输出应为 `brief` 或 receipt 模式；`attention_points` 控制在 3-5 条；P0/P1 有上限；同一 `cwd + targets + action_hint + project_scope + diff/staged hash` 已确认时，只返回 `guide_receipt=found` 或等价结果，不重复刷完整指南。
  8. **跨项目只做召回和影响判断**：所有管辖项目可以作为可发现、可召回、可影响判断范围，但不得默认全文注入上下文。跨项目输出必须保留项目命名空间，不得裸 ID 合并，不得把派生关系或诊断回写为任何项目事实源。
  9. **v2 继续稳定服务**：当前 v2 的 knowledge-map、Runtime Protocol、dispatcher、Rules 和事实源继续服务现有项目。v3 先在旁路工作树证明编译链、行动指南 schema、target-first / fallback / source_refs / stop_conditions 测试闭环，再决定哪些 v2 specs 值得迁移、抽象、合并或废弃。

  第一轮实验范围应保持小而完整：建立无版本号目录骨架；定义格式化规范契约、行动指南输出契约、Code 确定性编译规范和 v2 adapter 边界；实现最小 compiler；在 tests/fixtures/ 中放 active spec、active action member、candidate action member、deprecated attachment、invalid input 和 target/fallback 场景；用测试固化 candidate 不可执行、deprecated 不可作为 active 来源、P0/P1 不被噪音挤掉、STOP 可触发、source_refs 可回指、Code 不输出授权语义。

  明确不做：不在当前 v2 主线原地替换 knowledge-map；不删除现有 knowledge-map CLI / active 能力名；不把行动指南做成事实源或跨会话记忆；不把所有管辖项目默认全文展开；不把命令建议做成 dispatcher 阻断语义；不把安装 bootstrap、现场 Hook 适配细节或文件类型命令映射扩张成 v3 compiler 主线。

  后续自举链讨论修正了一个关键点：v3 不应让 YAML 先成为上位规范。Human 明确允许将第一批核心规范放入 `specs/core/`。因此 v3 的权威链应收束为：

  ```text
  v3 项目决策
  -> specs/core/ Markdown 核心规范
  -> specs/schemas/ 机器契约
  -> YAML instances / formatted sources
  -> deterministic Code
  -> Action Guide
  ```

  `specs/core/` 是父层规则权威；YAML 是规范授权后的机器表达，不是上位规范本身。自举不是 `specs/00-*` 文件，也不是 schema 自封，而是由 Human 的 v3 项目决策设立第一批 core specs，之后扩展由 core specs 接管。

  稳定约束追加：v3 不能重做一套 specs 正文分类体系。原 LDVH specs 文档体系是迁移基线；普通 specs 正文继续按原体系逐步迁移和抽象，主要仍是 Markdown。`specs/core/` 只承载少量上位父层规范；`specs/schemas/` 只承载被 specs 授权的机器契约；YAML instances / projection 只是机器表达。不得把所有 specs 正文改写成 YAML，也不得未经明确决策新增 `specs/runtime/`、`specs/facts/`、`specs/action/`、`specs/git/` 之类新专题目录来替代原文档体系。
