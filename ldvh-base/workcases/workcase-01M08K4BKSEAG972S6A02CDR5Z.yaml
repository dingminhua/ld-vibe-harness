status: closed
title: 触发边界校准验证实验 v6：动作语义触发对激活质量的校准效应
goal: 在 v5 已证有效的呈现层（激活投影）基础上，验证「动作语义触发」是否能在保持激活质量的同时修复 v5 的触发精度回退。v5 结论：激活投影显著改善正确激活率（7/9->9/9）、行为改变、strong_reuse、漏检、false F3，但宽触发召回导致过度触发（trigger_correct 16->14、unnecessary F2 2->4），误触发集中在 gold=false 的 tempting-no-trigger / pure-non-use 任务（A5/P4/P5/S4/S5 的 enhanced 臂），联合门槛失败。v6 假设：触发判定不应只问「任务是否提及 family 信号词」（信号词宽触发），而应问「该任务是否有一个可被该知识改变的具体行动/决策点」（动作语义触发）；对 gold=false 任务虽提及信号词但无可改变行动，不应触发。设计：呈现层固定为 v5 激活投影（隔离变量），召回层从宽触发改为动作语义触发，复用 v5 的 18 个冻结任务/gold 与激活投影卡，按预注册门槛得出 supports-action-semantic-trigger 或 do-not-support-action-semantic-trigger 的严格结论并写回 spark-01KZXN5TXNEKMANG1WTFBKT5FW。
scope: 仅新增 code/ldvh/testing/knowledge_precheck_v6.py、code/ldvh/testing/knowledge_precheck_v6_trial.py、code/tests/testing/test_knowledge_precheck_v6.py、code/tests/testing/test_knowledge_precheck_v6_trial.py 与 docs/metrics/knowledge-precheck-v6/；v5 代码只允许作为只读剪裁/复用依据，v3/v4/v5 sealed bundle、compiled artifacts 与 docs/metrics/knowledge-precheck-v5 不得修改。复用 v5 的 18 个 task/gold（A1-S6、6 情形、9 applicable/9 non-use/6 no-trigger gold）与激活投影双卡集（family_cards_baseline/family_cards_activation）。双臂共享同一 task/gold、盲评 rubric 与呈现层（激活投影卡）：calibration-baseline = 宽触发召回 + 激活投影（即 v5 activation-enhanced 臂的召回与呈现）；calibration-enhanced = 动作语义触发召回 + 激活投影（唯一差异为召回层触发边界）。动作语义触发仅存在于实验 Gateway 与证据 bundle，不写入生产 F2 投影、不修改事实 Schema/05.Att.01/Helper contract/Specs。只允许真实 Helper F2/F3 只读调用及字段闭集证据留存；source-complete 报告成立后允许经 Helper CAS 更新 spark-01KZXN5TXNEKMANG1WTFBKT5FW（object_uid 019ffb52-ebb5-74e8-aac0-3cd3d73d15fc，保持 open/P1）。排除：生产 L1/L0 接入实现、Specs/Helper contract/事实 Schema/Web 修改、v2/v3/v4/v5 代码或证据改写、Git commit/push/PR/release、部署和网络发布、本 WorkCase 与该 Spark 写回以外的其它事实对象创建。
success_criterion_definitions:
- criterion_id: criterion-frozen-v6-protocol
  statement: 冻结 v6 protocol（schema_version=ldvh-knowledge-precheck-v6/1）：动作语义触发机制规格、18 个 task/gold 复用（A1-S6）、双条件（calibration-baseline/calibration-enhanced）、9/9 条件首发顺序平衡、模型/runner 身份策略与盲评 rubric（含 action_bridge_score 0-3）、artifact denylist 与 ceilings（18 pairs/21 attempts/3 replacements/42 launches/42 scorer/600s/6h）。预注册采用门槛全部可机械判定：trigger_correct 增强臂 >= 基线；unnecessary_f2 增强臂 <= 基线；正确激活率（applicable 任务上 triggered 且 strong_reuse 且 action_bridge_score>=2）增强臂 >= 基线（基线即 v5 的 9/9，校准不得牺牲已证有效的激活质量）；behavior_change_rate、strong_reuse、missed_detection_rate 增强臂 >= 基线；correct_non_use 增强臂 >= 基线；policy_capacity 与 source_complete_replay 成立。任一门槛失败即 do-not-support-action-semantic-trigger。
- criterion_id: criterion-action-semantic-spec
  statement: 动作语义触发规格冻结并实现于实验 Gateway：触发判定从「family 信号词宽触发」改为「任务存在可被该知识改变的具体行动/决策点」+ 类型化信号（ADR 决策问题触达、Pitfall 失败机制匹配、Study 新领域依赖）；对 gold=false 的 tempting-no-trigger/pure-non-use 任务（仅提及信号词、无行动锚点）不得触发；与 v5 宽触发（无 veto）及 v0.3 L1-specific 精确 veto 的差异在 protocol 中显式说明（v6 不是 veto——它改变触发判定的正条件，而非事后排除）。
- criterion_id: criterion-presentation-layer-fixed
  statement: 呈现层固定为 v5 激活投影（两段式 action-guidance：activation_means/suggested_action + knowledge_body），两臂使用相同投影卡集，确保 v6 隔离的是「触发边界校准」的独立效应而非呈现层变化；投影仅存在于实验 Gateway 与证据 bundle。
- criterion_id: criterion-v6-source-complete-replay
  statement: 独立 sealed evidence bundle 从 protocol/task/gold、source snapshot（含基线卡集与激活投影卡集）、raw Helper exchanges、模型结构化输出、盲评 packet/评分、效用留痕及 adjudication ledger 字节一致重建 records、results 与 report；主指标与全部诊断指标由 frozen gold 加 raw response/trace 确定性重算；缺失、额外、篡改、hash drift、score/packet 不绑定或 post-hoc override 均被拒绝。
- criterion_id: criterion-v6-automated-verification
  statement: v6 focused tests 实际覆盖 protocol 闭集与双条件结构、action-semantic gateway 的触发判定/漂移拒绝/条件泄漏拒绝、真实只读 fixture、byte replay、盲评脱敏（packet 无 arm 标识）、fresh context/scorer 唯一性、attempt/replacement/launch/time ceiling 与 technical-exclusion 闭集；同时重跑 v5 non-live-source focused tests 证明 sealed v5 行为与产物未被改变。
- criterion_id: criterion-v6-paired-measurement
  statement: 实际取得恰 18 retained pairs；最多 21 个 pair attempts、3 个仅由预注册技术排除触发的整对 replacements、42 个 member launches 与 42 个 scorer contexts，每个 member 最多 600 秒、无单臂重试、总运行不超过 6 小时。报告逐 family/情形及总体的 trigger confusion matrix、unnecessary F2、正确激活率、行为改变率、strong_reuse、correct_non_use、false F3、action_bridge_score 分布、Helper 调用数及可观察成本，并严格按冻结联合门槛给出 supports-action-semantic-trigger 或 do-not-support-action-semantic-trigger；错误、null、负效应和不利 family 结果不得排除。
- criterion_id: criterion-v6-trigger-precision-recovery
  statement: 动作语义触发必须恢复触发精度：增强臂 trigger_correct 绝对 >= 15/18 且相对 v5 enhanced 臂（14/18）净增 >= +1，unnecessary_f2 增强臂绝对 <= 2；该 criterion 直接检验 v6 是否修复 v5 的过度触发（针对 A5/P4/P5/S4/S5 类 gold=false 误触发）——若动作语义触发未能降低误触发则触发校准无效。
- criterion_id: criterion-spark-v6-writeback
  statement: 仅在 v6 source-complete 报告成立后（机械前置条件，非 Human Gate），spark-01KZXN5TXNEKMANG1WTFBKT5FW 的公开精确回读包含报告绑定、实测指标、各门槛通过/失败、运行时可观察性与因果限制，以及严格结论；写后 check-fact-integrity 外层 outcome=ok、领域结果 result.status=complete 且 scope.not_completed 为空。
