  summary: ExecutionAuthorization 新增 reviewer_policy tab 展示模型/Agent/首选方法/降级顺序/每轮视角上限/激活条件/同 AI 限制边界；ReviewMethodDisclosure 支持 collaboration-worker-read-only 并展示 actual_agent/actual_model；locales.ts 添加 collaboration-worker-read-only、preferred_method、reviewer_policy 等字段标签和值映射；缺失或 unknown 不默认显示为 unavailable，policy/quality gate 不显示为已实际独立复核。TypeScript 编译通过，58 个 Web 测试通过。
- criterion_id: criterion-5
  outcome: satisfied
