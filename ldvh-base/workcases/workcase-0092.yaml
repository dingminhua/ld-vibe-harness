title: Spark 部分责任移交与后继议题分流契约
status: open
phase: human_closure_confirming
plan_version: 2
priority: P1
summary: 本 WorkCase 返修 partial-successor routing 的关系级负例与 Web 展示边界；不扩展 Gate1 授权，不修改 update_application.py，不创建 successor、不更新 spark-0034。generic update formation enforcement 作为后续 WorkCase 缺口，当前只交付已授权文件范围内的可审查证据。
goal: 在不新增 Spark 状态或关系键的前提下，定义并实现合法的“已完成稳定事实 + 明确 residual scope 的 open successor Spark”共同承接契约，补齐 Core 关系校验、只读候选/对象读取审计边界与 Web 正式关系投影，形成未来处理 spark-0034 所需的可审查能力边界。
scope: 覆盖 specs/20-Spark-火花.md、specs/32-事实对象生命周期变更与承接处置行动模板.md；code/ldvh/facts/relations.py、code/tests/facts/test_relations.py、必要的 code/tests/facts/test_project_validation.py；web/api/routes/cognition.ts 与 web/tests/api/cognition-inbox-contract.test.ts（仅在正式关系命中时）。find-fact-object-candidates/read-fact-objects 只读审计；精确核对 spark-0034/workcase-0077，不修改任何事实对象。排除 successor 创建、spark-0034 更新、多对象原子写入、WorkCase 状态机、bootstrap/config writer、通用图重构、其它 Spark，以及 commit/push/PR/release/external。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: 20/32 一致定义共同承接、open successor 的明确 residual scope、同项目/title、自指/循环/Study 边界；successor 语义充分性由 AI 审核，Code 只做机械检查，目标后续生命周期不由源 Spark 跟踪。
- criterion_id: criterion-core
  statement: Core 校验与正反测试对新形成的 Spark routed-to 仅接受同项目、mechanically valid、非空 title 的 open Spark；既有目标后续合法生命周期不使关系失效；Study、跨项目、缺失/invalid、空 title、自指、循环被拒绝，既有非 Spark 与 WorkCase 路径保持。
- criterion_id: criterion-web
  statement: cognition 正式关系投影在命中时显示合法 successor 当前 title/status，不以 ID 代替 title；若只读确认该文件不承载正式关系，则保持不变并记录边界。
- criterion_id: criterion-regression
  statement: 范围目标测试与 git diff --check 通过；Helper 只读精确回读 spark-0034/workcase-0077；本 WorkCase 不产生 canonical fact write；全库 check-fact-integrity 只记录已有 partial/invalid baseline，不冒充本 WorkCase 成果或失败原因。
- criterion_id: criterion-nogo
  statement: 形成未来迁移 No-Go：无匹配 multi_object_disposition 原子能力时，不创建 successor、不更新源 Spark、不以多次单对象写入拼接整体分流成功。
work_items:
- item_id: item-contract
  goal: 修订 partial-successor routing 规则与多对象 No-Go 边界。
  expected_result: 20/32 形成一致关系、残余范围、目标生命周期与能力边界文本，不新增状态或关系键。
  status: completed
  result_summary: 20/32 已形成一致的 partial-successor routing 契约：open successor 的 residual scope、同项目与标题要求、自指/循环/Study 边界，以及无多对象原子能力时的 No-Go 已写入规则。
- item_id: item-core-validation
  goal: 更新 routed-to Core 校验与 Python 正反测试。
  expected_result: 合法 open successor 与非法目标场景被机械固定，既有路径回归。
  status: completed
  depends_on:
  - item-contract
  result_summary: Core 关系形成与后续生命周期边界已验证；Python facts/project 回归 59 passed，覆盖 open successor 形成、既有目标后续状态稳定性、自指/循环/Study/跨项目/invalid/空 title 与既有路径兼容。
- item_id: item-web-projection
  goal: 核对并按命中情况更新 cognition 正式关系投影及 contract test。
  expected_result: 投影诚实显示 successor title/status；不承载时形成 no-change 结论。
  status: completed
  depends_on:
  - item-core-validation
  result_summary: Web cognition 正式关系投影已核对并固定；contract test 19/19 passed，覆盖 routed Spark successor 当前 title/status 呈现，TypeScript check 通过。
- item_id: item-verification
  goal: 完成目标测试、差异检查、只读事实回读与 integrity 基线记录。
  expected_result: 据实记录测试、回读、已有 partial/invalid baseline 和未验证范围，不产生 canonical fact write。
  status: completed
  depends_on:
  - item-core-validation
  - item-web-projection
  result_summary: 最终验证完成：Python facts/project 59 passed；Web cognition contract 19 passed；TypeScript、Ruff、git diff --check 通过；check-fact-integrity 为 complete（206/206）；只读精确回读 spark-0034/workcase-0077/workcase-0092 均 mechanically_valid；未创建/更新 Spark、Study 或其它业务事实。
- item_id: item-core-review-remediation
  goal: 补齐已授权关系级 Spark routed-to 的缺失/invalid、自指、跨项目与循环负例，并据实区分 generic update 写路径缺口。
  expected_result: relations.py 与已列 Python tests 形成可独立核验的 Spark 专项负例覆盖；不修改 update_application.py，不把 generic write-path formation enforcement 写成已交付。
  status: completed
  depends_on:
  - item-core-validation
  result_summary: 已在授权 relations.py 与 Python tests 内补齐 Spark routed-to relation/project-level 负例：missing、invalid、自指、跨项目与循环；专项 relations 测试 40 passed。generic update_application.py 集成未修改，作为后续 WorkCase 缺口保留。
- item_id: item-web-fallback-remediation
  goal: 补齐已授权 cognition 正式 routed-to 投影的 objectId fallback 边界测试或在授权 Web 文件内收敛该回退。
  expected_result: 证明缺失/空 title 不以 objectId 伪装正式关系名称，或明确记录无法证明并将 criterion-web 降级；不写事实。
  status: completed
  depends_on:
  - item-web-projection
  result_summary: Web fallback 边界已收敛：projectRecentHotspotFact 对缺失或空 title 返回不可投影，禁止以 objectId 作为正式标题；新增负例后 cognition contract test 20 passed，TypeScript check 通过。
- item_id: item-reverification
  goal: 对返修后的授权范围重新验证并形成独立可核验的结果证据。
  expected_result: 重跑授权范围测试、Ruff、TypeScript、git diff --check 与 check-fact-integrity；结果中明确 Core generic update 缺口和未提交证据边界。
  status: completed
  depends_on:
  - item-core-review-remediation
  - item-web-fallback-remediation
  result_summary: 最终授权范围复核完成：Python 61 passed（含 Spark relation/project 负例）；Web cognition contract 20 passed；TypeScript、Ruff、git diff --check 通过；check-fact-integrity 为 complete（206/206）；精确回读 spark-0034/workcase-0077/workcase-0092 均 mechanically_valid。generic update_application.py 未修改，仍为后续缺口。
