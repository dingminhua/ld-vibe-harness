  expected_result: 一份覆盖 specs/03 9.4、05 11.0、05.Att.01、03.Att.01、signature.py、facts/validation.py、commits/validation.py、commits/contract_source.py、signature_guard.py、Helper observed_context 契约、Web signature.ts/git.ts/CommitSignatureMeta.tsx、各行动模板 21/30/31/32/33/34 的署名引用的差异清单，标注每个触点的现状，作为 CR-1 基线。
  status: completed
