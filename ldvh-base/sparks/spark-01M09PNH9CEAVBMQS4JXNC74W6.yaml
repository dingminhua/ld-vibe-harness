title: WorkCase 执行阶段两个设计缺口：item 状态更新易遗漏与阶段 Goal 未有效防中途停下
status: implemented
intent: Human 观察到两个重复出现的执行阶段问题：(1) 推进 WorkCase 时 item 状态（pending/in_progress/completed）容易被忘记更新，导致 WorkCase 的 work_items 不反映实际进展，而完整 fact_object 替代式写入不检测 item 状态是否已变，item_event 路径又太窄且只限 executing 阶段；(2) 虽已在 specs/31 和 specs/34 中定义了非持久化环境阶段 Goal 概念，但规范用「可」(may) 而非「必须」(must)，且无 Code 自动创建阶段 Goal，导致 Gate 1 获批后 AI 仍可在中途停下而不被阻止。需要系统分析两个缺口的设计遗漏并确定改进方向。
disposition_summary: 分析已完成，两个缺口改进方向已充分记录；无活跃 WorkCase 依赖本结论；两个缺口的具体改进应在有明确授权后由独立 WorkCase 承接；常用行为清单已交付并吸收交集部分。
summary: "## 当前状态\n\nLDVH 的 WorkCase 执行阶段经过多次迭代，已形成完整的状态机、item_event 事件路径和阶段 Goal 概念，但 Human 在实践中观察到两个反复出现的缺口：\n\n### 缺口一：item 状态更新易遗漏\n\n- `update-workcase` 有两条路径——完整 `fact_object`（默认）和 `item_event`（严格 XOR）。完整对象路径下，item 状态变化与「实际做了工作」完全解耦，AI 手工拼 after 时漏改 item 状态不会被机械校验发现。\n- `item_event` 路径（start-work-item / update-work-item-checkpoint / complete-work-item）只接受 `status=open, phase=executing`，缺 cancel/block/unblock 事件，且无「最后一个 item 完成时同事务自动进入 controller_checking」的投影——AI 仍需另发一次完整 after 来改 phase。\n- 机械校验只在「开始/解阻/直接完成前」检查 depends_on 目标为 completed，不阻止「应该 terminal 但仍 pending」的 item。\n- 34 5.2 的「开始控制点」「单项终结控制点」是行为规则，没有强制触发点，全部依赖 AI 自觉。\n\n### 缺口二：阶段 Goal 未有效防中途停下\n\n- specs/31 5.2.2 和 specs/34 5.2 定义了「非持久化环境阶段 Goal」概念，但均使用「Controller **可**建立一个」(may)，非必须。\n- 契约测试（test_environment_stage_goal_contract.py）明确测试 `create_goal`、`get_goal`、`update_goal` 等宿主 API 名**不在**规范中，保持「宿主中立」。结果是零 Code 在 Gate 1 获批后自动创建阶段 Goal。\n- 规范还写明「能力不可用、不可观察、存在冲突或调用失败时，保留该缺口并原样继续当前 LDVH 流程」，即 fail-open——不创建 Goal 也不影响推进。\n- Stop gate（workcase_stop.py, 09 5.8）是负向防御（机械拦截 Stop 事件），阶段 Goal 是正向引导（注意力续跑），两者完全解耦，没有联动。\n- 恢复机制（34 5.5）只恢复 WorkCase 事实，不恢复非持久化的阶段 Goal。\n\n## 处置说明\n\n分析已完成。两个缺口的改进方向已充分记录：\n\n- 缺口一：item_event 事件集扩展（cancel/block/unblock）、complete-work-item 后 auto phase transition、pending item 机械检测——均指向 specs/21/34 与 workcase_item_event.py 的范围变更，后续需独立立项。\n- 缺口二：stage Goal may→must、check-workcase-handoff 增加 Goal 存活字段、Stop gate 与 Goal 联动——均指向 specs/31/34 规范变更与宿主 API 能力声明变更，后续需独立立项。\n- 常用行为清单（study-01M09ZNYA8F3K8FW1VBDYTYXCB）已交付，与本 Spark 交集部分已吸收。\n- 项目中无活跃 WorkCase 依赖本 Spark 结论；两个缺口的具体改进应在有明确授权后由独立 WorkCase 承接。\n\n本 Spark 使命完成，关闭为 implemented。"
