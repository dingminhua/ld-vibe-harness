title: WorkCase Gate 1 授权完整性闭环
status: open
priority: P1
intent: 保留 WorkCase Gate 1 为什么会批准缺少独立结果复核与 Reviewer 委派授权的计划这一机制缺口，避免同类授权遗漏在实施完成后才因冻结基线而无法合法修复。后续需判断如何在不让 Code 伪造自然语言授权判断的前提下，使创建前独立方案复核、授权覆盖检查、Helper 校验与测试形成可验证的闭环；否则会增加后续定位、重复分析、返工和质量关口阻塞负担。
summary: "**已验证的缺口**\n\n- `workcase-0028` 的 `execution_authorization` 仅列出读取/测试、代码与测试修改、两次本地提交；没有独立结果复核或 Reviewer 委派。\n- 该对象仍被 Helper 判为 `mechanically_valid`，说明 Gate 1 前的受控创建未将这类遗漏拒绝为不合格。\n\n**机制原因**\n\n- 当前实现只校验授权动作的结构、非空文本、指纹和 Gate 1 后的不变性；不校验授权动作是否覆盖计划必经的独立结果复核或委派。\n- `creation_reviews` 只保存 Reviewer 的文本结论，未要求其提供“计划动作到授权动作”的覆盖判断，也无法由 Code 证明 Reviewer 的实际独立性。\n- Gate 1 后的基线冻结能够阻止事后补加授权，却无法阻止初始授权缺项，因此形成“可获批但不可继续”的阻塞。\n\n**当前方向**\n\n- Human 已选择最小可机械闭环：用有限、结构化的质量关口/Reviewer 模式表达已知必经授权；Helper 仅校验声明闭集与一致性，不解释授权散文是否充分。\n- 后续 WorkCase 还必须明确存量对象处置和独立 Reviewer 委派，使同一遗漏不会再次发生在 Gate 1 之前。\n\n**待判断的承接方向**\n\n- 应明确哪些授权完整性条件必须由创建前独立 Reviewer 作实际覆盖审核，哪些可由结构化字段、Helper 或负向测试机械检查。\n- 需要设计一个不会让 Code 擅自解释自然语言充分性、又能拒绝已知必经质量关口被遗漏的最小闭环。\n\n**边界**\n\n- 本 Spark 只记录授权完整性与创建前质量关口的机制缺口；不自动修改现有 WorkCase、不补造 Gate 1 授权，也不预先选择实现方案。"
