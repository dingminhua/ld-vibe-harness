title: LDVH 面向 AI 的服务质量评估与持续改进
status: implemented
intent: 建立一套能够持续评估和改进 LDVH 面向 AI 的服务能力与服务水平的机制，判断 LDVH 是否在正确时机向 AI 提供了正确、充分、最新、不过量且可直接行动的规则、事实、模板、能力与状态，并区分准备、可证明交付、宿主递达、行为一致性和因果效益等不同证据层级。若不跨行动保留这一目标，后续对规则读取、事实召回、渐进披露、Helper 能力与恢复机制的优化仍会主要依赖主观判断，难以定位服务缺口发生在哪一层，也难以确认调整是否真正改善 AI 的执行结果。
summary: "## 统一目标\n\n本 Spark 作为 LDVH 面向 AI 服务优化的唯一上位入口，统一承载两类相互依赖的问题：一是规则、事实、模板、状态与能力是否以正确、新鲜、不过量且可行动的方式交付；二是 Helper 读写交互候选是否在真实任务中产生足以支持继续改造的净价值。原「Helper 只读交互优化」和「受控写入优化」中已经明确的具体问题均已落实并收口；未来新的读写优化不再以两个常驻兜底 Spark 跟踪，而先由本 Spark 的证据门槛判断是否值得形成窄 WorkCase。\n\n## 已交付基础\n\n### 评估与证据\n\n- 最小执行证据协议和 DSH 会话可比性三值判定已经交付；评分前可以区分 comparable、not_comparable 与 inconclusive，但 host-received 在没有 provider 回执时仍为 unavailable。\n- 40 个固定模型会话的 Phase 1/Phase 2 对照已经完成：Phase 1 将只读任务中的 invalid-request 命中从 22 降到 0，但直接 Helper 调用数未下降，命令字符平均增加 151.1；WorkCase strict item_event 将窄任务 raw request 平均减少 1935.75 bytes，尚无显著请求有效率改善证据。\n- 12 对固定模型知识预检实验已经完成：冻结样本中 combined source-identity-plus-content package 的 selection_correct nominal difference 为 +0.666667，但来源身份、内容和指令不可分，六项质量指标未做 multiplicity adjustment，records-only source-complete reproduction 未满足，因此结果只到当前语料的 behavior-consistent 层级。\n\n### Helper 只读交互\n\n- invalid_request 结构化修正提示、行动模板成功响应去重以及 CLI --request、--example、--fields 已交付。\n- 当前没有证据支持对全部只读响应统一删减或继续增加孤立 flags；只有具体 operation 在可比较真实任务中出现稳定过量、额外回读或修复成本时，才形成范围匹配的候选。\n\n### 受控写入交互\n\n- WorkCase 关闭候选契约、read→update 最小桥接、行动模板 activation_hint、三字段署名/Git trailer 骨架和 WorkCase strict item_event 已交付。\n- prepare-fact-object-update 已正式成为 read-only、caller-completion-required 的 public operation：返回当前对象、fingerprint、排除 Code 托管字段的 whole-object after skeleton，并保持语义变化、fresh signature、完整校验、CAS、原子替换、精确回读和完整性审计由正式写入口承担。\n- Helper 是否应从同一 observed_context.signature 形成最新 change_log.signature，以及其它类型专属辅助，仍只是证据门槛后的候选；不得降低逐次重新观察、不可跨角色推导和 Git message 显式 footer 边界。\n\n## 已完成使命与收口说明\n\n本 Spark 的统一评估与证据门槛入口责任已结束：已收集的 40 会话对照、12 对知识预检、DSH 可比性判定和最小执行证据协议作为已交付基础保留；后续读/写交互优化分别由两个新 Spark 独立承接，不再经本入口统一证据门槛判断。\n\n本 Spark 收口不表示跨模型/宿主可比性、因果效应或 Helper 整体质量已建立。"
