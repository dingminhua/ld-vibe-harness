date: '2026-06-06'
context: |
  [Human Gate 确认记录: 确认人=用户, 确认时间=2026-06-06T00:22:10.893593, 确认上下文=用户确认创建 ADR-0006 论证 Task 评审机制设计]

  当前 LDVH Task 状态机中 review_needed 状态缺少实质审查定义：
  1. verifying 阶段仅做 acceptance 勾选的机械性审计，不涉及多维度评审
  2. review_needed → closed 不需要 Human Gate，审查形同虚设
  3. 没有定义评审维度（正确性、完整性、安全性、可维护性等）
  4. 没有专业知识视角机制（安全变更需安全视角、架构变更需架构视角）

  竞品参考：
  - Superpowers：两阶段审查（规格审查员 + 质量审查员），不同专业视角交叉验证
  - BMAD：七维度评审（完整性、一致性、可测试性、可行性、优先级、依赖、风险）
  - Gstack：/review Skill 的 AUTO-FIXED vs ASK 分类，按问题严重程度分流

  本 ADR 论证是否应为 review_needed 状态引入结构化评审维度和专业知识视角，以及如何与现有状态机和 Human Gate 机制整合。
decision: |
  为 Task 的 review_needed 状态引入结构化评审机制，包含三个层次：

  1. **评审维度定义**：Task 审查应覆盖以下维度（按 Task 类型选择性适用）
     - 正确性：产出物是否符合 acceptance 和 description
     - 完整性：是否遗漏了隐含需求或关联影响
     - 一致性：是否与现有规范、Rules、ADR 保持一致
     - 安全性：是否引入安全风险（涉及认证、权限、数据时必选）
     - 可维护性：代码或文档是否可被后续维护者理解
     - 性能：是否引入性能退化（涉及数据量、计算量时必选）

  2. **专业知识视角映射**：按 Task 涉及的领域自动识别需要的专业视角
     - 涉及 specs/ 或 Rules 变更 → 规范一致性视角
     - 涉及认证、权限、数据 → 安全视角
     - 涉及架构、跨模块 → 架构视角
     - 涉及 API 或工具 → 接口兼容性视角
     - 涉及 Web 前端 → 用户体验视角

  3. **review_needed 状态强化**：
     - review_needed → closed 增加 Human Gate 确认（修改 specs/27 关闭条件）
     - 审查时应至少覆盖 Task 类型对应的必选评审维度
     - 独立 agent 在 verifying 阶段除审计 acceptance 外，还应按评审维度生成审查摘要
     - 审查摘要进入 closure_evidence，作为关闭证据的一部分

  不引入独立 Review 工作模型。评审维度和视角作为 Task 规范的扩展规则，在 review_needed 阶段执行，
  不新增对象类型或状态。
consequences: |
  积极后果：
  - review_needed 状态从形式状态变为实质审查环节
  - Task 关闭前有结构化的质量保障，不再只依赖 acceptance 勾选
  - 专业知识视角确保不同领域的变更得到对应专业审查
  - 与竞品（Superpowers 两阶段审查、BMAD 七维度评审）对齐

  消极后果：
  - Task 关闭流程增加一步 Human Gate，关闭速度略降
  - 独立 agent 需要扩展审查能力，不只是检查 acceptance 勾选
  - 评审维度和视角映射需要维护，初期可能不够完善

  风险缓解：
  - 简单 Task（文档修改、配置调整）可只覆盖正确性和完整性两个必选维度
  - 评审维度按 Task 类型选择性适用，不是所有 Task 都做全维度审查
  - 初期先定义核心维度和视角，后续根据实践迭代补充
