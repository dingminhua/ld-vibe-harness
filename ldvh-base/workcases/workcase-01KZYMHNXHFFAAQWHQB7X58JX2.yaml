title: 规则精确读取任务族等价复验（WFPQDZ 延续）
goal: 以 session_comparability 模块的执行可比性判定为评分前门槛，在等价执行载体（同一模型、同一工具入口、同一 runner）下复验规则精确读取任务族（WFPQDZ 延续）：评分管线直接消费机器记录，每个任务与条件增加重复样本，先过 comparable 判定，再判断 required 缺失与 excluded 增加是否形成可重复且有实际幅度的差异。
scope: 复用 rule_read_contract.py 已冻结的 contract（SHA-256 1f4fc351…）、任务、rubric 与三变体协议，以及 trial_measurement.py 的 SafeTrialTempRoot 与通用测量设施；在 code/ldvh/testing 下新增等价复验 runner 与机器化评分模块及聚焦测试；集成 session_comparability 的可比性判定作为评分前门槛。排除：修改正式规则语义、行动模板、Helper 公共契约；建立健康分、遥测、Dashboard 或告警；Git commit、push、release；其他执行中 WorkCase 的事实文件和作用范围；上游 Spark 的任何写入；不保存原始会话/试次内容（只进受限临时根）。
success_criterion_definitions:
- criterion_id: criterion-carrier
  statement: 等价执行载体冻结并验证：复验使用同一模型、同一工具入口、同一 runner；每个试次的执行可比性经 session_comparability 判定为 comparable 后才进入评分，载体不一致标 not_comparable 且不进入比较。
- criterion_id: criterion-protocol
  statement: 复验沿用 WFPQDZ 冻结的 contract（指纹 1f4fc351…）、任务与 rubric，三变体（full_contract/required_removed/irrelevant_added）协议不变；执行记录机器化（结构化事件而非自然语言转述）。
- criterion_id: criterion-samples
  statement: 每个任务 × 条件至少 3 个重复样本（3 任务 × 3 变体 × ≥3 样本）；样本归属、载体指纹与可比性判定随机器记录保存。
- criterion_id: criterion-scoring
  statement: 评分管线直接消费机器记录（调用、响应、事件图、可比性判定），不依赖自然语言转述；评分一致性经独立复核或客观 rubric 检查。
- criterion_id: criterion-judgement
  statement: 先过执行可比性门槛再判断上下文效果：comparable 样本才进入 required 缺失/excluded 增加差异比较；样本不足或不可比时只报告不确定，不形成'有帮助/过量'结论；结果与 Study 一致区分证据层级，不写因果结论或总体服务改善证据。
work_items:
- item_id: item-runner
  goal: 实现等价复验 runner 与机器化执行记录
  expected_result: code/ldvh/testing 下新增 runner 模块：同一模型/工具入口/runner 执行冻结任务，输出结构化机器记录（调用、响应、事件图）
  status: pending
  approach_summary: 复用 trial_measurement.py 的 RunnerOwnedTrialAdapter 语义与 SafeTrialTempRoot；显式固定 provider/model 入口。
- item_id: item-gate
  goal: 集成 session_comparability 可比性门槛
  expected_result: 评分前对每个试次执行可比性判定，comparable 才进入评分；not_comparable 标出并排除
  status: pending
  depends_on:
  - item-runner
  approach_summary: 调用 session_comparability.audit_session/judge_comparability 包装为试次门槛。
- item_id: item-scoring
  goal: 实现机器化评分管线与聚焦测试
  expected_result: 评分模块直接消费机器记录输出 rubric 判定；聚焦测试 + 复用边界回归通过 + Ruff 通过
  status: pending
  depends_on:
  - item-gate
  approach_summary: 按 WFPQDZ rubric 客观判定；构造合成试次 fixture 测试。
- item_id: item-trials
  goal: 运行重复样本试跑并汇总
  expected_result: 3 任务 × 3 变体 × ≥3 样本试跑完成，汇总 comparable/not_comparable 分布与差异观察，结论不越证据层级
  status: pending
  depends_on:
  - item-scoring
  approach_summary: 固定同一模型/工具入口运行；临时根保存 raw，聚合后清理。
execution_authorization:
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-delegate-independent-result-review
    result_review_action_id: authorization-perform-independent-result-review
  authorized_actions:
  - action_id: authorization-write-runners
    summary: 在 code/ldvh/testing 与 code/tests/testing 下新增等价复验 runner/评分模块及聚焦测试
    target_scope: 仅新增代码文件及其直接依赖的既有测试设施
    effect_scope: workspace 代码文件写入，不涉及 ldvh-base/ 事实载体
    risk_summary: 低风险；只读分析模块
    rollback_summary: 删除新增文件即可回滚
    rule_refs:
    - specs/05-事实模型基础规范.md
  - action_id: authorization-run-trials
    summary: 以冻结的同一模型/工具入口/runner 运行重复样本试跑（受限临时根，raw 数据按隐私边界清理）
    target_scope: 临时根内试跑，不写事实
    effect_scope: 运行真实模型试跑，消耗当次配额
    risk_summary: 中风险：模型调用成本与执行载体一致性依赖固定入口
    rollback_summary: 停止试跑并清理临时根
    rule_refs:
    - specs/05-事实模型基础规范.md
    - specs/07-运行证据规范.md
  - action_id: authorization-run-tests
    summary: 运行 pytest 聚焦测试与复用边界回归、Ruff 检查
    target_scope: code/tests/testing 与 code/ldvh/testing
    effect_scope: 只读运行
    risk_summary: 低风险
    rollback_summary: 无副作用
    rule_refs:
    - specs/05-事实模型基础规范.md
  - action_id: authorization-delegate-independent-result-review
    summary: 委派只读独立结果复核（subagent）
    target_scope: 当次结果快照
    effect_scope: 只读委派
    risk_summary: 低风险
    rollback_summary: 无副作用
    rule_refs:
    - specs/21-WorkCase-工作项.md
  - action_id: authorization-perform-independent-result-review
    summary: 执行只读独立结果复核并形成 review 结论
    target_scope: 当次结果快照
    effect_scope: 只读复核
    risk_summary: 低风险
    rollback_summary: 无副作用
    rule_refs:
    - specs/21-WorkCase-工作项.md
  action_ceiling: 只授权上述新增代码文件、受限临时根试跑与测试运行；不授权 ldvh-base/ 事实写入、Git commit、push、release、Helper/规则/行动模板修改。
  prohibited_actions:
  - Git commit/push/release
  - ldvh-base/ 任何事实载体写入
  - 修改 specs/ 规则或行动模板
  - 创建健康分/遥测/Dashboard/告警
  - 长期保留 raw 试次内容（须按隐私边界清理）
  allowed_adjustments: item 内部调整实现细节、测试用例与样本数；不改变 scope、success criteria 或授权边界
  verification_and_rollback: 每 item 完成后运行 pytest + Ruff；失败据实记录不强制改写；新增文件可整体删除回滚；临时根按 SafeTrialTempRoot 清理
  out_of_bounds_handling: 任何超出授权边界的需求回到 Controller 据实记录，不扩权执行
  reviewer_policy:
    model: deepseek-v4-flash
    collaboration_agent: none（本环境未提供协作 Worker 载体）
    effort: standard
    fast: false
    preferred_method: subagent-read-only
    fallback_order:
    - subagent-read-only
    - same-ai-switched-role-read-only
    max_perspectives: 2
    activation: 协作 Worker 不在本环境路由链中（无可用协作 Worker 载体，preflight 不适用）；一次性只读 subagent 可用且 Human 已在创建前明确授权时解锁，用于 creation review 与 result review；subagent 不可用且有当前证据时降级
    same_ai_limit: 同一 AI fallback 只在协作 Worker 与 subagent 均不可用（本环境协作 Worker 不在路由链中）且满足 §4.5.1 约束、并有当前证据时启用，同时登记 capability_limitations
