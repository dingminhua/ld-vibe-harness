  summary: per-family 门槛全过：总体 trigger_correct 18/18、unnecessary_f2 0、正确激活率 6/6；ADR 漏检 0、正确激活 3/3；Pitfall per-family 6/6、unnecessary 0 → supports-family-differentiated-trigger。
