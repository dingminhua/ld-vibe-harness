title: Workflow 脚本作为行动模板的编排载体——与 LDVH 行动模板的映射与优化机会
status: open
priority: P2
intent: 当前 LDVH 有 5 个行动模板（fact-object-controlled-creation、fact-object-lifecycle-change、git-commit、workcase-approved-plan-execution、environment-integration-installation-verification），但每个模板在当前会话中均由 AI 逐步骤手动执行，缺乏"一键编排"手段。Claude Code 的 Workflow 工具支持用 JavaScript 脚本编排多个子 agent 并行/串行执行，且子 agent 可指定模型、隔离上下文。需要判断：Workflow 脚本能否映射为 LDVH 行动模板的执行载体？若能，应如何定义映射规则、授权边界和验证要求？以及是否值得新增一个"workflow-execution"模板或修订现有模板来吸收这种能力？
summary: "## 背景\n\n### LDVH 行动模板现状\n\n当前 5 个行动模板（06 声明）各自定义了标准化的行动结构，但执行方式全部是：AI 在当前会话中逐步骤手动操作，调用 Helper CLI、核对规则、写回事实、回读验证。没有一种机制可以把多个模板串联成一次原子化执行，也没有能力把模板的步骤分派给多个独立子 agent 并行执行。\n\n### Workflow 工具能力\n\nClaude Code 的 Workflow 工具（`Workflow` tool + `agent()`/`parallel()`/`pipeline()`/`phase()` 原语）支持：\n\n- 用 JavaScript 脚本编排多个子 agent（每个 agent 有独立上下文）\n- 并行执行（`parallel`）、流水线执行（`pipeline`）、分阶段执行（`phase`）\n- 指定子 agent 模型（sonnet/opus/haiku）和 effort 级别\n- 带 schema 约束的结构化输出（`agent(prompt, {schema: ...})`）\n- 子 agent 在隔离 worktree 中工作（`{isolation: 'worktree'}`）\n- 进度显示和中断恢复\n\n### 关键差距\n\n| 维度 | 当前行动模板 | Workflow 脚本 | 差距 |\n|---|---|---|---|\n| 执行者 | 单 AI 逐步骤 | 多子 agent 并行 | 模板未定义子 agent 委派边界 |\n| 串联 | 人工判断下一模板 | 脚本编排 | 模板未定义组合契约 |\n| 独立复核 | same-AI switched-role | 可启动只读 subagent | 模板可升级保证级别 |\n| 恢复 | 对话历史 | 稳定检查点 + journal | 模板可定义恢复入口 |\n| 验证 | 手动回读 | 子 agent + schema 约束 | 验证可自动化 |\n\n## 待判断的核心问题\n\n### 1. 映射可行性\n\nWorkflow 脚本能否作为行动模板的\"执行载体\"？即：\n\n- 模板定义\"做什么\"（适用条件、步骤、验证、交还）\n- Workflow 脚本定义\"怎么用多 agent 做\"（编排、并行、委派）\n\n现有 5 个模板各自可能对应什么 Workflow 模式？\n\n| 模板 | 可能的 Workflow 模式 |\n|---|---|\n| fact-object-controlled-creation | pipeline(candidates, agent(创建), agent(验证)) |\n| fact-object-lifecycle-change | parallel(agents(并行更新多个对象)) |\n| git-commit | 单 agent 执行（提交本质是线性操作） |\n| workcase-approved-plan-execution | parallel(items) → pipeline(结果, 复核, 关闭) |\n| environment-integration-installation-verification | parallel(4 项检查) → pipeline(修复, 验证) |\n\n### 2. 授权边界\n\nWorkflow 脚本中的子 agent 是否被视为\"独立 subagent\"？当前 spark-0065 记录了 WC-0066 自述\"无独立 subagent 能力\"与实际工具可用之间的矛盾。如果 Workflow 子 agent 被认定为独立 subagent，则：\n\n- 模板 31（事实对象创建）的 creation review 可由子 agent 完成，不再需要 same-AI switched-role fallback\n- 模板 34（WC 获批计划执行）的结果复核可委派给只读 Explore 子 agent\n- 需要明确：子 agent 的写入范围、授权继承关系、以及结果回收机制\n\n### 3. Workflow 脚本本身的管理\n\n- Workflow 脚本存放在哪里？ldvh-base/ 下的新目录？skills/ 下？还是独立的 workflow/ 目录？\n- 脚本是否应像事实对象一样受控创建和版本管理？\n- 脚本的更新是否需要经过类似规范的审核流程？\n- 脚本内容是否应被 Git 提交？\n\n### 4. 与现有模板的关系\n\n- 是否需要一个新模板 `workflow-execution`，定义\"用 Workflow 脚本执行行动模板\"的适用条件、输入、授权、验证和交还？\n- 还是修订现有 5 个模板，各自增加\"可被 Workflow 脚本编排\"的说明？\n- 06 行动模板基础规范是否需要更新，以允许模板定义\"可委派给子 agent 的步骤\"？\n\n### 5. 风险与限制\n\n- Workflow 工具是 Claude Code 专有能力，不是所有环境都有。LDVH 的行动模板应保持环境无关，还是为特定环境增加\"加速通道\"？\n- 子 agent 的推理成本更高（多个模型并行），需要评估是否值得。\n- 子 agent 可能做出与主控不一致的判断，需要回收和仲裁机制。\n- Workflow 脚本的调试比普通对话困难，journal 日志是主要恢复手段。\n\n## 边界\n\n- 只讨论 Workflow 工具与 LDVH 行动模板的映射关系，不讨论 Workflow 工具本身的实现原理\n- 不要求 LDVH 依赖 Claude Code 特定版本；如果方向有价值，可考虑抽象为环境无关的编排规范\n- 不改变现有 5 个模板的正文，直到方向判断明确\n- 与 spark-0009（Agent-first Harness 成熟度）有交集：如果 Workflow 脚本被采用，它是 spark-0009 中\"持续编排\"的实验候选\n- 与 spark-0065（subagent 能力矛盾）有交集：如果 Workflow 子 agent 被认定为独立 subagent，可支撑 spark-0065 的\"能力矛盾已解决\"结论\n\n## 参考\n\n- specs/06-行动模板基础规范.md（模板准入、共同结构、Helper 操作）\n- specs/30-Git提交行动模板.md\n- specs/31-事实对象判定与受控创建行动模板.md\n- specs/32-事实对象生命周期变更与承接处置行动模板.md\n- specs/33-环境接入行动模板.md\n- specs/34-WorkCase获批计划执行行动模板.md\n- spark-0009（Agent-first Harness 成熟度与持续编排）\n- spark-0065（WC0066 自述无独立 subagent 能力与运行环境实际具备 subagent 工具之间的矛盾）\n- 当前会话中 Workflow 工具的完整能力描述\n\n### 6. 跨 agent 可移植性限制（quoted session：Workflow 脚本是否适合所有 AI agent）\n\n经另一会话讨论确认：`Workflow` 脚本（`export const meta` + `agent()`/`parallel()`/`pipeline()` 等 JS 原语、后台任务机制）是 **Claude Code 专有接口**，不能直接搬到其它 AI agent。需作为本 Spark 的关键限制纳入判读。\n\n#### Workflow 适配性：适合 vs 不适合\n\n| 场景 | 结论 |\n|---|---|\n| 大规模并行扫描（审计、迁移、批量搜索） | ✅ 适合，`pipeline()`/`parallel()` 同时跑几十个 agent 互不阻塞 |\n| 需要确定性流程（先查→再改→后验证） | ✅ 适合，控制流是代码写死的，不会跑偏 |\n| 对抗性验证（报告/代码审查） | ✅ 适合，多个独立 agent 互相反驳过滤假阳性 |\n| 可量化目标（找 N 个 bug、覆盖度） | ✅ 适合，`loop-until-dry`/`budget` 循环直到收敛 |\n| 高度重复的机械任务 | ✅ 适合，同样 prompt 换不同输入，结果稳定 |\n| 单次简单问答 | ❌ 不合适，单 agent 即可，套脚本是杀鸡用牛刀 |\n| 开放式、需临场判断的对话（如\"项目怎么改进\"） | ❌ 不合适，更适合模型自由发挥或单 subagent |\n| 结果强依赖上下文语义衔接的任务 | ❌ 不合适，脚本 agent 间弱耦合，硬拆会丢失上下文 |\n| 需要人类实时介入决策的流程 | ❌ 不合适，脚本偏批处理，interactive 决策用普通对话更顺畅 |\n\n**关键判断标准**：只有当任务能描述成\"明确的步骤 + 每步的输入输出\"时，Workflow 才值得。任务本身模糊、需要探索时，用它反而框死发挥空间。\n\n#### 各 Agent 平台支持对比\n\n| Agent | 有类 Workflow 多代理编排吗 | 形态 |\n|---|---|---|\n| Claude Code | ✅ 有，`Workflow` JS 脚本 | 声明式脚本 + 后台并行 |\n| Codex (OpenAI) | ⚠️ 无此接口，但有 Agents SDK | Python 编排 worker |\n| Gemini CLI | ⚠️ 无 JS workflow，靠 CLI agent 子进程 + 手动并行 | 相对简单单代理 |\n| Pi (Inflection) | ❌ 非代码 agent | 纯对话，无工具调用/编排 |\n\n#### 跨 agent 复用结论\n\n- Workflow 脚本语法、`agent()`/`schema`/`budget` 原语、后台任务机制都**与 Claude Code harness 绑定死**，搬到 Codex 上不通用。\n- 若要在多个 agent 之间复用编排逻辑，**不能直接搬脚本**，需抽象到更高层——把\"任务拆解 + 每步验证\"写成平台无关的提示词模板或工具协议。\n- 本 Spark 中\"Workflow 作为行动模板执行载体\"的方向，因此本质上是 **Claude Code 环境专属的加速通道**；对 LDVH 而言，行动模板本体应保持环境无关，Workflow 编排只作为特定环境的执行编排，不应成为模板的强制依赖。\n\n\n### 7. Cindy Orca 协同：另一种多 Agent 执行载体\n\n经观察当前运行环境，Cindy 的 Orca 多 Agent 架构（Lead/Worker 模型）提供了另一种多 Agent 执行载体，与 Workflow 脚本有本质差异，需纳入本 Spark 的判读范围。\n\n#### Orca 核心模型\n\n| 维度 | Orca Lead/Worker | Workflow 子 agent |\n|---|---|---|\n| 会话性质 | Worker 是完整会话，独立模型、工具流、上下文和历史 | 子 agent 是轻量级任务上下文，非持久会话 |\n| 创建方式 | `create_worker`/`create_workers`（持久、UI 可见） | `agent()` 调用（一次性、用完即弃） |\n| 角色体系 | 可指定 role（developer/reviewer/tester/merger）、agent 类型（codex/claude-code/pi）、model、effort | 仅指定模型（sonnet/opus/haiku）和 effort，无固定角色闭集 |\n| 隔离粒度 | 每个 Worker 独立 session，互不干扰 | 子 agent 在父上下文内隔离，可选 isolation=worktree |\n| 生命周期 | 持久存在，可归档（`archive_worker`），可切换 focus | 一次性，返回结果即结束 |\n| 进度可见 | UI 级进度展示（`get_workspace_info`） | 后台进度树 + journal |\n| 通信机制 | Worker 通过 bridge 工具向 Lead 报告结果 | 脚本内 `agent()` 返回结果直接归集到主控 |\n\n#### 与 Workflow 脚本的互补关系\n\n- **Workflow 适合**：确定性编排、批量并行、流水线处理——子 agent 用完即弃，脚本控制流写死。\n- **Orca 适合**：需要持久 Worker 角色的场景（如长期运行的 Reviewer、Tester），Worker 可跨多次交互保持状态。\n- **重叠区**：两者都可做独立审核（Worker 天然是独立 session，Workflow 子 agent 也可指定隔离上下文）。\n\n#### 对 LDVH 行动模板的启发\n\n1. **独立审核的载体选择**：当前 spark-0061 和 feedback 记录中，用户要求独立审核必须由独立 subagent 执行。Orca Worker 天然满足\"独立 session\"要求，且可指定 role=reviewer、agent=claude-code、只读工具集。Workflow 子 agent 也可通过 isolation=worktree 实现隔离。两者都是独立审核的可行载体，但适用条件不同：\n   - Orca Worker：持久、UI 可见、可跨交互保持审核状态，适合长周期或多次审核\n   - Workflow 子 agent：轻量、一次性、编排在脚本中，适合自动化审核流水线\n\n2. **Worker 的授权边界**：与研究文档（cindy-ldvh-integration-study.md）一致——Worker 创建时不自动继承父会话的全部项目事实，也不自动获得父会话的行动授权。Workflow 子 agent 同样需要显式传递授权信息。\n\n3. **环境差异**：Orca 是 Cindy 专有能力，Workflow 是 Claude Code 专有能力。两者在当前环境中同时存在，但 LDVH 的行动模板应保持环境无关，不依赖任一种特定编排机制。\n\n#### 对比总结\n\n| 维度 | Workflow 脚本 | Cindy Orca |\n|---|---|---|\n| 所属平台 | Claude Code 专有 | Cindy 专有 |\n| 执行模型 | 确定性 JS 脚本编排 | Lead/Worker 完整会话 |\n| 适用场景 | 批量并行、流水线、对抗性验证 | 持久角色、长期 Worker、跨交互协作 |\n| 独立审核能力 | isolation=worktree 子 agent | 原生独立 session，role=reviewer |\n| 对 LDVH 的价值 | 行动模板的自动化执行载体 | 持久 Worker 作为独立审核/执行角色 |\n| 环境无关性 | ❌ 绑定 Claude Code | ❌ 绑定 Cindy |\n\n**结论**：两者都是环境专属的编排能力，不能成为 LDVH 行动模板的强制依赖。LDVH 应保持模板定义的环境无关性，同时允许在特定环境中选择最合适的编排载体——Claude Code 环境下用 Workflow 脚本，Cindy 环境下用 Orca Worker。\n"
