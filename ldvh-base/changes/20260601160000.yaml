type: change
title: 增加契约变更传播规则
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户识别到契约变更时需要联动更新 Tools 实现和测试，且需 Human Gate 确认。
  现有 specs/04 §7.4 只覆盖了契约与工具实现的"创建时关系"，
  缺少契约变更后的"传播规则"——即契约变更时消费该契约的 Tools 和测试必须同步更新。
  specs/12.01 §九 只覆盖了 Tools 自身变更时同步测试，未覆盖上游契约变更触发的同步。
  specs/21.06 §六 和 specs/21.04 §七 缺少契约变更传播的具体声明和检查项。
decision: |
  1. 在 specs/04 §7.4 增加第 3、4 条：契约变更时 Tools 和测试必须同步更新；契约变更未经 Human Gate 不得执行同步；同步完成前 Tools 校验结果不得视为可靠。
  2. 在 specs/04 §九 Human Gate 增加第 7 条：契约变更后未同步更新 Tools 和测试。
  3. 在 specs/04 §十 检查项增加第 11、12 条：契约变更后 Tools 和测试是否同步更新；契约变更是否经 Human Gate 后才执行同步。
  4. 在 specs/12.01 §九 增加第 2 条：消费契约子文档的 Tools 在契约变更时必须同步更新（引用 04 §7.4）。
  5. 在 specs/21.06 §六 增加第 6 条：本文契约变更时消费本文的 Tools 和测试必须同步更新（引用 04 §7.4）。
  6. 在 specs/21.04 §七 检查项增加第 7 条：契约子文档变更后 ADR Tools 和测试是否同步更新（引用 04 §7.4）。
consequences: |
  - 契约变更传播规则成为 LDVH 所有规范模型的通用规则，不仅限于 ADR。
  - 下游规范（21.06、21.04 等）只需引用 04 §7.4，不需复制规则正文。
  - 契约变更后未同步更新 Tools 和测试将触发 Human Gate 警告。
affects:
  - specs/04-LDVH模型子文档规范.md
  - specs/12.01-Tools辅助规范.md
  - specs/21.06-Contract.md
  - specs/21.04-Tools.md
related_rules:
  - specs/04-LDVH模型子文档规范.md
  - specs/12.01-Tools辅助规范.md
human_gate:
  required: true
  confirmed_by: user
  confirmation_context: 用户确认契约变更必须联动更新 Tools 和测试，且需 Human Gate 确认。
validation: |
  1. 已检查 specs/04 §7.4 包含 4 条规则，覆盖创建时和变更时关系。
  2. 已检查 specs/04 §九 Human Gate 包含 7 条。
  3. 已检查 specs/04 §十 检查项包含 12 条。
  4. 已检查 specs/12.01 §九 序号连续 1-11。
  5. 已检查 specs/21.06 §六 包含 6 条契约消费声明。
  6. 已检查 specs/21.04 §七 检查项包含 7 条。
