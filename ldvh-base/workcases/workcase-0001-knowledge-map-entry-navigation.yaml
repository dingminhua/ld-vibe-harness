id: workcase-0001
type: workcase
title: 知识地图入口导航能力产品化
goal: |
  将 LDVH 知识地图从“节点/边只读投影”推进为入口级任务导航能力，使它承担“在什么情况读什么文件”的主要责任，并在能力可验证后瘦身 Rules 入口中的静态读 specs 清单。
status: closed
created: '2026-06-24T07:42:18.318860'
updated: '2026-06-24T08:30:00+08:00'
priority: P1
description: |
  当前 Rules 入口已经强调知识地图任务导航，但仍保留大量静态场景路由、必读 specs 清单和维护检查清单。多视角审查一致认为：知识地图不应替代 specs 原文，也不应替代 Rules 的入口启动、STOP 和降级职责；但它应该替代 Rules 里大量“场景 X 读文件 A/B/C”的手写读取路线表。

  本 WorkCase 以“先增强知识地图，再瘦 Rules”为推进主线：先在 04/04.Att.06 等规范中定义 read_plan / navigation 等输出契约，再实现 Code 侧任务导航能力，最后用 active 30 执行 Rules 同步审查并收缩 Rules 入口信息量。
success_criteria: |
  - [x] 04 和 04.Att.06 明确知识地图入口导航输出契约，至少覆盖 navigation、read_plan、next_queries、stop_conditions 和 impact_summary。
  - [x] knowledge-map Code 入口能在入口场景输出可执行读取计划，包含路径、优先级、角色、原因、来源关系、建议章节和来源回指。
  - [x] 支持适合入口导航的输入范围或等价能力，使 Rules 入口和 active specs 能在同一任务视图中被消费。
  - [x] knowledge-map 文本输出不再只有节点/边计数，而能展示可行动的读取计划摘要。
  - [x] Rules 入口被瘦身为启动器、start-node 选择、task-type 选择、STOP、降级、交接和权威优先级，不再维护大段正常路径下的静态 specs 读取清单。
  - [x] 30 完成 Rules 同步审查，确认删除或收缩的入口信息已由知识地图导航字段承接。
  - [x] 通过 Code 测试、active specs 综合检查、固定运行时扩展登记检查和工作对象事实源校验。
source: |
  用户在 2026-06-24 要求将“知识地图到底承担什么责任、入口信息是否可以被知识地图替代、知识地图应渐进式告诉 AI 什么情况读什么文件”的讨论创建为 WorkCase 并继续推进。

  本 WorkCase 吸收了主控 AI 与四个子 Agent / 独立视角的只读审查结论：知识地图应承担任务导航中枢职责，Rules 应作为 bootloader 保留入口启动、STOP、降级和交接，specs 原文仍为最终裁决源。
orchestration:
  mode: sequential
  execution_items:
