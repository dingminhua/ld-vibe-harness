    target_scope: 仅 specs/05-事实模型基础规范.md、specs/30-AI 行动协议.md、specs/31-事实对象判定与受控创建行动模板.md、specs/32-事实对象生命周期变更与承接处置行动模板.md；code/ldvh/facts/candidate_discovery.py；code/ldvh/helper/operations/fact_operation_support.py、fact_integrity_operation.py、fact_integrity_request.py、fact_candidate_operation.py、fact_candidate_request.py、commit_precheck_operation.py、commit_precheck_request.py；code/tests/helper/test_fact_candidate_operation.py、test_fact_creation_operation.py、test_fact_update_operation.py、test_fact_integrity_operation.py、test_commit_precheck_operation.py 与 code/tests/testing/test_fact_integrity.py。
