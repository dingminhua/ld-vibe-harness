description: |
  统一 21-27 七个工作模型主规范的章节骨架，从当前 14-16 个章节压缩为 9 个；
  将跨对象重复的通用规则上提到 07-工作模型基础规范.md；
  同步修改 03-文档规范.md 为 20-39 区段定义专用骨架豁免；
  同步修改 20-工作模型集合索引.md 的组成描述。

  新骨架：
  §1 对象定位与准入条件（含范围声明，原§1+§3合并）
  §2 事实源边界
  §3 状态机
  §4 与其他对象的关系
  §5 Human Gate
  §6 字段契约
  §7 事实源回写与证据留存（通用规则引用07，只写对象特有差异）
  §8 适配规则
    §8.1 AI 协作（通用规则引用07，只写对象特有差异）
    §8.2 Tools 辅助（通用规则引用07，只写对象特有差异）
    §8.3 Web 信息同步（通用规则引用07，只写对象特有差异）
  §9 待补齐事项

  删除的章节：
  - §1"本文解决的问题"（合并到§1对象定位与准入条件的范围声明）
  - §2"与07的关系"（改为头部元数据上位依据声明）
  - §14"机制适配边界"（历史声明删除，Intent版实质规则合并到§8适配规则）

  上提到07的通用规则：
  - 回写通用：创建/更新对象时应记录Change、回写不绕过HG
  - 证据通用：证据应可追溯到Git事实源、不得仅存在于对话历史或工具缓存
  - AI协作通用：读取时应从Git事实源获取、不得依赖聊天记忆/缓存/Web派生
  - Tools辅助通用：解析依据字段契约、只读查询不自动成为执行依据、聚合输出属于派生视图、不得自行判断准入/生成授权/替代流程判断
  - Web同步通用：必须可追溯到Git事实源、不得维护与事实源不一致的权威状态
