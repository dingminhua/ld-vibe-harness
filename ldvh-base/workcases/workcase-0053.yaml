title: 确立 change_log 与提交署名的取值约定及注入责任
goal: 将 spark-0051 承接的议题落地：确立 change_log signature（agent_id / host_environment）与 Git 提交署名（Agent-ID / Host-Environment trailer）的取值约定与注入责任，使责任记录可比较、可审计、跨会话一致。约定内容：agent_id=实际驱动模型/Agent 身份（如 Deepseek-V4-Flash、codex），host_environment=工作环境/宿主工具（如 workbuddy、Codex Desktop），提交 trailer 与同事务 change_log 条目对齐；注入责任由平台/执行会话按实际运行环境自动注入，AI 不手填。全程经来源定义与 Helper 受控路径修改规范/Code/tests，不绕过 Helper 直接写受管事实，不回溯改写既有历史 change_log，不执行 Git 提交。
