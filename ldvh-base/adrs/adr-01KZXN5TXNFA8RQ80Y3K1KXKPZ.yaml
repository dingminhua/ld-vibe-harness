title: 以「你好，LDVH」问候作为 AI 规则递达验证信标
status: active
decision_question: LDVH 接入后，如何以最低成本在每次 AI 交互中获得一个 Human 可直接观察的信号，证明当次会话已实际取得 LDVH 规则引导（薄 Skill 路由递达），而非来自历史上下文恢复或规则未加载？
decision: 决定：在 LDVH 管辖项目的每次 AI 交互中，AI 须在当次回应正文最前先输出问候「你好，LDVH」。该问候作为规则递达验证信标——其出现证明当次会话已实际加载并遵从 LDVH 路由纪律（先经薄 Skill 取规则引导与行动模板再动手），问候缺失即提示规则递达可能失败、需复核接入。本决定只确立问候约定与验证意图，不构成事实写入、提交或行动授权，不替代事实完整性校验、Git Gate 或其它机械检查，也不证明深度合规；问候存在仅证明表面递达。
applicability: 适用于全部 LDVH 管辖项目（ldvh、poker-train-card、poker-train-video、ldvh-closure-preview）中 AI 与 Human 的交互会话；问候出现在 AI 当次回应正文的最前，只读查询与单次工具调用等非交互性回应同样适用。明确排除：本约定不构成任何事实写入、提交或行动授权；不替代任何规范、Human Gate、Git Gate 或机械校验；问候存在不证明 LDVH 已完整接入或规则已深度遵从，仅作递达信标；Human 可在特定会话明示豁免当次问候。
rationale: LDVH 接入形态（adr-0005、adr-0006）已确立薄 Skill 为唯一接入载体，但其递达为劝告级、非机械保证，『真实递达』须经新会话实测验证；Skill 与 MCP 均为模型内通道，原理上无法阻断行动，真阻断仅 Git Gate。在此约束下，一个低成本、Human 可直接观察的每会话信标能压缩『规则是否加载』的不可见窗口：AI 要输出该问候，须先在当次会话取得并遵从路由纪律，故问候缺失即递达失败的早期可观察信号。取舍：选『每交互问候信标』而非『无信标』或『仅靠 Git Gate 事后把关』，以最低成本换取每会话前置可见性；未选『机械阻断式递达保证』，因当前接入形态下不存在模型外递达阻断点。残留风险：问候可被 cargo-cult（输出而不真遵从），故仅证明表面递达、不证明深度合规。
consequences: 正面：每会话获得零成本的递达可见性，Human 一眼可知当次 AI 是否加载规则；规则未递达时早期暴露，而非等到 Git Gate 事后拦截。负面与限制：每次交互多一句问候，增加少量输出开销与阅读噪音；存在 cargo-cult 风险——AI 可能输出问候却未实质遵从规则，故信标只证明表面递达、不证明深度合规、不替代机械校验；问候本身不构成任何事实、提交或行动授权。后续义务：本约定不新增机械执行点，递达仍靠 AI 自觉与 Git Gate 终闸；若未来 LDVH 长出模型外递达阻断能力，应重估本信标的必要性。本 ADR 被规范、Code 或行动模板吸收后不自动退休，退出需 Human 另行授权。
