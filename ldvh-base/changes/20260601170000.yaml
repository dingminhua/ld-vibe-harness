type: change
title: 建立 Skill Tools Contract 与需求变更联动规则
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户指出 Skill 创建需要与 Tools 联动，否则 Skill 不知道可用 Tools 能力，Tools 也不知道应提供哪些能力。
  用户进一步要求 Contract 或需求变更时必须同步更新相关规范、Tools 实现和 Tools 测试，并在完成后进行检查。
  经检查，LDVH 已有模型子文档体系：NN.02-Skill.md、NN.04-Tools.md、NN.06-Contract.md，但缺少通用的显式消费关系、需求变更同步和 Tools 测试同步规则。
decision: |
  在 `specs/04-LDVH模型子文档规范.md` 新增 Skill、Tools、Contract 与需求变更联动规则，定义显式消费关系、Contract 与需求变更同步、Tools 测试同步和落地初始化检查。
  在 `specs/13-LDVH事实模型基础规范.md` 和 `specs/14-LDVH行动模型基础规范.md` 中引用 04 的联动规则，纳入落地初始化和完整方案形成流程。
  在 `specs/11.02-Skill机制规范.md` 中补充 Skill 创建和检查时对 Tools、Contract、需求变更和测试同步的检查要求。
  在 `specs/12.01-Tools辅助规范.md` 中补充 Tools 能力对消费场景、Contract 依据、需求变更同步和测试同步的检查要求。
consequences: |
  - 模型实践子文档在落地初始化时必须检查 Skill、Tools、Web 和 Contract 的显式消费关系。
  - Contract、需求变更或 Tools 实现变更影响 Tools 行为时，必须同步更新 Tools 实现和测试。
  - Tools 测试未执行或未通过时，不得声称 Tools 能力已完成落地、验收通过或可作为 Skill / Web 的可靠依赖。
  - 本次变更改变模型子文档联动规则和 Skill / Tools 检查要求，已按用户确认执行。
affects:
  - specs/04-LDVH模型子文档规范.md
  - specs/13-LDVH事实模型基础规范.md
  - specs/14-LDVH行动模型基础规范.md
  - specs/11.02-Skill机制规范.md
  - specs/12.01-Tools辅助规范.md
related_rules:
  - specs/00-LD-Vibe-Harness理念与纲要.md
  - specs/04-LDVH模型子文档规范.md
  - specs/11.02-Skill机制规范.md
  - specs/12.01-Tools辅助规范.md
  - specs/13-LDVH事实模型基础规范.md
  - specs/14-LDVH行动模型基础规范.md
human_gate:
  required: true
  confirmed_by: user
  confirmation_context: 用户要求全面细致落实 Skill、Tools、Contract、需求变更和 Tools 测试同步规则，并要求完成后检查。
validation: |
  1. 已在 `specs/04-LDVH模型子文档规范.md` 新增 Skill、Tools、Contract 与需求变更联动规则。
  2. 已在 `specs/13-LDVH事实模型基础规范.md` 和 `specs/14-LDVH行动模型基础规范.md` 接入 04 §八联动检查。
  3. 已在 `specs/11.02-Skill机制规范.md` 补充 Skill 侧联动检查。
  4. 已在 `specs/12.01-Tools辅助规范.md` 补充 Tools 侧联动检查和测试同步要求。
  5. 已执行后续一致性检查，检查结果见本次对话总结。
