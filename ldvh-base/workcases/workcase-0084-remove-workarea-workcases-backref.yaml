id: workcase-0084
type: workcase
title: 取消 WorkArea workcases 反向维护字段
goal: 取消 WorkArea 中需要手写维护的 workcases 字段，改为由 WorkCase.workarea 作为唯一归属事实源并由 Code/Web 反向聚合。
status: result_self_checking
created: '2026-06-21T09:23:58+08:00'
updated: '2026-06-21T09:29:30+08:00'
workarea: workarea-0012
priority: P1
description: |
  当前 WorkArea 规范和事实实例要求维护 `workcases` 字段，同时每个 WorkCase 又必须维护 `workarea` 字段。这造成同一归属事实被双向写入，增加同步成本，也会产生反向引用缺失或不一致的诊断噪声。

  本 WorkCase 将 WorkCase 的 `workarea` 字段确认为唯一权威归属事实源；WorkArea 下有哪些 WorkCase 由 Code/Web 扫描 `ldvh-base/workcases/` 后按 `workarea` 反向聚合。WorkArea YAML 不再维护 `workcases` 字段。
success_criteria: |
  - [x] WorkArea 规范明确 `workcases` 不再作为事实源字段，WorkArea 下的 WorkCase 列表由 `WorkCase.workarea` 派生
  - [x] WorkCase 规范明确 `workarea` 是工作项归属 WorkArea 的唯一权威字段
  - [x] 字段注册表把 `workarea.workcases` 标记为废弃或移出 active 字段语义，并说明替代派生方式
  - [x] Code 校验不再要求 WorkArea 维护 `workcases`，并能拦截新写入的 `workcases` 字段
  - [x] fact_cli 新建 WorkArea 不再生成 `workcases`
  - [x] 现有 WorkArea 事实实例清理 `workcases` 字段
  - [x] Web 继续从 WorkCase 集合反向聚合 WorkArea 下的工作项，不依赖 WorkArea YAML 的 `workcases`
  - [x] 相关验证命令执行并记录结果
source: |
  用户先质疑 WorkArea 是否有属性记录内部有哪些 WorkCase；主控查阅规范后确认当前存在 `workcases` 双向维护字段。用户随后判断该字段没有必要，查询时直接让 Code 从 WorkCase 集合聚合即可，并要求“了解workcase，建立一个workcase，推进此事”。

  Human Gate 记录：
  - 触发原因：创建 WorkCase 并推进工作模型字段契约变更。
  - 影响范围：WorkArea 规范、WorkCase 规范、字段注册表、fact_cli、fact_validate、WorkArea 事实实例和 Web 派生展示。
  - 确认依据：用户明确要求建立 WorkCase 并推进此事。
  - Human 决策：允许创建本 WorkCase，并在本轮推进取消 `WorkArea.workcases` 双向维护字段。
  - 执行约束：以 `WorkCase.workarea` 为唯一权威归属字段；Web/Code 只做反向聚合，不引入新的第二事实源。
