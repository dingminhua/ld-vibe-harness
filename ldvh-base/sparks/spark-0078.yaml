title: 多项目聚合信息与跨项目联动方向
intent: 保留 LDVH 在项目数量和跨项目协作需求增长后，是否需要提供多项目信息聚合、明确身份下的跨项目导航与有限联动能力这一未来方向，以便届时基于真实使用场景判断产品价值、隔离边界和实现层级；若不跨行动保留，相关需求会反复散落在 Web、Helper、配置与 Git 接入讨论中，增加重新定位、边界分析、分流和复核成本。
status: open
priority: P2
