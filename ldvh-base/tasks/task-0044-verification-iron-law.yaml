description: |
  借鉴 Superpowers 验证铁律，在 LDVH Task 规范中引入验证纪律：
  1. 每个 Task 必须有 verification 字段描述具体验证方式
  2. Task 关闭时 closure_evidence 必须引用验证结果
  3. 验证方式包括：手动测试、自动测试、代码审查、规范校验等
  此任务涉及 Task 模型字段变更，需先产出 ADR 再修订规范。
