summary: specs 00-03 自身规范合规性检查后的引用纪律修正与骨架补齐
reason: >
  对 specs/00-03 四份文档进行自身规范合规性检查，发现三类引用纪律违反
  （Human Gate AI 程序规则四处重复、evals/refs 编号与效力规则在 01 和 03
  重复、模型实践子文档内容边界规则在 02 和 03 重复），以及头部字段命名
  不一致、术语裸用和待补齐事项重复等问题。按引用纪律"权威唯一"原则
  修正为引用权威来源，并在 03 §5.1 补充 00 总纲豁免规则。
changed_files:
  - specs/00-LD-Vibe-Harness理念与纲要.md
  - specs/01-LDVH目录说明.md
  - specs/02-LDVH术语规范.md
  - specs/03-Specs文档规范.md
verification: >
  1. 01/02/03 Human Gate AI 程序规则已改为引用 00 §七；
  2. 03 §4.5/§4.6 evals/refs 编号与效力规则已改为引用 01 §3.3.1/§3.3.2；
  3. 02 §7 模型实践子文档内容边界规则已改为引用 03 §4.3；
