id: adr-0004
type: adr
title: 先完善机制或测试再修复问题
status: active
created: '2026-06-03T00:00:00'
updated: '2026-06-03T00:00:00'
date: '2026-06-03'
context: |-
  当前修复 bug 或代码问题时，AI 可能直接修改代码而不先补充测试或完善机制，导致修复缺乏回归保护、相同问题可能重复出现、修复方案未经人类审查就执行。
  [Human Gate 确认记录: 确认人=user, 确认时间=2026-06-03, 确认上下文=用户确认创建 ADR 0004，补充修复后确认过程]
  [Human Gate 确认记录: 确认人=user, 确认时间=2026-06-03, 确认上下文=用户确认接受 adr-0004 决策：先完善机制或测试再修复问题]
decision: 1) 修复 bug 或代码问题前，应先补充或完善对应的测试用例或机制保障，确保修复有回归保护；2) 修复方案需经 Human Gate 确认后才执行，不得自行直接修改；3) 修复完成后应运行相关测试验证；4) 修复验证通过后，需经 Human Gate 确认修复结果，确认后才算完成。
consequences: |
  ## 正向价值

  - 服务 V5 门禁识别：修复方案需经 Human Gate 确认后才执行，避免 AI 擅自修改高影响代码。
  - 服务 V6 强制验证：修复完成后必须运行相关测试验证，不能只凭自述判断完成。
  - 服务 V7 证据沉淀：测试或机制保障让相同问题有可追溯的回归保护。

  ## 逆向价值

  - 逆向削弱 V4 稳定执行的轻量性：对低风险小修复也会增加流程摩擦，修复速度可能下降。

  ## 实施成本

  - 所有 bug 修复和代码问题修改都会增加补测试、补机制、等待确认和运行验证的前置工作量。

  ## 风险评估

  - 如果测试目标定义不清，AI 可能为了满足形式要求补出低价值测试。

  ## 注意事项

  - 修复前由 Human Gate 确认方案和影响范围。
  - 修复后以测试结果、机制保障和 Human 确认共同判断完成。
