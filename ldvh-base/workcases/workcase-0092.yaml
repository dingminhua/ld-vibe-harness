  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-review-delegation
    result_review_action_id: authorization-result-review
  action_ceiling: 仅允许列明规则、代码、测试、只读 Helper 与两个固定 review 位置；事实写入恒为空，不扩展为 successor 创建、spark-0034 更正或 multi_object_disposition 实现。
  reviewer_policy:
    model: gpt-5.6-sol
    collaboration_agent: native-subagent
    effort: medium
    fast: false
    preferred_method: subagent-read-only
    fallback_order:
    - subagent-read-only
    max_perspectives: 1
    activation: native subagent 可用且仅承担只读 creation/PlanΔ/result review
    same_ai_limit: 禁止降级到 same-AI；能力/权限不成立时停止对应 review。
  allowed_adjustments: 只允许细化直接命中文件或 item 顺序；不得扩大对象、状态、关系键、事实写入或多对象能力。
  verification_and_rollback: 稳定检查点逐文件审 diff、运行目标测试与 check-fact-integrity；事实写入恒不发生。失败或 baseline partial 据实记录，无法区分本 WC 增量则停止。
  out_of_bounds_handling: 发现 successor 创建、spark-0034 更新、其它事实、多对象原子操作、提交/发布/外部消息或覆盖 dirty 时立即停止相关动作，交未来新 WC，不扩权。
  prohibited_actions:
  - 不得创建或更新任何 canonical fact；不得创建 successor 或更正 spark-0034。
  - 不得新增 Spark status/relation key、修改 WorkCase 状态机或实现 multi_object_disposition。
  - 不得 commit、push、PR、release、部署、安装依赖或外部消息。
  - 不得清理、覆盖、stage、restore 或回退无关 dirty changes。
  - 不得将已有 partial/invalid integrity baseline 改写为本 WC 成果、失败或已闭环。
  human_prerequisites:
  - Human Gate 1 必须在任何规则/代码/测试修改前批准 plan_version=1 与完整 execution_authorization.
