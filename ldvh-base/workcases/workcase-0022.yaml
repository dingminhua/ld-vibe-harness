  action_ceiling: 仅上述六类授权动作；测试限受影响目录，不做全量；不新增 console 入口、不改 pyproject；单次运行内 goal/scope/criteria 与授权基线冻结。
  prohibited_actions:
  - 全库扫描进入提交链路
  - 把全量测试当作默认验证要求
  - 远端交互（fetch/push/PR/发布）
  - 修改 specs/08 及其附件、web/*、docs/ 并行会话文件
  - 修改 adr-0006 本文
  - 静默修复校验暴露的既有事实合规问题
  - 实现远端刷新型 ID 冲突 Gate
  - 承接 spark-0039 其余待办项
  allowed_adjustments: 基线内可调整实现方法、测试组织、操作命名、字段措辞、item 内步骤顺序、重试与重新委派；PlanΔ 需 fresh 独立复核并按 §6.5 升版；不得改 goal/scope/criteria/动作上限/风险接受/禁止项。
  verification_and_rollback: 验证声明按候选范围适度（分寸约束）：item 局部验证材料加受影响测试集通过为准；事实写回经受控通道写后回读；Code 与规范 git 回滚、事实以更正操作回退。
  out_of_bounds_handling: 不执行超界动作、不请求第三次确认；据实取消受影响 item 并保留已形成事实；全部 terminal 后按结果链安全收敛。
