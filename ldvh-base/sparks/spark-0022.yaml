  summary: workcase-0022 item-05 归属评估结论：本 Spark 保持 open 另立，workcase-0022 不吸收。评估过程与理由：①问题性质不同——workcase-0022 交付的是本地机械完整性（03 §9.9 暂存事实候选同核校验与 check-fact-integrity 全库扫描），本 Spark 要的是远端 ref 新鲜度证明与 Index 事实对象身份同远端树全局比对，属多人多副本下的跨副本时序问题；②依赖未就位——远端交互在 workcase-0022 禁止项内（03 §12 Human Gate 第 5 项），远端树观察边界尚不存在，纳入会越出该 WorkCase 授权范围；③互补关系——§9.9 的触发分类与 object_id 解析、check-fact-integrity 的全库扫描面，是本 Spark 未来实现应复用而非重建的本地部件。后续在远端观察边界就绪后另行立项推进。
