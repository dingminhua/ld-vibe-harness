description: |
  在 Task 拆解规范中明确测试 Task 的位置和时机。当前 LDVH 的 Task 拆解没有强制要求包含测试 Task，
  借鉴竞品调研结论，应在 Task 规范中补充：
  1. acceptance 必须包含可测试的原子条件
  2. 复杂 Task（涉及代码变更）应拆出独立的验证子任务
  3. 验证子任务的 blocked_by 指向开发子任务，确保开发完成后才验证
source: 竞品调研报告 docs/sources/06 建议1
