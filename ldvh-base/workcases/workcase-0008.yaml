    passed：native_environment_and_console、junction_rejection、symlink_rejection、lock_kill_recovery、file_only_atomic_boundaries、git_linked_worktree_temp_index、drive_case_alias、unc_fail_closed。
- criterion_id: criterion-02
  statement: core-readonly 阶段 public_write_fail_closed 探针 passed：未经 Human 授权的公开
    create/update 在真实 Windows 上不可用且没有任何副作用（fail-closed）。
- criterion_id: criterion-03
  statement: 证据由 tools/verify_native_windows.py 产出并落盘于源码树外固定 NTFS 卷；source_root
    为干净 Git worktree，core-summary.json 等产物可被独立回读，且明确标注
    contract=ldvh-native-windows-verification/1。
- criterion_id: criterion-04
  statement: 结果如实记录未验证范围：core-full 写耐久性 Human Gate 未接受、adapter-handoff
    未执行，不在本案中声明为通过或失败；只读/策略证据不被扩大为写能力验收。
