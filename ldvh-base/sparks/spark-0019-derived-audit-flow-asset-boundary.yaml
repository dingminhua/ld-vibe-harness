id: spark-0019
type: spark
title: 40/41 派生型审核流程与能力资产边界待收敛
status: pending
created: '2026-06-20T09:56:56+08:00'
updated: '2026-06-21T05:12:21+08:00'
description: |
  本 Spark 承载一个需要后续收敛的架构边界问题：`specs/40-workflow-design-audit-工作流程设计审核.md`、`specs/41-work-model-audit-工作模型审核.md` 这类审核流程，是否应继续作为厚重的 `specs/40-59` 具体工作流程主文件存在，还是应改为由正式规范派生出的 LDVH 固定能力资产、极薄流程入口或 Code/Skill/Web 执行能力。

  当前讨论认知：

  1. 40/41 这类审核流程并不完全像普通业务行动流程；它们很大一部分内容来自既有正式规范的组合、读取顺序和执行转换。
  2. 40 主要消费 `specs/06-工作流程基础规范.md`、`specs/03.03-工作流程文档规范.md`、`specs/01-目录说明.md`、`specs/07-Code确定性执行实现规范.md` 等规范，用于审核 40-59 工作流程主文件。
  3. 41 主要消费 `specs/05-工作模型基础规范.md`、`specs/03.02-工作模型文档规范.md`、`specs/05.01-工作模型字段定义与语义规范.md`、`specs/05.02-工作模型字段内容与格式规范.md`、`specs/05.03-工作模型字段注册与消费规范.md`、`specs/09-事实源边界与承载规范.md` 等规范，用于审核 20-39 工作模型主文件。
  4. 如果把这类审核流程厚写为独立主文件，容易把上位规范中的规则复制成第二事实源；当源规范变化时，审核流程主文件也必须同步维护，漂移风险较高。
  5. 更合理的候选方向是区分“不可自动推导的行动规范”和“由正式规范派生的审核能力”：前者适合保留为 40-59 主文件，后者可考虑落到 Skill、Code、Command、Web 审核视图或其他固定能力资产中。
  6. 如果仍保留 40/41 作为 specs 主文件，应考虑改成极薄入口，只声明权威来源、派生性质、执行入口、边界、同步责任和 Human Gate，而不复制完整审核规则正文。
  7. 如果允许 40/41 直接转为固定能力资产或派生型流程资产，需要同步评估并修改 01、03.03、06、04.02、Code 派生索引和 Web 展示边界；这属于 Human Gate 级别的架构变更。
  8. 以 Git 提交为参照，`specs/10-Git提交规范.md` 定义提交格式、事实源追溯边界和 Code/Web 消费规则，`skills/ldvh-git-commit/SKILL.md` 承接 AI 提交流程转换，`code/commit_validate.py` 承接确定性预检，`hooks/ldvh-hooks.yaml` 与 `code/hook_dispatch.py` 承接统一 Hook 事件，Web 承接提交记录派生展示；这说明稳定行动可以由“正式规范 + 极薄工作流程入口 + 能力资产组合 + 部署适配”共同落地，而不需要在单个厚流程主文件中复制规则。
  9. 工作流程的核心职责可重新理解为：管理一次稳定 AI 行动如何进入、消费哪些来源规范、接管哪些保障要求、调度哪些能力资产、结果写回哪里、何时触发 Human Gate，以及部署或环境适配时应检查哪些入口和降级路径。
  10. 正式规范保留规则权威；工作流程薄入口接管执行责任和资产编排责任；Skill、Code、Hook、Web 等能力资产承担执行、校验、触发和展示；环境部署或适配层负责确认这些能力是否能被当前环境触达或是否存在等价人工降级路径。
  11. 40/41 这类审核流程不一定应被删除；更稳妥的候选方向是从厚流程主文件降为极薄工作流程入口，保留审核行动目录和部署对接契约，同时把可由源 specs 推导的检查清单、字段契约、锚点检查和失败分类交给 Code/Skill/Web 派生。
  12. 提交本身也可能需要一个极薄“Git 提交工作流程”入口，用来接管 `specs/10` 的执行保障要求并声明 `ldvh-git-commit` Skill、`commit_validate.py`、Hook registry、Web 提交记录派生视图和环境部署检查之间的关系；`specs/10` 则从具体执行步骤收敛为规则事实源和委托声明。

  后续需要收敛的问题：

  1. LDVH 是否需要正式引入“派生型审核能力”或“派生型流程资产”概念；
  2. `specs/40-59` 是否只承载不可由上位规范自动推导的行动规范，还是仍承载所有稳定 AI 行动流程；
  3. 40/41/42/43 这类审核流程应保留为 active 主文件、降级为极薄入口、迁移为 Skill/Code/Web 能力资产，还是拆分为“薄规范入口 + 固定能力资产”组合；
  4. 派生型能力资产如何登记来源规范、同步触发、验证入口和漂移检查，避免能力资产成为第二事实源；
  5. Code 是否应从源 specs 直接派生审核清单、锚点检查和失败分类，而不是依赖厚写的 40/41 正文；
  6. Web 展示审核结果时，应展示源规范派生结果、能力资产执行结果，还是具体工作流程主文件的规则摘要；
  7. 若改变 40/41 形态，是否需要 WorkCase 承接 01、03.03、04.02、06、07、08、09、Code 和 Web 的同步修改。
  8. 工作流程薄入口是否应正式承担“规范保障到能力资产与环境部署之间的接口契约”角色；
  9. `specs/06-工作流程基础规范.md` 与 `specs/03.03-工作流程文档规范.md` 是否需要从“工作流程主文档完整定义行动规则”调整为“工作流程主文档完整定义行动入口、接管范围、资产协作、部署接口、回写边界和 Gate，领域规则回指来源 specs”；
  10. `specs/10-Git提交规范.md` 是否需要在存在 Git 提交工作流程后，把部分具体执行保障要求改写为委托该工作流程接管；
  11. 工作流程准入应如何收紧，避免每个小工具都要求独立流程；候选准入条件包括稳定、重复、高影响、跨多个能力资产、需要 Gate、需要事实源回写或需要部署检查。

  初步影响面：

  1. `specs/06-工作流程基础规范.md`：可能需要重定义工作流程主文件职责，从“完整定义行动规则”调整为“定义行动入口、接管范围、资产协作、部署接口、回写边界和 Gate”；同时明确领域规则仍由来源 specs 承载。
  2. `specs/03.03-工作流程文档规范.md`：可能需要调整 40-59 文档骨架和成员自描述契约，支持极薄工作流程入口，增加或强化来源规范、接管保障要求、能力资产清单、部署检查入口、降级路径和同步触发等字段。
  3. `specs/04.02-LDVH能力资产与保障机制规范.md`：可能需要明确能力资产与工作流程薄入口的关系，说明 Skill、Code、Hook、Web 等执行资产如何被工作流程编排，且不得反向成为规则事实源。
  4. `specs/04.03-环境入口适配与部署规范.md`：可能需要让部署或环境适配检查能消费工作流程声明的能力需求，判断当前环境是否能触达相关 Skill、Code 命令、Hook 事件、Web 页面或人工降级路径。
  5. `specs/10-Git提交规范.md`：若新增 Git 提交工作流程，10 号规范可能需要把部分具体执行保障要求改写为委托该流程接管，保留提交格式、Git 追溯边界、Code/Web 消费规则和事实源权威。
  6. `specs/40-workflow-design-audit-工作流程设计审核.md` 与 `specs/41-work-model-audit-工作模型审核.md`：可能需要从厚审核流程降为薄入口，保留进入场景、来源规范、接管范围、资产协作、输出归属、Gate 和部署检查，不再复制来源规范中的规则。
  7. `specs/42-specs-audit-规范审核.md` 与 `specs/43-assurance-readiness-audit-保障准备度审核.md`：若其性质同样属于审核类或派生类流程，也需要按同一薄入口原则评估。
  8. `specs/01-目录说明.md`：可能需要同步说明 40-59 区段可以承载极薄流程入口，而不必都成为厚行动规则文档；成员自描述和派生集合索引语义也需同步。
  9. `specs/07-Code确定性执行实现规范.md`：可能需要承接“从来源 specs 派生审核清单、锚点检查、失败分类和流程接管诊断”的 Code 边界，明确 Code 不应依赖厚写 40/41 正文复制规则。
  10. `specs/08-Web信息同步实现规范.md`：可能需要明确 Web 展示来源 specs 派生结果、能力资产执行结果、流程接管状态和部署缺口，而不是展示手写流程规则摘要作为第二事实源。
  11. `specs/09-事实源边界与承载规范.md`：可能需要同步说明流程执行结果、审核结论、Git 提交追溯、Spark/WorkCase 分流和部署检查过程输出之间的事实源边界。
  12. `skills/ldvh-git-commit/SKILL.md`、`hooks/ldvh-hooks.yaml`、`code/commit_validate.py`、`code/hook_dispatch.py`：如果新增 Git 提交工作流程，相关能力资产和 Code/Hook 实现的 source、handoff、verification、部署检查引用可能需要回指该流程或声明与该流程的协作关系。
  13. `rules/LDVH-MAINTAINER-ENTRY.md` 与 `rules/LDVH-WORKSPACE-ENTRY.md`：可能需要同步场景路由，使 AI 在提交、审核和部署检查时能定位薄流程入口、来源规范和能力资产组合。
  14. 该影响面属于 Human Gate 级架构变更，后续宜由独立 WorkCase 承接，例如“将工作流程重构为薄入口与部署接口契约”，不宜零散修改。
