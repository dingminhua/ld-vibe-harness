map_id: v2-terminology-to-v3-04-att-06-map-001
status: temporary_migration_evidence
purpose: >
  Record the scoped migration evidence for introducing
  specs/attachments/04.Att.06-术语表.md as the v3 core glossary attachment.

source_of_truth:
  - "../ld-vibe-harness/specs/attachments/01.Att.02-术语表.md"
target_candidate:
  - "specs/attachments/04.Att.06-术语表.md"

core_constraint:
  single_git_file_fact_source: true
  attachment_rule: >
    The v3 glossary attachment may carry recommended terms, categories,
    meanings, boundaries, migration source, and status only. It must not carry
    body-level principles, action flows, Human Gate rules, fact-source rules,
    checklists, migration process, Code output schemas, or Web contracts.

selection_boundary:
  included_now: >
    Only terms required to keep specs/00, specs/01, specs/02, and specs/03
    internally consistent after the v3 00 self-consistency pass are introduced.
  deferred: >
    The remaining v2 glossary terms stay in v2 until the corresponding v3
    fact model, action template, Code, Web, and runtime-facing specs are
    rewritten or explicitly deprecated.
  non_migrated_v2_content: >
    v2 headings, status-closure prose, auxiliary checklists, and to-do sections
    are not copied into the v3 attachment because specs/04 limits attachments
    to subordinate tables, enums, pure matrices, term tables, and authorized
    machine contracts.

term_map:
  - v3_term: "Human Gate"
    v2_terms:
      - "Human Gate"
      - "审核"
    decision: "keep_with_narrower_boundary"
    target_reason: "Unify Human Gate, Human 判断, and Human 裁决 wording under one mechanism name."
  - v3_term: "Human 确认"
    v2_terms:
      - "Human Gate"
      - "审核"
      - "审阅"
    decision: "add_as_gate_result_term"
    target_reason: "Name the result produced inside Human Gate without creating a second mechanism."
  - v3_term: "构成要素"
    v2_terms:
      - "规范体系"
      - "事实模型"
      - "行动编排"
      - "Code"
      - "Web"
      - "运行时扩展"
    decision: "rewrite_for_v3_five_elements"
    target_reason: "Align with v3 00 after runtime extension moved into the assurance and bridging layer."
  - v3_term: "构成要素实践"
    v2_terms:
      - "落地"
      - "能力保障"
      - "适配措施"
    decision: "add_for_v3_admission_language"
    target_reason: "Separate practice admission from mandatory Human confirmation."
  - v3_term: "保障与衔接层"
    v2_terms:
      - "运行时扩展"
      - "能力保障"
      - "环境适配"
    decision: "add_for_v3_boundary"
    target_reason: "Prevent support mechanisms from becoming a sixth constituent element."
  - v3_term: "用户事实源"
    v2_terms:
      - "事实源"
      - "active 事实源"
      - "单一事实源"
    decision: "rewrite_as_hard_fact_source_rule"
    target_reason: "Capture the v3 rule that Git-trackable files are the only valid user fact-source carrier."
  - v3_term: "事实模型"
    v2_terms:
      - "事实模型"
    decision: "keep_with_v3_boundary"
    target_reason: "Keep the constituent element while preventing it from replacing the user fact source."
  - v3_term: "行动模板"
    v2_terms:
      - "行动编排"
    decision: "rename_for_v3"
    target_reason: "Use v3 00 terminology for reusable AI action structure."
  - v3_term: "Code"
    v2_terms:
      - "Code"
      - "校验"
    decision: "keep_with_verification_boundary"
    target_reason: "Preserve deterministic feedback while stating it cannot replace fact source, AI judgment, Human Gate, or completion."
  - v3_term: "Web"
    v2_terms:
      - "Web"
    decision: "keep_with_human_facing_boundary"
    target_reason: "Preserve Human-facing presentation while stating Web state is not a final fact source."
  - v3_term: "派生机制"
    v2_terms:
      - "知识地图"
      - "Rules"
      - "薄引用"
    decision: "add_as_boundary_term"
    target_reason: "Prevent generated views or routing assets from becoming independent value standards, elements, fact sources, or work objects."
  - v3_term: "过程证据"
    v2_terms:
      - "过程输出"
    decision: "rename_for_v3_evidence_language"
    target_reason: "Clarify that process outputs are temporary evidence until controlled writeback."
  - v3_term: "校验"
    v2_terms:
      - "校验"
    decision: "keep"
    target_reason: "Separate mechanical checks from semantic validation and Human Gate."
  - v3_term: "验证"
    v2_terms:
      - "验证"
    decision: "keep"
    target_reason: "Name evidence-backed proof without implying Human Gate completion."
  - v3_term: "待补齐事项"
    v2_terms:
      - "待补齐事项"
    decision: "keep"
    target_reason: "Preserve the governance state for known unfinished work without treating it as approval or failure."
