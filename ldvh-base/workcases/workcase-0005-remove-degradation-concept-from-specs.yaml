      blocking_reason: null
  plan_review:
    orchestration_owner: main_controller
    workflow_ref: null
    review_policy:
      selection_reason: |
        本 WorkCase 将取消 active specs 中“降级”作为正式机制概念，并影响 Code Schema、Web/Human-facing 状态、WorkCase 关闭结果、Rules 入口和测试验证口径。执行前需要从规范语义、实现兼容、事实源治理和迁移风险四个视角审核。
      required_perspectives:
        - 规范语义一致性
        - Code/Web/tests 兼容边界
        - WorkCase/ADR/Human Gate 治理
        - Rules 入口同步风险
