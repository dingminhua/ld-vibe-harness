id: memo-0005
type: memo
title: WorkPlan 与执行编排边界待收敛
status: pending
created: "2026-06-16"
updated: "2026-06-18"
description: |
  本 Memo 承载本轮关于 TaskPlan / Task / SubTask、WorkPlan、ExecutionItem、Role Contract、计划审核和执行证据边界的阶段性收敛。

  当前已落地的主结论是：LDVH 不再以独立 Task 作为 active 工作模型。Human 关心的是 WorkPlan 这一层的目标、范围、成功标准、关闭判断和证据；AI 在 WorkPlan 内部使用 `orchestration.execution_items` 安排执行、角色分工、并行/串行和最小恢复信息。ExecutionItem 不是工作对象，不进入 `ldvh-base/` 独立事实源，也不作为历史事实源长期追踪。

  执行过程不作为历史事实源，含义是：不记录 AI 的临时 todo、工具读取顺序、子 Agent 中间过程、未采纳草稿或已被最终结论吸收的重复分析。WorkPlan 只保留足以恢复、验证和关闭的最小证据，包括当前推进位置、执行项结果摘要、稳定产物、测试/检查、独立复检结论、Human Gate 结果、关闭原因、残留风险和经验分流结果。

  截至 2026-06-18，旧 TaskPlan / Task 已批量迁移为 WorkPlan 事实源：`ldvh-base/workplans/` 中已有 61 个 WorkPlan，WorkArea 已补齐 `workplans` 反向索引；Code / Web 已能把 WorkPlan 作为一等对象读取、统计、展示和校验。Code 新建入口已拒绝 TaskPlan / Task / SubTask，Web 主导航、Dashboard 和默认关注队列已仅使用 active 工作模型。随后 workplan-0069 已进一步清退旧 TaskPlan / Task / SubTask 事实源目录、迁移工具、测试夹具、API 兼容字段和 Web 直达入口；当前项目尚未推广，不保留旧对象兼容能力。

  当前事实源结构校验为 `errors=0 warnings=0`。此前 13 个 warning 来自历史旧规范路径引用，已按现行承接关系改向 `specs/21-WorkPlan-工作计划.md` 或相关现行规范，不再让旧 TaskPlan / Task / SubTask 规范路径形成事实源噪音。

  `Specs 编号与字段注册表总收口` 已完成三个核心动作：`specs/05.01-工作字段内容格式规范.md` 已从 WorkPlan 试点注册升级为全工作模型字段注册表，补齐 WorkArea、ADR、Pitfall、Memo、Change、Study 的字段名、语义、内容格式、Code/Web 消费元数据和废弃/别名关系；20-39 工作模型编号洞已填补，ADR、Pitfall、Memo、Change、Study 已从 24-28 迁移为 22-26；旧 specs 路径引用已清理到事实源零 warning。

  仍需继续讨论和核对的核心问题：

  - `orchestration.execution_items` 的字段已足以支持当前恢复、并行/串行编排、角色分派和关闭判断；后续只需继续观察 `input_refs` / `evidence_refs` 是否需要更强引用解析；
  - `orchestration.review` 目前只声明复检安排；若需要更明确的专业角色审核输出格式，应由 Role Contract、工作流程或能力资产规范承接；
  - Role Contract 应由 04 能力资产、06 流程基础、40-59 具体流程，还是其他规范承接；
  - WorkPlan 的 `verification_evidence` 与 `closure_evidence` 已在字段注册表和校验中分离，但旧迁移数据中仍可能存在语义重复，后续应在关闭新 WorkPlan 时持续强化证据写法；
  - Memo 中已经部分落地的议题，如何提示 AI 判断继续 pending、追加 evolution、分流或 resolved；
  - 旧 TaskPlan、Task、SubTask 的当前兼容面已经清退；后续只需继续处理 Web 内部 `TaskFlow*` 命名债、历史叙述边界和需要保留为 Git 历史的证据说明。

  建议新会话优先从 `specs/21-WorkPlan-工作计划.md` 逐段核对，然后回看 `specs/05-工作模型基础规范.md`、`specs/05.01-工作字段内容格式规范.md` 和 `specs/06-工作流程基础规范.md`，最后再处理 40-43 流程规范与 Code / Web 迁移。
