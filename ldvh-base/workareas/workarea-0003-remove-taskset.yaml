description: |
  LDVH 生产对象的增删改查、模型收敛和机制分层治理。
  已完成决策：取消 TaskSet 和 Evidence 作为独立 active fact model，由 WorkArea / TaskPlan / Task 主链路承接范围、目标、执行和关闭判断，由 Task 直接引用结果物和关闭证据。
  待推进：PyTools 承接生产对象增删改查确定性操作，Skill 只做流程编排和 PyTools 调用。
source: 用户确认取消 TaskSet 和 Evidence，并提出 PyTools 承接增删改查、Skill 只做流程编排
scope: |
  20 事实模型集合索引、24 WorkArea、27 TaskPlan、26 Task、28 SubTask、相关 Contract、Skill、Rules 和 Validator 中不再把 TaskSet 或 Evidence 作为主链路对象或强制归属。
  现有 taskset-0002 的处理路径明确，task-0003 不再依赖 taskset-0002。
  现有 ev-0001 与 ev-0002 的处理路径明确，Task 可直接引用文档、日志、报告、截图、commit 或测试结果。
  PyTools 实现生产对象 create/transition/delete 命令，Skill 不再直接写 YAML。
constraints: |
  保留 WorkArea → TaskPlan → Task → SubTask 主链路；TaskSet 不再新建；Evidence 不再作为默认独立对象创建；修改事实源和规范后按提交纪律处理。
