title: 接入形态唯一为薄 Skill，过程机械检查必须、git Gate 终局把关
status: retired
decision_question: LDVH 向各 AI 开发环境交付与接入时，信息投递、过程检查与机械阻断三层分别应由什么载体承担——单一 Skill、环境插件、行动模板、原生 git Gate 还是 MCP，接入面是否为唯一形态？
decision: 在 Human 于 2026-07-30 对 adr-0005 记录内容的四点修正指令及 MCP 重估条件确认的范围内，决定：一、LDVH 交付物为 pip 发行包与六个 CLI 入口；环境接入载体唯一：单一薄引用 Skill，只承担身份告知、启动时经 ldvh-work-context 取得规则引导、动手落入 LDVH 领域时先经 CLI 取当次行动模板；Skill 不复制规则正文、不写死模板清单、保持环境中性（不断言任何环境的自动触发状态）。行动模板路由（规则引导与当次模板取得）必须实际可行，其验证与保障为本决定的前置义务。二、不存在环境 Hook 或插件接入形态，不设任何可选升级路径；接入面只有 Skill 与 git Gate 两层。环境 Hook 相关知识（09 接入协议机制、Codex 参考实现、spark-0029 的 guardrail 调查）删除而非降级保留；各环境已部署的 Hook/插件实例转入清理队列，物理拆除需另行授权。三、行动过程中的机械检查为必须项：事实写入后跑事实完整性校验、提交前 Helper 预检、直写 ldvh-base/ 禁令；git commit-msg Gate 是附加的最后一道把关，不替代也不削弱过程检查；git Gate 升级事实机械校验后成为事实完整性终闸。四、当前不做 MCP：MCP 无生命周期语义，不能承载启动注入；其工具调用与 shell 直调 CLI 能力等价；且同为模型内通道，原理上无法阻断行动。重估触发条件为：目标环境禁 shell 但支持 MCP；Helper 信封误写成为实证 Pitfall；部署方要求逐调用批准与审计；接入无技能机制但有 MCP 的环境；LDVH 长出有状态服务需求。五、本决定记录形态选择，不表示行动模板路由验证、git Gate 事实校验、SKILL.md 环境中性化、环境 Hook 知识删除或任何文档清理已经实施。
applicability: 适用于 LDVH 发行物的交付形态、全部目标 AI 环境的接入方案，以及 README、33 行动模板、09 接入协议、共享 SKILL.md 与接入面文档的相应修订。明确排除：不改变 git Gate 的既有提交契约职责；不以本决定宣称事实完整性终闸或行动模板路由可行性已经成立——相应前置义务完成前，一切对外接入表述必须如实保留缺口；各环境已部署 Hook/插件实例的物理拆除不在本决定授权范围内，需另行授权；MCP 重估触发条件成立时的重新评估不违反本决定，重估结论须另建新 ADR。形态选择的决定变量是目标环境的开放能力（能否运行本地可执行文件、读取本地文件与递达规则引导），与 LDVH 源码是否开源无关；源码开闭只改变能力本体的分发工件形态，不构成接入形态变更理由。
rationale: Human 裁决：可选路径的存在本身即造成接入面分叉与认知混淆，单一形态更易理解、维护与核对；环境 Hook 知识保留会继续诱导按已否形态设计与表述，故删除而非降级保留。分层检查观：检查在日常（过程中机械检查必须执行）、把关在提交（git Gate 最后一道），二者互补不互替。约束层真阻断只能位于模型之外：Skill 与 MCP 工具均为模型内通道，无法阻断任何行动（直写绕过曾在 orientation 在场时实际发生）；git Gate 是 LDVH 完全可控的唯一环境外阻断点。行动模板路由是薄 Skill 路由纪律的承重墙——Skill 只承诺先取模板，模板取得不可行则整个接入形态落空，故列为前置义务。MCP 当前不做：无生命周期语义、与 shell 直调 CLI 等价、配置成本与已否决的插件形态同构（逐环境 mcp.json、信任批准、版本对齐）；五条重估触发条件仅为未来重估依据，不构成当前可选形态。未选'插件可选加固'：可选性即分叉源；未选'Hook 知识降级保留'：死知识继续误导。
consequences: 正面：接入面收敛为唯一形态（Skill + git Gate），无分叉、无可选态；知识库无已否形态的死概念；检查职责分层清晰（过程必须、提交终闸）；MCP 立场附明确重估条件，未来证据出现时不需翻案只需评估。负面与限制：失去 Hook 到达必然性兜底，drift 窗口完全由过程机械检查与 git 终闸压缩而非消除；schema 合法但语义造假的事实为残留风险；Skill 递达的长期行为稳定性未验证；已部署实例拆除与文档删除产生一次性清理成本。后续义务：验证并保障行动模板路由可行（前置）；git Gate 事实机械校验与 fact_integrity 一等化（spark-0039 第 1、2 项，终闸成立的前置义务）；共享 SKILL.md 环境中性化与分发落地；删除 09 环境 Hook 协议内容与 Codex 参考实现描述、处置 spark-0029 guardrail 调查知识；README 与 33 按唯一形态修订；各环境已部署 Hook/插件实例拆除（需另行授权）；Codex PreToolUse deny 复核事项随插件形态取消而关闭。本 ADR 被规范、Code 或行动模板吸收后不自动退休，退出需 Human 另行授权。
