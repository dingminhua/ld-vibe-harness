    target_scope: 范围匹配 web/api、web/shared、web/src、web/tests；重点为当前已识别的 8 个 dirty 重叠文件
    effect_scope: 只允许在保留现有 baseline diff 的前提下做局部增量；禁止清理、覆盖、stage 或 restore 无关修改
    risk_summary: 与并发 Web 工作存在直接文件及消费者语义重叠，错误合并可能丢失他人改动或形成误导呈现
    rollback_summary: 只回退可归因于本 WC 的局部增量；无法安全区分时停止 item-3，不执行回退猜测
