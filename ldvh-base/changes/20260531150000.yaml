summary: 构成要素命名术语治理——将 Harness 前缀替换为理念层短称和 LDVH 正式全称
reason: >
  "Harness 生产对象"等术语不准确，Harness 是框架概念而非对象归属主体。
  00 总纲作为理念层文档，应使用"工具、生产对象、行动模型"短称；
  01/L1 等编号分区和跨文档引用场景使用"LDVH 工具、LDVH 生产对象、LDVH 行动模型"正式全称。
  同时修正 02 术语规范章节编号重复问题（两个"七"章，跳过"十"）。
changed_files:
  - specs/00-LD-Vibe-Harness理念与纲要.md
  - specs/01-LDVH目录说明.md
  - specs/02-LDVH术语规范.md
  - .trae/rules/ldvh-l1-rules.md
verification: >
  1. 00 中无"Harness 工具/Harness 生产对象/Harness 行动模型"残留；
  2. 01 中目录表格和引用使用 LDVH 正式全称；
  3. 02 章节编号一到十二连续无重复；
  4. L1 编号分区使用 LDVH 正式全称，项目定位使用短称；
  5. 03 无需修改（已无 Harness 前缀引用）。
