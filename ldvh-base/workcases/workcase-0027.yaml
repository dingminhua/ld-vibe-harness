title: 记录 LDVH 对 AI 工作实践的影响并反馈改进
status: blocked
phase: human_plan_confirming
plan_version: 1
priority: P2
waiting_on: Human 决定是修正本 WorkCase 目标还是取消它
blocking_summary: 目标与用户实际意图不符，等待处置：用户要求创建的是针对附件问题的 WorkCase，而本 WorkCase 目标是记录 LDVH 对工作实践的影响。
goal: 将本次会话中 LDVH 对 AI 工作实践的影响结构化记录到本地记忆，并整理为可用于完善 LDVH 的反馈材料。
scope: "覆盖 (1) 通过 cindy_memory 写入 feedback 与 project 类型记忆条目；(2) 写入后对记忆条目执行回读验证；(3) 将记忆内容同步整理为 LDVH 改进建议草案。\n不包含：直接修改 LDVH 规范正文、自动执行 Git 提交、向外部服务发送数据、代为作出需要 Human 批准的规范变更决定。"
success_criterion_definitions:
- criterion_id: criterion-memory-written
  statement: 至少一条 feedback 类型与一条 project 类型的记忆条目成功写入 cindy_memory，且写入后回读确认字段与内容符合预期。
- criterion_id: criterion-impact-accuracy
  statement: 记忆条目准确反映 LDVH 在本会话中的实际影响边界，每条影响点均标注是已验证观察还是推断，并至少覆盖 skill 路由、事实类型判断、附件化评估三个主题之一。
- criterion_id: criterion-improvement-input
  statement: 形成一份结构化的 LDVH 改进建议草案，明确对应到具体规范或能力入口，且不与当前规则源冲突。
work_items:
- item_id: item-discover-memory-tool
  goal: 确认 cindy_memory MCP 工具可用并理解其写入 schema
  expected_result: 已调用 cindy_memory list_tools，确认 memory_write 的字段与类型要求，且无能力缺口阻止写入。
  status: pending
- item_id: item-write-feedback-memories
  goal: 写入 LDVH 对工作实践影响的 feedback 记忆条目
  expected_result: 至少写入两条 feedback 记忆：一条关于 skill 路由预期修正，一条关于事实类型判断边界；均包含 Why 与 How to apply。
  status: pending
  depends_on:
  - item-discover-memory-tool
- item_id: item-write-project-memory
  goal: 写入 LDVH 附件化缺口的 project 记忆条目
  expected_result: 写入一条 project 记忆，记录当前规范中 21/25/20/22/23/24 等事实类型存在表格可剥离为附件的观察与后续评估建议。
  status: pending
  depends_on:
  - item-discover-memory-tool
- item_id: item-verify-memory
  goal: 回读并验证已写入记忆条目
  expected_result: 通过 cindy_memory 读取或搜索确认已写入条目存在、字段合法、内容无偏离。
  status: pending
  depends_on:
  - item-write-feedback-memories
  - item-write-project-memory
- item_id: item-draft-improvement-input
  goal: 将记忆内容整理为 LDVH 改进建议草案
  expected_result: 形成一份结构化改进建议，列出针对 skill、04/05 事实类型语义、规范附件化的具体建议，并保存到当前会话产物中供 Human 审阅。
  status: pending
  depends_on:
  - item-verify-memory
execution_authorization:
  authorized_actions:
  - action_id: authorization-call-cindy-memory
    summary: 调用 cindy_memory MCP 工具的 list_tools 与 memory_write/memory_read/memory_search 完成记忆读写
    target_scope: 本地 cindy_memory 数据存储（位于本设备）
    effect_scope: 写入、读取、搜索本地记忆条目；不产生网络请求，不修改 LDVH 规范或 Git 状态
    risk_summary: 可能因 schema 不匹配导致写入失败；可能因记忆重复命名导致 ALREADY_EXISTS；可能写入内容过长触发 size 警告
    rollback_summary: 若写入错误可经 memory 更新或删除机制更正；当前任务只写入新记忆，不覆盖既有条目
    rule_refs:
    - cindy_memory 工具契约
    - LDVH 05 事实模型基础规范
  - action_id: authorization-read-specs
    summary: 读取 LDVH 当前规则源中 01/04/05/20/21/24/25 等规范以确认事实类型与 Helper 边界
    target_scope: ld-vibe-harness-v4/specs/ 下当前规则源 Markdown 文件
    effect_scope: 只读访问；不写回规范
    risk_summary: 低；仅用于核对类型字段与执行路径
    rollback_summary: 只读操作无需回滚
    rule_refs:
    - LDVH 01 规范模型基础规范
    - LDVH 04 Helper CLI 服务规范
  - action_id: authorization-write-session-artifact
    summary: 将改进建议草案写入当前会话产物（非 ldvh-base 事实文件）供 Human 审阅
    target_scope: 当前 Claude Code 会话产物或临时文件
    effect_scope: 创建文本产物；不进入 ldvh-base/、不修改 specs/、不自动提交 Git
    risk_summary: 低；产物仅供审阅
    rollback_summary: 可手动删除或覆盖
    rule_refs:
    - LDVH 21 WorkCase 工作项
  action_ceiling: 本次运行最多调用 cindy_memory 完成记忆读写验证，读取必要 LDVH 规范，并形成一份改进建议草案；不得修改 specs/、不得自动提交、不得向外部服务发送数据。
  prohibited_actions:
  - 直接修改 LDVH 规范正文
  - 自动执行 Git 提交或推送
  - 向外部网络服务发送数据
  - 覆盖或删除既有记忆条目（除非为更正本次写入）
  - 把记忆写入当成 LDVH 规范变更的替代
  allowed_adjustments: 在基线不变的前提下，可调整记忆条目的具体措辞、拆分/合并条目、选择 memory_write 的 mode；可调整改进建议草案的格式与详略；不可改变基线中的禁止项与上限。
  verification_and_rollback: 写入后立即通过 memory_read 或 memory_search 回读验证；若发现字段或内容偏离，使用更新/删除机制更正；改进建议草案 Humans 确认前不进入 ldvh-base。
  out_of_bounds_handling: 发现需要修改规范或超出基线的动作时，停止执行并将剩余内容转为 Spark 建议或 Human 审阅输入，不得在本次运行中补授权。
creation_reviews:
- reviewer: independent-review-agent
  reviewed_at: '2026-08-01T22:17:00+08:00'
  subject_version: 1
  scope: 按 LDVH 当前规则源对候选 WorkCase 计划执行创建前独立复核，覆盖目标闭合性、scope 边界、成功标准可检查性、work item 生命周期关口隔离、类型选择及风险遗漏。
  conclusion: pass_with_followups
  feedback:
  - 在 work items 中增加一项验证动作：cindy_memory 写入后应回读并确认记忆条目内容、标签与分类符合预期。
  - '成功标准 #2 偏主观，建议补充可检查指标：每条影响点标注已验证/推断，并至少覆盖 skill 路由、事实类型判断、附件化评估之一。'
  - 计划提到区分 feedback 类型与 project 类型，但未说明 cindy_memory 中这两类在 schema/字段上的具体差异；建议在 Gate1 前明确分类规则。
  - execution authorization 应明确写入：cindy_memory 为本地 MCP 工具，不触发外部网络写入；整理出的改进草案仅作为输入材料，不直接修改规范、不自动提交 Git、不发送至外部服务。
  controller_resolution: 已采纳全部 feedback：新增 item-verify-memory 负责回读验证；细化 criterion-impact-accuracy 要求标注验证状态与主题覆盖；在 scope 与 execution authorization 中明确 feedback/project 类型分类目标及外部写入禁止；execution authorization 已列明 cindy_memory 本地范围与禁止动作。
