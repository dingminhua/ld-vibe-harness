id: adr-0007
type: adr
title: LDVH 采用受控落地执行链路而非独立安装器
status: proposed
created: '2026-06-11T00:37:55.017113'
updated: '2026-06-11T00:46:56.406068'
context: |
  [Human Gate 确认记录: 确认人=用户, 确认时间=2026-06-11T00:37:55.017113, 确认上下文=用户确认根据 21 号文档创建 proposed ADR、Intent 和 Task 批次，用于承接受控落地执行闭环方向]

  21 号 research 文档明确 LDVH 下一阶段应从只读诊断闭环升级为受控落地执行闭环。该判断影响 Code、Web、CLI、Task、ADR、Human Gate、事实源边界和平台映射，满足 ADR 准入条件。
decision: |
  LDVH 不建设独立安装器；必须建设受控落地执行链路：Read Entry → Landing Plan → Test Design → Human Approve → Auto Apply / Repair → Verify → Review Needed → Web / AI Review → Close / Writeback → Recheck。

  自动 apply / repair 允许存在，但必须受 landing plan、测试先行、Human Gate、验证、review_needed、审核和 Git 文件事实源回写约束；Web/CLI/status/review queue 只能作为派生视图或受控入口，不得成为第二事实源。
consequences: |
  该决策解决不要安装器但落地初始化不可缺位的矛盾，为 Code、Web、CLI、Task 审核和平台映射提供共同方向。

  代价是链路复杂度上升，必须以测试先行、Human Gate、review_needed 和事实源边界降低自动执行风险。
