type: change
title: 将 specs 索引优先消费顺序落地到 L0/L1/L2 Rules
author: ai
status: done
created: 2026-06-03
updated: 2026-06-03
context: |
  specs/03.01-Specs文档索引规范.md 机制关系声明已补强索引优先消费顺序同步触发，但 L0/L1/L2 Rules 仍使用"可用索引辅助"或"先搜索标题或用索引辅助"表述，未形成"先索引定位，后原文判断；索引不可用才搜索回退"的优先消费行动路径，导致 AI 实际执行时仍默认 Grep/Read 而绕过索引机制。
decision: |
  1. 更新 .trae/rules/ldvh-l2-specs-rules.md 索引与读取章节和压缩保护，从"索引只作辅助"改为"索引优先定位，不可用才搜索回退"；
  2. 更新 .trae/rules/ldvh-l1-rules.md 入口章节和压缩保护，从"可用 03.01 辅助定位"改为"先尝试使用 specs 索引程序或其输出定位，索引不可用才搜索回退"；
  3. 更新 .trae/rules/ldvh-l0-rules.md 读取策略章节和压缩保护，从"先搜索 Markdown 标题或用索引辅助定位"改为"先尝试使用 specs 索引程序或其输出定位，索引不可用才搜索回退"；
  4. 三个 Rules 均保留"规范判断必须读取原文"和"不得只读索引而不读原文"约束。
consequences: |
  - AI 定位 specs 文档和章节时，行动路径从"搜索优先"变为"索引优先，搜索回退"；
  - 索引缺失、过期或不可用时，AI 仍可回退到标题搜索和行范围读取，不影响正常工作；
  - 规范判断仍必须读取原文，索引不得替代原文；
  - 后续如 03.01 的 AI 消费规则、索引优先消费顺序或失效回退变化，应同步评估 L0/L1/L2 Rules。
affects:
  - .trae/rules/ldvh-l2-specs-rules.md
  - .trae/rules/ldvh-l1-rules.md
  - ../.trae/rules/ldvh-l0-rules.md
related_rules:
  - specs/03.01-Specs文档索引规范.md
  - specs/11.01-Rules机制规范.md
human_gate:
  required: true
  reason: 修改 L0/L1/L2 Rules，属于 Rules 高影响变更；本次由用户明确要求"先改规范再改实践"，并已在执行前按 03.01 机制关系声明确认同步范围。
validation: |
  已读取修改后的 L0/L1/L2 Rules，确认三个文件均包含"先尝试使用 specs 索引程序或其输出定位"和"索引缺失、过期或不可用时回退"表述；压缩保护均已更新为"索引优先定位 | 索引不可用才搜索回退"。
