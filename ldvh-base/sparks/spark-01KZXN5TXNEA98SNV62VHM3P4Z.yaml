title: 管辖项目临时文件的统一存放约束（仅限 docs 目录）
status: implemented
intent: 保留议题：要求所有受管辖项目的临时/中间文件（含草稿、转储、缓存式产物、一次性脚本输出）只能写入各项目自身的 docs 目录下，避免散落在仓库根、build/、临时脚本或工作树其它位置造成污染与不可追踪。后续需判断：这是规范层约束（09 环境接入 / 07 Code 实践）还是由各项目 .gitignore 与目录约定落实；如何界定“临时文件”边界与例外（依赖、构建产物、操作系统/编辑器缓存是否纳入）；以及 docs 目录本身是否需要按项目或按类型分子目录。若不跨行动保留此议题，后续每个项目都会各自重新约定临时文件位置，导致工作树污染、跨会话定位困难与清理责任分散。
summary: "## 当前结论\n\n- 约束落点已确定为规范层：受管辖项目的临时文件、草稿、调查材料、一次性脚本输出、中间转储和缓存式产物统一收口到项目根级 `docs/` 目录。\n- 临时文件边界与例外已明确：依赖、构建产物、操作系统或编辑器缓存继续按项目既有 `.gitignore` 与目录约定管理；`docs/` 内部是否分子目录由项目自行约定。\n- `docs/` 只承载临时说明材料，不是规则源、事实源、测试输入或能力验证证据；稳定事实仍保存在各自事实源中。\n\n## 处置边界\n\n上述规范层回应已经覆盖本 Spark 原先要求判断的约束落点、临时文件边界、例外和 `docs/` 组织方式，原议题范围内没有剩余待判断或待承接责任。该结论只表示本 Spark 入口已直接落实，不表示所有受管辖项目已经逐一审计、所有工具写入已经机械拦截，或任何下游项目工作已经完成。"
