disposition_summary: 该观察已由 Pitfall 类型规范的根因边界和最小处理闭环直接承接；不再需要作为 active 的独立经验。仍有效的表达边界由 specs/23-Pitfall-踩坑经验.md 承接；没有未处置的后续责任。
