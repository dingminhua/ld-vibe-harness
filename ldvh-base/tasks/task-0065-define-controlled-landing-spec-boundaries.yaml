closure_evidence: |
  ## 规范承接边界

  task-0065 确认 research 21 是输入材料，不是直接执行事实源。受控落地执行闭环的稳定承接关系如下：

  - `docs/specs/41-landing-orchestration-规范落地统筹.md` 承接受控落地链路的规范落地统筹边界：识别正式规范、提取落地要求、分流 Code / Web / Skill / Agent / Hook / CI / Human Gate / Task，并避免从 research、Web、CLI 或运行投影反向制造规则事实。
  - `docs/specs/42-ldvh-landing-check-LDVH落地与检查.md` 承接落地与检查、缺口报告、授权补齐、复检和报告边界；42 只输出当前检查报告，不拥有安装 / 初始化 / 环境状态的长期状态机。
  - `docs/specs/09-事实源边界与承载规范.md` 承接 Git 文件事实源边界；Web、CLI、status、review queue 和工具输出不得成为第二事实源。
  - `docs/specs/10-运行闭环测试规范.md` 承接测试先行、验证命令、失败复现、正反样例和复检要求。
  - `docs/specs/07-Code实现规范.md` 承接 landing plan / apply / repair / verify / review / status 等 Code 入口的实现、输出合同和测试边界。
  - `docs/specs/08-Web信息同步规范.md` 承接 Web / Human-facing 展示、审核材料、派生状态展示和事实源回指边界。
  - `docs/specs/26-Task-任务.md` 承接 Task 状态机、review_needed、关闭证据、依赖关系和禁止自动关闭的边界。
  - `docs/specs/21-ADR-决策记录.md` 及其合同承接 adr-0007 的 proposed / accepted 生命周期、Human Gate 和后续升级关系。

  ## ADR 与 specs 吸收关系

  adr-0007 当前为 proposed，只能作为待确认长期决策输入，不等同于 accepted 执行依据。其决策方向是 LDVH 不建设独立安装器，而建设受控落地执行链路。后续吸收关系如下：

  - 若 Human 后续接受 adr-0007，accepted ADR 仍只记录长期决策与取舍；可执行规则必须继续落入对应 specs、Task、Code 和 Web，不由 ADR 直接替代规范正文。
  - landing plan 输出合同、测试设计字段、Human Gate、write_targets、verify_commands、review_targets、writeback_targets 进入 task-0066 和后续 Code / spec 合同。
  - apply / repair 的授权写入、禁止项、失败处理和 review_needed 默认状态进入 task-0067、task-0068、Task 状态机和 Code 实现。
  - verify / recheck 的聚合状态、degraded / needs_human_gate 输出和复检消费进入 task-0069、42、10 和 Code 实现。
  - Web 审核面和 review_needed 队列进入 task-0070、task-0071、08 和 Task 状态机承接。

  ## research / Task / Code / Web 状态边界

  暂留 research 的内容：路线背景、问题分析、阶段性判断、CLI 建议清单、Web 下一阶段设想、平台映射试点建议和未正式化的开放讨论。

  进入 Task 的内容：所有需要执行、验证、排期、依赖、关闭证据或后续分工的事项，包括 task-0066 至 task-0074。

  进入 Code 的内容：只读 landing-plan / landing-report / ldvh-landing-check 的既有诊断入口，以及后续经 Task 授权实现的 landing apply / repair / verify / review / CLI 命令；Code 输出是派生结果，不成为事实源。

  进入 Web 的内容：landing plan、proposed actions、test design、verify 结果、review_needed 和 Human Gate 证据的 Human-facing 展示；Web 只能回指 Git 文件事实源或 Code 派生输出，不保存独立权威状态。

  进入运行投影的内容：AI 入口、CLI、平台适配清单、Hook / CI / Skill / Agent 等只能承接正式规范声明的抽象能力，不复制 research 正文，也不维护第二套规则。

  ## 后续 Task 依赖与并行边界

  - task-0066 依赖 task-0065，负责 landing plan 合同与测试先行字段，是 apply / repair / verify / Web 审核面之前的共同前置。
  - task-0067 依赖 task-0066，负责最小 landing apply 受控写入入口；不得早于 plan 合同和测试字段落地。
  - task-0068 依赖 task-0066，负责最小 landing repair 候选修复入口；可与 task-0067 并行，但必须共享相同授权、禁止项和 review_needed 边界。
  - task-0069 依赖 task-0066，负责 landing verify 与 recheck 聚合入口；可与 apply / repair 设计并行，但 review_needed 消费需等待 verify 合同稳定。
  - task-0070 依赖 task-0069，负责 review_needed 队列和 Task 审核承接；不得在 verify 结果合同前独立制造 Review 工作模型。
  - task-0071 依赖 task-0066、task-0069、task-0070，负责 Web Validate 审核闭环展示；不得早于 plan、verify 和 review_needed 字段稳定。
  - task-0072 可在 task-0066 之后与 Code 入口任务并行推进最小 CLI 包装，但 CLI 只能包装既有或已授权 Code 能力，不成为第二事实源。
  - task-0073 依赖 task-0065，用于 Trae 平台映射试点；应在边界明确后推进，且不得阻塞 Code 合同任务。
  - task-0074 依赖 task-0065，用于迁移 research 18-20 到 21 的可吸收内容；可与 task-0066 并行，但不得把未吸收 research 直接提升为执行规则。

  ## 验证与残留风险

  已完成 task-0065 的边界分析和事实源回写，并运行 task 结构校验与 landing-report 派生检查。残留风险是 adr-0007 仍为 proposed，后续 accepted / rejected 需要 Human Gate；apply / repair / verify / Web 审核闭环尚未实现，由 task-0066 及后续任务继续承接。

  ## 验证结果

  `python3 tools/fact_validate.py ldvh-base/tasks/task-0065-define-controlled-landing-spec-boundaries.yaml` 通过。`python3 tools/specs_validate.py landing-report --format json` 完成并保持 open / degraded 缺口输出，证明当前只完成边界承接，不误判后续闭环已经完成。

  ## 结论

  task-0065 的验收项已全部完成并关闭。后续执行从 task-0066 开始承接 landing plan 合同与测试先行字段。
