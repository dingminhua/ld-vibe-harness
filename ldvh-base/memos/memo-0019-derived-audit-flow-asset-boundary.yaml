id: memo-0019
type: memo
title: 40/41 派生型审核流程与能力资产边界待收敛
status: pending
created: '2026-06-20T09:56:56+08:00'
updated: '2026-06-20T09:56:56+08:00'
description: |
  本 Memo 承载一个需要后续收敛的架构边界问题：`specs/40-workflow-design-audit-工作流程设计审核.md`、`specs/41-work-model-audit-工作模型审核.md` 这类审核流程，是否应继续作为厚重的 `specs/40-59` 具体工作流程主文件存在，还是应改为由正式规范派生出的 LDVH 固定能力资产、极薄流程入口或 Code/Skill/Web 执行能力。

  当前讨论认知：

  1. 40/41 这类审核流程并不完全像普通业务行动流程；它们很大一部分内容来自既有正式规范的组合、读取顺序和执行转换。
  2. 40 主要消费 `specs/06-工作流程基础规范.md`、`specs/03.03-工作流程文档规范.md`、`specs/01-目录说明.md`、`specs/07-Code确定性执行实现规范.md` 等规范，用于审核 40-59 工作流程主文件。
  3. 41 主要消费 `specs/05-工作模型基础规范.md`、`specs/03.02-工作模型文档规范.md`、`specs/05.01-工作模型字段定义与语义规范.md`、`specs/05.02-工作模型字段内容与格式规范.md`、`specs/05.03-工作模型字段注册与消费规范.md`、`specs/09-事实源边界与承载规范.md` 等规范，用于审核 20-39 工作模型主文件。
  4. 如果把这类审核流程厚写为独立主文件，容易把上位规范中的规则复制成第二事实源；当源规范变化时，审核流程主文件也必须同步维护，漂移风险较高。
  5. 更合理的候选方向是区分“不可自动推导的行动规范”和“由正式规范派生的审核能力”：前者适合保留为 40-59 主文件，后者可考虑落到 Skill、Code、Command、Web 审核视图或其他固定能力资产中。
  6. 如果仍保留 40/41 作为 specs 主文件，应考虑改成极薄入口，只声明权威来源、派生性质、执行入口、边界、同步责任和 Human Gate，而不复制完整审核规则正文。
  7. 如果允许 40/41 直接转为固定能力资产或派生型流程资产，需要同步评估并修改 01、03.03、06、04.02、Code 派生索引和 Web 展示边界；这属于 Human Gate 级别的架构变更。

  后续需要收敛的问题：

  1. LDVH 是否需要正式引入“派生型审核能力”或“派生型流程资产”概念；
  2. `specs/40-59` 是否只承载不可由上位规范自动推导的行动规范，还是仍承载所有稳定 AI 行动流程；
  3. 40/41/42/43 这类审核流程应保留为 active 主文件、降级为极薄入口、迁移为 Skill/Code/Web 能力资产，还是拆分为“薄规范入口 + 固定能力资产”组合；
  4. 派生型能力资产如何登记来源规范、同步触发、验证入口和漂移检查，避免能力资产成为第二事实源；
  5. Code 是否应从源 specs 直接派生审核清单、锚点检查和失败分类，而不是依赖厚写的 40/41 正文；
  6. Web 展示审核结果时，应展示源规范派生结果、能力资产执行结果，还是具体工作流程主文件的规则摘要；
  7. 若改变 40/41 形态，是否需要 WorkPlan 承接 01、03.03、04.02、06、07、08、09、Code 和 Web 的同步修改。
