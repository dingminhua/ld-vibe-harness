  summary: 产品侧规则源解析缓存：inspect_repository 单次约 870ms，是 git_hooks/helper 全部 Hook CLI 与 handle_request 调用的共同底座；本次 4 项不可收敛慢测试（合计约 20s）的唯一提速路径
  follow_up_summary: 若后续立项，预估 git_hooks/helper 测试整体再降 40–60%；方向包括在 ldvh.helper.rule_source 增加进程内/跨进程解析缓存或预编译索引，属产品行为变更，需独立 WorkCase 与 Gate 1
