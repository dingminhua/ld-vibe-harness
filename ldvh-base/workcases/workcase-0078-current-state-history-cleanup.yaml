verification_evidence: |
  ## 验证计划
  - 检查 active surface 不再出现普通/特殊提交、TaskFlow、Profile、旧 suggested_writeback key 等会误导当前模型消费的残留。
  - 检查 specs、fact source、Code 测试和 Web 类型/API 测试。

  ## 验证命令
  - `rg -n "普通提交|普通/特殊|特殊提交|TaskFlow|taskFlow|planTask|TaskSection|TaskInline|TaskDoc|related_profiles|nav\\.profiles|fact_yaml_fix_or_task|spec_fix_or_task|\\bProfile\\b|\\bprofile\\b" specs web/src web/api web/docs code tests -g '!web/node_modules/**' -g '!web/dist/**'`
  - `rg -n "普通提交|普通/特殊|特殊提交|TaskFlow|taskFlow|planTask|TaskSection|TaskInline|TaskDoc|related_profiles|nav\\.profiles|fact_yaml_fix_or_task|spec_fix_or_task|\\bProfile\\b|\\bprofile\\b" ldvh-base`
  - `python3 code/specs_validate.py all`
  - `python3 code/fact_validate.py ldvh-base --format text`
  - `python3 -m pytest tests/code/specs_validate_checks/test_ldvh_assurance.py tests/code/specs_validate_checks/test_human_gate.py tests/code/test_commit_validate.py tests/code/test_fact_cli.py tests/code/test_fact_validate.py -q`
  - `npm run check` in `web/`
  - `npm run test:web:api` in `web/`

  ## 验证结果
  - active surface 残留扫描无命中。
  - 子 agent Poincare 复核发现 `ldvh-base` 中两个 pending Spark 仍含当前误导性旧口径；已修正 spark-0003 的 Profile 方案口径和 spark-0005 的 TaskFlow 后续债口径。
  - `ldvh-base` 扩展残留扫描仍会命中 0078 自身验证记录、已关闭 WorkCase 的历史证据和旧迁移说明；经分类，不再发现 pending Spark 或当前 active 入口中的未处理 Profile / TaskFlow / 旧 writeback key / 普通特殊提交口径。
  - `python3 code/specs_validate.py all` 退出码 0；保留既有规范 review hints 与一条非阻塞 duplicate-term warning。
  - `python3 code/fact_validate.py ldvh-base --format text` 退出码 0，files=121 errors=0 warnings=112；warning 为既有 EVIDENCE_FORMAT_HINT。
  - 核心 Code 测试 81 passed。
  - Web typecheck 通过。
  - Web API 测试通过。

  ## 结论
  - 本轮当前文件事实源清理达到 review_needed；关闭仍需 Human 审核。
