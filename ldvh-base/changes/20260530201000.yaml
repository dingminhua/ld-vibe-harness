summary: 补充自建 MCP 的触发条件，集中说明何时应考虑或不应考虑自建 MCP
changes:
  - 新增 2.4 自建 MCP 的触发条件
  - 明确只有当 LDVH 特有程序辅助能力需要被 Agent 长期、结构化、权限受控调用，且第三方 MCP、Trae 内置工具、CLI、Skill 或 Web API 都不足以覆盖时，才应考虑自建 MCP
  - 补充应考虑自建 MCP 的条件表，包括 LDVH 特有语义、第三方 MCP 不可覆盖、内置工具语义不足、Agent 高频调用、结构化输入输出、权限最小化价值、事实源可追溯和底层能力可复用
  - 补充不应自建 MCP 的情况，包括一次性脚本、为智能化而 MCP 化、CLI/Skill/Web API/第三方 MCP 已覆盖、对象规范未稳定、重复实现 tools 逻辑、维护独立权威数据存储和输出不可追溯
reason: 原文已分散说明自建 MCP 的价值、候选能力和 MCP 化准入条件，但缺少集中回答“什么情况下需要自建 MCP”的决策入口
impact:
  - specs/evals/07-LDVH自建MCP评估.md 的自建 MCP 决策规则更集中清晰
  - 不改变正式规范，不将 evals 结论升级为强制规则
  - 为后续评估是否自建 MCP Server 提供更明确的判断依据
