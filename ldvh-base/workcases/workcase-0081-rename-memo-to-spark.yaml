id: workcase-0081
type: workcase
title: 将 Memo 重命名为 Spark 并确立火花捕获入口
goal: |
  将 Memo 重命名为 Spark 并确立火花捕获入口
status: human_closure_confirming
created: '2026-06-21T05:33:56+08:00'
updated: '2026-06-21T06:18:41+08:00'
priority: P1
description: |
  本计划承接 LDVH active 工作模型中的 Memo / 备忘重命名与语义升级。

  当前 Memo 已经承担工作推进中大量未定型输入的第一承载点：临时问题、分支研究线索、风险感觉、设计灵感、执行缺口、命名疑虑和后续待判断点都可能先进入 Memo，再分流为 WorkCase、ADR、Study、Pitfall、docs 或废弃。用户指出创造 Memo 的入口非常多，且 Web 中唯一可由 Human 创建的工作对象也是 Memo；在 vibe coding 语境下，Memo 的“备忘”语感已经不足以表达这个最小捕获入口。

  目标命名倾向为 Spark / 火花：Spark 表达工作推进中刚出现、尚未归类但值得系统接住的最小未定型工作信号。它可以从一句话开始，后续被研究、分流、承接或丢弃；这比 Memo 更适合 Web 的 Human 直接创建入口，也更符合 vibe coding 的工作流心智。
success_criteria: |
  - [x] Human 明确确认正式命名采用“火花”，Web 中也显示为“火花”
  - [x] Human 明确确认一次性迁移对象身份、文件名、目录名、字段名和 Web API，不保留旧 Memo 当前入口
  - [x] Human 明确确认 Web 入口动作词采用 `Create Spark / 创建火花`
  - [x] 形成 Memo -> Spark 的迁移方案，覆盖规范、事实实例、字段关系、Code、Web、测试和历史追溯边界
  - [x] `specs/02-术语规范.md` 纳入 Spark / 火花术语归口或明确无需新增术语，避免 24/08 并行维护同一术语定义
  - [x] `specs/20-Spark-火花.md` 承接 Spark 工作模型规范，并同步 `ldvh_doc`、`ldvh_member`、实例目录、对象定位、状态机、对象关系和 Human Gate
  - [x] 字段注册与字段语义同步处理为 `related_sparks`、`source_sparks`、`spark-*`、`ldvh-base/sparks/` 等 Spark 口径
  - [x] 现有 Spark 实例和所有相关对象引用完成迁移，不保留旧 Memo 当前入口
  - [x] Code 工具、校验器、CLI、Web API、Web UI、测试夹具和文案同步 Spark 口径
  - [x] Web 的 Human 直接创建入口明确改为捕获 Spark，并说明 Human 无需预先判断 WorkCase、ADR、Study 或 Pitfall 类型
  - [x] 执行前生成迁移 manifest，覆盖旧 memo 文件、结构化引用字段、正文引用、Web/API/测试命中；执行后用残留扫描逐项对账
  - [x] active surface 残留扫描完成；除本 WorkCase 迁移说明和方案审核历史语境外，不再残留会误导当前模型消费的 Memo 当前口径
  - [x] 相关 specs 校验、事实源校验、Code 测试和 Web 构建/测试按实际变更范围执行并记录证据
source: |
  Human 在 2026-06-21 与主控讨论 Memo 命名时指出：现在的 Memo 越来越成为所有工作的开始；工作推进中会不断出现忽然想到的问题，需要记录或安排分支研究；Web 中唯一可由 Human 创建的对象也是 Memo。主控建议在 vibe coding 语境下将该对象升级命名为 Spark / 火花，用于承载最小未定型工作信号和 Web 捕获入口。Human 随后要求梳理改动事项，并在确认 Git 干净后要求“你建立workcase吧”。

  Human Gate 记录：
  - 触发原因：创建独立 WorkCase 承接 active 工作模型 Memo 的重命名与语义升级。
  - 影响范围：工作模型规范、字段注册、ldvh-base 事实实例、对象引用、Code 校验与 CLI、Web 创建入口、Web 展示、测试和迁移追溯。
  - Human 结论：批准建立 WorkCase。
  - 当前边界：本计划先承载迁移方案与执行编排；正式执行重命名前仍需 Human 明确确认最终名称、迁移策略和是否保留兼容期。
  - 方案审核补充边界：未进入 `executing` 前，不得执行 `specs/24` 重命名、`ldvh-base/memos/` 目录移动、`memo-*` 实例改名、字段名迁移或 Code/Web 同步修改。
plan_confirmed_at: '2026-06-21T05:47:26+08:00'
