id: memo-0017
type: memo
title: 10 号 Git 提交规范落地资产边界待收敛
status: pending
created: '2026-06-20T04:33:49+08:00'
updated: '2026-06-20T04:44:36+08:00'
description: |
  本 Memo 承载一个需要后续收敛的规范落地问题：`specs/10-Git提交规范.md` 已经明确 commit message 的行业规范基础、body 语义清单、Code 预检和 Web 展示边界，但真正安装后落地不应只依赖 AI 自觉或手动命令。

  当前讨论结论：

  1. 10 号规范的提交门禁是安装后必须落地的保障，不应只被写成可选候选；
  2. Git `commit-msg` hook 属于提交发生时的确定性门禁，用于调用 `code/commit_validate.py` 阻断硬 error；
  3. Skill 也需要纳入落地资产，因为用户最担心的是 AI 行动时误解规范要求。Skill 负责把 10 号规范转成 AI 可执行流程，而不是等提交时才由 hook 拦截；
  4. Code 负责机械检查，Web 负责展示提交说明，Rules 负责让 AI 在准备提交、审计提交或追溯事实源时能定位 10 号规范和对应 Skill；
  5. 04.02 当前仍写着“LDVH 当前不维护固定 Skill 文件资产”和“LDVH 当前不维护固定 Hook 文件资产”，这与 10 号规范提出的必落地提交门禁存在张力，需要重新区分“Codex 环境 Hook 候选”和“Git 提交门禁必备资产”。

  初步资产分工：

  1. Code：`code/commit_validate.py` 作为确定性检查入口，检查首行格式、type、description、body 必填、明显空泛 body、命令清单、文件清单和私有 trailer warning；
  2. Git Hook：仓库级 `commit-msg` hook 作为安装后必落地门禁，提交时调用 Code 预检；
  3. Skill：建议形成 `ldvh-git-commit` 或等价 Skill，承接 AI 准备提交时的流程：读取 staged files、判断是否拆提交、选择单一 type/scope、生成结构化 body、处理合法 footer、运行预检并根据 error/warning 修正；
  4. Rules：维护入口和工作区入口应提示准备提交时读取 10 号规范或进入对应 Skill；
  5. Web：继续展示完整 body 清单和提交详情，不承担门禁。

  后续需要收敛的问题：

  1. 是否先修改 04.02，允许正式规范提出必落地要求时维护固定 Skill/Hook 资产；
  2. 是否同步 01 中 `hooks/` 和 `skills/` 目录定位，区分必落地资产、候选环境适配资产和说明性资产；
  3. 是否为 10 号规范创建 `skills/ldvh-git-commit/SKILL.md`；
  4. 是否为 10 号规范创建 `hooks/git/commit-msg`、安装脚本和检查脚本；
  5. 是否需要 WorkPlan 承接这一组落地动作，避免在对话中零散修改。

  新增待讨论的资产治理层问题：

  1. 标准缺口：需要确认 `rules/`、`skills/`、`agents/`、`hooks/` 是否已经分别具备最佳实践级别的规范标准；若没有，应补齐资产类型规范，而不是只靠单个资产样例；
  2. 生成质量：这些 LDVH 资产本身通常由 AI 按规范生成，因此不仅要有格式标准，还要有高标准、多视角审核要求，覆盖 Human、Code、Web、AI 执行和行业实践；
  3. 变更监督：当 specs 正式规范发生变化时，需要明确由哪条审核链路监督 rules、skills、agents、hooks、Code、Web 和部署入口同步更新，避免资产漂移；
  4. 事实源重复：40/41/42/43 这类审核流程、Skill 执行说明和 Rules 入口都可能复写正式规范内容，需要建立“薄引用 + 执行转换”的边界，避免把同一规范变成多重事实源；
  5. 部署分层：资产本身与环境部署不是一回事。LDVH 仓库内维护的是权威资产；不同运行环境中建立同名文件时，应通过薄引用指向权威资产，而不是复制并长期分叉。
