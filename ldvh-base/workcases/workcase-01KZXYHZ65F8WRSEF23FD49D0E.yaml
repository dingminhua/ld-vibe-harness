title: 让各 AI 平台显式检查并更新自身 LDVH Skill 与 Git Hook
status: closed
goal: 让当前 AI 环境显式传入自身平台标签与实际 Skill 路径，由 LDVH 程序检查并在授权后更新该 Skill，同时检查和升级当前项目 common-dir 的 Git Hook，并用机械护栏防止版本遗漏。
scope: 修改环境接入规范、附件、行动模板、README、LDVH launcher/Code、git-hooks-status、兼容检查工具、canonical Skill 与测试；仅同步 Human 明确传入的当前 Claude Skill 路径并检查当前仓库 common-dir。排除用户现有 web/api/services/facts.ts、web/src/pages/ObjectList.tsx、web/tests/api/fact-source-metadata.test.ts；不修改事实 Schema 或历史事实，不 push、不发布，只形成 canonical Skill 独立 commit 与其余实现 commit。
success_criterion_definitions:
- criterion_id: criterion-explicit-target
  statement: 稳定入口支持当前 AI 显式传入 platform 标签和绝对 skill_path，inspect→update→inspect 后目标 Skill 与 canonical 逐字节一致且当前 common-dir Git Hook 与期望版本对齐；缺少显式路径时不猜测厂商目录。
- criterion_id: criterion-safety
  statement: 只读检查零写入；无 Human Gate 的更新零写入；未知 Skill 或 Hook 资产冲突停止且不覆盖，Skill 与 Hook 的失败路径保留或恢复原状态。
- criterion_id: criterion-contract
  statement: git-hooks-status 机器契约返回当次显式平台和实际 Skill 路径，并以测试证明对齐结论只覆盖该目标。
- criterion_id: criterion-version-guards
  statement: 机械测试能够阻断 canonical Skill 正文变化未提升 Skill 版本，以及 Git Hook 渲染产物变化未提升 bundle 版本；两种资产版本保持独立。
- criterion_id: criterion-verification
  statement: 参数化、冲突、Human Gate、Hook 状态和端到端测试以及风险匹配回归通过，Ruff 与 ldvh check 结果如实记录。
- criterion_id: criterion-commit-boundary
  statement: git show 与 git status 可验证 canonical Skill 单独提交、其余实现另一个本地提交、两个提交均未 push，且用户现有三个 Web 修改未被暂存或提交。
