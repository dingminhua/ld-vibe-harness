id: pitfall-0001
type: pitfall
title: WorkCase 关闭必须显式写后续分流
status: active
created: '2026-06-26T08:32:13+08:00'
updated: '2026-06-26T08:41:08+08:00'
symptoms: |
  WorkCase 已进入 human_closure_confirming 或接近关闭时，表面上看起来所有字段都齐了，但只要 closure_evidence 没有明确写出“后续分流”与“收口结果”，就很容易把“还有尾巴”误判成“已经彻底收口”。
trigger_conditions: |
  1. WorkCase 关闭前只写“已完成”“可关闭”之类的叙述，没有单独的后续分流段。
  2. closure_evidence 只描述完成情况，没有明确说明后续承接对象、无后续分流或收口干净结论。
  3. reviewer 只检查字段存在，不检查 closing tail 的语义落点。
root_cause: |
  关闭证据长期偏向叙述式总结，缺少机械可检的 tail routing 约束；再加上历史对象允许把“后续再看”写进关闭收口段，导致尾巴责任没有被明确留痕。
resolution: |
  将 WorkCase 关闭证据硬性改成可检查的收口结构：至少显式写出“后续分流”和“收口结果”两个结论点。
  若当前目标已干净收口，则明确写“无后续分流，当前目标已收口干净”；若仍有尾巴，则明确写出承接到哪个 Spark、WorkCase、ADR 或其他后续对象。
verification: |
  ## 验证计划

  以 workcase-0011 的关闭收口过程为样例，验证关闭尾巴是否能被显式写入并被校验器识别。

  ## 验证命令

  ```bash
  python3 code/fact_validate.py ldvh-base/workcases/workcase-0011-multi-environment-hook-probe.yaml
  python3 code/fact_validate.py ldvh-base/pitfalls/pitfall-0001-workcase-closure-tail-routing.yaml
  ```

  ## 验证结果

  workcase-0011 已能通过校验；全量扫描 closing workcases 时仅保留一条非阻断顺序提示，说明尾巴分流内容已具备可机械检查的落点。

  ## 结论

  关闭收口不能只写“完成”，必须显式写后续承接或无后续分流，才能避免尾巴在关闭后失踪。
avoidance: |
  1. 每个进入 human_closure_confirming 的 WorkCase，都必须在 closure_evidence 里单独写“后续分流”与“收口结果”。
  2. 关闭证据若出现“后续再看”“保持关注”等模糊说法，必须改写为具体承接对象或干净收口结论。
  3. 关闭前同步检查 residual_risks 和 followup_refs，避免只在口头上承诺后续处理。
applicability: |
  这条经验适用于所有 LDVH WorkCase 的关闭收口阶段，尤其是已经完成执行、准备进入 human_closure_confirming 或 closed 的对象。
  不适用于仍在执行中的 WorkCase，也不替代规范层对状态机、验证证据和 Human Gate 的要求。
