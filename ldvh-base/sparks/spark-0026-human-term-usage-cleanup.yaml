      本次据审查结论修正阶段性原则：保留“用户”在安装者、环境所有者、项目所有者等非 Gate 身份中的语义；将 Code 生成限定为确定性派生输出、结构化结果或诊断；拆分 specs 主体与 Rules 入口主体；拆分环境、运行时扩展、固定能力资产和已部署副本；明确 MCP 归入运行时扩展承载物或具体能力资产名；补充子 Agent 不直接写入事实源、不独立决定状态流转、不拥有独立事实源状态。

