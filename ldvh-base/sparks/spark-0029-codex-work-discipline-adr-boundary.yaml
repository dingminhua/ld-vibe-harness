  Human 在 2026-06-25 指出：worktree 的工作纪律更适合放在 ADR，包括 Agent 的工作纪律，但要写清楚是 Codex 环境下；当前找不到合适位置来系统化这些规定，尤其包括 worktree、子 Agent 的工作纪律。因此要求先把这个问题一起放入 Spark，之后集中讨论。
