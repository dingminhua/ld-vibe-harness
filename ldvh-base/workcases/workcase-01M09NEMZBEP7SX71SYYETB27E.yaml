  outcome: satisfied
  summary: v7 protocol 冻结（schema_version=ldvh-knowledge-precheck-v7/1）：两阶段结构、per-family 门槛（ADR 漏检<=2/正确激活>=3/3、Pitfall trigger_correct>=4/6 且 unnecessary_f2<=2、总体 trigger_correct>=12/正确激活率>=6/9）、双条件、edge case、ceilings；闭集测试 13 项通过。
