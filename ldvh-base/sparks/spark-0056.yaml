title: 话题漂移中遗漏事实类型判断导致材料直写
status: implemented
disposition_summary: "31 号模板新增授权附件 31.Att.01（产出可沉淀材料时的类型判断），将 §5.3.B 的对象化与类型判断操作化为快速检查清单：包含触发条件、三步类型判断、各类型准入速查与操作指引；31 号模板 YAML authorized_attachments 与 §5.3.B 正文引用同步更新。经两轮 subagent 审核修正 5 项问题（类型优先级改为逐一排除互斥、补 05 回指、速查标注非完整、补归口说明、positioning 改写），并将 20–25 统一修正为 20–24、查重条件统一为「已检索，无重复」。"
intent: AI 在对话话题从'解释文本'漂移为'调研审计'时，未能触发事实类型判断仪式，导致可沉淀的调研材料被直写为临时文档而非受控事实对象；若不跨行动保留该缺口观察，后续类似场景仍会重复发生路径依赖、定性错误和模板绕行。
summary: "**当前判断**\n\n- 本次会话从'解释一句话'开始，话题自然漂移为'整理规范残留'；整理过程产出了包含发现问题、证据、分析和建议的完整材料。\n- AI 未在话题漂移时重新确认 LDVH 规则适用，也未在生成持久文档前判断事实类型，直接将材料写入 `docs/`（临时文档路径），而非经 31 号模板受控创建为 Study。\n- 该行为符合 24 §4 的 Study 准入条件（已完成、可独立引用、跨行动复读价值），但 AI 因路径惯性和定性错误而错过了对象化判断。\n\n**根因**\n\n1. 路径依赖：默认将产出放入 `docs/`，未触发 `ldvh-base/` 判断。\n2. 定性错误：因材料含'建议'而排除 Study，误解了 Study 可含建议分流的边界。\n3. 未重新确认规则适用：话题漂移后未按 SKILL.md 重新取得规则引导。\n4. 未走 31 号模板：未执行召回查重、Schema 校验和受控写入。\n\n**待判断**\n\n- 是否应将本次观察沉淀为 Pitfall 或工作流改进；\n- 是否需要在 SKILL.md 或规范中增加'话题漂移检测'的显式提示；\n- 是否建立'产出可沉淀材料时的自动类型判断'检查清单。"
