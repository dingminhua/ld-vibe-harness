id: spark-0048
type: spark
title: Codex lifecycle 验收与 PreToolUse 动作分类边界
status: pending
created: '2026-07-07T00:00:00+08:00'
updated: '2026-07-07T06:49:58+08:00'
description: |
  本 Spark 记录一个 Codex 环境 Hook 验收缺口：当前问题不是单个命令误拦，而是 Codex lifecycle Hook 的验收标准、PreToolUse 动作分类和 read_plan 消费链路边界混在一起，导致真实环境验收不断退化为逐条补命令白名单。

  当前已观察到的当次输出可以支持以下判断：
  - Codex PreToolUse 已在真实环境中触发，并能阻断命令；
  - 写入 smoke 命令被阻断，说明写入前阻断链路存在；
  - `runtime_adapter.py session-start` 能产出 `status=ok`、`event=session_start`、`dispatch_status=ok`、`receipt_id` 和 `Diagnostics: none`。

  但这些输出还不能支持以下声明：
  - 不能声明 Codex `session_start` 已完成真实环境 integrated；
  - 不能声明 Codex lifecycle Hook integrated；
  - 不能把 runtime adapter 手动或探针输出等同于目标环境自动 SessionStart 触发依据；
  - 不能把 PreToolUse 能阻断等同于 `SessionStart -> read_plan/receipt -> read_plan 消费 -> PreToolUse 正负例 -> Stop/completion` 同链路闭环。

  01 §6.6 已定义 environment Hook 当次判定为 integrated 的 6 项最小依据（安装与启用、session_start 真实触发、pre_tool_use 阻断含正例放行、completion 依据、payload 与 target、回滚）。本 Spark 不重定义该验收标准，而是在此基础上聚焦"同链路闭环"视角与动作分类缺口：真实 integrated 验收还需证明目标环境自然工作流中同一条 lifecycle 链成立——SessionStart 自动产生 read_plan/receipt；AI 对 read_plan 的消费依据能进入后续 PreToolUse；PreToolUse 对写入负例阻断、对满足条件的正例放行；Stop 或 completion 阶段能给出完成检查且不误阻断环境关闭。该判断只对当次目标环境、插件配置、payload、trust、LDVH root 和触发输出成立，不写成长期安装状态。

  当前 PreToolUse 分类也暴露出设计缺口。只读 shell 链、session_start 查询、runtime session-start 探针和子 agent 审核等非文件写入动作曾被按写入前检查处理，因缺 read_plan 消费依据或 target 归口被误阻断。继续逐条补白名单不能解决根因；需要明确动作分类原则，且分类依据必须是本次调用的 operation 与 target，而非工具名称——同一工具的只读调用与写入调用应走不同路径。只读调用（不产生文件写入、外部状态改变或完成声明风险）应允许执行，其放行不依赖 read_plan 消费证据，由主控 AI 对其过程输出作边界判断；写入调用才进入 PreToolUse 强制检查，并要求 read_plan 消费证据。

  Human 验收职责也必须维持清晰边界：Human 不应手动运行技术探针来证明 integrated，也不负责判断 pass / fail；Human 只负责在目标环境中用自然语言触发真实工作流，并贴回目标环境原始输出或说明未看到输出。AI 负责本地技术探针、输出判读、问题归类，并提出 integrated 判断的候选结论与依据；最终验收确认由 Human 完成，AI 不得单方面声明 integrated。
source: conversation
source_detail: |
  在 Codex lifecycle 验收过程中，Human 多次贴回真实环境输出：PreToolUse 阻断了写入 smoke，也误阻断了若干只读或协作类动作；runtime adapter session-start 探针能产出 receipt，但输出仍显示 adapter_integrated=false、environment_integrated=false。Human 追问为什么验收过程“兜兜转转”，并要求把待解决问题写清楚，便于询问其他 AI 是否同意当前判断。
