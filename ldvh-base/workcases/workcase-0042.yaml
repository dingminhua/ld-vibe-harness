title: 收敛 WorkCase 执行模板与 Controller 续跑纪律
goal: 将 34 收敛为只组织前置精确读取、执行循环、稳定检查点、合法退出和恢复交还的薄行动模板；要求 Controller 仅依据刚回读且来源指纹 current 的 current_snapshot_projection，在每轮重新判断语义、授权与能力后持续消费已获批责任，使普通活动期检查点不被当成完成交还，Reviewer 结果经完整 after、受控写回、精确回读和完整性审计连续收敛到真实 gate2_waiting；同时不持久化 continuation_required 或 execution_stalled，不让 Code 判断授权、能力、行动允许、优先级、工作完成或自动推进 phase。
scope: 覆盖 specs/06 的行动模板使用期最小临时工件卫生共同边界、specs/34 的五段执行内核与 21 current_snapshot_projection 消费纪律、编码前 Code Implementation Plan，以及直接相关的 clean action-template/source-contract、现有 WorkCase projection key 与 transition validator 回归测试。21 继续是 status、phase、字段、转换和 quality gate 语义唯一权威；34 只回指 21/32，不复制状态机。Reviewer pass 后的连续链按 independent_reviewing → controller_checking → closure_preparing → human_closure_confirming 逐步形成完整 after，每次使用 Helper CAS、精确回读和 check-fact-integrity 后的新指纹作为下一步输入。排除 production Code、新 Helper 操作、AI 自由文本机械拦截、Web 页面与 Web tests、specs/00/03/07/21/30/31/32、派生字段写入 WorkCase YAML、调度器/Hook/MCP/环境 adapter、其它事实对象、push、PR、发布、外部消息和破坏性 Git。specs/00 不在修改、暂存或提交范围；workcase-0036 至 0039 的创建前未跟踪 bytes/hash 严格隔离。
success_criterion_definitions:
- criterion_id: criterion-five-part-template-convergence
  statement: 34 的行动定义内核只组织前置精确读取、执行循环、稳定检查点、合法退出和恢复交还，并继续满足 06 要求的模板身份、适用、输入、验证、Human Gate 与 Stop Conditions 外层共同结构；字段、phase、转换和 quality gate 细节只回指 21/32，不在 34 建立第二份规则。
- criterion_id: criterion-fresh-projection-controller-loop
  statement: 34 明确要求 Controller 每轮以刚完成的 WorkCase 精确读取、content fingerprint 和 resolved current_snapshot_projection 为当前输入；stale 或 unresolved 先重新读取，仍失败则如实交读取缺口；blocked 只形成合法阻塞交还；其它 resolved 活动 phase 只能在 AI 重新判断语义、授权和能力后消费 next_required_control_step，不由 Code 或模板自动选 item、推进 phase 或断言完成。
- criterion_id: criterion-reviewer-pass-controlled-write-chain
  statement: 34 明确规定 Reviewer pass 不等于 Gate 2：从 independent_reviewing 返回后，Controller 必须按 21/32 逐步完成 controller_checking、closure_preparing 与 human_closure_confirming 的完整 after、Helper CAS、精确回读和完整性审计；未实际写回到 open/human_closure_confirming 的 gate2_waiting 前，聊天总结和 Reviewer 结论均不得表达仅剩 Gate 2 或关闭待确认。
- criterion_id: criterion-derived-state-and-code-boundary
  statement: 不新增或持久化 continuation_required、execution_stalled、下一动作或其它派生状态，不新增 production Code、公开 Helper 操作、调度器或 AI 自由文本检查器；测试只验证行动模板 source contract、现有投影 key 负矩阵和 transition validator，不声称机械保证 AI 跨回合遵从、授权充分或工作完成。
- criterion_id: criterion-common-hygiene-and-dirty-isolation
  statement: 06 只承接最小通用临时工件卫生：优先 Working Tree 外，只有现有授权覆盖、本次可确认归属且无继续或恢复价值的工件可清理，既有、他项、归属不明或仍有价值者保留交还，Working Tree 非空不等于未闭环。实施前后 Index 均为空，specs/00 的 Working Tree bytes 与 HEAD blob 保持固定 hash，workcase-0036 至 0039 的创建前 bytes/hash 与未跟踪状态不变，普通文件 diff 只落入批准白名单。
success_criterion_results:
- criterion_id: criterion-five-part-template-convergence
  outcome: satisfied
  summary: 34 定义内核已精确收敛为五个 H3 流程段，外层身份、验证、Human Gate 与 Stop Conditions 保留；字段、phase、转换和 quality gate 继续回指 21/32。
- criterion_id: criterion-fresh-projection-controller-loop
  outcome: satisfied
  summary: 34 已要求刚精确回读内容指纹与 resolved projection 来源指纹匹配；stale/unresolved 先重读，blocked 单独分流，结构提示不替代 AI 的语义、授权与能力判断。
- criterion_id: criterion-reviewer-pass-controlled-write-chain
  outcome: satisfied
  summary: 34 已明确 Reviewer pass 不等于 Gate 2，并要求 feedback 处置、完整 after、Helper CAS、精确回读和独立完整性审计连续收敛到真实 Human 关闭确认，禁止聊天总结代替转换。
- criterion_id: criterion-derived-state-and-code-boundary
  outcome: satisfied
  summary: 未新增 production Code、Helper 操作、Web 或持久派生字段；source-contract 与既有 projection/transition tests 只验证文本和确定性接口，不声称机械控制 AI 自由文本、授权或完成。
- criterion_id: criterion-common-hygiene-and-dirty-isolation
  outcome: satisfied
  summary: 06 §8.7 已承接最小临时工件共同边界，34 只回指；specs/00 与 workcase-0036 至 0039 的 bytes/hash 和状态保持创建基线，Index 为空，目标普通变化仅落入批准白名单。
result_summary: 已形成 WorkCase Controller 续跑与模板收敛增量：06 承接最小临时工件共同边界，34 收敛为五段流程并绑定刚回读投影、合法退出和 Reviewer 后连续受控写回；新增 Code plan 与独立 source-contract tests，未修改 production Code、Web、21 或受保护用户工作。
validation_summary: 139 个目标 Python/spec/Helper tests passed；git diff --check passed；WorkCase 执行模板经 Helper 精确回读；当前事实库完整性 complete（118 个对象）；Index 为空；specs/00 Working Tree/HEAD hash 与 workcase-0036 至 0039 未跟踪 hash 均保持批准基线。未运行 Web tests，因为 Web 明确排除；未验证 AI 在未来会话中的自然语言遵从。
