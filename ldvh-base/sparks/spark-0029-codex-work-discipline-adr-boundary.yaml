title: Codex 环境下工作树与子 Agent 工作纪律的 ADR 沉淀边界
status: pending
created: '2026-06-25T05:45:00+08:00'
updated: '2026-06-25T05:45:00+08:00'
description: |
  本 Spark 记录一个治理议题：LDVH 在 Codex 环境下已经开始使用 worktree、子 Agent、新建对话、主控合并和完成后回调等能力，但这些能力的“工作纪律”暂时找不到合适的系统化承载位置。

  Human 当前判断：

  1. worktree 的工作纪律更适合沉淀到 ADR 或由 ADR 承载决策边界，而不是直接散落在一次性 WorkCase 记录里。
  2. 子 Agent / Agent 的工作纪律也应纳入同一问题域，包括启动时必须读取 AGENTS.md、LDVH workspace/maintainer 入口、写入范围限制、不得回退他人修改、完成后必须回调主控、提交与验证要求等。
  3. 这些纪律必须写清楚适用环境是 Codex 环境，不能泛化为所有 AI 工具、所有 CLI 或所有 Agent 平台的通用规则。
  4. 当前还不急于决定它应直接成为 ADR、行动编排成员、Rules 入口要求、Skill/Agent 指令，还是工作区项目规则；应先作为 Spark 收集问题，再集中讨论。
  5. 该问题与 `spark-0027`、`workcase-0009` 有关，但不等同于“如何利用 Codex 能力”的行动编排落地。这里关注的是纪律和决策沉淀边界，尤其是哪些规定应进入 ADR，哪些应进入行动编排或环境入口。

  当前已观察到需要收拢的纪律点：

  - worktree 使用纪律：何时必须使用独立 worktree，何时可用同目录只读子 Agent，何时应避免并行写入。
  - 子 Agent 启动纪律：必须读取工作区 AGENTS.md、仓库 AGENTS.md、LDVH-WORKSPACE-ENTRY 和 LDVH-MAINTAINER-ENTRY。
  - 写入边界纪律：每个子 Agent 必须有明确允许写入范围，不得回退、覆盖或改写其它 Agent / Human 的修改。
  - 回调纪律：子 Agent 完成后必须向主控回调，报告 worktree 路径、修改文件、验证结果、是否提交和 commit hash。
  - 主控纪律：主控负责合回、冲突处理、集成验证、最终状态汇总和 Human Gate 判断，不得把子 Agent 的局部结论直接当作主仓库完成状态。
  - Codex 环境限定：上述纪律只针对当前观察到的 Codex App / Codex worktree / multi-agent 工具能力；若迁移到其它环境，需重新判断能力边界。

  后续集中讨论应回答：

  1. 是否为 Codex 环境工作纪律建立 ADR？
  2. ADR 应只记录决策边界，还是也承载可执行纪律清单？
  3. worktree / 子 Agent / 新建对话 / 回调 / 合并验证哪些内容应进入行动编排，哪些应进入 Rules 或 Agent 指令？
  4. `workcase-0009` 的 Codex 并行执行编排是否应引用该 ADR，还是该 ADR 只作为环境纪律决策来源？
  5. 如何避免把 Codex 环境能力误写成 LDVH 全环境通用规则？
source: conversation
priority: P1
