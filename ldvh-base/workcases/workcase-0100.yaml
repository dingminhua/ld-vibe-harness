status: closed
title: 让缺少 change_log 的事实对象在首次真实更新时建立流水
goal: 使任何满足结构与 HEAD 历史基线的既有事实对象，可在原本合法的首次真实受控更新中建立恰好一条当前三字段 change_log，而不使用对象编号名单、不恢复未知历史、不放宽类型生命周期。
scope: 修改 specs/05、21、32 与 05.Att.01 的最小规则增量；修改 facts validation、HEAD 基线读取、通用更新与 WorkCase 专属更新实现及相关 tests。判断只依赖当前 Working Tree before、同路径 HEAD before、fingerprint 与原类型规则。保护现有未提交修改；不迁移任何真实 legacy 对象，不更新 spark-0018，不执行 git commit/reset/stash/push/发布或外部写入。
success_criterion_definitions:
- criterion_id: criterion-first-log-contract
  statement: 当前规则明确允许 HEAD 与 Working Tree before 都机械有效且完全缺少 change_log 的既有对象，在本来合法的一次真实更新中建立恰好一条当前三字段流水，并明确第一条不是创建记录或完整历史。
- criterion_id: criterion-structural-history-gate
  statement: 实现不含对象 ID、日期或类型实例 allowlist；HEAD 已有流水但 Working Tree 删除、HEAD 不存在/不可读/无效、旧署名、空或多条首写均零写入拒绝。
- criterion_id: criterion-lifecycle-preservation
  statement: Spark、ADR、Pitfall、Study 与 WorkCase 原有操作只在其既有类型、状态、字段所有权、授权和生命周期规则成立时支持首写；缺少流水不授予其它更新、重开或终态回写能力。
- criterion_id: criterion-write-transaction
  statement: 首次流水复用现有三字段 observed_context 注入、共享锁、完整 after、fingerprint CAS、事件时间绑定、原子替换、精确回读、条件回滚与独立完整性审计。
- criterion_id: criterion-regression-isolation
  statement: 定向与完整 Code 回归、规则检查、Ruff、ldvh check 和 diff 检查形成实际结果；现有并行 dirty baseline 与真实 legacy 对象保持隔离且无 Git commit。
success_criterion_results:
- criterion_id: criterion-first-log-contract
  outcome: satisfied
  summary: 规则已定义 HEAD 与 Working Tree before 都机械有效且完全缺少 change_log 时，在本来的真实更新中建立恰好一条当前三字段流水；21/32/05.Att.01 同步。
- criterion_id: criterion-structural-history-gate
  outcome: satisfied
  summary: 实现仅依赖当前 before、同路径 HEAD before 与 fingerprint，无对象编号 allowlist；删除历史、新文件、不可用或旧署名均零写入拒绝，已由 facts 与 Helper 正反例锁定。
- criterion_id: criterion-lifecycle-preservation
  outcome: satisfied
  summary: 通用 update-fact-object 与全部 WorkCase 专属模式保持原类型、状态、字段所有权与 Gate；closed 更正只允许终态事实更正，不重开不回写。
- criterion_id: criterion-write-transaction
  outcome: satisfied
  summary: 首写复用三字段 observed_context 注入、共享锁、完整 after、fingerprint CAS、事件时间绑定、原子替换、精确回读与独立完整性审计；已有流水仍恰追加一条。
- criterion_id: criterion-regression-isolation
  outcome: satisfied
  summary: 完整 Code 测试 1695 passed、17 skipped；Ruff、ldvh check（facts complete 216）与 git diff --check 通过；真实 legacy 对象与并行 dirty baseline 保持隔离，无 Git commit。
result_summary: 已交付受控能力：HEAD/WT 双基线下，缺失 change_log 的既有事实对象可在原本合法的首次真实更新中建立恰好一条当前三字段流水；五类事实与全部 WorkCase 专属模式接入，历史删除/新文件/不可用 fail closed，普通更新默认拒绝保持不变。
