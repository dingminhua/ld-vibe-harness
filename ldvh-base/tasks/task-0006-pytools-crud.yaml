title: PyTools 承接生产对象增删改查
status: planned
created: 2026-06-04
updated: 2026-06-04
description: |
  当前 Skill（ldvh-intake、ldvh-close、ldvh-adr、ldvh-commit）直接写 YAML 文件，
  缺乏确定性校验和原子性保证。PyTools 应承接生产对象的 create、transition、delete
  等确定性操作，Skill 只做流程编排和 PyTools 调用。

  目标：
  1. 为 7 个 active fact model（Intent/Task/ADR/Change/Memo/Profile/Pitfall）
     提供 create/transition/delete PyTools 命令
  2. 命令封装多文件写入（如 ADR YAML + Change YAML）为原子操作
  3. 命令消费 Contract 子文档做字段校验和状态机校验
  4. Skill 流程中调用 PyTools 命令替代直接写 YAML
source_intent: intent-0003
