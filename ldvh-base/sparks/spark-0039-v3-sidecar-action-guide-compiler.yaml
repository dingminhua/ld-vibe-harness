    summary: |
      根据 Human 澄清，修正 v3 定位：不是实验后回灌 v2，而是 specs 与 Code 两块正式重构线。v2 保持当前稳定运行；v3 聚焦解决 specs 膨胀、重复、知识地图概念局限和 Code 编译链升级；`rules/`、`hooks/`、`skills/`、Runtime、Web、`ldvh-base/` 等其他构成面暂不重构、不改变策略，待 specs + Code 成熟后再整体迁移。
  - at: '2026-06-28T03:40:00+08:00'
    summary: |
      根据 Human 纠偏，记录新的核心约束：v3 不应把 Human、AI、Code 拆成多套并列事实源。正确方向是同一篇 Markdown 规范事实源共用，通过稳定结构和显式引用关系支持不同消费方式。Human 看目标、边界、风险、Gate 和验收判断；AI 看行动规则、读取对象、停止条件、验证和回写要求；Code 看 identity、状态、父子关系、字段闭集、章节角色、source refs 和 schema。附件必须回到正文附属材料位置，只放正文引用的表、图、字段闭集、枚举或复用型机器契约；不得承载正文级规则、上位原则、行动流程、Human Gate 或大段解释。v2 的膨胀教训是 AI 把简单问题复杂化，把附件和正文都写成长规范；v3 应以少解释、多结构、少附件、多引用、少手写清单、多 Code 生成作为后续约束。
  - at: '2026-06-28T04:02:00+08:00'
    summary: |
      根据 Human 总纲，补充 v3 正式工作方式：所有行动都必须先围绕目标和价值判断，再进入方案和文件写作。正式 specs / Code 设计前必须输出价值门：目标、服务价值、减少的 AI 负担、单一事实源判断、附件边界、Code 确定性边界、Human Gate、kill point 和下一步只做什么。正式 specs 改写前必须先有 v2 到 v3 的映射表；没有映射表或映射表未通过，不写正文。章节本身也必须是价值工具，每一章都要能说明它减少哪类 AI 负担、服务什么价值；否则应删除或合并。
  - at: '2026-06-28T04:40:00+08:00'
    summary: |
      根据 Human 对 00/01 设计讨论的纠偏，补充 v3 specs 的保障登记要求：规范不能只提出要求，还必须登记该要求的保障需求、当前保障状态、承接位置和未完成时的推进限制。后续 01 若提出 identity、role_sections、附件边界、formal review gate、Code 覆盖、warning 分流或 Action Guide 输入等要求，必须说明靠什么被 AI 遵守、被 Code 或等价机制检查、被 Human Gate 审核，不能检查时由哪个对象、规范或 WorkCase 承接。未登记保障需求和状态的规则，不得被后续规范、行动指南或 Code 当成已经落地的能力使用。
