title: 关闭 WorkCase 候选 after 的只读确定性投影
status: implemented
intent: 保留 WorkCase 关闭时已由规则定义、但只能由调用方重复组装的 closed after 候选投影问题，避免多个脚本各自复制字段映射而与 close-workcase 校验漂移。后续需判断是否应提供严格只读的候选投影操作，以及它如何复用关闭校验的同一纯映射而不生成事实、推断 Human 决策或取得关闭授权。
summary: "## 当前结论\n\n- `prepare-closed-workcase-candidate` 已作为只读 Helper 操作实现，用于从当前机械有效的 Gate 2 source 快照和既有 `closure_proposal` 确定性投影完整的 closed after 候选，并返回 source fingerprint 与已保存的目标映射基础。\n- 候选投影与 `close-workcase` 复用同一内部纯映射，避免调用方胶水和关闭校验形成两套字段映射或状态机；对应的定向请求、操作和负向边界测试已落地。\n\n## 保留的硬边界\n\n- `close-workcase` 仍是唯一的受控关闭写入口。候选操作不写入事实、不预留状态、不生成或推断 Human Gate 2 决定，不替代目标当前状态和指纹核对。\n- 实际关闭仍必须由调用方重新取得当前 before、Human 关闭决定、授权引用和 route target 指纹，并通过 `close-workcase` 完成 CAS、目标检查、写后回读与完整性审计。\n\n## 处置范围\n\n本 Spark 原始信息需求已由上述直接实现完整落实，不再承担独立的待判断、待分流或待实施责任；下游 WorkCase 的关闭、目标状态和后续生命周期不由本 Spark 继续跟踪。"
