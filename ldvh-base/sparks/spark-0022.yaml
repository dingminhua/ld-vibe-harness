title: 多人未同步时的事实对象 ID 冲突提交 Gate
intent: 保留多人、多 clone 或多分支未同步时，提交包含事实对象的变更如何发现远端同 ID 冲突并交由 Human 处置的问题，避免仅等待 merge/push 冲突、静默改号、自动覆盖或在远端新鲜度未证明时宣称无冲突。后续需判断范围匹配 Gate 与改号/合并处置的可靠边界。
status: open
priority: P1
source_refs:
- kind: human-input
  locator: 2026-07-21 Human：你创建一个spark，如果提交的时候，事实对象发现分枝上已经有对应的id了，比如这次要提交spark21，提交的时候发现已经有了，那么要报告让人决策是否改变编号，这个能做到吗？
- kind: human-input
  locator: 2026-07-21 Human：我的意思是提交的时候，比如几个人协作的时候，因为都没有拉去最新的代码，提交的时候要能够发现
- kind: human-input
  locator: 2026-07-21 Human：只有含有事实对象的时候才会需要有这个流程，这点有明确吗，并不是所有的提交都要做这个步骤，事实对象就是ldvh-base里的内容
summary: "**适用范围**\n\n- 仅当 Git Index 候选快照包含 `ldvh-base/**` 事实对象路径时，提交边界才进入远端刷新与事实对象身份冲突流程。\n- 普通 Code、Web、规范、文档或其它不包含 `ldvh-base` 内容的提交必须跳过该流程，不增加网络访问或 Human Gate。\n\n**冲突判断与交还**\n\n- 多人、多 clone 或多分支协作时，各方可能在未获取目标远端分支最新状态的情况下合法分配相同 `object_id`。\n- Gate 应先刷新或明确验证目标远端 ref 的新鲜度，再将 Index 中的事实对象身份与目标树全局扫描比较。\n- 若同一 ID 已存在且不是同一对象，必须停止受影响提交，报告远端 ref/commit、双方 canonical path、内容指纹与引用差异，交由 Human 决定改号并迁移引用、更新既有对象、拆分/合并或取消。\n\n**边界**\n\n- 不得自动覆盖、静默改号或只等待 merge/push 冲突；无法刷新或证明远端 ref 新鲜时也不得宣称无冲突。\n- 改号必须同步文件名、对象内 `object_id`、`source_refs`、`evidence_refs` 与 `relations` 的相关引用，并完成回读验证。"
