status: closed
title: 落地 WC 独立复核流程到规范与实现
goal: 把 2026-08-14 对话定稿的 WC 独立复核流程(独立复核=独立上下文+多身份+指定模型;三档载体;三段复核;轮次上限;item 关键审核;review 分歧以主控意见为主)落地为 LDVH 规范修订与 code 实现。
scope: 实质改写 specs/21 §4.5/§4.5.2:轮次上限(创建最多2轮、结果最多3轮)、item 执行阶段新增关键 item 局部独立审核(仅关键 item 审1次;结果复核覆盖范围不变,仍按 21 §6.6 覆盖全部 terminal item)、每轮视角数量约定(1–2 个)。澄清 specs/34 §5:独立复核语义、review 分歧以主控意见为主。code 实现:能力预检、降级链、max_perspectives 冻结的机械约束,含 code/tests/ 测试。docs 平台卡定稿。排除:push、PR、发布、外部消息、破坏性历史改写、与独立复核无关的功能改动。
