type: change
title: 将模型子文档六槽位实践上升为通用规范并修复 ADR 子文档
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  specs/51-multi-role-thinking-多角色思考.md 已采用 51.01-51.06 六槽位完整实践：用到的机制创建 active 子文档，暂不实现的机制创建 active-prep 或不创建说明型子文档。
  specs/04-LDVH模型子文档规范.md 此前仍保留按需创建表述，导致 ADR 对象模型出现主文档状态、子文档文件和实体实现不一致的问题。
  ADR 已存在 tools/adr_index.py 和 21.06-Contract.md，但 21 主文档仍将 Tools 和 Contract 标为 planned，且缺少 21.03-Agent.md、21.04-Tools.md 和 21.05-Web.md。
decision: |
  1. 更新 specs/04-LDVH模型子文档规范.md，将六槽位完整实践上升为通用规则。
  2. 明确规范模型完成落地初始化后，NN.01-NN.06 均应有显式结论和对应子文档，状态应为 active、active-prep 或 not-created，不得保留 planned。
  3. 更新 specs/21-ADR-决策记录.md 的附件型实践子文档清单、落地前决策、落地初始化、落地审计、合规检查和待补齐事项。
  4. 将 21.02-Skill.md 调整为 active-prep 语义，明确当前不创建 Trae Skill 实体。
  5. 新增 21.03-Agent.md、21.04-Tools.md 和 21.05-Web.md，补齐 ADR 六槽位子文档。
consequences: |
  - 后续事实模型和行动模型完成落地初始化时，应按六槽位完整实践创建或说明 NN.01-NN.06 子文档。
  - planned 状态只能用于落地前决策尚未完成或初始化尚未执行的临时规划阶段。
  - ADR 的 Tools、Skill、Agent、Web 和 Contract 状态与实际文件及实体实现说明保持一致。
  - ADR Tools 实现 `tools/adr_index.py` 的职责边界和验证方式由 21.04-Tools.md 承接。
affects:
  - specs/04-LDVH模型子文档规范.md
  - specs/21-ADR-决策记录.md
  - specs/21.02-Skill.md
  - specs/21.03-Agent.md
  - specs/21.04-Tools.md
  - specs/21.05-Web.md
