id: adr-0007
type: adr
title: 以成员自描述和Code派生集合替代手写索引文档
status: accepted
created: '2026-06-15T02:18:50.972816'
updated: '2026-06-15T02:24:34.664621'
date: '2026-06-15T02:18:50.972816'
context: |-
  Human Gate 确认记录：用户在当前会话确认创建 proposed ADR，用于记录删除 03.02、20、40 的长期架构决策。\n\n当前 LDVH 为工作模型集合维护 20 工作模型集合索引，为工作流程集合维护 40 工作流程集合索引，并为这两个索引维护 03.02 索引文档规范。Human 指出当前没有其他索引文档，03.02 主要是为了 20/40 而存在；20/40 又持续复制维护具体工作模型和工作流程成员清单、状态、关系和候选信息，形成第二事实源。\n\n00 已要求 Code 承担解析、索引、聚合、校验和上下文压缩，且反复跨文档聚合同类信息时应优先工具化。09 已要求同一事实只能有一个权威位置，其他位置只能引用、摘要或聚合。\n\n本 ADR 替代 adr-0005 中保留 20 工作模型集合索引和 40 工作流程集合索引的编号区段设计，重新定义工作模型和工作流程编号区段与集合索引承载方式。
  [Human Gate 确认记录: 确认人=用户, 确认时间=2026-06-15T02:18:50.972816, 确认上下文=用户确认创建 ADR：最终删除 03.02、20、40；工作模型从20到39，工作流程从40到59；集合内容由 Code 读取成员对象内容派生。]
  [Human Gate 确认记录: 确认人=用户, 确认时间=2026-06-15T02:24:34.664632, 确认上下文=用户回复“都同意，按你计划执行”，确认接受 ADR-0007 并开始第一批规范契约迁移。]
decision: 删除手写集合索引文档方向：\n\n1. 不再保留 20 工作模型集合索引和 40 工作流程集合索引作为独立手写规范文档。\n2. 不再保留 03.02 索引文档规范；若当前没有其他索引文档，索引文档不作为独立文档类型继续维护。\n3. 工作模型编号区段改为 20-39，20 不再被集合索引占用；20-39 均可用于具体工作模型规范。\n4. 工作流程编号区段改为 40-59，40 不再被集合索引占用；40-59 均可用于具体工作流程规范。\n5. 工作模型集合事实由 20-39 各具体工作模型主文件自描述承担，具体契约写入 03.03 工作模型文档规范。\n6. 工作流程集合事实由 40-59 各具体工作流程主文件自描述承担，具体契约写入 03.04 工作流程文档规范。\n7. Code 依据 01 编号分区、03.03/03.04 自描述契约、05/06 基础规则和 09 事实源边界生成派生集合索引、状态清单、冲突诊断和 AI Context Pack。\n8. Code 输出只作为派生视图、导航结果和诊断结果，不成为最终事实源；成员编号、标题、状态、路径、可执行性和规则锚点以成员主文件为权威来源。\n9. 删除 20/40/03.02 前，必须先完成 specs 引用迁移、成员自描述契约落地、Code 派生索引能力和校验能力落地，并通过 Human Gate。
consequences: 积极后果：\n- 消除 20/40 与具体成员文档之间的第二事实源和同步漂移。\n- 让每个工作模型或工作流程主文件成为自身集合事实的唯一权威承载位置。\n- 让 Code 承接反复聚合、状态汇总、编号检查和 AI 上下文压缩，符合 00 对 Code 的定位。\n- 03.03 和 03.04 成为成员自描述契约入口，03.02 不再为少数索引文档单独存在。\n- 工作模型可以完整使用 20-39 编号，工作流程可以完整使用 40-59 编号。\n\n消极后果和风险：\n- 需要迁移 01、03、03.01、03.02、03.03、03.04、05、06、07、09、Rules 入口以及现有 20/40 引用。\n- 删除 20/40 前，AI 入口和 Code 若未同步，会短期失去集合清单定位能力。\n- 需要为 20-39 和 40-59 成员主文件设计稳定、可机械校验的自描述字段。\n- Code 派生索引不可被误读为最终事实源，必须持续回指成员主文件。\n\n迁移约束：\n- 先改规范契约，再补成员自描述，再实现 Code 派生索引和校验，最后删除 03.02、20、40。\n- 迁移期间 20/40 只能作为待删除旧入口，不再新增新的集合事实。\n- 任何编号区段变更、文件删除和 accepted ADR 替代都必须经过 Human Gate。
