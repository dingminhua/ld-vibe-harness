title: 将项目 worktree 误作 workspace_root 会误报配置缺失
status: active
symptoms: Helper 返回 config_status=missing 与 scope_status=scope_unknown，并说明未选择任何 governed-projects configuration；但父工作区实际存在有效的 LDVH-GOVERNED-PROJECTS.yaml，且当前项目已在其中登记。
trigger_conditions: 调用管辖解析或依赖其结果的事实读取操作时，显式传入 workspace_root；该值是项目 Git worktree 根，而 LDVH-GOVERNED-PROJECTS.yaml 位于父工作区根。
applicability: 适用于 LDVH Helper 的 workspace_root 被显式指定，且该目录本身不含 LDVH-GOVERNED-PROJECTS.yaml、配置位于上级工作区目录的场景。它不适用于配置确实不存在、配置无效或冲突，或 Human 有意选择另一个 workspace root 的情况。
root_cause: workspace_root 的语义是精确选择本次唯一工作区根；显式提供时 Helper 只读取该目录下的 LDVH-GOVERNED-PROJECTS.yaml，不执行从项目 worktree 向上搜索。因此把项目根误当作配置根，会把父目录中存在的配置如实报告为未选择。
resolution: 在本项目中已改用不传 workspace_root 的自动发现方式；Helper 从当前工作对象向上发现父工作区配置，并返回 config_status=valid、scope_status=governed_single、governed_project_id=ldvh。需要显式选择时，将父工作区根而非项目 worktree 根作为 workspace_root。
avoidance: 调用前区分项目实际 Git worktree 与存放 LDVH-GOVERNED-PROJECTS.yaml 的工作区根。除非需要固定选择配置根，否则省略 workspace_root 并传入实际 work object locator；若显式传入，先确认目标目录直接包含配置文件。出现 missing 时先检查实际选择路径和配置位置，再判断配置是否真的缺失。
validation_summary: 2026-07-30 在 ld-vibe-harness-v4 实际验证：1) 显式 workspace_root=/Users/dmh2002/poker_hud_projects/ld-vibe-harness-v4 时，Helper 返回 config_status=missing；2) 该目录的父目录实际存在 LDVH-GOVERNED-PROJECTS.yaml，并登记 ldvh 项目指向当前 worktree；3) 不传 workspace_root、仅提供当前 worktree locator 后，Helper 自动发现父目录配置并返回 config_status=valid、scope_status=governed_single。验证覆盖当前配置位置与当前 Helper 版本；不证明所有安装布局或未来配置发现实现都具有相同行为。
