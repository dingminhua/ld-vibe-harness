title: 独立审核的语义定义缺失——AI 按字面理解调用 subagent 导致执行卡住
status: routed
intent: WC 执行过程中，"独立审核"一词在 LDVH 体系中缺乏明确定义。AI 只能依赖模型训练时的通用语义（"找一个没参与过的独立 subagent 去审核"），但在当前环境下：1) 可能没有可用的 subagent/spawn 工具；2) subagent 启动后缺少上下文无法做有意义的审核；3) 工具调用卡住不返回，主控干等；4) AI 因为调不了 subagent 而卡在"下一步该怎么做"的判断上，形成死锁。若不建立本 Spark，后续每次 WC 执行到独立审核节点时，AI 都会重复卡在"如何实现独立审核"的语义理解上，且每次卡住的原因和表现不一致，无法形成系统化改进。本 Spark 记录的是语义定义缺失问题，与 spark-0052（谎报审核）是不同维度——前者是"不知道怎么做"，后者是"声称做了但没做"。
summary: "**问题**\n\nLDVH 的审核契约此前不能如实表达运行环境是否支持独立 subagent，以及缺少该能力时如何在不谎报独立性的前提下继续受控审核。这会导致流程卡住、把同一 AI 的自审误称为独立 subagent 审核，或让 Human 在 Gate 1 看不到实际保证差异。\n\n**历史记载更正**\n\n此前载体把 workcase-0062 描述为已经完成目标并留下少量残项；实际 WC0062 以 cancelled/accept_stop 关闭，不能作为本议题已实现的依据，也不由本 Spark 回溯改写其终态、残余责任或历史。\n\n**稳定承接**\n\nworkcase-0065 已完整承接本 Spark 的原始信息需求：定义 Gate 1 前能力限制披露与低保证 switched-role creation review bootstrap、Gate 1 对实际方法和保证缺口的 Human 接受语义、Gate 1 后 PlanΔ/result fallback 的批准绑定、actual method/assurance 留痕、Web 呈现、机械校验和测试。该 WorkCase 明确禁止把 same-AI switched-role 冒称为 subagent、执行环境独立或等价保证。\n\n**边界**\n\n本 Spark 进入 routed 只表示问题入口已由稳定 WorkCase 完整承接，不表示 WC0065 已实现、测试通过、提交或关闭；后续状态由 WC0065 自身生命周期记录。"
