  summary: 恢复 study-01M03DH7VPFJQVR9G1K7BDP0AA 行业调研后，将 P1-1 假设从「三段任务触发预检」修正为「L0 公共必读层 + L1 类型差异触发层」双层消费模型，并补充公共层成本与命中/行动改变验证指标。
- at: '2026-08-16T11:49:13.295988Z'
  summary: 精确回读已关闭的 12-pair 知识预检 WorkCase 后，下一验证收窄为在相同 L1 下隔离 L0 增量价值，并补齐 source-complete 重放、容量与 Human 选择边界。
- at: '2026-08-16T15:25:24.524716Z'
  summary: v0.2 source-complete 配对实验完成：主指标净增 3/12 达标，但 strong_reuse 净增 1 与三个空样本全部 correct_non_use 两项失败；严格结论为不支持产品化 L0，后续问题收窄到 L1 类型差异触发的精度与真实复用。
- at: '2026-08-16T17:26:17.821319Z'
  summary: v0.3 L1 trigger source-complete 配对实验完成：误触与 Helper 成本下降，但 trigger 门槛、strong reuse、全部 correct non-use 和首动作不下降门槛失败；严格结论为不采用当前 L1-specific。
- at: '2026-08-16T19:45:13.398661Z'
  summary: 综合两轮实验逐样本失败模式，发现根因是信息结构与消费架构之间的语义断裂——F2 候选卡缺少"读完后对当前行动意味着什么"的桥梁信号（ADR 缺 trigger_signal、Pitfall 缺 scope_of_impact、Study 缺 action_relevance），限制了触发策略的有效空间。建议路线图：先补字段结构，再以修正后的触发策略分三阶段验证。
- at: '2026-08-17T06:28:03.284398Z'
  summary: v4 结构验证实验完成（36 member runs，18 对配对，source-complete sealed）：结论 do-not-support-enhanced-fields。在主指标上，struct-enhanced 未能在 F2 触发正确率（12/18 vs 13/18）、strong reuse（4 vs 6）、首合法动作正确（11 vs 13）上达到或超过 struct-baseline；unnecessary F2 反而略升（6 vs 5）。唯一正向信号是 false_f3_expansion 略降（15 vs 18）与 selection_correct 略升（10 vs 9），但两项 pair sign test p 均 ≥ 0.375，无统计显著性。配对分析中多个指标 zero_differences ≥ 16，即新字段对 18 个冻结任务的决策几乎无影响。严格预注册结论：在 18 个冻结任务上，行动指引字段（trigger_signal/scope_of_impact/action_relevance）对模型 F2→F3 决策无独立可观测改善，不进入Phase 2 生产规范修订。后续方向应转向信息呈现方式（而非字段存在性）或模型触发边界校准。
- at: '2026-08-17T07:18:00Z'
  summary: 基于 v4 do-not-support-enhanced-fields 结论（字段存在性非瓶颈）与 Human 方向决定，将 Spark 主方向从「补字段结构」转为「信息呈现方式」；三个行动指引字段保留为类型字段并标注为已验证非独立瓶颈，不启动规范修订回退；触发边界校准降为备选。本次为 content_update，status 保持 open/P1，intent 不变。
- at: '2026-08-17T12:00:04.268Z'
  summary: 基于 00 §1 设计哲学与 Human 方向决定，将主方向从「信息呈现方式」上移为「知识激活」三层框架（召回主动化、呈现行动化、效用闭环），并确立「正确激活优先于成本」（漏检成本远大于误检成本，召回偏 recall、宁可误报不可漏报，激活强度按类型梯度）。字段效应验证（v0.2/v0.3/v4）已完成排除性价值，下一步验证对象从「字段存在性」转为「激活正确性」。
- at: '2026-08-17T12:07:22.669Z'
  summary: 基于 Human 授权，确立字段重设计方向：三层分离（存储/激活/度量）+ 字段减法（移除 trigger_signal/scope_of_impact/action_relevance 三个行动指引字段，对象字段回到知识本体，行动指引转为激活层动态投影）。该决策作为规范修订（22/23/24）与激活机制设计的依据。
