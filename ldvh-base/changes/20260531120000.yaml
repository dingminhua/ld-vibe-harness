summary: 06/07 §4.6 附件型实践子文档补充语义定义列和命名维度规则
date: 2026-05-31
reason: |
  用户提议将 41.01/41.04/41.05 的实践类型分别改为"常驻上下文实践""预制脚本程序实践""网页信息呈现实践"。
  经多角色思考分析（治理规范、AI 协作架构、文档工程三个独立视角），三项改名均缩小了对应机制的语义范围，
  与 06/07 §4.6 标题格式规则产生断裂，且损害可扩展性。采纳方案 B：不改名，
  在 06/07 §4.6 补充语义定义列和命名维度规则，解决"名词误解"的根源。
actions:
  - 07 §4.6 附件型实践子文档表格增加"语义定义"列，为 NN.01-NN.06 各行补充语义定义
  - 07 §4.6 标题格式规则补充命名维度约束：机制名必须使用 LDVH 标准术语，不得使用功能替代词；
    实践类型应描述功能角色，不得使用承载方式、实现形式或功能子集替代；不在基础规范中固定具体名称
  - 06 §4.6 附件型实践子文档表格增加"语义定义"列，为 NN.01-NN.06 各行补充语义定义
  - 06 §4.6 标题格式规则补充与 07 一致的命名维度约束
affected_files:
  - specs/07-LDVH行动模型基础规范.md
  - specs/06-LDVH生产对象基础规范.md
verification:
  - 07 §4.6 表格包含语义定义列，NN.01-NN.06 各行有语义定义
  - 07 §4.6 标题格式规则包含机制名约束和实践类型命名维度约束
  - 06 §4.6 表格包含语义定义列，NN.01-NN.06 各行有语义定义
  - 06 §4.6 标题格式规则包含机制名约束和实践类型命名维度约束
  - 41.01/41.04/41.05 标题未变更
