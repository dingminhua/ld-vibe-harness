summary: "## 统一目标\n\n本 Spark 作为 LDVH 面向 AI 服务优化的唯一上位入口，统一承载两类相互依赖的问题：一是规则、事实、模板、状态与能力是否以正确、新鲜、不过量且可行动的方式交付；二是 Helper 读写交互候选是否在真实任务中产生足以支持继续改造的净价值。原“Helper 只读交互优化”和“受控写入优化”中已经明确的具体问题均已落实并收口；未来新的读写优化不再以两个常驻兜底 Spark 跟踪，而先由本 Spark 的证据门槛判断是否值得形成窄 WorkCase。\n\n## 已交付基础\n\n### 评估与证据\n\n- 最小执行证据协议和 DSH 会话可比性三值判定已经交付；评分前可以区分 `comparable`、`not_comparable` 与 `inconclusive`，但 `host-received` 在没有 provider 回执时仍为 `unavailable`。\n- 40 个固定模型会话的 Phase 1/Phase 2 对照已经完成：Phase 1 将只读任务中的 invalid-request 命中从 22 降到 0，但直接 Helper 调用数未下降，命令字符平均增加 151.1；WorkCase strict `item_event` 将窄任务 raw request 平均减少 1935.75 bytes，尚无显著请求有效率改善证据。\n- 12 对固定模型知识预检实验已经完成：冻结样本中 combined source-identity-plus-content package 的 `selection_correct` nominal difference 为 +0.666667，但来源身份、内容和指令不可分，六项质量指标未做 multiplicity adjustment，records-only source-complete reproduction 未满足，因此结果只到当前语料的 `behavior-consistent` 层级。\n\n### Helper 只读交互\n\n- `invalid_request` 结构化修正提示、行动模板成功响应去重以及 CLI `--request`、`--example`、`--fields` 已交付。\n- 当前没有证据支持对全部只读响应统一删减或继续增加孤立 flags；只有具体 operation 在可比较真实任务中出现稳定过量、额外回读或修复成本时，才形成范围匹配的候选。\n\n### 受控写入交互\n\n- WorkCase 关闭候选契约、read→update 最小桥接、行动模板 `activation_hint`、三字段署名/Git trailer 骨架和 WorkCase strict `item_event` 已交付。\n- `prepare-fact-object-update` 已正式成为 read-only、caller-completion-required 的 public operation：返回当前对象、fingerprint、排除 Code 托管字段的 whole-object after skeleton，并保持语义变化、fresh signature、完整校验、CAS、原子替换、精确回读和完整性审计由正式写入口承担。\n- Helper 是否应从同一 `observed_context.signature` 形成最新 `change_log.signature`，以及其它类型专属辅助，仍只是证据门槛后的候选；不得降低逐次重新观察、不可跨角色推导和 Git message 显式 footer 边界。\n\n## 下一验证顺序\n\n1. 以代表性真实任务预注册 read、普通事实 update 和 WorkCase 非 item update 任务族，固定模型、入口、runner 与排除条件；先通过执行可比性门槛。\n2. 分别记录 Helper calls、command chars、invalid request、request/response payload、首次合法行动、额外规则回读、修复/回退以及可观察的 latency/cache；不可观察指标不估算。\n3. 只有具体 operation 的稳定残差达到预先定义的实际幅度，才创建窄 WorkCase；无改善或成本高于收益时保留现状。\n4. 在代表性实测前不把现有结果推导为 broad causal-effect，也不启动 Phase 3、MCP 或 09 新接入层。\n\n## 边界与保持 open 的原因\n\n- 本 Spark 只统一服务质量与读写交互优化的证据判断，不吸收 WorkCase 语义重复创建、多项目聚合、周期价值审计或普通代码质量债等已有独立边界。\n- 原两个 P2 Spark 的入口责任因具体问题已落实而结束；它们与本 Spark 的 `related-to` 只用于追溯共同线索，不表示责任路由或下游完成。\n- 代表性真实任务复验、跨模型/宿主推广边界和具体残差归位仍未完成，因此本 Spark 保持 `open / P1`。"
