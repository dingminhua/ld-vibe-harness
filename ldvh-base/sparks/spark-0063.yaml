title: "Human 终端干预通道——任意阶段授权后直接关闭 WorkCase"
status: open
priority: P2
intent: 当前 WorkCase 的正常路径为 Gate1 → 执行 → Controller 自检 → 独立结果复核 → 关闭提案 → Gate2,全程只有一个主动 Human 关闭决定(Gate2)。但存在 Human 主动希望在任何阶段(含 executing 中途、independent_reviewing 卡住时、closure_preparing 之前)介入并授权直接关闭 WC 的情形,例如发现方向错误、范围失控、或不再需要该项目。现有 SafeConvergenceShape 只能沿受限结果链向 Gate2 收敛,不能从任意阶段由 Human 授权直接关闭。若不保留本议题,这类 Human 主动叫停需求每次都会现做判断,且容易与「Gate1-Gate2 之间不得新增 Human Gate」铁律产生混淆,需要明确区分「Human 主动发起的终端干预」与「流程自动停靠的 Gate」的边界。
summary: |-
  ## 目标模型(尚未实施)

  增设一条**由 Human 主动发起的终端干预通道**:Human 在任何阶段(不限于已 terminal)授权后,可直接关闭当前 WorkCase,无需走完完整结果复核链。其核心特征是:

  - **必须由 Human 直接发起**,不是流程自动停靠的 Gate,不能被 AI 或模板触发来「解决卡住」——AI 在 independent_reviewing 卡住时绝不借该通道找 Human,那正是要避免的「停下问人」。
  - **补充授权而非新增 Gate**:它是 Human 对既有 Gate1/Gate2 的主动中断收紧,不构成「Gate1-Gate2 之间新增 Human Gate」的违例,因为铁律禁的是流程自我怀疑停下来问人。
  - **关闭后 item 处理**:任意阶段关闭时,未完成 item 据实写为 cancelled 并写明原因,不要求全部 terminal;内容如实,状态可以被 Human 剪断。

  ## 待判断

  1. 该通道与现有 `SafeConvergenceShape` 的关系:是扩展它,还是新建一个关闭类别/phase?
  2. 「授权后直接关闭」是否需要新的字段或状态位,还是复用现有 closed 形状加来源标记?
  3. 如何机械或语义锁定「只能由 Human 发起」,避免 AI 借它逃避推进?
  4. 该通道是否也适用于已 blocked 或执行中途的 WC,还是仅限特定 phase?
  5. 关闭时的残余责任(未完成 item、未处置 review、未关闭提案)如何据实收敛?

  ## 与既有议题的边界

  - 本议题与 spark-0054(创建后独立审核阶段解耦)、spark-0061(独立审核语义缺失)相关但不同:后两者是执行路径内部问题,本议题是 Human 主动叫停旁路。
  - 本 Spark 只保留议题识别与方向判断,不授权修改规范、创建 WorkCase 或执行实施动作。
