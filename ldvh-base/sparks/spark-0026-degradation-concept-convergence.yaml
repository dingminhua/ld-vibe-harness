title: 降级概念收敛与命名治理
status: pending
created: '2026-06-24T23:50:16+08:00'
updated: '2026-06-25T01:31:00+08:00'
description: |
  本 Spark 记录 LDVH 中“降级”概念过度泛化的问题，并作为逐项讨论和结论登记入口。

  Human 指出：很多所谓降级场景其实不存在真实替代路径；继续要求提供降级说明或降级措施，只会让事情变复杂，并让判断增加不必要的张力。后续讨论应一次只处理一个问题。每个问题形成结论后，先登记到本 Spark 的 `evolution`，再进入下一个问题。

  当前待逐项处理的问题清单：

  1. D01 Rules 入口里的“降级兜底/降级提示”；
  2. D02 Code 输出字段 `degraded`；
  3. D03 知识地图降级；
  4. D04 旧复合表达（原称“人工降级检查”）；
  5. D05 “待接管缺口 / 废止复合旧表达 / 建议接管”；
  6. D06 能力缺口分流；
  7. D07 环境适配里的“废止复合旧表达/适配降级”；
  8. D08 Code 覆盖缺口降级；
  9. D09 等价验证；
  10. D10 未验证 / 失败阻断；
  11. D11 行动执行失败分流；
  12. D12 长期降级；
  13. D13 WorkCase `degraded_accepted`；
  14. D14 Web/Human-facing `degraded` 展示态；
  15. D15 降级说明与残留风险回写。

  初始收敛方向：只有存在可执行、可复查、不会改变成功标准的弱替代路径时，才考虑保留“降级”语义。否则应优先改称未验证、阻断、缺口、待确认、Human Gate、风险接受、AI 回读核对、文件事实源核对、输入不完整或能力受限。
source: conversation
priority: P1
source_detail: 用户要求把 LDVH 中出现降级的地方逐项讨论，并明确“很多降级场景不存在，提供降级说明或措施只会让事情变复杂、增加判断张力”。本 Spark 用于记录讨论目录和逐项结论。
evolution:
  - at: '2026-06-24T23:50:16+08:00'
    summary: |
      建立降级概念收敛讨论目录。当前只登记待处理问题清单和讨论协议：一次只讨论一个问题；每个问题形成结论后先写入本 Spark，再进入下一项。
  - at: '2026-06-25T00:05:59+08:00'
    summary: |
      D01 形成结论：Rules 入口里的“降级兜底/降级提示”和旧复合表达（原称“人工降级检查”）不应作为独立概念继续泛化。现有机制容易遮掩问题，使 LDVH 无法持续暴露缺口并进步，应拆为三类入口异常或证据问题处理。

      1. 工具不可用：直接报告 Human；不能把工具不可用包装为可长期接受的降级路径，否则工具会一直不可用。
      2. 工具输出不足：不应打断可完成的主线工作；工作结束时必须明确汇报原因，给出解决方法，并建议建立 Spark 作为后续解决入口。
      3. 事实冲突：应说明冲突来源和原因，并继续完成当前可完成的任务；工作结束时必须明确汇报原因，给出解决方法，并建议建立 Spark 作为后续解决入口。

      D01 后续命名倾向：从“降级”收敛为“工具不可用直接报告”“工具输出不足原因与修复建议”“事实冲突原因与解决建议”。
  - at: '2026-06-25T00:21:40+08:00'
    summary: |
      D02 形成初步结论：Code 输出字段 `degraded` 不应被理解为“降级方案成立”或“可接受降级”。它目前把问题压缩成布尔值，容易遮掩真实缺口，使调用方跳过原因分析。

      `degraded: true` 必须结合 `diagnostics` 分清四类问题：

      1. 输入问题：输入范围、查询条件、起点或参数不足。
      2. 能力问题：工具实现、覆盖范围、图谱层级或跨项目能力不足。
      3. 证据问题：来源回指、Schema、原文依据或输出证据不足。
      4. 事实冲突：不同事实源、不同版本或不同投影之间存在冲突。

      D02 处理方法与 D01 保持一致：如果 Code 工具本身不可用，直接报告 Human；如果是 `degraded: true` 暴露出的四类问题，不应把问题改写为降级说明，也不应打断可完成的主线工作。应先完成当前可完成的任务，并在工作结束时明确汇报问题原因、给出解决方法，建议建立 Spark 作为后续解决入口。
  - at: '2026-06-25T00:23:44+08:00'
    summary: |
      D01 与 D02 统一口径：二者本质上是同一类要求。D01 是 Rules 入口中的表达，D02 是 Code 结构化输出字段中的表达；不应分别设计不同处理要求。

      后续执行以 D01 的统一要求为准：工具不可用时直接报告 Human；工具输出不足、输入/能力/证据问题或事实冲突时，先完成当前可完成的主线工作，并在工作结束时明确汇报问题原因、给出解决方法，建议建立 Spark 作为后续解决入口。

      D02 的四类问题只用于识别原因，不形成独立处理制度。
  - at: '2026-06-25T00:25:46+08:00'
    summary: |
      D03 形成结论：知识地图降级不保留为独立降级概念。它是 D02 在知识地图工具上的具体表现，处理要求完全继承 D01/D02。

      知识地图工具不可用时，直接报告 Human。知识地图能运行但出现输出不足、输入不足、能力不足、证据不足或事实冲突时，不应包装成“降级路径”；应先完成当前可完成的主线工作，并在工作结束时明确汇报问题原因、给出解决方法，建议建立 Spark 作为后续解决入口。

      `knowledge_map_degraded` 或知识地图 `degraded: true` 只能作为问题暴露信号，不能作为遮掩工具缺口、接受长期降级或跳过修复建议的机制。
  - at: '2026-06-25T00:31:03+08:00'
    summary: |
      D04 形成结论：旧复合表达（原称“人工降级检查”）不保留为独立概念。当前先取消“人工”概念，不在 D04 中继续讨论执行主体拟人化问题；该问题已另建 spark-0027 作为专项调查入口。

      D04 只处理“降级检查”是否成立：结论是不成立。相关表达应收敛为具体核对动作或缺口暴露，例如原文核对、文件事实源核对、手动命令核对、工具能力缺口、流程未接管缺口、证据不足或事实冲突。

      若出现该类检查是因为工具不可用，按 D01 统一要求直接报告 Human。若是因为工具输出不足、能力未实现、流程未接管、证据不足或事实冲突，应先完成当前可完成的主线工作，并在工作结束时明确汇报原因、给出解决方法，建议建立 Spark 作为后续解决入口。
  - at: '2026-06-25T00:35:27+08:00'
    summary: |
      D01-D04 处理方法总览：

      1. D01 Rules 入口里的“降级兜底/降级提示”：不作为降级概念处理。工具不可用直接报告 Human；工具输出不足或事实冲突时，先完成当前可完成的主线工作，并在工作结束时明确汇报原因、给出解决方法，建议建立 Spark。
      2. D02 Code 输出字段 `degraded`：与 D01 要求相同。`degraded: true` 只用于识别输入、能力、证据或事实冲突原因，不形成独立处理制度。
      3. D03 知识地图降级：是 D02 在知识地图工具上的具体表现，不保留独立降级概念。知识地图工具不可用直接报告 Human；输出受限或冲突时按 D01/D02 统一要求处理。
      4. D04 旧复合表达（原称“人工降级检查”）：先取消“人工”概念，相关执行主体命名问题转入 spark-0027。D04 只判断“降级检查”是否成立，结论是不成立；应改为具体核对动作或缺口暴露，并按 D01 统一要求汇报原因、解决方法和建议 Spark。
  - at: '2026-06-25T00:37:54+08:00'
    summary: |
      D05 形成结论：“待接管缺口 / 废止复合旧表达 / 建议接管”不保留为降级概念。它应收敛为接管状态与缺口治理问题。

      1. `待接管缺口` 可以保留，表示某个保障需求尚无 active 行动编排、能力资产或明确承载闭环。
      2. `建议接管` 可以保留，表示未来可能由行动编排或能力资产承接，但不表示已经接管、已经支持或可以关闭问题。
      3. 旧复合表达（原称 `人工降级`）不作为状态保留；其中涉及“人工”的执行主体问题转入 spark-0027，涉及“降级”的部分应拆为具体核对动作、能力缺口、流程未接管缺口、证据不足或事实冲突。

      D05 处理方法：先完成当前可完成的主线工作；工作结束时明确说明哪些需求未接管、建议由谁或哪类机制接管、当前只能采用什么临时核对动作，并建议建立 Spark 或 WorkCase 继续解决。
  - at: '2026-06-25T00:40:23+08:00'
    summary: |
      D06 形成结论：能力缺口分流不属于降级概念，应保留为问题暴露和责任分流机制。

      能力缺口分流的价值在于明确“缺什么能力”，并分流到对应责任位置，例如 WorkCase、Spark、ADR、06 运行时扩展、04 Code、08 测试、Human Gate 或具体承载物。能力缺口不是降级，也不是可接受的替代方案。

      D06 需要清理的是与“降级”的绑定：表述中的旧复合表达、泛化“降级路径”“长期降级”等应拆为具体缺口类型、临时核对动作、责任归口和后续解决入口。若当前主线还能继续，应先完成当前可完成工作；工作结束时明确说明缺口原因、解决方法，并建议建立 Spark 或 WorkCase。
  - at: '2026-06-25T00:41:55+08:00'
    summary: |
      D07 形成结论：环境适配里的旧复合表达（原称“人工降级”）和“适配降级”不保留为降级概念。当前先取消“人工”概念，执行主体命名问题继续归入 spark-0027。

      D07 实际描述的是环境接入状态，而不是降级方案：环境没有稳定入口、环境能力不足、只能使用会话提示、薄引用、手动命令、配置说明等临时方式，或当前不能声明完整支持和已部署。

      D07 应收敛为“环境入口缺口”“环境能力不足”“临时接入方式”“待确认”或“不可声明完整支持”。若当前主线还能继续，应先完成当前可完成工作；工作结束时明确说明环境缺口原因、当前临时接入方式、正式解决方法，并建议建立 Spark 或 WorkCase。
  - at: '2026-06-25T00:44:45+08:00'
    summary: |
      D08 形成结论：Code 覆盖缺口不属于降级概念，应保留为 D06 能力缺口分流下的具体子类，但必须严格限定边界。

      D08 只适用于已经被规范授权、已经设计为 Code 应覆盖、且理论上可机械检查的能力，但当前 Code 尚未覆盖或覆盖不完整的情况。这才是 Code 覆盖缺口。

      D08 不包括：需要价值判断、方向取舍、授权或验收的 Human Gate；规则尚未定义清楚的规范缺口；需要行动流程组织的行动编排缺口；需要 Web 展示或交互的 Web/Human-facing 缺口；环境不可执行、权限不足或入口不可用的环境/运行时缺口；以及 Code 原理上做不到或不应由 Code 承担的边界问题。

      处理方法：先判断是否满足“已授权、已设计、可机械检查”三项条件。满足时记录 Code 覆盖缺口，说明未覆盖范围、需要补的 Code/测试/样例，并建议建立 Spark、WorkCase 或 Code WorkCase。不满足时不得写成 Code 覆盖缺口，应分流为规范缺口、Human Gate、行动编排缺口、Web 缺口、环境缺口或 Code 边界说明。
  - at: '2026-06-25T00:46:08+08:00'
    summary: |
      D09 形成结论：等价验证不属于降级概念，应保留为验证声明的一种。

      等价验证只有在替代验证能覆盖同一个关键风险、同一个判断目标或同一个契约边界时才成立。若替代验证不能覆盖同一关键风险，就不能称为等价验证，应分流为未验证、测试缺口、环境缺口、Web 缺口、Code 覆盖缺口或 Human Gate。

      处理方法：使用等价验证时必须说明原验证为什么不可行、替代验证覆盖了什么、没有覆盖什么、残留风险是什么、后续如何补齐。若等价验证反复出现，应建议建立 Spark 或 WorkCase，将其转为测试缺口、实现缺口或工作项。
  - at: '2026-06-25T01:01:11+08:00'
    summary: |
      D10 形成结论：未验证 / 失败阻断不属于降级概念，应作为“不得关闭、不得验收、不得声称完成”的强约束机制保留。

      D10 的作用是防止 AI 将没验证、验证失败、证据不足、局部验证、事实冲突或 Human 未确认误写为完成、已验证、可关闭或已确认。出现 D10 时，不是提供降级说明，而是停止完成、验收、关闭类结论。

      处理方法：说明失败点、影响范围、已验证部分、未验证部分和建议分流位置。若当前主线仍有可完成部分，可以先完成这些部分，但最终必须明确标注未验证或阻断原因，不得用降级叙述覆盖阻断事实。
  - at: '2026-06-25T01:03:49+08:00'
    summary: |
      D11 形成结论：行动执行失败分流不属于降级概念，应保留为行动执行问题分流与失败暂停机制。

      D11 的价值在于用闭集分流执行中问题：`blocking`、`follow_up`、`opportunistic_fix`、`adr_candidate`、`pitfall_candidate`、`spark_candidate` 和 `study_candidate`。这些是问题性质和后续归口，不是降级方案。

      D11 需要清理的是“降级为 follow_up”等表达：`blocking` 不得被弱化或错误改判为 `follow_up`；`opportunistic_fix` 风险不清楚时，应改判为 `follow_up`，而不是称为降级。

      处理方法：执行失败时先按闭集判断问题性质。阻断项必须修复并复验；非阻断项可以继续完成当前主线，但结束时必须说明失败原因、分流类型、后续事实源位置，并建议 Spark、WorkCase、ADR、Pitfall 或 Study。
  - at: '2026-06-25T01:08:15+08:00'
    summary: |
      D12 形成结论：长期降级不保留为普通降级概念，应收敛为长期缺口接受、延期实现与风险接受决策。

      若只是发现功能、能力、验证或环境接入尚未完成，应先记录原因并分流为 Spark 或 WorkCase。若已经明确“这个功能应该做，但现在不做，并允许系统在较长期限内带着这个缺口运行”，这不是降级方案，而是高影响取舍，必须进入 Human Gate，并用 ADR 记录决策。

      D12 的记录边界：Spark 记录问题、想法和缺口线索；WorkCase 承接具体实现；ADR 记录“应做但暂不做、允许长期临时状态存在”的决策、理由、风险、触发条件、退出条件和后续承接对象。

      ADR 至少应说明：应做但未做的能力是什么；为什么现在不做；临时状态允许存在多久或到什么触发条件为止；接受哪些风险、不接受哪些风险；后续由哪个 Spark、WorkCase 或规范承接；退出条件或重审条件是什么。
  - at: '2026-06-25T01:13:56+08:00'
    summary: |
      D13 形成结论：WorkCase `degraded_accepted` 不应作为推荐关闭结果继续使用。推进到一半但目标没有做成，不能算完成，也不应包装为“降级接受”。

      这类情况应由 Human 决定是否取消。WorkCase 关闭时可以使用取消类关闭结果承载“推进中止、目标未达成、Human 决定不继续”的语义；关闭证据必须说明为什么不能算完成、已经完成了哪些部分、哪些目标未达成、取消原因、残留风险和后续承接对象。

      若只是任务中止或不再继续，应走 `cancelled` 或后续更明确的取消类结果；若是部分目标完成但仍有后续承接，应走 `partial_completed` 并填写 `followup_refs`；若是“功能应该做但暂不做，并允许长期临时状态存在”，必须按 D12 进入 Human Gate 并用 ADR 记录决策。

      后续建议：将 `degraded_accepted` 视为历史兼容枚举，另行建立 Spark 或 WorkCase 设计迁移方案，收敛为取消类、部分完成类或风险/缺口接受类更精确的关闭结果。
  - at: '2026-06-25T01:16:33+08:00'
    summary: |
      D14 形成结论：Web/Human-facing `degraded` 展示态不保留为面向 Human 的主标签。

      Human-facing 层不应展示泛化的“降级”结论，而应展示具体原因态势和不可证明范围，例如输入不可用、能力缺口、证据不足、来源冲突、同步异常、验证失败、待 Human Gate 或环境入口缺口。

      `degraded` 最多作为后端兼容字段或诊断聚合信号，不应作为面向 Human 的主展示态。展示层必须帮助 Human 看见真实问题类型、来源和影响范围，而不是用一个状态词把问题压扁。
  - at: '2026-06-25T01:19:12+08:00'
    summary: |
      D15 形成结论：“降级说明与残留风险回写”应拆分处理，不保留“降级说明”作为泛化概念，但保留“残留风险”和“受控回写”。

      “降级说明”容易把前面已经拆开的工具不可用、能力缺口、证据不足、事实冲突、未验证、环境入口缺口、取消、延期实现等问题重新压回一个模糊标签。后续应改为具体的问题原因说明、不可证明范围、未验证原因、缺口原因、冲突原因或取消原因。

      “残留风险”不是降级，而是验证、关闭、决策或长期接受缺口时必须留下的事实信息。它应说明仍未覆盖、未证明、未完成、未自动化、未接入的范围，以及这些状态带来的执行、追溯或判断风险。

      “回写”只在稳定结论、风险、决策、失败诊断或确认记录需要后续追溯时发生。Web 显示、工具输出、对话说明或候选草案都不能直接等同于稳定事实已经形成。必须写入对应权威事实源、满足事实源边界、必要时经过 Human Gate、可由 Git 追溯，且不与已有权威事实冲突。

      处理方法：验证相关内容进入 08 验证声明；WorkCase 关闭相关内容进入 `closure_evidence`、`residual_risks` 和 `followup_refs`；功能应该做但暂时长期不做时，按 D12 进入 Human Gate 和 ADR；新发现的问题、缺口或想法进入 Spark；可执行修复项进入 WorkCase；可复用经验教训进入 Pitfall；Web/Validate/Confirm 只负责展示原因、风险、回写位置和修复线索，不得自动修复、自动关闭或自动写入验证结论。
