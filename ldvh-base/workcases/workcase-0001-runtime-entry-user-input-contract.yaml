        - 不得仅以 cwd 判定用户问题是否属于管辖项目。
        - 不得用 latest receipt 跨 target 放行。
      aggregation_rule: |
        若任一 required perspective 认为会制造第二事实源、跨 target receipt 放行风险、或让 Code 猜自然语言意图，本 WorkCase 不得进入实现。
