title: 多人未同步时的事实对象 ID 冲突提交 Gate
intent: 保留多人、多 clone 或多分支未同步时，提交包含事实对象的变更如何发现远端同 ID 冲突并交由 Human 处置的问题，避免仅等待 merge/push 冲突、静默改号、自动覆盖或在远端新鲜度未证明时宣称无冲突。后续需判断范围匹配 Gate 与改号/合并处置的可靠边界。
status: discarded
summary: "**问题**\n\n多人、多 clone 或多分支未同步时，各方可能在未获取目标远端分支最新状态的情况下合法分配相同 `object_id`。本 Spark 保留提交前远端同 ID 冲突如何发现并交由 Human 处置的问题。\n\n**已有处置（merge 后检测，确定性）**\n\n- 05 §9.4（workcase-0060 落文）确立了合并后身份扫描发现、冲突分类（分叉编辑合并 / 撞号改号）、改号路径的入向引用重定向与验证闭环。\n- `check-fact-integrity` 在 merge/pull 使 `ldvh-base/` 变化后执行全库机械检查，能确定性地发现重复身份。\n- §9.4 当前立场：「跨 clone 协作的冲突预防依赖同步纪律：写入事实前同步远端、写入后尽快推送……该纪律不形成新的机械入口。」\n\n**前置拦截（提交前 Gate）分析结论**\n\n- 前置拦截与 merge 后检测功能重叠：merge 后检测是确定性的（冲突一旦进入本地树就能发现），前置拦截有竞态（fetch 后到 commit 前仍可能被他人 push），不能消除冲突。\n- 行业规范（Git 本身）不在 commit 前查远端，push 被拒绝 → pull/merge → 解决冲突 → 重新 push 是标准流程；pre-commit hook 只做本地快速检查，网络操作是公认反模式。\n- 结论：前置拦截冗余且代价高（每次提交 fetch、需网络、离线不可用），§9.4「依赖同步纪律，不形成新的机械入口」的立场正确。"
disposition_summary: 决定不再推进提交 Gate 前置拦截的实现。理由：①前置拦截与已有的 merge 后检测（check-fact-integrity + §9.4）功能重叠，且前置拦截有竞态漏洞不能真正消除冲突，merge 后检测是确定性的；②行业规范（Git、pre-commit hook 惯例）不做提交前远端检查，网络操作是 pre-commit 反模式；③§9.4「依赖同步纪律，不形成新的机械入口」的当前立场经分析确认正确。规则层（§9.4 撞号处置程序）已由 workcase-0060 完成交付，本 Spark 的剩余责任（前置拦截实现）经分析判定为不需要实现。决定边界：本决定仅涉及「提交前远端新鲜度验证 + Index 与目标树全局身份比对」这一机械入口，不影响 §9.4 已确立的 merge 后处置程序。
