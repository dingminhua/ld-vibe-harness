[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = [".", "code"]
addopts = "-ra --strict-markers -n auto --ignore=code/tests/testing/test_knowledge_precheck_v2.py --ignore=code/tests/testing/test_knowledge_precheck_v2_trial.py --ignore=code/tests/testing/test_knowledge_precheck_v3.py --ignore=code/tests/testing/test_knowledge_precheck_v3_trial.py --ignore=code/tests/testing/test_knowledge_precheck_v4.py --ignore=code/tests/testing/test_knowledge_precheck_v4_trial.py --ignore=code/tests/testing/test_knowledge_precheck_v5.py --ignore=code/tests/testing/test_knowledge_precheck_v5_trial.py --ignore=code/tests/testing/test_knowledge_precheck_v6.py --ignore=code/tests/testing/test_knowledge_precheck_v6_trial.py --ignore=code/tests/testing/test_knowledge_precheck_v7.py --ignore=code/tests/testing/test_knowledge_precheck_v7_protocol.py --ignore=code/tests/testing/test_knowledge_precheck_v7_study_guard.py --ignore=code/tests/testing/test_knowledge_precheck_v7_trial.py"
# knowledge_precheck v2~v7 是知识预检实验线遗留代码：依赖的 sealed evidence
# （docs/metrics/knowledge-precheck-v2/v3/protocol.json、source-snapshot.json 等）从未入库，
# 原分支（cindy/swift-mendel）上同样失败；从默认测试套件中排除，保留代码供实验复现。
# 如需重新启用，先补齐缺失的证据文件再移除 ignore 行。
markers = [
  "native_windows: requires a native Windows host and is run by the manual evidence gate",
]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["code/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ldvh"]
