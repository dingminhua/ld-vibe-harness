status: closed
title: F2 候选卡片支持字段定制，降低盘点类查询 payload
goal: 扩展 find-fact-object-candidates 的 F2 卡片投影，使调用方能在不改变候选/过滤/分页语义的前提下指定返回的直接字段子集（如只返回 title/status），从而避免盘点类查询（筛选→读对象两步）被迫接收固定全量卡片字段；保持 F0 恢复清单、coverage、摘录与关系导航契约不变，并产出可复核的 payload 降幅证据。
scope: 仅修改 find-fact-object-candidates 的 F2 卡片字段投影输入与实现（specs/05 事实模型基础规范 §11.5-11.6 的 F2 直接投影字段定义、code/ldvh/facts/candidate_discovery.py、code/ldvh/helper/operations/fact_candidate_request.py 及直接测试），并新增可选字段定制参数（如 arguments.fields）。不改动 F0/F1、coverage、分页、过滤条件、摘录预算、关系导航语义、其它 Code 模块、Web、事实 Schema 或 ldvh-base 事实对象；不做条件过滤合并进 read-fact-objects、不改公共响应信封；本地 commit 仅在 Human Gate 1 批准且逐项授权后执行。
success_criterion_definitions:
- criterion_id: criterion-fields-param
  statement: find-fact-object-candidates F2 接受可选 fields 参数（如 title,status），卡片 fields 只返回指定子集；未指定时行为与现状完全一致（固定直接投影）。
- criterion_id: criterion-validity
  statement: fields 值必须属于所选类型 F2 卡片当前直接投影字段闭集；未知/非法字段按现有 invalid_request 语义拒绝，不静默忽略、不改写候选或过滤结果。
- criterion_id: criterion-backward-compat
  statement: 未传 fields 的既有调用完全不变：F0 recovery_manifest、coverage、cards 结构、分页指纹与 missing/无效范围语义与改动前一致；相关既有测试全部保持通过。
- criterion_id: criterion-evidence
  statement: 以真实 find-fact-object-candidates 盘点 open sparks/workcases 为样例，实测记录字段定制前（固定卡片 20-42KB）后（仅 title/status）的字节数与降幅，形成可复核证据，不声称 fixed-model 可比性。
- criterion_id: criterion-quality
  statement: 目标与直接测试通过，修改文件通过 ruff 与 git diff --check；实现不绕过 Helper 写入、不直接修改 ldvh-base、不改变公共响应信封。
success_criterion_results:
- criterion_id: criterion-fields-param
  outcome: satisfied
  summary: find-fact-object-candidates F2 接受可选 arguments.fields（array 1-16 互异 string）；真实调用 fields=[title,status] 只返回这两字段、fields=[object_uid,title] 正确返回、workcase title/status 正确返回；未传时行为与现状完全一致。
- criterion_id: criterion-validity
  outcome: satisfied
  summary: fields 值必须属于所选类型 F2 直接投影字段闭集（_F2_DIRECT_PROJECTION_FIELDS：spark 为 object_uid/object_id/title/status/priority/updated_at，不含 intent/summary；workcase 为 active/closed 投影并集）；intent/summary 拒绝、object_uid 接受、workcase validation_summary 拒绝（均有测试覆盖）；重复成员与超 16 项均 invalid_request。
- criterion_id: criterion-backward-compat
  outcome: satisfied
  summary: 未传 fields 的既有调用完全不变：F0 recovery_manifest、coverage、cards 结构（含 excerpts/match_reasons/source_refs）、分页指纹语义与改动前一致；test_fact_candidate_operation.py 47 passed 含 9 个 fields 定制测试，聚焦回归通过。
- criterion_id: criterion-evidence
  outcome: satisfied
  summary: 真实盘点实测：open sparks 默认 34424B→fields 33648B（-2.3%）；全部 sparks 34464B→33768B（-2.0%）。构成分析：单卡 3073B 中 excerpts 1973B（64%）、source_refs 647B（21%）、fields 仅 251B（8%）——字段定制只裁剪 fields 段，卡片大头是摘要摘录与溯源段，整体降幅有限；数据如实记录，不声称 fixed-model 可比性。
- criterion_id: criterion-quality
  outcome: satisfied
  summary: 目标与直接测试通过（test_fact_candidate_operation 47 passed 含 9 个 fields 测试）；ruff 三文件 All checks passed（含 F841 修复）；git diff --check 通过；未绕过 Helper 写入、未直接修改 ldvh-base、未改变公共响应信封。
result_summary: find-fact-object-candidates F2 已支持 arguments.fields 卡片字段定制：请求契约新增 fields 解析与闭集校验（1-16 互异、属于 _F2_DIRECT_PROJECTION_FIELDS 直接投影闭集、非法字段 invalid_request），_card() 按请求顺序投影指定字段，未传时保持现有完整投影。真实实测：fields 定制使卡片 fields 段缩到仅请求字段，整体响应降幅约 2%（单卡 3073B 中 fields 仅占 251B/8%，大头是摘要摘录 excerpts 64% 与溯源 source_refs 21%）。实现与测试通过（47 passed 含 9 个字段定制测试），不声称固定模型可比性或统一收益。
validation_summary: test_fact_candidate_operation.py 47 passed（含 9 个 fields 定制测试）、聚焦回归 90 passed（+ test_cli_projection 43）；ruff 三文件 All checks passed；git diff --check 通过；端到端真实 find-fact-object-candidates --fields 返回正确、intent/summary 拒绝、非法字段拒绝。全量非目标测试未作为本结果完成依据。
closure_outcome: completed
disposition_summary: 按 completed 关闭：find-fact-object-candidates F2 已支持 arguments.fields 卡片字段定制（闭集校验、未传行为不变、specs/05 §11.5 契约更新），5 条成功标准全部 satisfied，独立结果复核（第 3 轮 pass）通过且前两轮 feedback 全部处置，原 scope 内无剩余责任。实测字段定制整体响应降幅约 2%（卡片大头为摘要摘录与溯源段，属 spec 设计决定）。
spark_suggestions:
- suggestion_id: suggestion-f1-fields-silently-ignored
  suggestion_kind: follow_up_opportunity
  summary: fields 参数在 F1 卡片层被静默忽略（_F2_ONLY_FIELDS 未含 fields，F1 分支不拒绝也不应用），与 F2 可选语义有灰色地带；另有 active workcase 卡片请求 fields 子集时仍恒含派生 work_item_counts。
  follow_up_summary: 该边界澄清不是本次成功标准的剩余责任；由 Human 在本 WorkCase Gate 2 之后独立决定是否另建 Spark 或 WorkCase，当前不自动创建、不执行。
