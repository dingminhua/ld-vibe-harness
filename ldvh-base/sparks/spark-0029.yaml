summary: "**已确认缺口**\n\n- 当前 LDVH Codex 插件只登记 `SessionStart` 与 `SubagentStart`，没有登记或真实验证写前、写后 Hook；现有接入只能交付工作上下文规则引导。\n- 2026-07-23 的实际操作已经证明：AI 可直接编辑 `ldvh-base/` 对象而绕过 Helper 的 CAS、受控写入和写后回读。这个证据支持“需要降低直接写入绕过风险”，但不证明某种 Hook 方案已经可用。\n- `ldvh-base/` 事实对象与 `specs/` 规范修改具有不同规则、写入入口和语义边界；不能以一个通用文件拦截器同时宣称两者已受保护。\n\n**Codex 当前候选能力**\n\n- 2026-07-24 官方 Codex Hooks 资料确认，`PreToolUse` 可以观察 Bash/unified exec、`apply_patch`、MCP 和多数本地 function tool，并可 deny、注入 `additionalContext` 或在支持范围内改写输入；`PostToolUse` 可以取得工具输入与结果并反馈后续处理。\n- `apply_patch` 的实际输入使用 `tool_name: apply_patch` 与 `tool_input.command`；Bash 只有命令文本，MCP 和其它本地工具使用各自参数。环境提供的是工具调用信息，不自动形成 canonical target、实际副作用或受控写入身份。\n- `PostToolUse` 不能撤销已经发生的副作用；部分 specialized tool 可以绕过默认 Hook 路径，hosted tools 不进入该路径。官方资料因此把工具 Hook 定位为 guardrail，而不是完整 enforcement boundary。\n- 插件 Hook 还需要安装、启用、逐定义信任与真实事件验证；官方资料和仓库静态文件都不能证明当前本机接入已经成立。\n\n**架构收敛**\n\n环境 Hook 继续保持 00 §8.2 与 09 定义的稳定薄引用，只转发原生事件实际 payload，调用唯一 LDVH 核心并如实映射结果；它不自行读取规则、恢复事实、选择“相关”候选或判断规则适用与行动许可。候选核心能力分为三个独立结果：\n\n1. **pre-write orientation**：对能够机械定位的候选目标，核心读取精确规则和行动模板，并返回有界 F2 候选、来源、coverage、gap 与继续入口；不阻断写入，不把候选表达为语义相关或规则适用。\n2. **fact direct-write guardrail**：只对来源已封闭定义、原生输入足以复核的 `ldvh-base/` 直接写入条件形成 Hook Gate deny/allow；Code 只判断 canonical target、管辖、操作类别和机械条件。输入不足、间接 shell 副作用、specialized tool opt-out 或受控 Helper 身份不可证明时必须如实报告未覆盖范围，不宣称完全防绕过。\n3. **post-write audit**：在工具已经运行后调用共享读取/校验能力并把无效、partial、unavailable 与修复入口交给 AI；它不倒推事前授权成立、不把反馈称为回滚，也不使用“fail-closed”描述已经发生的写入。\n\n**第一阶段范围**\n\n- 目标环境收敛为当前 Codex Hooks 候选协议；其它环境继续由各自 adapter 资料和实际事件独立判断。\n- 优先范围只包含 `ldvh-base/` 五类事实对象，因为已有 Helper 受控创建/更新、CAS、Schema 校验和回读入口。对 `specs/` 的写前引导可以继续研究，但规范变更保护不进入第一实现范围。\n- 当前只完成官方能力调查和架构边界收敛；没有新增 Hook 注册、核心实现、安装对象或环境配置，也没有形成真实触发证据。\n- 现有 SessionStart/SubagentStart Hook 不为新能力改写；若输入或输出不兼容，应新增独立核心与独立 Hook，保持既有薄引用稳定。\n\n**进入 WorkCase 前仍需闭合**\n\n- 明确第一实现究竟只交付非阻断 orientation，还是同时交付承认覆盖不完整的 direct-write guardrail；两者不能用同一个“主动保护完成”验收。\n- 在来源规则中封闭定义 guardrail 的候选输入、allow/deny、partial/unavailable、受控 Helper 分流、诊断与恢复条件，再按“来源先行”进入 Code。\n- 形成 Codex 实际验收矩阵：`apply_patch` 直接写事实对象、Bash/间接写入、Helper 受控更新、非目标文件、输入不足、校验失败、Hook 未信任/停用、成功与失败后的恢复；每项分别记录静态、核心直调和真实触发范围。\n- 与 `spark-0001` 的事件/工作对象范围、`spark-0002` 的 payload/target 完整性、`spark-0013` 的动作分类、`spark-0018` 的无 Hook 自约束及 `spark-0028` 已分流的机械校验闭环保持职责分工。本 Spark 仍保持 open，因为实现目标与验收边界尚未完整形成。\n\n**ADR 与 Pitfall 的生产生效链**\n\n- ADR 或 Pitfall 文件存在、机械有效且处于 active，只证明它是当前可消费的决定或经验事实；不自动取得规范权威、行动授权或 Hook 阻断效力。\n- 当前 Helper 已实际支持 F1/F2 候选和 F3 精确读取；2026-07-24 在本项目读取到 2 个 active ADR 与 1 个 active Pitfall，三个对象均 mechanically_valid。F1 集合结果因 workcase-0012 当前无效而为 partial，说明生产消费必须保留 coverage、invalid 对象和未完成范围，不能把返回卡片冒充完整恢复。\n- 当前 SessionStart/SubagentStart 核心固定交付规则引导并报告 facts: not_requested；21、22 当前又要求新会话、恢复和压缩恢复时提供 open/blocked WorkCase 与 active ADR 的 F1 卡。该触发要求与 00 §8.1“不因进入上下文就无差别恢复项目事实”以及当前生产实现存在需要收敛的张力。\n- 推荐边界是：进入上下文时仍只交付 00 规则引导；Human 目标明确、项目绑定成立且任务确实需要项目事实后，再取得 active ADR 与 open/blocked WorkCase 的 F1 基线。高影响设计、长期选择或运行约束变化前，由 AI 筛选可能适用 ADR 并展开 F3；Hook、Code 和 Helper 不根据任务文字自行判断适用性。\n- Pitfall 不在会话开始时全量恢复。出现相似症状、进入已知触发条件、采用曾有失败风险的方案，或进入故障调查、修复、验证与环境安装时，由 AI 使用症状、触发条件、环境、版本和方案形成 F2 查询，展开可能适用对象后重新核对根因、解决、规避、applicability 与验证边界。\n- ADR/Pitfall 的实际作用应体现在 WorkCase 的 scope、approach、success criteria、重要风险与审核中，而不是新增“已读取”收据；读取、召回或关系存在不证明适用、正确采用或完成。\n- 需要成为强制行为时，ADR 决定或 Pitfall 规避经验必须由相应 Specs、授权附件、行动模板、Code、tests、Git Gate 或 Hook Gate 正式吸收并验证。PreToolUse 不得直接消费 ADR/Pitfall 后作 allow/block；本 Spark 的阻断条件只能来自 05 等当前规则源已经封闭定义的机械条件。\n- 当前 adr-0001“规则缺口来源先行”适用于本 Spark：应先由 05 定义事实对象写入候选与机械 Gate 边界，再进入 Code 与 Hook。adr-0002 适用于面向 Human 的中文技术沟通，但不定义本功能行为。pitfall-0001 只在相容的本地 filesystem 插件安装场景影响安装验证，应转化为 data 目录检查和真实 Hook 触发验证，不扩大为当前 Specs 设计规则。\n- ADR/WorkCase 的事实交付触发与 00 的收敛属于相邻生产消费问题，需要保留并另行承接；它不应被偷偷塞入第一阶段 direct-write guardrail，也不应因暂未收敛而让 Hook 代替 AI 恢复和选择事实。"
