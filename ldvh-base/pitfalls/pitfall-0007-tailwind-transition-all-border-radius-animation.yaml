id: pitfall-0007
type: pitfall
title: Tailwind transition-all 导致页面加载 border-radius 动画
status: active
created: '2026-06-06T02:08:49.375414'
updated: '2026-06-06T02:10:00'
symptoms: |
  页面加载或路由切换时，内容区外围出现一个巨大的白色/透明圆形轮廓动画，
  从圆形 → 圆角矩形 → 消失，持续约 300ms，视觉上非常突兀。
  现象出现在 ObjectDetail 页面（/objects/intent/:id 等）的主内容容器区域。
trigger_conditions: |
  1. 容器元素使用了 Tailwind 的 `transition-all` 类（或 CSS `transition: all`）；
  2. 浏览器对该元素存在默认的 `border-radius` 计算值（Chrome 可达 8251.97px）；
  3. 页面加载或路由切换触发该元素的首次渲染/重排；
  4. transition-all 使 border-radius 参与过渡动画，从浏览器默认大值过渡到实际样式值。
root_cause: |
  Tailwind 的 `transition-all` 会为所有可动画 CSS 属性启用过渡效果，包括 border-radius。
  Chrome 浏览器对某些布局容器元素会设置一个极大的默认 border-radius 值（实测 8251.97px），
  当页面首次渲染时，transition-all 导致该值从 8251.97px 动画过渡到实际样式的值（如 0 或具体 px），
  从而产生肉眼可见的"圆圈→方框"轮廓动画。

  关键代码位置：ObjectDetail.tsx 主容器的 className 包含 `transition-all duration-300`。
resolution: |
  1. 将 `transition-all` 替换为精确的属性列表，仅过渡真正需要动画的属性：
     - `transition-[margin]` — 仅过渡 margin 属性（本例中用于 ReadingPanel 面板开关）
     - 或使用 `transition-[opacity,transform,margin]` 明确指定属性
  2. 对不需要圆角的容器显式设置 `rounded-none`（border-radius: 0），消除浏览器默认值干扰
  3. 全局层面在 index.css 中清除不必要的 focus ring 和 tap-highlight（辅助手段）

  修复文件：web/src/pages/ObjectDetail.tsx 第198行
  修复前：<div className="... transition-all duration-300 ...">
  修复后：<div className="... rounded-none transition-[margin] duration-300 ...">
