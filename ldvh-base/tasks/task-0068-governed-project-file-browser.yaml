id: task-0068
type: task
title: 管辖项目文件浏览与 Git 变更查看页
status: closed
created: '2026-06-11T17:56:14'
updated: '2026-06-11T18:29:50'
description: |
  ## 背景

  当前 Web 已能展示 LDVH 工作对象、校验和变更记录，但用户在查看管辖项目文件、Markdown 文档和待提交变更时仍需要额外打开编辑器或终端窗口。用户希望在 Web 内新增一个专门 tab，按管辖项目区分文件浏览，并能直接预览 Markdown、查看待提交文件和 diff。

  ## 目标

  新增一个只读 Web 页面，用于承载“管辖项目文件浏览 + Markdown 预览 + Git 待提交变更查看”。该页面应让用户在 Web 内完成以下判断：

  - 当前工作区有哪些管辖项目；
  - 每个管辖项目下有哪些常用文档和事实源文件；
  - 点击 Markdown 文件后能以 Markdown 预览方式阅读；
  - 当前有哪些待提交文件；
  - 点击待提交文件后能查看对应 diff。

  ## 边界

  - 不改变现有主页；
  - 不引入 Web 写入事实源能力；
  - 文件浏览和 diff 查看必须是只读能力；
  - 文件读取必须限定在工作区和管辖项目路径内，避免路径穿越；
  - Markdown 预览应复用现有通用 Markdown 阅读组件或成熟渲染组件，不重复手写简陋渲染；
  - Git diff 查看只展示工作区变更，不执行 add、commit、checkout、reset 或其它写操作。
source: 用户提出希望新增一个专门 tab：按管辖项目区分浏览项目文件，点击 md 可预览，并能查看待提交文件和 diff，减少单独打开窗口查看信息的成本。
