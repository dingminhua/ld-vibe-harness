summary: 多角色思考行动模型规范完善（基于多角色审查和实践复盘）
date: 2026-05-31
reason: |
  基于多系统子 Agent 模式多角色审查和实践复盘，修正 41 主文档和 41.03 子文档的规范问题，
  消除单一事实源违反、Human Gate 分散、落地审计不足等问题，强化实践执行流程。
actions:
  - 修正 41 主文档 §五事实源边界表格，补充 41.06-Contract.md
  - 修正 40 索引 §三 41 条目描述，去除 Skill 表述，改为轻量模式/子 Agent 模式
  - 消除 41 §八.4 与 41.06 §六 角色选择规则的重复定义，主文档改为摘要+引用
  - 精简 41 §八.3 与 41.06 §二 角色定义原则的重叠，主文档只保留核心原则
  - 统一 Human Gate 条款，§九.2 改为引用 §十四，避免并行维护
  - 补强 §十八落地审计，增加审计检查清单（6 项）
  - §十一显式声明 MCP 边界
  - §十九合规检查增加通过条件列
  - §十五.2 41.04/41.05 状态标注从 active 改为 active-prep
  - 头部引用补充 04.01-Rules机制规范.md
  - §十和 §十八增加与 07 §4.2 标准组成的映射说明
  - §八.1 模式选择改为主动提供选择而非默认轻量模式
  - §八.4 增加主控应在启动子 Agent 前输出 RoleSelectionOutput
  - §十六第 1 条修正为 L0、L1 或 L2
  - §二十待补齐事项更新，增加 PMKit Skill 关系和轻量模式引导
  - 41.03 §四增加 4.1 执行前输出小节
  - 41.03 §五上下文分发增加裁剪示例
affected_files:
  - specs/41-multi-role-thinking-多角色思考.md
  - specs/40-行动模型集合索引.md
  - specs/41.03-Agent.md
verification:
  - §五表格已包含 41.06
  - 40 索引描述已去除 Skill
  - §八.4 不再重复 41.06 §六 的 8 条规则
  - §九.2 不再独立列举 Human Gate 条件
  - §十八包含 6 项审计检查清单
  - §十一包含 MCP 边界声明
  - §十九包含通过条件列
  - 41.03 §四包含 4.1 执行前输出
  - 41.03 §五包含裁剪示例
