id: adr-0008
type: adr
title: Codex 优先适配与用户手动薄入口
status: proposed
created: '2026-06-17T03:00:00'
updated: '2026-06-17T03:00:00'
date: '2026-06-17'
context: |
  Human 在当前会话提出两个环境适配方向，需要作为长期决策候选记录，避免后续继续按旧路线推进。

  Human Gate 记录：
  - 触发原因：本决策候选会改变 LDVH 的环境适配目标、入口部署方式和后续 04 系列规范口径。
  - 确认事项：是否创建 proposed ADR 记录该方向，暂不创建 Task。
  - 影响范围：04 系列环境适配规范、Rules 入口、管辖项目接入说明、后续用户安装或接入指引。
  - 确认依据：用户明确说明 Task 机制当前尚未完善，ADR 可以建立；当前讨论尚未完成，不应直接升级为 accepted 规则。
  - Human 决策：确认先建立 ADR，不创建 Task。
  - 确认人/时间：Human，2026-06-17
  - 后续动作：围绕本 ADR 继续沟通落地方式；确认后再决定是否接受并修改 specs。
  - 回写位置：本 ADR、后续 Change / commit。
  - 残留风险：在 accepted 前，本 ADR 只作为候选决策，不作为正式执行规则。

  背景一：LDVH 之前希望适配 Trae、Trae CN 和 Codex 三种环境，但多环境同时承诺完整适配成本高、边界复杂，也容易形成未验证的完整支持声明。

  背景二：薄入口之前倾向由系统或 AI 自动设置，但实际存在两类场景：一类是系统级或用户级环境入口，一类是多项目并列放在同一工作区，LDVH 与用户其他项目是并列关系。自动写入容易越过用户环境边界，也容易把一次本机写入误当成长期事实。
decision: |
  候选决策方向：

  1. LDVH 官方适配目标收敛为 Codex 优先。
     - LDVH 维护 Codex 场景下的稳定入口、恢复提示、校验路径和降级方式。
     - Trae、Trae CN 或其他环境不再作为同等完整适配目标。
     - 对其他环境仅提供适配方向、薄入口文本原则和检查思路，由使用者按自身环境能力自行接入。

  2. LDVH 不默认自动写入用户环境入口。
     - LDVH 可以生成一段薄入口语句，说明应指向 `rules/LDVH-AI-ENTRY.md`，并包含上下文压缩或恢复后的重读要求。
     - 用户自行把该语句加入自己的系统级、用户级、工作区级或项目级规则入口。
     - AI 不应默认静默写入、覆盖或维护用户环境入口；需要写入时必须由 Human 明确授权并评估影响范围。

  3. 管辖项目接入仍以管辖项目配置为中心。
     - 多项目并列工作区中，LDVH 与其他项目可以是同级目录。
     - 当前哪些项目受 LDVH 管辖，应由工作区根目录 `LDVH-GOVERNED-PROJECTS.yaml` 判断。
     - 薄入口只负责把 AI 引向 LDVH 入口和管辖配置，不承载具体管辖项目事实。
consequences: |
  积极后果：
  - 降低 LDVH 环境适配承诺范围，避免同时维护 Trae、Trae CN 和 Codex 的完整支持口径。
  - 减少自动写入用户环境入口带来的权限、边界和信任风险。
  - 更符合 LDVH 的事实源原则：入口写入结果不是长期事实源，后续是否生效应以现场检查为准。
  - 多项目工作区中，LDVH 不需要接管其他项目入口，只通过薄入口和管辖配置完成路由。

  消极后果和风险：
  - 非 Codex 用户需要自行完成环境适配，LDVH 只能提供方向，不提供完整落地保证。
  - 手动加入薄入口增加用户操作步骤，首次接入体验可能更慢。
  - 04 系列、Rules 入口和相关说明需要重新收口，避免仍暗示三环境完整适配或自动部署。

  待确认问题：
  - Codex 优先是唯一官方适配目标，还是先作为当前阶段目标。
  - 其他环境是否保留示例模板，还是只保留抽象原则。
  - 薄入口模板应放在 04.03、Rules 入口，还是单独的用户接入说明中。
alternatives: |
  替代方案一：继续维护 Trae、Trae CN 和 Codex 三环境完整适配。该方案覆盖面更广，但实现和验证成本高，且容易产生未验证的完整支持声明。

  替代方案二：由 AI 自动写入用户环境入口。该方案首次接入更快，但容易越过用户环境边界，也容易在系统级、用户级和工作区级入口之间造成误写。

  替代方案三：完全不提供其他环境适配方向。该方案边界最清晰，但会降低 LDVH 被其他用户迁移和理解的能力。
