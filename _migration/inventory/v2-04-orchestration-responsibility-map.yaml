source_spec: "../ld-vibe-harness/specs/03-行动编排规范.md"
target_spec: "specs/04-行动编排基础规范.md"
purpose: "Map v2 03 responsibilities into a smaller v3 orchestration spec without copying the v2 orchestration corpus."
value_gate:
  goal: "Define how LDVH work is orchestrated for AI action."
  reduced_ai_burdens:
    - judgment
    - execution
    - verification
    - writeback
  single_markdown_fact_source: true
  kill_point: "If v3 04 becomes a long workflow catalog or duplicates 01/02/03 rules, stop and split back to owning specs."

decisions:
  - v2_responsibility: "Context / Scenario / Gate model for action members"
    v3_handling: "Keep as later action-member material, not the v3 04 first body."
    reason: "Current need is LDVH self-action order, not full action member migration."

  - v2_responsibility: "Main controller dispatches Skill, Agent, Code, Web, Hook, Rules"
    v3_handling: "Keep only the general boundary: capabilities provide evidence, main AI keeps responsibility."
    reason: "Avoid expanding 03 into runtime or capability architecture."

  - v2_responsibility: "Issue routing and failure pause"
    v3_handling: "Absorb the minimal blocker / warning / follow-up distinction."
    reason: "Human specifically identified non-blocking warnings that must be reported at completion."

  - v2_responsibility: "Evidence and fact-source writeback"
    v3_handling: "Absorb only task-completion obligation; future 07 owns Git/fact-source details."
    reason: "04 should say how action orchestration reports and routes; 03 should define work object destinations."

  - v2_responsibility: "Orchestration candidates and 30-59 members"
    v3_handling: "Defer."
    reason: "Not needed to establish the first LDVH self-orchestration baseline."

  - v2_responsibility: "Assurance takeover"
    v3_handling: "Represent as a general order: specs first, then Code, then instances."
    reason: "Prevents Code or instance edits from becoming rule definitions."

  - v2_responsibility: "Skill / Agent must return to main controller"
    v3_handling: "Keep as subagent review and capability-output boundary."
    reason: "Ensures subagent review informs but does not replace main accountability."

required_v3_04_roles:
  - value_gate_before_action
  - authority_order_specs_code_instances
  - formal_change_gate
  - code_verification_before_completion
  - subagent_review_for_formal_changes
  - warning_report_and_disposition
  - human_gate_stop_conditions
  - completion_evidence

not_carried_into_v3_03_body:
  - "Full 30-59 member lifecycle tables"
  - "Detailed Context / Scenario / Gate templates"
  - "Runtime / Hook / Web capability details"
  - "Git traceability details"
  - "Fact model instance storage rules"
  - "Long issue-routing taxonomy"
