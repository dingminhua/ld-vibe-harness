status: closed
title: 验证 L1 类型差异触发策略的精度与复用效用
goal: 实现并运行一个 source-complete、条件盲评的 L1 触发策略配对实验，在不使用 L0 的前提下比较当前宽触发策略与 family-specific 精确触发策略，判断后者能否同时提升触发决策精度和 strong reuse、保证 correct non-use，并消除不适用对象的 F3 误展开；把严格预注册的采用或不采用判断写回相关 Spark。
scope: 仅新增 code/ldvh/testing/knowledge_precheck_v3.py、code/ldvh/testing/knowledge_precheck_v3_trial.py、code/tests/testing/test_knowledge_precheck_v3.py、code/tests/testing/test_knowledge_precheck_v3_trial.py 与 docs/metrics/knowledge-precheck-v3，并通过 Helper 写回本 WorkCase 检查点；v2 代码只允许作为只读 import/复用依据，docs/metrics/knowledge-precheck-v2 sealed bundle 与 compiled artifacts 不得修改。冻结 18 个任务：ADR/Pitfall/Study 各 6，含 2 个精确正例、1 个边界/部分适用、1 个纯 non-use、1 个诱导性 no-trigger、1 个应 F2 但不应 F3 的 non-use；两臂均无 L0，唯一实验差异为 L1-baseline 宽触发 policy 与 L1-specific family-specific policy。只允许真实 Helper F2/F3 只读调用及字段闭集证据留存；source-complete 报告成立后，允许经 Helper CAS 更新 Spark UID 019ffb52-ebb5-74e8-aac0-3cd3d73d15fc。排除生产 L1 接入、L0 复评、Specs、Helper contract、事实 Schema、Web、其它事实对象、v2 证据改写、Git commit/push/PR/release、部署和网络发布。
success_criterion_definitions:
- criterion_id: criterion-frozen-l1-protocol
  statement: 冻结 v0.3 protocol、18 个 task/gold、当前事实集合与 source snapshot、两份 L1 policy 文本/hash、9/9 条件首发顺序、模型/runner 身份策略与盲评 rubric。任务在三种事实 family 与六种情形上精确平衡；每题冻结 expected F2 trigger/family、F3 allow-set、all-and-only applicable refs、correct non-use 条件、首个实质动作和错误分类。L1-specific policy 不超过 12 KiB UTF-8 与 160 logical lines。采用门槛预注册为：trigger-decision correctness 相对 baseline 净增至少 3/18 且绝对至少 15/18；9 个适用题 strong_reuse 绝对至少 7/9 且净增至少 2；9 个 non-use 题 treatment 全部 correct_non_use；6 个 no-trigger 题 unnecessary F2 为 0；9 个 non-use 题 false F3 为 0且全体 false F3 不高于 baseline；selection correctness 与 knowledge-adjusted first legal action correctness 均不下降；source-complete 与 policy capacity 成立。任一门槛失败或证据不足即不支持采用 L1-specific。
- criterion_id: criterion-policy-isolation-and-read-only
  statement: 两臂都不接收 L0，并共享同一冻结任务、source snapshot、只读 F2/F3 gateway、允许操作、fresh-context、评分 rubric 与模型运行方式；model input 的唯一预注册差异是 L1 trigger policy。L1-specific 只在 family-specific positive conditions 成立且 veto conditions 不成立时触发 F2；F3 只在 F2 命中且证据满足冻结 applicability 条件时展开精确 UID。任何 write/unknown、arguments.workspace_root、跨 family、F3-before-F2、source drift 或条件泄漏均 fail closed 且零实验事实写入。
- criterion_id: criterion-v3-source-complete-replay
  statement: 独立 sealed evidence bundle 从 protocol/task/gold、两份 policy 与 source snapshot、raw Helper exchanges、模型结构化输出、盲评 packet/评分及 adjudication ledger 字节一致重建 records、results 与 report；trigger correctness、unnecessary F2、false F3、selection、first action、strong reuse 与 correct non-use 由 frozen gold 加 raw response/trace 确定性重算。缺失、额外、篡改、hash drift、score/packet 不绑定或 post-hoc override 均被拒绝。
- criterion_id: criterion-v3-automated-verification
  statement: v3 focused tests 实际覆盖 protocol 闭集与 family/情形/顺序平衡、唯一 arm 差异、fake gateway 的 write/drift/cross-family/F3-before-F2 拒绝、真实只读 fixture、byte replay、blind packet 脱敏、fresh context/scorer 唯一性、attempt/replacement/launch/time ceiling 与 technical-exclusion 闭集；同时重跑 v2 focused tests 证明 sealed v2 行为与产物未被改变。
- criterion_id: criterion-v3-paired-measurement
  statement: 实际取得恰 18 retained pairs；最多 21 个 pair attempts、3 个仅由预注册技术排除触发的整对 replacements、42 个 member launches 与 42 个 scorer contexts，每个 member 最多 600 秒、无单臂重试、总运行不超过 6 小时。报告逐 family/情形及总体的 trigger confusion matrix、unnecessary F2、F3 precision/recall、selection、knowledge-adjusted first legal action、strong_reuse、correct_non_use、false F3、Helper 调用/F3 数量及可观察成本，并严格按冻结联合门槛给出 supports-l1-specific-for-separate-production-design 或 do-not-support-adopting-l1-specific；错误、null、负效应和不利 family 结果不得排除。
- criterion_id: criterion-spark-v3-writeback
  statement: 仅在 v3 source-complete 报告成立后，目标 Spark 的公开精确回读包含报告绑定、实测指标、各门槛通过/失败、运行时可观察性与因果限制，以及严格的采用/不采用判断；写后 check-fact-integrity 外层 outcome=ok 且 result.status=complete。
