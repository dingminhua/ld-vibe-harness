# LDVH 管辖项目配置
#
# 这个文件用于说明当前 LDVH 管理实例是什么，以及它要管辖哪些项目。
# 它应放在安装或使用 LDVH 的工作区根目录。
# 它不是工作对象，不放在 ldvh-base/ 下，也不替代 Task / ADR / Memo 等事实对象。
# 它不记录初始化状态、落地状态、检查状态、过程报告正文、缺口处理状态或项目执行状态。
#
# 根字段：
# - product_name: 当前 LDVH 管理实例或产品名称，必填。
# - product_description: 当前 LDVH 管理实例或产品说明，必填。
# - projects: 管辖项目列表；没有管辖项目时填写空列表 []。
#
# 每个项目只强制填写两个字段：
# - id: 项目稳定 ID，必须唯一，不能和其他项目重复。
# - path: 项目根目录路径，建议使用绝对路径。
#
# 每个项目可以选填两个字段：
# - name: 项目名称，给 Human 和 AI 阅读。
# - description: 项目说明，写一句话或一小段，帮助 AI 判断项目性质。
#
# 不要填写 type、status、docs_path、ldvh_base_path、initialized、audit_state 或其他字段。
# 这些信息由 LDVH 固定推导：
# - 所有条目都是管辖项目。
# - docs 路径固定为 {path}/docs。
# - ldvh-base 路径固定为 {path}/ldvh-base。
#
# LDVH 源码仓库可以把 LDVH 自身登记为 dogfood 管辖项目。
# 这只代表“LDVH 自己开发自己时由 LDVH 管自己”，不代表用户安装后必须管 LDVH 本体。
#
# 单项目示例：
# product_name: LD Vibe Harness
# product_description: |
#   使用 LDVH 管理当前工作区内的项目需求、任务、决策、变更和证据。
# projects:
#   - id: my-app
#     path: /Users/me/projects/my-app
#     name: My App
#     description: |
#       业务系统项目，用 LDVH 管理需求、任务、决策和变更。
#
# 多项目示例：
# product_name: LD Vibe Harness
# product_description: |
#   使用 LDVH 统一管理多个相关项目。
# projects:
#   - id: app-web
#     path: /Users/me/projects/app-web
#     name: App Web
#     description: |
#       前端项目。
#   - id: app-api
#     path: /Users/me/projects/app-api
#     name: App API
#     description: |
#       后端 API 项目。

product_name: LD Vibe Harness
product_description: |
  LD Vibe Harness 自身源码仓库的 dogfood 管理实例。用于在开发 LDVH 时，用 LDVH 规范体系管理 LDVH 自己的规范、Code、Web、测试和事实源。
projects:
  - id: ld-vibe-harness
    path: /Users/dmh2002/codex_projects/ld-vibe-harness
    name: LD Vibe Harness
    description: |
      LDVH 自身源码仓库。该条目只表示本仓库开发过程采用 LDVH 自我管理，不代表用户安装 LDVH 后默认管辖 LDVH 本体。
