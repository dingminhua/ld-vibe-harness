type: change
title: 明确 ADR Rules 入口摘要的层级评估
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  specs/21-ADR-决策记录.md 的落地前决策原本只要求评估是否在 L1 或 L2 Rules 中增加 ADR 准入条件入口摘要。
  该表述未显式覆盖 L0，容易在后续其他事实模型生成时误解为通用事实实例编辑约束不需要评估 L0 入口。
decision: |
  1. 将 ADR 落地前决策中的 Rules 入口摘要评估改为按影响范围选择 Rules 层级。
  2. 明确涉及所有接入项目或事实实例编辑通用约束时应评估 L0。
  3. 明确仅涉及单项目或特定场景时应评估 L1 或 L2。
consequences: |
  - 后续 ADR 及其他事实模型生成附件型实践和落地决策时，应按影响范围评估 L0、L1、L2 Rules 入口。
  - 避免将跨项目通用约束误落到项目级或场景级 Rules。
  - 保持 Rules 入口摘要与事实模型主规范的事实源边界区分。
affects:
  - specs/21-ADR-决策记录.md
related_rules:
  - specs/21-ADR-决策记录.md
  - specs/10-事实源边界与承载规范.md
