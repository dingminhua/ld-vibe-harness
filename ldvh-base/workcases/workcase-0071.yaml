execution_authorization:
  authorized_actions:
  - action_id: authorization-nonleak-adapter
    summary: 在测试性路径实现或调整非泄漏预飞门禁、冻结协议和严格 v2 记录支持。
    target_scope: 仅 code/ldvh/testing/、code/tests/testing/ 与运行器新建的仓库外 SafeTrialTempRoot。
    effect_scope: 允许修改两条测试性路径，并在临时根生成协议、任务、gold、提示卡、记录、统计输入和范围 manifest；禁止生产路径、规格、文档、配置、其它既有事实对象、Git 与网络。
    risk_summary: 门禁可能漏检语义等价泄漏或错误拒绝合法协议；adapter 错误可能使比较无效，但不得据此主张提示卡效果。
    rollback_summary: 任一门禁、hash、来源、schema 或路径验证失败即停止受影响 item；测试性代码可后续受控修正，运行材料保留在受限临时根。
    rule_refs:
    - 21-WorkCase-工作项.md §6.5
    - 32-事实对象生命周期变更与承接处置行动模板.md §5.3
  - action_id: authorization-protocol-audit
    summary: 委派一次独立只读协议审查，核对 12 个冻结任务/gold 的非泄漏性、条件隔离、来源绑定和只读 allowlist。
    target_scope: 仅 WorkCase-0071 的测试性实现、冻结协议及其仓库外临时材料。
    effect_scope: 允许一次只读子代理审查；不得写入、发起 trial、修改生产路径、执行 Git、网络或外部操作。
    risk_summary: 审查只能评估当前材料，不能证明未来随机 Helper 输出或语义等价泄漏已被穷尽。
    rollback_summary: 发现阻断项时停止并取消后续 trial；不得以审查通过替代最终结果复核。
    rule_refs:
    - 21-WorkCase-工作项.md §4.4
    - 21-WorkCase-工作项.md §6.5
  - action_id: authorization-local-trials
    summary: 在预飞和独立协议审查通过后，使用冻结协议对当前本地只读 Helper 执行 12 baseline 加 12 candidate trial。
    target_scope: 仅冻结的 12 个任务、condition-blind gold、当前本地 Helper 冻结只读 allowlist 与每批新建 SafeTrialTempRoot。
    effect_scope: 允许发起至多 24 次受记录的本地只读 Helper 调用，并只向临时根写入响应材料、v2 record、统计输入与范围 manifest；禁止事实写入、生产修改、外部网络、Git 和任务包外调用。
    risk_summary: 随机行为、响应结构变化、来源漂移、失败或误判的 allowlist 可能使结果无效；单项改善不代表净收益。
    rollback_summary: 任何泄漏、指纹漂移、越权操作、schema/path 失败、gold 盲评失效或不完整 record 均立即中止，不汇总为方向性结论。
    rule_refs:
    - 21-WorkCase-工作项.md §6.5
    - 20-Spark-火花.md §8
  - action_id: authorization-delegate-result-review
    summary: 委派独立只读复核者验证冻结材料、门禁、records、统计与范围证据。
    target_scope: 仅 WorkCase-0071 的协议、受限临时证据、测试性改动和结果投影。
    effect_scope: 允许一次只读子代理复核；不得写入、额外 trial、生产修改、Git、网络或外部操作。
    risk_summary: 复核不能证明随机试验必然复现，只能验证当前批次证据与计算边界。
    rollback_summary: 若证据不可读、哈希不匹配、门禁不可复核或统计不可重算，停止关闭准备并按结果版本规则收敛。
    rule_refs:
    - 21-WorkCase-工作项.md §6.6
    - 21-WorkCase-工作项.md §6.7
  - action_id: authorization-result-review
    summary: 执行一次独立只读结果复核，验证证据哈希、非泄漏门禁、来源卡、schema records、统计重算与范围 manifest。
    target_scope: 仅已冻结的 WorkCase-0071 结果投影及其受限临时证据。
    effect_scope: 允许读取和重算，不允许新建或重复批次，不允许写入、Git、网络或生产变更。
    risk_summary: 复核不证明随机批次会逐次复现，只验证现有批次记录。
    rollback_summary: 若验证不足，结论降为未验证并停止关闭准备。
    rule_refs:
    - 21-WorkCase-工作项.md §6.6
    - 21-WorkCase-工作项.md §6.7
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-delegate-result-review
    result_review_action_id: authorization-result-review
  action_ceiling: 本 WorkCase 最多修改两条测试性路径、实现一个非泄漏协议门禁、冻结并独立审查一个 12-task 协议、执行至多一个登记的 24-trial 本地只读批次并产生一个受限临时证据根；不创建或修改其它既有事实对象，不执行 Git、网络、依赖安装或生产变更。
  prohibited_actions:
  - 生产 Helper 或调用入口修改
  - 能力契约、规格、文档或配置修改
  - WorkCase-0070 或其它既有事实对象的修改
  - Git 暂存、提交、推送或历史操作
  - 网络访问、依赖安装或外部消息
  - 仓库内、ldvh-base 或非自身临时根的运行产物写入
  - 任务包外 Helper 操作或未登记的额外 trial 批次
  - 以提示卡效果为由作统计显著性、因果或产品净收益主张
  allowed_adjustments: 仅可在不改变任务数量、比较目标、允许操作、来源绑定、试验数、结果口径或行动上限的前提下修正测试性 adapter 的机械错误，或重试尚未形成有效终态 record 且可证明由 runner 基础设施造成的单一 trial；任何任务/gold/条件/来源卡实质变动都必须停止受影响批次并进入结果链。
  verification_and_rollback: 在冻结前后验证来源、环境指纹、allowlist、条件差异、泄漏门禁、SafeTrialTempRoot 身份与 record schema；批次后重算 records 与范围 manifest，并由独立复核者验证。路径、schema、权限、泄漏或 comparability 失败立即中止相关批次，不把失败记录汇总为方向性结论；不删除用户既有文件。
  out_of_bounds_handling: 发现未授权路径、操作、环境变化、新风险或需要生产/网络/Git/其它事实对象时零写入停止该动作，取消或收敛受影响 item，不在执行期索取扩权。
