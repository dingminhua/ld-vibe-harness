description: |
  本 Spark 承载一个待讨论的流程设计问题：当前 LDVH 已有 4 个 active 工作流程，但用户在实际工作中发现它们并没有被自然触发，因此需要重新评估这些工作流程的作用、触发条件和落地形态。

  当前 active 工作流程：

  1. `history/specs-v1/30-action-orchestration-governance-行动编排创建审核与治理.md`
  2. `history/specs-v1/41-fact-model-audit-事实模型审核.md`
  3. `history/specs-v1/42-specs-audit-规范审核.md`
  4. `history/specs-v1/43-assurance-readiness-audit-保障准备度审核.md`

  用户观察：

  1. 这些工作流程在规范中已经存在，并标记为当前可用的流程能力；
  2. 但在近期真实工作中，AI 并没有自然进入或显式触发这些流程；
  3. 如果流程只存在于 specs 中，而实际执行入口、判断口径、触发提示或工作对象联动不足，它们就可能成为“理论上 active、实践中闲置”的规则；
  4. 需要重新评估这些流程到底应该作为独立行动流程、审核清单、Gate 口径、WorkCase 验收要求，还是应该降级为普通规范检查项。

  AI 当前理解：

  这不是简单的“流程没用”，更像是流程落地形态和实际工作入口之间存在断层。40-43 当前更偏审核型流程：它们回答“某类规范/模型/流程/保障要求是否合格”，但真实工作中 AI 经常直接进入修改、补救、写 Spark、建 WorkCase 或跑 Code 校验，而不是先显式声明“现在进入某个审核流程”。

  如果一个工作流程要在实际工作中被触发，至少需要满足以下条件之一：

  1. 用户输入中出现明确场景词时，AI 能识别并进入流程；
  2. 修改某类事实源前后，入口规则明确要求检查是否触发流程；
  3. WorkCase 创建、执行、review 或关闭时，把对应流程作为可见检查步骤；
  4. Code、Web、Rules 或 Skill 能把流程作为候选入口提示给 AI 或 Human；
  5. 流程本身提供比普通 specs 阅读更低成本、更可执行的上下文包和判断步骤。

  当前可能的问题：

  1. 40-43 的场景识别规则可能太像“事后审核”，没有嵌入日常修改路径；
  2. AI 入口读取时知道有这些流程，但没有被强制要求在对应变更前后检查；
  3. 流程文档体量较大，真实工作中进入成本高，AI 倾向于直接读取目标规范和局部规则；
  4. WorkCase、Spark、ADR 和 specs 修改没有稳定字段或 Gate 明确记录“本次是否触发了 40-43”；
  5. active 状态可能让流程看起来已经落地，但缺少触发保障、Web 可见入口或 Code 辅助提醒；
  6. 审核流程可能更适合作为阶段性 Review、关闭前检查或专项审计，而不是每次工作都自然进入的流程。

  后续评估方向：

  1. 逐一评估 40-43 的真实使用场景：哪些场景必须触发、哪些只是可选参考；
  2. 检查入口规则、工作模型、WorkCase 关闭证据、Human Gate 和 Code/Web 是否需要增加流程触发提示；
  3. 判断 40-43 是否应保留为 active 工作流程，还是部分降级为审核清单、Gate 规则或 specs 检查要求；
  4. 为每个流程补充“实际触发例子”和“非触发例子”，避免 AI 不知道何时进入；
  5. 评估是否需要一个更贴近日常工作的执行流程，例如“规范修改流程”或“工作对象修改流程”，由它在关键节点调用 40-43；
  6. 若后续推进，应形成 WorkCase，而不是直接在当前对话中改动 40-43。
