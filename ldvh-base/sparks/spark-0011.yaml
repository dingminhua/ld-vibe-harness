title: 能力资产准入、封装与触发
intent: 保留重复工作是否值得封装为 Skill、Agent、Hook、共享 Code 或其它能力资产，以及资产如何被发现、触发和验证的问题，避免把历史工具研究、资产文件存在或环境安装状态误作准入与净收益已经成立。后续需以当前痛点和目标环境判断承载方式。
status: open
priority: P2
