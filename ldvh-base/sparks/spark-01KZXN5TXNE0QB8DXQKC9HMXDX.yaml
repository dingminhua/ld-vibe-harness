title: 能力资产准入、封装与触发
intent: 保留重复工作是否值得封装为 Skill、Agent、Hook、共享 Code 或其它能力资产，以及资产如何被发现、触发和验证的问题，避免把历史工具研究、资产文件存在或环境安装状态误作准入与净收益已经成立。后续需以当前痛点和目标环境判断承载方式。
status: implemented
summary: "**当前判断**\n\n- V4 已区分语义规则、能力复用、生命周期触发、环境安装与 Human 授权；能力可复用不表示已经配置触发，存在 Hook 或 Skill 也不表示已经安装、启用或通过真实环境验证。\n- 外部研究只能提供证据优先、职责分层和可验证触发等原则，不能直接引入外部插件、强制工作流或另一套能力权威。\n\n**准入判断**\n\n- 哪些当前重复痛点足以形成能力资产，以及应归入规则、行动模板、共享 Code、Skill、Agent、Hook 还是环境 adapter。\n- 每项资产的来源与负责人、输入输出、适用范围、副作用和权限、发现与触发、版本同步、失败与绕过、验证、部署和卸载。\n- 没有当前痛点、明确目标环境和可验证净收益时，不因历史研究或工具存在而建设资产。\n\n**边界**\n\n- lifecycle Gate 与真实验收由当前接入架构决定及其环境验证责任承接；多 Agent、角色与 worktree 协作由 `spark-0010` 已完成的治理承接；外部工具完整调查留在 Study。\n- 本 Spark 不建立覆盖全部能力的统一 registry、marketplace、许可矩阵或自动授权机制。\n\n**本次分流**\n\n- `adr-0006` 承接当前能力接入形态、能力边界与准入后的承载选择：唯一接入面为薄 Skill 与 Git Gate，不设 Hook、插件或 MCP 接入形态。\n- `workcase-0013` 承接环境安装、部署、接入与验证的四层责任、逐事件验收、失败/回滚与 Human 受限操作交还。\n- `specs/06`、`specs/32` 与 `specs/33` 是上述承接所依据的规范和行动模板来源，不作为事实关系目标。\n- 原 Spark 不再保留独立待处置内容；下游对象的后续生命周期不由本 Spark 跟踪。"
