intent: 保留本次对 Helper 关联信息渐进取得能力的设计问题与外部审核入口。当前已澄清 00 的上位原则，但尚未决定是否把跨要素关联导航建设为新的只读公开服务；需要在不让 Helper、Code 或环境入口裁决语义相关性、规则适用、授权或完成的前提下，确认该能力的实际价值、最小范围、下位规范承接和验收边界。
summary: "**已决结论**\n\n外部审核与 Human 决定已将原问题收敛为方案 C：不新建通用关联视图或 operation_key，而是在既有事实候选发现中补齐从已知事实稳定种子正向取得一跳 relations 的确定性契约。\n\n**承接位置**\n\n`workcase-0011` 承担该契约、实现、测试与验证的完整工作责任。首版只处理事实侧一跳边、F2 候选、精确继续读取入口及可观察的 coverage/gaps；不支持规则种子、跨要素图、语义排序、自动多跳或环境自动调用。\n\n本 Spark 不再保留未决责任。WorkCase 当前仅处于计划等待 Human 执行批准阶段；其尚未实施不影响本 Spark 已完成信息需求分流。"
