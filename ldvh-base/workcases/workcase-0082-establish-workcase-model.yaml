id: workcase-0082
type: workcase
title: 确立 WorkCase / 工作项模型并迁移当前工作项事实源
goal: |
  确立 WorkCase / 工作项作为一次目标闭环对象，保留 WorkCase / 工作项，并完成当前事实源、Code 和 Web 的一次性迁移。
status: human_closure_confirming
created: '2026-06-21T06:50:31+08:00'
updated: '2026-06-21T08:32:07+08:00'
priority: P1
plan_confirmed_at: '2026-06-21T07:15:05+08:00'
description: |
  本工作项承接 LDVH active 工作模型中一次目标闭环对象的命名和结构升级。

  当前 WorkCase 已不只是“计划”：它承载一次目标从方案审核、Human 方案确认、执行、结果自检、结果复核、Human 关闭确认到 Git 提交追溯的完整工作闭环。继续使用 Plan 容易让 Human 和 AI 把它误解为前置计划或 checklist，而不是一个可审核、可执行、可复核、可关闭的工作项。

  Human 已确认正式采用 WorkCase / 工作项，并保留 WorkCase / 工作项。WorkCase 不改为 WorkCaseSet，因为 WorkCase 是长期范围与治理域，不只是 WorkCase 集合。Human 进一步确认：Plan 仍应存在，但它是 WorkCase 内部的方案/计划部分；本次采用一次性迁移，不保留长期 alias；specs 当前正式规范不保留旧对象名作为历史痕迹。
success_criteria: |
  - [x] Human 明确确认一次目标闭环对象正式命名为 WorkCase / 工作项
  - [x] Human 明确确认 WorkCase / 工作项保留现名
  - [x] Human 明确确认 Plan 作为 WorkCase 内部方案/计划部分保留
  - [x] 形成命名迁移方案，覆盖规范、事实实例、字段关系、Code、Web、测试和历史追溯边界
  - [x] 明确一次性迁移对象身份、文件名、目录名、字段名和 Web API，不保留长期兼容 alias
  - [x] 执行前生成 active surface manifest，覆盖 WorkCase 当前命中、结构化引用字段、正文引用、Web/API/测试命中
  - [x] 对应工作模型规范、字段注册、事实实例、Code 工具、Web API、Web UI、测试夹具和文案同步到 Human 确认后的当前口径
  - [x] active surface 残留扫描完成；除迁移说明、审核历史和 Git 历史语境外，不残留会误导当前模型消费的旧口径
  - [x] 相关 specs 校验、事实源校验、Code 测试和 Web 构建/测试按实际变更范围执行并记录证据
source: |
  Human 在 2026-06-21 与主控讨论 LDVH 工作对象命名时提出：一次目标闭环对象应采用 WorkCase / 工作项，WorkCase / 工作项应保留为长期范围对象。主控评估认为 WorkCase 更贴近当前对象已承载的完整工作闭环；WorkCase 是长期工作项、治理域和上下文范围，不只是 WorkCase 集合，因此不采用 WorkCaseSet。Human 随后要求推进，理由是越晚修改理解成本越高。

  Human Gate 记录：
  - 触发原因：active 工作模型命名可能误导 Human 和 AI 对 WorkCase 的理解，且后续使用越多迁移成本越高。
  - 影响范围：工作模型规范、字段注册、ldvh-base 事实实例、对象引用、Code 校验与 CLI、Web API、Web 展示、测试和迁移追溯。
  - Human 结论：批准建立 WorkCase 并推进方案审核。
  - 当前边界：本工作项先承载命名方案、影响面盘点和审核编排；正式执行重命名前仍需 Human 明确确认最终名称、迁移策略和兼容边界。
  - 2026-06-21 补充 Human 结论：正式采用 WorkCase / 工作项；WorkCase / 工作项保留；Plan 作为 WorkCase 内部方案/计划部分保留；一次性迁移对象身份、文件名、目录名、字段名和 Web API，不保留长期兼容 alias；specs 当前正式规范不保留旧对象名作为历史痕迹。
