type: change
title: 统一 specs 机制落地关系章节表达
author: ai
status: done
created: 2026-06-03
updated: 2026-06-03
context: |
  用户确认 00 的“落地责任声明”和 01 的“机制关系声明”实际表达同一类需求：每个 specs 文档都需要明确自身与现有机制的关系，以便后续落地、同步、检查或审计。进一步讨论后确认，最后一列表头不应在“落地触发”和“同步触发”之间二选一，而应上提为“触发条件”，用于同时覆盖落地、同步、检查和审计触发。
decision: |
  1. 将 specs/00-LD-Vibe-Harness理念与纲要.md 第 6 章从“落地责任声明”调整为“机制落地关系”；
  2. 在 00 第 6 章增加机制落地关系表，列明 Rules、Tools 和 Human Gate 的关联实体、关系类型和触发条件；
  3. 将 specs/01-LDVH目录说明.md 第 6 章从“机制关系声明”调整为“机制落地关系”；
  4. 将 00 和 01 第 6 章表头统一为“触发条件”，并统一说明句为“本文通过以下机制关系说明相关机制实体的落地、同步、检查或审计触发条件”；
  5. 更新 specs/03-Specs文档规范.md，将普通 specs 文档的“机制关系声明”统一为“机制落地关系”，并将最小表格列名调整为“触发条件”；
  6. 同步更新 .trae/rules/ldvh-l2-specs-rules.md 入口摘要中的命名；
  7. 更新 00、01 和 03 的更新日期为 2026-06-03。
consequences: |
  - 00、01 和 03 采用同一章节名“机制落地关系”；
  - 普通 specs 文档机制关系表统一使用“触发条件”承载落地、同步、检查或审计触发；
  - 00 与 01 均使用表格表达机制关联、关联实体、关系类型和触发条件；
  - 00 仍保留 L1 Rules 落地要求作为机制落地关系下的展开说明；
  - L2 specs 编辑规则已指向“机制落地关系”；
  - 后续 specs 文档可复用该表达方式，以便 AI 和工具定位机制同步点。
affects:
  - specs/00-LD-Vibe-Harness理念与纲要.md
  - specs/01-LDVH目录说明.md
  - specs/03-Specs文档规范.md
  - .trae/rules/ldvh-l2-specs-rules.md
related_rules:
  - specs/00-LD-Vibe-Harness理念与纲要.md
  - specs/01-LDVH目录说明.md
  - specs/03-Specs文档规范.md
  - .trae/rules/ldvh-l2-specs-rules.md
human_gate:
  required: false
  reason: 本次未改变 LDVH 理念、价值标准、五类构成要素、目录规划、事实源性质或 specs 编号体系，仅统一既有机制关系章节命名和表达方式；执行来自用户明确确认。
validation: |
  待运行 specs 索引、文档规范检查、引用检查和相关测试后更新。
