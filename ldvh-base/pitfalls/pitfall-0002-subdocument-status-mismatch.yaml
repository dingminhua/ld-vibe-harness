id: pitfall-0002
type: pitfall
title: 主文档声明子文档 not-created 但实际文件包含完整内容
status: archived
created: '2026-06-04T03:33:50'
updated: '2026-06-04T03:33:50'
symptoms: |
  specs/22 §14 声明 22.01-Rules.md 和 22.04-Tools.md 为 not-created 状态，
  但实际文件包含完整 active 级别内容，与 not-created 子文档骨架约束矛盾。
trigger_conditions: |
  在 specs 主文档中声明子文档状态时，未同步检查实际文件内容是否与声明一致。
root_cause: |
  子文档状态声明与文件内容更新不同步。主文档更新时只修改了状态字段，
  未验证实际文件内容是否匹配 not-created 骨架约束（04 §6.1）。
resolution: |
  识别矛盾后记录为 Pitfall，后续应通过规范审计流程统一修正：
  要么将主文档中的状态声明更新为 active，要么将文件内容降级为 not-created 骨架。
verification: |
  ## 验证计划

  历史证据格式规范化：检查原 Pitfall 验证证据 是否保留可复查的验证对象、结果或关闭判断；本次仅补齐四段式结构，不新增或改变历史事实语义。

  ## 验证命令

  历史记录未单独记录完整的验证命令；如原字段包含命令、脚本、检查入口或人工检查动作，保留在下方原始证据摘录中。

  ## 验证结果

  原始证据摘录：

  验证方式：读取 22 主文档 §14 和 22.01/22.04 实际文件内容进行比对；
  结果：确认矛盾存在，已记录。
  原文标题：验证结果

  读取 22 主文档 §14 与 22.01/22.04 实际文件内容比对，确认状态声明与文件内容矛盾，已记录为 Pitfall。

  原文标题：结论

  验证通过。

  ## 结论

  本次仅完成证据字段四段式格式规范化；对象状态、关闭判断、验证结果和历史事实语义以原始证据摘录为准，未额外伪造历史验证过程。
avoidance: |
  修改子文档状态声明时，必须同步验证实际文件内容是否匹配：
  - not-created：文件应只包含定位、不创建理由和检查项（04 §6.1 骨架）
  - active：文件应包含完整机制实践内容
  - active-prep：文件应包含正在准备的机制实践内容
applicability: 所有接入 LDVH 的项目，所有事实模型子文档
