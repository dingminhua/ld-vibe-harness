id: workcase-0021
type: workcase
title: v3 旁路工作树与行动指南编译链第一阶段
goal: |
  承接 spark-0038，建立 LDVH v3 旁路实验线的第一阶段执行方案。目标不是立即迁移全部 specs、重写全部 Code 或替换 v2 knowledge-map，而是先把 `../ld-vibe-harness-v3` + `dev-v3` + 管辖项目登记 + 无版本号内部目录 + 最小格式化规范 / compiler / 行动指南 / fixtures / tests 闭环设计清楚，并准备进入 Human 方案确认。

  本 WorkCase 要处理“工作项目可能很多”的风险：将 v3 大方向拆成第一阶段可验证闭环与后续 followup，不把 v2 全量迁移、Runtime 接入、安装 bootstrap、Web 展示、Skill 注册和旧 knowledge-map 删除混入同一轮执行。
status: result_self_checking
created: '2026-06-27T23:23:10.196893'
updated: '2026-06-28T02:35:00+08:00'
priority: P1
description: |
  Human 已确认 v3 可以大胆推进，但版本隔离应由同级 worktree、分支和管辖项目 id 承载；新工作树内部目录不带版本号，以免未来成熟后再迁移目录名。Human 同时提醒，目标句必须带定语：格式化规范应限定为面向 LDVH 规范、事实对象和运行时资产的结构化契约；确定性 Code 应限定为只读、实时、可复查、无语义猜测的编译层；知识地图 / 行动指南应限定为面向当前任务和目标对象的实时任务导航投影。

  Human 进一步调整 v3 骨架：一级目录只放稳定构成面，即 `specs/`、`code/`、`tests/`、`rules/`、`hooks/`、`skills/` 和 `ldvh-base/`。Schema 归入 `specs/schemas/`，fixtures 归入 `tests/fixtures/`。权威关系必须写清：`specs/` 是规则权威；`specs/schemas/` 是规范授权的机器契约；`code/` 消费 schema 但不拥有 schema；`tests/fixtures/` 是验证样例而非规则来源；`ldvh-base/` 是真实事实对象，不混入测试假数据。

  Human 后续指出 `specs/00-bootstrap-charter.md` 会制造 specs 自我授权的鸡生蛋问题，并确认第一批核心规范可放在 `specs/core/`。因此本 WorkCase 对 v3 自举链作出修正：第一批核心 Markdown 规范由 v3 项目决策设立，位于 `specs/core/`；`specs/schemas/` 是 core specs 授权后的机器契约；YAML instances / formatted sources 是被授权后的机器表达；deterministic Code 只消费这些显式输入并生成 Action Guide。上位规范先是规范，不先是 YAML。

  Human 随后明确纠偏：原 LDVH 已有 specs 文档体系，v3 不能另起一套正文分类目录，也不能把原 specs 正文整体 YAML 化。稳定约束是：原 specs 文档体系继续作为迁移基线；`specs/core/` 只放少量上位父层规范；普通 specs 正文仍按原体系逐步迁移、抽象和去冗余；`specs/schemas/` 与 YAML projection 只服务机器契约和确定性解析，不接管正文权威。

  第一阶段要回答：

  1. v3 旁路 worktree 是否以及如何创建；
  2. 如何在工作区根目录管辖配置中登记 v3，避免与 v2 worktree 的 Git common-dir 身份产生歧义；
  3. v3 内部最小目录和最小 specs 应如何命名；
  4. 格式化规范源文件、compiler IR、行动指南输出和 v2 adapter 的第一版契约如何划界；
  5. 哪些 fixtures / tests 足以证明 v3 思路成立；
  6. 哪些事项必须作为后续 WorkCase / Spark 分流，不能进入第一阶段。

  本 WorkCase 不直接要求删除 v2 knowledge-map，不要求当前 v2 specs 原地迁移，不要求修改 Runtime Protocol 或 dispatcher，也不声明 v3 已经成为默认入口。
success_criteria: |
  - [ ] 明确第一阶段边界：只推进 v3 旁路实验线和最小闭环，不执行 v2 全量迁移、不删除 knowledge-map、不重写 Runtime。
  - [ ] 明确 `../ld-vibe-harness-v3` + `dev-v3` + 内部无版本号目录的创建方案和风险；一级目录仅保留 `specs/`、`code/`、`tests/`、`rules/`、`hooks/`、`skills/`、`ldvh-base/`。
  - [ ] 写硬目录权威归口：schema 归 `specs/schemas/`，fixtures 归 `tests/fixtures/`；`code/` 消费 schema 但不拥有 schema；`ldvh-base/` 不混入测试假数据。
  - [ ] 明确 LDVH 管辖项目登记方案，包括 project id、绝对 path、Git common_dir、default_branch，以及同一 Git common-dir 多项目命中时的可验证消歧策略；若现有 dispatcher 会让 v2/v3 worktree 同时命中并阻断，则实际登记必须移出本 WorkCase，或先建立修改 dispatcher 消歧语义的前置 followup。
  - [ ] 形成 v3 最小 specs 清单：目标与边界、格式化规范契约、行动指南输出契约、Code 确定性编译规范、v2 adapter / 迁移适配边界，以及 `specs/schemas/` 的授权边界。
  - [ ] 写硬 v3 specs 去冗余约束：每份 v3 spec / schema 必须声明单一信息对象、权威归口、与 v2 的复用 / 差异边界，不搬运 v2 散文正文，不把可派生检查清单厚写成第二事实源。
  - [ ] 形成 v3 最小 Code 结构建议：parser、compiler IR、validator、action guide projector、v2 adapter、CLI 入口和 tests / tests/fixtures 目录。
  - [ ] 形成行动指南最小输出契约：行动身份、目标证据、P0/P1 read_plan、stop / Human Gate candidates、diagnostics / result_status、next_queries、tool suggestions、post-read action、verification / fallback、source_refs。
  - [ ] 写硬 Code 边界：只读、实时、可复查、无语义猜测；不判断自然语言意图、不授权、不输出 `allowed` / `approved` / `unblocked`。
  - [ ] 写硬 Runtime / dispatcher / Skill 分层：行动指南只输出候选读取、候选停止、候选 Human Gate、候选工具建议和下一步建议；Runtime / dispatcher 继续负责 canonical event、receipt、ack、blocking 和写入 / 提交门禁；Skill 只指导 AI 把语义转成枚举声明或复用流程，不复制 Runtime 判断。
  - [ ] 写硬 AI 负担控制：默认 brief / receipt，P0/P1 有上限，P2/P3 通过 next_queries 展开，跨项目只做召回和影响判断，不全文注入。
  - [ ] 形成 fixtures / tests 矩阵：active spec、active action member、candidate action member、deprecated attachment、invalid input、target-first、fallback read_plan、source_refs、STOP、同 common_dir 多登记歧义和非授权输出。
  - [ ] 列出后续分流清单：v2 specs 选择性迁移、Runtime / Hook 接入、Skill 注册、Web 展示、安装 bootstrap、文件类型 tool_plan、旧 knowledge-map 引用迁移或命名调整。
  - [ ] 完成方案审核，至少包含规范抽象 / 去冗余、Code / Runtime 边界、AI 行动指南负担控制三个视角；存在 needs_changes 时先吸收再进入 Human 方案确认。
source: |
  来源 Spark：`ldvh-base/sparks/spark-0038-v3-sidecar-action-guide-compiler.yaml`。

  Human 要求建立 WorkCase 承接 v3 旁路工作树与行动指南编译链方向，并指出工作项目可能很多。因此本 WorkCase 作为第一阶段总控，只收敛可执行方案和最小闭环，不把全部后续工作合并为单次执行。
orchestration:
  mode: sequential
  execution_items:
    - id: item-1
      title: 收敛第一阶段范围和后续分流边界
      role: scope-design
      mode: single
      input_refs:
        - ldvh-base/sparks/spark-0038-v3-sidecar-action-guide-compiler.yaml
        - LDVH-GOVERNED-PROJECTS.yaml
        - specs/01-规范体系基础规范.md
        - specs/04-Code确定性执行规范.md
        - specs/attachments/04.Att.06-知识地图投影Schema表.md
      expected_output: |
        形成第一阶段执行范围、明确不做事项和后续分流清单。必须把 v2 全量迁移、Runtime 接入、旧 knowledge-map 删除、Web 展示、Skill 注册、安装 bootstrap 等事项移出本轮。
      status: done
      result_summary: |
        已收敛为第一阶段安全子集：创建旁路 worktree 和 orphan-style `dev-v3` 干净根，新增 specs/schemas、action guide 编译器、fixtures 和聚焦测试；不执行 v2 全量迁移、不删除 knowledge-map、不改 Runtime / dispatcher、不修改 Web / Skill / install bootstrap。
      evidence_refs: []
      blocking_reason: ''
    - id: item-2
      title: 设计 v3 worktree 与管辖项目登记方案
      role: runtime-governance-design
      mode: single
      input_refs:
        - LDVH-GOVERNED-PROJECTS.yaml
        - specs/06-运行时扩展规范.md
        - specs/33-ldvh-install-action-LDVH安装行动编排.md
        - code/hook_dispatch.py
      expected_output: |
        给出 `git worktree add ../ld-vibe-harness-v3 -b dev-v3` 的执行前检查、目录命名、分支命名、父级管辖配置登记方式、Git common_dir 消歧风险和验证矩阵。验证矩阵至少覆盖 `target=/v3/file`、`cwd=/v3`、`cwd=/v2 target=/v3/file`、commit staged paths、同 common_dir 多 project id 的 blocked 行为。不得把登记写成已执行事实，除非后续 Human 明确授权执行。
      status: done
      result_summary: |
        已创建 `../ld-vibe-harness-v3` worktree，并将 `dev-v3` 纠偏为不继承 v2 文件的 orphan-style 干净根。已在工作区根目录 `LDVH-GOVERNED-PROJECTS.yaml` 登记 `ldvh-v3`，并在仓库内管辖配置同步记录。未保留 dispatcher、native hook 或测试策略改动；同 common_dir worktree 的运行时消歧仍需后续单独方案确认。v3 首个提交已存在，commit 为 `d1944cf9`。
      evidence_refs: []
      blocking_reason: ''
    - id: item-3
      title: 设计 v3 最小 specs 和 schema 契约
      role: spec-design
      mode: single
      input_refs:
        - ldvh-base/sparks/spark-0038-v3-sidecar-action-guide-compiler.yaml
        - specs/01-规范体系基础规范.md
        - specs/02-事实模型基础规范.md
        - specs/03-行动编排规范.md
        - specs/04-Code确定性执行规范.md
        - specs/attachments/04.Att.06-知识地图投影Schema表.md
      expected_output: |
        形成 v3 最小规范清单和 schema 草案边界。重点定义格式化规范源文件、身份块、父子抽象、状态 / authority、source_refs、行动指南输出和 v2 adapter 的第一版契约；schema 必须归入 `specs/schemas/` 并声明由 specs 授权，不能作为一级目录、独立事实源或 Code 私有配置；每份 v3 spec / schema 必须声明单一信息对象、权威归口、与 v2 的复用 / 差异边界，避免把 v2 重复文本或可派生检查清单直接搬迁。
      status: done
      result_summary: |
        已在 v3 worktree 新增 `specs/schemas/` 契约层，包含 formatted-source、action-guide 和 index 三个 schema / 索引文件。Schema 被放在 specs 授权范围下，Code 只消费，不拥有规则权威。
      evidence_refs: []
      blocking_reason: ''
    - id: item-4
      title: 设计 v3 最小 compiler 和行动指南测试闭环
      role: code-design
      mode: single
      input_refs:
        - code/spec_checks/knowledge_map.py
        - code/hook_dispatch.py
        - code/specs_validate.py
        - tests/code/specs_validate_checks/test_v2.py
      expected_output: |
        给出 v3 code 目录、CLI、parser、compiler IR、validator、action guide projector、v2 adapter、tests 和 `tests/fixtures/` 的最小结构。fixtures 必须归入 `tests/fixtures/`，作为验证样例和回归输入，不得放一级目录、不得作为规则来源、不得混入 `ldvh-base/` 真实事实对象。测试矩阵必须覆盖 candidate 不可执行、deprecated 不可作为 active 来源、P0/P1 不被噪音挤掉、STOP、source_refs、target-first、fallback read plan、同 common_dir 多登记歧义和非授权输出。不得提前实现完整 compiler 或文件类型命令映射。
      status: done
      result_summary: |
        已在 v3 worktree 新增最小确定性编译链：`code/action_guide/`、`code/action_guide_cli.py`、`tests/fixtures/action_guide/` 和 `tests/code/test_action_guide_compiler.py`。编译器只读 YAML 源，要求 source_refs，按 status / authority 生成 usable 或 limited 的行动指南，不输出 allowed / approved。
      evidence_refs: []
      blocking_reason: ''
    - id: item-5
      title: 主控吸收审核并提交 Human 方案确认
      role: controller-synthesis
      mode: single
      input_refs:
        - ldvh-base/workcases/workcase-0021-v3-sidecar-action-guide-compiler-phase1.yaml
      expected_output: |
        吸收方案审核意见，修正范围、成功标准、执行项和后续分流；controller_resolution 必须明确选择一种登记策略：暂不登记、登记但不启用 runtime、或先改 dispatcher 消歧语义。不得用“Human 后续确认”跳过 common_dir 歧义判断；若无硬问题，再等待 Human 确认是否实际创建 v3 worktree / 修改管辖配置 / 新增 v3 文件。
      status: done
      result_summary: |
        已吸收子 agent 方案审核，并根据 Human 后续要求完成管辖登记：`ldvh-v3` 写入工作区根目录管辖配置，仓库内配置同步记录 v3 条目。非配置策略改动已撤回；dispatcher / native hook 的 common_dir 消歧不在本次授权范围内。
      evidence_refs: []
      blocking_reason: ''
  plan_review:
    orchestration_owner: main_controller
    workflow_ref: null
    review_policy:
      selection_reason: |
        本 WorkCase 会决定是否开启 v3 旁路工作树，并为格式化规范、确定性 Code 编译和行动指南建立第一阶段边界。它影响 specs 体系抽象、Code / Runtime 分层和 AI 行动入口，必须先做方案审核。
      required_perspectives:
        - 规范抽象与去冗余
        - Code / Runtime 确定性边界
        - AI 行动指南与负担控制
      optional_perspectives:
        - v2 迁移风险
      tool_method_requirements:
        - 审核只读当前仓库，不修改文件。
        - 必须判断第一阶段是否过大，哪些事项应移出本 WorkCase。
        - 必须检查行动指南是否被误写成事实源、授权器、缓存或第二 Runtime。
        - 必须检查 Code 是否被要求理解自然语言或判断业务价值。
        - 必须检查 v3 worktree 与管辖项目登记是否存在 Git common_dir 多项目歧义。
      aggregation_rule: |
        若任一 required perspective 认为范围过大、Code 边界越权、行动指南造成 AI 负担过高、或管辖登记存在未处理歧义，不得进入 Human 方案确认，必须先修改 WorkCase。
    review_items:
      - id: plan-review-spec-1
        reviewer: subagent-spec-abstraction
        role: 规范抽象与去冗余
        agent_name: Hypatia
        requested_at: '2026-06-28T00:00:00+08:00'
        perspective: specs-abstraction-and-deduplication
        result:
          status: pass_with_followups
          summary: |
            第一阶段范围不算过大，前提是按当前文字理解为“方案与最小闭环设计”，而不是立即创建或实现。WorkCase 已正确避免 v2 全量迁移和厚写第二事实源；v3 最小 specs / schema 清单基本够第一阶段使用。
          key_findings:
            - 已把 v2 全量迁移、Runtime 接入、Web、Skill、安装 bootstrap 和旧 knowledge-map 删除移出本轮。
            - 行动指南被限定为实时任务导航投影，Code 边界写明只读、实时、可复查、无语义猜测和不授权。
            - 风险在于最小 specs 清单执行时仍可能写成多篇互相重叠的小规范。
          required_changes: []
          recommendations:
            - 在 item-3 或 success_criteria 中补充去冗余约束：v3 specs 只写结构化契约和 v2 差异 / 适配边界，不重写 v2 已成立原则。
            - 行动指南 schema 明确 tool suggestions、Human Gate candidates 和 stop candidates 只能作为导航 / 诊断输入，不是 Runtime 阻断或授权结论。
            - 管辖项目登记方案保留 common_dir 多项目命中阻断验证。
          evidence_refs:
            - ldvh-base/workcases/workcase-0021-v3-sidecar-action-guide-compiler-phase1.yaml
            - ldvh-base/sparks/spark-0038-v3-sidecar-action-guide-compiler.yaml
            - specs/01-规范体系基础规范.md
            - specs/04-Code确定性执行规范.md
            - specs/06-运行时扩展规范.md
      - id: plan-review-code-runtime-1
        reviewer: subagent-code-runtime-boundary
        role: Code / Runtime 确定性边界
        agent_name: Planck
        requested_at: '2026-06-28T00:00:00+08:00'
        perspective: code-runtime-determinism
        result:
          status: fail
          summary: |
            Code / Runtime 确定性边界总体方向正确；target-first / fallback read_plan 基本足够。硬问题是 v3 worktree 与 v2 可能共用 Git common_dir，现有 dispatcher 会在同 common_dir 多 project id 命中时阻断，WorkCase 必须把该歧义提升为可验证硬标准。
          key_findings:
            - WorkCase 已写明 Code 不判断自然语言意图、不授权、不输出 `allowed` / `approved` / `unblocked`。
            - Hook / Rules / Skill 分层在来源 Spark 和 06 中清楚，但原 success_criteria 未把它作为硬验收项。
            - v3 作为同仓库 worktree 可能与 v2 共享 Git common_dir；如果同时登记，现有 dispatcher 可能多项目命中并 blocked。
          required_changes:
            - 将同一 Git common_dir 多项目命中消歧升级为可验证硬标准。
            - item-2 增加验证矩阵，覆盖 v3 target、v3 cwd、v2 cwd + v3 target、commit staged paths 和同 common_dir blocked 行为。
            - item-5 的 controller_resolution 必须明确选择登记策略：暂不登记、登记但不启用 runtime、或先改 dispatcher。
          recommendations:
            - success_criteria 增加 Hook / Rules / Skill 分层验收。
            - item-4 测试矩阵补同 common_dir 多登记 fixture，避免把“项目可发现”误写成“runtime 已可安全管辖”。
          evidence_refs:
            - ldvh-base/workcases/workcase-0021-v3-sidecar-action-guide-compiler-phase1.yaml
            - ldvh-base/sparks/spark-0038-v3-sidecar-action-guide-compiler.yaml
            - specs/06-运行时扩展规范.md
            - code/hook_dispatch.py
            - LDVH-GOVERNED-PROJECTS.yaml
      - id: plan-review-ai-guide-1
        reviewer: subagent-ai-guide-load
        role: AI 行动指南与负担控制
        agent_name: Dalton
        requested_at: '2026-06-28T00:00:00+08:00'
        perspective: ai-action-guide-load-control
        result:
          status: pass_with_followups
          summary: |
            行动指南最小输出契约总体足够，负担控制方向正确。计划已避免把行动指南写成事实源、授权器、缓存或第二 Runtime；post-read action 和 brief / receipt 后续应补成更硬的字段预算与枚举语义。
          key_findings:
            - 最小输出契约覆盖 AI 从读取到停止、追问、验证的核心动作。
            - 默认 brief / receipt、P0/P1 上限、P2/P3 走 next_queries、跨项目不全文注入能避免形成大上下文。
            - STOP、source_refs、next_queries 和 P0/P1 的意图清楚。
