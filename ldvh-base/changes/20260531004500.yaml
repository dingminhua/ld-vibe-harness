summary: 增加行动模型落地前决策后的价值与要素审查要求
changes:
  - 在行动模型模型定义中增加落地前决策和价值与要素审查
  - 在行动模型标准组成中增加落地前决策和价值与要素审查
  - 将 4.7 调整为落地前决策、价值与要素审查、落地初始化、落地审计与合规检查
  - 明确落地前决策完成后、实际落地初始化前，必须依据 00 总纲执行价值与要素审查
  - 定义价值与要素审查至少覆盖 V1-V7 价值实现标准、五类构成要素边界、AI 第一服务对象、事实源边界、机制膨胀和 Human Gate
  - 更新完整方案形成流程，要求落地前决策后依据 00 总纲执行价值与要素审查
  - 更新行动模型规范写作检查表，增加落地前决策和价值与要素审查检查项
reason: 用户提出所有行动模型在落地前决策后，应基于 00 总纲进行价值和要素审查，以确保落地方案服务 LDVH 总体价值并保持五类构成要素边界清晰
impact:
  - 后续 41-69 具体行动规范都应在落地前决策后增加或引用价值与要素审查
  - 实际落地初始化必须以价值与要素审查结论为前置输入
  - 可避免为机制而机制、制造第二事实源、绕过 Human Gate 或偏离 AI 第一服务对象的问题
