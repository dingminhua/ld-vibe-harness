closure_evidence: |
  task-0048 独立验收前补充的可追溯分析证据。

  一、三层规则逐条对比与重叠度分析

  对比对象：
  - 场景规则：.trae/rules/ldvh-fact-model-rules.md
  - 工作区规则：.trae/rules/ldvh-workspace-rules.md
  - 项目规则：ld-vibe-harness/.trae/rules/ldvh-project-rules.md

  逐条对比结果：
  1. 场景问候语：工作区规则已覆盖 Hello，LDVH；后半句仅为仪式性补充。判定：部分重叠。
  2. 编辑前读取链路：工作区规则覆盖读取策略，项目规则覆盖按任务读原文。判定：部分重叠。
  3. 字段契约、状态机、Human Gate 等执行约束：工作区规则和项目规则均有部分覆盖。判定：部分重叠。
  4. 不得把 ldvh-base YAML 当普通配置文件修改：项目规则硬约束间接覆盖，但无直接表述。判定：低重叠。
  5. 不得绕过对象状态机：项目规则覆盖 Task blocked_by 和 acceptance，但未完整覆盖所有对象状态机。判定：低重叠。
  6. 不得跳过 Human Gate：工作区规则已明确覆盖事实源创建、关键状态流转、ADR 写入、规范升级和高风险变更。判定：高重叠。
  7. 不得自行添加对象规范未定义字段：工作区规则和项目规则均无等价表述。判定：无重叠。
  8. 不得将 proposed ADR 作为执行依据：工作区规则和项目规则均明确覆盖。判定：完全重叠。
  9. 不得未读对象规范就编辑事实实例：工作区读取策略和项目规则回原文要求部分覆盖。判定：部分重叠。
  10. ADR 特别入口：工作区规则要求先调用 ldvh-adr，项目规则有 ADR 入口。判定：完全重叠。
  11. Task 执行前先状态流转：项目规则间接覆盖，但未直接表述。判定：低重叠。
  12. blocked_by 未全部关闭不得执行：项目规则明确覆盖。判定：完全重叠。
  13. Task 关闭需 acceptance、子任务、closure_evidence 满足：项目规则覆盖 acceptance，specs/27 覆盖完整关闭条件。判定：部分重叠。
  14. verifying -> review_needed、高风险操作、创建子任务需 Human Gate：工作区规则覆盖高风险 Human Gate，specs/27 覆盖状态机。判定：部分重叠。
  15. 子任务不得再创建子任务：specs/27 覆盖，但工作区/项目规则未覆盖。判定：无重叠。

  统计：完全重叠 3 条，高重叠 1 条，部分重叠 7 条，低重叠 3 条，无重叠 2 条。若将部分重叠及以上视为已有规则体系可感知覆盖，则覆盖 11/15，约 73%。

  二、场景规则独有内容清单与必要性评估

  1. 问候语后半句“我们在操作工作区规定限制的文件”：低必要。它只增强仪式感，不产生实质约束。
  2. 编辑前读取具体步骤链：中必要。有指导价值，但更适合放入项目规则入口，而不是独立场景规则。
  3. 不得把 ldvh-base YAML 当普通配置文件随意修改：中必要。应合并到项目规则硬约束。
  4. 不得绕过对象状态机：中必要。应合并到项目规则硬约束。
  5. 不得自行添加对象规范未定义字段：高必要。其他两层缺失，应合并到项目规则硬约束。
  6. 不得未读对应对象规范就编辑事实实例：中必要。应合并到项目规则硬约束，并强化“不读不编辑”。
  7. Task 关键规则摘要：低必要。它是 specs/27 的摘要，若项目规则已经要求回原文，则不应在场景规则重复维护。
  8. ADR 特别入口：低必要。工作区规则和项目规则已有 ADR 入口，且更明确要求调用 ldvh-adr。

  三、移除推演与合并方案

  假设移除 .trae/rules/ldvh-fact-model-rules.md：
  - 丢失问候语后半句：无实质影响，可直接丢弃。
  - 丢失编辑前读取链路：有轻微影响，应合并到项目规则入口。
  - 丢失四条事实实例硬约束：有中高影响，应合并到项目规则硬约束。
  - 丢失 Task 摘要规则：影响较低，应依赖 specs/27 原文，不再重复摘要。
  - 丢失 ADR 摘要入口：影响较低，工作区规则和项目规则已有覆盖。

  建议合并到项目规则的内容：
  - 编辑 ldvh-base YAML 前必须识别所属项目，读取项目规则，再按对象类型读取对应工作模型规范。
  - 不得把 ldvh-base YAML 当普通配置文件随意修改。
  - 不得绕过对象状态机。
  - 不得自行添加对象规范未定义字段。
  - 未读取对应对象规范和结构化契约章节时，不得编辑事实实例。

  建议同步修改工作区规则：
  - 将“编辑 ldvh-base YAML 进入 ldvh-fact-model-rules.md”改为“编辑 ldvh-base YAML 遵守项目规则中的事实实例硬约束，并按对象规范读取原文”。
  - 压缩保护中移除“ldvh-base 见事实模型规则”。

  四、最终建议

  建议移除场景规则层，将有效内容合并到项目规则。原因：场景规则多数内容与始终生效的工作区规则、项目规则或 specs 原文重叠；它还承载了对象规范摘要，增加维护成本并分散注意力。保留工作区规则 + 项目规则 + specs 原文的两层入口结构，更清晰、更稳定。

  ## 验证结果

  三层规则逐条对比完成，覆盖 11/15（约73%），场景规则独有内容中2条无重叠（不得自行添加未定义字段、子任务不得再创建子任务），建议移除场景规则层并将有效内容合并到项目规则。

  ## 结论

  任务完成，人工确认关闭。
