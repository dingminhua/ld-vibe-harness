title: "独立审核的语义定义缺失——AI 按字面理解调用 subagent 导致执行卡住"
status: open
priority: P2
intent: "WC 执行过程中，\"独立审核\"一词在 LDVH 体系中缺乏明确定义。AI 只能依赖模型训练时的通用语义（\"找一个没参与过的独立 subagent 去审核\"），但在当前环境下：1) 可能没有可用的 subagent/spawn 工具；2) subagent 启动后缺少上下文无法做有意义的审核；3) 工具调用卡住不返回，主控干等；4) AI 因为调不了 subagent 而卡在\"下一步该怎么做\"的判断上，形成死锁。若不建立本 Spark，后续每次 WC 执行到独立审核节点时，AI 都会重复卡在\"如何实现独立审核\"的语义理解上，且每次卡住的原因和表现不一致，无法形成系统化改进。本 Spark 记录的是语义定义缺失问题，与 spark-0052（谎报审核）是不同维度——前者是\"不知道怎么做\"，后者是\"声称做了但没做\"。"
summary: |
  **问题**

  "独立审核"在 LDVH 体系中没有明确定义。AI 拿到这个词后，按字面理解去执行——"独立" = "一个没参与过项目的独立 subagent"。然后：

  1. AI 尝试调 subagent/spawn 工具，但当前环境可能根本不存在可用的 subagent 能力
  2. 即使有 subagent 工具，subagent 启动后没有上下文，做不了有意义的审核
  3. subagent 调用卡住不返回，主控干等，流程死锁
  4. 更糟的是，AI 因为调不了 subagent 而卡在"下一步该怎么做"的判断上，形成死锁

  **根源**

  根本原因是"独立审核"这个词在 LDVH 体系里只有通用语义，没有 LDVH 自己的定义。AI 只能依赖模型训练时从通用语料学到的理解——"独立审核 = 找另一个没参与的人/agent 来审"——这在当前环境下往往不可行。

  实际上 LDVH 要的"独立审核"应该是指"判断视角的独立，不一定是执行环境的独立"。可接受的执行方式包括：

  - **同一 AI 切换视角自审**：以"reviewer 视角"重新通读一遍方案，做出独立判断
  - **checklist 结构化自审**：基于来源定义的审核清单，逐项检查并记录结果
  - **Helper 只读检查与机械验证**：利用 Helper 已有能力（read-fact-objects、check-fact-integrity 等）做客观验证
  - **subagent 委派**（仅当环境确实可用时）：有可用 subagent 时才委派，且有超时/降级/重试机制
  - **不可接受的行为**：卡住不推进、谎报审核、或者用"没有 subagent 所以审核无法完成"作为阻塞理由

  **与 spark-0052 的区别**

  - spark-0052（AI 谎报独立审核）：AI 声称做了审核但实际没做，是**欺骗行为**
  - 本 Spark（语义定义缺失）：AI 不知道"独立审核"在 LDVH 语境下具体指什么，是**语义理解问题**

  两者是不同维度的问题，但可能相互加剧：没有明确定义时，AI 更容易谎报审核。

  **承接情况**

  workcase-0062 已完成 21 §4.5「独立审核」定义条文起草，覆盖：核心语义（判断视角独立性优先于执行环境独立性）、只读原则、可接受执行方式闭集及优先级（切换视角自审、checklist 审核、Helper 只读检查、委派一个或多个只读 subagent 并行复核——数量按需不固定）、不可接受行为、适用范围。34 号模板适用范围段已同步更新独立审核引用说明。

  **残留事项**

  subagent 环境能力声明与独立性证明机制需后续规范处理，未在 workcase-0062 范围内。

  **需要判断的事项**

  1. 在哪个规范层定义"独立审核"的语义？候选：21 号 WorkCase 规范（§4.4 受控创建/§9 结果与复核）、34 号执行模板、或独立章节
  2. 定义应包含哪些内容：可接受的执行方式、不可接受的行为、独立性保障机制？
  3. 是否需要在 34 号执行模板中增加"独立审核执行指南"步骤，明确列出 AI 可选的审核方式？
  4. 是否需要与 subagent 能力解耦——即"独立审核"不依赖 subagent 存在也能执行？
  5. 审核结果如何留痕，以便后续审计和追溯？

  **边界**

  - 本 Spark 只记录语义定义缺失问题与待判断方向，不授权修改规范、模板或 Code
  - 本议题与 spark-0052（谎报审核）、spark-0054（审核流程拆分）是相关但不同的问题，需分别判断和处置
  - 不预设"独立审核"必须通过 subagent 实现，也不预设 subagent 能力一定存在
