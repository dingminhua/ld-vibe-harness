title: 治理范围解析结果的防误判交付
status: implemented
summary: "**承接结果**\n\n- `pitfall-0005` 已完整记录原议题的实际症状：把项目 Git worktree 误作显式 `workspace_root` 时，Helper 会在该精确目录内报告配置缺失和管辖范围未知，即使父工作区存在有效配置。\n- 该 Pitfall 同时保存了适用条件、根因、已验证解决方式和规避检查：区分项目 worktree 与配置所在工作区根；不需固定配置根时省略 `workspace_root` 并传入实际工作对象；显式选择时先确认目标目录直接包含配置。\n- 原 Spark 对“请求完成”与“已形成可用管辖范围”的区别、配置搜索边界、missing 直接原因和调用方默认行为的全部内容，均已由该稳定经验对象承接，没有未分流部分。\n\n**处置边界**\n\n分流只记录当前承接已经成立；`pitfall-0005` 后续的状态或适用范围变化不反向改变本 Spark 的终态，也不表示所有安装布局具有相同行为。"
intent: 厘清治理范围解析及其上层调用的防误判交付：保留 Human 对工作区根和配置位置的选择权，不让 Helper 自动越过显式边界；同时使局部配置缺失、有效管辖范围未形成和全局配置不存在这三件事不再被混同。后续应界定 Helper 响应、诊断字段、调用方默认行为和回归测试的最小改动。
disposition_summary: 全部原始内容已由 `pitfall-0005` 完整承接：它逐项记录误传项目 worktree 为 `workspace_root` 的症状、触发条件、适用边界、根因、实际解决、规避方法和验证范围。该目标当前 mechanically valid 且标题可读；本 Spark 没有残余内容，目标后续生命周期不影响本次分流成立。
