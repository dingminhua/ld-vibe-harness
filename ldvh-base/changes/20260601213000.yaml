id: CHG-20260601213000
title: 在 14 §6.1.1 增加标准化读取工作流
date: 2026-06-01
changes: |
  1. specs/14 §6.1.1.1 新增标准化读取工作流五步流程
  2. specs/14 章节索引更新，反映 §6.1.1.1
reason: |
  §6.1.1 读取策略定义了五条原则，但没有定义具体工作流。
  AI 不知道应该先 Grep 还是先 Read 索引，导致索引和 Grep 的配合关系不清晰。
  补齐标准化工作流后，Grep 是主路径（发现+定位），章节索引是补充路径（主题判断），两者配合使用。
impact: |
  - AI 读取规范文档时按五步工作流执行：Grep → 索引补充 → 精准读取 → 按需扩展 → 全文升级
  - 不得跳过 Grep 直接 Read 全文
  - 章节索引的定位明确为"主题判断补充"，而非"发现+定位主路径"
validation: |
  1. specs/14 §6.1.1.1 已定义五步工作流
  2. specs/14 章节索引已更新
project: ld-vibe-harness
tags:
  - reading-strategy
  - reading-workflow
  - specs
