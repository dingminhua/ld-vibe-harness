summary: "**当前判断**\n\n- 环境落地不是单次安装命令：需要把可用资产、目标环境、配置位置、安装前条件、安装动作、安装后验证、停用/卸载和故障定位连成可回读的责任链。\n- 规范或能力资产变化可以提示需要复核的同步影响，但不能由此证明环境已部署，也不授权自动改写用户配置、Rules、Skill 或其它环境资产。\n- README 已提供新环境 AI 的最小接入指引，指向当前接入面、09 与 33；它只解决接入前的发现入口，不替代目标环境资料、Human 授权或真实触发验证。\n- 当前环境的有限安装、触发或 doctor 证据只能支持其实际覆盖范围；不能外推为其它环境、其它配置拓扑或完整生命周期已经成立。\n- 2026-07-23 通过 ZCode 环境实际安装 ldvh 插件并验证 pitfall-0001，验证了 5 层检查模型的前 3 层：资产完整性（data 目录未同步）→ 可执行性（手动模拟成功）→ 触发验证（hook 静默不触发）。修复第 1 层后第 3-4 层自动通过。\n\n**需要形成的诊断闭环**\n\n- 选定环境的最低依赖、可接受配置位置、信任/启用前置条件，以及与已有用户配置的冲突或共存边界。\n- 安装前检查、安装后功能验证、停用或卸载后的残留检查分别证明什么；doctor/bootstrap 需要如实暴露未安装、部分安装、不可验证和故障定位，而不是制造成功结论。\n- 固定受管资产与现场配置/临时脚本分层：前者可作为受管资产核验，后者只能保留其实际安装或观察范围。\n- 5 层检查模型（资产完整性 → 可执行性 → 触发验证 → 功能验证 → 边界验证）已在 pitfall-0001 中通过实际案例验证前 3 层。\n\n**未决事项**\n\n- 不预设通用 CLI、Skill 或单一配置拓扑；先按目标环境形成最小闭环，再判断是否需要把稳定安装流程转为 WorkCase 或行动模板。\n- 哪些配置位置、风险接受和跨环境支持范围必须由 Human 决定，仍需在实际目标环境中明确。\n- 5 层检查模型的第 5 层（边界验证：重启、compact/resume、版本升级、多来源注册）尚未充分验证。\n- 安装验证流程本身是否需要通过 Hook 来自动化（PreToolUse 写前引导、PostToolUse 写后校验），由 spark-0029 承接。"
