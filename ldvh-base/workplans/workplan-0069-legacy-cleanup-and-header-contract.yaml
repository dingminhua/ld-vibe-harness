priority: P1
description: |
  清退旧 TaskPlan / Task / SubTask 工作对象事实源和兼容入口，并把 specs Markdown 头部 `> 字段：值`
  元信息明确升级为人、AI、Code、Web 可共同消费的稳定契约。此次变更不保留旧对象兼容能力，
  因为项目尚未推广且没有外部使用者；历史事实由 Git 历史承载，当前事实源只保留 active 工作模型。
success_criteria: |
  - [ ] `ldvh-base/taskplans/`、`ldvh-base/tasks/`、`ldvh-base/subtasks/` 不再作为当前事实源目录存在
  - [ ] Code 不再把 `taskplan`、`task`、`subtask` 作为可读、可写、可校验或可迁移工作对象类型
  - [ ] Web 不再暴露 TaskPlan / Task / SubTask 的默认入口、详情布局、兼容夹具或测试假设
  - [ ] specs 中旧对象兼容、迁移保留、历史夹具维护等当前规则痕迹已清理或改写为当前事实规则
  - [ ] `specs/03`、`03.01`、`03.02`、`03.03` 写清普通头部元信息契约与 `ldvh_member` 成员自描述契约的边界
  - [ ] 规范和 Code/Web 校验通过，残留风险与后续 Code 检查候选已记录
source: |
  Human Gate confirmed by dmh2002 on 2026-06-18:
  用户明确要求“不需要保留兼容能力，这个项目还没推广，没有其他人用”，并要求清理历史痕迹；
  同时要求评估并设计 LDVH specs 文档的“标准文件元信息契约”，保持 `> 字段：值` 头部格式，
  不把 `ldvh_member` 字段搬进普通头部，不新增与成员自描述冲突的头部字段。
