id: workplan-0071
type: workplan
title: 沉淀清退与契约化经验并准备流程规范
status: draft
created: '2026-06-18T09:11:44'
updated: '2026-06-18T09:23:40'
workarea: workarea-0012
priority: P2
description: |
  在旧对象清退和文件元信息契约标准化过程中，记录中间问题、残留风险、Code/Web/Specs 协同经验和
  后续流程规范候选。该 WorkPlan 不替代前两个执行计划，只负责把过程经验回写到 Memo、待补齐事项
  或后续规范准备材料，避免执行中的经验只留在对话里。本计划处于待审状态，必须在独立流程治理复核
  和 Human 明确批准后才能执行。
success_criteria: |
  - [ ] 执行过程中遇到的阻塞、降级、残留风险或无法一次完成事项已记录到 Memo
  - [ ] Code/Web/Specs 三方契约协同中的经验和问题已形成可复用总结
  - [ ] 对未来相关工作流程规范的候选要求已回写到 Memo、closure_evidence 或后续 WorkPlan，至少覆盖拆分、审批、执行、问题回写和最终复盘
  - [ ] 本轮“计划审核 / Human 执行审批漏检”已形成稳定记录，并作为后续流程规范候选输入
  - [ ] 每个 WorkPlan 完成后均已安排独立专业子 Agent 做完成后检查，检查结论进入对应 WorkPlan 的 verification_evidence 或 closure_evidence
  - [ ] 每个 WorkPlan 关闭前均已判断是否需要把经验写入 Memo、把可复用踩坑写入 Pitfall，或把流程改进候选分流为后续 WorkPlan
  - [ ] 最终回报中明确说明三个 WorkPlan 的完成情况、校验结果、残留风险和经验总结
source: |
  Plan creation requested by dmh2002 on 2026-06-18:
  用户要求把这些事拆成三个 WorkPlan，审批后依次执行，中间不要停；若发生问题记录到 Memo，
  最后在回报中告知，并从过程中总结经验和问题，用于完善当前流程并为未来相关工作流程规范做准备。
  独立流程治理审批子 Agent 初审返回 REQUEST_CHANGES，要求明确计划审核和执行前批准门槛、过程 Memo 触发规则、
  流程改进候选稳定回写位置和专业复核要求。
  用户随后补充要求：WorkPlan 完成后还需要独立子 Agent 检查；WorkPlan 最终总结要写入 Memo 或 Pitfall；
  整个工作流程也要记录到 Memo，后续打磨成标准工作流程。
