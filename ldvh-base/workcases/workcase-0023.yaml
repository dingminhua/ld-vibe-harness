  statement: 只有 items 3–6 提交与验证均成立时 spark-0039 才收口正文、未决、evolution、adr-0006 关系并 implemented；否则保持 open。
- criterion_id: criterion-evidence
  statement: item 3–6 各有独立本地提交，每次 precheck 外层 ok 且 mechanical_outcome passed；每次事实写后回读与 integrity；最终验证锚定干净 HEAD，并形成完整 Gate2 材料与未验证范围。
