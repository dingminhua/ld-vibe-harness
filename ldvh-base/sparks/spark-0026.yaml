title: 取消泛化降级概念并恢复具体原因语义
intent: 保留 LDVH 曾将不同问题泛化表述为“降级”的语义回归，避免工具不可用、输入或证据不足、能力缺口、验证失败和风险接受被包装为已成立的替代方案。后续需逐处恢复问题原因、当前影响、主线是否可继续和后续承接位置，并只把旧 `degraded` 保留为有边界的兼容输入。
status: implemented
summary: "**结论**\n\n- “降级”不再作为 LDVH 的正式机制、状态、路径、验证方式、关闭结果或 Human-facing 主展示。问题必须分别说明原因、当前影响、主线是否可继续和后续承接位置。\n- 工具不可用、输入不足、证据不足、能力缺口、事实冲突、未验证、失败阻断、取消和风险接受不是同义结果；长期接受残留风险仍须经 Human Gate 与 ADR。\n\n**已稳定承接**\n\n1. **模板与环境接入。** 06 将缺输入表述为退出模板后转回普通求解或交还；09、33 分别表达 no-op、映射拒绝、输入缺失、能力缺口、失败、回滚与未验证范围。\n2. **Windows 事实写入。** 创建、普通事实更新和 WorkCase 更新均明确未写入/未替换的对象、缺少的 allocator 或锁及耐久/并发保障，以及 Human 对具体残留风险的决定。\n3. **Web 历史兼容。** `degraded` 仅可作为旧后端输入读取，并以不冒充成功的风险语义呈现；当前对象和新规则不产生该状态。\n4. **最高原则。** 00 已删除将“降级”与暂停、分流、交还并列的泛化处理入口。\n\n**范围判断**\n\n- 对其余 Specs 与附件的命中已完成分类：它们是禁止把失败错误地降成通过、降低 profile/归口等普通技术约束，不建立泛化机制。\n- 原始信息需求已由上述当前 Specs、Helper 与 Web 兼容边界完整承接；本 Spark 不再承担待处置入口。"
evolution:
- at: '2026-07-22T14:35:45+08:00'
  summary: Human 指出 V3 已明确取消“降级”概念，并要求调查这一决策在 V4 中是否被重新引入。由此保留本 Spark：需要把泛化措辞还原为具体原因、影响、是否阻断与后续承接，而不是把不同问题包装为可接受的替代方案。
- at: '2026-07-22T14:47:00+08:00'
  summary: 初始表述曾错误保留“受限替代”作为可能成立的正式概念。经回读 V3 已确认的 Human 决定后，纠正为取消泛化“降级”概念：旧 degraded 只可作为有边界的兼容输入，当前规则和页面必须表达具体原因、影响、是否阻断与后续承接。
- at: '2026-07-22T15:22:16+08:00'
  summary: 完成对 06、09、33、事实创建 Helper 与 Web 的定点核对。确认 06 实际是退出模板分支；09、33 应分别表达环境映射、输入、能力、验证与交还的具体结果；Windows file-only 是耐久与并发保障的风险接受问题；Web 的 degraded 仅保留历史输入兼容。尚未据此改动规则或实现，先保留为逐点方案与验收的依据。
- at: '2026-07-22T15:42:08+08:00'
  summary: 依据定点核对更新 06、09、33 与事实创建 Helper：模板缺输入时退出模板并转回普通求解或交还；环境接入分别表达 no-op、拒绝、输入缺失、能力缺口、失败和未验证范围；Windows 创建提示明确未创建对象、受影响的 allocator/耐久/并发保障与 Human 风险决定。Web 未改动，仍只兼容读取历史 degraded 输入。
- at: '2026-07-22T15:58:07+08:00'
  summary: 对其余 V4 Specs 与附件完成只读分类。01、03、05、07、08、21 及附件中的命中均为禁止把失败、检查、profile 或结论错误降低为通过／较弱层级的普通约束，不建立泛化状态或处理路径。仅发现 00 §9 仍将“降级”与暂停、分流、交还并列为未满足时的泛化处理；00 是最高原则且不可由本次修改，保留为需要 Human 决定的遗留项。
- at: '2026-07-22T16:16:28+08:00'
  summary: 00 已移除泛化处理入口；随后发现并修正普通事实更新与 WorkCase 更新中三处 Windows file-only 耐久降级文案，使其与创建操作一致地说明未写入对象、缺少的锁/allocator/耐久/并发保障和 Human 具体风险决定。最终扫描确认 Specs 其余命中均为普通技术约束，Web degraded 仅保留历史读取兼容；原始信息需求已由当前稳定位置完整承接。
disposition_summary: V3 取消泛化“降级”概念的要求已由 00、06、09、33、三类事实写入 Helper 操作及 Web 的历史输入兼容边界完整承接。其余 Specs 与附件命中均经分类确认不建立泛化状态或处理路径，因此本 Spark 不再保留待处置内容。
