status: closed
title: 受管事实对象中文为主最低机械校验
goal: 在当前 HEAD da902935 之上，为受管事实对象中文为主自然语言字段建立最低机械写入校验：本次新写或变更字段完全不含汉字时拒绝，含汉字只作为最低条件；保持历史英文对象读取兼容且不迁移。
scope: 仅允许修改事实对象统一字段登记中的中文为主自然语言字段矩阵、机械校验目录三表，以及 validation、create、通用 update、WorkCase 专属写入和其直接测试。仅作本地代码与规范修改。明确排除当前 prepare-fact-object-update WorkCase 的未提交文件、署名契约、prepare-fact-object-update、其它 stash 事项、事实对象迁移或改写、Web/API、依赖、网络、Git commit、push；不得 restore、apply 或 checkout stash。
success_criterion_definitions:
- criterion_id: criterion-language-matrix
  statement: 字段矩阵明确受约束自然语言字段、CJK 最低字符闭集、含汉字非中文为主充分证明、托管和结构字段排除、读路径不适用，以及带身份数组的变更对照边界；05.Att.02 三表对同一 rule_key 与 coverage_status 保持一致。
- criterion_id: criterion-create-protection
  statement: 受控创建直接复用共享最低校验；纯英文受约束新字段被拒，含中文字段通过最低门槛。
- criterion_id: criterion-update-protection
  statement: 通用 update 与 WorkCase 全部专属写模式以 enforce_chinese_primary 启用同一检查，并仅检查本次变更字段；未变更的历史英文字段不被拒绝。
- criterion_id: criterion-history-compatibility
  statement: 历史英文对象在读取、候选、readback 与完整性路径保持兼容，不迁移或自动改写。
- criterion_id: criterion-validation
  statement: 指定 facts、helper 与 specs 聚焦 pytest 以及 ./ldvh check 取得实际通过结果，并覆盖纯英文拒绝、含中文通过、WorkCase 写入与历史兼容。
success_criterion_results:
- criterion_id: criterion-language-matrix
  outcome: satisfied
  summary: 字段矩阵和机械目录三表已同步登记。
- criterion_id: criterion-create-protection
  outcome: satisfied
  summary: 创建路径直接复用最低校验，验证覆盖英文拒绝和含中文通过。
- criterion_id: criterion-update-protection
  outcome: satisfied
  summary: 通用更新与 WorkCase 专属写事务均启用 before 限定的检查。
- criterion_id: criterion-history-compatibility
  outcome: satisfied
  summary: 读取路径未接入该规则，未变更历史英文保持兼容。
- criterion_id: criterion-validation
  outcome: satisfied
  summary: 指定 137 项 pytest、8 项 specs pytest 和 ./ldvh check 均通过。
result_summary: "已完成中文为主最低机械校验的来源登记、创建和更新入口接入及回归验证。\n额外评估确认：所有 Human/AI 可读散文不必要全部纳入机械校验，当前矩阵 44 字段覆盖完整。\n修正：current_summary 补入 frozenset；数组对照改为按稳定身份；补充嵌套 item 与身份数组正反例测试。"
validation_summary: "pytest test_validation 64 passed（含中文为主 8 项）。\n评估验证：frozenset 与字段登记表交叉比对无差异（44 字段一致）；身份数组对照已补测通过。\n范围说明：共享校验、创建、通用更新与 WorkCase Helper 写入口已验证；close/correct 全入口与身份数组覆盖仍为机械目录已知 incomplete。"
