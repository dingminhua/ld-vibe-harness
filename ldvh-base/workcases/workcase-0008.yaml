scope: 覆盖 tools/verify_native_windows.py 的 preflight（8 个基础探针）与 core-readonly （追加 public_write_fail_closed 策略探针及 ruff 检查）两阶段在真 Windows 上的实际运行与证据收集； 覆盖 evidence 落盘（源码树外固定 NTFS 卷、干净 Git worktree）与 core-summary.json 等产物的读取。 排除 core-full 写矩阵（受 file_only 耐久性 Human Gate 阻塞，不在本案范围）、adapter-handoff （独立 Human Gate，本案只记录不执行），以及任何 Git commit/push/PR 与远端发布动作。 本 WorkCase 推进 spark-0004 的「真实支持范围/未支持范围/验收结论」中的只读与公开写策略部分； 写能力的耐久性等 Human 决定项保持为 spark-0004 的未决风险，不在本案关闭。
