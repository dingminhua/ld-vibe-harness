  用户指出当前仍不清楚具体跨环境能力差异如何处理，例如 Codex 里的 Skill + Hook 效果到 Trae 里只有 Skill 时，LDVH 应如何承接、降级、拆分、补偿或记录缺口。

  本 Task 用于从 ECC 中寻找能力承接差异处理依据，研究 Skill、Hook、Agent、Rules / Instructions、Code、Web 等能力在不同 AI 开发环境中的等价、降级、替代和缺口记录方法，并为 LDVH 04 矩阵与相关规范提供前置答案。
