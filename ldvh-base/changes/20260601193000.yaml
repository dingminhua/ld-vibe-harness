type: change
title: 记录 ADR Tools 受控写入能力缺口
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  机制和上位规范已补充要求：主模型流程或 Skill 流程存在可机械化事实源写入步骤时，必须反向检查 Tools 是否具备对应受控写入执行能力。
  按新规则重新评估 ADR 后发现，`21.02-Skill.md` 中的 ADR 创建、升级、推翻和废弃流程包含编号生成、ADR YAML 写入、状态流转写入、关联字段回写、推翻或废弃字段回写和 Change 记录生成等可机械化写入步骤。
  当前 `21.04-Tools.md` 与 `tools/adr_index.py` 仅覆盖读取、索引、查询、统计和校验能力，未实现上述受控写入能力。
decision: |
  更新 `specs/21.04-Tools.md`，明确其 active 状态仅表示 ADR 只读、查询、统计和校验能力已形成实体实现与测试验收，不表示 ADR Tools 已完整支撑受控写入执行。
  在 `specs/21.04-Tools.md` 中新增受控写入能力缺口章节、后续能力清单、合规检查项和待补齐事项。
  更新 `specs/21-ADR-决策记录.md` 的 Tools 辅助适配、落地初始化、落地审计、合规检查和待补齐事项，明确 ADR Tools 受控写入能力缺失是完整落地初始化阻塞项或暂缓项。
consequences: |
  - ADR 当前不得因只读、查询、统计或校验能力存在而声称 Tools 完整支撑对象模型落地。
  - `ldvh-base/adrs/` 不应作为完整落地初始化产物直接创建，除非后续单独 Human Gate 确认为最小目录初始化且明确不等同完整落地。
  - ADR Tools 后续应补齐编号生成、ADR 创建、状态流转写入、关联字段回写、推翻或废弃字段回写、Change 记录生成和写入后验证能力。
  - 受控写入能力实现时必须同步更新 `tests/tools/test_adr_index.py` 并记录测试命令和结果。
affects:
  - specs/21-ADR-决策记录.md
  - specs/21.04-Tools.md
related_rules:
  - specs/04-LDVH模型子文档规范.md
  - specs/12.01-Tools辅助规范.md
  - specs/13-LDVH事实模型基础规范.md
  - specs/21.02-Skill.md
  - specs/21.04-Tools.md
human_gate:
  required: true
  confirmed_by: user
  confirmation_context: 用户确认执行 ADR 个案规范修正，将 Tools 受控写入能力缺口正式写入 ADR 主规范和 21.04 Tools 子文档。
validation: |
  1. 已按新机制复核 21.02 Skill 流程中的可机械化写入步骤。
  2. 已确认当前 ADR Tools 仅实现只读、查询、统计和校验能力。
  3. 已在 21.04 和 21 主规范中记录受控写入能力缺口及完整落地阻塞关系。
  4. 已执行 `python3 -m pytest tests/tools/test_adr_index.py`，结果为 8 passed。
  5. 已执行 `python3 -m py_compile tools/adr_index.py`，结果通过。
