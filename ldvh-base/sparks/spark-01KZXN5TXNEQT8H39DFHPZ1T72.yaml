title: Helper 只读交互优化
status: open
priority: P2
intent: 承接 spark-0019 路由的模板内容重复传输问题（read-action-template-content 同时返回 content 与 source_content），以及更广泛的 Helper 只读操作（read-action-template-candidates、read-fact-objects、find-fact-object-candidates 等）的窄输出、自解释性和 AI 可消费性优化。后续需判断哪些只读操作的输出可以收缩为正常路径最窄定义、完整来源按需展开，以及失败诊断能否给出结构化修正提示。
summary: "## 来源与原始范围\n\n- 本议题承接行动模板内容重复传输，以及更广泛 Helper 只读操作的正常路径输出、自解释性与 AI 可消费性问题。\n- 相关 Study 对局部读取、候选 diff、范围保持证据和 stale 反馈的建议仍只作为相邻输入，不扩大本 Spark 为规则源或事实源编辑能力。\n\n## 已完成承接\n\n- **失败诊断结构化提示**已由 workcase-01KZYRQF21F9V87EFJKQZA8P0Z 完成：只读操作 `invalid_request` 响应能够提供结构化修正提示；该结果不代表其它失败类别或成功路径均已优化。\n- **行动模板成功响应去重**已由 workcase-01KZZV6XHTE3YBEF25F0SZJKV0 完成：`read-action-template-content` 不再返回完整 `source_content`，正常路径保留包含行动步骤、Human Gate 与 Stop Conditions 的最小执行包；需要完整同源规范时复用 `read-specification-content` L4，并以来源路径和摘要核对。该 WorkCase 已 closed/completed，但不表示所有 Helper 只读操作均已收缩。\n\n## 当前剩余范围\n\n- 对 `read-fact-objects`、`find-fact-object-candidates` 等其它只读操作，先以真实任务证据识别具体的过量、重复或不可消费字段；没有实证缺口时不做统一删减。\n- 每个候选改动应分别回答：当前行动必需字段是什么、完整内容如何按需取得、来源身份如何核对、失败时如何继续，以及是否保持当前语义与机械验证边界。\n- 使用已建立的最小执行证据与可比性门槛复验响应体积、工具往返和首次合法行动率；没有受控对照与重复样本时，只报告链路可用性，不宣称因果改善。\n\n## 边界与保持 open 的原因\n\n- 不改变写操作、事实 Schema、Git 流程，不引入缓存、第二权威或仅为缩短响应而删除当前行动必需语义。\n- 行动模板去重这一具体子项已经完成，但更广泛只读操作尚无逐操作的稳定承接位置与证据化候选，因此本 Spark 保持 `open`。"
