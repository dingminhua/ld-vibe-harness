  Human 要求创建一个 LDVH Spark，并分别针对 codebasememory、taskmasterAI、firecrawl 创建三个 Study 进行调研；产出需同时包含产品/工作流、技术实现、LDVH 可吸收点三类内容；不需要最后汇总；调研必须联网；研究应通过新建三个 Codex 对话同步进行。Human 已确认 Spark 是 LDVH 的工作对象，并授权联网调查。
