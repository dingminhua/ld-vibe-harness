title: 多项目管辖与用户配置拓扑
intent:
  保留多项目管辖、工作区主登记与用户级便利配置如何分层的问题，避免把项目分组需求、一次配置发现或本机默认值误作新增项目事实类型、用户级主登记或已获授权的配置写入。后续需判断用户级便利层的净价值、冲突边界与
  Human 决定。
status: open
priority: P1
summary: "**当前判断**\n\n- 一个工作区根下的 `LDVH-GOVERNED-PROJECTS.yaml` 可以登记多个管辖项目；工作对象必须依据实际
  Git worktree/common-dir 映射到项目，不能靠名称、`cwd`、最近目录或固定优先级猜测。\n- 该配置是当前管辖解析输入，不是项目事实对象、规则权威或用户级主登记。多项目聚合不自动要求新增“项目集合”事实类型。\n\
  \n**用户级便利层仍待判断**\n\n- 跨多个工作区的本机默认值或工作区指针是否确有独立价值。\n- 若存在用户级目录，它是否只能保存个人默认值或默认工作区指针，而不能保存主登记、规范、事实、Human
  Gate 结论、Hook 安装授权或环境接入状态。\n- 工作区根、当前项目根与用户级位置之间的冲突、发现顺序和写入选择如何由 Human 明确决定。\n\n\
  **边界**\n\n- 本 Spark 只处理管辖拓扑与用户级便利层的产品边界；安装、doctor/bootstrap、特定环境配置写入、跨平台目录与解析实现仍由
  `spark-0003` 及 09/33 承接。\n- 选择用户级路径、改变配置发现或引入新的集合语义前，必须重新核对净价值、冲突策略、Human Gate 与真实验证；本对象不产生写入授权。"
evolution:
- at: '2026-07-22T13:53:10+08:00'
  summary: 迁移复核将 V3 的多项目治理与用户级配置候选收敛为当前管辖拓扑问题：保留工作区主登记和用户级便利层必须分开的边界，并移除无依据的 Git
    追溯来源与旧实现状态。
