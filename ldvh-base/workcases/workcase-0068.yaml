title: 验证 spark-0067 的 Helper 请求契约首次可用性
status: closed
goal: 以固定小样本对照 pilot，判断当前 Helper 公开契约在四类典型任务中的首次可用性，以及一个固定、临时、非生产的最小契约提示卡能否形成值得继续评估的收益信号；不据此选择生产实现、改变 spark-0067 或 spark-0068，或提升问题优先级。
scope: 仅覆盖 spark-0067 与 spark-0068 的 A 问题簇（#1、#5、#8、#13）：F2 text_match、反向关系查询、read-specification-content 精确请求、prepare-fact-object-draft 后确定 Spark priority 合法值四类任务。每类最多执行 3 个 baseline 与 3 个 candidate trial；每个 trial 使用零历史继承的全新 subagent 上下文，只接收一个冻结任务包并只执行一个任务。baseline 与 candidate 的模型、reasoning、工具权限、环境、起始事实快照、任务通道/位置/布局和正文相同，唯一差异是固定 <contract_hint> 区块中的冻结空标记或冻结提示卡。提示卡只作为临时实验变量，结论限于本 pilot 的收益上界。排除 D 增量变化定位、关系覆盖解释、响应膨胀、完整 after、规范消费等其它问题簇；排除生产 code、specs、docs、其它事实对象、spark-0067、spark-0068、Git、安装、配置、Hook、网络与外部系统变更；除本 WorkCase 受控生命周期 CAS 外，生产载体全部只读。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 执行前已冻结四类任务、gold set、任务包、baseline 空标记、candidate 提示卡、配对方式、各任务必要成功调用数、指标口径、逐任务与总体聚合算法、提前停止算法、超时与失败分类，并记录任务包/提示卡 SHA-256 及当前规则、Schema、对象集、模型与环境绑定；gold set 不进入 trial 上下文。
- criterion_id: criterion-02
  statement: 按冻结协议完成 12 个 baseline trial；若 baseline 未触发提前停止，再完成 12 个 candidate trial，否则将全部 candidate 明确记录为 not-run-by-protocol。每个已运行 trial 均保留正确结果、首次合法、前置发现调用、目标调用、修复调用、总调用、extra_calls、invalid_request、响应 bytes/估算 tokens、耗时、超时与非契约失败分类，且不剔除表现不佳的 trial。
- criterion_id: criterion-03
  statement: 逐任务与总体结果均按预设算法机械形成：baseline 只有在总体首次合法至少 11/12、总体中位 extra_calls 不超过 1，且四任务分别首次合法至少 2/3、各任务中位 extra_calls 不超过 1 时才提前停止；否则 candidate 只有在总体与每任务正确率均不下降、总体首次合法至少提升 3/12、总体中位响应 bytes 增幅不超过 20% 时，才形成值得后续生产方案评估的信号。
- criterion_id: criterion-04
  statement: '实验分析逐项回指 spark-0067 与 spark-0068 的 #1、#5、#8、#13，明确区分能力机械存在、首次低摩擦可用、提示收益上界和生产净收益；n=3/任务不外推稳定发生率、P0/P1 或具体生产方案。'
- criterion_id: criterion-05
  statement: 除本 WorkCase 经 Helper CAS 形成的合法生命周期检查点外，生产 code、specs、docs、其它事实对象、spark-0067、spark-0068、Git、安装、配置、Hook、网络和外部系统保持不变；临时实验数据仅位于身份精确验证的本次 mktemp 目录，不成为第二事实源。
