kind: Change
summary: 同步 00-03 specs 基础规范与 L1 项目规则自洽性
reason: >
  根据多视角并行审查结果，00 总纲仍保留旧编号体系和旧文件引用，01/02/03 对规划中规范存在未标注引用，
  02 存在 Human Gate 重复维护，03 的正式规范骨架强度表达不一致，L1 项目规则仍引用旧 specs 编号分区。
  本次按用户确认统一修正这些不自洽点。
impact:
  - specs/00-LD-Vibe-Harness理念与纲要.md（更新基础规范索引、Human Gate 检查表、待补齐事项和术语表达）
  - specs/01-LDVH目录说明.md（标注规划中规范引用，明确 refs/evals 非强制规则，补充规划目录待落地事项）
  - specs/02-LDVH术语规范.md（修正 03 引用路径，标注机制规范规划状态，统一 Human Gate 维护位置）
  - specs/03-Specs文档规范.md（修正示例文件名、最小骨架要求、规划中规范引用和引用纪律表述）
  - .trae/rules/ldvh-l1-rules.md（同步必读入口、specs 编号分区和 evals 升级口径）
verification:
  - 00 基础规范索引与 01 编号分区一致
  - 01/02/03 对未落地的 10/11/12/13/14 相关引用均标注为规划中
  - 02 的 Human Gate 清单集中在 Human Gate 与检查要求章节
  - 03 的正式规范骨架表述由建议改为最小骨架要求
  - L1 必读入口指向当前 00-03 实际文件
  - L1 specs 文档约束与 01 编号分区一致
