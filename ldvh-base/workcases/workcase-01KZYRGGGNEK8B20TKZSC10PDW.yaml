    rule_refs:
    - specs/21-WorkCase-工作项.md
    - specs/05-事实模型基础规范.md
  - action_id: authorization-modify-tests
    summary: 新增/更新聚焦测试并运行 pytest 与 Ruff
    target_scope: code/tests/helper/ 与 code/tests/facts/ 相关测试文件
    effect_scope: workspace 内测试文件写入与本地测试运行
    risk_summary: 低风险
    rollback_summary: 删除/还原测试文件即可
    rule_refs:
    - specs/05-事实模型基础规范.md
  - action_id: authorization-update-attachment
    summary: 更新规范附件中关闭候选/写入契约描述（04.Att.01/05.Att.01 相关章节）
    target_scope: specs/attachments/ 下与关闭候选及 read→update 契约直接相关的附件章节
    effect_scope: 规范附件文本更新；不改变章节结构（§10.1 保护章节除外）
    risk_summary: 中风险：附件为契约权威之一，须与实现一致；通过 diff 复核
    rollback_summary: git diff 反向还原
    rule_refs:
    - specs/04-Helper CLI 服务规范.md
    - specs/21-WorkCase-工作项.md
  - action_id: authorization-record-nameerror
    summary: 在结果链记录 NameError 复现条件与边界（不修改 Code bug）
    target_scope: 本 WorkCase 的 result projection/验证材料
    effect_scope: 只读记录，不修改 code/ldvh 中 correct-closed-workcase 实现
    risk_summary: 低风险
    rollback_summary: 无副作用
    rule_refs:
    - specs/21-WorkCase-工作项.md
  - action_id: authorization-delegate-review
    summary: 委派只读 subagent 执行独立结果复核
    target_scope: 本 WorkCase 的 result projection 与验证材料
    effect_scope: 只读委派，不写事实
    risk_summary: 低风险
    rollback_summary: 无副作用
    rule_refs:
    - specs/21-WorkCase-工作项.md
  - action_id: authorization-result-review
    summary: 执行实际结果复核（subagent-read-only）并记录 result_reviews
    target_scope: 本 WorkCase canonical result projection
    effect_scope: 只读复核与 review 字段写入
    risk_summary: 低风险
    rollback_summary: 无副作用
    rule_refs:
    - specs/21-WorkCase-工作项.md
  action_ceiling: 只授权上述 Helper 关闭候选与 read→update 路径实现、测试、附件文本的本地修改及测试运行；不授权修复 correct-closed-workcase NameError Code bug、ldvh-base/ 事实写入（本 WC 自身受控写回除外）、Git commit/push/release、事实 Schema/字段定义/状态机修改、只读操作输出契约修改（spark-0074「Helper 只读交互优化」边界）。
  prohibited_actions:
  - Git commit/push/release
  - ldvh-base/ 事实载体直写
  - 修复 correct-closed-workcase NameError Code bug
  - 修改事实对象 Schema、字段定义或状态机
  - 修改只读操作输出契约（spark-0074「Helper 只读交互优化」承接范围）
  - 修改 specs/ 章节结构或受保护章节
  allowed_adjustments: 在各 item 内部调整实现细节、测试用例与附件措辞；不改变 goal/scope/success criteria/action ceiling/禁止项
  verification_and_rollback: 每个 item 完成后运行聚焦 pytest + Ruff；失败据实记录并返修，不强制改写；每次改动点可 git diff 反向回滚；附件更新须与实现 diff 一致复核
  out_of_bounds_handling: 发现需要修复 NameError Code bug、修改事实 Schema/状态机、超出 action ceiling 或落入 spark-0074（只读操作输出契约）边界的需求时，停止该动作、据实取消受影响 item 并进入结果链，不扩权执行
  reviewer_policy:
    model: deepseek-v4-flash
    collaboration_agent: none（本环境未提供协作 Worker 载体，使用 native subagent）
    effort: medium
    fast: true
    preferred_method: subagent-read-only
    fallback_order:
    - subagent-read-only
    - same-ai-switched-role-read-only
    max_perspectives: 1
    activation: Human 已在 2026-08-14 会话明确授权 native subagent 只读复核（reviewer-carrier 选择）
    same_ai_limit: 仅当协作 Worker 与 subagent 均不可用且满足 21 §4.5 约束时启用；当前不适用
