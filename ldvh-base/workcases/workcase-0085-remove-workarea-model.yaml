id: workcase-0085
type: workcase
title: 一次性取消 WorkArea 工作对象
goal: 一次性取消 WorkArea 作为 LDVH active 工作对象和产品入口，改由 WorkCase 直接承载治理闭环、优先级、状态、执行编排、验证证据和关闭判断。
status: human_closure_confirming
created: '2026-06-21T09:40:00+08:00'
updated: '2026-06-21T10:39:18+08:00'
priority: P0
description: |
  当前 WorkArea 只提供长期范围分组，不产生独立输入、输出、状态推进、验收证据或关闭材料；从工作闭环视角看，实际治理重心已经落在 WorkCase 的优先级、状态、执行编排、验证证据、关闭判断和后续分流上。

  用户曾把未来跨项目能力作为判断 WorkArea 价值下降的背景之一；但本 WorkCase 不设计、不引入、不验收跨项目字段或跨项目归属机制。当前范围只处理 WorkArea 工作对象是否应退出 active 主链路，以及现有 WorkCase 闭环是否足以承接当前治理重心。

  本 WorkCase 的目标不是把 WorkArea 降级为 archived/deprecated 历史对象，而是做一次性迁移：从当前文件事实源、规范、Code、Web、测试和入口中移除 WorkArea 工作对象及其兼容痕迹。Git 提交历史不可作为普通迁移的一部分被抹除；这里的“消除历史痕迹”限定为当前仓库工作树和产品可见入口不再保留 WorkArea 主对象、兼容对象、历史视图或旧字段路径。
success_criteria: |
  - [x] WorkArea 从 active 工作模型集合中移除，不再作为 20-29 active 成员、对象类型、事实源目录或 Web 主入口存在
  - [x] WorkCase 规范取消强制 `workarea` 归属，保留并强化优先级、状态、执行编排、验证证据和关闭判断等闭环字段
  - [x] 本 WorkCase 不引入跨项目字段、项目归属字段或跨项目归属机制；相关设计如未来需要另行建模
  - [x] 字段注册表移除或重写 `workarea`、`related_workareas`、`workarea_ref`、WorkArea 专属字段和 WorkArea 派生消费说明，不保留 deprecated 主链路
  - [x] Code 工具、validator、CLI、commit 校验、对象列表、统计、搜索、创建模板和测试不再把 WorkArea 当作可用对象类型
  - [x] Web API、导航、列表、详情、阅读布局、图标、状态筛选、颜色、文档和测试不再暴露 WorkArea 入口或历史兼容视图
  - [x] `ldvh-base/workareas/` 现有实例和所有 WorkCase/ADR/Spark/Pitfall/Study 中的 WorkArea 引用完成一次性迁移或删除，当前文件事实源不留下 WorkArea 关系字段
  - [x] README、rules、skills、agents、hooks、docs、specs、code docs 和 web docs 中面向当前产品的 WorkArea 说法清理完成；只允许在本 WorkCase 的迁移记录中描述本次移除目标
  - [x] 迁移完成后运行事实源校验、specs 综合校验、相关 Python 测试、Web/API 测试和必要的全文扫描，证明当前工作树无 WorkArea 产品痕迹
  - [x] 本 WorkCase 的关闭材料明确记录哪些旧概念被 WorkCase 字段或派生视图替代，以及无法通过普通迁移消除的 Git 历史边界
source: '用户先质疑 WorkArea 是否有必要存在，随后指出：


  - 工作项已经有优先级；

  - 后续可能会引入跨项目概念，跨项目一旦存在，工作域的范围归属价值会更弱；

  - LDVH 的重点应在工作项治理上，多一个工作域只会分散注意力；

  - 从闭环角度看，没有内容真正从工作域流入或流出。


  用户随后明确要求：“建立一个workcase，取消workarea工作对象，要求是一次性处理，消除历史痕迹”。


  Human Gate 记录：

  - 触发原因：取消 active 工作对象、删除事实源目录、修改工作模型集合、Code/Web/测试和既有事实源关系，属于高影响工作模型迁移。

  - 确认依据：用户明确要求建立 WorkCase，并明确要求取消 WorkArea 工作对象、一次性处理、消除历史痕迹。

  - Human 决策：允许创建本 WorkCase 承接后续一次性迁移方案与执行。

  - 过渡约束：当前 WorkCase 模型仍强制 `workarea` 字段，因此本 WorkCase 暂挂 `workarea-0012` 作为最后一次过渡记录；正式执行成功后，该字段和相关 WorkArea 事实源应随迁移一并清理。

  '
