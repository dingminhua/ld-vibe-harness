priority: P1
description: |
  本计划负责把 LDVH 当前文件事实源收敛为现行规则态，清除已经被吸收、废弃、迁移完成或会误导 AI 的历史残留。

  本计划不改写 Git 历史，不执行破坏性 Git 操作，不把 Git commit records 中的历史记录伪装成未发生。清理范围是当前工作树中的正式规范、能力资产、Code、Web、测试、可变资料区和 dogfood 工作对象事实源中的误导性残留。

  处理原则：
  - specs 正文只保留当前有效规则、契约、边界和状态判定方法，不记录迁移过程、旧编号、旧对象或废弃说明；
  - Code、Web、测试不得继续暴露或依赖旧工作对象、旧提交格式或旧规范编号的 active 入口；
  - docs/studies 和 docs/sources 是可变资料区，已吸收或不再作为当前依据的资料可删除或用最小索引说明边界；
  - ldvh-base 是 dogfood 工作对象事实源，关闭证据和经验可保留，但不得让旧 Task、TaskPlan、SubTask、Change 对象看起来仍是 active 模型；
  - 无法安全删除的历史证据应进入允许残留清单，并说明权威位置和保留理由。
success_criteria: |
  - [x] 创建本总控 WorkCase，并记录 Human 授权、清理边界和执行项
  - [x] 生成残留扫描清单，按必删、改写、允许保留、需 Human Gate 分类
  - [x] 正式 specs 中不再把旧编号、旧工作对象、旧提交 trailer、迁移过程或废弃历史写成当前规则
  - [x] Code、Web、测试中不再存在可执行旧入口或会误导当前模型消费的旧兼容逻辑
  - [x] docs/studies 和 docs/sources 的删除、保留或边界说明与 01/03/09 的可变资料区规则一致
  - [x] ldvh-base 中误导性当前事实已修正；关闭证据、Spark、Pitfall 等必要历史证据只作为历史证据保留
  - [x] 残留搜索输出能区分允许残留和不允许残留
  - [x] `python3 code/specs_validate.py all` 通过，或明确记录非本计划引入且可接受的诊断
  - [x] `python3 code/fact_validate.py` 通过，或明确记录非本计划引入且可接受的诊断
  - [x] 相关 Code/Web 测试通过，或记录降级验证和残留风险
source: |
  Human 在 2026-06-19 要求“对整个 ldvh 进行消除历史痕迹的工作”，并在 AI 提出分阶段计划后回复“按你计划执行”。

  Human Gate 记录：
  - 决策主题：是否创建并执行 LDVH 当前态历史残留清理总控计划。
  - Human 结论：批准按计划执行。
  - 执行边界：先清理当前文件事实源中的历史残留，不改写 Git 历史，不执行破坏性 Git 操作；涉及删除目录、改变事实源边界、关闭关键缺口或重写 dogfood 工作对象历史时继续按 Human Gate 判断。
