id: workcase-0008
type: workcase
title: “人工”用语清理与执行主体命名治理
goal: |
  承接 spark-0026，对 LDVH 中“人工”、Human、用户确认、手动、AI、Code、Web 等执行主体表达做完整治理：清理推荐表达、吸收式处理历史工作对象中的旧表达、改名 legacy 检测标记，并把主体命名原则沉淀到 active specs，确保后续不得再出现主语不清晰或主体错误的用法。
status: executing
