title: 支持提交契约授权附件解析
goal: 使提交预检与原生 Git Gate 能从 active 的 03 正文及其明确授权、身份匹配的 03.Att.01 共同投影提交契约，保持缺失、重复、未授权或身份不匹配时拒绝，从而让 workcase-0024 的六个既有文件可通过预检并被隔离提交。
scope: 仅覆盖 code/ldvh/commits/contract_source.py 及其必要调用点、对应 commits 测试；若实现确需，最小限度修改共同预检调用点。不得修改任何 Specs 或附件正文、事实 Schema、Web、其它 Helper 操作或 Git Hook 安装配置。仅在预检通过后创建两次本地 commit：先提交 Helper 修复，再仅提交已确认的 workcase-0024 六个文件；保留所有无关 Index 与 Working Tree 变化。
success_criterion_definitions:
- criterion_id: criterion-authorized-attachment
  statement: 03.Att.01 同时为 active、身份匹配且被 active 03 的 authorized_attachments 明确列出时，提交契约投影可从其 type、scope、trigger 表形成有效契约。
- criterion_id: criterion-rejection
  statement: 缺失、重复、未授权、父规范/附件身份不匹配或不满足表唯一性时，投影保持不可用，且不会扫描或接受任意附件。
- criterion_id: criterion-shared-path
  statement: Helper 主动预检与原生 Git Gate 继续复用同一提交契约投影和唯一 validator。
- criterion_id: criterion-unblock-commit
  statement: 完成定向 tests、git diff --check 和对 workcase-0024 六文件候选的 precheck-git-commit；仅在机械预检为 passed 且语义复核成立时，分别创建 Helper 修复提交与该六文件提交。
success_criterion_results:
- criterion_id: criterion-authorized-attachment
  outcome: satisfied
  summary: 共同投影只在 active 03 明确授权 source-reference-enumerations 且附件为 active、03.Att.01 身份匹配时读取其三张提交契约表。
- criterion_id: criterion-rejection
  outcome: satisfied
  summary: 定向测试覆盖缺失附件、未授权附件、身份不匹配附件和重复表，均保持拒绝而不扫描任意附件。
- criterion_id: criterion-shared-path
  outcome: satisfied
  summary: Helper 主动预检与原生 commit-msg hook 均继续调用同一投影入口和共享 validator，相关回归已通过。
- criterion_id: criterion-unblock-commit
  outcome: satisfied
  summary: 实际六文件候选预检 passed，workcase-0024 六文件已由 f46960ef8 隔离提交；同时完成全库完整性检查。
result_summary: 提交契约已安全支持 03 的明确授权附件 03.Att.01，workcase-0024 的六文件已成功隔离提交；00 不剥离的残余仍按 workcase-0024 关闭结论保留。
validation_summary: 已通过：code/tests/specs、code/tests/commits、code/tests/git_hooks/test_commit_msg.py；git diff --check；三次 precheck-git-commit=passed；当前 check-fact-integrity=complete（101 对象）。
