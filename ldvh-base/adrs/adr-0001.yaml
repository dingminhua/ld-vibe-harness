title: 规则缺口时先修规则源
status: active
decision_question: 发现的问题暴露当前规则源不足以支持实现选择时，应以什么顺序完成变更？
decision: 选择以下变更顺序：当发现当前规则源不足以支持实现选择时，先完成受影响 Specs 或授权附件的最小充分修正及独立复核，再修改
  Code、Web、Helper、Hook、测试或其它实现，并按风险完成验证与回读；当规则已完整且问题仅为实现偏差时，选择回指该规则后直接修复实现，不为流程伪造规范变更。该 ADR 只记录此项选择，不自行形成必须执行的规则或行动授权。
applicability: 适用于 LDVH
  中会改变或依赖行为、字段、生命周期、公开或跨模块接口、可观察结果、授权或验证边界的缺陷修复与增量实现；不适用于不影响规则理解的错字、链接或格式修正，也不要求为已由当前规则完整覆盖的纯实现偏差新增
  Specs。
rationale: 先让规则源说明应有行为和边界，才能避免既有实现、测试结果或页面表现反向定义规则，并让后续实现、独立复核和验证共享同一可追溯依据。
consequences:
  采用这一选择时，在规则缺口未完成来源修正与独立复核前，工作会停留在调查、核对、复现、设计测试和补充规划等不以 ADR 自行授权实现的范围；实现计划会说明其依据或明确未改规范的理由。该决定不新增通用审批、自动
  Gate 或 Code 语义判断能力，实际规则仍以 Specs 为权威。
