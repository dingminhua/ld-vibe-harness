success_criterion_definitions:
- criterion_id: criterion-contract-boundary
  statement: 当前来源与实现一致登记 prepare-fact-object-update 为 read-only、caller_completion_required、非 execution-ready、非 patch/write/reservation/authorization/semantic decision；它只形成绑定当前 UID/fingerprint 与官方完整对象更新路由的全对象草案，不改写或削弱 update-fact-object/update-workcase 的验证、CAS、原子替换、回读与完整性语义。
- criterion_id: criterion-operation-and-official-route
  statement: prepare operation、登记与 direct/isolated tests 在当前 HEAD 上成立：合法唯一对象返回正确 UID/fingerprint/path/carrier/type/official route 与仅移除 Code-managed 顶层字段的草案；Markdown body 与既有 change_log prefix 保留；completion requirements 仍要求 caller 独立提供真实语义变化、恰一条新 log、fresh 三字段 signature 及 official route 所需授权；closed WorkCase、invalid/unresolved/ambiguous 不返回 draft，official route 继续独立拒绝 stale/no-op/非法对象/transition/signature/authorization 且失败零写入。
- criterion_id: criterion-fixed-public-lists
  statement: 旧 WC ceiling 外的 residual-public-operation-fixed-lists 在本次得到窄补授权：test_service.py、test_cli_process.py、test_read_failure_hints.py、test_repository.py 与 test_native_windows.py 中 5 项因新增 public operation 直接失效的 operation count/read-set/declaration/source-map/platform-set 检查精确纳入 prepare-fact-object-update；当前平台可执行的固定清单测试通过，native Windows 检查保持由 full suite 的平台条件如实呈现，不借此重构或扩大其它 service contract。
- criterion_id: criterion-replay-and-disclosure
  statement: 12-task/24-record deterministic isolated replay 与 protocol/results/report 在当前实现上复现预期：minimal known-contract 2→2 只称 parity，cold discovery 3→2 只称一项机械调用减少，失败分支零写入，host receipt/tokens/cache/latency 保持 unavailable；若 repository/worktree 术语和 workflow-step transformation count 两项 advisory 仍适用，报告明确披露而不夸大为 fresh-agent、真实代表任务、因果或广泛服务质量证据。
- criterion_id: criterion-validation-and-delivery
  statement: 指定 focused pytest、5 项 fixed-list 检查、./ldvh capabilities、./ldvh check、创建前 261 对象基线与创建后实际对象集合的 check-fact-integrity、full suite、full Ruff、changed Ruff 与 git diff --check 均实际执行并如实记录；任何失败/partial/unavailable 不写成通过。residual-full-ruff-baseline 因与本能力无直接关系而不纳入修复授权，只保留实际运行结论。
