title: 受管项目语义选中后的 Helper-first 续接
intent: 保留 AI 已依据用户目标选中受管项目后，如何以显式工作对象重新解析并通过 Helper 继续的边界，避免让 adapter 或 Code
  解释自然语言、让语义选择冒充管辖事实，或让 AI 跳过路由与最小读取计划直接行动。后续需判断标准续接合同、失败分流与可观测顺序是否足够。
status: open
priority: P1
summary: "**当前判断**\n\n- 用户目标的语义判断由 AI 负责；adapter 与 Code 不能从自然语言自动绑定项目。AI 选中候选受管项目后，仍必须以该项目实际
  worktree 的显式 locator 重新执行管辖解析。\n- 只有 Helper 返回 `governed_single`，AI 才能经 capabilities
  和适用公开操作读取或变更 Helper 已覆盖的项目事实。语义选择不是管辖事实，Helper 返回也不能替代 AI 的语义判断。\n- 可靠顺序是先路由，再读取最小权威事实，再进入相应行动和验证；跳过路由、直接凭记忆读规范、修改或提交，会重新制造无法追溯的倒序行动。\n\
  \n**需要完善的续接合同**\n\n- 04 的 AI 消费与能力路由、02 的候选语义选择后再解析、05 的事实查询 Helper-first 约束，以及
  09/共享上下文恢复中的非绑定 continuation 与稳定 Helper 入口。\n- 多候选、解析失败、`partial`、能力未覆盖或读取不足时，应保留真实缺口并分流；不得静默选项目、补全输入或宣称已完整读取。\n\
  - 最小读取计划、后续查询与 STOP/Human Gate 应作为当前行动的可观察导航投影，而非新的事实权威或对用户意图的 Code 裁决。\n\n**边界**\n\
  \n- 不修改 00，不让环境 adapter 解释 prompt，不直接实施 Specs/Code 变更，也不由本 Spark 建立 WorkCase。\n\
  - V3 的旧 Hook-only、知识地图命令、receipt 形式和部署结论没有被当作当前实现继承；只保留“先路由、再读取、再行动、再验证”的顺序约束。"
evolution:
