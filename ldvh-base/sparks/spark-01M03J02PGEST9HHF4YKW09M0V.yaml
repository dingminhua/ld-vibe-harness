title: Subagent 模型选择由宿主平台负责，LDVH 保持模型无关
intent: 明确 LDVH 与宿主平台在 subagent 模型选择上的职责边界：后续需要判断的是 LDVH 是否只描述协作能力与调用约束、把具体模型配置交给各平台；若把平台级模型选择继续写进 LDVH，会增加跨平台定位、重复分析、分流和规则维护负担。
status: implemented
summary: "## 已成立边界\n- Subagent 使用哪个模型由宿主平台负责；LDVH 不维护模型目录、推荐、选择或跨平台映射。\n- LDVH 只定义审核语义与记录边界：Subagent 是唯一独立审核方式。\n- Controller 必须依据自身当前上下文的完整工具发现与实际创建结果判断 Subagent 能力，不能采用 Subagent 对该能力的结论。\n- 只有 Controller 实际无法创建 Subagent 时，才向 Human 披露保证差距并直接使用 same-AI 切换只读视角，不新增确认关口；WorkCase 记录实际方法、Controller 证据、保证差距、披露摘要和时间。\n- 旧平台卡 09.Att.03/04/05 已退出当前规则源；旧的多层审核路由与平台特定 Worker 概念不再属于当前机制。\n\n## 未验证边界\n- 宿主平台能否创建 Subagent 仍须每次由 Controller 在自身当前会话实际发现和尝试，LDVH 不从静态平台资料推断。"
