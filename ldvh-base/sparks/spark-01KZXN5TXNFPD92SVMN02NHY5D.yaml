title: WorkCase 关闭责任、Pitfall 草稿与 related-to 模型
intent: 需要稳定保留一套减轻 WorkCase 执行负担、又不丢失现场 Pitfall 细节和关闭后责任线索的统一模型，并判断它如何一致落入事实类型、关系、Helper、行动模板与 Web 契约。若不跨行动保留，已经逐项确认的边界容易在多份规范修改中被重新解释，增加重复讨论、语义漂移和遗漏消费闭集的风险。
