title: 知识激活验证实验 v5：召回-呈现-效用三层机制的激活正确性
goal: 把 spark-01KZXN5TXNEKMANG1WTFBKT5FW（legacy spark-0040）已收敛的「知识激活」三层框架具体化为可实验验证的机制并运行 source-complete 配对实验：召回层按类型差异化主动触发（ADR 决策边界触达、Pitfall 症状/风险匹配、Study 新领域索引检索，recall 优先，与 v0.3 已证伪的 L1-specific 精确 veto 不同——不使用 veto，宽触发就近激活）；呈现层以激活投影把 F2 对象属性卡在运行时动态转译为「对当前行动意味着什么/应做什么不同动作」的行动指引（知识本体 × 当前任务上下文的实验内投影，不修改存储层字段——与 v4 已证伪的静态字段存在性验证不同，v4 证明的是字段存在与否无差异，v5 验证的是运行时重组呈现）；效用层以命中且改变行动的留痕形成实验内复用闭环观测（供盲评 scorer 评 action_bridge_score 0-3）。以「正确激活率」（applicable 任务上触发且 strong reuse 且 action_bridge_score>=2 的比例）为主指标、漏检率与行为改变率为成分、成本为次级观测项，复用 v0.3/v4 的 18 个冻结任务（A1-S6）与 L1-baseline 宽触发基线臂，按预注册门槛得出 supports-activation-layers 或 do-not-support-activation-layers 的严格结论并写回 spark-01KZXN5TXNEKMANG1WTFBKT5FW。
scope: 仅新增 code/ldvh/testing/knowledge_precheck_v5.py、code/ldvh/testing/knowledge_precheck_v5_trial.py、code/tests/testing/test_knowledge_precheck_v5.py、code/tests/testing/test_knowledge_precheck_v5_trial.py 与 docs/metrics/knowledge-precheck-v5/；v3/v4 代码只允许作为只读 import/复用依据，docs/metrics/knowledge-precheck-v3、knowledge-precheck-v4 sealed bundle 与 compiled artifacts 不得修改。复用 v0.3 的 18 个 task/gold（A1-S6、6 情形、9 applicable/9 non-use/6 no-trigger gold）。双臂共享同一任务集与盲评 rubric：activation-baseline = L1-baseline 宽触发 + 原对象属性 F2 卡（与 v4 struct-baseline 同源）；activation-enhanced = 召回层类型差异化触发策略 + 呈现层激活投影卡 + 效用层留痕。激活投影与留痕仅在实验 Gateway 运行时生成，不写入生产 F2 投影、不修改事实 Schema/05.Att.01/Helper contract/Specs。只允许真实 Helper F2/F3 只读调用及字段闭集证据留存；source-complete 报告成立后允许经 Helper CAS 更新 spark-01KZXN5TXNEKMANG1WTFBKT5FW（object_uid 019ffb52-ebb5-74e8-aac0-3cd3d73d15fc，保持 open/P1）。排除：生产 L1/L0 接入实现、Specs/Helper contract/事实 Schema/Web 修改、v2/v3/v4 证据改写、Git commit/push/PR/release、部署和网络发布、本 WorkCase 与该 Spark 写回以外的其它事实对象创建。
success_criterion_definitions:
- criterion_id: criterion-frozen-v5-protocol
  statement: 冻结 v5 protocol（schema_version=ldvh-knowledge-precheck-v5/1）：三层激活机制规格（召回差异化触发策略文本、呈现激活投影模板、效用留痕 schema）、18 个 task/gold 复用（A1-S6）、双条件（activation-baseline/activation-enhanced）、9/9 条件首发顺序平衡、模型/runner 身份策略与盲评 rubric（含 action_bridge_score 0-3 rubric）、artifact denylist 与 ceilings。预注册采用门槛全部可机械判定：主指标正确激活率增强臂 >= 7/9 且相对基线净增 >= +2；漏检率（applicable 任务未触发或触发未消费的比例）增强臂 <= 基线；行为改变率（applicable 任务 action_bridge_score>=2 的比例）增强臂 >= 基线；f2_decision_accuracy（trigger_correct+selection_correct+false_f3 联合成分）增强臂不得低于基线；non-use 任务 correct_non_use 增强臂 >= 基线-1；policy_capacity 以 v4 同构机械定义成立（全部真实 Helper 调用成功、changes 恒空、零事实写入）。任一门槛失败即 do-not-support-activation-layers。
- criterion_id: criterion-recall-layer-spec
  statement: 召回层机制规格冻结并实现于实验 Gateway：按类型差异化（ADR 决策边界触达宽匹配、Pitfall 症状/风险匹配、Study 索引可见按需展开），明确 recall 优先（宁可误报不可漏报、漏检代价>>误检代价），激活强度按类型梯度（ADR/Pitfall 强激活、Study 按需）；不使用任何 veto 机制；与 v0.3 已证伪的 L1-specific 精确 veto 的差异在 protocol 中显式说明。
- criterion_id: criterion-presentation-layer-spec
  statement: 呈现层激活投影规格冻结并实现：把 F2 对象属性卡在 Gateway 运行时重组为行动指引结构（含「该知识对当前任务意味着什么」「建议的不同动作」两段式投影），由知识本体字段 × 当前任务描述生成；投影仅存在于实验 Gateway 与证据 bundle，不进入生产投影或存储层；与 v4 静态字段存在性验证的差异（字段存在性 vs 运行时重组呈现）在 protocol 中显式说明。
- criterion_id: criterion-utility-layer-spec
  statement: 效用层留痕规格冻结并实现：每个 member run 记录 activation hits（何时、何类型、何对象被触发/展开/消费）与 action delta（最终行动相对该任务 gold 期望动作的变化标注），留痕格式入 protocol 且供盲评 scorer 评分使用；留痕是实验内观测产物，不写入生产事实对象。
- criterion_id: criterion-v5-source-complete-replay
  statement: 独立 sealed evidence bundle 从 protocol/task/gold、source snapshot（含基线卡集与激活投影卡集）、raw Helper exchanges、模型结构化输出、盲评 packet/评分、效用留痕及 adjudication ledger 字节一致重建 records、results 与 report；主指标与全部诊断指标由 frozen gold 加 raw response/trace 确定性重算；缺失、额外、篡改、hash drift、score/packet 不绑定或 post-hoc override 均被拒绝。
- criterion_id: criterion-v5-automated-verification
  statement: v5 focused tests 实际覆盖 protocol 闭集与双条件结构、activation gateway 的投影生成/漂移拒绝/条件泄漏拒绝、真实只读 fixture、byte replay、盲评脱敏（packet 无 arm 标识）、fresh context/scorer 唯一性、attempt/replacement/launch/time ceiling 与 technical-exclusion 闭集；同时重跑 v4 non-live-source focused tests 证明 sealed v4 行为与产物未被改变。
- criterion_id: criterion-v5-paired-measurement
  statement: 实际取得恰 18 retained pairs；最多 21 个 pair attempts、3 个仅由预注册技术排除触发的整对 replacements、42 个 member launches 与 42 个 scorer contexts，每个 member 最多 600 秒、无单臂重试、总运行不超过 6 小时。报告逐 family/情形及总体的 activation confusion matrix、漏检率、行为改变率、正确激活率、f2_decision_accuracy、action_bridge_score 分布、unnecessary F2、false F3、Helper 调用数及可观察成本，并严格按冻结联合门槛给出 supports-activation-layers 或 do-not-support-activation-layers；错误、null、负效应和不利 family 结果不得排除。
- criterion_id: criterion-spark-v5-writeback
  statement: 仅在 v5 source-complete 报告成立后（机械前置条件，非 Human Gate），spark-01KZXN5TXNEKMANG1WTFBKT5FW 的公开精确回读包含报告绑定、实测指标、各门槛通过/失败、运行时可观察性与因果限制，以及严格结论；写后 check-fact-integrity 外层 outcome=ok、领域结果 result.status=complete 且 scope.not_completed 为空。
