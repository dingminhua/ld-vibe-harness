  summary: Python 投影为唯一生成源，Helper/context recovery/Web 共享 handoff_allowed/reason，check-workcase-handoff 只读且精确绑定。
- criterion_id: criterion-3
  outcome: satisfied
  summary: Stop hook 在精确绑定的 Controller-owned 快照返回 block/下一步，Gate2 返回 continue；无绑定/异常/stop_hook_active fail-open，资产已纳入版本控制。
- criterion_id: criterion-4
