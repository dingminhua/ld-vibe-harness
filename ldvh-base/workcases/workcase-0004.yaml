- criterion_id: criterion-05
  statement: ObjectDetail.tsx/ProjectFiles.tsx/ReadingPanel.tsx 拆分为符合单一职责的模块；api
    不再反向 import src；tsconfig 拆分为 tsconfig.app.json/tsconfig.node.json 双配置并启用
