  summary: 与 Human 讨论确认现状为单项目硬编码，识别出四个待决策点（归属标识、ID 冲突、写操作边界、多项目解析数据源）。Human 表示先登记，后续再想如何推进。
- at: '2026-07-22T13:49:34+08:00'
  summary: 迁移对照补入 V3 的项目集合约束：Web 的“全部”聚合只是消费作用域，不能反向预设新的项目集合模型；当前摘要据此明确与配置和跨层治理对象的分工。
