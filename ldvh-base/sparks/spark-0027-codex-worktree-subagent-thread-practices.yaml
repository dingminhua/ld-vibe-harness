id: spark-0027
type: spark
title: 如何在 LDVH 中利用好 Codex 工作树、子 Agent 和新建对话能力
status: pending
created: '2026-06-25T03:07:28+08:00'
updated: '2026-06-25T03:31:32+08:00'
description: |
  本 Spark 记录一个新的体系设计议题：LDVH 应如何系统性利用 Codex App / Codex CLI 中已经观察到的并行能力，包括 Codex 工作树、新建对话、线程间委派、子 Agent、以及配置 `agents.max_depth = 2` 后可能支持的一层嵌套子 Agent。

  背景：

  1. 当前线程已验证主控可以创建新 Codex 对话，并通过 delegation prompt 让新线程知道来源线程。
  2. 当前线程已在 `~/.codex/config.toml` 中加入 `[agents] max_threads = 6` 和 `max_depth = 2`，但当前会话内的子 Agent 仍未热加载嵌套能力。
  3. 已创建一个只读测试线程 `019efb05-3dde-7d71-884b-1c1ff80e0b88`，用于在新 Codex 对话中验证子 Agent 是否能再 spawn 一层 child。
  4. Human 认为后续工作不能由一个 AI 在单一长上下文里全部完成，应利用 Codex 自己的工作树、子 Agent 和新建对话能力，避免上下文混乱，并形成可追溯的总控与执行线程关系。

  主要研究问题：

  1. Codex 工作树适合承载哪些 LDVH 工作：实现迁移、测试修复、术语治理、外部调研、结果复核、或集成检查？
  2. 新建对话和工作树之间应如何区分：什么时候用同目录新线程、什么时候用隔离 worktree、什么时候只用子 Agent？
  3. 子 Agent 在 LDVH 中应承担什么角色：只读调查、结果复核、局部执行、worker 实现、还是二级编排？
  4. 如果 `agents.max_depth = 2` 生效，LDVH 是否允许子 Agent 再调一层 child？允许时应限制哪些场景、深度、权限、写入边界和证据回写？
  5. 多线程 / 多工作树并行时，主控线程如何维护事实源边界、任务卡、禁止范围、验收命令、提交拆分、合并顺序和残留风险？
  6. 外部软件工程、AI agent、multi-agent workflow 和 code review 实践中，哪些模式可吸收为 LDVH 的行动编排或 WorkCase 规范？
  7. 如何把这些能力沉淀为 LDVH 的可执行规范、操作手册或行动成员，而不是只停留在临场经验？

  预期产物：

  - 由独立 Codex 线程进行外部资料调研，形成 Study。
  - Study 应总结外部最佳实践，并结合 LDVH 自身提出建议：线程类型、工作树策略、子 Agent 使用边界、嵌套深度策略、事实源回写规则、验证命令、失败分流和 Human Gate。
  - Study 应明确哪些建议可直接进入后续 WorkCase，哪些需要 ADR，哪些只是实践建议。

  调查约束：

  - 先调研并写 Study，不直接修改 active specs、Rules、Code 或 Web。
  - 调研线程如需创建 Study，应遵守 `specs/24-Study-研究报告.md` 和事实源边界。
  - 外部资料必须给出来源链接或可追溯引用；不能只凭记忆总结。
  - 如果发现 Codex App 与 Codex CLI 在能力上存在差异，应分别说明，不得把 CLI 能力直接写成 App 已支持。
  - 若要把结论推进为规范或行动编排改造，应另建 WorkCase，并在需要时触发 Human Gate。
