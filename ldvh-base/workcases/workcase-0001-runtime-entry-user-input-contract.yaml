      expected_output: |
        设计 `user-input` 或等价 Code 入口的输入输出 schema。输入包括 raw_text、cwd、target candidates、session_id、trigger_source 和 read_plan_consumed；输出包括 intent、extracted_fields、missing_fields、task_read_plan、stop_conditions、validation_guard、next_action 和 source_refs。
      status: pending
      result_summary: ''
      evidence_refs: []
      blocking_reason: ''
    - id: item-3
      title: 设计 cwd/target 四象限管辖策略
      role: runtime-governance-design
      mode: single
      input_refs:
        - v2-hook-mechanism.md
      expected_output: |
        固化四种情况的处理策略：cwd governed + target governed；cwd governed + target non-governed；cwd non-governed + target governed；cwd non-governed + target non-governed。策略必须 target-first、cwd-fallback，并明确 AI 何时可自行判断普通非项目问题、何时必须调用 Code 确认。
      status: pending
