status: closed
title: 简化 macOS POSIX 原子写入结果模型与耐久策略，保留事实安全内核
goal: 在不削弱原子发布、no-overwrite、CAS、路径安全、异常后命名空间回读和写后验证的前提下，简化 POSIX 原子写入的内部结果模型与上层消费逻辑，使 macOS 路径不再承担无实际决策价值的状态组合和缺少规范依据的 durability 领域准入策略。
scope: 承接 spark-0062。含：更新 Code Implementation Plan；保留同目录临时文件、文件 fsync、原子发布、目录 fsync best-effort、dir_fd/O_NOFOLLOW、no-overwrite、CAS、写后回读及异常后的 namespace reconciliation；把 AtomicWriteResult 重构为受约束结果形状；上层仅按提交状态、操作语义和冲突决策，sync/cleanup 继续作为诊断证据；移除或隔离缺少规范依据的 durability 领域准入策略；补测试、macOS 验证、独立结果复核和本地受控提交。不含：修改 Specs；删除安全原语；改变 Windows 行为；修改 Spark 状态；push、PR、发布。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: Code Implementation Plan 明确记录安全内核、简化目标、平台边界和验证方案，并说明不修改 Specs、不改变 Windows 行为。
- criterion_id: criterion-02
  statement: POSIX 原子写入继续保留同目录临时文件、文件 fsync、原子发布、directory fsync best-effort、dir_fd/O_NOFOLLOW、no-overwrite、CAS、写后回读和异常后的 namespace reconciliation，测试证明未被弱化。
- criterion_id: criterion-03
  statement: 内部结果采用受约束的 committed、not_committed、uncertain 形状或等价模型，不再允许四个独立维度任意组合形成不可达或无意义状态。
- criterion_id: criterion-04
  statement: 上层只以提交状态、操作语义和冲突决定业务结果；sync scope 与 cleanup residue 不再充当业务准入条件，但仍在 diagnostics、verification 或 gaps 中可观察且可测试。
- criterion_id: criterion-05
  statement: durable_writes_enabled 或等价的 os.name == posix 判断不再定义事实写入的领域允许语义，本次不得改变 Windows 写入行为。
- criterion_id: criterion-06
  statement: 受影响的 filesystem、Helper 与事实操作测试通过，并在 macOS 验证创建、替换、冲突、目录同步失败、清理残留和 replace 异常后 reconciliation 等关键路径。
- criterion_id: criterion-07
  statement: 完整结果经只读独立复核确认与 00 一致；本地提交仅含授权范围内的计划、实现与测试变更并通过提交前机械预检。
success_criterion_results:
- criterion_id: criterion-01
  outcome: satisfied
  summary: code/plans/workcase-0064-atomic-write-result.md 与 README 稳定入口已提交；计划明确安全内核、简化边界、平台验证及 Specs/Windows 不变。
- criterion_id: criterion-02
  outcome: satisfied
  summary: filesystem 实现保留同目录临时文件、文件 fsync、原子发布、directory fsync best-effort、dir_fd/O_NOFOLLOW、no-overwrite、CAS、写后回读和 _reconcile_replace；关键失败路径测试通过。
- criterion_id: criterion-03
  outcome: satisfied
  summary: AtomicWriteResult 只允许 committed、not_committed、uncertain 三类命名构造形状；直接四维构造被禁用并有正反测试。
- criterion_id: criterion-04
  outcome: satisfied
  summary: 业务消费者继续按 outcome/namespace commit state 与操作语义处理；sync scope 和 cleanup residue 仅作为兼容诊断投影与验证证据，直接搜索及测试未发现其充当业务准入。
- criterion_id: criterion-05
  outcome: satisfied
  summary: durable_writes_enabled 已由 native_atomic_fact_writes_supported 取代，表达原生原子后端可用性；POSIX 为真，Windows/未知为假，旧领域 status 仅兼容保留，Windows 仍在 mutation 前失败。
- criterion_id: criterion-06
  outcome: satisfied
  summary: 当前组合树范围回归 257 passed/2 skipped、全量 Code 1452 passed/10 skipped；受影响文件 Ruff check 与 diff check 通过。10 个 skip 均为 native Windows；macOS 已覆盖创建、替换、冲突、目录同步失败、cleanup residue 与 replace reconciliation。
- criterion_id: criterion-07
  outcome: not_verified
  summary: 本地提交 49dacf286 已经 precheck 与原生 Git Gate，16 个路径与声明一致且 70115a3/49dacf286 无重叠路径；独立结果复核尚未绑定当前完整 result_version=1 projection。组合树 full-v4 也仍因 70115a3 中 23 个 WC-0063 lint 问题失败，因此本标准当前不能标为 satisfied。
result_summary: 0064 已在 70115a3 承载的五组 Helper/test hunks之上完成剩余实现，并以独立提交 49dacf286 落账：AtomicWriteResult 收敛为三个受约束形状，POSIX 安全内核与 Windows 行为保持，直接消费者改用原生后端能力语义，sync/cleanup 只保留诊断作用。
validation_summary: 已验证：范围回归 257 passed/2 skipped；全量 Code tests 1452 passed/10 skipped；受影响文件 ruff check 通过；git diff --check 通过；precheck-git-commit passed（snapshot sha256:7469ab5e...）；原生 Git Gate passed；提交后 check-fact-integrity ok/complete/164。full-v4 run-09e04c93f31441a991773aa2e7fa457a 的 Working Tree evidence complete、changes=[]，但 code-lint 因 70115a3 内 23 个 WC-0063 lint 问题失败，后续步骤未运行；native Windows 未实测。
