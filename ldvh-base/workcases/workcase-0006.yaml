title: 建立 WorkCase 专属受控变更 Helper 操作
status: closed
summary: Human 已批准 result_version 1 的完整结果和关闭报告；workcase-0006 正式关闭。
goal: 为 current-profile WorkCase 建立类型专属受控变更操作，减少完整对象复制和机械字段手工拼装错误，同时完整保留
  Reviewer、Controller 与 Human 的既有决定权；并统一单次 Helper 受控记录时间，完善响应 profile、预期权限失败诊断和
  YAML 序列化质量。
scope: 规则范围限 specs/21、32、05、04 与 attachments/04.Att.01；代码范围限 Helper operation
  runtime/service/responses/registry、新 WorkCase request/operation、generic update
  可复用事务层、facts/creation 中 YAML serializer 与 common-dir lock 失败映射，以及直接
  contract/unit/integration/packaging tests 和必要 installed snapshot/登记。核心接口采用
  current-profile WorkCase 顶层 set/remove delta 加闭集
  managed_records：计划审核整体替换、结果审核新增与 Controller 分步处置、执行/关闭审批，以及显式 plan/result
  version 变化对应的来源固定 reset。Helper 只做确定性 after 构造、统一 event_at、版本/审核
  basis/指纹机械派生、既有 schema/transition/relation 校验、CAS、原子写与回读，不从审核结论或普通字段差异决定
  phase、版本、复审或 Human gate。保留 git_common_dir/ldvh 的 linked-worktree
  持久协调域；权限不足结构化为零写入 unavailable，不降级到 WT-local、临时目录或无锁。明确排除修改 specs/00、改变
  WorkCase 状态机与权责、Code 语义裁决、多对象事务、自动编排、Spark 创建或路由、legacy 迁移、C runner/DTO
  语义、Web/WC0004、D 展示、E 隔离全链路验收、其余 C followups，以及 push/PR。
workcase_profile: control-contract-v1
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 新 WorkCase 专属操作具有唯一规则来源，可通过 capabilities 与 installed snapshot
    发现；generic update 对其它事实类型和 legacy 对象保持兼容。
- criterion_id: criterion-02
  statement: 顶层 delta 与闭集 managed_records 可确定性形成完整
    after；普通嵌套值只能整项替换，托管记录只能经专属输入形成，未知字段、冲突组合、legacy 或非 WorkCase 请求均在零写入下拒绝。
- criterion_id: criterion-03
  statement: Controller 显式拥有 phase、status、plan/result version、复审和 Human gate
    等全部语义推进选择；任何 Reviewer conclusion 均不自动推进或否决，result review 与 Controller
    resolution 分步形成。
- criterion_id: criterion-04
  statement: 调用方不能通过便利操作提交自定义或回填的 managed time/version/fingerprint；所有接受的新
    managed record 与 updated_at、当次 Working Tree observation 使用唯一
    event_at，no_change 或非法后继保持零写入。
- criterion_id: criterion-05
  statement: stale fingerprint、并发、非法 transition、写后回读和回滚保持现有 CAS 语义；Human closure
    approval、status/phase closed 与 closed_at 只在同一原子变更形成。
- criterion_id: criterion-06
  statement: common-dir 不可写等预期失败在 target/counter 改变前形成稳定 unavailable 与恢复条件；既有
    linked-worktree 并发唯一编号、counter 单调性和共同串行保证不退化。
- criterion_id: criterion-07
  statement: compact 与 diagnostic 在同一冻结 event_at 下作用于隔离同状态副本后产生相同领域结果与最终 fact
    carrier bytes；compact gap tuple 唯一且 member_count 精确，固定 capabilities fixture
    的 compact UTF-8 bytes 不超过 diagnostic 的 65%，新操作成功 result receipt 不超过 4096
    canonical JSON bytes，diagnostic 可定位且不泄密。
- criterion_id: criterion-08
  statement: YAML serialize-parse 语义等价且无尾随空格；合同、全状态机、并发、权限、profile、packaging
    等外部测试及聚焦、ruff、full-v4 通过。B WorkCase 随后使用新操作完成最后执行态更新并合法进入
    controller_checking；后续审核、关闭准备、Human gate 与最终 closed 仅作工作项之外的生命周期验收。
