    summary: 对当前 result projection 发起只读结果复核并处置反馈
    target_scope: 当前 result version 的完整 projection、现有 Luna Orca Worker 的只读 Reviewer 通信及本 WC 自身受控写回
    effect_scope: 允许派发当前结果、读取反馈、由 Controller 处置并通过 Helper 更新本 WC；不授权 Reviewer 修改实现或事实
    risk_summary: 旧 review、Worker 当前不可用或版本/证据不匹配可能造成错误关闭判断；本 WC 不自动降级到 same-AI
    rollback_summary: 结果变化时按 21 使旧 review 失效并由 Luna Worker fresh review；Helper 写回按 CAS 与回读处理
    rule_refs:
    - '21'
    - '34'
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-5
    result_review_action_id: authorization-6
  action_ceiling: 仅允许 authorization-1 至 authorization-6 所列规则、Code/Helper、Web、测试、现有 Luna Orca Worker 的只读 Reviewer 通信和本 WC Helper 受控写回。当前 WC 的 creation/PlanΔ/result review 均优先并实际使用已解锁的 collaboration Worker；当前旧 Schema 不支持的 actual_method 不得伪写为 subagent 或 same-AI，也不得把字段表达缺口改写成环境能力 unavailable。
  prohibited_actions:
  - 不得执行 Git commit、push、rebase、reset、merge 或发布
  - 不得安装依赖、访问外部网络或部署插件
  - 不得修改 closed WC0066、spark-0065 或其它事实对象；本 WC 自身只能经 Helper 受控写回
  - 不得清理、覆盖、stage、restore 或回退 workcase-0088、workcase-0089、workcase-0090 及其它无关 dirty changes
  - 不得把 permission_required、not_authorized 或 unknown 写成 unavailable
  - 不得把 Orca collaboration Worker 冒充 native subagent，也不得混用两类模型目录
  - 不得把 item-1 技术复核写成第三个 WorkCase review 位置、phase 或 Human Gate
  - 不得把当前 Schema 尚不能结构化记录 collaboration Worker 写成 collaboration 能力 unavailable
  - 不得在 collaboration Worker 当前可用时继续降级到 native subagent 或 same-AI
  allowed_adjustments: 允许在已声明字段目标内细化字段名和直接消费者文件、调整目标测试组合与 item 内实现顺序；必须保持瞬时 preflight/持久 policy 分界、两个 lifecycle review 位置、1→2→3 路由和每轮最多 3 视角。当前 WC 的 bootstrap review 由实际 Luna Orca Worker 完成；item-1/item-2 生效后不得反向伪造该历史事件的 actual_method。
  verification_and_rollback: 规则先行并在进入 Code 前形成 item 内独立只读规范技术复核材料；每个稳定检查点运行范围匹配测试并逐文件审 diff；事实写回后精确回读与 check-fact-integrity；最终运行目标 tests、git diff --check 与 full-v4。失败只回退本 WC 可精确归因的局部变更，不能安全区分时停止。
  out_of_bounds_handling: 需要新增依赖、Git 提交、插件部署、外部网络、修改其它事实对象、扩大生命周期/字段目标、覆盖无关 dirty、无法按区块安全合并、并发基线失稳，或当前 Luna Orca Worker 无法完成 fresh review 时，停止相关动作；按 21/34 据实 blocked、取消或形成残余责任，不在当前基线内自动降级到 same-AI。
