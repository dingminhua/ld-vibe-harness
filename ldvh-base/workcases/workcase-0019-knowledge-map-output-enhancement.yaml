        - Code 不猜自然语言：action_type 只来自枚举 action_hint 或确定性 task_type
        - attention_points 保持 3-5 条上限，不膨胀
        - 交互密度去重必须能复现，不因字段差异漏去重
      aggregation_rule: 若任一审查发现违反 04/06 边界或引入自然语言猜测，必须先修正方案再推进。
      review_items:
        - id: plan-review-spec-1
          reviewer: subagent-spec-boundary
          role: 规范边界审查
          agent_name: Explore-1
          requested_at: '2026-06-27T07:06:00+08:00'
          perspective: specs-boundary
          result:
            status: needs_changes
            summary: |
              六项增强核心方向不违反 04/06 边界。4 项 required changes：attention_points/tool_plan 需明确为 dispatcher receipt 字段(非 04.Att.06 扩展)；post_read_action 必须锁定为确定性模板；去重 receipt 结构扩展需记录；与 wc-0018 向前兼容声明需加入。
            key_findings:
              - attention_points 和 tool_plan 不在 04.Att.06 顶层字段列表中
              - post_read_action "自然语言建议"与 04 §6 第 7 条冲突
              - 去重依赖 receipt 扩展，当前 read_plan_consumed 未存储 target/action_hint
              - 借用 wc-0018 设计但须声明向前兼容
