type: change
title: 00 总纲 §3/§4 章节互换及既有引用错误修正
author: ai
status: done
created: 2026-06-02
updated: 2026-06-02
context: |
  00 总纲原 §3 价值实现标准引用 §4 才定义的五类构成要素概念（事实源边界、网页视图、事实模型、行动模型等），读者在阅读 V1-V10 时概念悬空。原 §4 架构与 §5 运行闭环天然衔接，被 §3 隔断。互换后逻辑流更顺畅：架构构成（What）→ 价值实现标准（How Good）→ 运行闭环（How）。
  同时修正三类既有引用错误：§3.4 不存在（应为 §3.3）、§3.3 反向判断实际是 §3.2、V1-V7 过时应为 V1-V10。
decision: |
  1. 将 00 总纲原 §3 价值实现标准与原 §4 架构：五类构成要素互换，子章节重新编号；
  2. 更新所有外部文件中对 00 §3/§4 章节号的引用；
  3. 顺带修正既有引用错误：§3.4→§4.3、§3.3 反向判断→§4.2 反向判断、V1-V7→V1-V10。
consequences: |
  - 00 总纲章节顺序变为：§3 架构→§4 价值实现标准→§5 运行闭环，概念依赖方向正确；
  - 8 处外部引用已同步更新；
  - 3 类既有引用错误已修正。
