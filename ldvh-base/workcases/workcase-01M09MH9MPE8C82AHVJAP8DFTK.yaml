title: 落实独立审核不可用时的报告停止与询问Human流程
status: closed
goal: 修改 21 §4.5 审核方法与保证边界的规则，将 Controller 无法创建 Subagent 时的行为从「披露后直接继续」改为「报告并停止，询问 Human 是否采用切换视角的方案」。
scope: "1. 修改 21 §4.5.1.3 规则文本：从「告知后直接执行，不等待确认」改为「报告并停止，询问 Human 决定」\n2. 同步修改 31 §5.2.1 对应的 Subagent 判断 fallback 行为，与 21 §4.5 一致\n3. 同步修改 34 §5 第 42 行「不请求确认、不新增 Gate」的旧表述\n4. 更新 00 理念与构成中引用 21 §4.5 的相关部分\n5. 整体验证：机械校验和引用一致性检查\n\n排除边界：\n- 不修改 Subagent 创建机制本身\n- 不修改模型选择或路由策略\n- 不修改已获批 WorkCase 的已有授权\n- 不引入新的 Human Gate 类型（仅改变方法选择确认点的处理方式）"
