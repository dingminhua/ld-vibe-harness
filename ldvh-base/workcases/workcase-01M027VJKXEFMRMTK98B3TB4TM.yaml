success_criterion_definitions:
- criterion_id: criterion-config-hard-cutover
  statement: 权威配置语义由根 product_name 硬切换为 governance_instance_name，product_description 保持用途说明；Python、全部配置 fixtures、外部配置与允许范围内 Web settings reader 原子迁移，无 alias，old-only、old+new 和未知根键均拒绝；迁移前后项目数、IDs、paths、default、common-dir、解析结论及注释头保持等价，外部实例值为 LDVH Dogfood Governance。
- criterion_id: criterion-shared-collision-guard
  statement: 单一无副作用 guard 使用同次 governance snapshot 中 trim 后的有效实例名与现有 parse_signature 归一后的 product_name 比较，碰撞稳定返回 code=signature_governance_instance_collision；不额外大小写折叠，null product_name 不碰撞，非法或重复 trailer 继续优先走既有错误。
- criterion_id: criterion-all-write-entries
  statement: 事实 create、update、全部 update-workcase lifecycle/recovery modes 均在 inject_observed_write_signature 成功后且任何 native atomic backend、锁或文件写副作用前消费同一 guard；Git precheck 与 native commit-msg Hook 共同消费 adapter→CommitValidationInput→validator 链，同码阻断碰撞，负例证明 backend、锁与文件均未触发。
- criterion_id: criterion-contract-and-web-boundary
  statement: 署名 schema、product_name/model_name/agent_runtime_name、Git trailers、历史 facts 字面保持不变；Web production 仅修改 governedProjectsSettings.ts 以读取新配置，三个直接配置 fixture 测试随迁移，Codex / gpt-5 / codex-desktop 的署名显示只读验证，失败只报告而不扩权修复。
- criterion_id: criterion-validation-and-isolation
  statement: 直接、focused、full Python 与允许范围内 Web 测试、Ruff、git diff --check、ldvh check、check-fact-integrity、真实 precheck/native Hook 验证通过；创建/执行开始时全部 pre-existing dirty/untracked 逐路径基线保持不变且不被暂存或提交；仅在完整验证通过后形成一个本地受控 commit。
