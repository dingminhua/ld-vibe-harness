success_criterion_definitions:
- criterion_id: criterion-gate1-consumption-coverage
  statement: 环境验收行为同时覆盖同一已批准 WorkCase 中的有界本地动作与只读 Reviewer 委派，并明确二者直接消费 Gate 1、不产生新的 WorkCase Human waiting/权限提请；环境强制 UI 只按原文、版本和政策作为非 LDVH 边界记录。
- criterion_id: criterion-subagent-context-regression
  statement: work_context 的 SubagentStart 成功路径具有回归测试，且只证明规则引导递达、facts=not_requested 与不替代精确事实/授权读取。
- criterion_id: criterion-bounded-validation
  statement: 相关 work-context、文档和规范测试通过，且结果不把本地回归覆盖夸大为已验证所有运行环境 UI 行为。
goal: 消除已获 Gate 1 授权的有界本地动作和只读 Reviewer 委派在执行期被误提示第二次 Human 权限的本地递达与回归覆盖缺口；若实际提示来自运行环境强制 UI，必须如实区分其并非 LDVH 的第三 Gate。
status: closed
