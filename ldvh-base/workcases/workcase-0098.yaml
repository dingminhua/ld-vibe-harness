title: WorkCase Gate 1 后连续执行与机械 Stop gate 落地
status: open
summary: 完整关闭提案已形成，等待 Human Gate 2；Stop gate 应在此安全出口放行。
priority: P1
goal: 让 WorkCase 在 Gate 1 批准后持续消费 Controller-owned 控制步骤，仅在 Gate 1、Gate 2、真实 blocked、unresolved 或 closed 时允许交还，并在当前 Claude Code/Cindy 宿主中以 Stop hook 机械纠正非法停止。
scope: 覆盖 specs/09、21、34 与必要附件；派生 handoff 判定、只读 Helper 操作、context recovery/Web 合同；项目级 Stop hook 与精确绑定；Python/Web/hook/真实会话验证；处置 workcase-0097 与 spark-0073 证据；本地受控 commit。排除 push、PR、远端发布、Code 自动选 item、绕过独立结果复核、增加第三 Human Gate或第二持久状态机。
success_criterion_definitions:
- criterion_id: criterion-1
  statement: 规则源一致定义 handoff_allowed 的派生闭集、fresh projection 约束、精确绑定、fail-open 与宿主接入边界，保持 Gate1/Gate2、blocked/unresolved/closed 唯一安全出口。
- criterion_id: criterion-2
  statement: Code 以单一纯函数派生 handoff verdict，read-fact-objects、context-recovery、Web 与只读 check-workcase-handoff 操作使用同一语义，且不写事实、不推进 phase、不选择 item。
- criterion_id: criterion-3
  statement: 项目 Stop hook 只对精确绑定的当前 WorkCase 生效；Controller-owned projection 阻止 Stop 并反馈下一控制步骤，Gate1/Gate2/blocked/unresolved/closed 放行，无绑定或异常 fail-open，具备死循环保护。
- criterion_id: criterion-4
  statement: 状态机严格结果链保持不变，controller_checking 不能直达 Gate2；Python/Web/hook 正反测试覆盖所有 phase、误绑、stale、无绑定、异常和重复 Stop。
- criterion_id: criterion-5
  statement: 真实 WorkCase 验证在 Gate1 后连续通过 item、结果投影、独立复核和关闭提案，仅在 gate2_waiting 停止；workcase-0097 与 spark-0073 据实收口，事实完整性通过。
- criterion_id: criterion-6
  statement: 目标回归、全 Python/Web 测试、ldvh check、check-fact-integrity、git diff --check 与受控本地 commit 全部通过；不执行 push。
phase: human_closure_confirming
plan_version: 1
