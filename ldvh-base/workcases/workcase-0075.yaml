title: 核验事实对象增量变化定位的两种方案
goal: '为 Spark-0067 的缺陷 #9，以当前可回读的事实源和 Helper 能力为证据，比较逐对象 manifest 与 changed_since 两种增量变化定位方案；只形成可验证的建议或 no-go，不实现生产方案。'
scope: '仅覆盖 Spark-0067 缺陷 #9：当前事实对象集合指纹、身份定位输入与调用路径，以及 per-object manifest 与 changed_since 对 create、update、delete、跨类型/关系变化的识别边界和成本取舍。证据限当前 Helper 的只读调用、规范/源码/既有测试与事实源的静态追踪；如确有必要，只能在 /tmp 的可丢弃副本中测量成本模型。排除仓库文件修改、测试或合成基准创建、规范/Schema/Helper/API 变更、生产实现、Worker 或提示卡实验、WorkCase-0068 路线、外部写入、暂存和 Git commit。'
success_criterion_definitions:
- criterion_id: criterion-observable-baseline
  statement: 回读并记录当前集合指纹输出、身份定位所需的输入与公开调用，以及现有事实对象变更的可观察边界；不能把静态推断写成已观测行为。
- criterion_id: criterion-scenario-coverage
  statement: 对 create、update、delete、跨类型与关系变化逐项说明两种方案能否识别、所需前提和不可证明范围；没有真实可重放的多快照证据时，结论必须为 inconclusive/no-go，不能由内存或合成投影补足。
- criterion_id: criterion-bounded-recommendation
  statement: 按固定比较轴形成单一建议或 no-go：基线/持久状态与保留期、删除/历史游标、分页排序/一致性、权限与可见范围、响应与服务端成本、完整性/篡改边界、schema/公开契约影响；未观测的实际使用频率必须明确标为未观测。
- criterion_id: criterion-no-implementation-leakage
  statement: 全过程不修改仓库、受管事实（本 WorkCase 生命周期回写除外）或外部系统，不运行 Worker/card/0068 实验，不暂存或提交；任何生产方案、接口或规范修改另立 WorkCase 并重新取得 Human Gate。
success_criterion_results:
- criterion_id: criterion-observable-baseline
  outcome: satisfied
  summary: 已回读当前完整 F1 集合与 object_set_fingerprint，并依据 05 §11.6 标明其仅为过期检测；身份定位和跨快照位置未被公开。
- criterion_id: criterion-scenario-coverage
  outcome: satisfied
  summary: create/update/delete 与跨类型/关系变化均无可重放真实多快照证据；测试内存投影不作为生产证据，因此结论为 no-go。
- criterion_id: criterion-bounded-recommendation
  outcome: satisfied
  summary: 已按持久状态、删除/游标、分页/一致性、权限、成本、完整性与公开契约比较；使用频率与服务端成本明确为未观测。
- criterion_id: criterion-no-implementation-leakage
  outcome: satisfied
  summary: 仅进行了 Helper/规范/源码/既有测试的只读观察及本 WorkCase 生命周期写回；没有修改仓库、运行 0068 实验或提交。
result_summary: '本次只直接观察到一个 F1 完整扫描。现有测试模块定义的公共比较模型只能报告集合聚合变化，不能定位变化对象；逐对象比较是明确隔离的测试内存工具。对 Spark-0067 #9 的可验证结论仍是 no-go，而非选择生产实现。'
validation_summary: 已验证：本次单一 F1 调用 coverage=complete、object_set_fingerprint 与 recovery_manifest 一致；源码静态追踪确认 testing/fact_change_measurement 的 PublicObservation 明示 location_supported=false，CandidateProjection 明示 test-only-in-memory。未验证：真实生产多快照、删除/游标、分页一致性、权限范围、使用频率、响应/服务端成本与篡改边界。
