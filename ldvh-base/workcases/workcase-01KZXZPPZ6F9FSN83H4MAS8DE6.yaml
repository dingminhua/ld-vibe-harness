status: closed
title: 验证规则精确读取任务族的上下文合同评估方法
goal: 在单一规则精确读取任务族上，冻结最小必要上下文合同、任务与评分协议，完成隐私受限的三变体配对试跑，判断该评估方法能否稳定区分完整交付、必要输入缺失和无关输入增加，而不声称 LDVH 总体服务质量已经改善。
scope: 仅新增规则精确读取评估方法及聚焦测试，在 code/ldvh/testing 下建立新的三变体评估模块并复用 trial_measurement.py 的 SafeTrialTempRoot 与通用隐私/测量设施；不改变现有两条件 controlled-trial 协议或 local_edit_evidence v2 语义。原始运行材料只进入受限临时根并在安全核验后清理。实验完成后，在当前 Study 规则与授权仍成立时，最多受控创建一份 technical_assessment Study。排除修改正式规则语义、行动模板、Helper 公共契约、统一健康分、长期遥测、Dashboard、告警、宿主最终 Prompt 不可观察时的 host-received 声明、当前全部未提交修改、另一个执行中 WorkCase 的事实文件和作用范围、上游 Spark 的任何写入，以及 Git commit、push、release 或外部发布。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: 运行结果产生前已经冻结并版本化规则精确读取的最小必要上下文合同，明确 required、conditional、excluded、适用条件、来源 locator、版本或指纹、允许替代项与失效条件。
- criterion_id: criterion-protocol
  statement: 运行前已经冻结任务、rubric、三变体生成规则与任务等价性检查；完整合同、移除必要输入和增加无关输入由新的三变体评估模块承载，不把现有两条件 controlled-trial 设施表述为已支持三条件。
- criterion_id: criterion-trial
  statement: 隐私受限的配对试跑通过安全临时根完成，并取得不知道实验变体的独立评分；实际证据层级、宿主递达不可观察项、指纹和清理结果均据实记录。
- criterion_id: criterion-diagnostics
  statement: 结果能够区分 LDVH prepared、harness-delivered、host-received unavailable、behavior-consistent 与 causal-effect 限制，不把输入引用或单次差异写成总体服务质量改善。
- criterion_id: criterion-verification
  statement: 聚焦测试与风险匹配检查按实际结果记录，失败、不确定、评分不一致或任务不等价均可作为合法结果交还，不被强制改写为通过。
- criterion_id: criterion-report-boundary
  statement: 实验完成后形成满足当前 Study 准入和五段正文要求的 technical_assessment 报告候选；若 Study 前置条件不成立则跳过事实创建并在 WorkCase validation 中据实记录，不把跳过本身判为方法失败。
success_criterion_results:
- criterion_id: criterion-contract
  outcome: satisfied
  summary: contract 1f4fc351… 在运行结果前冻结，包含 required/conditional/excluded、来源指纹、替代和失效边界。
- criterion_id: criterion-protocol
  outcome: satisfied
  summary: 三个任务及三变体、等价性和客观 rubric 在试跑前冻结；新模块没有改变现有两条件协议。
- criterion_id: criterion-trial
  outcome: not_verified
  summary: 完成了受限 3×3 执行和双评分且 raw 根已删除，但执行体没有保持同一模型/入口，不能验证组间可比性或因果效应；host-received unavailable。
- criterion_id: criterion-diagnostics
  outcome: satisfied
  summary: 聚合与 Study 明确区分 prepared、delivered、host unavailable、behavior-consistent 与 causal-effect 未建立，并拒绝总体改善声明。
- criterion_id: criterion-verification
  outcome: satisfied
  summary: 26 项新测试、73 项复用边界回归共 99 passed，Ruff passed；失败执行按 rubric 保留，没有强制改写为通过。
- criterion_id: criterion-report-boundary
  outcome: satisfied
  summary: 已创建并回读 technical_assessment Study ldvh@SFY7DG，五段正文与输入边界完整，无 raw 交互，事实完整性 complete。
result_summary: 交付新的规则精确读取三变体评估原型与测试，并完成一次受限 3×3 方法试跑和 Study。方法可执行且可诊断输出不稳定，但执行体不等价、样本过小且宿主递达不可观察，当前不形成因果效应或 LDVH 总体服务改善结论。
validation_summary: 新模块聚焦测试 26 passed；复用 trial/local-edit/spec-content 边界 73 passed；合计 99 passed，Ruff passed。Study 精确回读 mechanically_valid，230 个事实对象完整性检查 complete。受限临时根经 realpath、类型和权限核验后删除。未验证范围：host 最终 Prompt、等价模型/入口、重复样本和因果效应。
