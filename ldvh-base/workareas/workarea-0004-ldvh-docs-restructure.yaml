source: 用户在当前会话中要求建立 LDVH 项目文档组织重构工作范围，第一个任务是梳理 50 号文档和工作流规范。
scope: |
  完成 50 号文档梳理并形成后续文档组织重构的任务依据；重构过程中保持 specs 编号、引用边界、事实模型与工作流规范边界清晰；所有事实源变更可验证、可追溯并符合 LDVH Rules / Skill / Change 纪律。
constraints: |
  优先回到规范原文判断；不得凭记忆调整文档结构；涉及 specs、Rules、事实源或长期机制边界变更时按 Human Gate 和 Change 规则执行。
