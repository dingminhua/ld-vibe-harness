inventory_id: v2-specs-system-inventory-001
status: temporary_migration_inventory
created_from: ../ld-vibe-harness/specs
purpose: >
  Inventory the current LDVH specs document system before migrating more v3
  content. This file is temporary migration material only. It is not a v3
  rule source, schema authority, or Action Guide.

stable_constraints:
  - Preserve the original LDVH specs document system as the migration baseline.
  - Do not replace spec bodies with YAML.
  - Do not introduce a new topical directory taxonomy for ordinary spec bodies.
  - Keep specs/core small and limited to parent-level abstractions.
  - Keep specs/schemas as specs-authorized machine contracts.
  - Use YAML projections only after Markdown spec authority exists.

original_system_summary:
  body_specs:
    "00": "LDVH value and philosophy baseline."
    "01-08": "Foundational specs for spec system, fact model, action orchestration, Code, Web, Runtime, Git/fact-source, and testing."
    "20-24": "Record object specs for Spark, WorkCase, ADR, Pitfall, and Study."
    "30-36": "Action orchestration / entry specs for recurring AI workflows."
  attachments:
    location: specs/attachments
    convention: "NN.Att.MM-* belongs to parent spec NN unless a spec states otherwise."
    migration_rule: "Keep attachment identity under attachments unless a core/spec authority explicitly promotes its machine contract into specs/schemas or tests."

recommended_action_enum:
  keep_as_markdown_spec: "Migrate or preserve as Markdown spec body under the original specs document system."
  abstract_into_core: "Extract a small parent-level rule into specs/core after checking overlap with existing core specs."
  authorize_schema: "Use the spec or attachment to authorize a machine contract in specs/schemas."
  convert_to_test: "Encode repeatable checks, examples, and regression expectations in tests."
  keep_as_attachment: "Preserve as attachment or supporting table rather than parent spec."
  do_not_migrate_now: "Leave in v2 until its parent area is intentionally migrated."

spec_entries:
  - source_path: specs/00-LDVH理念与价值标准.md
    original_role: value_baseline
    current_authority_level: philosophy_and_value_parent
    migration_candidate: yes
    recommended_action: [keep_as_markdown_spec, abstract_into_core]
    must_read_with: [specs/01-规范体系基础规范.md]
    risk: "Do not turn broad value language into executable Code rules."
    notes: "Potential source for minimal v3 value constraints, not a YAML projection candidate."

  - source_path: specs/01-规范体系基础规范.md
    original_role: spec_system_foundation
    current_authority_level: foundation_spec
    migration_candidate: yes
    recommended_action: [keep_as_markdown_spec, abstract_into_core, authorize_schema]
    must_read_with:
      - specs/attachments/01.Att.01-知识地图关系类型表.md
      - specs/attachments/01.Att.04-规范身份字段表.md
      - specs/attachments/01.Att.05-附件身份字段表.md
    risk: "Highest risk of duplicating or replacing the original document system if migrated too aggressively."
    notes: "First formal migration candidate after inventory review; compare with specs/core/spec-system.md before changing v3."

  - source_path: specs/02-事实模型基础规范.md
    original_role: fact_model_foundation
