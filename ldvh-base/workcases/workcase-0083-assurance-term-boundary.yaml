id: workcase-0083
type: workcase
title: 收窄落地术语边界并分层规范保障到部署链路
goal: 收窄落地术语边界并分层规范保障到部署链路
status: human_closure_confirming
created: '2026-06-21T09:17:44.126386'
updated: '2026-06-21T09:58:03.296586'
priority: P1
description: |
  当前 04 系列和 43 工作流程中，“落地”同时承载规范要求声明、能力资产保障、环境适配、部署执行、适配检查和现场有效状态等多层语义，容易让 Human 和 AI 把“资产存在”误解为“已经部署并可用”。

  本 WorkCase 承接一次术语与规范治理工作：先通过 Human Gate 确认是否正式收窄“落地”定义，再调整 02、04 系列和 43 的术语口径，明确“规范保障要求、能力保障、能力资产、环境适配、部署执行、适配检查、落地/本次现场有效”的链路；随后按 Human 后续裁决执行 Rules、Code、Web、测试、CLI 和 JSON 字段的一次性硬改，统一收敛为 `assurance` 和“规范保障要求”口径。
success_criteria: |
  - [x] Human Gate 明确正式收窄“落地”的定义，并明确不设置兼容期
  - [x] 02 术语规范明确“落地”与规范保障要求、能力保障、环境适配、部署执行、适配检查的边界和推荐写法
  - [x] 04、04.01、04.02、04.03 的职责链路改为分层表达，避免把保障机制字段解释为已部署或已生效状态
  - [x] 43 工作流程明确自己审核保障准备度，不直接声明现场落地结果
  - [x] 有工作流程接管与无工作流程接管两种情况下，规范保障要求的写法、派生可发现性、生命周期触发和 Code 派生检查责任清楚
  - [x] Rules、Code、Web、测试和 Code 文档已同步硬改：`assurance`、`assurance-report`、`ldvh-assurance-check`、`assurance-plan`、`assuranceCheck`、`assuranceReport`、`metadata.report` 和 `assurance_takeover` 等结构化入口均改为 `assurance` 口径
  - [x] 验证命令、残留风险和后续分流记录清楚
source: |
  用户在当前对话中先要求分析“落地规范”与 LDVH 能力资产、环境部署之间的关系，又要求主控和子 Agent 一起评估需要做哪些事。随后用户追问“有工作流程”和“没有工作流程”时规范保障要求应如何写，以及变化后如何让相互之间知道要检查变化、适应变化。最后用户明确要求“了解一下 workcase，建立一个workcase”。

  Human Gate 记录：
  - 触发原因：将当前对话中的术语治理议题升级为 WorkCase。
  - 影响范围：02 术语规范、04 系列、43 工作流程、Rules 入口、Code `assurance-*` 检查与报告、Web 展示和测试。
  - 确认依据：用户明确要求建立 WorkCase。
  - Human 决策：允许创建 WorkCase 承接后续规范治理与结构化入口迁移评估。
  - 执行结论：Human 已进一步确认彻底硬改；specs / rules / code / web / tests / ldvh-base 已按本 WorkCase 执行并进入关闭确认。
