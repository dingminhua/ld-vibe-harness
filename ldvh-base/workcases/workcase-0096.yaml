title: 双源只读局部编辑候选辅助
goal: 交付来源声明的只读 Helper 操作 prepare-local-edit-candidates：为规则源与 Study 的精确局部目标返回基线、stale、候选 before/after unified diff、来源和范围证据；不产生写权限、合并或发布结论。
scope: 仅覆盖 specs/04-Helper CLI 服务规范.md 及其授权字段附件中的声明/契约，local_edit Helper 实现与注册，相关 Helper/CLI 测试，规则精确读取和 Study 读取。排除 canonical facts（本 WorkCase 除外）、操作内写/CAS/锁、merge/rebase、Study 重建或 patch 发布、其它事实类型、Web、环境/Git Hook、commit/push/PR/release/external。
success_criterion_definitions:
- criterion_id: criterion-declared
  statement: 当前规则源声明 prepare-local-edit-candidates 为 read，注册后 capabilities 发现 implementation.present=true，既有读取公开语义不变。
- criterion_id: criterion-exact
  statement: 规则仅接受 responsibility_key 加精确 H2/H3 heading_path，Study 仅接受稳定 fact_ref 加固定正文标题；歧义或缺失明确报告，不以相似名称、数组下标或裸 offset 回退。
- criterion_id: criterion-baseline
  statement: 返回规则 hash 或 Study content_fingerprint，准确报告 stale；漂移要求重读重组，不执行 fuzzy match、auto-merge、rebase 或发布。
- criterion_id: criterion-evidence
  statement: 返回 before、可选 after、逐行 unified diff、来源/行范围和已展开/未展开范围；未定位或未展开范围不伪装为覆盖。
- criterion_id: criterion-read-boundary
  statement: 操作 effect=read 且 changes 为空；规则侧不替代资格、独立复核或 Human Gate，Study 侧不绕过完整 after、CAS、回读或审计，不实现统一 patch 发布。
- criterion_id: criterion-verification
  statement: 相关测试、Ruff、diff check、integrity、capabilities 和代表性直接调用完成并如实记录；基线漂移导致不可归因时停止报告。
success_criterion_results:
