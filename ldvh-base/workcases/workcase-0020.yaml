  result_summary: Web 详情、Gate1 Card、复制摘要与 Cognition 共用当前事实投影，完整呈现授权包与来源；收件箱仅包含 plan/closure，blocked 保留在详情；未引入轮询、自动刷新或额外刷新按钮。npm run check 通过，Web API 131/131 passed。
- item_id: item-05
  goal: 完成活动 WorkCase 一次性迁移、回归测试与跨层一致性验证。
  expected_result: 0008、0013、0015、0017、0019 均按实际阶段获得明确且可回读的处置，closed 零改写，不存在伪造授权或运行时旧 profile；双 Gate、模板、Helper、Web 和端到端测试通过并形成可复核验证摘要。
  status: completed
