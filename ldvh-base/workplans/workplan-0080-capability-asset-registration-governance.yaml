verification_evidence: |
  ## 验证计划

  验证 workplan-0080 是否完成固定能力资产登记制与最佳实践规范收敛：04.02 是否补齐资产类型最佳实践、同步监督和部署副本分层；01 是否已有目录定位；Code/Web 缺口是否已判断并分流；事实源关系是否保持有效。

  ## 验证命令

  ```bash
  python3 code/specs_validate.py doc specs/04.02-LDVH能力资产与落地保障规范.md
  python3 code/specs_validate.py refs specs/04.02-LDVH能力资产与落地保障规范.md
  python3 code/specs_validate.py landing specs/04.02-LDVH能力资产与落地保障规范.md
  python3 code/specs_validate.py deployment-entries
  python3 code/specs_validate.py all
  python3 code/fact_validate.py ldvh-base/workplans/workplan-0080-capability-asset-registration-governance.yaml
  git diff --check
  ```

  ## 验证结果

  04.02 的 doc、refs、landing 检查均通过。
  `deployment-entries` 检查通过，确认当前必备 Rules 资产存在并具备 `ldvh_asset` 自登记元信息。
  `specs_validate.py all` 普通模式退出码为 0；仍存在仓库既有 review hint / warning，不属于本计划新增硬错误。
  workplan-0080 单体事实源校验为 errors=0 warnings=0。
  相关 diff 空白检查通过。

  ## 结论

  本计划已完成固定能力资产登记制、资产类型最佳实践、同步监督和部署分层边界的规范收敛，并明确 10 号提交规范的 Skill/Hook 具体落地仍由 workplan-0074 承接。计划进入 review_needed，等待 Human 关闭审查。
