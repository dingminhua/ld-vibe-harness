title: LDVH 行为可观测性与健康投影
intent: 验证是否能用稳定的行为事件、不变量和外部状态快照，以及 AI 执行时接收到的输入上下文，形成对 Agent 与 Controller 执行健康度的可回放判断；后续需要确定事件契约、健康状态、输入上下文快照机制、误触发与漏报检测，以及它们和事实源、验证、恢复、清理之间的边界。若不跨行动保留这个议题，后续会反复依赖对话回放和手工判断，增加定位、复核与中断恢复负担。
