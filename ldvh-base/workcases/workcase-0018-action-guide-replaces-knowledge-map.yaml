id: workcase-0018
type: workcase
title: 行动指南替代知识地图的默认入口设计
goal: |
  承接 spark-0035，把“行动指南”建立为 LDVH 所有 AI 行动开始前的统一指南能力：在既有知识地图能力和前序行动指南要求基础上补充加强，输出本次行动该怎么做、注意什么、遵守什么、用什么工具、哪里必须停、读完后怎么继续和如何验证。行动指南成立后，应按受控迁移删除 knowledge-map 作为独立工具、入口和 active 能力名，但不得删除或弱化既有知识地图已验证的关系投影、来源回指、read_plan、stop_conditions、next_queries、impact_summary、问题诊断和渐进读取能力。
status: closed
created: '2026-06-27T06:07:56+08:00'
updated: '2026-06-27T07:11:29+08:00'
priority: P1
description: |
  spark-0035 已将问题从“知识地图主动提醒不足”收敛为“行动指南应替代旧 Rules 长路由和 knowledge-map 独立入口”。行动指南不是一个与 knowledge-map 并存的第二工具，而是继承知识地图能力后形成的更高层默认入口。它面向所有 LDVH 行动，包括讨论、判断、创建 Spark、处理工作对象、修改 specs/rules/code/web、运行 Hook/Skill/Agent、提交、部署、复核、分流和 Human Gate。

  本 WorkCase 的第一阶段不直接改 Code、不删除 knowledge-map，也不修改 Runtime Protocol 门禁。目标是先把行动指南的 Schema、职责边界、输入范围、迁移清单、删除条件和审查意见收敛到可执行方案，避免把“删除 knowledge-map”误做成先删后补，或把“所有管辖项目事实源”误做成全量上下文注入。
success_criteria: |
  - [ ] 明确行动指南的正式定位：替代旧 Rules 长路由和 knowledge-map 独立入口；不得与 knowledge-map 长期并存为两个用户可见工具。
  - [ ] 明确行动指南必须继承既有知识地图能力：关系投影、来源回指、read_plan、stop_conditions、next_queries、impact_summary、问题诊断和渐进读取不得弱化。
  - [ ] 定义行动指南 AI-facing Schema 草案，至少包含行动类型、target/职责对象证据、source_refs、must_read_p0_p1、3-5 条注意事项、工具计划、STOP candidates、Human Gate candidates、diagnostics/result_status、next_queries、post-read action plan、verification_plan 和 fallback，并明确必填性、失败态、字段间合成关系和 fallback 分流语义。
  - [ ] 明确 AI 消费流程：识别 target / action hint → 生成行动指南 → 回读 P0/P1 原文 → acknowledge-read-plan → 基于 read_plan、stop candidates、tool_plan、Human Gate candidates 和 diagnostics 合成 post-read action plan → 执行/STOP/提问 → 验证。
  - [ ] 明确最小调用输入：用户目标、cwd、target paths、action hint、diff / staged paths、explicit project 和是否请求跨项目召回；Code 不得自行理解自然语言价值取舍。
  - [ ] 明确输入范围：active specs、授权附件、运行时资产和所有管辖项目事实源默认纳入可发现、可按条件查询、可召回和可影响判断范围；默认输出仍 target-first、current_project 起步、P0/P1 渐进读取；只有跨项目查重、影响判断、全局召回、用户明确要求或 target 指向跨项目关系时才升级 all_governed_projects。
  - [ ] 写硬跨项目边界：保留项目命名空间，不得裸 ID 合并，不得越界读取未登记项目/未授权 docs/项目根之外路径，不得把派生关系或诊断回写为事实源。
  - [ ] 写硬分层边界：Runtime Protocol / dispatcher 仍负责 canonical event、receipt、blocking、acknowledge-read-plan、pre-tool-use、git.commit-msg 和写入/提交门禁；行动指南只生成基于事实源的行动指南，不自行放行、阻断或授权 Human Gate。
  - [ ] 完成 knowledge-map 引用迁移影响清单，覆盖 specs、attachments、rules、code、tests、hooks、web 和工作对象引用，区分 active 入口迁移、内部实现重命名、历史文本保留和删除条件。
  - [ ] 写硬删除前置：删除 knowledge-map 独立 CLI/API/active 名称/入口前，必须完成影响扫描、action-guide 等价能力验证、测试通过、Rules 同步审查和 Human Gate。
  - [ ] 定义 AI 价值验收场景和指标，至少覆盖错读防止、旧 Rules 长路由防回潮、跨项目查重、knowledge-map 不可用 fallback、读后行动计划质量和上下文预算控制。
  - [ ] 定义字段预算：P0/P1 数量上限、attention points 保持 3-5 条、P2/P3 只能通过 next_queries 展开、全管辖项目只做召回/影响判断不注入全文。
  - [ ] 定义 Code 可实现边界：新增 action-guide 契约和测试前不得删除旧入口；action_type 必须来自显式 action_hint、target 类型、tool/read-write 类型或 staged paths，不能由 Code 猜测自然语言价值取舍。
  - [ ] 定义 target 解析优先级：事实对象 > active spec / runtime asset > external path placeholder，并按 path 去重 read_plan，避免 WorkCase / Spark 路径被误解析为 external path 节点。
  - [ ] 定义交互密度策略：支持 receipt / brief / standard / full 输出模式；默认 brief；同一 cwd + targets + action_hint + diff/staged hash + project_scope 已 ack 时只返回 guide_receipt=found，不重复刷完整指南。
  - [ ] 定义 action-guide 输出授权语义：只能输出 stop_candidates、human_gate_candidates、required_dispatcher_events、not_authorized 等候选和提示字段，不得输出 allowed / approved / unblocked。
  - [ ] 定义诊断隔离：无关 governed project diagnostics 不得污染本次 action-guide result_status；跨项目诊断只作为召回/影响判断提示或 next_queries。
  - [ ] 完成方案审查：至少包含 AI 价值审查、规范审查和 Code 可实现性/交互密度审查，并由主控记录处理结论。
source: |
  来源 Spark：`ldvh-base/sparks/spark-0035-knowledge-map-proactive-alerting-gap.yaml`。

  Human 明确要求推动下一步：先建立 WorkCase，再安排审查；审查必须包含 AI 价值审查和规范审查。随后补充要求增加 Code 角度审查：确认行动指南到底能不能实现，以及“AI 每次行动时给出所需信息”是否会过于密集、啰嗦或影响执行节奏。前序讨论已确认：行动指南成立后 knowledge-map 应删除为独立工具/入口/active 能力名；行动指南必须在前面收敛出的行动指南要求及既有知识地图能力基础上补充加强，不能违背或弱化；行动指南默认应纳入 active specs 和所有管辖项目事实源作为可查询/可召回范围。
