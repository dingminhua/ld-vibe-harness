  conclusion: changes_required
  feedback:
  - F1（blocker）item-04 形态越授权包：一等化操作若新增 console 入口或改 pyproject 超出当前授权，需预先收窄为 Helper 公开操作并将 specs/05（及必要时 04）与 code/ldvh/helper 补入授权包
  - F2（blocker）criterion-measured-scope 与一等化冲突：提交链路禁全库扫描与一等化入口需全库扫描并存时边界不清，须改写为提交链路不引入全库扫描（import 边界测试机械判定）、全库扫描只存于独立一等化入口
  - F3（major）事实写回未入授权包：spark-0022/0039 写回需显式 authorized_action
  - F4（major）staged 读取分层：暂存 blob 应按 Index oid（事件自身 GIT_INDEX_FILE）读取，validator 保持纯函数，复用边界钉住 carriers+validate_fact_object+身份核对+指纹+预算，不整体复用 read_fact_object（其读工作树）
  - F5（major）staged 状态分类缺失：触发应收窄为有暂存内容，删除/改名/非法 object_id 需测试向量
