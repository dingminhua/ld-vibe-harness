kind: spec
id: SPEC-CODE-DETERMINISM
title: "Code determinism"
status: active
authority:
  layer: rule_authority
  can_authorize_actions: true
  notes: "Machine-readable projection of specs/core/code-determinism.md."
source_refs:
  - path: specs/core/code-determinism.md
    role: authority
  - path: specs/core/spec-system.md
    role: authority
  - path: ../ld-vibe-harness/specs/04-Code确定性执行规范.md
    role: evidence
relations:
  - type: consumes
    target: SPEC-FORMATTED-SOURCE
    note: "Deterministic Code consumes formatted sources and schemas."
  - type: produces
    target: ACTION-GUIDE
    note: "Deterministic Code may produce task-scoped action guides."
read_plan:
  - order: 1
    target: specs/core/code-determinism.md
    reason: "Read the Markdown core authority first."
  - order: 2
    target: specs/core/code-determinism.yaml
    reason: "Read the authorized machine projection before compiler work."
  - order: 3
    target: specs/schemas/formatted-source.schema.yaml
    reason: "Confirm the source contract before implementing parsers."
  - order: 4
    target: specs/schemas/action-guide.schema.yaml
    reason: "Confirm the navigation output contract before projecting action guides."
impact_judgment:
  - "Changing deterministic input rules changes what Code may parse or trust."
  - "Changing output boundaries changes what AI may treat as navigation, diagnostics, or stop signals."
  - "Changing write boundaries may affect Runtime, hooks, and Human Gate behavior and requires separate confirmation."
stop_conditions:
  - "Stop when a required input lacks source_refs."
  - "Stop when a rule requires natural-language inference instead of explicit fields or enums."
  - "Stop before changing Runtime, hook, dispatcher, or write/commit strategy without separate confirmation."
  - "Stop when a candidate source is used as an active authority."
next_queries:
  - "Which schema defines the source fields consumed by this Code path?"
  - "Which tests cover valid, invalid, candidate, and deprecated inputs?"
  - "Which action guide fields are generated and which are stable facts?"
action_hints:
  - "Prefer schema-first parsing, explicit enums, and source_refs over prose inference."
  - "Treat generated read plans, impact judgments, and checklists as derived outputs, not hand-written facts."
deterministic_inputs:
  allowed:
    - formatted_source_files
    - specs_authorized_schemas
    - explicit_cli_arguments
    - explicit_runtime_payloads
    - filesystem_paths
    - git_identity_and_branch_facts
    - object_status_fields
    - closed_enum_fields
  not_allowed:
    - unstated_user_intent
    - conversational_memory_as_authority
    - inferred_human_gate_approval
    - candidate_rules_as_active_authority
deterministic_outputs:
  allowed:
    - validation_results
    - diagnostics
    - derived_indexes
    - task_scoped_action_guides
    - read_plans
    - impact_judgments
    - stop_conditions
    - next_queries
  not_allowed:
    - fact_source_replacements
    - human_gate_approval
    - hidden_write_authorization
    - allowed
    - approved
    - unblocked
implementation_rules:
  - id: explicit-source-first
    rule: "Every trusted output must be derived from explicit files, schemas, CLI arguments, payloads, Git facts, or closed enum fields."
  - id: source-refs-required
    rule: "Every action-relevant read, stop, impact, or next-query item must remain back-referenceable to a source_ref."
  - id: no-second-fact-source
    rule: "Generated indexes, action guides, checklists, and diagnostics must not become stable facts unless a separate rule authority promotes them."
  - id: generated-over-copied
    rule: "Repeatable checklists, read routes, and impact views should be generated from schemas and tests instead of copied as parallel prose."
  - id: no-implicit-write
    rule: "Parsing, validation, projection, and diagnostics are read-only unless a separate write authority and Human Gate explicitly apply."
  - id: runtime-separate-confirmation
    rule: "Runtime, hook, dispatcher, and commit/write strategy changes require separate confirmation outside this parent spec."
migration_notes:
  legacy_source: "../ld-vibe-harness/specs/04-Code确定性执行规范.md"
  summary: "This YAML file is an authorized machine-readable projection of the Markdown core spec. It does not copy v2 prose, command tables, knowledge-map tables, or checklists."
