title: 无环境 Hook 下的 LDVH 自约束运行
intent: 保留无环境 Hook 时 Agent 能否稳定发现、遵守、验证并交还 LDVH 约束的问题，避免把 Agent.md 等规则文档存在、一次自觉执行或 Helper 可用误作自动注入、阻断与审计已经成立。后续需判断主动约束的最低可靠链路、失效面和可接受边界。
status: open
priority: P2
summary: "**当前架构与问题边界**\n\n- `adr-0006` 已把环境接入排他地确定为单一薄 Skill：只作身份、规则引导和行动模板路由；过程机械检查保持必须，Git Gate 只在实际触发它的 worktree Git 事件中承担最后把关。环境 Hook、插件与 adapter 已退出接入面且没有可选 guardrail，MCP 当前不做；只有已列重估触发条件出现时才另行评估并新建 ADR。\n- 因此，本 Spark 不再研究“由 Rules 模拟 Hook”或哪些场景必须恢复环境 Hook；当前问题收敛为：在唯一薄 Skill、过程检查与 worktree 级 Git Gate 的既定架构内，模型内主动路由、规则消费、停止边界和缺口交还能否在代表性场景中稳定成立。与 `adr-0006` 的关系只表示主题和判断依据相关，不表示该证据问题已经承接或关闭。\n\n**已形成的有限证据**\n\n- 2026-07-30 的 Kimi Work 已按真实新对话和行为事件回查形成环境特定证据：首轮显式提及时薄路由全链路成立，大白话自动选中为 0/2、仓库信号兜底为 2/2；修正中文别名与项目 ID 发现指引后，同法复测大白话自动选中为 2/2，三组答案正确且零写入。该结果只覆盖当时环境、版本、部署件和测试方法，不能外推到其它环境。\n- 当前 Codex 任务实际观察到 `SessionStart/compact` 规则交付 `outcome=ok`、`facts=not_requested`；在 Human 已显式提出 LDVH 任务、人工定位隔离 worktree 后，Helper 精确读取与受控链路可以运行。这只证明本次显式上下文中的有限路径，不证明新部署 Skill 已由独立 cold start 加载、被大白话隐式选中、自动随 worktree 切换或具有模型外阻断力。\n- 当前环境仍保留 legacy 插件状态与既有会话上下文，本 WorkCase 又明确不清理该实例；因此现有递达观察存在归因混淆，不能把它写成新部署薄 Skill 独立生效或长期稳定的证据。\n- 2026-08-01 WorkBuddy 5.3.5（macOS arm64，观察窗口 13:30–13:50 GMT+8，当时 HEAD af562cd51）接入验收形成第二环境证据，并经 Kimi 侧逐项独立复核（版本锚、部署件哈希、操作数、hook 载体、CLI stdin 行为）属实：helper-cli 19 项公开操作与模板读取全 ok；薄 Skill 静态部署逐字节一致（4724 B、sha256 965691…03ab31、无 disable 字段，WorkBuddy 技能加载机制硬证据支持逐字节部署即启用态），当场显式解析递达成立，但 description 驱动的自动路由未验证；doctor ready（5 接入面、4 检查 passed）；git-commit-msg-gate 的 block 路径经真实 commit-msg 事件验证（header_invalid、exit 1、HEAD/index 未变），allow 路径未经真实事件；skill-icons 在该环境为 unsupported 且有肯定依据（技能登记字段集无 icon，视觉标识为 generateColorFromName(name)）；work-context-core 与 context-recovery 因无原生 SessionStart 事件证据保持 unverified，未写成 unsupported。\n\n**未完成证据矩阵与保持 open 的理由**\n\n- 冷启动归因仍未验证：WorkBuddy 验收会话启动于部署之前且上下文已 hydrate，显式递达不证明 description 驱动命中；其给出的复跑方法为全新会话（工作区 poker_hud_projects）提一个落入 LDVH 领域但不提 LDVH/技能/CLI 的问题（如「这个项目有哪些还没关的工作项？」），观察是否自主走 ldvh 技能并出现可回指的 ldvh call 请求与 JSON 结果。delegation/SubagentStart、自动 worktree 或 clone 切换、无历史上下文的恢复与 compact 行为同样未验证；WorkBuddy 未发现 SessionStart hooks 配置，work-context 原生事件保持 unverified。\n- 写入负面路径矩阵部分进展：WorkBuddy 真实 commit-msg 事件已验证 block（header_invalid、exit 1、HEAD/index 未变）；allow 路径真实事件、Skill/Helper 不可用时的诚实失败、真实直接写入、写后审计停止、Human Gate/Stop 遵守与绕过边界仍缺；机械检查也不能判断 Schema 合法内容的语义真实性。\n- 上述范围仍直接决定本 Spark 的核心问题，现有证据不足以支持终态，故保持 `open`、`P2`。只有代表性目标环境形成可归因的冷启动、隐式路由、委派/恢复/worktree、写入负面路径和真实 Gate 矩阵后，才能重新评估关闭；未验证项不恢复 Hook、插件或 adapter 为候选形态。"
