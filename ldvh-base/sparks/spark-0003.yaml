title: 环境安装、配置拓扑与 doctor/bootstrap
intent: 保留目标环境中安装、配置、验证与停用如何形成可诊断责任链的问题，避免把某项能力资产存在、一次有限安装、doctor 通过或触发成功误作跨环境安装闭环。后续需判断每个目标环境的配置位置、前置条件、验证边界、故障定位和 Human 决定分别由谁承接。
status: open
priority: P2
