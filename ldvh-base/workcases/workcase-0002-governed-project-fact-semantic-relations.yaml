        - 不修改文件
      context_digest: Code 方案可行；已有字段映射和 relation_type_counts，但关系质量诊断和 entry 层语义边摘要仍需实现和测试。
      result:
        status: pass_with_followups
        summary: |
          Code 执行方案总体可行，当前实现已有事实对象字段到关系类型的投影基础，也已有 `impact_summary.relation_type_counts`。执行前需收紧诊断为保守、可机械判断的规则，并保持 entry 层渐进读取。
        key_findings:
        - 当前已有 `related_* -> related`、`source_* -> derives_from`、`input_refs/depends_on/blocked_by -> consumes`、`evidence_refs/verification_refs -> validates`、`resolved_to -> impacts` 的投影基础。
        - "`impact_summary.relation_type_counts` 只统计当前投影层边；entry 层会隐藏部分事实对象语义边。"
        - 关系质量诊断尚未实现，需要测试夹具和明确判定规则。
        - 事实对象 edge 的项目维度应作为 Code follow-up 覆盖。
        required_changes:
        - 不新增未登记顶层 `semantic_relation_counts`；优先复用或扩展 `impact_summary`，新增子字段时同步 04.Att.06 和测试。
        - 关系质量诊断必须限定为确定性规则，不根据标题相似、自然语言含义或 AI 判断推断关系。
        - entry 层只做摘要或提示，不把全量 `consumes`、`validates`、`impacts` 边塞回 entry。
        - 增加关系质量诊断正反例、entry 层语义边摘要、neighbors 层语义边可见性和边级项目维度测试。
        recommendations:
        - 诊断等级先设为 `info` 或可配置 warning，避免把历史弱关联立即变成阻断。
        - "`impact_summary.relation_type_counts` 保持当前投影边计数，另加可展开语义边摘要更清楚。"
        evidence_refs:
        - code/spec_checks/knowledge_map.py
        - code/spec_checks/v2.py
        - tests/code/specs_validate_checks/test_v2.py
        - specs/04-Code确定性执行规范.md
        - specs/attachments/04.Att.06-知识地图投影Schema表.md
      raw_output_ref: null
      attested_at: '2026-06-24T08:52:00+08:00'
      attestation:
        signer: Halley
        statement: 基于 prompt context 和 input refs 完成只读 Code 诊断实现审核并对结论负责。
