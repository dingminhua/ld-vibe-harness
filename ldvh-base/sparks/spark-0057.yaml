title: 跨平台变更传播与再验证纪律
status: open
priority: P2
intent: 保留议题：LDVH 走向 mac+Windows 双平台支持后，任一平台侧改动触及平台相关面（入口 launcher、路径与大小写处理、Git Hook、锁与 fsync、原子写、换行与 stdin JSON）时，另一侧平台的"已验证"声明即对该 revision 过期；当前规范（09 §6.3）只有静态平台验证声明，缺少"修订漂移使跨平台验证失效、必须范围匹配重验或回退 unverified"的触发规则。后续需判断：规则落点（09 环境接入的平台声明生命周期，还是 07 Code 平台相关面工程约束）、平台相关面清单如何界定、重验范围如何按改动面分级、以及该纪律如何进入 spark-0004 的验收矩阵。若不跨行动保留，双平台并行开发后会出现平台声明与现实漂移且无法定位责任面。
summary: "**背景**\n\n- 双平台方向已定：spark-0004 已记录「Windows 工作放到 Windows 上做」；workcase-0060（已 closed/completed）将撞号处置程序落为 05 §9.4。\n\n**已有答案的三层（本次讨论结论）**\n\n- 代码同步不需要新机制：Git 即同步层，两侧同为仓库 clone，改动经 push/pull 传播。\n- 平台差异必须活在同一份代码里（平台条件分支/抽象层）：分叉成 mac 版与 Windows 版两套实现才需要\"同步修改\"，不分叉只需\"同步拉取\"。\n- 事实对象层的跨 clone 冲突已由 05 §9.4 覆盖，不重复。\n\n**真实缺口**\n\n- 修订漂移的再验证触发：09 §6.3 只有\"当前已验证平台为 macOS\"的静态声明，没有\"改动触及平台相关面时另一侧验证声明失效、须重验或回退 unverified\"的条款。\n\n**候选方向**\n\n- 规则落点：09（环境接入的平台声明生命周期）或 07（Code 平台相关面工程约束），需按 01 §13 判断归口。\n- 平台相关面初始清单：入口 launcher、路径/大小写处理、Git Hook 部署与触发、锁与 fsync、原子写、换行与 stdin JSON。\n- spark-0004 的验收矩阵应新增\"变更传播后重验\"验收面。\n\n**边界**\n\n- 本议题不含跨 clone 事实身份冲突（已由 05 §9.4 承接）；不预设需要新机械入口——代码同步本身是 Git 职责。"
