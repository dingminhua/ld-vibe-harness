  goal: 按 Human 确认的批次逐文本单元送审并收敛范围内术语表述。
  expected_result: 每个实际修改的段落、标题、帮助字符串或诊断文字均有 Human 确认的修改前后对照，且只修改已批准单元。
  depends_on:
  - item-01
