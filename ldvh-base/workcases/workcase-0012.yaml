title: 移除事实对象 supersedes 关系与 superseded 状态
status: closed
summary: workcase-0012 已完成并关闭。plan_version 2 的三个 work item 均已完成，四项成功标准均有满足依据；独立结果审核已通过，Human 已批准关闭 result_version 1。既有批准事件身份、关闭结论与已终止责任均保持不变。
goal: 在不改变规范模型自身的 supersedes 关系和 WorkCase 审核历史结构的前提下，按 ADR-0001 的来源先行顺序，审计并收束已经发生的事实对象 supersedes 关系与 ADR/Pitfall superseded 状态清理，使当前 Specs、Code、Helper、Web、测试和机械覆盖目录一致，并形成可验证结果。
scope: 覆盖事实模型及类型规则 specs/05、20、21、22、23、24，行动模板 specs/31、32，机械目录 specs/attachments/05.Att.02；核对 code/ldvh/facts/contracts.py、validation.py、transitions.py、relations.py 和事实创建、读取、候选、更新相关 Helper 路径；核对 Web 中当前事实生命周期的状态词汇、过滤和列表/详情展示，包括历史实际触及的 dashboard、workcaseStatus、ObjectStatusFilter、ObjectDetail、locales 及对应文档和测试，但不扩大到无关通用 UI 兼容。历史审计输入包括提交 f1645554c、7ba29c6d7、7d2dd25aa 以及当前 05.Att.02 测试引用修正；既有实现只有经 plan_version 2 重新审计后才能作为当前结果沿用。明确排除 Specs 规范模型自身的 supersedes（Specs 01 与 code/ldvh/specs/*）、WorkCase audit 的 superseded_plan/superseded_result、证明旧事实值会被拒绝的负向测试和“不得出现 superseded”的规范说明、当前工作树中 Pitfall 及其它 Spark/ADR/WorkCase 的无关变更、新增关系类型，以及把普通字符串零命中作为完成证明。
workcase_profile: control-contract-v2
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 当前事实对象规则不再定义 supersedes relation_key，也不再把 superseded 作为 ADR、Pitfall、WorkCase 等当前事实状态或关闭结果；规范模型关系、WorkCase audit 字段、负向测试和禁止性说明等不同语义域的合法名称仍被保留。
- criterion_id: criterion-02
  statement: Code、Helper 和 Web 的当前事实生命周期行为与规则一致；旧事实输入被明确拒绝，Web 不把已移除状态作为当前事实筛选或展示选项，无关通用兼容不被误删。
- criterion_id: criterion-03
  statement: 05.Att.02 指向真实存在且覆盖相应机械责任的测试；相关 Python Specs、facts、Helper 与 Web 合约测试通过，并据实记录未运行或未覆盖范围。
- criterion_id: criterion-04
  statement: 结果包逐项区分历史实现、plan_version 2 获批后的实际审计、保留或修正、无关 Working Tree 差异和未验证范围，不把历史提交或旧测试声明冒充本计划的执行结果。
phase: closed
plan_version: 2
work_items:
- item_id: item-01
  goal: 审计当前规则源、三个历史提交、当前 Working Tree 和 supersedes/superseded 的语义域边界。
  expected_result: 形成可回指的规则、实现、测试和合法残留映射，明确历史修改、当前偏差、无关并行差异以及来源是否充分，不修改实现。
  approach_summary: 只读核对当前规则、f1645554c、7ba29c6d7、7d2dd25aa 和 Working Tree；区分事实生命周期、规范模型关系、WorkCase audit、负向证明与通用 UI 兼容，不用字符串零命中替代语义审计。
  status: completed
  result_summary: 审计完成。来源已充分，无规则缺口。事实生命周期 supersedes/superseded 已在 specs/05、20、22、23、24、31、32 和 05.Att.02 中全部移除；合法残留（规范模型关系、WorkCase audit、Study 禁止性说明、负向测试）有明确规则依据和边界。
- item_id: item-02
  goal: 根据 item-01 的来源审计结论，收束事实生命周期相关来源和实现。
  expected_result: 若存在规则或授权附件缺口，最小充分来源修正先完成独立复核；若来源已经充分，则保留其依据并直接核对实现。之后 Code、Helper、Web 和测试仅作范围内必要保留或最小修正。
  depends_on:
  - item-01
  approach_summary: 以 ADR-0001 为顺序约束；只有实际发现来源缺口时才先修改 Specs 并独立复核，来源充分时不制造规范变更。所有实现动作回指已确认规则并保护明确排除的合法名称和无关差异。
  status: completed
  result_summary: 来源充分分支。Code 事实生命周期核心（contracts/relations/transitions/validation）与规则一致，无 supersedes/superseded 残留。Web 端 6 个文件中的死代码残留已清理，清理结果已提交 d0528a610。合法 WorkCase audit 校验保留不变。
- item_id: item-03
  goal: 运行范围匹配验证、回读实际差异并形成当前结果包。
  expected_result: Specs、Python facts/Helper、Web 合约和机械目录引用得到范围匹配验证；成功标准逐项形成结果，历史输入、本计划实际执行和未验证范围可区分。
  depends_on:
  - item-02
  approach_summary: 运行真实测试入口并核对 05.Att.02 引用目标；回读实际 Working Tree，披露未运行、不可用和范围外内容，不以 grep 零命中、历史提交说明或旧测试结果代替当前验证。
  status: completed
  result_summary: 45 个核心测试全部通过（test_fact_object_operation/transitions/validation）；旧 superseded 值拒绝负向测试通过。后续更正审核又确认 Web TypeScript 检查通过且 33 项 Web 测试通过。结果包已区分历史提交（f1645554c/7ba29c6d7/7d2dd25aa）与本计划产出（d0528a610）。
