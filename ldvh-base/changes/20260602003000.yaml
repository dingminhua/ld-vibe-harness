type: change
title: 取消 specs 文档内章节索引固定骨架要求
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  specs 文档内章节索引由人工维护，容易与 Markdown 原文标题、章节编号和正文结构不同步。当前 AI 读取策略已经以 Markdown 标题搜索、机器生成章节索引和原文行范围读取为主，文档内章节索引不应继续作为固定骨架或定位依赖。
decision: |
  修改 03，将正式规范文档的固定骨架从要求文档内章节索引，调整为不得依赖文档内章节索引；章节定位依据 Markdown 标题搜索、机器生成章节索引和原文行范围读取。
  修改 03.01，将“文档内章节索引关系”调整为“Markdown 章节定位关系”，明确 Markdown 原文标题是章节事实源，机器生成章节索引只作定位和诊断辅助，不替代 specs 原文。
  修改 04，取消主文档和子文档必须提供章节索引的表述，改为遵守 03 的章节编号、标题层级和章节定位要求。
  修改 14，移除读取策略中读取文档内章节索引的步骤，明确 Grep 是主路径，机器索引是补充路径。
  同步更新 L0/L1/L2 Rules 摘要，改为强调 Markdown 标题搜索、行范围原文读取和 03.01 辅助定位。
consequences: |
  - 新增或重构 specs 文档时不再需要维护文档内章节索引；
  - AI 和 Tools 的章节定位统一回到 Markdown 原文标题、章节编号、来源行号和机器生成索引；
  - 已存在的文档内章节索引不再作为规范判断依据，可在后续文档重构时清理；
  - 规范判断仍必须读取 specs 原文，索引不得成为独立事实源。
affects:
  - specs/03-Specs文档规范.md
  - specs/03.01-Specs文档索引规范.md
  - specs/04-LDVH模型子文档规范.md
  - specs/14-LDVH行动模型基础规范.md
  - ../.trae/rules/ldvh-l0-rules.md
  - .trae/rules/ldvh-l1-rules.md
  - .trae/rules/ldvh-l2-specs-rules.md
related_rules:
  - specs/03-Specs文档规范.md
  - specs/03.01-Specs文档索引规范.md
  - specs/04-LDVH模型子文档规范.md
  - specs/14-LDVH行动模型基础规范.md
human_gate:
  required: true
  reason: 本次改变 specs 文档骨架要求；用户已明确指示“文档内章节索引不存在，就不要写可选了，其他按你意思执行”。
validation: |
  python3 tools/check_03_specs_doc_standard.py 通过。
  python3 tools/check_03_specs_references.py 通过。
  文本一致性检查确认 L0/L1/L2 Rules 不再保留旧的 specs 索引入口摘要。
