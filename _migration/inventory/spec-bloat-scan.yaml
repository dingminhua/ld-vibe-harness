scan_id: v2-spec-bloat-scan-001
status: temporary_migration_evidence
scope: "v2 specs/*.md body specs"
purpose: >
  Explore the original question: whether v2 specs contain repeated or
  non-essential information that could be abstracted, generated, or projected
  without changing the original Markdown source authority.

source_of_truth:
  - "../ld-vibe-harness/specs/*.md"

scanner:
  path: "_migration/code/spec_bloat_scan.py"
  mode: "temporary prototype"
  method:
    - "Normalize H2 headings by removing numeric prefixes."
    - "Count repeated H2 headings across body specs."
    - "Count selected repeated boundary terms."
    - "Detect shared H2 skeletons for fact model member specs and action member specs."

high_level_result:
  body_specs_scanned: 21
  finding: "The repetition is structural, not random."
  summary: >
    v2 specs have a stable Markdown format that Code can parse, but they also
    repeat governance skeletons, boundary language, Human Gate reminders,
    fact-source boundaries, and member templates. Some repetition is useful as
    local readability; some can become parent rules, generated Action Guide
    stop conditions, or Code checks.

repeated_h2_evidence:
  universal_sections:
    - heading: "本文解决的问题"
      file_count: 21
      classification: "keep_as_local_summary"
      note: "Useful for human reading and action guide summaries."
    - heading: "规范保障要求"
      file_count: 21
      classification: "candidate_for_parent_rule_plus_local_delta"
      note: "Likely bloated if every spec repeats generic assurance rules."
    - heading: "Human Gate"
      file_count: 21
      classification: "candidate_for_parent_rule_plus_generated_stop_conditions"
      note: "Local gates are useful, but generic gate doctrine should be inherited/projected."
    - heading: "待补齐事项"
      file_count: 21
      classification: "candidate_for_structured_extraction"
      note: "Could feed Action Guide next_queries or diagnostics."
    - heading: "上位依据"
      file_count: 20
      classification: "keep_as_parseable_relation_section"
      note: "Important for source_refs and read_plan generation."
    - heading: "构成要素归属与价值判断"
      file_count: 20
      classification: "candidate_for_identity_block_plus_delta"
      note: "Generic value doctrine should inherit from 00; local value deltas may remain."

family_skeletons:
  fact_model_members_20_24:
    files: ["20", "21", "22", "23", "24"]
    shared_sections:
      - "本文解决的问题"
      - "上位依据"
      - "构成要素归属与价值判断"
      - "对象定位与准入条件"
      - "事实源边界"
      - "状态机"
      - "对象关系"
      - "Human Gate"
      - "字段契约"
      - "事实实例写入、回写、验证和证据留存"
      - "Code、Web、知识地图和运行时扩展消费边界"
    likely_action: >
      Treat the shared skeleton as a member-template contract owned by 02.
      Child specs should keep object-specific state, fields, relations, gates,
      and exceptions. Repeated generic instructions can be projected by Code.

  action_members_30_31_32_34_35_36:
    files: ["30", "31", "32", "34", "35", "36"]
    shared_sections_count: 19
    shared_sections:
      - "本文解决的问题"
      - "上位依据"
      - "构成要素归属与价值判断"
      - "行动定位与适用场景"
      - "准入条件"
      - "事实源边界"
      - "Context 要求"
      - "Scenario 识别"
      - "执行流程"
      - "执行中问题分流与失败暂停"
      - "Human Gate"
      - "Skill 和 Agent 调度"
      - "Code、命令和 Web 协作适配"
      - "事实源回写与证据留存"
      - "环境适配边界"
      - "行动特有可测试性锚点"
      - "规范保障要求"
      - "行动编排成员检查要求"
      - "待补齐事项"
    likely_action: >
      Treat the shared skeleton as a member-template contract owned by 03.
      Child action specs should keep scenario/context/gate/execution deltas.
      Action Guide can project read_plan, stop_conditions, tool suggestions,
      and next_queries from these anchors.

cross_cutting_term_evidence:
  fact_source_boundary:
    term: "事实源边界"
    files: 21
    total_count: 169
    likely_action: "Move global doctrine to 07/parent rules; keep local fact-source exceptions."
  human_gate:
    term: "Human Gate"
    files: 21
    total_count: 464
    likely_action: "Separate universal Human Gate doctrine from local gate triggers; generate repeated stop conditions."
  code:
    term: "Code"
    files: 21
    total_count: 909
    likely_action: "Avoid repeating generic Code consumption doctrine; use identity code_consumption and generated diagnostics."
  knowledge_map:
    term: "知识地图"
    files: 16
    total_count: 282
    likely_action: "Map legacy wording to Action Guide carefully; do not global-search replace."
  negative_rules:
    term: "不得"
    files: 21
    total_count: 532
    likely_action: "Classify into global prohibitions, local prohibitions, and generated stop conditions."
  non_definition_rules:
    term: "不定义"
    files: 21
    total_count: 66
    likely_action: "Often useful local boundary, but global patterns can be inherited."

preliminary_reduction_strategy:
  - "Keep Markdown specs as the source of authority."
  - "Keep repeated H2 skeletons when they help stable Code parsing."
  - "Do not remove local sections blindly; distinguish local deltas from repeated doctrine."
  - "Move or reference generic doctrine from parent specs instead of repeating it in every child."
  - "Let Action Guide generation project repeated read plans, stop conditions, next queries, and tool suggestions."
  - "Let Code checks cover repeated identity, attachment, status, and member-template conformance."

next_review_targets:
  - target: "03 action member skeleton"
    reason: "The 30/31/32/34/35/36 action specs share an exact 19-section skeleton."
  - target: "02 fact model member skeleton"
    reason: "The 20-24 fact specs share a high-overlap object/member skeleton."
  - target: "Human Gate repetition"
    reason: "Appears in all files with very high count; likely split into parent doctrine plus local triggers."
  - target: "知识地图 wording"
    reason: "Legacy concept appears broadly; must be mapped to Action Guide without rewriting all specs."

stop_conditions:
  - "Do not treat this temporary scan as authority to delete spec content."
  - "Stop before changing v2 specs; this scan only identifies candidates."
  - "Stop if a proposed reduction would remove local boundary, gate, or fact-source deltas."
  - "Stop if reduction would make Markdown less parseable by Code."
