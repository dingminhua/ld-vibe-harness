  confirmation_context: 用户要求按新规范对齐重构 21-ADR 主规范。
validation: |
  1. 已按上位规范复核重构范围，未整体重写稳定对象模型规则。
  2. 已补充 ADR 未落地、部分落地和状态不一致时重新执行落地前决策的要求。
  3. 已执行 `python3 -m pytest tests/tools/test_adr_index.py`，结果为 8 passed。
  4. 已执行 `python3 -m py_compile tools/adr_index.py`，结果通过。
