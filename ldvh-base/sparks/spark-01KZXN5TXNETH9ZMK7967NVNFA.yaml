title: 全事实对象与工作状态的 Web 可观察表达
intent: 保留 Web 在完整读取事实对象后如何让 Human 扫描摘要、状态、证据、关系、长文本、演变和待决事项的问题，避免把原始 YAML 平铺、视觉效果、颜色或摘要误作事实语义、证据或状态推断。后续需逐类形成阅读顺序与部分/无效内容诊断。
status: implemented
summary: "**当前结论**\n\n- Web 已为当前定义的事实类型建立类型化 Human 阅读投影：共同身份、状态、摘要、来源、证据与关系保持字段分工；Spark、ADR、Pitfall、Study、WorkCase 和 FileAsset 的专属正文、条件字段与处置内容按各自来源呈现，而不是平铺原始 YAML。\n- WorkCase 的计划、工作项、依赖、阻塞、审核、批准、成功标准、结果和关闭判断具有独立阅读顺序；其它类型的意图、决定、经验、报告、演变、长文本与附件元数据也由各自区段承接。\n- Markdown 层次、关系目标名称、长文本排版以及 invalid、missing、partial、error 等诊断边界已有实现和契约验证；界面不补写缺失语义、不按颜色或布局推断状态，也不把派生卡片升级为事实权威。\n\n**处置边界**\n\n本结论结束原 Spark 关于“完整对象读到后如何让 Human 理解”的范围；未来新增事实字段、类型或具体可用性改进仍须按当时来源和实际缺口另行判断。"
evolution:
