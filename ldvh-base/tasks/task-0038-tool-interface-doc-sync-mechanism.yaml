title: 工具接口变更与规范同步机制
status: planned
created: '2026-06-05T21:48:59.368187'
updated: '2026-06-05T21:50:00'
description: |
  建立"工具接口变更必须同步规范"的机制，确保代码与规范不脱节。

  核心问题：工具接口（PyTools CLI、Web API、事实对象字段契约）不是普通代码细节，而是可被人和 AI 依赖的契约。当前修改工具接口后，对应规范文档不会自动更新，导致规范与实现脱节。

  机制设计：

  1. 区分三种文档关系：
     - related_docs：任务参考的输入文档
     - affected_docs：任务完成后需要同步更新的文档
     - deliverables：任务产出的结果物

  2. 建立接口规范锚点映射：
     - PyTools CLI → specs/06-Python与Web工具规范.md
     - 事实对象字段 → 对应对象规范（如 specs/27-Task-任务.md）
     - Web API → Web API 规范或页面设计文档
     - Web 展示 → web/docs/ 对应页面文档

  3. 任务关闭时做接口契约同步检查：
     - affected_docs 中的文档是否有变更
     - 无变更需在 closure_evidence 中说明豁免理由
     - 工具接口类 Task 的 acceptance 模板自动包含规范同步检查项

  4. 三类接口变更的检查清单：
     - PyTools：规范已同步、示例命令已更新、validator 已覆盖
     - Web API：路由已更新、前端已同步、返回结构有文档、错误码有说明
     - 事实字段：对象规范已更新、fact_cli 已支持、fact_validate 已支持、Web 已展示、老实例迁移策略已说明
