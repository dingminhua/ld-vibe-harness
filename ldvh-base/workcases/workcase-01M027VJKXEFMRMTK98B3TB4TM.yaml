- criterion_id: criterion-config-hard-cutover
  outcome: satisfied
  summary: 根 product_name 已硬切换为 governance_instance_name，product_description 保持用途说明；Python、全部配置 fixtures、外部配置和限定 Web reader 完成迁移。old-only、混合、unknown 均拒绝，三项目身份/路径/common-dir 与注释头等价。
