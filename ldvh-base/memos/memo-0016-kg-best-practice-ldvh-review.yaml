description: |
  原有讨论已提炼为 Study `study-0006`。
  Study 只承载完整评估报告，不替代本 Memo 的讨论入口。
  本 Memo 继续保留后续收敛入口：先用 Study 复读完整评估报告，再判断是否以 WorkPlan 推进 P1/P2 落地动作。

  研究结论同步：LDVH 已具备图谱化输入条件，下一阶段应优先补齐关系语义标准、关系一致性校验和图查询闭环。

  2026-06-20 追评结论：方向可行，但落地边界必须从“持久化知识图谱资产”收敛为“实时图谱投影视图”。
  图节点、边、元数据和校验结果只能在 CLI/API 调用时从当前 code、specs、ldvh-base 和 Git 工作区即时扫描生成；
  不得落盘维护 entities.json、edges.json、graph-metadata.json，不得引入外部图数据库作为事实缓存，不得依赖长期缓存或派生索引作为事实源。

  需要配合的最小动作：
  1. 定义 LDVH 关系语义表，将 workarea、workplans、related_*、source_*、resolved_to、execution_items.input_refs 和 execution_items.evidence_refs 映射为明确边类型；
  2. 增加只读运行时抽取层，按请求读取事实源并返回内存中的 nodes/edges/issues；
  3. 为 fact_cli 和 Web API 增加邻接、反向邻接、收敛链、证据链和图一致性检查入口；
  4. 将图一致性检查接入 WorkPlan 审核和 41/42/43 审核触发，但检查输出只作为当次诊断结果，不作为新事实源保存。

  预期收益：AI 与 Human 可以实时看见 Memo 是否被承接、WorkPlan 依赖哪些输入、旧路径是否仍被引用、规范或代码变更影响哪些对象；
  同时避免派生 JSON、缓存或外部图状态滞后于代码和事实源。
