id: adr-0009
type: adr
title: Memo 三态分流模型
status: accepted
created: '2026-06-17'
updated: '2026-06-17'
date: '2026-06-17'
context: |
  Human 在讨论 Memo 工作对象时指出，Memo 不需要 draft -> active -> resolved -> archived 这种偏生命周期的四态模型。

  Memo 的本质不是一个需要长期推进的工作对象，而是对尚未任务化、尚未决策化、尚未写入正式事实源的信息进行临时承载和分流。它应回答“这条信息是否还需要处理、已经分流到哪里、是否废弃”，而不是回答“它是否活跃”。

  Human Gate 记录：
  - 触发原因：该决策会改变 Memo 的状态机、字段契约、Code 校验、Web 快速创建和既有 Memo 实例。
  - 确认事项：Memo 状态是否收敛为待处理、已分流、已废弃三种。
  - 影响范围：`specs/26-Memo-备忘.md`、`specs/05.01-工作字段内容格式规范.md`、`specs/08-Web信息同步实现规范.md`、`code/fact_validate.py`、`code/fact_cli.py`、Web Memo API、既有 Memo 实例。
  - 确认依据：用户明确表达“只需要三种就可以了：待处理，已分流，已废弃”。
  - Human 决策：接受三态分流模型，并要求创建 ADR 后开始修改。
  - 确认人/时间：Human，2026-06-17
  - 后续动作：同步规范、校验、Web 创建入口、测试和既有 Memo 数据。
  - 回写位置：本 ADR、Memo 规范、字段格式规范、Web 同步规范、Code/Web 实现和 Memo 实例。
  - 残留风险：Memo 分流动作的具体工作流程仍需后续 40-59 工作流程规范承接。
decision: |
  Memo 状态收敛为三态分流模型：

  - `pending`：待处理。表示信息已被捕获，尚未决定是否进入 Task、ADR、Pitfall、docs、规范、Code、Web 或其他事实源。
  - `resolved`：已分流。表示信息已经被吸收到目标事实源，或已明确处理完毕；必须记录 `resolved_to` 和 `resolved_at`。
  - `discarded`：已废弃。表示确认不再需要跟踪或保留为分流入口；必须记录 `discard_reason`。

  合法流转为：

  ```text
  pending -> resolved
  pending -> discarded
  resolved -> discarded
  ```

  Memo 不再使用 `draft`、`active` 或 `archived`。旧 `draft` / `active` 迁移为 `pending`，旧 `archived` 迁移为 `discarded`。

  Memo 的废弃原因字段命名为 `discard_reason`，不再复用 `archive_reason`。`archive_reason` 保留给 WorkArea、Pitfall 等仍存在归档语义的对象。
consequences: |
  积极后果：
  - Memo 的状态与对象定位一致，强调分流而不是执行生命周期。
  - AI 和 Web 创建 Memo 时默认进入 `pending`，降低“草稿是否需要转活跃”的额外判断成本。
  - `discarded` 比 `archived` 更准确表达“这条备忘不再需要处理”的语义。
  - `discard_reason` 避免把废弃和归档混为一谈。

  成本和风险：
  - 现有规范、校验、Web API、测试夹具和 Memo 实例需要同步迁移。
  - Web 状态筛选、默认列表状态和颜色需要适配 `pending` / `discarded`。
  - 旧文件或外部用户若仍使用 `draft`、`active`、`archived`，会被新校验报告为非法状态。

  已接受的迁移规则：
  - `draft` -> `pending`
  - `active` -> `pending`
  - `resolved` -> `resolved`
  - `archived` -> `discarded`
alternatives: |
  替代方案一：保留 draft -> active -> resolved -> archived。该方案与多数工作对象生命周期相似，但对 Memo 过重，会引入不必要的确认阶段。

  替代方案二：只保留 pending / resolved 两态。该方案最简单，但无法表达“确认废弃且无需分流”的稳定结果。

  替代方案三：继续使用 archived 表达废弃。该方案复用既有字段，但会把 Memo 的分流语义和其他对象的归档语义混在一起。
