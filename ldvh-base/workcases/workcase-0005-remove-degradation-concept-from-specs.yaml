        - specs/attachments/
      blocking_reason: null
    - id: item-5
      title: 同步 Rules 入口派生表达
      role: rules
      mode: single
      input_refs:
        - rules/LDVH-WORKSPACE-ENTRY.md
        - rules/LDVH-MAINTAINER-ENTRY.md
        - specs/06-运行时扩展规范.md
