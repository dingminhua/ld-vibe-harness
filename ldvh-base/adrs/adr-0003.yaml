title: 以中文语义理解并执行
status: active
decision_question: AI 在面向 Human 的中文工作中，应如何理解并执行中文目标、交付要求、事实源和规范源；当既有工作流程要求审核时，中文语义应如何进入审核？
decision: 决定 AI 在中文工作中始终以中文语义理解并执行 Human 的目标、边界和要求，特别核对主体、对象、条件、否定、时态、范围、授权与完成含义；不得以字面词、英文映射、字段名、模板惯性或实现习惯静默替代中文原意。当前规则、风险或工作流程已经要求审核时，审核必须增加独立的中文语义核对：审核者独立回读中文原意与当前来源，判断形成内容、判断或行动是否发生语义偏移。原本无需审核的工作不因此新增审核关卡、Human Gate 或授权条件，但执行者仍须保持上述中文语义视角。
applicability: 适用于 LDVH 中 AI 处理 Human 的中文目标、反馈、约束和验收要求，以及形成、修改、审核或消费面向 Human 的中文交付、事实源和规范源时。它不改变代码标识、路径、命令、外部原文或机器字段的精确写法；需要保留这些精确标识时，应在中文语义中正确理解和说明其当前作用。Human 明确指定其它语言、原文优先或特定表达方式时，按该当次要求执行，同时不得误解其中文约束。
rationale: 中文表面字词与实际意图、范围和约束并不总能由英文术语、字段名或既有模板无损替代。若没有持续的中文语义视角，AI 即使形式上完成读取、结构校验或技术执行，也可能把 Human 的决策、事实边界或规范要求理解错误。只有在原本需要审核的场景加入独立核对，才能发现形成者沿用自身解释所遗漏的中文语义偏移，同时不把所有普通工作膨胀为审核流程。
consequences: 采用本决定后，AI 在中文工作中会在行动前后主动检查中文原意是否被保留，必要时以中文重新表述其理解和边界；这会增加少量判断与表达成本。在既有审核场景中，审核结论需要单独说明中文语义是否准确、哪些范围仍不确定或需交还，不得以格式正确、测试通过或复述形成者说明替代独立核对。本决定不取代事实验证、机械校验、正式 Specs 或 Human 授权，也不把普通工作自动变成需要独立审核的工作。
