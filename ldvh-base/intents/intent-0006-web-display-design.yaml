description: '为 LDVH Web 展示层建立统一的设计思想框架，涵盖信息架构、交互模式、视觉规范和组件体系，确保各页面设计一致性和可扩展性。

  当前 Web 展示层已实现 Dashboard、ObjectList、ObjectDetail、Validate、Changelog 五个页面，但缺乏整体设计规划，各页面设计决策分散在实现过程中，需要系统性地梳理和固化。

  '
success_criteria: 'Web 设计规划文档完成编写并通过评审，覆盖信息架构、页面结构、交互规范、视觉体系和组件规范，后续页面开发可据此展开。

  '
constraints: '不脱离现有技术栈（React + Tailwind + Express），不引入新的 UI 框架；设计需兼容侧边栏和顶部导航两种布局。

  '
