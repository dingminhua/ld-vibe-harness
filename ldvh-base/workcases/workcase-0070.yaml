execution_authorization:
  authorized_actions:
  - action_id: authorization-trial-adapter
    summary: 在测试性路径中冻结任务协议，并实现或调整只服务该协议的本地 trial adapter。
    target_scope: 仅 code/ldvh/testing/、code/tests/testing/，以及运行器新建的仓库外 SafeTrialTempRoot。
    effect_scope: 允许修改上述测试性路径；允许在临时根生成任务包、提示卡、记录与范围 manifest；不得修改生产路径、规格、文档、配置、其它事实对象、Git 或网络。
    risk_summary: adapter 或协议实现错误可能使对照不可比、指标失真或路径越界；该动作不证明提示卡收益。
    rollback_summary: 协议、来源绑定、schema 或路径检查失败即停止受影响 item；测试性代码可由后续受控变更修正，运行材料只留在受限临时根。
    rule_refs:
    - 21-WorkCase-工作项.md §6.5
    - 32-事实对象生命周期变更与承接处置行动模板.md §5.3
  - action_id: authorization-local-trials
    summary: 使用冻结协议对当前本地只读 Helper 执行 12 baseline 与 12 candidate 对照 trial。
    target_scope: 仅冻结的 12 个任务、其条件盲评 gold rubric、当前本地 Helper 的只读 allowlist 操作与每次新建的 SafeTrialTempRoot。
    effect_scope: 允许发起 24 次受记录的本地只读 Helper 调用，并只向受限临时根写入原始响应哈希、trial record 与范围 manifest；禁止事实写入、生产契约修改、外部网络、Git 或任务包外调用。
    risk_summary: stochastic 行为、来源漂移、失败或错误白名单可能使结果无效；任何单项 first_legal 改善不等于净收益。
    rollback_summary: 指纹漂移、越权操作、schema/path 失败、gold 盲评失效或记录不完整时中止批次、不形成汇总主张；已存在的受限临时材料仅保留为失败诊断。
    rule_refs:
    - 21-WorkCase-工作项.md §6.5
    - 20-Spark-火花.md §8
  - action_id: authorization-delegate-result-review
    summary: 委派独立只读复核者核对冻结材料、记录与范围证据。
    target_scope: 仅 WorkCase-0070 的协议、临时证据、测试性改动与结果投影。
    effect_scope: 允许一次只读子代理复核；不得授予写入、额外 trial、生产修改、Git、网络或外部操作。
    risk_summary: 复核只提供咨询性结论，不使随机 agent 再运行自动复现相同结果。
    rollback_summary: 复核发现协议、范围或计算缺口时停止关闭准备，按结果版本规则修正或返工；不得掩盖缺口。
    rule_refs:
    - 21-WorkCase-工作项.md §6.5
    - 21-WorkCase-工作项.md §6.6
  - action_id: authorization-result-review
    summary: 执行一次独立只读结果复核，验证证据哈希、来源卡、schema records、统计重算与范围 manifest。
    target_scope: 仅已冻结的 WorkCase-0070 结果投影及其受限临时证据。
    effect_scope: 允许读取和重算，不允许新建或重复 24-trial 批次，不允许写入、Git、网络或生产变更。
    risk_summary: 复核不能证明 stochastic trial 将逐次复现，只能验证当前批次的记录与计算边界。
    rollback_summary: 若证据不可读、哈希不匹配或统计不可重算，结论降为未验证并停止关闭准备。
    rule_refs:
    - 21-WorkCase-工作项.md §6.6
    - 21-WorkCase-工作项.md §6.7
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-delegate-result-review
    result_review_action_id: authorization-result-review
  action_ceiling: 本 WorkCase 最多修改两条测试性路径、构建一个冻结协议适配器、执行一个登记的 24-trial 本地只读批次并产生一个受限临时证据根；不创建或修改其它事实对象，不执行 Git、网络、依赖安装或生产变更。
  prohibited_actions:
  - 生产 Helper 或调用入口修改
  - 能力契约、规格、文档或配置修改
  - 任何事实对象的创建、更新或更正
  - Git 暂存、提交、推送或历史操作
  - 网络访问、依赖安装或外部消息
  - 仓库内、ldvh-base 或非自身临时根的运行产物写入
  - 任务包外 Helper 操作或任何事实写入
  - 未经登记的额外 trial 批次
  allowed_adjustments: 仅可在不改变任务、gold rubric、提示哈希、条件、allowlist、试验数、结果口径或行动上限的前提下修正测试性 adapter 的机械错误，或重试尚未形成有效终态 record 且可证明由 runner 基础设施造成的单一 trial；否则停止、取消受影响 item 并按结果链收敛。
  verification_and_rollback: 每次调用前后验证来源与环境指纹、allowlist、SafeTrialTempRoot 身份和 record schema；批次后重算 records 与范围 manifest，并由独立复核者验证。路径、schema、权限或 comparability 失败立即中止相关批次，不将失败记录汇总为方向性结论；不删除用户既有文件。
  out_of_bounds_handling: 发现任何未授权路径、操作、环境变化、新风险或需要生产/网络/Git/其它事实对象时零写入停止该动作，取消或收敛受影响 item，不在执行期索取扩权。
