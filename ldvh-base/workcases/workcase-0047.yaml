status: closed
title: 建立 WorkCase 关闭候选的只读确定性投影
goal: 以 specs/21 继续作为 WorkCase 关闭语义唯一权威，抽出 proposal 到完整非托管 closed after 的唯一纯映射，供 close-workcase 的期望 after 校验与新的 prepare-closed-workcase-candidate 只读 Helper 操作共同消费；候选操作只从当前 mechanically valid 的 open/human_closure_confirming 快照返回 source fingerprint、可直接提交给 close-workcase 的完整非托管 fact_object candidate 及既有 proposal route target 指纹映射依据，不写入、不生成或改写自然语言、不推断 Human Gate 2 决定、授权或“可关闭”结论，真实关闭继续由 close-workcase 在决定时点重新读取并执行 CAS、target、关系与入向依赖检查。
scope: 覆盖 specs/21-WorkCase-工作项.md 对 prepare-closed-workcase-candidate 的权威只读合同与 close-workcase 共享映射边界；覆盖 specs/attachments/05.Att.02-事实对象机械校验目录.md 的覆盖登记；覆盖 code/plans/workcase-closed-candidate-projection.md 与 code/plans/README.md；覆盖 code/ldvh/facts/workcase_update.py 的共享纯映射、code/ldvh/helper/operations/workcase_close_candidate_request.py、workcase_close_candidate_operation.py 与 operations/__init__.py；覆盖新 candidate request/operation tests、code/tests/facts/test_workcase_application.py、code/tests/helper/test_workcase_write_operation.py、test_workcase_update_request.py、test_cli_process.py、test_service.py、code/tests/specs/test_repository.py、test_fact_mechanical_validation_catalog.py 与 code/tests/packaging/test_distribution_lifecycle.py 的直接合同和回归。排除 00/04/05 规范改写、04.Att.01、Schema/事实字段、Web/API/i18n/docs、行动模板、运行时 Markdown 解析、持久 candidate、自动关闭、其它事实对象（除 workcase-0047 自身生命周期写回）、其它项目、push、PR、发布、外部消息与破坏性 Git。
success_criterion_definitions:
- criterion_id: criterion-authoritative-readonly-contract
  statement: specs/21 明确定义 prepare-closed-workcase-candidate 为 effect=read 的公开操作：输入只含精确 WorkCase fact_ref 与共同管辖定位；成功输出绑定当前 source content fingerprint 的完整非托管 fact_object candidate 及 proposal 已保存的 route target/fingerprint 映射依据；不接受 after、expected fingerprint、authorization reference、Human 决定、route-target 指纹输入或 event time，不产生关闭许可、Gate 2 或可关闭结论。
- criterion_id: criterion-single-pure-close-projection
  statement: code/ldvh/facts/workcase_update.py 形成唯一纯映射函数，从已验证的 human_closure_confirming before 复制终态稳定事实、映射 outcome/disposition/accept-stop residuals/suggestions、去重 routed-to 并保留 contributed-to/has-file-asset/related-to；输出精确为 close-workcase 可提交的完整非托管 fact_object，不含 object_id、fact_type_key、created_at、updated_at、phase、proposal、计划、items、reviews、approval、waiting 或 event time；现有 close mapping validator 与新只读操作都直接消费该函数，不保留第二套映射。
- criterion_id: criterion-readonly-helper-boundary
  statement: prepare-closed-workcase-candidate 只读取当前 mechanically valid、status=open、phase=human_closure_confirming 且含完整 proposal 的 WorkCase；invalid、unavailable、blocked、closed、其它 phase、缺 proposal 或未知/伪造输入均拒绝或不可用并保持零写入；操作不读取或验证 route target 当前状态、不取得写锁、不调用 close-workcase，也不把 mapping basis 表达为 target 当前有效或关闭预检通过。
- criterion_id: criterion-parity-and-negative-matrix
  statement: 测试覆盖 completed、partial/accept_stop、route_existing 去重、suggest_spark 不形成 relation、urls 与 contributed-to/has-file-asset/related-to 保留；覆盖共享映射与 close validator parity、proposal/保留字段 mutation、请求闭集、无写副作用，以及 source 改变后旧 candidate 的 source fingerprint 不能作为真实 close CAS 依据。05.Att.02 只登记该操作对既有 workcase-proposal-atomic-close 规则族的覆盖，不复制 21 的映射或输入输出语义。
- criterion_id: criterion-validation-review-commit-isolation
  statement: 完成 Code Implementation Plan、目标与既有 close/helper/specs/packaging 回归、Ruff check/format、git diff --check、路径白名单、workcase-0047 精确回读、全库事实完整性、既有 dirty 哈希隔离、独立只读结果复核和本地语义提交；若实现需要超出白名单、形成第二语义实现、读取 target 预判可关闭或改变写入口，则取消受影响 item 并按结果链安全收敛。
success_criterion_results:
- criterion_id: criterion-authoritative-readonly-contract
  outcome: satisfied
  summary: specs/21 已把 prepare-closed-workcase-candidate 定义为 effect=read；请求闭集仅含 fact_ref 与共同定位，成功结果绑定 source content fingerprint、完整非托管 candidate 和 proposal-stored route mapping basis，不接收关闭 after、授权、Human 决定或 event time。
- criterion_id: criterion-single-pure-close-projection
  outcome: satisfied
  summary: workcase_update.py 已形成唯一共享 projector；真实 close validator 与只读 Helper 共同消费它，终态字段、accept-stop residual、suggestions、routed-to 去重和需保留 relations 的映射均有 parity/mutation 回归，相同目标冲突 fingerprint 会拒绝而非静默选择。
- criterion_id: criterion-readonly-helper-boundary
  outcome: satisfied
  summary: Helper 只读取当前 WorkCase source，不读取 target、不取协调锁、不调用关闭写入口；合法 Gate2 之外的 phase/status、invalid、缺 proposal、冲突 target fingerprint 与伪造输入均按 rejected/unavailable 零写入处理。
- criterion_id: criterion-parity-and-negative-matrix
  outcome: satisfied
  summary: 授权矩阵覆盖 complete/partial、accept_stop、route_existing 去重与冲突、suggest_spark、urls 和保留 relations、共享 validator parity、请求闭集、source fingerprint 失效边界、capabilities/service/CLI/specs/packaging；05.Att.02 仅登记既有规则族覆盖。
- criterion_id: criterion-validation-review-commit-isolation
  outcome: not_satisfied
  summary: Code Plan、授权矩阵 171 passed、目标 Ruff/format/diff check、事实完整性、dirty 哈希隔离、独立实现复核和本地语义提交均已完成；但全量 code/tests 仍有 21 failures，其中新增公开操作直接暴露白名单外 Doctor operation_count 19→20 固定计数，另 20 项为既有基线失败。未获准修改 Doctor 测试，因此不能宣称该标准完整满足。
result_summary: 已建立 proposal 到 closed 非托管 fact_object 的唯一确定性 projector，并让 close-workcase 校验与新增只读候选 Helper 共同消费；候选绑定刚读取的 source fingerprint 与 proposal-stored mapping basis，不读取 target、不写入、不推断 Gate 2。冲突 route target fingerprint 已改为确定性拒绝。实现与 workcase-0047 已形成隔离的本地语义提交；全量 Doctor 固定计数问题保留为范围外残余。
validation_summary: 授权白名单回归 171 passed；其中共享 projector 与候选 operation 定向复测 102 passed。目标 Ruff check、format check、git diff --check 通过；全库事实完整性 complete（126 对象），既有 dirty 哈希保持不变，提交仅含 18 个授权路径。独立只读实现复核结论 pass。全量 code/tests 为 1465 passed、10 skipped、21 failed：1 项为新增公开 operation 使白名单外 Doctor 固定计数 19→20，另 20 项为既有 WorkCase fixture、diagnostic member_count 与 linked-worktree capture 基线失败；full-v4 首个 code-lint 亦被既有白名单外 Ruff 问题阻断。因此未宣称全量测试或第五项标准通过。
closure_outcome: partial
disposition_summary: 当前 WorkCase 以 partial 停止：关闭候选的共享纯映射、只读 Helper 边界与授权回归已完成；criterion-validation-review-commit-isolation 仍未满足。新增公开 operation 直接触发的 Doctor operation_count 19→20 expectation 更新未在本案授权内完成，作为一项 accept_stop 剩余责任保留；若 Human 接受当前停止，后续必须由新的 WorkCase 与 Gate1 明确授权承接。其余 20 项全量测试失败按既有基线保留在 validation_summary，不作为本案已完成或本案新增责任。
residual_responsibilities:
- residual_id: residual-doctor-operation-count
  summary: 更新 code/tests/doctor/test_doctor.py 对公开 Helper operation_count 的兼容 expectation，并在新的 WorkCase/Gate1 中验证该测试与公开能力发现矩阵；当前 WorkCase 因路径不在 execution_authorization 白名单内未执行。
