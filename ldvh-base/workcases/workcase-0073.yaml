status: closed
title: 补足 F2 text_match 的运行时输入示例
goal: 在不改变 F2 检索语义、默认筛选、关系导航或事实持久化的前提下，让通用 capabilities 发现展示由当前来源定义的 text_match 嵌套输入片段，使首次调用者能够构造该现有能力的字段形状。
scope: 仅覆盖 find-fact-object-candidates 的 F2 text_match 输入发现：为 capabilities.result.operations[] 定义并实现受限 input_examples 字段、提供该操作的来源回指输入片段，并以契约与查询测试验证。覆盖 specs/05-事实模型基础规范.md、specs/attachments/04.Att.01-Helper CLI 请求与响应字段表.md、code/ldvh/helper/operation_runtime.py、code/ldvh/helper/service.py、code/ldvh/helper/operations/fact_candidate_operation.py 与对应 tests。排除关系导航、prepare-fact-object-draft 约束展示、检索 parser/匹配语义/默认状态修改、事实持久化、Worker 试验、外部操作和 Git commit。
success_criterion_definitions:
- criterion_id: criterion-source-contract
  statement: 04.Att.01 将 operations[] 的 input_examples 作为字段闭集正式定义；05 只定义 find-fact-object-candidates 的 text_match 可公开输入片段及其边界，且不产生第二套领域参数权威。
- criterion_id: criterion-discovery-example
  statement: 通用 ./ldvh capabilities 的 find-fact-object-candidates 条目返回一个带 summary、arguments_fragment、source_refs、composition_note 的 input_examples 项；该片段展示 F2、spark 类型与 text_match.text/field_paths 嵌套形状，并明确仍须补齐当前项目和其他必填输入。
- criterion_id: criterion-regression-validation
  statement: 所有无示例 operation 的 input_examples 为 []；compact 与 diagnostic 的领域结果一致；将片段补齐真实 governed_project_id 后可成功调用候选发现，既有 F2 text_match 解析和查询回归仍通过。
success_criterion_results:
- criterion_id: criterion-source-contract
  outcome: satisfied
  summary: 04.Att.01 已将 operations[].input_examples 定义为共同闭集，并规定四个成员、来源回指及可组合而非完整请求的边界；05 §11.5 仅定义 candidate operation 的 text_match 片段及其组合要求。
- criterion_id: criterion-discovery-example
  outcome: satisfied
  summary: 通用 capabilities 实测显示 find-fact-object-candidates 具有唯一示例，包含 summary、arguments_fragment、source_refs、composition_note，展示 F2、spark 和嵌套 text_match 形状，并明确仍须补入实际 governed_project_id。
- criterion_id: criterion-regression-validation
  outcome: satisfied
  summary: service 与 candidate operation 定向 pytest 共 44 项通过；compact 与 diagnostic 结果一致，其他 operation 的 input_examples 均为空；测试将发现片段补齐 sample 项目后成功命中 Spark，CLI 对 ldvh 项目查询返回 ok。
result_summary: 已为 find-fact-object-candidates 的 F2 text_match 补足运行时可发现的来源绑定输入片段：capabilities 公开共同 input_examples 闭集，候选发现提供唯一 Spark/title 示例，调用者补入实际项目后即可调用；检索、默认状态、关系导航和事实持久化均未改变。
