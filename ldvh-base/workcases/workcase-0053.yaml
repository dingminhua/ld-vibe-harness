success_criterion_definitions:
- criterion_id: criterion-value-convention
  statement: 05.Att.01 的 change-log-signature 登记与提交 trailer 规范明确取值约定：agent_id=实际驱动模型/Agent 身份（小写建议值 workbuddy/codex 及模型名如 Deepseek-V4-Flash 的允许规则），host_environment=工作环境/宿主工具（如 workbuddy、Codex Desktop），禁止 host_environment 重复 agent 名；约定可由规则投影机械回指。 回指层级：取值约定先以登记投影（05.Att.01 change-log-signature 行 + specs/03 footer trailer 契约）机械回指；若执行期选择 Code 机械校验取值格式，须同步登记 05.Att.02 新 rule_key 并如实标注覆盖层级（complete/incomplete），不虚报。
- criterion_id: criterion-injection-responsibility
  statement: 规范明确注入责任：signature 与提交 trailer 由平台/执行会话按实际运行环境自动注入，AI 不应手填；迁移操作与手工补录场景（migration_signature）的取值与拟议约定一致，且 Code 校验在适用路径上机械执行。 机械执行范围以 05.Att.02 登记的 rule_key 为准；未登记的取值约定只以规范投影回指，不宣称 Code 机械强制。
- criterion_id: criterion-commit-alignment
  statement: 提交署名与 change_log 对齐：同一事务的 Git 提交 trailer（Agent-ID / Host-Environment）与 change_log 条目signature 遵循同一约定；commits/validation.py 的既有两字段署名校验与新约定一致（不破坏既有通过行为）。
- criterion_id: criterion-validation-evidence
  statement: 定向测试覆盖取值约定与注入责任的新增断言（含 migration_signature 对齐）；既有 legacy change_log 迁移、提交署名相关回归全部通过；workcase-0053 自身 change_log 按新约定签名；全程经 Helper 受控路径，无直写，未执行 Git 提交，既有 dirty baseline 原样保护并区分报告。
