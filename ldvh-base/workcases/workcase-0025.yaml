title: 补强 FileAsset 跨规范使用政策
goal: 同步 specs/07、09、24 中 FileAsset 的使用边界，使持久原始字节、测试证据、环境证据与内部审计语义保持分离，同时不激活新消费者、Web 内容载荷能力或新关系。
scope: 仅覆盖 specs/07-Code 工程实践规范.md、specs/09-环境接入规范.md、specs/24-Study-研究报告.md 三处政策文字：明确普通稳定文档/事实优先、满足受控条件的最终原始字节可成为 FileAsset 候选；FileAsset 身份不提升测试或环境证据效力；内部审计文件与其结论/决定/行动分别承载。排除其它 Specs、Code、Web、Helper、Schema、迁移、既有 dirty worktree 变更、自动迁移 docs、普通文档受保护引用、新消费者/关系，以及 Authorized Attachment 术语或模型改名。
success_criterion_definitions:
- criterion_id: criterion-07
  statement: 07 明确仅当内容已经形成最终字节、具有脱离临时路径的独立消费价值、普通稳定文档或既有事实对象无法无损承载，并满足 25 的对象化、敏感性、许可与签名条件时，才可考虑受控创建 FileAsset；成为 FileAsset 不使内容自动成为测试证据。
- criterion_id: criterion-09
  statement: 09 明确截图、日志、诊断或测试原始字节可按条件成为 FileAsset 候选，但 FileAsset 只保留字节与完整性；环境证据范围仍由实际环境、版本、事件、路径、验证链和准确结论共同限定，不因 FileAsset 身份扩大。
- criterion_id: criterion-24
  statement: 24 明确内部审计或报告的确定文件可进入 FileAsset，而审计结论、决定、行动、适用性与未知范围进入普通文档或相应事实对象；Study 仍只承载外部内容研究，不被扩张为内部审计类型。
- criterion_id: criterion-no-expansion
  statement: 不新增 FileAsset 消费者、relations、Web payload/download/preview、普通文档受保护引用或 docs 自动迁移，不修改 Authorized Attachment 术语，也不触碰 07、09、24 以外文件。
- criterion_id: criterion-verification
  statement: 对三份目标文件完成定向文本检查、git diff --check 与 specs 测试；若测试受既有 dirty worktree 影响，必须准确归因并保留未确认范围，不得把失败或未运行写成通过。
success_criterion_results:
- criterion_id: criterion-07
  outcome: not_satisfied
  summary: 未满足：冻结授权指向不存在的 specs/07-Code 工程实践规范.md，实际 07 未经授权不得编辑，item-07 已取消。
- criterion_id: criterion-09
  outcome: satisfied
  summary: 09 已明确 FileAsset 只保存最终原始 bytes 与完整性，不能扩大环境、版本、事件、路径、验证链或准确结论的证据范围。
- criterion_id: criterion-24
  outcome: satisfied
  summary: 24 已明确审计文件本体可在满足 25 时保存为 FileAsset，而语义结论和行动进入普通文档或相应对象，Study 保持外部研究边界。
- criterion_id: criterion-no-expansion
  outcome: satisfied
  summary: 本案仅编辑 09 与 24，并更新 workcase-0025；未新增消费者、关系、Web payload/download/preview、普通文档受保护引用、docs 自动迁移或术语改名。
- criterion_id: criterion-verification
  outcome: not_satisfied
  summary: 已运行定向检查和 specs 测试，但 07 未经授权未改，且 pytest 为 128 passed、3 failed；失败可定位到现有表格拆分附件变更造成的硬编码文档数量预期漂移，未被写成通过。
result_summary: 09 与 24 的 FileAsset 边界文字已完成；07 因 Gate1 冻结授权文件名不存在而未编辑。定向差异、空白和当前规范仓库检查通过；code/tests/specs 运行后 128 passed、3 failed，失败与现有表格拆分附件变更的数量断言漂移相关。
validation_summary: 已通过：09/24 的 git diff --check、定向文本回读、当前 inspect_repository（issues=[]，implemented_checks_complete=true）。已运行但未通过：.venv/bin/pytest -q code/tests/specs，128 passed、3 failed；失败为 test_repository 中对 31/20 文档数量的硬编码预期与现有 34/23 附件拆分工作树不一致。未编辑、未验证 07 的实际政策文字。
status: closed
closure_outcome: partial
disposition_summary: 09 与 24 的 FileAsset 政策边界已完成；07 未因冻结授权误指不存在文件而未编辑，specs 测试还受独立的表格拆分附件数量断言漂移影响。建议以新的、正确路径的 WorkCase/Gate1 承接 07 与验证恢复；当前不创建对象、不路由既有对象。
