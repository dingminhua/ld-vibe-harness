title: 规则结果优先与渐进式披露
intent: 保留 AI 如何优先消费可回指的规则结果与最小上下文、何时再精确展开的问题，避免把短结果、Helper 层级、一次恢复投影或人工选择职责标识误作规则已完整读取、任务语义已理解或渐进式阅读体验已经解决。后续需判断最小上下文的选择、展开建议与充分性证据。
status: open
priority: P1
