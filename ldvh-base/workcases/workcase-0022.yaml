  status: pending
  goal: 事实完整性机械校验一等化为 Helper 公开操作
  expected_result: specs/05（及必要时 04）登记；code/ldvh/helper 实现；capabilities 可发现、可直调、输出合同化
  approach_summary: 形态预先收窄为 Helper 公开操作，不新增 console 入口、不改 pyproject；05 登记操作与字段契约，helper 实现并合同化输出
