  outcome: satisfied
  summary: specs/21 §4.5 定义三档路由（collaboration Worker→native subagent→same-AI）、permission_required/not_authorized/unknown 与 unavailable 区分、actual_method 闭集；§5 定义 reviewer_policy 完整字段；specs/31 §5.2.1 定义创建前能力解锁与模型选择；specs/34 §5.1 定义执行期能力预检五步流程。能力解锁和模型询问均不成为第三个 Human Gate，方案侧与结果侧两个固定位置允许不限轮次 fresh review。规则一致性验证通过。
- criterion_id: criterion-2
  outcome: satisfied
  summary: specs/21 §5 定义 reviewer_policy 结构（model、collaboration_agent、effort/fast、preferred_method、fallback_order、max_perspectives、activation、same_ai_limit）；§5 定义 actual_method/actual_agent/actual_model/evidence 字段及出现条件、fingerprint 规则、PlanΔ/ResultΔ 失效与跨会话重新解锁边界；05.Att.01 登记全部新增字段。
- criterion_id: criterion-3
  outcome: satisfied
  summary: workcase_validation.py 新增 _validate_reviewer_policy_match 与 _validate_review_actual_method 校验三档 actual_method 闭集与 capability_limitation 联动；workcase_projection.py 新增 reviewer_policy canonical projection 与 fallback_order 稳定化；transitions.py 保持兼容。201 个目标测试全部通过，正反案例覆盖 permission/unknown 与 unavailable 区分、每轮视角上限、fallback 顺序机械检查，保持既有 WorkCase 兼容。
- criterion_id: criterion-4
