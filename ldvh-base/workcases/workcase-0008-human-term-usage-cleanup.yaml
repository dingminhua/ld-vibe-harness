description: |
  本 WorkCase 是 spark-0026 的并行执行线程 C 承接对象。任务要求先分类，不机械全局替换；真实 Human 介入、授权、确认、取舍保留或改为 Human/Human Gate；AI 回读、原文核对、文件事实源核对改为明确核对动作；命令行或环境操作改为手动命令、手动步骤或环境接入；Code 机械校验改为 Code/测试/确定性校验；含混或会触发 Human Gate 的只记录，不擅自改。

  首轮扫描覆盖 `specs/`、`rules/`、`code/`、`tests/`、`web/` 和 `ldvh-base/`，并完成低风险推荐表达清理。Human 随后明确要求历史旧表达也必须处理掉，尤其是旧复合表达（原称“人工降级”）这种同时混淆执行主体和旧降级概念的表达；主体命名原则必须沉淀到 specs，后续不能再有主语不清晰或主体错误的用法。

  因此本 WorkCase 不关闭，继续承接扩展范围：历史 Spark/Study/WorkCase 采用吸收式改写，Code 中旧复合表达检测标记采用改名策略，主体命名规范沉淀到 active specs，并补齐需求方案子 Agent 审核与完成后子 Agent 检查。
