title: 生命周期触发与 Hook 动作分类
intent: 保留已选目标环境中的 lifecycle 事件如何依据真实副作用、工作对象与 Gate 分类和验收的问题，避免把工具名、命令名、未知输入或旧环境实测误作通用阻断规则或当前 adapter 已验证。后续需形成目标环境的实际正反例、失败与停用恢复证据。
status: implemented
summary: "**承接结果**\n\n- `adr-0006` 承接生命周期触发形态与机械约束选择：当前没有 Hook、插件或 adapter 动作分类层；薄 Skill 只取得规则引导和当次行动模板，过程机械检查必须执行，Git Gate 仅作提交前最后把关。由工具名、命令名或未知事件推导通用 allow/deny 的候选因此退出当前架构。\n- `workcase-0013` 承接安装、部署、接入和验证的四层责任及逐事件/逐入口验收纪律：静态存在、核心直调与真实环境递达必须区分，成功、失败、风险、证据、未验证项、回滚和 Human-only 操作边界需逐项交还，不能把有限观察写成真实接入通过。\n- 两个目标共同覆盖原 Spark 的触发选择、动作副作用分类、目标环境验收、失败/停用恢复和 Human Gate；没有未分流内容。WorkCase 仍处于其自身关闭确认阶段，不影响本次承接成立。\n\n**处置边界**\n\n本分流不建立跨环境固定动作闭集，也不表示任一具体环境接入或事件已经通过验证；实际行动仍按当前来源、能力和授权逐次判断。"
evolution:
- at: '2026-07-22T13:56:41+08:00'
  summary: 迁移复核保留 V3 对副作用分类和真实运行验收的要求，但移除机械 Git 来源、旧事件能力和白名单式方案；当前限定为已选目标环境中的实际 Gate 证据。
- at: '2026-08-01T01:58:26+08:00'
  summary: 架构决定已取消 Hook 动作分类层，环境接入的四层验证与失败交还则由 `workcase-0013` 形成稳定责任，原议题因此由 ADR 与 WorkCase 共同完整承接。
disposition_summary: '`adr-0006` 承接无 Hook/插件/adapter、薄 Skill 路由、过程检查和 Git Gate 的架构选择；`workcase-0013` 承接安装/部署/接入/验证四层、证据矩阵、失败与回滚及 Human 授权交还。两者共同完整覆盖原生命周期触发与动作分类议题，没有残余内容；目标后续生命周期不影响本次分流。'
