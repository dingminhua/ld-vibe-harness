goal: 在不新增 Spark 状态或关系键的前提下，定义并实现合法的“已完成稳定事实 + 明确 residual scope 的 open successor Spark”共同承接契约，补齐 Core 关系校验、只读候选/对象读取审计边界与 Web 正式关系投影，形成未来处理 spark-0034 所需的可审查能力边界。
scope: 覆盖 specs/20-Spark-火花.md、specs/32-事实对象生命周期变更与承接处置行动模板.md；code/ldvh/facts/relations.py、code/tests/facts/test_relations.py、必要的 code/tests/facts/test_project_validation.py；web/api/routes/cognition.ts 与 web/tests/api/cognition-inbox-contract.test.ts（仅在正式关系命中时）。find-fact-object-candidates/read-fact-objects 只读审计；精确核对 spark-0034/workcase-0077，不修改任何事实对象。排除 successor 创建、spark-0034 更新、多对象原子写入、WorkCase 状态机、bootstrap/config writer、通用图重构、其它 Spark，以及 commit/push/PR/release/external。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: 20/32 一致定义共同承接、open successor 的明确 residual scope、同项目/title、自指/循环/Study 边界；successor 语义充分性由 AI 审核，Code 只做机械检查，目标后续生命周期不由源 Spark 跟踪。
- criterion_id: criterion-core
  statement: Core 校验与正反测试对新形成的 Spark routed-to 仅接受同项目、mechanically valid、非空 title 的 open Spark；既有目标后续合法生命周期不使关系失效；Study、跨项目、缺失/invalid、空 title、自指、循环被拒绝，既有非 Spark 与 WorkCase 路径保持。
- criterion_id: criterion-web
  statement: cognition 正式关系投影在命中时显示合法 successor 当前 title/status，不以 ID 代替 title；若只读确认该文件不承载正式关系，则保持不变并记录边界。
- criterion_id: criterion-regression
  statement: 范围目标测试与 git diff --check 通过；Helper 只读精确回读 spark-0034/workcase-0077；本 WorkCase 不产生 canonical fact write；全库 check-fact-integrity 只记录已有 partial/invalid baseline，不冒充本 WorkCase 成果或失败原因。
- criterion_id: criterion-nogo
  statement: 形成未来迁移 No-Go：无匹配 multi_object_disposition 原子能力时，不创建 successor、不更新源 Spark、不以多次单对象写入拼接整体分流成功。
