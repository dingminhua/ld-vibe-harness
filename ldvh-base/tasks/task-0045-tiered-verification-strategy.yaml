description: |
  借鉴 Gstack 三层测试和 BMAD 多级门禁，为 LDVH 建立分层验证策略：
  1. 简单 Task（文档修改、配置调整）：验收标准 + 人工确认
  2. 中等 Task（功能开发、Bug 修复）：验收标准 + 自动测试 + 代码审查
  3. 复杂 Task（架构变更、跨模块影响）：验收标准 + 自动测试 + 代码审查 + 集成验证
  分层策略写入 Task 规范和最佳实践文档。
source: 竞品调研报告 docs/sources/06 建议3
