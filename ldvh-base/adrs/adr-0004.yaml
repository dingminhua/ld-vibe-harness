title: 测试后退出临时 ADR
status: retired
decision_question: 为核对 ADR 退出后的列表卡片与详情页呈现，本次测试应如何建立并处置临时 ADR？
decision: 决定仅为本次呈现核对建立此临时 ADR；完成对 retired 状态、处置信息和详情阅读的检查后，立即退出该决定，不将其用于项目规则、实现方向或后续行动。
applicability: 仅适用于当前对 ADR 终态呈现的人工核对，不适用于 LDVH 的产品、规范、事实源、实现或其它工作决策。
rationale: 需要一个真实处于 retired 状态、且带有完整处置信息的 ADR 对象，才能核对页面是否按来源字段如实显示终态内容，而不只验证静态组件逻辑。
consequences: 该对象保留为已退出的测试记录，可用于回读终态呈现和退出生命周期；它不形成持续约束，也不承接任何项目责任。
disposition_summary: 已按本次 Human 授权完成 ADR 终态呈现核对用对象的建立与退出；该临时决定不再适用，保留对象仅供查看 retired 卡片与详情中的“处置”区段。
