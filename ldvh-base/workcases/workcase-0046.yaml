title: 建立 WorkCase 投影规范与 Python 的精确漂移合同
status: open
goal: 在 specs/21 §9.3 继续作为 WorkCase 当前快照呈现语义唯一权威、Python workcase_presentation.py 继续作为唯一运行时实现点、TypeScript 继续只由 Python renderer 生成的前提下，新增测试侧 source-contract，精确验证 §9.3 非 blocked 六列表（7 个 open phase 行与 1 个 closed 行）的 Markdown 语法和值映射等于 PHASE_PRESENTATION/CLOSED_PRESENTATION，使规范或 Code 任一漂移确定性失败；不引入运行时 Markdown 解析、第二行为模型、Specs 或 Web 改动。
scope: 覆盖编码前 code/plans/workcase-presentation-source-contract.md 与 code/plans/README.md 登记；只新增 code/tests/specs/test_workcase_presentation_source_contract.py；只读核对 specs/21 §9.3、code/ldvh/facts/workcase_presentation.py、code/tests/facts/test_workcase_presentation.py、code/tests/specs/test_workcase_controller_continuation_contract.py、现有生成器与 generated TypeScript 合同。测试 parser 只存在于新测试文件，不得被 production 导入或复用；mutation 必须变换从规范抽取的文本或行，不另写一份期望 phase 映射。排除任何 Specs、production Python、Web/API/i18n/docs、生成器或 generated TypeScript 修改；排除运行时读取 Markdown、blocked overlay/Gate 2/unresolved/phase transition 第二模型、事实字段或持久派生判断、其它事实对象、spark-0040、workcase-0036 至 0039、focus-page 与 screenshots、push、PR、发布、外部消息和破坏性 Git。
success_criterion_definitions:
- criterion_id: criterion-exact-inline-code-table-contract
  statement: 新增测试精确定位唯一 `### 9.3 当前快照确定性呈现投影` 下的非 blocked 基表，表头与分隔行精确为当前六列，数据恰好 8 行；首列的 7 个 open 行必须精确采用 inline-code `open` / inline-code phase token，closed 行必须精确采用 inline-code `closed` / 文本“phase 省略”，其余五列必须是单个 inline-code token。无进度值必须是 inline-code `null`，裸 null、缺行、增行、重复行、乱序、列序变化或格式漂移均确定性失败。
- criterion_id: criterion-spec-python-exact-equality
  statement: 去除 inline-code 定界符后，7 个 open phase 逐键逐值等于 PHASE_PRESENTATION，closed 行逐键逐值等于 CLOSED_PRESENTATION；只有 progress_step 的 token `null` 转为 Python None，其它位置出现 null 必须失败。期望值只来自所抽取的 21 表并直接与 Python 常量全等比较，不在测试中维护第二份 phase 映射。
- criterion_id: criterion-mutation-negative-matrix
  statement: 测试侧 mutation 仅变换已从规范抽取的表文本或行，至少覆盖缺行、增行、重复行、乱序、表头或列序变化、status/phase 单元格格式错误、裸 null、未知 inline-code token 与映射值不一致；每项都必须使同一严格解析或全等比较路径失败，不通过另写一张期望表制造测试通过。
- criterion_id: criterion-no-duplicate-runtime-model
  statement: 本增量不重建 blocked overlay、Gate 2 禁语、unresolved、phase transition 或其它运行时行为表；沿用既有 WorkCase presentation 与 Controller tests。既有 test_generated_web_contract_matches_python_renderer 继续证明 Python renderer 到 generated TypeScript 的字节一致性，不新增或修改 Web test。
- criterion_id: criterion-validation-review-and-isolation
  statement: Code Implementation Plan、目标 source-contract test、既有 presentation/controller/generated-contract 回归、git diff --check、路径白名单、workcase-0046 精确回读、全库事实完整性、受保护 dirty 哈希隔离和独立只读结果复核全部完成；若唯一表无法机械定位，或实现需要其它路径、production 行为或 Specs 变化，则取消受影响 item 并按结果链安全收敛。
