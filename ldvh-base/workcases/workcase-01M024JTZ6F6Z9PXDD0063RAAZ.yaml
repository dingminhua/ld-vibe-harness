title: WorkCase Gate 1 顺序的分层防误读
goal: 消除把 WorkCase 创建前候选错误称为 Gate 1 的流程风险，通过权威模板、Helper 成功响应和薄 Skill 路由守卫共同固定“创建前复核→受控创建→公开精确回读→Gate 1”的顺序，同时保持既有 WorkCase Schema 与两 Gate 生命周期语义不变。
scope: 仅修改 specs/31-事实对象判定与受控创建行动模板.md、specs/attachments/09.Att.02-接入验收行为清单.md、code/ldvh/helper/operations/fact_creation_operation.py、skill/SKILL.md 及其直接 Python/spec/Skill 回归测试；允许经 Helper 更新本 WorkCase 生命周期并形成一个本地提交。明确排除 Web、管辖配置改名、署名合同、WorkCase Schema/状态机重构、当前 Codex 部署件 /Users/dmh2002/.codex/skills/ldvh/SKILL.md、common-dir Git Hook、其它事实、历史改写、push/PR/release，以及执行开始时全部既有 dirty/untracked。
success_criterion_definitions:
- criterion_id: criterion-authoritative-sequence
  statement: 31 模板以不可反读措辞明确：WorkCase 未经 Helper 受控创建并由 Controller 通过 read-fact-objects(actual_ref) 公开精确回读前，不得向 Human 呈交或命名为 Gate 1；09.Att.02 同时具有正向顺序和创建前错误呈交 Gate 1 的负例验收，且不在薄 Skill 复制完整状态机。
- criterion_id: criterion-helper-follow-up
  statement: create-fact-object 成功创建 WorkCase 时，follow_up 只以 result.actual_ref 指向 read-fact-objects，明确 create 内部 post-create readback/integrity audit 不替代 Controller 的公开精确回读；只有公开读取返回完整当前对象和非空 content_fingerprint 后才可呈交 Gate 1，不预填或猜测 fingerprint，也不先建议 Gate 1 写操作。
- criterion_id: criterion-skill-routing-guard
  statement: canonical skill/SKILL.md 以一句最小路由守卫要求缺少已创建 WorkCase 的公开精确回读引用和内容指纹时不得称为 Gate 1，并继续要求从 Helper/当前规则源现取细节；Skill 保持薄路由且通过结构验证。
- criterion_id: criterion-regression-boundary
  statement: 直接测试覆盖 WorkCase 成功 follow_up、非 WorkCase 成功响应结构等价、公开回读前置条件的规范/Skill 锚点及既有 Gate 1 CAS/baseline/authorization 行为；focused tests、相关完整测试、git diff --check 与 ldvh check 均如实通过或记录失败。
- criterion_id: criterion-deployment-residual
  statement: 结果明确记录执行前 Codex 部署件版本 2026-08-12 07:17、canonical 版本 2026-08-14 00:00、byte_aligned=false 与 Hook managed/aligned；本 WC 不修改部署件或 Hook，不宣称新守卫已真实递达，未来同步保持为独立授权责任。
