title: 全量测试提速 — code-tests (pytest) 并行化与慢测试收敛
status: closed
goal: 将 full-v4 全量测试 code-tests 步骤耗时从当前实测基线 270–444s 显著降低，同时保持全部既有测试用例与断言强度不变，使回归验证不再成为工作流瓶颈
scope: 覆盖：1) 现状测量（pytest collection errors 数量与原因、--durations=25 慢测试画像、子进程型测试耗时占比）；2) 引入 pytest-xdist 并行执行并处置共享状态/锁冲突；3) 收敛画像中 top-10 慢测试的可收敛项（真实 sleep、可批量子进程调用）；4) 以一次完整 full-v4 运行验证提速事实。排除：不改变 full-v4 固定 6 步计划结构（DAG 并行属规范级变更，另行议题）；不改 web 侧 4 个步骤；不承接 spark-0060 与 workcase-0088/0089 的耗时预估范围；不做增量/changed plan；不做 Git 提交。
success_criterion_definitions:
- criterion_id: criterion-1
  statement: 测试基线画像已登记：pytest collection errors 数量与原因分类、--durations=25 慢测试清单、子进程型测试（32 个文件）耗时占比
- criterion_id: criterion-2
  statement: code-tests 支持并行执行（pytest-xdist 或等效机制），并行模式下全部收集用例通过，共享状态冲突已处置或据实登记不可行原因
- criterion_id: criterion-3
  statement: 一次完整 full-v4 运行 passed，其 record 显示 code-tests 实测耗时较保守基线 270.8s（最近 passed 运行实测）下降 ≥40%，即 ≤162s；判定运行与基线同机进行，并在 item 结果中登记 pytest cache 冷/热状态以防预热缓存假性达标
- criterion_id: criterion-4
  statement: 提速未以删除或跳过既有测试用例为代价：collected 用例数 ≥1143、无测试文件删除、无新增 skip/xfail 标记、断言强度未放宽
success_criterion_results:
- criterion_id: criterion-1
  outcome: satisfied
  summary: 基线画像已登记：collection errors=0（1610 用例 0.57s 收集，spark-0060 所记 76 个已不成立）、slowest-25 清单（最慢 12.27s）、32 个 subprocess 型测试文件呈 2.9–12.3s 宽尾分布
- criterion_id: criterion-2
  outcome: satisfied
  summary: pytest-xdist 3.8.0 引入且 addopts -n auto 默认启用；全量并行 1597 passed / 13 skipped 与串行基线精确一致，git_hooks 最重文件 -n 2 先行验证无共享状态冲突，普通 pytest 调用确认自动并行
- criterion_id: criterion-3
  outcome: satisfied
  summary: full-v4 run-8760e87e passed；record 关联 raw output 时间戳派生 code-tests 49.5s（墙钟 49.54s / pytest 自报 49.32s）≤ 162s，较保守基线 270.8s 降 81.7%；同机判定，pytest cache 热状态已登记
- criterion_id: criterion-4
  outcome: satisfied
  summary: collected 1610 ≥ 1143；1597 passed / 13 skipped 与串行基线精确一致；git diff 仅 3 个测试文件与 2 个配置文件，无测试文件删除、无新增 skip/xfail；断言随 fixture 等价改写（3 处 install-state 断言随被移除的 install fixture 一并移除），套件级断言强度由未改动的 test_install_uses_common_dir 及保留的 inspected.state 断言覆盖，未放宽
result_summary: full-v4 code-tests 步骤从保守基线 270.8s 降至 49.5s（-81.7%），全量 6 步全程约 69s；提速由 pytest-xdist 默认并行（-n auto，10 worker 实测 80.34s vs -n 4 114.10s，无过订阅）与 6 项慢测试收敛（合计约 -14s 串行口径）构成；全部 4 条成功标准 satisfied，无剩余责任；4 项不可收敛慢测试已据实登记，产品侧规则源解析缓存（870ms/次）为后续候选方向。
validation_summary: 验证链：item-1 pytest --collect-only 与冷启动 --durations 全量画像（369.89s）；item-2 git_hooks -n 2 冲突预检 14 passed（未留存落盘证据的实测记录，据实标注）、-n auto 与 -n 4 两次全量并行对比（80.34s/114.10s，均 1597/13，有落盘 log）；item-3 三文件 41 passed 且收敛项全部跌出 top-5（top-10 内仅剩 real_git_commit 居第 6）（.ldvh-test-runs/wc0090-item3-converged-durations.log）+ Controller 独立抽查；item-4 完整 full-v4 耐久运行六步 passed（code-tests 49.5s）；补证：wc0090-item3-collect-evidence.log（1610 用例 0.44s 收集）；每个事实检查点后 check-fact-integrity 均 complete。
closure_outcome: completed
disposition_summary: 全部 4 条成功标准 satisfied，原 scope 内无未满足或未验证责任：code-tests 从保守基线 270.8s 降至 49.5s（-81.7%），full-v4 全程约 69s，用例与跳过数与基线精确一致。停止边界：工作树改动（requirements-dev.txt、pyproject.toml、code/tests 三文件）未提交 Git——提交不在本 WC 授权内，由 Human 另行决定；提交时不得裹挟并行线程文件（spark-0065.yaml M、workcase-0091.yaml ??，归属另一会话）。无剩余责任，无 accept-stop 项。
