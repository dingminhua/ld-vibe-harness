type: change
title: 强化 Tools 受控写入缺口检查机制
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  在重新执行 ADR 落地前决策时，发现此前只检查了 ADR Tools 的只读索引、查询、统计和校验能力，未按 12 和 12.01 的 Tools 分工反向检查 ADR 创建、状态流转、关联回写和 Change 记录等可机械化写入步骤是否有受控写入能力支撑。
  该问题属于机制和上位规范检查缺口，不应先在 ADR 个案中局部修补，应先更新模型子文档联动、Tools 辅助规范和事实模型落地初始化规则。
decision: |
  更新 `specs/04-LDVH模型子文档规范.md`，要求主模型流程或 Skill 流程存在可机械化事实源写入步骤时，必须反向检查 `NN.04-Tools.md` 是否定义对应受控写入执行能力；缺失时必须显式进入落地前决策、暂缓项、待补齐事项或 Change 记录。
  更新 `specs/12.01-Tools辅助规范.md`，将缺口报告扩展为包含应由 Tools 承担但尚未实现的受控写入能力缺口，并要求校验报告写入能力匹配情况。
  更新 `specs/13-LDVH事实模型基础规范.md`，要求事实模型落地初始化检查主流程或 Skill 流程中的可机械化写入步骤是否有 `NN.04-Tools.md` 和 Tools 实现支撑。
consequences: |
  - 后续事实模型或行动模型落地时，不能仅因只读、查询或校验能力存在就声称 Tools 实践完整支撑落地。
  - 若模型流程包含创建、更新、状态流转、关联回写或 Change 记录生成等可机械化写入步骤，必须检查对应 Tools 受控写入能力。
  - 能力缺口必须显式记录，不得被普通测试通过或只读校验通过掩盖。
  - ADR 后续处理应回到修正后的机制和规范重新评估 21.04 Tools 能力缺口。
affects:
  - specs/04-LDVH模型子文档规范.md
  - specs/12.01-Tools辅助规范.md
  - specs/13-LDVH事实模型基础规范.md
related_rules:
  - specs/04-LDVH模型子文档规范.md
  - specs/12-LDVH工具基础规范.md
  - specs/12.01-Tools辅助规范.md
  - specs/13-LDVH事实模型基础规范.md
human_gate:
  required: true
  confirmed_by: user
  confirmation_context: 用户指出应先处理机制和规范问题，再处理 ADR 个案。
validation: |
  1. 已更新模型子文档联动规则，增加可机械化写入步骤与 Tools 受控写入能力的反向检查。
  2. 已更新 Tools 辅助规范，增加写入能力缺口报告和写入能力匹配检查。
  3. 已更新事实模型基础规范，要求落地初始化检查 Tools 受控写入支撑能力。
  4. 已执行 `python3 -m pytest tests/tools/test_adr_index.py`，结果为 8 passed。
  5. 已执行 `python3 -m py_compile tools/adr_index.py`，结果通过。
