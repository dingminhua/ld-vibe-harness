title: 优化 LDVH：从价值审计到精简方案
status: implemented
intent: LDVH 已完成五类事实对象、Helper CLI、Git Gate、Web 认知中心和薄 Skill 路由的全面实现，但规范 00 自身承认 HV4「积累效用直观可见」尚未达成，且代码/规范体量与事实对象规模之间存在显著的投产比张力。本议题需要系统回答：(1) 当前各组件中哪些是过度工程化的？(2) 哪些价值维度仍是空白或薄弱的？(3) 优化方向与优先级如何形成？
summary: "## 分析框架：六问模型\n\n本 Spark 采用六问模型作为元分析方法。每次重新梳理时据此框架逐项对照，不依赖历史缺陷编号。\n\n### 一问：目的（解决什么问题？为谁？）\n\nspec 00 定义清晰：让 AI 在长期项目中「判断有据、行动可续、结果可验」。第一服务对象是 AI Agent，Human 通过 Web 导航 + 对话授权。目标本身无争议。\n\n### 二问：现状（做了什么？核心路径是什么？）\n\n硬数据（2026-08-08）：30 open Spark / 1 open WorkCase / 77 closed WorkCase / 5 active ADR / 5 active Pitfall / 17 active Study。F1 入口 6 张卡（5 ADR + 1 WorkCase）。F2 的 text_match 存在且有效（实测 30→2，93% 缩减），但需一次 invalid_request 才能发现 shape。relation_targets 存在但在 F2 参数中，不在 read-fact-objects 的自然路径。ADR 和 Pitfall 100% 零 outbound 关系。\n\n### 三问：用户旅程（每个角色怎么用？痛点在哪？）\n\n- **AI Agent**：进入→F1（6 张卡）→Human 给任务→F2。text_match 已知时工作顺畅，未知时退回 30 张全量手工筛选。找到对象后，稀疏的关系图使关联消费断裂——读到一个 ADR 后无法自然发现引用它的 Spark。返回项目后指纹变化可知但不定位具体变化对象。\n- **Human**：Web 导航正常。但 HV4（积累效用）和 HV5（项目演进）仍是空白——171 个对象在，看不出哪些被复用、项目为什么变快。\n- **新项目接入者**：Poker 两个项目有 ldvh-base/ 骨架但零事实对象。四步接入产生了脚手架但未转化为使用。\n\n### 四问：价值审计（每个组件对得起它的成本吗？）\n\n| 组件 | 服务维度 | 负担 |\n|---|---|---|\n| 规范体系（9,300 行） | V3 边界识别强 | 阅读负担重，大量「关于系统如何运转」的元规则 |\n| Helper CLI（66,000 行） | V1-V8 全覆盖 | 66K 行管理约 200 个 YAML，实现密度高 |\n| Web | HV1-HV3 Human 导航 | 完整 React 应用的部署维护成本 |\n| Git Gate | V5 据实判断 | 复杂度合理 |\n| 薄 Skill | V1 路由 | 极轻 |\n\n### 五问：过度（哪些可以砍、简化、合并？）\n\n1. 30 个 open Spark 中有 aspirational backlog，缺乏老化/衰减机制\n2. 规范密度与 AI 实际消费量之间的比例——9,300 行中有多少是每次工作需要读取的？\n3. 事实字段登记治理体系（foundation/type 分流）对当前约 200 个对象的规模可能过重\n4. **操作摩擦四断面**（吸收自 spark-0055）：(a) 模板激活层数——「摸了门不算进门，进了门不算坐下」，AI 不敢确定走到哪一步才算真正做了；(b) 规范交叉引用深度——创建事实对象需穿越 7 份规范 + 23 条 Stop Conditions；(c) 低风险变更触发全流程——无区分高风险/低风险变更的能力；(d) 80/20 场景倒置——80% 的写入简单（建新 Spark），但流程为 20% 的复杂边界场景设计\n5. **AI 工作实践影响**（吸收自 spark-0053）：LDVH 对 AI 工作模式产生了可复用的影响（规则路由、事实类型判断、规范附件化等），但这些改进方向观察缺乏跨行动保留和分流机制，需要在未来基于当时的事实和规则重新核实\n\n### 六问：不足（哪些价值标准仍是空白？哪些路径断了？）\n\n| 不足 | 对应标准 |\n|---|---|\n| text_match/relation_targets 存在但首次调用必然失败（shape 不可发现） | V1 快速定位 |\n| ADR/Pitfall 100% 零 outbound 关系——最需要被引用的对象最孤立 | V2 充分理解 |\n| 指纹只证明「变了」，无法定位「什么变了」 | V6 工作接续 |\n| 积累效用不可见——看不出哪些事实被复用 | HV4 积累效用 |\n| 新项目四步接入，产生骨架但不产生内容 | 生态扩散 |\n\n### 当前核心问题收敛（2026-08-08 重新实测后）\n\n三个真实断面，不编号：\n\n1. **能力可发现性断裂**：text_match 和 relation_targets 能用，但 AI 不知道 shape，首次调用必然失败。\n2. **关系消费断裂**：读到一个对象后，找不到和它相关的其他对象——不是缺能力，是缺关系。\n3. **时间消费断裂**：返回项目时指纹变了但不知什么变了，只能全量重读。\n\n---\n\n## 当前行动收敛（优先于下方历史缺陷清单）\n\n目标仍是直接解决 Spark-0067 的优化问题。Spark-0068 已被 Human 指示结束为历史校准材料；它只能提供反证和边界，不能再作为路线图、优先级来源或 WorkCase 派生入口。\n\n### 已完成的直接交付\n\n- **缺陷 1、5、13（合并）**：WorkCase-0073 已完成。\n- **缺陷 8（当前受限收敛）**：WorkCase-0074 已完成并提交。\n\n### 仍需独立设计判断\n\n- **缺陷 2**：反向关系导航已存在；还剩什么没做需要语义覆盖模型。\n- **缺陷 9**：集合指纹不能定位变化对象的缺口成立。\n\n### 暂缓，不以当前材料立项\n\n- **缺陷 4、7、10、11、12**：关系稀疏、响应成本、更新绕过因果、全量 after 成本和规范消费摩擦均缺少能支持具体改动的稳定证据。\n\n### 撤销或并入\n\n- **缺陷 3**：已提供反向/正向关系导航，不再作为独立缺口。\n- **缺陷 6**：Study F2 已有 abstract。\n- **缺陷 13**：已并入缺陷 1、5。\n\n---\n\n## 历史原始分析\n\n## 方向\n\nWeb 是 Human 的导航层。优化目标：降低 AI 已知任务后的「任务到关联事实」定位摩擦（V1 加强）。\n\n## 渐进式披露模型分析\n\n回溯 spec 00 8.1：F1（最小入口）到 F2（基于当前目标缩小候选范围）到 read（深读展开）。模型本身正确。\n\n裂缝：规范 00 8.1 给了方向，但没给 F2 的最小语义匹配契约。F2 实现层做了保守选择——status 过滤 + 可选的 text_match 参数，但 text_match 缺乏可发现性。\n\n## 缺陷清单（13 个）\n\n### 缺陷 1（根因）：F2 语义匹配契约缺失，text_match 能力不可发现\n### 缺陷 2：关联对象覆盖关系不透明\n### 缺陷 3：无反向关系查询\n### 缺陷 4（根因）：关系图稀疏\n### 缺陷 5：参数发现需额外往返\n### 缺陷 6：Study 消费格式断裂\n### 缺陷 7：上下文膨胀\n### 缺陷 8：草案不暴露字段值约束\n### 缺陷 9（根因）：无增量变化感知\n### 缺陷 10：受控更新路径过重，催生绕过行为\n### 缺陷 11：所有写入都是全量替换，无增量更新路径\n### 缺陷 12：规范源消费摩擦未被覆盖\n### 缺陷 13：F2 的 text_match 能力未被利用\n\n## 操作摩擦横切分析\n\n缺陷 10（编辑粒度）和 11（全量替换）指向同一横切问题：当前设计把所有操作推到正确性一端，迭代场景的负担与其价值不成比例。\n\n## 缺陷归因\n\n三个根因（缺陷 1、4、9），优先级：\n\n1. **F2 语义匹配契约缺失（P0）**：规范未定义最小语义匹配契约，text_match 虽有实现但不可发现。\n2. **关系图稀疏（P0-）**：ADR 和 Pitfall 这两个引用价值最高的类型 100% 零关系。\n3. **无增量感知（P1）**：独立机制，F2 没好时收益打折。\n\n## 开放观察\n\n### 观察 1：事实类型体系缺少对对象可变性的区分\n### 观察 2：全量扫描发现的横切模式\n- ADR 8/8（100%）零关系。Pitfall 7/7（100%）零关系。\n- spark-0053、0055、0019、0067 关注相近问题但联系稀疏。\n\n## 规范链审查发现（2026-08-07）\n\n20 个规范 + 12 个附件的结构引用全闭环。内容一致性无矛盾。\n\n## 未决事项\n\n1. F2 改进方向：先暴露 text_match，还是同时加强匹配逻辑？\n2. 关系图稀疏靠流程约束还是工具辅助？\n3. 规范源消费摩擦（缺陷 12）是否值得单独深挖？\n4. 对象可变性是否需要独立定性为设计问题？"
