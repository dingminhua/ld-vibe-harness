      expected_output: |
        Code 入口、完整验证表和测试覆盖安装验收命令；测试至少覆盖 target-first smoke、Hook payload smoke、receipt smoke、非管辖 no-op 和坏 adapter 诊断。
      status: pending
      blocking_reason: ''
  plan_review:
    orchestration_owner: main_controller
    workflow_ref: null
    review_policy:
      selection_reason: |
        本 WorkCase 会新增安装前 bootstrap 能力，容易与 Runtime Protocol、插件安装状态、Skill 发布和环境现场事实混淆，需要先审核边界，避免把 bootstrap skill 写成第三套 runtime 逻辑。
      required_perspectives:
        - bootstrap 与 runtime 边界
        - 安装验收 Code 可执行性
        - skill 不复制第二套逻辑
        - 非管辖项目低打扰体验
      optional_perspectives: []
      tool_method_requirements:
        - "'ldvh-install' skill 不得要求 LDVH Hook / Rules 已生效。"
        - 安装验收逻辑必须落在 Code，skill 只负责调度和解释。
        - specs/33 不得声明某环境当前已安装，只能定义流程和验收标准。
        - 验收必须包含 workspace root + target-first，不得只在项目根目录 smoke。
      aggregation_rule: 若安装验收 Code 与 Runtime Protocol 产生重复判断逻辑，应收敛到 dispatcher / verify 命令输出，skill 不得自行解释放行或阻断。
      review_items: []
