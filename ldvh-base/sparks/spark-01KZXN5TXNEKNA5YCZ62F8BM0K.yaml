summary: "**上位目标**\n\n- 建立“服务标准 → 实际交付 → 独立评估 → 问题定位 → 优化 → 复验”的持续闭环，判断 LDVH 是否真正服务好 AI。\n- 行为事件、运行证据、上下文回执和健康投影只是评估基础，不是最终目标；不因事件存在、Helper 返回、测试通过或记录落盘就声称 AI 获得了正确服务。\n\n**需要评估的服务对象**\n\n- 规则、行动模板、事实、状态、依赖和能力是否在正确时机交付，必要内容是否遗漏。\n- 条件性内容是否只在适用分支出现，是否存在重复、无关或过量交付。\n- 版本与实际 worktree 是否匹配，stale 是否被准确发现并读取到正确的新基线。\n- Helper 调用、响应体积、交付体积、延迟、重读、修复和回退成本是否合理。\n- AI 是否能够首次采取合法且有效的行动，失败后能否定位到准备、交付、宿主、模型行为或能力层。\n- 调整服务策略后，AI 的安全性、正确性和执行结果是否出现可重复且具有实际幅度的改善。\n\n**证据层级与声明边界**\n\n1. `LDVH prepared`：LDVH 准备了哪些规则、事实、模板或能力输入。\n2. `harness-delivered`：LDVH/runner 能以 locator、版本、指纹、范围和长度证明交付了什么；runner、hook 与 transcript 观察必须保留各自来源和保真度。\n3. `host-received`：只有宿主或 provider 能够证明实际送入模型的内容；宿主不提供回执时必须标为 `unavailable`，不得由 runner、hook、transcript 或 LDVH 交付回执代替。\n4. `behavior-consistent`：AI 的行动与某项输入一致，只能作为机制线索；进入跨条件比较前还必须通过执行可比性门槛。\n5. `causal-effect`：通过预注册、等价执行、配对消融或替换、重复样本及独立评分，判断某项输入或服务策略是否产生实际帮助。\n\n**评价维度**\n\n- 完整性：运行前冻结的 required 输入是否全部交付且版本匹配。\n- 精确性：excluded 输入是否被交付，conditional 输入是否在条件未触发时过量出现；不使用主观“相关比例”冒充判断。\n- 新鲜度：真实 stale 的检测准确率、召回率、正确重读率和修复成本。\n- 效率：分别统计 LDVH 交付 bytes、Helper response bytes、宿主可观测 Prompt tokens、调用数、queue/wall latency 和修复开销；不可观察项不估算成实测值。\n- 可行动性：首次合法行动率、外部验证成功率、重读/修复/回退次数和安全违规。\n- 诊断性：失败后能否区分准备缺口、漏交、宿主不可观察、stale、Helper 拒绝/超时、执行载体不一致、模型行为不一致和证据不足。\n- 实际效益：由独立盲评和受控对照判断改善是否可重复，不合并为掩盖差异的单一健康分。\n\n**已有基础与首轮结论**\n\n- workcase-0103/0104 与 study-0031 已形成并试跑隐私受限的 v2 运行证据；该 record layer 可作为协议复读和诊断基础，但不能证明 Helper 正确、模型实际收到/理解输入、执行健康或产品效益。\n- `ldvh@WFPQDZ` 已冻结规则精确读取任务族的最小必要上下文合同、三变体协议和客观 rubric，交付方法原型及聚焦测试，并以 `partial` 关闭；`ldvh@SFY7DG` 保存本次 technical assessment 的聚合结果、限制与分流。\n- 首轮 3×3 试跑中，完整合同、移除必要输入、增加无关输入分别为 2/3、1/3、2/3 客观通过。方法能够发现输出与协议不稳定，原始材料已按隐私边界清理；但执行体没有保持同一模型和同一工具入口、样本过小且 `host-received` 不可观察，因此 `criterion-trial` 保持 `not_verified`，这些比例不是因果效应或总体改善证据。\n- 当前最关键的能力缺口已经从“能否冻结并评分上下文变体”收敛为“能否在评分前以机器证据判断各试次是否可比较”。缺少执行载体和事件证据时，无法区分上下文变化、模型/入口差异、repair、permission、compact、fallback 或协议违背对结果的影响。\n- 对 [Arize-ai/coding-harness-tracing](https://github.com/Arize-ai/coding-harness-tracing) 的只读调研表明，coding harness 存在可利用的 hook、transcript、模型、工具、subagent、permission、compact 和失败事件观察面。其事件图、来源分层、内容脱敏、降级和 fail-soft 机制可作为 LDVH 设计参考或受控试验输入；该外部项目、Phoenix、Arize AX 和长期 span 存储都不是本 Spark 的建设目标或既定依赖。\n\n**下一验证顺序**\n\n1. 先定义并验证 LDVH 的最小执行证据协议：冻结 task/contract/payload/runner 身份，直接观察 model、agent runtime、工具与 Helper/CLI 入口，记录最小结构化执行事件，并区分 `runner-observed`、`hook-observed`、`transcript-observed`、`provider-receipt` 与 `unavailable`。\n2. 在评分前形成 `comparable`、`not_comparable` 或 `inconclusive` 三值结论；模型或工具入口不一致、事件图不完整、发生未登记 fallback/repair/compact、载体身份不可观察或协议被违背时，不进入上下文效果比较。\n3. 协议成立后，使用同一模型、同一工具入口和同一 runner 复验规则精确读取任务族；评分管线直接消费机器记录，每个任务和条件增加重复样本，先过执行可比性门槛，再判断 required 缺失或 excluded 增加是否形成可重复且有实际幅度的差异。\n4. 只有等价复验形成稳定信号，才决定是否扩到 WorkCase 行动前准备、局部编辑 stale 修复等任务族，以及稳定机制是否值得进入 Helper、行动模板或 ADR。\n\n**隐私、扩大与停止边界**\n\n- 原始 prompt、response、transcript、span、规则正文和工具正文如确有必要，只能进入身份绑定的受限临时根并按期删除；长期事实只保存方法、结构指纹、必要身份、聚合计数、可比性结论、限制和清理结果，评估记录不得成为第二事实源。\n- 执行载体身份不可观察时不得进入条件效果比较；模型或工具入口不一致时标为 `not_comparable`；hook/transcript 只能加强 `harness-delivered`，不能提升为 `host-received`。\n- 只生成 timeline、但不能支持执行可比性判断的 tracing 不具有进入 LDVH 的稳定产品价值。外部工具只作参考实现、可替换观察来源或受控实验输入，不为其新增常驻环境插件、托管上传、长期遥测、Dashboard、告警或统一健康分。\n- 合同或 rubric 无法事前冻结、独立评分一致性不足、任务条件不等价、指纹漂移、隐私/留存边界不成立、样本方差过大或执行证据协议未验证时，只报告不确定，不扩大任务族，不形成“有帮助”“过量”或服务水平改善结论。\n\n**承接范围与保持 open 的原因**\n\n- `ldvh@WFPQDZ` 只承接并完成了规则精确读取三变体方法原型和一次受限试跑；其 `partial` 关闭已把等价执行、重复样本和因果判断责任交还本 Spark。\n- `ldvh@SFY7DG` 只承载已完成试跑的研究报告，不承接后续行动、产品化决定或其它任务族。\n- 现有关系中的其它对象继续提供输入透明性、运行证据、stale 和诊断分支背景，但关系存在不表示本 Spark 已完整承接或完成。\n- 最小执行证据协议、等价复验、跨任务族扩展和稳定机制归位仍未完成，因此本 Spark 保持 `open / P1`。\n\n**尚待判断**\n\n- 最小执行事件闭集、来源保真度、事件图完整性和可比性阈值应如何冻结、审核、版本化与失效。\n- 当前各 harness 能直接观察到哪些 model/runtime/tool 身份，哪些只能从 transcript 推断，哪些始终 unavailable，以及跨宿主如何保持可比性。\n- 在不长期保留原始内容时，结构指纹和聚合字段是否足以解释执行不等价与复现实验结论。\n- 冻结任务、独立 rubric、重复样本量、模型/会话方差和实用改善阈值如何确定。\n- 哪些稳定评估机制值得进入 Helper、行动模板或 ADR；在证据不足前继续保留为 Study 或后续 WorkCase，不提前产品化。\n\n**已知诊断改进议题**\n\n- 机械诊断能否让 AI 直接修正，是可行动性与诊断性评价中的具体分支：提交预检、Helper 请求校验、事实校验和完整性检查不应只报告错误值；应评估当前允许值、最小合法示例或精确继续读取入口能否减少额外查规则、试调和修复成本。\n- adr-0008 已对提交预检形成分层策略：确定性约束可直接给出闭集，规则驱动值从当前契约投影注入，列表过长或需完整上下文时提供精确读取入口。该决定不表示相关实现已经完成，也不自动扩展到其它 Helper 操作。\n- 后续不再以独立 Spark 跟踪这一分支；是否形成具体 WorkCase、扩展到哪些操作以及改善是否成立，统一由本 Spark 的冻结任务、独立评估和停止边界判断。"
