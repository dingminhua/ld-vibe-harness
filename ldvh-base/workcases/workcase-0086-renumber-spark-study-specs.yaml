id: workcase-0086
type: workcase
title: 调整 Spark 与 Study 工作模型规范编号
goal: 将 Spark 工作模型规范编号从 24 调整为 20，并将 Study 工作模型规范编号从 25 调整为 24，同时同步现行规范、Code、Web、测试和事实源引用中的编号契约。
status: human_closure_confirming
created: '2026-06-21T18:27:59+08:00'
updated: '2026-06-21T18:37:51+08:00'
priority: P1
description: |
  当前 LDVH active 工作模型集合中，Spark 位于 `specs/20-Spark-火花.md`，Study 位于 `specs/24-Study-研究报告.md`。用户要求将“24 spark 改为 20 spark，25 study 改为 24”，本 WorkCase 用于承接这次编号迁移。

  本 WorkCase 的范围不是只重命名两个文件，而是调整工作模型成员编号契约：Spark 应成为 20 号工作模型，Study 应成为 24 号工作模型；所有现行 specs 成员自描述、目录索引、字段注册、Code 校验、Web 展示、测试和事实源引用中面向当前产品的编号应同步一致。

  历史记录、迁移记录或旧 WorkCase 中为解释过去事实而出现的旧编号，需要在执行时逐项判断：如果是当前产品入口或当前事实契约，应迁移；如果是不可改写的历史事实语义，应保留为历史描述并在关闭材料中说明边界。
success_criteria: |-
  - [x] `specs/24-Spark-火花.md` 迁移为 `specs/20-Spark-火花.md`，并同步其 `ldvh_doc`、`ldvh_member`、`spec_id`、`canonical_path` 和内部引用
  - [x] `specs/25-Study-研究报告.md` 迁移为 `specs/24-Study-研究报告.md`，并同步其 `ldvh_doc`、`ldvh_member`、`spec_id`、`canonical_path` 和内部引用
  - [x] `specs/01`、`03.02`、`05`、`05.01`、`05.02`、`05.03`、`08`、`10`、`11` 等现行规范中涉及 Spark/Study 编号或路径的引用已同步
  - [x] Code 中工作模型集合、字段 owner、校验、CLI、commit 校验、对象关系和派生索引不再把 Spark 当作 24 或 Study 当作 25
  - [x] Web API、Web 前端、Web 文档和相关测试中的 Spark/Study 排序、路径、编号或展示契约已同步
  - [x] `ldvh-base/` 当前事实源中面向现行规范的 `specs/24-Spark`、`specs/25-Study`、24 号 Spark、25 号 Study 等引用已迁移或有明确历史保留说明
  - [x] 迁移后运行 specs 综合校验、事实源校验、相关 Python 测试、Web/API 检查和必要全文扫描，证明当前产品入口中不再残留旧编号契约
  - [x] 关闭材料明确记录保留的历史旧编号命中、不可迁移原因、验证证据和 Git 历史边界
source: |
  用户先提出：“将24spark 改为20 spark ，25 study 改为 24，你能理解这个需求吗”。主控理解为 Spark/Study 工作模型编号迁移，而不是单纯文本替换。

  用户随后明确要求：“建立一个workcase 推进此事”。

  Human Gate 记录：
  - 触发原因：创建 WorkCase、调整 active 工作模型编号、重命名规范文件并同步 Code/Web/测试/事实源，属于需要工作项治理的高影响变更。
  - 确认依据：用户明确要求建立 WorkCase 推进此事。
  - Human 决策：允许创建本 WorkCase 承接后续方案审核、执行、验证和关闭确认。
