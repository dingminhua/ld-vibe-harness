title: AI 反馈与交互改进
status: implemented
intent: 收集和追踪 AI 在使用 LDVH 过程中发现的交互摩擦、效率瓶颈与改进机会，形成可执行的改进候选。 已全部处置完毕，Spark 关闭。
summary: "## 当前状态\n\nAI 在通过 Helper CLI 交互时发现以下问题，需纳入治理：\n\n### 1. 输入契约摩擦\n- `call` 子命令的 stdin 传入请求格式不被接受，必须 `--request <file>` 传入；但 `invalid_request` 错误提示 `\"arguments.fact_refs 必须是包含 1–128 项的 array\"`，误导调用方以为是参数格式问题，未指明正确传入方式\n- `--fields` 数组内字段选择（已有实现）在 `read-fact-objects` 组合同样报 missing，实际可用但需配合 `--request` 而非 stdin\n\n### 2. 操作反馈不一致\n- `find-fact-object-candidates` 在参数错误时仅返回 `exit code 5`，无结构化错误信息、无 stderr，调用方无法自纠\n- 相比 `read-fact-objects` 的 `gaps`/`diagnostics` 反馈，此操作的无反馈是明显落差\n\n### 3. 发现入口过重\n- `capabilities` 全量输出 50KB+ 被截断，渐进式发现负担重\n- 缺少单操作轻量明细的中间档（介于全量 capabilities 和 --example 之间）\n\n### 4. 关系查询跨一跳成本高\n- relations 仅存 `object_uid`，不存 `fact_type_key`/`object_id`，跨一跳需再解析才知道指向什么\n\n### 5. 无就绪状态机械信号\n- Spark 是 open/P2 还是 implemented、候选是否达到立项门槛，全靠人读语义+人工对齐姊妹对象，无状态机/候选队列提示\n\n## 待判断问题\n\n- 哪些摩擦在真实多agent会话中稳定出现，值得形成窄 WorkCase；\n- 契约提示优化的边际成本与收益是否支持实施；\n- 是否需要在 CLI 层面统一错误反馈格式。\n\n## 边界\n\n- 不替代 Helper 服务规范（04）的正式契约变更；\n- 窄 WorkCase 优先于全量重写；\n- 与其它 Spark 的 relation 仅追溯共同线索，不创建重复条目。\n\n### 6. 创建过程本身就是现场证据\n\n本 Spark 在创建过程中暴露了它要记录的问题 #1（输入契约摩擦）：\n\n- 第 1 轮：`fact_type_key` 和 `governed_project_id` 放在顶层 arguments 而非 `draft_basis` -> invalid_request\n- 第 2 轮：`model_name: \"\"` 空字符串不合契约（须非空 string 或 null）-> invalid_request\n- 第 3 轮：缺首条 change_log -> rejected\n- 第 4 轮：成功\n\n每次错误提示的 gap 准确，但没有一条给出你应该先调 `prepare-fact-object-draft` 拿到指纹、再合入 `draft_basis`、再补充 `observed_context.signature` 的完整导航。AI 需要自己拼装信息，知识分散在 capabilities、specs 和逐步暴露的错误提示中。\n\n**结论**：创建这个 Spark 的过程，比它的内容更能说明问题。该摩擦证据可作为 #1 的真实任务案例，支持后续窄 WorkCase 立项判断。\n\n### 7. 后续操作中的附加摩擦（2026-08-17 更新环节发现）\n\n本 Spark 在更新过程中暴露出更多交互摩擦，记录如下：\n\n**a) 操作结果确认信息不足**\n- 第一次 `update-fact-object` 实际已成功（outcome=ok），但用 `jq .result.post_update_fingerprint` 提取到 null（正确字段名为 `content_fingerprint`），导致误判为失败，重复执行了一次完整更新\n- 后果：supplement 内容重复，change_log 永久多出一条无效流水（§11.7 禁止删除历史流水）\n- 根因：`capabilities --example` 只给出 request 形状，不给出 response 字段闭集；调用方需查阅 specs/05 §11.7 的\"领域 result 字段闭集\"才能知悉合法字段名，信息获取链条长\n\n**b) 错误提示\"最后一公里\"缺失**\n- 所有 gap 提示准确指出\"什么错了\"，但从不指明\"下一步怎么做\"\n- 例如：`arguments 包含未知字段: xxx` 未提示\"这些字段应放入 draft_basis 中\"\n- 例如：`内容指纹已经过期` 未提示\"重新读取对象获取最新指纹再重试\"\n- 差的那一步正是 AI 最需要的——不是错误诊断，而是修复路径\n\n**c) model_name 的哲学悖论**\n- 系统提示中可观察到模型名（如 deepseek-v4-flash），但 LDVH 署名规则要求\"AI 只可使用按角色直接声明的信息\"\n- 系统提示算不算\"直接声明\"？边界模糊，保守选择 null 导致每次流水签名缺 model_name\n- 每次写入前 AI 都要做一次哲学判断，而非机械执行\n\n**d) 不可删除历史流水的纪律成本**\n- §11.7 规定\"已有流水仍必须保留完整前缀并恰追加一条\"，禁止删除或修改历史流水\n- 这保证了审计完整性，但代价是操作失误（如 a）造成的冗余永久保留\n- 本 Spark 的 change_log 中两条重复的 content_update 流水是这一 trade-off 的实例\n\n**结论**：这些摩擦与本 Spark 记录的 #1（输入契约摩擦）和 #5（操作反馈不够清晰）同源——LDVH 选择了\"机械可审计、不可篡改、严谨验证\"的路线，代价是交互重、执行门槛高、犯错成本大。本 Spark 自身的存在就是 LDVH 承认这一 trade-off 值得被追踪和改进的证据。\n\n### 8. 提交流程中的附加摩擦（2026-08-17 受控提交发现）\n\n本 Spark 在受控提交过程中暴露了更多交互摩擦，记录如下：\n\n**a) 提交模板信息过载**\n- git-commit 行动模板约 200 行，但 AI 必须完整读完才能开始执行\n- 大量内容与本次场景不相关（WorkCase 授权判断、拆分政策、push/PR 排除等），但 AI 无法提前预判哪些适用\n- \"先读完整模板再执行\"对高频提交场景偏重\n\n**b) 操作输入契约不一致**\n- `precheck-git-commit` 要求 `work_object_locators`（绝对路径），但同一条 worktree 的 `read-fact-objects`、`update-fact-object`、`check` 都不要求此参数\n- 不是不合理，但规则不统一，每次调用需猜测\"这个操作还缺什么\"\n\n**c) Hook 状态检查工具链不完整**\n- 模板要求 B-8 重新核对 Hook \"有效、可执行、无冲突\"\n- `git-hooks-status` 的 `result.deployment_status` 返回 null，无法直接消费\n- 只能回退到 `ls .git/hooks/commit-msg` + `head -5` 人工判断，最后一步靠人工信任而非工具确认\n\n**d) 署名 trailer 的 null 格式边界不明确**\n- `LDVH-Model-Name: null` 的写法是否合法？Git trailer 消费者能否解析 null 字面量？\n- 其他 commit 写的是 `deepseek-v4-flash` 等实际模型名\n- 规则说\"非空 string 或 null\"，但 Git trailer 的书写约定无明确规范\n\n**e) 重新核对 scope 不明确**\n- 模板要求多次\"重新核对\"（B-8、C-3），但每次 scope 未说明\n- 安全做法是全重读，但成本未量化；部分重读有遗漏风险\n- 没有\"从这个状态到提交完成\"的逐步指引管线，信息分散在模板、precheck 格式、Hook 状态、署名格式中\n\n**结论**：提交流程整体走得通，每一步有依据。摩擦集中在信息散布太散——模板、precheck 格式、Hook 状态、署名 trailer 格式每样都要单独查，没有一条端到端的指引管线。\n\n\n### 9. 实测数据与过时声称更正（2026-08-17 Helper 实测）\n\n对本 Spark 记录的摩擦项进行了一次真实 Helper CLI 实测（worktree: thoughtful-babbage，Python 3.12.13 venv，ruamel.yaml 已就绪）。结论如下，用于更正过时声称并补全量化数据。\n\n#### 9.1 #3 发现入口过重 — 已补全量化数据\n\n- `ldvh capabilities`（全量）实测 **69347 字节**（formatted JSON），含 **26 个公开操作**。\n- 单操作平均约 2490 字节；最大 `find-fact-object-candidates` 4753 字节、`update-fact-object` 4749 字节；最小 `read-action-template-candidates` 1356 字节。\n- `ldvh capabilities <operation_key> --example` 实测返回 **约 1544 字节**，但**只给 request 形状，不给出 response 字段闭集**（keys: operation_key/request/required_input_paths/composition_note/source_refs）。\n- **结论**：#3 的核心量化成立——全量 68KB 确实重，且介于全量 capabilities 与 `--example` 之间确实缺一个\"单操作明细 + response 字段闭集\"的中间档。这一中间档同时治 #7-a（response 字段名不可知导致重复执行）。建议窄 WorkCase 同时覆盖：单操作轻量明细 + response 字段闭集披露。\n\n#### 9.2 #1 输入契约摩擦 — 部分过时，需更正\n\n- **更正**：`call` 子命令的 stdin 现在可接受合法请求。实测 `echo '{...valid...}' | ldvh call read-fact-objects` 返回 `outcome: ok` 并成功读到对象。原文\"必须 `--request <file>` 传入\"的绝对化声称**已过时**。\n- **仍成立**：当 `--request` 与非空 stdin 同时使用时，错误提示为\"`--request 不得与非空标准输入同时使用`\"，准确但不指明\"二选一\"的修复路径。\n- **仍成立**：参数错误时的 `invalid_request` 提示确实存在误导风险——例如 `read-fact-objects` 报\"`arguments.fact_refs 必须是包含 1–128 项的 array`\"，未指明应通过 `--request` 或 stdin 传入完整请求；调用方仍需自行拼装\"先 capabilities --example 拿形状、再组 request\"的路径。\n\n#### 9.3 #2 操作反馈不一致 — 部分过时，需更正\n\n- **更正**：`find-fact-object-candidates` 在参数错误时**不再仅返回 exit code 5 无反馈**。实测无参调用返回结构化 `invalid_request`，含 `gaps`（2 条）、`diagnostics.details.problems`，以及 **`hints`**（missing_required_inputs / allowed_inputs / minimal_examples 三类）。\n- **更正**：它的错误反馈现在与 `read-fact-objects` 一致，原文\"明显落差\"的声称**已过时**。\n- **仍成立**：`gaps`/`hints` 准确指出\"什么错了\"，但 `follow_up` 恒为\"当前响应没有能够由 Helper 明确的专属后续信息\"——**不指明下一步修复路径**（#7-b 原文成立）。\n- **新发现**：`invalid_request` 的进程退出码实测为 **exit 2**（原文称 exit 5）。调用方若按 exit code 分支需更新预期。\n\n#### 9.4 #4 关系查询跨一跳成本高 — 比原文更严重，升级\n\n- **原文**：relations 仅存 `object_uid`，不存 `fact_type_key`/`object_id`，跨一跳需再解析。**实测确认且更严重**：\n- `read-fact-objects` 的 relation target 确实只含 `object_uid`（`{\"relation_key\":\"related-to\",\"target\":{\"object_uid\":\"01a00bd0-...\"}}`）。\n- **关键发现**：`read-fact-objects` 的 `fact_refs` **不接受 `object_uid`**——必须提供 `fact_type_key` + `object_id`。但 relation target 只有 `object_uid`，没有 `fact_type_key`/`object_id`，因此**无法直接用 read-fact-objects 解析跨一跳目标**。\n- 实测 `find-fact-object-candidates` 的 `relation_targets`/`relation_source_refs` 接受 `object_uid`，但 `relation_targets`（正向）实测返回 0 候选；`relation_source_refs`（反向）能找到 1 个对象（确认 01a00bd0 指向 spark-01KZXN5TXNEKNA5YCZ62F8BM0K），但要求调用方**预先指定 `fact_type_keys`（1–6 项）**才能扫描——仍需猜测目标类型。\n- **结论升级**：#4 不是\"成本高\"，而是\"正向跨一跳在当前公开操作下**无机械路径**\"——除非调用方已知目标 fact_type_key 并用 `relation_source_refs` 反向查，或穷举所有 fact_type_keys。建议从\"成本优化\"升级为\"schema/操作缺口\"，作为 Study 立项（不改 04 正式契约，先评估：①relation target 补存 fact_type_key 的迁移成本；②或新增按 object_uid 直查的只读操作）。\n\n#### 9.5 推进路径更新\n\n基于实测，原推进建议更新为：\n1. **窄 WorkCase（合并）**：统一结构化错误 `follow_up` 修复路径提示 + `capabilities` 中间档（单操作明细含 response 字段闭集）。一个 WorkCase 同时治 #2 残项、#7-a、#7-b、#3。\n2. **Study**：#4 关系跨一跳 schema/操作缺口，评估 relation 补存 fact_type_key vs 新增 uid 直查操作的 trade-off。\n3. **暂缓**：#5 状态机，等交互层治好再谈。\n4. **更正归档**：#1/#2 的过时声称已在本次实测中更正，不再作为立项依据；其残项（follow_up 修复路径提示）并入窄 WorkCase。\n\n### 10. 推进决策：遵守上位 Spark 证据门槛，登记证据点暂不立项（2026-08-17）\n\n本 Spark 第 9 节实测后，原本计划直接立项窄 WorkCase（统一 `follow_up` 修复路径提示 + `capabilities` 中间档含 response 字段闭集）。但在立项前召回查重发现：\n\n**上位承接关系**：本 Spark 的 relation target（`01a00bd0-...` = `spark-01KZXN5TXNEKNA5YCZ62F8BM0K`「LDVH 面向 AI 的服务质量评估与持续改进」，status=implemented）已明确设立**证据门槛**：\n\n- 已交付基础包括「invalid_request 结构化修正提示」「CLI --request、--example、--fields 已交付」「read→update 最小桥接」——即本 Spark 第 9 节实测确认的 #1 残项（stdin 可用、--request/--example 已交付）与 #2 残项（结构化 gaps/hints 已交付）**上位 Spark 已记录为已交付**。\n- 上位 Spark 明确规定：「只有具体 operation 在可比较真实任务中出现稳定过量、额外回读或修复成本时，才形成范围匹配的候选」「后续读/写交互优化……先由本 Spark 的证据门槛判断是否值得形成窄 WorkCase」。\n- 其证据方法要求 **40 个固定模型会话的 Phase 1/Phase 2 对照基线**与 **12 对固定模型知识预检**，区分 comparable / not_comparable / inconclusive。\n\n**本实测的门槛位置**：第 9 节实测是 **N=1 单会话、单模型（glm-5.2）**，不构成上位 Spark 要求的可比基线，**不达立项门槛**。强行立项会违反上位 Spark 已设立的证据纪律。\n\n**登记的两个证据点（供未来跨会话证据收集对齐）**：\n\n1. **response 字段闭集缺失**（#7-a / #3 残项）：`capabilities <op> --example` 实测只返回 request 形状（keys: operation_key/request/required_input_paths/composition_note/source_refs），**不返回 response 字段闭集**。实测中 `update-fact-object` 成功响应的 result keys 为 actual_ref/canonical_path/carrier/previous_content_fingerprint/content_fingerprint/fact_object——但这些字段名无法在调用前从 `--example` 得知，导致调用方需读 specs/05 §11.7 的\"领域 result 字段闭集\"才能预知合法字段名（Spark #7-a 记录的 `post_update_fingerprint` vs `content_fingerprint` 误判即由此而来）。\n   - **未来证据收集对齐点**：在跨模型会话中观测\"调用方是否因字段名不可知而产生重复执行或误判\"，积累到上位 Spark 的 40 会话基线后再判断是否达立项门槛。\n\n2. **relation 正向跨一跳无机械路径**（#4 升级项）：relation target 仅存 `object_uid`，`read-fact-objects` 的 `fact_refs` 不接受 `object_uid`（必须 fact_type_key+object_id），`find-fact-object-candidates` 的 `relation_targets`（正向）实测返回 0 候候选，`relation_source_refs`（反向）可查但需预猜 fact_type_keys。\n   - **门槛位置判断**：此项是**操作/schema 缺口**而非\"交互过量/回读成本\"，性质不同于上位 Spark 的读写交互优化范畴；它指向 04/05 的存储 schema 或新增只读操作。**上位 Spark 的 40 会话证据门槛不直接适用**于 schema 缺口判断。\n   - **推进形态**：作为 **Study 候选**登记，不走 WorkCase 证据门槛。Study 评估两个方向：①relation target 补存 `fact_type_key` 的存量迁移成本；②新增按 `object_uid` 直查的只读操作（不改 schema）。Study 立项门槛是\"可行性评估需求\"而非\"跨会话可比基线\"。\n\n**当前推进结论**：\n- 窄 WorkCase 暂不立项，遵守上位 Spark 证据门槛。本 Spark 第 9 节实测作为 N=1 证据点归档，待跨会话/跨模型证据积累。\n- Study 候选（#4 relation 跨一跳 schema/操作缺口）单独登记，其门槛不适用 40 会话基线，按 Study 立项判断。\n- #5（状态机）维持暂缓，等交互层证据成熟后再评估。\n\n### 11. #7-c 更正：系统提示给出的身份是直接声明，不是推导（2026-08-17 规范核验后）\n\n本 Spark 第 7-c 节原把「系统提示可见 glm-5.2，但算不算直接声明」列为「哲学悖论」，并称「保守选择 null 导致每次流水签名缺 model_name」「每次写入前 AI 都要做一次哲学判断」。**经核验 03 §9 与 05 §11.0 原文，此定性错误，更正如下。**\n\n#### 11.1 规范原文已明确支持直接采用\n\n- **05 §11.0 第 3 条**：宿主系统提示明确以显示名描述当前交互载体时，该显示名可作为对应字段的**直接声明**；「AI 不应要求该信息必须以特定格式标签（如 `product_name: X`）出现才视为声明」。本会话系统提示写明 \"powered by the model glm-5.2\"，这正是 `model_name` 的直接声明，可直接采用，无需哲学判断。\n- **05 §11.0 `model_name` 定义**：「本次会话可观察到的模型或配置模型名称，保留其可观察拼写」。系统提示给出的 glm-5.2 即当次可观察模型名。\n- **05 §11.0 示例表第一行**：「桌面端托管 Claude Code 运行时 → `product_name=Cindy`、`model_name=glm-5.2`、`agent_runtime_name=claude-code`」——与本会话承载关系一致，证明三字段均可从当次系统提示直接观察取得。\n- **03 §9**：「产品接入面只负责提供快照，LDVH 不推断产品、模型或运行时」——系统提示提供模型名是「提供快照」，AI 把它填入署名是采用快照，不是推断。\n\n#### 11.2 #7-c 不是真实规则缺口，是误读规则的自找摩擦\n\n- 03 §9 与 05 §11.0 禁止的是「**在产品、模型、运行时之间互相推导**」（例如从 product_name=Cindy 推 model_name 该是什么，或从历史 change_log 的 null 推当次也该是 null）。\n- 从**当次系统提示直接取值**方向相反，规则本就允许。原 #7-c 把「直接采用」误当成「推导」，过度保守选 null，是误读规则造成的自找摩擦，不是真实边界模糊。\n- 本会话第 9、10 节两次写入均已填 `model_name: glm-5.2` 并通过 `check_status=mechanically_valid`——机制本就采用，不是「现在不算采用」。\n\n#### 11.3 与签名 Spark（spark-01M064X95QEATV171W720V4A4J）的关系\n\n- 签名 Spark 覆盖两条轴线：①可观察性不均（点名 DSH 的 `agent_runtime_name`）；②**从历史 change_log 跨角色推导当次署名**（违反 03 §9 / 05 §11.0，已在 05.Att.01 read guardrail 收紧）。\n- 本 Spark #7-c 是**从当次系统提示直接取值**，方向与签名 Spark 第②条相反，不是同一问题，也不是签名 Spark「未覆盖的第三轴线」——它是误读，本无缺口。\n- 唯一残项：规则文本已支持直接采用，但早先 AI 仍误读为推导。这是文档清晰度的小改进机会（可考虑在 05 §11.0 补一句明确「产品接入面/系统提示当下给出的身份快照即可直接采用，无需哲学判断」），不是立项级缺口，不单项形成 WorkCase。\n\n#### 11.4 与签名 Spark 建立直接关系\n\n本 Spark 原仅与上位「服务质量评估」Spark 有 relation，与同家族的签名 Spark 无直接 relation。本次更正后补登一条 `related-to` 指向签名 Spark，使三字段署名家族线索可追溯。\n\n### 12. #3/#7-a/#7-b 已落地实现，#4 更正为误判（2026-08-17 复核实测 + 独立审核）\n\n本 Spark 第 9-10 节登记为证据点、暂不立项的三项交互摩擦，经代码实现落地后复核，状态更新如下。\n\n#### 12.1 已落地（提交 78b0ce92）\n\n第 9.5 节原计划\"窄 WorkCase（合并）\"的三项内容已直接在代码层实现，未走 WorkCase 立项流程：\n\n1. **#3 发现入口过重** → 新增 `capabilities --summary` 紧凑发现中间档。校验只允许 capabilities 且不得与 operation_key/--request/--fields/--example 并用；输出 operations 的 name/title/description/response_fields 闭集。实测 26 个操作 response_fields 全部非空。\n2. **#7-a response 字段闭集缺失** → `--example` 投影增加 `response_fields` + `result_contract` 字段。全部 26 个已注册操作声明 `response_fields`，字段名逐一对齐各操作真实 result 顶层键。\n3. **#7-b invalid_request follow_up 修复路径** → `service.py` 的 `read_failure_hints()` 在 invalid_request 时，对 follow_up 字段含 response_fields 引用时自动填充当前操作的 response_fields。\n\n**与第 10 节门槛判断的关系**：第 10 节遵守上位 Spark 证据门槛暂不立项窄 WorkCase，是正确的程序纪律——证据不足时不强行立项。但\"暂不立项\"不等于\"永不处理\"；当实现成本低于立项门槛（单提交、对齐既有机制、无契约变更）时，直接落地是合理路径。三项均属此类：改动面小、对齐既有机制、不改 04 正式契约。落地后可作为新的已交付基础供上位 Spark 证据积累引用。\n\n#### 12.2 #4 更正：不是 schema/操作缺口，是发现入口的形状盲区\n\n本 Spark 第 9.4 节声称「`read-fact-objects` 的 `fact_refs` **不接受 `object_uid`**——必须提供 `fact_type_key` + `object_id`」「正向跨一跳在当前公开操作下**无机械路径**」「建议作为 Study 立项」。**经复核实测 + 独立审核确认，此定性错误，更正如下。**\n\n**更正**：`read-fact-objects` 的 `fact_refs` **接受** `object_uid` 形状。规范 05 §11.0 定义 fact_refs 成员为互斥 union，第一项即 UID 形状 `{object_uid}`，第二项为 legacy 三元组 `{governed_project_id, fact_type_key, object_id}`。实测 `read-fact-objects(fact_refs=[{object_uid: \"01a00bd0-...\"}])` 返回 `outcome=ok` 并取得目标对象；两个 relation target 的 object_uid 均一次读到完整对象（含 fact_type_key/object_id/title/status）。正向跨一跳链路「read spark → 取 relation.target.object_uid → read-fact-objects with UID」机械可达，**不构成 schema/操作缺口**。\n\n**误判根因**：不是 schema 缺口，而是**发现入口的形状盲区**——调用方在调用前无法得知 `fact_refs[]` 成员允许 UID 与 legacy 两种互斥形状。具体证据：\n- `read-fact-objects` 未声明 `input_examples`（全量 26 个操作仅 5 个声明，read-only 16 个中仅 2 个声明），导致 `invalid_request` 的 hints 只返回字段名（`arguments.fact_refs`）而不返回成员形状。\n- `--example` 对 union 字段只给 null 占位（`fact_refs: null`），不展示两种合法形状。\n- 调用方传错形状（如 `{fact_id: ...}` 或字符串）后，hints 不指明\"应是 object 且含 object_uid 或 legacy 三元组\"，调用方误猜后误判为\"不接受 object_uid\"。本会话 lead 与审核 worker 都曾传 `{fact_id: ...}` 而触发此误判，证实形状盲区是稳定复现的摩擦源。\n\n**Study 候选撤回**：第 9.4 节升级的 \"relation 跨一跳 schema/操作缺口 Study 候选\" 予以撤回——它建立在误判之上。relation 用 UID 作稳定身份、类型通过 read 取得，是规范的合理解耦设计，无需补存 fact_type_key 或新增 uid 直查操作。\n\n**真实补强点**（替代 Study）：给 `read-fact-objects` 的 `OperationImplementation` 声明 `input_examples`，包含 UID 形状与 legacy 形状各一个 `arguments_fragment`。补上后：(1) `invalid_request` 的 hints 会自动多一条 `minimal_examples`，展示两种合法形状，调用方不再猜形状；(2) `--example` 的请求骨架也会从 null 占位变为真实形状（`build_example_projection` 已消费 input_examples）。改动面：单文件加约 20 行数据，对齐既有 `_read_operation_fix_hints` 消费机制，不改 04/05 契约。此补强点已经独立审核确认正确、最小、对齐既有机制。\n\n#### 12.3 推进路径更新\n\n基于 12.1/12.2，原推进建议更新为：\n1. **已完成**：#3（capabilities --summary）、#7-a（--example response 闭集）、#7-b（follow_up 修复路径）已落地（提交 78b0ce92）。\n2. **待实施**：#4 形状盲区补强——给 read-fact-objects 补 input_examples（UID + legacy 形状）。不立项，直接落地。\n3. **暂缓**：#5 状态机，等交互层证据成熟后再评估。\n4. **更正归档**：#1/#2 过时声称已在第 9 节更正；#4 误判在第 12.2 节更正，Study 候选撤回。\n\n### 13. #8-c/#8-d 已消解（2026-08-17 受控提交后复核）\n\n本 Spark 第 8 节记录的提交流程摩擦中两项已消解，状态更新如下。\n\n#### 13.1 #8-c Hook 状态检查工具链不完整 — 已消解（提交 e5ded375）\n\n第 8-c 节原称「`git-hooks-status` 的 `result.deployment_status` 返回 null」「只能回退到 `ls .git/hooks/commit-msg` + `head -5` 人工判断」。**复核确认该声称的根因是字段名误判**（与 #7-a 同类摩擦：`deployment_status` 字段不存在，真实字段闭集是 `status/worktree/common_hooks_dir/checks`，已被 #7-a 的 response 闭集修复覆盖）。但其**语义诉求真实**：模板 B-8 要求核对 Hook「有效、可执行、无冲突」，而 status surface 把已退休的 prepare-commit-msg 当受管面报告，迫使调用方做善后判定。\n\n**消解方式**：直接删除 prepare-commit-msg 的 status surface 与识别模板（`render_prepare_commit_msg_hook` / `_legacy_prepare_commit_msg_hook` / `_retired_prepare_state` 三函数），只保留部署期 marker+sha256 内容摘要证明为 LDVH 拥有就同事务删除的删除路径。改动 7 文件，净删 107 行。spec 09 §190 措辞改为「marker sha256 内容摘要证明」（保留冲突停止零写入保护），§240 surface 枚举去掉 prepare-commit-msg。`git-hooks-status` 的 checks 由 5 项收为 4 项。运行时路径早已干净（hooks/prepare_commit_msg.py 在 fb6af9f0 已删，runner 无 prepare-commit-msg 子命令），本次清理的是残留的退休迁移指纹机器。\n\n**与第 8-c 节原判断的关系**：原判断「靠人工信任而非工具确认」的残项已消解——prepare 不再作为受管面报告，部署期自动 marker+摘要删除，调用方无需人工 `ls+head`。#8-c 入口职责结束。\n\n#### 13.2 #8-d 署名 trailer null 格式边界 — 已处理（提交 9407aabc）\n\n第 8-d 节原称「`LDVH-Model-Name: null` 的写法是否合法？Git trailer 消费者能否解析 null 字面量？规则说不空 string 或 null，但 Git trailer 的书写约定无明确规范」。**已在提交 9407aabc 处理**：拒绝署名 trailer 字面量 null，并加 skill_path 目录容错。规则边界现已明确：署名 trailer 不接受 `null` 字面量，缺值时不写该 trailer 而非写 `null`。#8-d 入口职责结束。\n\n#### 13.3 余下未处置项\n\n- **#8-a 提交模板信息过载**：未处理。动 specs/15 行动模板规范，规范级改动，较重。本会话两次提交仍踩此摩擦（scope/body 小标题规则被 Git Gate 拒）。收益直接但需单独规划。\n- **#8-e 重新核对 scope 不明确**：#8-c 消解后残项变小（prepare 不再需人工核对）。残项是模板 B-8/C-3 核对步骤未说明每次 scope，轻量做法是补一句核对 scope 说明。\n- **#5 状态机**：维持暂缓，等交互层证据成熟后再评估。\n### 14. #8-a 已实施（2026-08-17 受控提交后复核）\n\n本 Spark 第 8 节记录的提交流程摩擦 #8-a（提交模板信息过载）已实施，状态更新如下。\n\n#### 14.1 #8-a 提交模板信息过载 — 已实施\n\n**问题**：git-commit 行动模板约 200 行，AI 每次提交都必须完整读完，即使本次只是简单提交。大量内容与当前场景不相关（WorkCase 授权判断、拆分政策、push/PR 排除等），但 AI 无法提前预判哪些适用。\n\n**方案**：给 `read-action-template-content` 增加可选 `heading_path` 参数（长度 1 或 2 的 string array），支持按 H2/H3 标题精确选节返回模板内容。\n\n**改动（5 文件，+179/−11 行）**：\n- `code/ldvh/helper/operations/action_template_request.py` — `CONTENT_OPTIONAL_INPUTS` 加 `arguments.heading_path`，`parse_action_template_request` 解析 heading_path（长度 1 或 2，非空 string，精确匹配）\n- `code/ldvh/helper/operations/action_template_operation.py` — `_content()` 加 `heading_path` 参数，新增 `_resolve_heading()` 搜索 H2/H3 在定义范围的位置，新增 `_content_slice()` 按行区间切片；精确匹配失败时抛出 `OperationRequestError`\n- `specs/06-行动模板基础规范.md` — 更新 §9.6 契约，说明 `heading_path` 可选字段及选节行为\n- `code/tests/helper/test_action_template_operation.py` — 新增 3 个测试：H2 选节、H3 选节、不匹配时拒绝\n- `code/tests/helper/test_cli_process.py` — 更新 `optional_inputs` 断言\n\n**验证**：全量测试 2095 passed（排除 yaml_portability 测试的 node 环境问题），ruff 干净。\n\n**与第 8 节原判断的关系**：原判断「必须完整读完 200 行才能开始执行」已消解——AI 现在可指定 `heading_path=[\"5. Git 提交行动模板定义\", \"5.3 行动步骤与分支\"]` 只获取约 30 行的核心步骤，或 `heading_path=[\"5. Git 提交行动模板定义\"]` 获取完整定义范围（不含第 6-8 节验证/Human Gate/Stop Conditions）。向后兼容，不传 `heading_path` 时保持原有 200 行完整行为。\n\n#### 14.2 #8-e 重新核对 scope 不明确 — 已实施（提交 ccb336ac）\n\n第 8-e 节残项（B-8/C-3 核对步骤未说明 scope）已通过给 30-Git提交行动模板.md 两处补范围说明解决：\n\n- **B-8**：明确核对范围覆盖 B-1 以来所有可能影响候选快照一致性、机械合规性或 Hook 前置条件的项目；核对后状态发生变化时回到本阶段重新预检，不得仅选取部分项核对。\n- **C-3**：明确提交后核对范围包括 commit identity/message、真实 Hook 触发可观察证据、提交后真实 Index/Working Tree 全部剩余变化、提交快照与已声明候选一致性。\n\n改动 1 文件 +2/−2，模板正文两处，未触碰 06 契约或代码。#8-e 入口职责结束。\n\n#### 14.3 #5 状态机 — 不处理，Spark 关闭\n\n**#5 记录的问题**：Spark 无状态机/候选队列提示，是 open/P2 还是 implemented、候选是否达到立项门槛全靠人读语义。\n\n**不处理的原因**：\n\n1. **性质不同**：#5 不是交互摩擦，而是治理工具本身的元问题。它不阻碍 AI 完成任何实际任务——本 Spark 记录的 #1-#4、#7-#8 共 8 项摩擦已在没有状态机的情况下全部处置完毕（#3/#7-a/#7-b 落地代码、#4 更正为误判、#8-a 实现 heading_path 选节、#8-c 删 prepare surface、#8-d 拒署名 null、#8-e 补核对范围）。没有状态机并未使决策失真或遗漏。\n2. **成本收益不成立**：给 Spark 增加状态机需要改 05 事实模型（规范级改动），但本 Spark 全部实际摩擦项已无需状态机即可处置。投入与产出不匹配。\n3. **存在替代机制**：Spark 的 `status` 字段（open/implemented）、`priority` 字段、`change_log` 流水和 `relation` 追溯已提供足够机械信号。缺失的「待判断」「待立项」等中间状态可由 AI 在 summary 中自由记录，无需强制状态闭集。\n4. **证据门槛未达**：上位 Spark（服务质量评估）已要求 40 会话可比基线才能立项治理工具改进。本 Spark 单会话 N=1 的实测不达标，且没有证据表明状态机缺失在实际治理中造成过阻塞或误判。\n\n**结论**：#5 登记为「不处理」并关闭本 Spark。本 Spark 全部实际摩擦项已处置完毕：3 项代码落地（capabilities --summary／--example response 闭集／follow_up 修复路径）、2 项代码更正（prepare surface 删除／署名 null 拒绝）、1 项规范代码落地（heading_path 选节）、1 项规范补正（核对范围说明）、2 项更正归档（#1 stdin 过时声称／#4 误判撤回 Study 候选）。"
