  status: completed
  approach_summary: 先以 spark-0044、21 §6.7/§7.3/§11.3 和现有 close-workcase 实现为依据形成 Code Plan，再修改最小权威规范；不触及 00/04/05、Web、Schema 或行动模板。
  result_summary: 已形成并登记当前 Code Implementation Plan；specs/21 已定义只读候选操作、完整非托管 closed 候选、proposal-stored mapping basis、source fingerprint 失效和真实 close 事务边界。05.Att.02 的覆盖登记留待测试实现完成时同步。
- item_id: item-02
  goal: 抽出 proposal 到 closed 非托管 after 的唯一纯映射并让 close validator 消费。
  expected_result: workcase_update.py 中只有一份字段映射；纯函数生成完整非托管 candidate，_close_mapping_issues 直接以该结果校验调用方 after，既有关闭行为保持等价。
  status: completed
  depends_on:
  - item-01
  approach_summary: 从当前 _close_mapping_issues 内部计算抽出确定性 projector；用稳定 ID/目标身份处理 residual 与 routed-to，并保留三类非 proposal relations，禁止引入第二状态机或语义判断。
  result_summary: 已在 workcase_update.py 建立完整非托管 closed candidate 的唯一纯 projector 与 proposal-stored route basis；close mapping validator 直接消费同一投影，同时保留 residual 按 ID、relations 按身份集合比较的既有无序语义，完整 close application 回归通过。
- item_id: item-03
  goal: 实现并登记 prepare-closed-workcase-candidate 只读 Helper 操作。
  expected_result: 新 request/operation 只接受 fact_ref 与共同定位，读取当前合法 before 后返回 source fingerprint、完整非托管 candidate 与 proposal-stored mapping basis；capabilities 和安装发行快照可发现，全部失败路径零写。
  status: completed
  depends_on:
  - item-02
  approach_summary: 复用现有 governance/read boundary 和共享 projector，不调用耐久写、协调锁或 target validation；invalid/unavailable/rejected 分层沿用 Helper 共同响应。
  result_summary: 已实现并登记 prepare-closed-workcase-candidate 只读 Helper；请求只接受 fact_ref 与共同定位，操作只读 source、不读 target、不取锁、不写入。相同 route target 的 proposal 指纹冲突会复用纯 snapshot parser 拒绝；capabilities、service/CLI、规范目录和发行快照均纳入授权矩阵。
- item_id: item-04
  goal: 建立共享映射、只读边界和公开操作的完整回归证据。
  expected_result: 白名单测试覆盖正向映射、parity、mutation、输入闭集、phase/status/invalid/unavailable、无 target read/无锁/无写、旧 fingerprint 与真实 close CAS 边界；目标回归、Ruff、diff、事实完整性与 dirty 隔离通过。
  status: cancelled
  depends_on:
  - item-03
  approach_summary: 新增 candidate request/operation 直接测试并扩充现有 close/application、Helper registry、spec source-contract 与 packaging tests；不创建 Web 或第二模型测试。
  result_summary: 授权白名单矩阵 171 passed，目标 Ruff、format 与 git diff --check 通过，独立 Reviewer 复审 pass；但全量 code/tests 因新增公开 operation 使白名单外 code/tests/doctor/test_doctor.py 固定 operation_count 19→20 而失败，另有既有基线失败。该文件不在 execution_authorization 内，故取消全量通过部分并保留明确残余，不声称 criterion-validation-review-commit-isolation 已满足。
