type: change
title: 强化 Tools 测试创建与验收要求
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  specs/12.01-Tools辅助规范.md 已要求 Tools 新增或修改时同步补充自动化测试，但对测试验收环节强调不足。
  现有规范没有明确要求 Tools 新增、修改或升级为 active 时必须执行测试，并将测试命令和结果写入 Change 记录、任务证据或人工验收材料。
  ADR Tools 子文档已声明测试文件，但未把测试命令、验收记录和测试未通过不得验收通过作为明确门槛。
decision: |
  1. 将 specs/12.01-Tools辅助规范.md 的“Tools 测试原则”升级为“Tools 测试与验收原则”。
  2. 明确 Tools 新增、修改或升级为 active 时，必须创建或更新测试、执行对应测试并记录测试命令和结果。
  3. 明确测试未通过时不得声称 Tools 能力已经完成落地或验收通过。
  4. 更新 specs/04-LDVH模型子文档规范.md，要求 active Tools 子文档说明测试文件路径、测试命令、测试覆盖范围和验收记录要求。
  5. 更新 ADR 主文档和 21.04-Tools.md，将 ADR Tools 测试验收纳入初始化、审计、合规检查和子文档检查项。
consequences: |
  - 后续所有 Tools 实体实现都必须具备测试创建与测试验收环节。
  - Change 记录、任务证据或人工验收材料需要记录测试命令和测试结果。
  - ADR Tools 的测试命令固定记录为 python3 -m pytest tests/tools/test_adr_index.py。
  - 无法自动化覆盖的 Tools 行为必须说明替代检查方式和验收结论。
affects:
  - specs/12.01-Tools辅助规范.md
  - specs/04-LDVH模型子文档规范.md
  - specs/21-ADR-决策记录.md
  - specs/21.04-Tools.md
