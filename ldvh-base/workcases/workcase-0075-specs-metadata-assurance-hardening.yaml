verification_evidence: |
  ## 验证计划

  验证 0075 是否把 specs 头部元信息契约从规范设计推进到 Code 可诊断、Web 边界清楚、docs 可变资料区降级边界清楚的落地状态。

  ## 验证命令

  ```bash
  rg -n "^>\s*(文档编号|文档类型|集合状态|canonical_path|schema_anchor|state_machine_anchor|human_gate_anchor|scenario_anchor|context_anchor|gate_anchor|execution_anchor|writeback_anchor|evidence_anchor|testability_anchor|code_consumption)[：:]" specs
  python3 -m pytest tests/code/specs_validate_checks/test_index.py -q
  python3 code/specs_validate.py index --fail-on-diagnostics
  python3 code/specs_validate.py all --fail-on-diagnostics
  npm run check
  ```

  ## 验证结果

  落地内容：
  - `code/spec_checks/index.py` 新增 `LDVH_MEMBER_HEADER_FIELD_FORBIDDEN`，机械检查 20-39 / 40-59 普通头部不得重复登记成员自描述字段。
  - `tests/code/specs_validate_checks/test_index.py` 新增反例测试，确认 `文档编号`、`集合状态`、`canonical_path` 出现在普通头部会被诊断。
  - `specs/03.01-规范文档规范.md` 明确当前 Code 默认检查范围是 `specs/` 正文区；`docs/studies/` 和 `docs/sources/` 暂不进入默认 specs 派生索引扫描，修改时执行人工降级检查。
  - `web/docs/00-Architecture.md` 明确 Web 当前不消费 specs 头部元信息作为可编辑对象状态；未来展示只能来自 Git 文件或 Code 派生只读 API，不反向制造事实源。

  校验结果：
  - 普通头部重复成员字段扫描：无命中。
  - `python3 -m pytest tests/code/specs_validate_checks/test_index.py -q`：48 passed。
  - `python3 code/specs_validate.py index --fail-on-diagnostics`：通过，diagnostics=0。
  - `python3 code/specs_validate.py all --fail-on-diagnostics`：通过。
  - `npm run check`：通过；Web 类型检查、Web build、Web API 测试、234 条 Python 测试和 specs 检查均通过。

  ## 结论

  0075 的机器落地、规范边界和 Web 消费边界已完成，但 Human 复审澄清：真正目标不是继续硬化普通 `> 字段：值` 头部，而是新增更上位的结构化 `ldvh_doc` 文档自描述块，统一所有 specs 文档元信息。该目标已分流到 workcase-0076。
closure_evidence: |
  ## 验证计划

  审查 0075 是否可以关闭，并确认机器落地完成后是否仍存在需要继续分流的缺口。

  ## 验证命令

  ```bash
  python3 code/fact_validate.py ldvh-base/workcases/workcase-0070-specs-header-metadata-contract.yaml ldvh-base/workcases/workcase-0075-specs-metadata-assurance-hardening.yaml
  python3 code/specs_validate.py all --fail-on-diagnostics
  npm run check
  ```

  ## 验证结果

  0075 已完成现有普通头部契约的窄硬化，并在 Human closure review 中发现上位目标偏差。关闭前需要 Human 确认三个边界：
  - 接受 `docs/studies/` 和 `docs/sources/` 暂不进入当前默认 specs 派生索引扫描，后续如要纳入需另起计划设计扫描范围、doc_kind 和诊断等级。
  - 接受 Web 目前只声明消费边界，不新增 specs 元信息展示页面或可编辑入口。
  - 接受 `ldvh_doc` 统一结构化文档元信息作为新目标，由 workcase-0076 承接，不塞回 0075。

  ## 结论

  若以上边界确认，0075 可关闭；真正的统一硬化由 workcase-0076 执行。
