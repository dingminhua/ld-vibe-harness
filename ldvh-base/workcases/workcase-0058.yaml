execution_authorization:
  authorized_actions:
  - action_id: authorization-01-specification-and-projection
    summary: 修订提交消息最低正文规则、附件投影及必要的直接规范测试。
    target_scope: 仅 specs/03、specs/attachments/03.Att.01 及其直接测试；specs/30 仅在直接引用确需对齐时最小修改。
    effect_scope: 允许建立所有提交最低正文不变量、投影闭集和标题解析边界；禁止复制权威或扩大到接入架构。
    risk_summary: 规则表述不清或投影失配可能导致误放行、误阻断或第二权威。
    rollback_summary: 在未提交前以定向补丁修正；不能一致时停止并返回 Human，不回退现有历史。
    rule_refs:
    - specs/01-规范模型基础规范.md
    - specs/03-事实源与信息溯源规范.md
    - specs/06-行动模板基础规范.md
  - action_id: authorization-02-code-and-tests
    summary: 更新提交规则投影、同一 validator 及直接自动化测试。
    target_scope: 仅 code/ldvh/commits/contract_source.py、validation.py 和提交 contract/validation/helper precheck/native gate/真实 Git Hook 直接测试及必要 fixture。
    effect_scope: 允许实现 fail-closed 投影消费、最低正文与标题结构校验和清晰诊断；不得改变事实语义审查或无关 Git 功能。
    risk_summary: 解析边界错误可能误拦合法提交或让空正文、重复标题和跨区列表绕过。
    rollback_summary: 使用定向补丁撤回本案代码差异；保留失败测试证据，不使用 destructive reset。
    rule_refs:
    - specs/03-事实源与信息溯源规范.md
    - specs/07-Code 工程实践规范.md
    - specs/30-AI 行动协议.md
  - action_id: authorization-03-verification
    summary: 执行静态 Hook 复核、临时仓库真实 Git 事件和相关回归验证。
    target_scope: 当前 worktree 的只读状态、共享 common-dir Hook 的只读 inspect、mktemp 隔离仓库及本案相关测试集合。
    effect_scope: 允许创建并清理隔离临时仓库、安装当前 Hook 到该临时仓库、运行真实 commit allow/block、pytest、ruff、diff 与事实完整性检查；不得部署或替换真实 common-dir Hook。
    risk_summary: 测试可能产生临时 Git 对象或暴露跨平台未覆盖项；误操作真实 Hook 会扩大影响。
    rollback_summary: 停止失败测试并清理明确的临时目录；真实仓库只读对象不变，任何无法清理残留如实报告。
    rule_refs:
    - specs/03-事实源与信息溯源规范.md
    - specs/07-Code 工程实践规范.md
    - specs/09-环境接入规范.md
  - action_id: authorization-04-fact-update
    summary: 通过 Helper 修正 spark-0019 并维护本 WorkCase 活动期事实。
    target_scope: 仅 ldvh:spark:spark-0019 与 ldvh:workcase:workcase-0058，经当前 Helper 的受控单对象操作。
    effect_scope: 允许把 Spark 中单文件可省正文的危险表述改为普遍最低正文，并按实际进展更新 WorkCase；每次写后回读并检查事实完整性。
    risk_summary: 过期指纹、语义覆盖或误改其它事实会污染事实源。
    rollback_summary: CAS 或完整性失败即停止；只提交完整 after，不直接编辑受管事实文件。
    rule_refs:
    - specs/05-事实模型基础规范.md
    - specs/21-WorkCase-工作项.md
    - specs/24-Spark-想法与议题.md
  - action_id: authorization-05-delegate-result-review
    summary: 委派实施结果的必经独立只读复核。
    target_scope: 仅 workcase-0058 当前 plan、实施 diff、测试证据、Hook 事件证据、Spark 更新和提交前候选。
    effect_scope: 允许新独立 Reviewer 只读检查绕过、误判、规则投影、回归和授权越界，不允许其修改文件或替 Human 决策。
    risk_summary: Reviewer 不独立或证据范围不足会削弱最后质量关口。
    rollback_summary: 拒绝不独立、不可回指或越界的 review，重新委派并保持未关闭状态。
    rule_refs:
    - specs/06-行动模板基础规范.md
    - specs/21-WorkCase-工作项.md
  - action_id: authorization-06-record-result-review
    summary: 由 Controller 核验并受控记录独立结果复核。
    target_scope: 仅 workcase-0058 的当前 result projection 与 Reviewer 实际反馈。
    effect_scope: 允许核对 reviewer 独立性、被审版本、证据和反馈处置后经 Helper 写回；不自动批准结果或关闭。
    risk_summary: 遗漏反馈或记录错误版本会形成虚假质量门证据。
    rollback_summary: 被审结果变化即升 result_version 并重新复核；不能核实时停止进入 Gate 2。
    rule_refs:
    - specs/06-行动模板基础规范.md
    - specs/21-WorkCase-工作项.md
  - action_id: authorization-07-local-commit
    summary: 在全部前置条件通过后创建一次精确本地 Git commit。
    target_scope: 仅本案经声明、逐文件 diff 审核并与真实 staged 集合精确一致的规范、代码、测试、spark-0019 与 workcase-0058 候选。
    effect_scope: 允许在真实 Index 上执行 precheck-git-commit，并用原生 git commit 创建一次本地提交；commit-msg Hook 必须真实触发，不使用 --no-verify，不 push。
    risk_summary: 候选不精确、无关 staged、消息不合格或 Hook 未触发会造成错误提交或闸门失效。
    rollback_summary: 提交前任何失败均停止且不碰无关改动；提交后只回读并如实报告，不 amend、reset、rebase 或自动重试。
    rule_refs:
    - specs/03-事实源与信息溯源规范.md
    - specs/21-WorkCase-工作项.md
    - specs/30-AI 行动协议.md
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-05-delegate-result-review
    result_review_action_id: authorization-06-record-result-review
  action_ceiling: 仅当前 ldvh v4 worktree 内本案列明的规范、规则投影、validator、直接测试、spark-0019、workcase-0058，一处共享 Hook 的只读 inspect、隔离临时 Git 仓库验证、一次精确本地 commit 和必经独立只读结果复核。
  prohibited_actions:
  - amend、reset、rebase、历史 commit 改写或旧消息迁移
  - push、PR、发布或任何远端写入
  - 使用 --no-verify 或绕过 commit-msg Hook
  - 修改、部署、替换真实 common-dir Hook 或 core.hooksPath
  - 引入 pip 安装、wheel、sdist、editable distribution、打包或插件部署
  - 修改、暂存、清理、覆盖或代为处理任何无关 dirty/untracked/staged 文件
  - 把 Hook 的机械结构检查表述为语义真实性或内容充分性审查
  allowed_adjustments: 允许在既定职责内调整稳定 trigger/code 名称、所选 Markdown 列表 marker 语法、错误聚合方式、直接测试文件位置与 30 的必要引用对齐；前提是普遍最低正文、投影单一权威、真实 Hook 正反事件、无重部署和风险上限不变。任何扩大受管文件、接入架构、部署、远端动作或提交次数的变化必须停止并返回 Human；实质 PlanDelta 需升版并 fresh review。
  verification_and_rollback: 逐层验证规则原文与附件投影、contract-source fail-closed、validator、Helper/native gate 一致性、临时仓库真实 Git 事件、定向和相关全量回归、ruff/diff、事实完整性及无关 dirty 隔离。提交前声明候选并审核 diff，确认真实 Index 精确一致，precheck passed 和 managed Hook 可执行；提交后回读 HEAD/tree/message/Index/工作树且不 push。失败时停止、保留诊断、仅用定向补丁修正本案未提交变化，不执行破坏性历史操作。
  out_of_bounds_handling: 任何范围、权限、规则权威、Hook 状态、测试证据或无关 staged 内容超界时立即停止；不请求隐式扩权，不接管无关变化，记录实际阻塞并返回 Human 决定。
  human_prerequisites:
  - Human 在 Gate 1 明确批准 workcase-0058 plan_version 1 及完整 execution_authorization
  - 本地提交前仍满足用户已确认的边界：仅创建本地 commit，不 push，真实 commit-msg Hook 不可绕过
