summary: "**当前结论**\n\n- 原议题准备以环境 Pre/Post Tool Hook、插件 payload 和 direct-write guardrail 保护规范与事实路径，并研究 orientation、deny/allow、post-write audit 和真实触发矩阵。\n- Human 当前架构决定明确取消全部环境 Hook、插件和 adapter 接入形态，不保留可选升级路径；唯一接入是薄 Skill 路由稳定 CLI，过程机械检查必须执行，Git Gate 只作提交前终局把关。因此，本 Spark 的实现前提和候选验收面已经退出当前架构。\n- 继续跟踪会重新引入已否决的环境分叉、信任与版本对齐成本，并使工具 Hook 被误解为受控写入权威或完整阻断边界。既有 `related-to` 关系仅保留历史主题关联，不构成承接、后续处理或分流声明。\n\n**处置边界**\n\n本次只决定不再跟踪 Hook guardrail 方案；不建立 `routed-to`，也不把直接写入风险、过程检查或 Git Gate 的其它责任写成由本 Spark 承接或完成。"
evolution:
- at: '2026-07-24T18:36:37+08:00'
  summary: 官方 Codex Hooks 资料确认了 PreToolUse 阻断、additionalContext 与 PostToolUse 反馈的候选能力，同时明确工具覆盖存在例外且事后事件不能撤销副作用；因此当前方向从泛化的“写前/写后保护”收敛为薄 Hook 下彼此独立的 orientation、事实直接写入 guardrail 和事后诊断，并把 Specs 保护移出第一阶段。
- at: '2026-07-24T19:41:53+08:00'
  summary: 补充 ADR/Pitfall 在生产过程中的生效链：事实对象本身不取得规则或阻断权威；ADR 在任务明确需要项目事实后形成决策基线并由 AI 判断适用，Pitfall 按症状、触发、环境和方案进行 F2 召回；实际约束进入 WorkCase，强制行为必须由 Specs/Code/tests/Gate 正式吸收。同时记录当前 SessionStart facts:not_requested 与 21/22 会话级 F1 要求的张力，以及本项目实际候选读取因 workcase-0012 无效而 partial 的覆盖缺口。
- at: '2026-08-01T01:58:26+08:00'
  summary: 唯一薄 Skill 接入的当前架构决定已明确取消 Hook/插件/adapter 方案，使原 guardrail 调查的前提与验收面退出当前方向，因此不再继续跟踪。
disposition_summary: Human 决定废弃该 Hook guardrail 调查：当前唯一接入形态明确排除环境 Hook、插件和 adapter，也不保留可选升级路径，故原方案及其真实触发矩阵不再具有当前跟踪价值。现有普通 `related-to` 关系仅为历史主题关联；本次废弃没有承接目标，不声明任何后续处理或分流。
