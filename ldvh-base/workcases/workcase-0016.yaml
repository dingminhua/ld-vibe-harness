  status: completed
  result_summary: 已实现四状态 Pitfall Schema 与状态边、status-only promote、保留正文 discard、WorkCase suggestions 与三类 disposition、route_existing 到 WorkCase/Spark、contributed-to 仅 draft Pitfall、related-to 成环/重叠/关闭保留及候选召回边界，并补齐正反测试。
