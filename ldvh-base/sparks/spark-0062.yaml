title: macOS POSIX 原子写入系统复杂度评估——file_and_directory 层级在开发机场景下是否过度
intent: filesystem.py 的 POSIX 原子写入路径（_atomic_create_posix、_atomic_store_posix、_atomic_replace_posix）实现了 file_and_directory 级耐久保护——包含内容 fsync + 目录 fsync + 异常恢复 + 六种 outcome 状态机。但在 macOS 开发机场景（带电池、本地 SSD、单用户串行操作）下，目录 fsync 和异常恢复分支的触发概率接近零，且其状态复杂度向上传导到所有事实操作应用层（creation/update/workcase_update 等模块均依赖 AtomicWriteResult 的 108 种组合）。需要独立审核判断：哪些层是真实必需的，哪些可以简化以降低维护负担和调用方复杂度，同时不削弱 LDVH 事实系统的核心完整性保证。
status: routed
disposition_summary: '5 项问题: durability/cleanup 已移除，fsync/reconciliation 保留且有理由，outcome 判断已修正(仅 stored 死代码)。routed→workcase-0079+cleanup commit。'
summary: "## 问题\n\n`code/ldvh/filesystem.py`（1115 行）提供了四套原子写入原语（create/store/replace/remove），每套分别有 POSIX 和 Portable 两个实现分支。POSIX 分支实现了完整的 `file_and_directory` 耐久语义：\n\n```\n临时文件写入 → fsync(文件) → os.link/os.replace(发布) → unlink(临时) → fsync(目录)\n```\n\n而 Portable 分支（供 Windows 使用）止于 `file_only`——不做目录 fsync，硬编码返回 `\"file_only\"`。\n\n在 macOS 开发机上，这套系统的实际保护效果是：\n\n- **文件级 fsync**：有价值，防止 SSD 写缓存丢失数据\n- **目录 fsync**：macOS 笔记本带电池，本地 SSD，断电窗口极小；加上目录 fsync 比文件 fsync 的额外保护收益趋近于零\n- **异常恢复（reconciliation）**：`os.link` 或 `os.replace` 失败后读取回比对确认是否实际已提交——POSIX 系统极少返回假阳性错误\n- **108 种状态组合**：`AtomicWriteResult(outcome=6, namespace=3, durability=3, cleanup=2)`——但消费端（creation.py、update.py、update_application.py、workcase_update.py 等）实际只区分 outcome=\"created/stored/replaced\" vs \"conflict/unavailable\" + namespace=\"committed\" vs \"not_committed\"，`durability` 和 `cleanup` 在应用层几乎从不判断\n\n## 数据\n\n| 指标 | 值 |\n|------|-----|\n| filesystem.py 总行数 | 1115 行 |\n| 原子写入函数数（公开+内部） | 9 个 |\n| AtomicWriteResult 引用处（含测试） | ~96 处 |\n| `_reconcile_replace` 单函数行数 | ~30 行 |\n| `durability` 字段在应用层的实际判断 | 仅 `durable_writes_enabled()` 用于平台策略，应用层几乎不消费 |\n\n## 必要的核心\n\n1. **临时文件 + 原子发布（os.link/os.replace）**——防止半写、乱码、并发覆盖，这是事实系统的根基\n2. **文件级 fsync**——确保内容真正落盘，SSD 写缓存不可靠\n3. **O_NOFOLLOW + is_link_or_reparse 检查**——防止 AI agent 被 prompt injection 诱导写向意外路径\n4. **create vs store 的语义区分**——create 拒绝覆盖已存在文件，store 允许替换，这是事实系统的不变式\n5. **写后回读验证**——通过 `_comparison_bytes` 确认实际写入内容\n\n## 可能过度的部分\n\n1. **目录 fsync（`os.fsync(directory_fd)`）**——在带电池的 macOS 上几乎零收益；SSD + 笔记本 + 非服务器场景下，目录条目丢失的风险极低\n2. **`_reconcile_replace`（第 841 行）**——专门处理 \"os.replace 返回了错误但实际已提交\" 的罕见场景；在 POSIX 上该分支几乎从不触发\n3. **`durability` 三维状态**——`\"file_and_directory\"` / `\"file_only\"` / `\"unknown\"` 三个值，在 POSIX 上实际只用到 `\"file_and_directory\"` 和 `\"unknown\"`，且应用层从不根据这个值做决策\n4. **`cleanup` 状态**——`\"clean\"` / `\"residue\"`，临时文件清理失败的概率极低，且残留的 `.tmp` 文件对系统无害\n5. **outcome 六种值的粒度**——`\"created\"` / `\"replaced\"` / `\"stored\"` / `\"removed\"` / `\"conflict\"` / `\"unavailable\"`，其中 `\"created\"` vs `\"stored\"` vs `\"replaced\"` 的区分在调用方没有实质性差异（都是\"写成功了\"）\n\n## 与 spark-0055 的关系\n\nspark-0055 讨论的是 **LDVH 整体流程的复杂度是否过度设计**（模板激活层数、规范交叉引用、80/20 倒置）。本 Spark 聚焦一个具体的、可独立判断的技术问题：**filesystem.py POSIX 写入路径的 file_and_directory 层级在 macOS 上是否过度**。两者不冲突——本 Spark 如果确认过度，可以产生一个 WorkCase 做简化；如果确认合理，则关闭为 `discarded`，spark-0055 的宏观判断不受影响。\n\n## 需要审核判断的事项\n\n1. **目录 fsync 是否保留？**\n   - 选项 A：完全移除，POSIX 和 Portable 统一为 file_only，去掉 `durability` 维度\n   - 选项 B：保留，但只在能可靠支持的平台（Linux 服务器）启用，macOS 不做\n   - 选项 C：保留现状——\"宁可多做不要少做\"\n\n2. **reconciliation 是否保留？**\n   - 选项 A：移除，`os.replace` 失败直接返回 `unavailable`，不做读回比对\n   - 选项 B：保留——安全纵深，成本不高\n\n3. **AtomicWriteResult 是否简化？**\n   - 选项 A：压缩为 `WriteResult(outcome: Success|Conflict|Unavailable)`——3 种状态\n   - 选项 B：保留 namespace 但去掉 durability 和 cleanup——4 种组合\n   - 选项 C：保留现状——4 维 108 种组合\n\n4. **POSIX 与 Portable 是否合并？**\n   - 选项 A：合并，统一用 Portable 路径（file_only），POSIX 特有功能（目录 fd、O_NOFOLLOW）作为可插拔增强\n   - 选项 B：保留两套——Windows 的 NTFS 行为确实不同\n   - 选项 C：合并为基于 `pathlib` 的简化实现，不依赖 `dir_fd`\n\n## 边界\n\n- 本 Spark 只讨论 POSIX（macOS）路径的复杂度，不讨论 Windows Portable 路径（那是另外的议题）\n- 不要求修改任何调用方语义——即使简化，公开函数签名可以保持不变（内部实现简化，外部保持兼容）\n- 不涉及 `remove_relative_if_equal`——它的复杂度水平是合理的\n- 简化后仍必须保留：原子性（不半写）、冲突检测（create 不覆盖）、路径安全（拒绝 symlink）、写后回读\n- 测试代码的修改范围是判断结果的一部分——如果简化导致测试减少 60% 以上，这是一个正面信号\n\n## 候选方向\n\n1. **最小简化**：保留 POSIX 路径结构，去掉目录 fsync 和 reconciliation，durability 固定为 `\"file_and_directory\"`，移除 `cleanup` 维度——filesystem.py 从 ~120 行写入代码减到 ~60 行\n2. **中等简化**：合并 POSIX 和 Portable 为一个公共实现，基于 `os.replace` 而非 `os.link`（replace 在 POSIX 和 Windows 上均可跨文件系统原子操作），去掉 `src_dir_fd`/`dst_dir_fd` 参数——filesystem.py 写入代码减到 ~40 行\n3. **激进简化**：将 `AtomicWriteResult` 降级为简单枚举，`durability` 和 `cleanup` 移入调试日志级别而非返回类型，公开函数返回 `WriteResult(outcome, namespace)`——调用方判断复杂度大幅降低\n\n## 参考\n\n- `code/ldvh/filesystem.py` 第 508-595 行（_atomic_create_posix）\n- `code/ldvh/filesystem.py` 第 682-746 行（_atomic_store_posix）\n- `code/ldvh/filesystem.py` 第 841-861 行（_reconcile_replace）\n- `code/ldvh/filesystem.py` 第 869-996 行（_atomic_replace_posix + _atomic_replace_portable）\n- `code/tests/facts/test_atomic_write.py`（413 行，23 个测试，大部分测试 POSIX 耐久分支）\n- `code/ldvh/facts/creation.py` / `creation_application.py` / `update.py` / `update_application.py` / `workcase_update.py`（AtomicWriteResult 消费端）\n- spark-0055（LDVH 流程复杂度是否过度设计——宏观议题）\n\n\n## 最终处置（2026-08-08 独立审核）\n\ndurability/cleanup 已完全移除；fsync 保留调用不追踪状态；reconciliation 保留(POSIX+Windows)；outcome 判断修正：仅 stored 是死代码，created/replaced 有语义价值。总体目标达成，routed→workcase-0079 closed。"
