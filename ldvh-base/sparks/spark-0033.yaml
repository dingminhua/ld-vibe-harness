title: 五类事实对象字段职责一致性
intent: 保留五类事实类型在公共或相近字段上的定义、绑定和实际记录是否一致的问题，避免 05 的统一字段登记与类型来源看似满足结构约束，但对象实践仍把状态、恢复、结论或承接写入错误字段，造成重复权威或终态残留。后续需区分哪些差异是类型语义所需，哪些是定义、绑定、验证或写入实践的偏离，并确定最小修正和迁移范围。
status: open
priority: P1
summary: "**已观察的触发事实**\n\n- `workcase-0011` 已进入 `closed`，其顶层 `summary` 仍保留“等待 Human 对 result_version 1 作第二次关闭确认”。这不应被仅当作一句过期文案：它暴露了 `summary`、`resume_from`、`waiting_on`、`status`、`phase` 与关闭记录之间可能存在职责重叠。\n- 05 已要求 foundation 字段保持共同语义、类型只能单调收紧，且相似字段必须经语义比较后复用、提升或明确区分；因此需核对的是规则、类型绑定、实际对象和消费投影之间何处脱节，而不是预设 05 缺少要求。\n\n**待完成的交叉核对**\n\n- 对 Spark、WorkCase、ADR、Pitfall、Study 的类型字段使用绑定、专属字段定义、生命周期和 F1/F2 消费投影逐项建立字段职责对照，重点检查公共字段及 `summary`、`abstract`、`decision`、`validation_summary`、`disposition_summary` 等相同或相近信息位。\n- 结合各类型当前对象的代表性非终态和终态记录，核对实际内容是否把状态、下一动作、等待、结果、证据、承接或历史变化无损重复到不应承载它的字段；明确实际检查范围与未检查对象，不以少数样本推出全量结论。\n- 区分有意的类型差异、05/类型来源之间的定义或绑定缺口、以及规则已充分但创建或更新实践偏离三类结果；随后才决定应修订 05、某一类型来源、验证/创建流程，还是仅对具体对象做受控更正。\n\n**长文阅读与复制路径要求**\n\n- 核对长文内容的消费规范是否已在所有对象详情、扩展阅读区和同一字段的不同投影中统一到高标准：Markdown 的标题层级、段落、列表、表格、代码、引用和链接应忠实保留；长文应有稳定、可扫描的层次与渐进展开方式，不能退化为原始标记、卡片碎片或需要读者自行拼接的大段文字。该要求应以字段语义和内容结构为依据，而非仅以字符数、固定文章模板或页面类型判断。\n- 核对复制入口的来源与文案是否同样统一：对象和本地文档的复制值必须来自精确读取返回的 `canonical_path`，并使用系统可定位的完整绝对路径，不得从对象 ID、路由、相对路径或展示文本猜测；外部 URL 的“复制链接”则保留完整原始 URL。需明确各场景的来源缺失、不可读或路径未确认时不显示或不执行复制的行为。\n- 判断这些阅读和复制约束应由字段内容格式、Web 交互规范、类型专属阅读布局还是它们之间的明确引用承担；避免多处平行表述后出现渲染、复制值与 tooltip 语义漂移。\n\n**边界**\n\n- 不预设同名字段在五类对象中必须承担完全相同的类型语义，也不以字段名相近直接判定冲突。\n- 在完成独立核对、明确受影响来源和取得必要 Human 同意前，不批量改写事实对象、不迁移字段、不把当前观察宣布为五类对象的普遍缺陷。"
