title: 子 Agent 复查编排流程缺口
status: pending
created: '2026-06-21T10:02:20.884225'
updated: '2026-06-24T09:29:37+08:00'
description: |
  本 Spark 承载一个待收敛的流程缺口：`specs/21-WorkCase-工作项.md` 已经把子 Agent 方案审核和结果复核写入 WorkCase 状态机、字段契约和关闭前条件，但当前还没有一个独立的工作流程来规定“子 Agent 复查工作”如何被主控发起、等待、回收、处理和关闭。

  当前已有规则：

  1. WorkCase 状态机中存在 `subagents_plan_reviewing` 和 `subagents_result_reviewing`；
  2. `plan_review.review_items` 与 `result_review.review_items` 要记录审核 Agent、提示上下文、输入引用、重点结论、证据引用和签署声明；
  3. `result_review.controller_resolution` 必须说明主控如何采纳、拒绝、修复、退回或提交争议；
  4. 子 Agent 提出的范围内硬问题必须在进入 Human 关闭确认前处理；
  5. 现有 40/41/42/43 审核流程只把子 Agent 作为可辅助审查能力，没有规定通用复查编排动作。

  当前缺口：

  1. 没有独立流程定义何时必须发起子 Agent 复查、需要几个视角、如何选择视角；
  2. 没有统一输入包契约，例如目标、范围、变更清单、验证证据、残留风险、禁止事项和输出格式；
  3. 没有明确只读复核、可修改复核、并行复核和复核失败时的降级路径；
  4. 没有流程级要求主控等待结果、关闭 Agent、处理硬问题并回写 WorkCase；
  5. 没有 Code/Web 可直接消费的“复查是否真实发生”检查锚点，容易出现事后补表、主控代签或空 `review_items` 冒充复核；
  6. 没有稳定说明该流程与 WorkCase 内部状态、40-43 审核流程、Agent 能力资产和 Human Gate 的边界。
  7. 没有明确哪些角色应固定为 LDVH Role Contract，哪些只作为场景临时视角或技术 worker，导致 AI 容易每次临场构思审查角色、遗漏专业视角或重复发明角色清单。
  8. 没有 Codex 环境下的低摩擦调用方案，例如固定角色如何投影为 Codex custom agent、何时用内置 `explorer` / `worker`、默认只读复核与写入型子 Agent 如何分开、sandbox / approval / 并发限制如何进入输入包。

  候选方向：

  1. 在 30-59 行动编排成员中新增一个具体工作流程，例如“主控-角色调度编排”或“子 Agent 复核编排”，专门承接方案审核、结果复核和角色团队调度规则；具体编号应按当时空位、来源承接和 Human Gate 决定，不预绑定为固定编号；
  2. 或者在 `history/specs-v1/06-行动编排基础规范.md` 与 `specs/21-WorkCase-工作项.md` 中补强通用规则，但不新增 30-59 主文件；
  3. 若独立成员成立，应定义主控调度、输入包、视角选择、并行等待、结果回收、硬问题处理、Agent 关闭、事实源回写、Human Gate 和失败降级；
  4. Code 后续可增加检查：进入 `human_closure_confirming` 时，必需视角不得为空，review item 必须具备 Agent 标识、输入引用、结论、证据引用、签署声明和 controller resolution；
  5. Web 后续可展示复核阶段、必需视角完成度、硬问题处理状态和是否等待 Human 关闭确认。
  6. 角色设计应分层：少量核心治理角色固定为 Role Contract；工程专业角色作为可选角色包；查询、搜索、日志分析和代码探索等技术 worker 保持临时或半固定，避免角色资产膨胀。
  7. 可吸收外部成熟范式：CrewAI 的 `role / goal / backstory / tools / delegation / execution limits`，MetaGPT 的 PM / Architect / Project Manager / Engineer / QA + SOP，LangGraph 的 supervisor / subagents / router，AutoGen 的 group chat manager / selector，以及 ECC 的固定 agent 清单、触发条件、并行策略和审查门禁。
  8. ECC 不应被全量导入，也不应把 ECC agents 直接变成 LDVH 默认 agents；应吸收其角色分类、触发条件、输出合同、prompt defense baseline、双审流程和 plan/apply/verify 思路，再转译为 LDVH Role Contract、行动编排和 Codex / Trae / Claude 环境投影。

  本 Spark 只记录分支问题，不在当前 WorkCase 主线中直接修改流程架构。
