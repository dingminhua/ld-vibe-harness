status: closed
title: 一次 v2 局部编辑证据套件的受限端到端试跑
goal: 在不修改 v2 实现、不增加产品遥测或事实源的前提下，执行恰好一套边界冻结的 v2 局部编辑候选证据试跑，验证真实 Helper 与 synthetic fault 轨迹能否按 v2 合同落盘、回读和投影，并把不能证明的部分保留为 not_verified 或 inconclusive。
scope: 只读复用 workcase-0103 已交付的 code/ldvh/testing/trial_measurement.py、local_edit_evidence.py、local_edit_evidence_runner.py 与对应测试，复用 workcase-0069 测量基础和 workcase-0096 prepare-local-edit-candidates，吸收 workcase-0070 的任务泄漏/零 trial fail-closed 经验。仅允许一次仓库外 trial evidence namespace、冻结六轨迹最多四次真实 Helper 调用、相关测试/Ruff/diff-check 以及本 WorkCase 的 Helper 生命周期写入。排除任何源码/测试/规范/公共 Helper 修改，v1 record 迁移，额外 trial，事实/候选/request/response/Prompt 正文或 diff/hash 留存，Spark/Study/其它事实更新，Git commit/push，网络、外部系统、生产遥测与长期存储。
success_criterion_definitions:
- criterion_id: criterion-envelope-privacy
  statement: 六轨迹各尝试一个 v2 record；record 仅含 v2 schema 闭集协议字段和稳定元数据，禁止 request/response/fact/candidate/prompt 正文、diff 及任何正文 hash；验证不打印 bodies。
- criterion_id: criterion-traces
  statement: T1/T2/T3a 真实调用与 T3b/T4a/T4b synthetic fault 精确匹配冻结事件、provenance、调用/repair 上限；synthetic evidence 不表示真实 Helper 行为，任何越界即停止并保守投影。
- criterion_id: criterion-recovery
  statement: 唯一 trial evidence namespace 内记录原子落盘并在交接前以 v2 reader 回读；损坏、缺失、重复、乱序、partial、未知版本、身份/指纹不符或 unavailable 均 fail-closed，T4b 不返回 record，且不迁移 v1。
- criterion_id: criterion-projection
  statement: 仅在精确证据支持时投影 T1 observed、T2 observed、T3a failed、T3b timeout、T4a inconclusive、T4b inconclusive；事件存在不证明 Helper 正确、事实写入、健康、完成、验收或效益。
- criterion_id: criterion-real-helper
  statement: 真实轨迹绑定当前 governed project/worktree、prepare-local-edit-candidates、v2 schema/runner/rule/capability/task 指纹；总调用不超过四次，T2 仅一次 repair，其它 retry 为零，漂移即停止。
- criterion_id: criterion-verification
  statement: 完成批准的相关测试、evidence targeted tests、Ruff 与 diff check，并只汇总方法、调用/repair、bytes/latency、协议记录层观测、限制与未验证范围；测试临时目录不成为 trial record 或仓库残留。
success_criterion_results:
- criterion_id: criterion-envelope-privacy
  outcome: satisfied
  summary: 唯一受限临时根中六份 v2 envelope 的 root/record 权限为 0700/0600；闭集键与稳定元数据扫描未发现 request/response/fact/candidate/prompt 正文、diff 或正文 hash，验证未打印 bodies。
- criterion_id: criterion-traces
  outcome: satisfied
  summary: 冻结轨迹与 provenance、调用/repair 上限及投影一致：T1/T2/T3a 为 real_helper，T3b/T4a/T4b 为 synthetic_harness；调用 1/2/1/0/0/0，T2 repair=1。synthetic 仅证明 recorder/projector 负向边界，不构成真实 Helper 行为证据。
- criterion_id: criterion-recovery
  outcome: satisfied
  summary: 已验证 v2 record-layer 在唯一 trial namespace 内的原子落盘、v2 reader 回读以及损坏、版本、身份和完整性异常的 fail-closed；T4a/T4b 保持 inconclusive 且不返回 record，不迁移 v1。真实宿主/worker 中断后的跨进程耐久恢复与 tamper 注入本身的原子耐久性未验证。
- criterion_id: criterion-projection
  outcome: satisfied
  summary: 实际投影精确为 T1 observed、T2 observed、T3a failed、T3b timeout、T4a inconclusive、T4b inconclusive；汇总仅描述协议记录层观测，不推导 Helper 正确、事实写入、健康、完成、验收或产品效益。
- criterion_id: criterion-real-helper
  outcome: satisfied
  summary: 参数化 wc0104 一次性编排调用相同 public run_real/run_synthetic/persist/recover 序列，四次真实 prepare-local-edit-candidates 调用及 project/worktree/v2 identity、provenance、call cap 可核对，T2 唯一 repair=1。源码硬编码 wc0103 prefix 的 run_suite 原入口未按原样成功完成，不在本结论内。
- criterion_id: criterion-verification
  outcome: satisfied
  summary: 批准范围 211 tests、evidence/trial targeted 55 tests、Ruff 与 git diff --check 均通过；Reviewer 另复现 30 targeted tests、Ruff 与 diff-check。命令证据不替代语义结果复核，也不证明真实中断耐久、tamper 注入原子性、原始 run_suite 入口完整成功或产品效果。
result_summary: 完成恰好一次参数化 wc0104 v2 六轨迹 public sequence：T1/T2 observed、T3a failed、T3b timeout、T4a/T4b inconclusive；真实 Helper 调用4次、repair1、45977 response bytes、观测耗时4541ms。源码 run_suite 原入口因硬编码 wc0103 prefix 未按原样成功完成；Controller 使用相同 public run_real/run_synthetic/persist/recover 序列的一次性参数化编排。首次进程在四次调用和六份记录持久化后，汇总格式化误用 SafeTrialTempRoot.path 触发 AttributeError；未重跑，随后只读定位并恢复既有根。
validation_summary: Controller 已复现批准范围 211 passed、targeted 55 passed、Ruff 和 git diff --check；Luna Reviewer 只读复现 targeted 30 passed、Ruff 和 diff-check。协议计数为4 calls、1 repair、45977 bytes、4541ms；权限/闭集/投影证据限于保留的 v2 record layer。执行限制：原始 run_suite 入口未按原样成功，首次参数化进程在持久化后发生 summary AttributeError；未验证真实宿主硬崩溃/worker interruption durability、tamper 注入原子性、完整 Prompt、生产遥测、长期存储或产品效益。唯一临时根继续保留至 closure handoff，清理前须核验 exact realpath/ownership/lstat。
