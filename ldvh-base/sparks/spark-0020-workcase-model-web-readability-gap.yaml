description: |
  用户在检查 WorkCase 页面时指出，计划 tab 的改造必须先和已经成熟的五个模块保持一致：提交、研究、决策、火花、经验已经形成当前 Web 的设计语言基线，WorkCase 可以有新的专用表达，但大方向必须继承同一套身份头部、卡片框架、复制语义、右侧阅读、弱装饰和节点阅读语言，不能让 Human 感到进入另一套产品。

  当前暴露的问题已经超出 Web 解析层：WorkCase 既是 Human 直接确认的工作对象，又包含内部 execution_items；页面目前容易把注意力压到执行项明细上，却没有清楚表达 WorkCase 自身的推进阶段、关闭审查状态、整体 checklist 和成功标准完成度。Human 在任何阶段都应能先看到：

  1. 本 WorkCase 一共有多少个执行项，以及各状态数量；
  2. 每个执行项在 `pending / in_progress / blocked / done / skipped` 下分别应该展示哪些必要信息；
  3. 整体 `success_criteria` checklist 是什么，哪些已经满足，哪些仍需确认；
  4. WorkCase 自身处于什么进度阶段，例如目标确认、执行中、验证整理、关闭审查、已关闭或退回继续执行；
  5. 当前 Human 需要做什么判断：继续推进、处理阻塞、审查关闭、接受跳过或确认分流。

  初步判断应把 WorkCase 拆成两条可读轨道，而不是只展示执行项队列：

  1. WorkCase lifecycle / closure track：表达工作项对象自身的生命周期、成功标准、验证证据、关闭证据、复检安排和 Human Gate；
  2. execution queue：表达内部执行项的恢复信息、角色分工、阻塞原因、结果摘要和证据引用。

  执行项状态的信息契约也需要进一步收敛：

  1. `pending`：突出标题、角色、预期输出和关键输入引用，不应展示空结果；
  2. `in_progress`：突出当前执行项身份、预期输出、输入引用和必要的进行中说明；
  3. `blocked`：必须突出 `blocking_reason`、可恢复输入和需要 Human 或后续 WorkCase 判断的点；
  4. `done`：默认压缩为结果摘要、证据数量和关键证据入口，避免完成项淹没关闭审查阅读；
  5. `skipped`：突出跳过原因、接受条件和是否已经在关闭证据中说明。

  后续推进需要同时检查 specs、Code、事实源实例和 Web：

  1. specs/21 是否已经足够定义 WorkCase 自身进度轨道，或只定义了对象状态机与 execution_items；
  2. specs/05.03 字段注册是否需要补充 WorkCase lifecycle / checklist progress 的可消费语义；
  3. Code 是否能够派生执行项总数、状态分布、阻塞数量、完成数量和 success_criteria 进度；
  4. Web 是否能在列表和详情页用五个基准模块同源的设计语言表达这些信息；
  5. 现有 WorkCase 实例是否存在字段写法不一致、证据过长、执行项结果过密或 review_needed 页面不可读的问题。
evolution:
