id: workcase-0004
type: workcase
title: 知识地图任务导航价值兑付改进
goal: |
  按最新知识地图价值重新评估报告中最明确、可最小闭环落地的三项建议，补齐知识地图任务导航的停止条件、文本输出章节定位和读取计划 role 细化，使 AI 获得“读什么、何时停、优先读哪里”的实时导航结果。
status: human_closure_confirming
created: '2026-06-24T09:48:06.626050'
updated: '2026-06-24T10:12:42+08:00'
priority: P1
description: |
  工作区最新评估报告确认：LDVH 知识地图功能健康、实时投影和渐进读取方向成立，但从 AI 消费者视角仍有三项直接影响价值兑付的缺口：

  1. `stop_conditions` 当前未有效填充，AI 只知道该读什么，不稳定知道何时应停下来触发 Human Gate 或降级；
  2. JSON 输出已有 `read_plan[].suggested_sections`，但 text 输出未展示，导致 AI 使用更直观的 text 格式时丢失章节级定位；
  3. `read_plan[].role` 对 parent 附件等关系过粗，容易把所有附件都提升为 `authority`，削弱 P1 内部读取优先级。

  本 WorkCase 只安排这三项最小产品化改进。它不新增 30-59 行动成员，不处理 Web 短期实现，不处理 Git 图谱或历史图谱，不改变“知识地图只能由 Code 根据当前文件实时生成、不得缓存、不得成为事实源”的原则。
success_criteria: |
  - [x] `knowledge-map` 的 `stop_conditions` 能从当前任务起点、Rules 入口、行动成员和相关 Human Gate / STOP 原文中实时派生最小停止提示，且不落盘、不缓存、不写回事实源。
  - [x] `knowledge-map --format text` 展示 `read_plan[].suggested_sections` 的紧凑摘要，使 AI 不使用 JSON 时也能获得章节级定位。
  - [x] `read_plan[].role` 细化为更保守的导航角色：直接规则来源和明确权威仍为 `authority`，普通父附件、验证入口、展示/回归/参考实现类附件按职责降为 `context`、`verification`、`fallback` 或 `impact`。
  - [x] 更新必要的规范/Schema 表或明确无需更新的依据，并补充 Code 回归测试覆盖 stop_conditions、text sections 和 role 细化。
  - [x] 通过 WorkCase 事实源校验、知识地图相关单测、active specs 诊断和必要格式检查。
source: |
  用户在 2026-06-24 阅读工作区最新评估报告后，要求“先用 WorkCase 落地报告里更明确的三件事：stop_conditions、text 输出补 suggested_sections、role 细化”，并要求由主控安排。

  本 WorkCase 的计划输入包括：`/Users/dmh2002/poker_hud_projects/LDVH-知识地图价值重新评估报告-20260624.md`、当前对话、active `specs/04-Code确定性执行规范.md`、`specs/attachments/04.Att.06-知识地图投影Schema表.md`、`specs/attachments/01.Att.01-知识地图关系类型表.md`、Rules 入口和 Code 知识地图实现。报告是外部评估输入，不替代 repo 内 active specs、Code 和 WorkCase 事实源。
