    TYPE_LOCALES/FIELD_LABEL_LOCALES/FIELD_VALUE_LOCALES 迁回，及 ReadingPanel 字段
    label 与 ObjectDetail 同源复用）。
- criterion_id: criterion-02
  statement: 非 spark 类型不再以空列表+ok:true 掩盖未接入；API 返回可区分的 type_not_integrated
    语义（非空列表、非笼统 404），页面如实区分“未接入”与“无数据”。
- criterion_id: criterion-03
  statement: projectFiles 不再自行 yaml.load 治理类
