title: 实现三态 Pitfall 与 Spark evolution 20 项边界
status: open
phase: human_closure_confirming
plan_version: 3
priority: P1
summary: result_version=1 已独立复核通过，completed 关闭提案等待 Human 决定。
goal: 在保留 WorkCase 关闭责任、Spark 建议与 related-to 模型既有成果的前提下，将 Pitfall 生命周期收敛为 draft/active/discarded 三态，将 Spark evolution 上限调整为 20，完成既有 retired Pitfall 与 spark-0003 直接状态文字的受控迁移，使规范、Code、Helper、Web、事实对象和验证重新一致。
scope: 覆盖 Pitfall 唯一定义来源、相关附件与 WorkCase/Web 呈现规范；覆盖 Code 中 Pitfall Schema、validation、transition、relations、Helper invalid-before repair、候选投影及直接测试；覆盖 Web 中 draft=待确认、active=活跃、discarded=已废弃的标签、DTO、Card、文档与契约测试；覆盖 specs/20 中 Spark evolution 数量边界、facts.validation 的 20/21 机械边界测试；保留已通过 Helper 将 pitfall-0001、pitfall-0002 迁移为 discarded 的执行事实，并在新上限生效后精确更正 spark-0003 disposition_summary 中 pitfall-0001 的当前状态文字。保留 plan v1/v2 completed item 的 item-level result_summary，不沿用旧顶层结果、复核或批准。必须保留当前 Working Tree 中不相关 dirty 改动。排除：改变 Spark evolution entry shape、语义归位与时间规则，自动删除/合并/压缩历史，其它 Spark 对象迁移，ADR/Study retired，其它事实对象，项目作用域与进度卡并行改动，Git commit/push/PR，真实环境部署。
success_criterion_definitions:
- criterion_id: criterion-contract
  statement: Pitfall 当前状态闭集只含 draft、active、discarded，Human 标签分别为待确认、活跃、已废弃；状态边只含 draft→active、draft→discarded、active→discarded，discarded 为终态，且规范与附件不存在仍把 retired 作为 Pitfall 当前状态或普通边的矛盾。
- criterion_id: criterion-mechanics
  statement: 派生 Schema、validation、relations 与 Helper/Code 机械执行三态闭集、状态-only promote、两类 discarded 的正文与 disposition 保留，并具有最终三态下 retired invalid-before→discarded exact-CAS 修复的正反测试；不保留 retired 合法状态、普通边或永久兼容入口。
- criterion_id: criterion-migration
  statement: pitfall-0001 与 pitfall-0002 已分别通过受控 exact-CAS 修复为 discarded，只改变 status 与 Code 托管 updated_at，身份、正文、关系和原 disposition_summary 保持；Spark evolution 上限 20 生效后，spark-0003 保留全部 9 条 evolution 与其它正文、关系、状态，只精确更正 disposition_summary 的 retired→discarded 文字并由 Code 托管 updated_at，完成写后回读。
- criterion_id: criterion-web
  statement: Web 对 Pitfall 只呈现待确认、活跃、已废弃三种类型化状态，closure Card 与详情不再把 retired 作为 Pitfall 状态，同时保持现有关闭责任与关系呈现边界。
- criterion_id: criterion-validation
  statement: 相关 specs/docs、Helper/Code、事实对象和 Web 测试通过；Spark evolution 20 接受/21 拒绝边界通过；运行受影响全量回归与 Pitfall retired 旧语义静态扫描，并如实区分本案失败、部分迁移和既有或范围外失败。
- criterion_id: criterion-handoff
  statement: 完成 Controller 自检与独立结果复核，逐项回指三态契约、迁移对象、Web 和验证；执行期间不借本 WorkCase 创建 Spark、ADR、Study、新 WorkCase 或范围外事实对象。
- criterion_id: criterion-spark-evolution-cap
  statement: Spark evolution 允许省略或包含 1–20 项；超过 20 项时才要求先语义压缩、重写完整摘要或拆分对象。Code 接受 20 项、拒绝 21 项，且不改变 entry shape、时间边界、内容归位或不得按数量机械删除历史的规则。
