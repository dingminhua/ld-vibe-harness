plan_version: 2
execution_authorization:
  authorized_actions:
  - action_id: authorization-1
    summary: 运行测试与测量（pytest、tools/run_full_tests.py start/status/wait）
    target_scope: code/tests、.ldvh-test-runs/
    effect_scope: 写入 .ldvh-test-runs/ 运行记录、pytest 缓存，以及 full-v4 其余步骤（web-typecheck/web-tests/web-build 等）的既有本地构建与测试缓存产物
    risk_summary: 全量运行单次最长约 8 分钟，占用本地 CPU/IO
    rollback_summary: 无需回滚
    rule_refs:
    - '07'
  - action_id: authorization-2
    summary: 修改测试基础设施配置并安装 pytest-xdist
    target_scope: requirements-dev.txt、pyproject.toml [tool.pytest.ini_options]
    effect_scope: 可修改两个配置文件；pip install 向当前 Python 环境安装 pytest-xdist 包
    risk_summary: 配置变更影响全部测试收集与执行方式；新包引入第三方依赖
    rollback_summary: git diff 精确回退配置；pip uninstall pytest-xdist
    rule_refs:
    - '07'
  - action_id: authorization-3
    summary: 修改测试与测试辅助代码以隔离共享状态、收敛慢测试
    target_scope: code/tests/**
    effect_scope: 可修改
    risk_summary: 测试改动可能弱化断言或掩盖真实缺陷；禁止删除用例、禁止放宽断言
    rollback_summary: 逐文件 git diff 回退
    rule_refs:
    - '07'
  - action_id: authorization-4
    summary: 修改被测实现代码（仅限不改变公开行为的内部改造，如可注入的临时目录/锁路径）
    target_scope: code/ldvh/**
    effect_scope: 可修改（限内部行为保持改造）
    risk_summary: 实现改动可能引入回归；以全部测试通过为验证
    rollback_summary: 逐文件 git diff 回退
    rule_refs:
    - '07'
  quality_gates:
  - gate_id: independent-result-review
    reviewer_mode: independent-read-only
    delegation_action_id: authorization-3
    result_review_action_id: authorization-1
  action_ceiling: 本次运行只允许：运行测试与测量、修改 requirements-dev.txt 与 pyproject.toml 测试配置、修改 code/tests/**、对 code/ldvh/** 做行为保持的内部改造；不允许其它写入
  prohibited_actions:
  - 不得删除或跳过既有测试用例
  - 不得放宽断言或降低校验强度
  - 不得修改 specs/ 规范文件
  - 不得修改 ldvh-base/ 事实对象（本 WC 自身受控写回除外）
  - 不得提交 Git 变更
  - 不得改变 full-v4 固定 6 步计划结构
  - 不得承接 spark-0060 与 workcase-0088/0089 范围
  allowed_adjustments: 允许在计划目标内调整并行度参数（-n 取值）、top-10 慢测试的收敛方式与 item 内实施顺序；基线内 PlanΔ 按 21/34 执行，不重求 Human
  verification_and_rollback: 每个稳定检查点后以受影响测试子集验证；item-4 以完整 full-v4 运行验证；任一验证失败时逐文件 git diff 回退至检查点前状态
  out_of_bounds_handling: 发现需要规范变更、full-v4 计划结构变更、Git 提交，或 collection errors 修复需改变被测行为（超出 authorization-4 行为保持上限）时，停止相关动作，据实取消受影响 item 或写入真实 blocked 与恢复条件后交还 Human，不询问扩权
