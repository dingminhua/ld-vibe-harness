id: workcase-0013
type: workcase
title: WorkCase 收口后续分流确认规范
goal: |
  推动 WorkCase 关闭前必须明确“收口后续分流 / 后续承接”段落的治理规范落地：要求每个即将关闭或已进入关闭确认的 WorkCase 先明确尾巴是否收口干净；若不干净，必须由 Human 明确回复后续进入 spark、新 WorkCase、ADR 或 followup_refs 的承接方式，并记录后才能关闭。若收口干净，则该段落明确写为无后续分流、无残留尾巴。该规范需覆盖已有 WorkCase 的存量回填，不仅限于新 WorkCase。
status: subagents_plan_reviewing
created: '2026-06-26T06:18:56+08:00'
updated: '2026-06-26T06:18:56+08:00'
priority: P1
description: |
  当前 WorkCase 关闭实践中，尾巴容易在 close 之后失去追踪。用户明确要求：新增设计不能只写进 21，而是要形成整个 WC 生命周期的统一收口规范，并推动已有 WC 进行回填。核心要求是：
  1. 每个 WorkCase 在关闭确认前必须拥有“后续分流 / 收口结果”段落；
  2. 若收口干净，段落只需明确写“无后续分流 / 无残留尾巴”；
  3. 若收口不干净，必须有人明确回复后续承接对象是 spark、新 WorkCase、ADR 还是 followup_refs，并记录后才能关闭；
  4. 已有 WorkCase 也要补这一段，避免只对新对象生效；
  5. 该规范要兼顾治理刚性与不把尾巴机械拆碎。
success_criteria: |
  - [ ] 定义 WC 关闭前必须具备的“后续分流 / 收口结果”段落。
  - [ ] 明确收口干净时的标准写法，以及不干净时的分流选项和记录要求。
  - [ ] 将该要求落到 `specs/21-WorkCase-工作项.md` 或其授权附件的可执行条款中。
  - [ ] 设计对已有 WorkCase 的存量回填/迁移要求，避免只约束未来新增对象。
  - [ ] 明确与 `spark`、新 `wc`、`ADR`、`followup_refs`、`residual_risks` 的边界与适用条件。
  - [ ] 完成最小验证方案：检查至少一批现有 `human_closure_confirming` / `closed` WorkCase 的收口段落是否可按新规范表达。
source: |
  来源对话：用户明确要求“当前 WC 完成，需要有一个后续做什么的段落；收口干净就写收口干净；不干净则需要 Human 明确回复是 spark / wc / 还是别的，并记录后才能关闭；且已有 WC 也要补这个段落”。
