title: 无环境 Hook 下的 LDVH 自约束运行
intent: 保留无环境 Hook 时 Agent 能否稳定发现、遵守、验证并交还 LDVH 约束的问题，避免把 Agent.md 等规则文档存在、一次自觉执行或 Helper 可用误作自动注入、阻断与审计已经成立。后续需判断主动约束的最低可靠链路、失效面和可接受边界。
status: discarded
summary: "## 最终判断\n\n- 原议题设想在没有环境 Hook 时，仍通过模型内主动路由和广泛证据矩阵形成接近持续约束的可靠性；该方案需要跨环境冷启动、隐式路由、委派、恢复、worktree 切换及大量负面路径验证，成本过高，不再作为 LDVH 必需能力继续推进。\n- `study-0029` 已形成较低成本的分层结论：使用显式 `ldvh check` 提供早期机械反馈，事实写入后继续精确回读与完整性审计，真实 Git Hook/Gate 保留提交边界最后把关；watcher、范围 receipt 与持续后台监控只在未来出现明确不足时重新研究。\n- 既有环境探针说明薄 Skill 自动选中和模型主动遵守具有环境与行为不确定性，这些证据保留为历史判断依据，但不再要求通过扩大验证矩阵把模型内主动路由提升为必要保证。\n\n## 退出边界\n\n- 不恢复环境 Hook、插件、adapter 或 MCP 作为本议题候选形态。\n- 不继续以本 Spark 跟踪跨环境持续主动约束、自动路由成功率或完整负面路径矩阵。\n- 本终态只表示决定不再跟踪这一高成本原议题，不表示薄 Skill、显式检查、事实审计、Git Gate 或项目整体已经完成或获得额外保证。"
