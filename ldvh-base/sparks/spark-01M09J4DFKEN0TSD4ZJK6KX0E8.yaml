title: 独立审核判断机制：不可独立审核时报告停止并询问Human
status: open
priority: P1
intent: 保留LDVH在独立审核环节中，当Controller无法创建Subagent或其它可提供独立上下文的审核体时，应从当前规则要求的「披露后直接继续」改为「直接报告并停止，并询问Human是否采用切换视角的方案」这一判断方向，以便后续讨论并形成明确的规则变更提案；若不跨行动保留，该议题会反复在WorkCase创建和结果复核讨论中散落出现，增加重新定位和边界判断成本。
summary: "## 当前问题\n\n21 §4.5 当前规定（Direct from 21 §4.5.1.3）：Controller确认无法创建Subagent后，必须先告知Human将改用同一AI切换只读视角，并明确保证差距；告知后直接执行，不等待Human确认，不形成新的Gate，也不暂停Controller-owned执行链。\n\n## 提案方向\n\n将上述流程改为：Controller无法创建Subagent或其它可提供独立上下文的审核体时，**直接报告并停止**，然后询问Human是否采用切换视角的方案。\n\n## 关键差异\n\n- 当前规则：披露→直接继续（不等待确认）\n- 提案规则：报告→停止→询问Human决定→按Human决定执行\n\n## 影响范围\n\n- 21 §4.5 审核方法与保证边界\n- 31 §5.2.1 WorkCase 创建前的 Subagent 判断\n- 可能涉及 00 的 Stop Conditions 和 Human Gate 定义\n\n## 待判断问题\n\n1. 停止当前执行链是否影响WorkCase创建效率\n2. 报告停止后Human是否总是需要选择切换视角，还是可以提供其他方案\n3. 是否需要对「可提供独立上下文的审核体」做更宽泛的定义（不仅仅是Subagent）\n4. 与现有「披露后直接继续」规则的兼容过渡方案\n\n## 排除项\n\n- 本Spark不讨论Subagent的具体实现技术\n- 不涉及模型选择或路由策略\n- 不改变已获批WorkCase的执行授权范围"
change_log:
- summary: 受控创建：记录「不可独立审核时报告停止并询问Human」这一规则变更提案方向；当前 open/P1，待讨论。
