title: WorkCase 执行开始状态在 34 号模板与 Web 中的可观察性
status: implemented
disposition_summary: 34 号模板 §5.2 已新增显式「开始控制点」步骤，将跨检查点工作的 pending → in_progress 写回（含 current_summary、resume_from）提升为独立命名的正向控制步骤，经 CAS、回读与完整性审计后才允许执行；§5.3 移除冗余开始语义；§6 验证表同步更新。Web 层改动经 Human 确认暂不纳入。
intent: WorkCase 的 work item 状态模型已有 pending → in_progress 的开始语义，但用户观察到的执行过程总是只有结束、看不到开始。需要判断：34 号行动模板是否应把「正式开始当前 work item」提升为显式控制步骤，以及 Web 呈现应如何让执行中的状态可被看到。不保留该议题时，后续会话再次处理同类执行可观察性问题，需重新核对 21/34 规范正文与 Web 实现，重复定位与重新分析才能判断修正方向，增加上下文恢复负担。
summary: "**当前判断**\n\n- 21 号规范已定义 item 状态闭集（pending/in_progress/blocked/completed/cancelled），其中 `pending → in_progress` 即为开始语义：条件是该 item 实际开始且全部 depends_on 目标 completed，同事务写非空 current_summary 与有界 resume_from。因此事实模型层面「开始」存在。\n- 34 号行动模板的主执行流程（§5.2 执行循环、§5.3 稳定检查点）只在验证表和 Stop Conditions 中间接约束开始（跨检查点工作先真实回读 in_progress、禁止在实际开始前写或开始后补造），但没有一个像「结束/收敛」那样显式命名的「正式开始当前 work item」正向控制步骤；用户观感为「只有结束、没有开始」，判断属实。\n- `pending → completed` 直接完成例外（21 §6.4）只适用于同一稳定检查点内不需要持久化中间状态的小动作；若模板未讲清边界，执行者可能把普通行动都写成直接完成，绕过可观察的开始状态。\n- 列表页实际排序按 updated 时间倒序（web/src/pages/ObjectList.tsx sortObjectsForList），并非按状态排序；「完成项排在前面」取决于更新时间，不是固定排序规则。详情页已支持展示 item 的 current_summary 与 resume_from（WorkCaseReadingLayout.tsx）。列表页无轮询/订阅，只在加载或筛选时 fetchObjects，已打开页面不会自动刷新。\n\n**拟议修正方向**\n\n- 不新增独立的 action_status/started_at/ended_at/行动日志等第二套运行状态，避免违反 06 号规范「模板不得自建运行状态机、receipt 或执行日志」的边界，也与 21 的 item 状态重复。\n- 把 item 的 `pending → in_progress` 提升为 34 号模板中显式的「开始控制点」：跨检查点、可能中断或需恢复的行动，真实副作用发生前必须完成 in_progress 写回（含 current_summary、resume_from）、CAS、精确回读与独立事实完整性审计，审计通过后才允许执行实际行动；真实行动不得发生在 in_progress 写回之前。\n- 明确 `pending → completed` 只是同一稳定检查点的例外，不得用于跨检查点工作。\n- Web 层只展示事实快照，不根据页面打开时间、AI 运行状态或本地计时器伪造实时 in_progress；如需接近实时，可增加轮询/订阅/写回后刷新通知，但显示内容必须来自最新 WorkCase 快照；展示上可把当前 in_progress item 单独突出（如「当前正在进行」区域），避免被已完成项遮住。\n\n**未决事项**\n\n- 34 号模板具体以何种措辞与结构加入「开始控制点」步骤，属于规范修订，需按 01/06 的规范修订流程决定承载与审核。\n- 即使模板改完，同一稳定检查点内的小动作仍只能看到 completed——in_progress 不是实时运行状态，而是行动发生前的持久化事实快照；若 Human 需要看到「正在做什么」，仍需 Web 轮询或执行期中途写回，二者都涉及取舍，尚未决定。\n\n**边界**\n\n- 本 Spark 只记录需求与判断方向，不授权修改 21/34 规范、Web 代码或建立新行动模板；本议题结论未经独立复核，尚未被 Code 机械证明。"
