id: workcase-0015
type: workcase
title: 管辖项目 Git 身份与 worktree 运行识别
goal: |
  承接 spark-0033，把“管辖项目需要登记 Git 路径/身份，Codex worktree 也应被稳定识别为同一管辖项目”的想法落到规范、Code 和测试。目标是让 Hook dispatcher、知识地图入口和 governed-projects 校验共同基于 Git 可验证事实识别管辖关系，不依赖 AI 主观判断，也不把执行状态写入管辖项目配置。
status: result_self_checking
created: '2026-06-26T12:20:00+08:00'
updated: '2026-06-26T23:20:00+08:00'
priority: P0
description: |
  当前 Codex worktree 位于 `~/.codex/worktrees/...`，不在登记项目 `path` 目录之下。旧 dispatcher 只向上查找 `LDVH-GOVERNED-PROJECTS.yaml` 并做目录包含判断，导致 worktree 虽然与原仓库共享 Git common-dir，却被判为非管辖项目。该问题会让 SessionStart / PreToolUse receipt 在真实 worktree 场景中失效，削弱 spark-0033 要建立的 Hook / Agent 运行保障链路。
success_criteria: |
  - [x] 规范明确：管辖项目配置可以登记 Git 可验证身份，但不得登记执行状态或环境状态。
  - [x] `code/hook_dispatch.py` 能在 Codex/Git worktree 中找到原工作区配置，并通过 Git common-dir 命中管辖项目。
  - [x] `code/spec_checks/knowledge_map.py` 在 worktree 中也能找到 `LDVH-GOVERNED-PROJECTS.yaml`。
  - [x] `code/spec_checks/governed_projects.py` 允许并校验 `projects[].git` 的最小字段。
  - [x] 测试覆盖 dispatcher worktree 识别和 governed-projects schema。
  - [x] 使用当前 Codex worktree 做实际 smoke，证明 `session-start` 返回 `governed=true`。
  - [x] Hook 有效但 AI 未消费 receipt 的缺口已补为硬保障：AI 读完 P0/P1 read_plan 后必须写入 `read_plan_consumed`，写类工具和提交路径缺少该证据时阻断。
source: |
  来源对话：Human 判断“管辖项目需要登记 git 路径，这样应该就可以解决了”，随后要求建立 WorkCase，从想法到规范、实现、测试形成闭环。
orchestration:
  mode: sequential
  execution_items:
    - id: item-1
      title: 固化管辖项目 Git 身份规范边界
      role: spec-drafting
      mode: single
      input_refs:
        - specs/01-规范体系基础规范.md
        - specs/06-运行时扩展规范.md
        - specs/33-ldvh-install-action-LDVH安装行动编排.md
        - rules/LDVH-RUNTIME-PROTOCOL.md
      expected_output: 明确 Git 身份字段只用于确定性识别 worktree，不承载执行状态。
      status: done
      result_summary: |
        已同步 `specs/01`、`specs/06`、`specs/33` 和 `rules/LDVH-RUNTIME-PROTOCOL.md`：管辖项目配置可登记 Git 可验证身份；该身份只用于识别 Codex/Git worktree 等临时执行目录，不承载初始化状态、部署状态、执行状态或环境能力。
      evidence_refs:
        - specs/01-规范体系基础规范.md
        - specs/06-运行时扩展规范.md
        - specs/33-ldvh-install-action-LDVH安装行动编排.md
        - rules/LDVH-RUNTIME-PROTOCOL.md
      blocking_reason: ''
    - id: item-2
      title: 实现 dispatcher 与知识地图 worktree 识别
      role: code-implementation
      mode: single
      input_refs:
        - code/hook_dispatch.py
        - code/spec_checks/knowledge_map.py
        - code/spec_checks/governed_projects.py
      expected_output: Code 通过 Git worktree roots 和 common-dir 识别管辖项目，并保留 receipt 证据字段。
      status: done
      result_summary: |
        `hook_dispatch.py` 已新增 worktree 配置发现与 `_governed_project_match`，可通过 Git common-dir 或配置登记的 `projects[].git.common_dir` 判定同一项目，并在 receipt 中写入 `governed_via`、`governed_project_id`、`governed_project_path`、`git_common_dir`、`git_remote_url`。`git_remote_url` 只作为证据线索，不单独决定管辖关系。`knowledge_map.py` 同步支持从 Git worktree roots 找回上层 `LDVH-GOVERNED-PROJECTS.yaml`。`governed_projects.py` 允许并校验 `projects[].git` 最小字段。
      evidence_refs:
        - code/hook_dispatch.py
        - code/spec_checks/knowledge_map.py
        - code/spec_checks/governed_projects.py
      blocking_reason: ''
    - id: item-3
      title: 补齐测试与本机运行 smoke
      role: test-verification
      mode: single
      input_refs:
        - tests/code/test_hook_dispatch.py
        - tests/code/specs_validate_checks/test_governed_projects.py
      expected_output: 覆盖临时 git worktree、schema 校验和当前 Codex worktree session-start smoke。
      status: done
      result_summary: |
        已补充 dispatcher 真实 git worktree 测试、governed-projects schema 测试和 v2 knowledge-map worktree 配置发现测试。当前 Codex worktree smoke 返回 `governed=true`、`receipt=ok`、`diagnostics=[]`。
      evidence_refs:
        - tests/code/test_hook_dispatch.py
        - tests/code/specs_validate_checks/test_governed_projects.py
        - tests/code/specs_validate_checks/test_v2.py
      blocking_reason: ''
    - id: item-4
      title: 补齐 read_plan 消费硬门禁
      role: runtime-hardening
      mode: single
      input_refs:
        - rules/LDVH-RUNTIME-PROTOCOL.md
        - specs/06-运行时扩展规范.md
        - specs/attachments/06.Att.02-固定运行时扩展登记表.md
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
        - hooks/ldvh-hooks.yaml
        - code/hook_dispatch.py
        - tests/code/test_hook_dispatch.py
        - tests/code/test_commit_validate.py
      expected_output: Hook receipt 不只证明触发，还必须在写入和提交前证明 AI 已消费 P0/P1 read_plan。
      status: done
      result_summary: |
        已新增 `acknowledge-read-plan` canonical event，在 session receipt 中写入 `read_plan_consumed.status=acknowledged`、确认时间和 P0/P1 required paths。`pre-tool-use` 对 Write / Edit / apply_patch / 明确写入型 Bash 缺少该证据时返回 blocking；`git.commit-msg` 在提交前检查最近匹配 cwd 的 session receipt，缺少消费证据时阻断。只读命令保留放行和 warning 语义，避免入口确认动作被锁死。
      evidence_refs:
        - code/hook_dispatch.py
        - tests/code/test_hook_dispatch.py
        - tests/code/test_commit_validate.py
        - rules/LDVH-RUNTIME-PROTOCOL.md
        - specs/06-运行时扩展规范.md
        - specs/attachments/06.Att.15-环境Hook事件映射表.md
        - hooks/ldvh-hooks.yaml
      blocking_reason: ''
