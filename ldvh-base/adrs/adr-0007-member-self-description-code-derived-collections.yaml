alternatives: 替代方案一：保留 20/40 作为极薄集合索引。该方案能减少迁移量，但仍保留手写集合事实源，无法彻底解决第二事实源问题。\n\n替代方案二：保留 03.02，仅删除 20/40。该方案会保留没有实际对象的索引文档规范，增加抽象层，不符合当前“没有其他索引文档”的事实。\n\n替代方案三：让 Code 自己硬编码集合规则。该方案会让 Code 反向成为规则来源，违反 07 和 09 的事实源边界。
