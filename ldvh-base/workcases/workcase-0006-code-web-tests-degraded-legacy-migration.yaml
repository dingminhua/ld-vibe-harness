id: workcase-0006
type: workcase
title: Code Web tests degraded legacy migration
goal: |
  承接 workcase-0005 的实现层残留风险，迁移 `code/`、`tests/`、`web/` 中 legacy `degraded`、`degraded_accepted` 和“降级”输出、消费、断言与 Human-facing 展示，使旧字段只作为兼容信号存在，并以具体问题原因、受限状态、后续动作和承接位置表达当前语义。
status: executing
created: '2026-06-25T11:33:00+08:00'
updated: '2026-06-25T11:52:00+08:00'
priority: P0
plan_confirmed_at: '2026-06-25T11:33:00+08:00'
description: |
  背景来源为 `spark-0025-degradation-concept-convergence.yaml` 与已关闭 `workcase-0005-remove-degradation-concept-from-specs.yaml`。workcase-0005 已完成 specs、attachments 和 rules 的正式机制迁移，但明确登记 Code/Web/tests 仍残留旧字段、状态、测试断言和展示文案。

  本 WorkCase 只处理本线程范围内的实现层迁移，不修改 spark-0026、spark-0027、workcase-0007、workcase-0008 或 study-0011。

  全量扫描命令为 `rg -n "degraded|degraded_accepted|降级" code tests web`。扫描分类如下：

  1. Code 结构化输出兼容字段：`code/spec_checks/knowledge_map.py` 和 `code/spec_checks/v2.py` 输出 `degraded`，需要保留旧字段但补 `result_status`、`issue_causes`、`suggested_action` 和 `legacy_compatibility`。
  2. WorkCase 关闭结果兼容枚举：`code/fact_validate.py` 与 `code/fact_cli.py` 仍允许 `degraded_accepted`，需要标为历史兼容，新增 warning 和替代路径。
  3. Web Human-facing 展示：`web/src/i18n/locales.ts`、`web/src/utils/executionFlowStatus.ts`、`web/api/routes/objects.ts` 和 `StatusBanner` 周边仍有旧状态消费；本轮迁移主展示文案，将旧状态作为风险/受限兼容输入。
  4. Assurance / runtime projection / capability environment：多个 Code 检查仍使用 `degraded` 作为聚合状态，范围较大且涉及历史测试夹具和旧保障报告；本轮不扩大硬改，记录为后续最小迁移方案。
  5. Web docs 中的“降级”多数指响应式布局、复制 fallback 或旧实现说明，不属于本 WorkCase 的 Code/Web/tests 行为迁移主线；本轮不改文档体系。
success_criteria: |
  - [x] 新建 workcase-0006，并记录 Code/Web/tests 全量扫描清单与分类。
  - [x] 知识地图结构化输出保留 legacy `degraded` 兼容字段，同时提供 `result_status`、`issue_causes`、`suggested_action` 和 `legacy_compatibility` 替代语义。
  - [x] v2 text 输出不再把 `degraded` 作为主状态展示，改为展示 `result_status`、`issue_causes` 和 `legacy_degraded`。
  - [x] `degraded_accepted` 在 WorkCase 校验中只作为历史兼容关闭结果，出现时给出 warning 和替代路径。
  - [x] Web i18n 不再把 `degraded` 展示为“降级/Degraded”，改为“受限/Limited”；执行态聚合只把旧状态作为 legacy 风险输入。
  - [ ] assurance / runtime projection / capability environment 的旧 `degraded` 聚合状态已完成全量迁移或另建后续 WorkCase 承接。
  - [ ] 完成相关 pytest、Web 检查/API 测试和 `python3 code/fact_validate.py` 校验。
source: |
