title: Specs 正文表格剥离为附件
status: closed
goal: 使 LDVH 规范正文保持规则定义密度，将结构化字段表、枚举闭集、矩阵/对照表等适合附件承载的内容迁移至 specs/attachments/ 下的独立附件文件，确保每个附件被且仅被一个父规范声明，且正文保留核心规则与回指入口。
scope: "覆盖： - specs/00-理念与构成.md 的 V1-V8 / HV1-HV5 价值评判标准表 - specs/01-规范模型基础规范.md 的身份字段表、规范关系表、渐进式披露层级表、来源分类表 - specs/03-事实源与信息溯源规范.md 的 type/scope/trigger 枚举闭集、信息作用与消费边界表 - 上述各规范对应的附件文件新建与 authorized_attachments 更新 - 正文保留核心理念与规则，仅将表格剥离，正文添加回指入口\n排除： - 不改动 06 行动模板声明表、20-25 类型字段绑定表、状态闭集表、phase 转换闭集表 - 不改动所有验证要求表（规范固定尾部） - 不改动行动模板声明表（30-34，机器读取入口） - 不改动现有附件的 YAML 身份或内容 - 不改动 00 的 YAML 身份字段（00 无 authorized_attachments） - 不改动 02/04/05/07/08/09 的现有附件（仅新增附件） - 不涉及 Code、Web、Helper 或 Git Gate 改动"
success_criterion_definitions:
- criterion_id: criterion-00
  statement: 00-理念与构成.md 的 V1-V8 与 HV1-HV5 表格已正确剥离为 00.Att.01-价值评判标准.md，正文保留 §6 表格前全部核心理念正文（L139-L146）与回指，保留 L167 关于 HV4 边界的内容。
- criterion_id: criterion-01
  statement: 01-规范模型基础规范.md 的身份字段表（§7.2 根规范身份 profile、§7.3 普通规范身份字段、§7.4 附件身份字段）已正确剥离为 01.Att.02-规范身份字段表.md，规范关系与层级表（§9.2 渐进式披露层级表、§11.3 规范关系表、§12.4 来源分类表）已正确剥离为 01.Att.03-规范关系与层级表.md，01 的 authorized_attachments 已更新包含 [ldvh-bilingual-terminology, specification-identity-fields, specification-relation-definitions]，正文保留规则定义与回指。
- criterion_id: criterion-03
  statement: 03-事实源与信息溯源规范.md 的 type/scope/trigger 枚举闭集与信息作用边界表已正确剥离为 03.Att.01-来源参考枚举闭集.md，03 的 authorized_attachments 已更新为 [source-reference-enumerations]（与其他规范无冲突），正文保留格式规则与判断逻辑。
- criterion_id: criterion-consistency
  statement: '所有新建附件符合 01 附件规则：使用 ldvh_attachment: YAML 身份、命名格式 XX.Att.NN-描述.md、只被一个父规范声明、内容不承载独立规则/Human Gate/Stop Conditions。'
- criterion_id: criterion-backward
  statement: 剥离后所有现有内部引用（spec_key、章节引用、术语表引用）仍有效，没有因表格移动而断裂的链接（通过人工全文扫描 + specs 测试验证）。
success_criterion_results:
- criterion_id: criterion-00
  outcome: not_verified
  summary: criterion-00 原设定剥离 00 表格为附件，但 00 是根规范不得拥有附件（§5.2），item-01 已取消。00 表格保留在正文中，此标准不再适用，未执行剥离验证。
- criterion_id: criterion-01
  outcome: satisfied
  summary: 01 的身份字段表已剥离为 01.Att.02-规范身份字段表.md，规范关系与层级表已剥离为 01.Att.03-规范关系与层级表.md，01 的 authorized_attachments 已更新，正文保留规则定义与回指。
- criterion_id: criterion-03
  outcome: satisfied
  summary: 03 的 type/scope/trigger 枚举闭集与信息作用边界表已剥离为 03.Att.01-来源参考枚举闭集.md，03 的 authorized_attachments 已更新，正文保留格式规则与判断逻辑。
- criterion_id: criterion-consistency
  outcome: satisfied
  summary: 新建附件（01.Att.02、01.Att.03、03.Att.01）均使用 ldvh_attachment YAML 身份，命名格式正确，各只被一个父规范声明，内容不承载独立规则/Human Gate/Stop Conditions。
- criterion_id: criterion-backward
  outcome: satisfied
  summary: 剥离后所有内部引用经人工全文扫描 + specs 测试验证，均有效，没有因表格移动而断裂的链接。
result_summary: 00 表格剥离因 00 是根规范而取消，01 和 03 的表格剥离成功完成，新建 3 个附件文件（01.Att.02、01.Att.03、03.Att.01），更新 2 份规范的 authorized_attachments，正文表格替换为回指语句。全部新建附件通过一致性检查，内部引用完整有效。
validation_summary: 验证覆盖：① 新建附件 YAML 身份检查（ldvh_attachment 顶层、attachment_key 格式、canonical_path 正确性）— 通过；② 父规范 authorized_attachments 声明检查 — 通过；③ 内部引用（spec_key、章节编号、术语表引用）人工全文扫描 — 通过；④ specs 测试运行 — 通过；⑤ git diff 确认无意外变更 — 通过。未验证：02/04/05/06/07/08/09/20/22/23/24/31/32/34 全文、现有附件完整内容（scope 排除项）。
closure_outcome: partial
disposition_summary: 01 与 03 的表格剥离及验证已完成；00 的价值评判表因根规范不得拥有附件而保留在正文。当前工作项按部分达成关闭，该未执行部分作为已接受停止的责任保留，不新建附件或后续承接对象。
