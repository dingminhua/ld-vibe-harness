result_summary: v7 知识激活验证实验完整执行。阶段2 结论 supports-family-differentiated-trigger：ADR/Pitfall 差异化触发（ADR=信号命中即触发+轻排除、Pitfall=信号+症状/风险锚点）同时满足触发精度与激活质量门槛（总体 trigger_correct 18/18、unnecessary_f2 0、正确激活率 6/6；ADR 漏检 0、ADR 正确激活 3/3；Pitfall per-family 6/6、unnecessary 0），修复 v6 单轴权衡。阶段1 结论 Study 固定机制未冻结（not_satisfied）：发现率 3/3、干扰率 0 满足，但应用率因被找到任务数 3 < 判定前置 4 无法机械判定（protocol 门槛内部矛盾），Study 不冻结为规范基线，阶段2 Study 任务按 PlanΔ 用 v6 on-demand 基线。9 项 criteria：7 satisfied、2 not_satisfied（Study 冻结与回归防护）。
validation_summary: 验证实际执行：sealed evidence bundle manifest 闭合、SHA-256 全部校验通过、source-complete 回放一致；v7 focused tests 42 项与 v5/v6 回归 97 项全部通过；ruff check 与 py_compile 通过；v5/v6 sealed bundle hash 不变；check-fact-integrity 外层 outcome=ok、领域 result.status=complete、scope.not_completed 为空。
closure_outcome: partial
disposition_summary: v7 触发边界校准验证实验 scope 全部执行：阶段2 结论 supports-family-differentiated-trigger（ADR/Pitfall 差异化触发同时满足触发精度与激活质量门槛：总体 trigger_correct 18/18、unnecessary_f2 0、正确激活率 6/6（触发级口径）、ADR 漏检 0/正确激活 3/3、Pitfall per-family 6/6/unnecessary 0），修复 v6 单轴权衡；阶段1 Study 固定机制未冻结（not_satisfied：发现率 3/3 满足、干扰率 0 满足，应用率因被找到任务数 3 < 判定前置 4 无法机械判定，protocol 门槛内部矛盾），阶段2 Study 任务按 PlanΔ 用 v6 on-demand 基线。9 项 criteria：7 satisfied、2 not_satisfied，故 closure outcome=partial。独立结果复核 pass_with_followups（6 项 feedback 全部处置）。sealed evidence bundle 已 compile（manifest 闭合、SHA-256 校验、source-complete 一致）；v7 focused tests 42 项与 v5/v6 回归 97 项全过；ruff/py_compile 通过；v5/v6 sealed bundle 未改动；check-fact-integrity outcome=ok/complete。spark-01KZXN5TXNEKMANG1WTFBKT5FW 已受控写回（open/P1）。证据产物全部保留在当前 working tree（docs/metrics/knowledge-precheck-v7/），不涉及 Git 提交或生产变更。
