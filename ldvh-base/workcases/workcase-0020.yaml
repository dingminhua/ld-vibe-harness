  result_summary: 30、31、32、34 与 Pitfall 衔接已改为直接消费有效 Gate1 授权，包内调整 fresh review 后自动恢复，超界取消受影响 item 并进入结果链；模板结构与交付测试 35 passed。
- item_id: item-03
  goal: 实现批准基线、真实授权证明、状态转换和 Helper 的机械校验。
  expected_result: 事实 projection、validator、transition、受控写入与 Helper 请求校验共同固定 fingerprint/source proof、Gate1 后不可回退、Gate2 只可关闭、包内自动调整和超界自动结果收敛，并为非法变化保持零写入。
  status: completed
  depends_on:
  - item-01
