context: |
  用户要求在 `specs/03-Specs文档规范.md` 中补充 `tools/check_03_specs_references.py` 的使用说明，形式与此前 `tools/check_03_specs_doc_standard.py` 的说明保持一致。
  当前 03 文档已声明章节编号检查工具与测试要求，但尚未声明章节引用检查工具的机制关系、检查范围、调用时机和测试用例位置。
decision: |
  更新 `specs/03-Specs文档规范.md` §6 机制关系声明，新增 Tools 机制关系，关联 `ld-vibe-harness/tools/check_03_specs_references.py`。
  更新 `specs/03-Specs文档规范.md` §8 Human Gate 与检查要求，补充 `tools/check_03_specs_references.py` 的检查范围、AI 调用时机、默认检查范围、专项检查方式、测试用例路径和工具不可用时的降级说明要求。
  在文档写作检查表中新增“章节引用”检查项，明确正文章节引用格式、引用目标存在性和引用检查工具调用要求。
consequences: |
  - AI 在新增、迁移、重命名或批量修改 specs/ 下 Markdown 文档文件名、章节编号、章节引用、上位依据、相关规范、机制关系声明、索引清单或引用纪律相关内容后，应优先调用 `tools/check_03_specs_references.py`。
  - 03 文档规范中的章节引用规则具备正式的 Tools 机制关系和使用说明。
  - 后续扩展 refs 反向引用、索引一致性或引用纪律检查时，应同步更新 03 文档、引用检查工具和测试用例。
