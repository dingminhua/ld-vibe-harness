summary: "**当前判断**\n\n- AI 应优先消费可回指的规则结果或短契约，只在修改规则、结果冲突、来源不足、高风险或需要精确判断时展开章节或全文。短结果不能替代正式规则源。\n- 01 和 Helper 已有 L0–L4、精确标题切片、来源回指、缺口与 guard 保留。`workcase-0007` 已在其明确的 Codex startup/resume 范围收敛有界恢复投影；这不证明一般 Helper 调用已经任务感知或阅读充分。\n\n**需要判断的消费合同**\n\n- 由 AI caller、Helper 还是环境 adapter 选择最小初始上下文，何时建议展开，如何证明当前上下文足够，以及如何复用规则快照并控制重复读取。\n- 每项优化必须保留实际 operation、outcome、scope、coverage、来源、guard、gap 与精确展开入口。\n- Code 不得猜测用户语义、按唯一候选自动裁决，也不得把 L0→L4 固化为每次调用必须走完的流程。\n\n**边界**\n\n- 本 Spark 只处理 Helper 面向 AI 的上下文消费与渐进式展开；Web 的完整 Human 阅读由 `spark-0015` 承接，过程输出格式由 `spark-0014` 承接。\n- `workcase-0007` 保持关闭，只作为已解决范围，不重新打开。"
evolution:
- at: '2026-07-20T16:55:31+08:00'
  summary: 实际 Helper 使用验证显示，L0–L4 与精确标题切片已经成立；但 Agent 仍需手动选择职责标识符和标题路径，启动 adapter 原样携带 Helper JSON 使会话体验偏重，因而需要任务感知的最小初始上下文与明确展开建议。
- at: '2026-07-22T13:55:39+08:00'
  summary: 迁移复核保留 V3 的结果优先与按需展开原则，但移除机械 Git 来源；当前明确区分已收敛的 startup/resume 恢复投影与仍未解决的一般 Helper 渐进式消费。
