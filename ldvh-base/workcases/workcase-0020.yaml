  result_summary: 已实现 current-shape projection、execution authorization/approval baseline、真实 Human source proof、Gate1 前返修、Gate1 后 PlanΔ 自动恢复、SafeConvergence、Gate2-only 与 Helper 零写入校验；聚焦回归初跑 394 passed，覆盖目录旧状态 1 项失败已修正并单测 2 passed。临时迁移入口与 migration-only tests 已移除。
- item_id: item-04
  goal: 交付 Web 完整 Gate1 批准材料与双待决定入口。
  expected_result: 08、Web 文档、API 投影和页面同步展示完整授权包及来源，Cognition 仅投影 plan/closure，blocked 作为进展或异常信息保留而不进入决定收件箱。
  status: completed
  depends_on:
