title: LDVH 开源发布就绪与公共契约
intent: 保留 LDVH 面向开源发布前的整体就绪条件与公共契约边界，避免将局部实现、版本规则或发布准备误作已可公开发布，或在没有明确授权时启动发布执行。后续需判断哪些公共承诺、保障条件与未决风险必须先收敛。
status: open
priority: P1
summary: "LDVH 面向开源发布前仍需判断整体发布就绪条件与公共契约边界，包括哪些承诺应对外成立、哪些风险和保障必须先收敛，以及这些判断与版本、发布规则和实际执行如何分工。\n\n**发布纪律（已落地）**\n\n- LDVH 为纯源码分发（无 wheel/sdist 打包、无 registry 发布），发布即 git tag + CHANGELOG 更新；不需要独立发布规范或行动模板（原 spark-0023 已废弃并入）。\n- 发布纪律已通过 03 §9.10「发布与版本公共契约」与 03.Att.01 落地（2026-08-08 受控修订，独立复核通过）：\n  - `release` 成为 03 提交契约 type 闭集成员，用于标记发布、更新版本号与变更日志、同步版本声明与打 tag；\n  - 版本号遵循 SemVer，pre-release 用 `-alpha`/`-beta`/`-rc.N` 后缀；tag 用 `v` 前缀且与版本号严格一致；版本声明点（CHANGELOG、README、web/package.json 及其 lockfile）不得互相矛盾；\n  - 每个对外版本必须在 CHANGELOG.md 记录 `## [版本] - 日期` 条目（Added/Changed/Fixed/Removed/Known 分区），内容由已提交变更支撑、发布时集中写；\n  - 发布是 Human 决定：AI 可起草并形成发布候选提交，但打 tag 与 push（含 --tags）只在 Human 明确授权后执行；远端 PR/merge 与平台 Release 不经过本地 commit-msg Git Gate。\n  - 部署件变更标注：发布触及 skill/SKILL.md 或 Git Hook 部署件时，CHANGELOG 必须增加醒目分区「⚠️ 需要更新 Skill」并提供简单更新方式（git pull 后重新部署或告知 AI「LDVH 更新了」）；未触及部署件时不得生造。\n- 版本方向已按 G1 处理：文档（CHANGELOG/README）对齐既有 tag `v4.0.0`，不再声称 alpha；并修复 `web/package-lock.json` 的 0.0.0 漂移。\n\n**仍未决（留待本项目后续）**\n\n- hotfix 分支策略属项目级政策，不在 03 共同契约内定义，由项目正式来源另行决定；\n- GitHub Release 页与远端 tag 回退等远端操作边界（03 §12 既有 Human Gate 约束，force-push 需 Human 授权）。\n\n当前只保留该议题，不构成发布计划、发布完成声明、版本更新、构建、push、PR 或立即执行授权。"
