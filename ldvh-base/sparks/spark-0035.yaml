title: Web 项目内容统一绑定当前管辖项目
intent: 需要持续保留 Web 项目级内容与顶部当前管辖项目的一致性问题，避免文件、变更、提交、事实对象或仪表盘分别使用页面内选择、固定根目录、环境默认或旧缓存，导致同一界面同时展示不同项目。后续需判断项目级页面清单、统一请求与服务端解析边界、切换时的数据失效和性能复用；若不跨行动保留，后续单页修补会反复遗漏其它入口，并增加重新定位数据来源、比较页面语义和排查跨项目误读的负担。
status: open
priority: P1
summary: "**产品语义**\n\n- Web 中凡依赖某个项目 Working Tree、Git 历史或项目事实源的内容，都应统一指向顶部当前选中的管辖项目。页面只消费同一个项目上下文，不再各自维护项目选择、固定默认仓库或隐式推断。\n- “项目内容”至少覆盖文件、工作区变更、提交、仪表盘中的项目数据，以及五类事实对象的列表与详情；项目列表与切换器本身、语言和主题等全局设置不属于该范围。最终覆盖清单仍需逐页核对。\n\n**当前观察**\n\n- 顶部已有全局项目选择入口，文件与变更页面已经把所选项目 ID 传入数据请求。\n- 当前数据链路尚未完全统一：提交页面及部分仪表盘、事实对象读取仍存在固定项目根或环境配置绑定，因此不同页面可能在同一选择下展示不同项目，读取速度差异也混入了不同解析与读取路径的影响。\n- 统一语义不能退化为信任浏览器传入的任意路径；服务端仍须把稳定项目 ID 解析并验证为当前配置中的管辖项目及实际 worktree。\n\n**需要收敛**\n\n- 建立完整的项目级页面与接口清单，明确每项读取、详情路由、刷新和空态应消费哪个项目上下文。\n- 形成前后端统一契约：项目切换后取消旧请求、隔离或失效项目缓存，并防止旧项目响应覆盖新项目页面。\n- 在保持管辖验证可信边界的前提下，判断如何复用已验证的项目登记与解析结果，减少每个页面、每次请求重复启动解析或重复读取。\n- 明确深链接、浏览器刷新、项目不可用以及同号事实对象在不同项目中的定位与提示。\n\n**与相邻议题的分工**\n\n- spark-0021 处理多项目之间如何切换、是否提供“全部”聚合及聚合写入边界；本议题只处理已经选定一个管辖项目后，所有项目级内容如何一致绑定该项目。\n- 当前对象不授权修改 Web、缓存策略、管辖配置或 Git，也不预设“全部”模式；后续若形成明确目标、范围和验收标准，再转入相应行动。"
