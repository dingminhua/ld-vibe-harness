    status: done
    result_summary: |
      两个 Rules 入口已从静态 specs 读取路线表收缩为 task_type/start_node 启动器，正常路径改为运行 entry_navigation 知识地图并按 read_plan 读取 P0/P1 原文；30 和 06 已同步 read_plan 口径。
    evidence_refs:
    - rules/LDVH-MAINTAINER-ENTRY.md
    - rules/LDVH-WORKSPACE-ENTRY.md
    - specs/06-运行时扩展规范.md
    - specs/30-rules-entry-sync-review-Rules入口同步审查.md
