acceptance: |
  - [ ] tools/ 下有统一的 fact_model_cli.py 或等价入口，支持 create/transition/delete 子命令
  - [ ] create 命令对 7 类对象生成符合 Contract 的 YAML 骨架
  - [ ] transition 命令校验状态流转合法性后更新 status 和 updated 字段
  - [ ] delete 命令校验对象状态后删除 YAML 文件
  - [ ] ADR create 封装 ADR YAML + Change YAML 为原子操作
  - [ ] ldvh-intake Skill 调用 PyTools create 命令而非直接写 YAML
  - [ ] ldvh-close Skill 调用 PyTools transition 命令而非直接写 YAML
  - [ ] 现有 tests/tools/ 下有对应测试用例
