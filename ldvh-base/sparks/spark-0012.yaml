title: 规则结果优先与渐进式披露
intent: 保留 AI 如何优先消费可回指的规则结果与最小上下文、何时再精确展开的问题，避免把短结果、Helper 层级、一次恢复投影或人工选择职责标识误作规则已完整读取、任务语义已理解或渐进式阅读体验已经解决。后续需判断最小上下文的选择、展开建议与充分性证据。
status: implemented
summary: "**当前结论**\n\n- 工作上下文的信息交付顺序已经明确：先取得当前规则源的最小规则引导；只有 Human 目标确实需要项目事实时，才按需发现和展开事实，不因进入会话而全量恢复项目内容。\n- AI 负责依据 Human 目标、来源规则与当次信息选择相关内容、适用规则和继续读取范围；Helper 只提供可回指的候选、精确规则切片、完整对象、来源、coverage、gap 与继续入口；Code 不从任务文字或唯一候选自行作语义裁决。\n- 规范与事实的分层读取、精确标题展开、来源回指和缺口保留均已有正式契约和实际 Helper 操作承接；短结果不替代规则源，渐进式披露也不被固化为每次必须走完的固定流程。\n\n**处置边界**\n\n本结论只落实信息交付与语义选择职责，不表示任何一次具体任务已经读到全部适用规则或事实；充分性仍需由当次 AI 据实判断。"
evolution:
- at: '2026-07-20T16:55:31+08:00'
  summary: 实际 Helper 使用验证显示，L0–L4 与精确标题切片已经成立；但 Agent 仍需手动选择职责标识符和标题路径，启动 adapter 原样携带 Helper JSON 使会话体验偏重，因而需要任务感知的最小初始上下文与明确展开建议。
- at: '2026-07-22T13:55:39+08:00'
  summary: 迁移复核保留 V3 的结果优先与按需展开原则，但移除机械 Git 来源；当前明确区分已收敛的 startup/resume 恢复投影与仍未解决的一般 Helper 渐进式消费。
- at: '2026-08-01T01:58:26+08:00'
  summary: 现行系统架构与 Helper 读取契约已经明确并实现规则引导、按需事实读取和 AI/Helper/Code 的职责分工，原先的消费合同候选已收敛为直接落实边界。
disposition_summary: 规则引导优先、事实按需展开、AI 负责语义选择、Helper 负责确定性渐进读取、Code 不裁决相关性，以及来源/coverage/gap/继续入口的交付边界，已由现行系统架构、规范读取与事实读取契约及 Helper 实现直接落实。原议题没有事实承接目标或剩余责任。
