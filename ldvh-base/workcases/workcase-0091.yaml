    effect_scope: 允许修改与新字段和转换直接相关的 Python 实现及测试
    risk_summary: 可能破坏既有 WorkCase 兼容、Gate1 fingerprint 或 lifecycle transition
    rollback_summary: 逐文件回退本 WC 变更并运行原有目标测试确认恢复
