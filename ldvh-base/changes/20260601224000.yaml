context: |
  用户确认引入与 `specs/03-Specs文档规范.md` 形成关联的 Python 检查工具，命名采用 03 specs 文档规范检查语义，并要求工具本身具备测试用例。
  03 文档已定义章节编号、章节编号与有序列表编号区分规则，需要 Tools 机制承接机械化检查能力。
decision: |
  更新 `specs/03-Specs文档规范.md` §6，新增 Tools 机制关系，关联 `ld-vibe-harness/tools/check_03_specs_doc_standard.py`。
  更新 `specs/03-Specs文档规范.md` §8，定义该工具的检查范围、AI 调用要求、测试用例路径和工具不可用时的降级说明要求。
  新增 `tools/check_03_specs_doc_standard.py`，用于检查 specs Markdown 文档标题编号是否符合 03 文档规范。
  新增 `tests/tools/test_check_03_specs_doc_standard.py`，覆盖合法结构、跳号、父级不一致、重复编号、层级不匹配、中文大写或罗马数字标题残留、代码块忽略、正文有序列表忽略、递归扫描和 CLI 返回码。
consequences: |
  - AI 在新增、迁移或批量修改 specs/ 下 Markdown 文档章节标题编号后，应优先调用该工具。
  - 03 文档规范中的章节编号规则具备初步机械化检查能力。
  - 后续如 03 文档扩展章节索引、反向边界、refs 反向引用等检查要求，应同步扩展该工具和测试。
