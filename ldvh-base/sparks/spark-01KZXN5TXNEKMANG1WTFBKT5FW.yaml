title: ADR、Pitfall 与 Study 的作用强化及触发事件
status: open
priority: P1
intent: 保留 ADR、Pitfall 与 Study 如何在真实工作流中产生可观察效用、应由哪些事件触发提请、召回、复核或创建的未决问题，避免这些对象仅被被动存档或凭标题、记忆和临时判断使用。后续需判断各类型的最小有效触发事件、触发后的行动边界、去重与反误触发机制，以及如何验证其确实改善决策质量和重复故障规避；若不跨行动保留，后续需要重新区分已有类型规则、已有对象和拟议运行机制的边界。
summary: "## 探索目标\n\n判断如何增强 ADR、Pitfall 与 Study 在 LDVH 工作流中的实际作用：它们不只保存既有内容，还应在合适的工作事件出现时，帮助执行者获得需要的决策边界、复用已验证的规避经验或快速获取已知的研究结论。\n\n## 待探索的问题\n\n- **ADR：**哪些事件应当触发对既有 ADR 的主动提请或复核，例如出现跨行动持续影响的选择、既有决定的适用边界被触及、关键假设失效，或需要形成新的方向取舍？需要明确提请、阅读、冲突处理、新建、替代和不触发的边界，避免把一般实现细节或未成熟探索误作长期决定。\n- **Pitfall：**哪些事件应当触发对既有 Pitfall 的召回、适用性复核或新经验形成，例如相似症状、已知触发条件、风险方案、调查或验证故障？需要区分\"候选命中\"\"经验实际适用\"\"允许执行规避动作\"和\"已形成新 Pitfall\"，避免仅因关键词相同就自动采用经验。\n- **Study：**哪些事件应当触发对既有 Study 的主动召回或复核，例如进入新领域或新方案时先检索已有研究报告，或当已有研究发现被新证据挑战时触发复审？需要区分\"候选命中\"\"适用性核对\"\"结论采纳\"和\"发现过时需要更新\"，避免在已有明确结论的方向上重复研究。\n- **共同机制：**触发信息应如何保持可定位、可解释、可复核，并与事实对象的既有生命周期、Human Gate、行动模板和渐进式读取协作；应评估是否需要规则、Helper 候选/关系能力、界面提示、流程检查或其它承载，但不预设实现方案。\n\n## 当前明确诉求：三段知识预检\n\n在管辖项目中，优先评估并定义三段与高影响行动绑定的知识预检：\n\n1. **决策预检（ADR Review）：**准备形成、重议或改变具有跨行动持续影响的选择前，完整审阅 active ADR 的 F1 决策卡；对可能适用的 ADR 继续读取 F3 全文，并明确适用、不适用、未完成分页或不可读范围。随后才进入相应的决策、计划批准或 ADR 形成行动。\n2. **实施预检（Pitfall Scan）：**开始实现、排错、修复或验证前，依据行动目标、方法、技术栈、环境、版本和已知风险请求 active Pitfall 的 F2 候选；对可能适用的对象读取 F3，并交还采用、规避或不适用的判断及 coverage、命中依据和未检查范围。\n3. **研究预检（Study Review）：**开始新方案调研、技术选型或方向分析前，检索 active Study 的 F2 候选，判断是否已有相关研究报告覆盖了当前问题；对可能适用的对象读取 F3，明确其结论是否仍适用、是否需要更新或补充，避免在已有明确结论的方向上重复投入研究资源。\n\n该诉求要求区分流程义务、可审计的读取证据与目标环境中的硬阻断：当前事实召回和行动模板可以支撑前两者，但不能把\"已读即已理解\"或\"未命中即绝无相关经验\"机械化，也不预设所有 shell、编辑或外部工具调用已经存在统一阻断入口。\n\n## 已知边界与相邻议题\n\n- 当前 ADR 的定位是已作出且具有跨行动持续影响的选择；Pitfall 的定位是已发生、查明、解决并验证且可迁移复用的失败机制与规避经验。因此本议题不把未决选择或未经验证的现场观察直接升级为 ADR 或 Pitfall。\n- spark-0033 已关注多类事实对象的字段职责一致性；本 Spark 关注的是 ADR、Pitfall 与 Study 的运行时作用、触发事件和效用验证，后续如发现字段职责是根因，再明确分流或关联。\n- study-0026 的评估结论确认了 Study 与 ADR/Pitfall 共享同一根因（关系稀疏），因此本 Spark 扩展覆盖 Study，与 spark-0067 缺陷4（关系稀疏）形成互补：spark-0040 负责\"消费机制设计\"，spark-0067 负责\"数据侧补齐\"。\n\n## 成功判据（待细化）\n\n形成可评审的触发事件模型和最小行动链：每类触发都有输入、适用性核对、允许与禁止动作、去重/冲突处理、Human 判断边界与验证方式；同时能说明哪些事件不应触发，及如何证明机制提升了决策复用、故障规避或研究结论复用，而非只增加记录负担。\n\n## 当前收敛方向：P1-1 知识预检与复用效用验证\n\n### 新认知\n\n- **验证对象不是“是否多读资料”，而是“既有知识是否以可观察方式改变后续行动”。** ADR、Pitfall 或 Study 被定位、展开或引用，都不能单独证明复用成立；至少要能说明它改变了对象选择、计划、调查范围、验证顺序或风险处置。\n- **知识预检应采用 F2 候选定位到 F3 适用性判断的分层链路。** F2 只用可回指的候选卡、命中依据和 coverage 降低首轮读取量，不表达语义相关或允许行动；F3 由执行者结合当前任务核对对象、前提、时效、作用边界和冲突，形成“适用、部分适用、不适用或待验证”的判断。\n- **三段预检是按任务触发的不同检查面，不是固定全量阅读仪式。** ADR Review 面向长期决定边界，Pitfall Scan 面向已验证失败机制与规避经验，Study Review 面向已有研究结论及其时效；无可信候选时应低成本退出，而不是展开全部 active 对象。\n- **“首次合法行动”比“第一次动作”更有价值。** 首次合法行动是符合当前规则、事实边界和授权条件且对象方向正确的第一个实质动作，也可以是识别出必须停止并取得 Human 决定；应同时观察预检耗时与被避免的错误行动、返工和重复研究。\n- **效用必须按净收益判断。** 候选查询、正文展开、适用性判断、误报和上下文占用都是成本；只有减少的重复研究、错误对象选择、返工或到达合法行动的时间收益超过这些成本，预检才值得固化。\n\n### P1-1 需要回答的验证问题\n\n- 是否减少重复检索、重复源码阅读、重复实验或已经有 Study 覆盖的完整调研？\n- 是否在执行前发现 ADR 边界、排除症状相似但根因不同的 Pitfall，或避免选择已过时/不匹配的 Study，从而降低错误对象选择？\n- 是否缩短从任务开始到首次合法行动的时间；若预检增加前置耗时，是否通过减少后续返工形成净收益？\n- 是否能观察到既有 ADR、Pitfall 或 Study 真实改变行动，而不是只被提及、引用或作为候选命中？\n- F2 候选数、F3 展开数、不适用候选数、读取量和判断时间是否受控；无相关知识的任务能否快速退出？\n\n### 建议验证范围\n\n先冻结一组来自真实历史任务、故障、研究或明确待办的样本，并保证只读或可从相同起点回放，避免一轮实验改变下一轮输入。任务集应同时包含：\n\n- 确有相关 ADR、Pitfall 或 Study 的正样本；\n- 没有相关知识对象的空样本；\n- 标题或症状相似但适用前提不成立的负样本；\n- 多个候选冲突、部分适用或需要补充验证的复杂样本。\n\n冻结内容至少包括任务文本、起始 revision 或快照、可见输入、允许动作、停止点、成功判据和记录格式。可优先采用同一任务的“无显式预检基线”与“F2→F3 预检路径”双路径回放；若同一执行者会产生记忆污染，则采用不同新会话、不同执行单元或交叉任务集。\n\n### 最小观察记录\n\n每个样本至少记录：F2 各类型候选及命中依据、F3 判定与展开范围、首次动作和首次合法行动、发生或避免的错误对象选择、被复用对象具体改变的行动、被省略的重复研究，以及预检耗时、阅读量、无关候选和上下文干扰。候选命中但未改变行动不计为有效复用；能改变计划或验证方式属于有效复用，能明确避免重复研究、错误行动或故障属于强复用。\n\n### 后续计划与 WorkCase 准入\n\n1. 先在本 Spark 内继续收敛 P1-1 的实验假设、指标定义、样本选择规则、回放隔离方式和停止条件，不新建重复 Spark。\n2. 盘点并冻结真实但只读或可回放的任务集，确认正样本、空样本、负样本和复杂样本都有覆盖。\n3. 固定基线/预检两条路径及统一记录格式，明确 F2 只负责定位、F3 负责适用性判断，禁止把候选命中写成语义结论。\n4. 只有任务集、执行边界、指标、Human 判断点和验收条件均可执行、可回放、可比较后，才创建效用验证 WorkCase；该 WorkCase 先验证机制价值，不预先承诺实现自动知识预检系统。\n5. 根据验证结果决定继续固化、收窄到特定任务类型、调整触发条件或停止，不把“读到了对象”作为进入实现阶段的充分条件。\n\n本 Spark 继续保持 open，因为任务集、阈值、样本规模和最终验收标准尚未冻结，也尚未建立对应 WorkCase。\n\n\n## 当前收敛方向：双层消费模型（吸收 study-01M03DH7VPFJQVR9G1K7BDP0AA）\n\n- **P1-1 假设已修正**：不再按「三段任务触发预检」平铺设计，改为 **L0 公共必读层 + L1 类型差异触发层** 双层消费模型。\n- **L0 公共必读层（会话开始必读）**：ADR 决策边界常驻摘要、Pitfall 高频警示、Study 索引；必须有容量上限与失效机制（对标 200 行/25KB 级纪律，具体以实测为准），与触发层正交。\n- **L1 类型差异触发层**：ADR 以决策边界触达核验（跨行动影响动作前）；Pitfall 以症状/技术栈/风险/方案信号主动分发与就近呈现；Study 保持按需检索，不进常驻必读层。\n- **验证指标**：单列 L0 公共层上下文占用成本；区分「候选命中」「有效复用（改变行动）」「强复用（避免重复研究/错误行动/故障）」「无效命中」；以「无预检基线 vs 双层预检」双路径回放比较净收益 = 避免的重复研究/错误对象选择/返工 − 公共层成本 − 误触发展开成本；空样本可低成本退出。\n- **范围边界**：本收敛不授权创建 WorkCase 或实现自动注入机制；参数冻结后另经 31 行动模板与 Gate 1 评估。Spark 保持 open。\n"
