title: 受控写入优化
status: open
priority: P2
intent: 承接 spark-0019 路由的关闭候选与写入契约不闭合问题，以及 spark-0049 更新实操中暴露的 read→update 契约映射缺失、signature 发现成本高、模板启用判断不明确等受控写入操作的 AI 可消费性优化。按 study-0030 的「公共契约层 → 类型专属层」分层结构，通过逐项 WorkCase 推进，不试图一次性解决所有写入类操作。
summary: "## 来源与分层结构\n\n本议题承接受控写入实操中暴露的关闭候选契约、read→update 映射、署名发现与模板启用判断问题，继续采用“公共契约层优先、类型专属层逐项判断”的分层方式；不试图用一次大改覆盖全部写入操作。\n\n## 已完成承接\n\n- **WorkCase 关闭候选契约闭合**已由 workcase-01KZYRGGGNEK8B20TKZSC10PDW 完成：关闭候选能够按 UID route target 形状保留目标及其 `content_fingerprint` 要求。\n- **read→update 最小桥接**已由同一 WorkCase 完成：`update-fact-object` capabilities 提供来源绑定、可组合的完整 after 示例，明确移除 Code 托管字段、保留既有 `change_log` 前缀并追加当前流水；`read-fact-objects` 的完整语义读取结果闭集没有因写入准备而膨胀。\n- 上述结果形成了当前统一判断的一部分：正常读取返回当前语义判断所需内容；构造写请求的辅助形状放在目标写操作 capabilities/input examples 中，而不是默认塞入全部读取响应。完成的 WorkCase 不表示其它公共契约项或类型专属项已经完成。\n\n## 当前剩余公共契约层\n\n1. **模板启用判断**：判断 `read-action-template-candidates` 是否应提供最小 `trigger_conditions` 或等价提示，使 AI 能选择适用模板而不复制模板正文，也不把提示冒充规则适用结论。\n2. **署名拼装减负**：在不跨角色推导、不把不可观察字段伪造成已知值的前提下，判断 capabilities 模板或既有能力如何降低三字段署名发现与请求拼装成本；必须保持不可观察项为 `null` 以及写入前逐项重新观察的边界。\n\n这两项作用面和失败闭环不同，后续宜分别承接、分别验证，不再与已完成的 read→update 桥接捆绑实施。\n\n## 当前剩余类型专属层\n\n- WorkCase 关闭候选已完成；后续只在真实实操证据显示 Study、Spark、Pitfall 或 ADR 的特定写路径仍有公共示例无法覆盖的摩擦时，再按类型逐项判断。\n- 没有具体证据时不为每类事实预建专属写入辅助，也不把局部请求、事实 Schema 或状态机改造纳入本 Spark。\n\n## 边界与保持 open 的原因\n\n- 不改变事实对象 Schema、类型状态机、Git 流程或规则源编辑方式；不新增缓存、第二权威或由 Code 猜测目标状态的动作式写入。\n- 模板启用判断、署名拼装减负及证据驱动的后续类型专属判断尚无完整承接位置，因此本 Spark 保持 `open`。"
