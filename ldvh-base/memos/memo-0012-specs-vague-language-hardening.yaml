id: memo-0012
type: memo
title: specs 中模糊用词与确定性执行偏差待收敛
status: pending
created: '2026-06-19T08:23:18+08:00'
updated: '2026-06-19T08:23:18+08:00'
description: |
  本 Memo 承载一个待讨论的规范设计问题：LDVH 的 specs 中是否应系统性减少或取消会影响执行的模糊用词，避免 AI 因定义不明确而产生执行偏差。

  用户观点：

  1. specs 里很多地方使用了不够明确的表达，导致 AI 执行时会按模型自己的理解补全边界；
  2. 对于需要落地执行、校验或状态判断的规则，模糊的模型性用词容易让 AI 走样；
  3. 一些硬性规定即使看起来像走个过场，或者允许字段保留为空值，也可能比“适当、必要、相关、充分”等无法稳定判断的词更可靠；
  4. 空值、占位、枚举、固定章节、条件必填和显式不适用说明，至少能让 AI、Code 和 Human 看见缺口，而不是让缺口被自然语言掩盖。

  AI 当前意见：

  我基本同意这个方向，尤其是在 specs 承载“AI 要怎么做、Code 要怎么校验、Web 要怎么展示、Human Gate 要怎么判断”的位置时，模糊词应尽量被替换为可执行契约。对 AI 来说，最危险的不是规则严格，而是规则看起来有要求、实际没有判定方法；这种表达会诱导模型用语感补齐规范，导致不同会话、不同模型或同一模型不同上下文下执行结果漂移。

  更合适的收敛方向不是机械删除所有自然语言，而是区分两类文本：

  1. 控制性规则、字段契约、状态机、准入条件、关闭条件、Human Gate、Code 消费入口和校验要求，应优先使用枚举、布尔值、固定字段、条件必填、显式空值、N/A 说明、正反例或可检查清单；
  2. 背景说明、设计理由、价值判断和风险讨论可以保留叙述性语言，但不能承担最终判定职责；如果叙述中出现“适当、必要、充分、相关、合理、完整、明显”等词，应补充判定口径或声明它只是解释，不是执行门槛。

  我也认为“允许留空但字段必须存在”通常优于“用模糊句子暗示以后再补”。字段存在且为空可以暴露事实源未完成，后续 Code/Web 也能明确展示 degraded、pending 或 not_applicable；模糊语句则容易让 AI 误以为已经满足要求。

  但需要注意一个反向风险：过度硬化可能制造无意义填表，让 AI 为了满足格式而写入低质量占位。后续如果推进为 WorkPlan，建议同时设计“硬字段 + 合法空值语义 + 不适用说明 + 最小有效内容”的规则，避免只有硬字段、没有质量标准。

  可能的后续分流方向：

  1. 建立 specs 模糊用词清单，区分禁止词、需定义词和允许叙述词；
  2. 在 03、05.01、07 或 42 中补充“控制性规范语言必须具备判定口径”的规则；
  3. 为 Code 增加轻量诊断：扫描 specs 中高风险模糊词，并要求人工确认其是否已经有判定标准；
  4. 补充正反例，展示“字段为空但明确”优于“自然语言看似完成但不可判定”的写法。
