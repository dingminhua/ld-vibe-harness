id: pitfall-0006
type: pitfall
title: 规格重构未同步更新 tools/ 代码实现
status: active
created: '2026-06-05T06:22:10'
updated: '2026-06-19T01:00:40+08:00'
symptoms: |
  对 specs 进行架构级重构（工作流区段从 50-79 移至 30-59、生产对象区段从 20-49 收窄为 20-29、
  移除 Change YAML 管理、统一术语"契约子文档"→"结构化契约文件"等）后，tools/ 下的
  fact_cli.py 和 fact_validate.py 仍包含旧代码逻辑：
  - fact_cli.py 仍在创建 ADR 时自动生成 Change YAML 文件
  - fact_cli.py 仍然支持 --write-change 参数和 _write_change_record 函数
  - fact_cli.py 和 fact_validate.py 的 OBJECT_TYPES/ID_PATTERNS/FILENAME_PATTERNS 仍包含 "change"
  - fact_validate.py 仍有 validate_change 函数和 dispatch 入口
  - fact_validate.py 和 fact_cli.py 的 LIST_FIELDS 中 task/adr 仍包含 related_changes

  直到用户明确要求"检查代码"才被发现和修复。
trigger_conditions: |
  规格重构仅关注 rules/、specs/ 文档层面的文件修改，未意识到 tools/ 是 specs 的代码实现，
  需要随 specs 一并更新。AI 的行为惯性是"修 specs 就只修 specs"，缺少"tools/ 可能也受影响"的意识。
root_cause: |
  - L1 项目规则缺少规格变更与 tools/ 代码联动的硬约束。
  - spec 06 未定义"specs 变更必须检查 tools 实现"的规则。
  - AI 没有建立"规格文档 → 工具代码"的双向感知能力。
  - 项目缺少机器可消费的规格-工具依赖映射清单。
  - tools/ 中的对象类型元数据（OBJECT_TYPES 等）直接硬编码，没有从单一事实源派生。
resolution: |
  - L1 项目规则增加"规格变更与工具联动约束"硬约束。
  - L1 压缩保护行增加"改 specs 检查 tools/代码"提示。
  - L1 场景规则引导增加同步检查 tools/ 的要求。
  - spec 06 新增 §4.7"规格变更与工具联动规则"。
  - §4.7 明确定义联动检查触发条件、检查内容、未覆盖处理、测试同步要求和依赖声明。
  - 创建本 Pitfall 记录本次教训。
verification: |
  ## 验证计划

  检查后续规格变更是否会在提交前主动检查 Code 实现，并同步更新受影响的工具代码。

  判断条件：
  - 涉及事实源边界、字段契约、状态机、对象类型、目录结构或术语的 specs 修改，必须触发 Code 实现检查；
  - 如果 Code 实现仍保留旧对象、旧字段、旧目录或旧术语，应被发现并修正；
  - 相关检查或测试结果应回写到验证证据中。

  ## 验证命令

  ```bash
  rg -n "change|taskplan|task|subtask|status_history|repeatability|severity" code tests
  python3 -m pytest tests/code/test_fact_validate.py tests/code/test_fact_cli.py
  python3 code/specs_validate.py doc specs
  python3 code/specs_validate.py refs specs
  ```

  ## 验证结果

  后续规格变更中，AI 已在维护入口和正式规范中加入规格变更与 Code/Web 联动约束；涉及对象契约和字段格式变化时，已同步检查并更新 `code/fact_validate.py`、相关测试和 Web 文档。

  本次迁移验证字段格式时，Code 检查已能对 WorkCase `verification_evidence` / `closure_evidence` 与 Pitfall `verification` 的四段式结构给出诊断；相关测试已更新并通过。

  ## 结论

  验证通过。该 Pitfall 的核心经验仍有效：规格变更必须同步检查 Code/Web 实现和测试，不能只修改 specs。
avoidance: |
  specs 修改涉及以下任一类型时，必须同步检查 tools/ 代码：
  - 对象类型增删或重命名
  - 字段契约变更
  - 状态机变更
  - 事实源目录变更
  - 术语统一

  触发上述条件后，修改计划必须显式包含 tools/ 代码检查和测试同步步骤。

  提交前必须执行搜索，确认 tools/ 中受影响的硬编码引用已经处理。
applicability: |
  所有接入 LDVH 的管辖项目，所有涉及 specs 变更的 AI 操作。
