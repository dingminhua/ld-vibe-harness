title: 目标环境生命周期与工作对象范围
intent: 保留目标环境的 lifecycle 事件与真实工作对象范围如何对应的独立问题，避免把某个环境的 Hook 事件、注册方式、cwd 或插件行为误作通用协议或已正确选中受管项目。后续需判断哪些事件值得接入、每类事件需要何种实际对象证据，以及宽 workspace 歧义如何由 Human 或当前事实收敛。
status: open
priority: P2
source_refs:
- kind: repository-path
  locator: specs/09-环境接入规范.md
summary: "**当前判断**\n\n- 生命周期协议与环境 adapter 应分层：协议只定义在已确认的真实工作对象范围内需要做什么；各环境的事件名、payload、注册、信任与阻断语义仍须由 adapter 据实接入，不能相互套用。\n- 会话开始解决当前可见工作对象下应先恢复什么；用户输入解决本次任务实际要做什么。两者不能合并为 adapter 对自然语言的裁决，用户目标出现后仍须重新依据真实 target 解析。\n- 不预设固定事件闭集、read-plan 或 receipt。某个环境可触发或已安装 Hook，不等于它为当前项目、当前工作对象或当前动作提供了足够上下文。\n- 宽 workspace 的实际接续已显示：仅从根 cwd 得到“包含多个受管项目”不足以恢复工作；需要利用可验证的 target、当前任务、WorkCase 或 Git 等实际范围证据缩小候选，并在歧义仍存在时保留 Human 决策边界。\n\n**需要验证的范围**\n\n- 每个候选 lifecycle 事件能否携带或可靠推导真实工作对象，而不把进程 cwd、父目录或环境默认值误作 target。\n- 各事件的输入、信任、阻断、上下文注入和 no-op 行为是否有该环境的实际证据；环境特定能力不能自动升级为统一协议事实。\n- 多受管项目或 worktree 并存时，候选项目、范围证据、未决歧义和最终选择是否可以被清楚交还，而不是由入口静默猜测。\n\n**承接边界**\n\n- V3 曾完成的多环境 Hook 探测和旧分流，只提供“协议与适配分层”的形成背景；其事件矩阵、插件分发、旧 workcase 状态与环境结论未经当前 V4 验证，不作为本对象的当前事实。\n- 本 Spark 仍保持 open，因为当前问题是选定环境中的真实对象范围与恢复契约，不是重新宣布多环境支持或建立替代入口。"
