$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Temporary migration decision"
description: "Transitional schema. Not part of stable v3 specs/schemas."
type: object
additionalProperties: false
required:
  - decision
  - role
  - source_path
  - target_path
  - reason
  - stop_conditions
  - next_action
  - source_refs
properties:
  decision:
    type: string
    enum:
      - migrate
      - do_not_migrate
      - defer
      - invalid
  role:
    type: string
  source_path:
    type: string
  target_path:
    type: string
  reason:
    type: string
  stop_conditions:
    type: array
    items:
      type: string
  next_action:
    type: string
  source_refs:
    type: array
    items:
      type: string
  diagnostics:
    type: array
    items:
      type: string
