id: spark-0031
type: spark
title: 多环境 Hook 接入兼容：把环境适配单独拆离
status: pending
created: '2026-06-25T08:52:00+08:00'
updated: '2026-06-25T19:02:00+08:00'
description: |
  入口触发链工程化已经明确可以走 Hook 作为入口，但还存在一个独立问题：不同环境的 Hook 事件、参数、blocking 语义、注册方式、信任机制和可用上下文并不相同，不能把某一个环境的接入方式直接当作 LDVH 的通用入口实现。

  本 Spark 记录“多环境 Hook 接入兼容”这一单独议题：LDVH 是否需要把环境适配层拆成可插拔的多环境实现，统一对外收敛为同一套握手 / receipt / dispatcher 协议，而不是把 Codex、WorkBuddy 或其他环境的 Hook 规则混写在一起。

  本议题关注的重点不是握手本身，而是“如何让同一套 LDVH 入口协议在不同环境中落地”：
  - 不同环境如何触发 SessionStart / PreToolUse / PostToolUse / 其他事件；
  - 不同环境如何传入 cwd、source、tool_name、tool_input、session_id、transcript_path 等上下文；
  - 不同环境如何注册 Hook、如何处理信任与启用、如何保证不影响用户原有 Agent / settings / 插件；
  - 不同环境如何映射到同一套 LDVH dispatcher 和 entry receipt；
  - 哪些能力必须保留为环境特定适配，哪些能力可以进入 LDVH 内核。

  该 Spark 与 spark-0024 相关但不重叠：spark-0024 关注“入口触发链本身如何稳定工作”，本 Spark 关注“入口触发链如何跨环境兼容”。
source: conversation
priority: P1
source_detail: 用户明确提出“还需要有多环境的兼容支持，这个事情新建一个 spark 吧，也就是把多环境的 hook 接入 单独做”，因此将其拆出为独立 Spark，避免和 spark-0024 的单环境入口设计混杂。
evolution:
  - at: '2026-06-25T08:52:00+08:00'
    summary: |
      新建多环境 Hook 接入兼容 Spark。当前判断是：LDVH 的握手入口可以统一，但环境适配不能假设单一平台；需要独立讨论不同环境的事件、参数、注册方式、信任机制和上下文差异，并把它们收敛为可插拔适配层，避免与 spark-0024 的入口握手设计混为一体。
  - at: '2026-06-25T08:59:00+08:00'
    summary: |
      Human 指定多环境测试范围为 Codex、WorkBuddy、Trae，并要求建立 WorkCase 安排。已新建 workcase-0011，目标是先做最小 Hook Probe：分别采集三环境真实 Hook 事件、payload、环境变量、cwd、blocking 语义、上下文注入能力、注册/信任/卸载路径和 no-op 行为，再形成适配矩阵。该 WorkCase 不直接启用生产 LDVH Hook，不静默修改用户环境配置，不把单环境观察写成跨环境事实。
  - at: '2026-06-25T09:43:47+08:00'
    summary: |
      Codex Hook Probe 讨论进一步澄清了环境部署层级：Codex 原生支持 `~/.codex/hooks.json`，可注册 `SessionStart`、`UserPromptSubmit`、`PreToolUse`、`PostToolUse` 等事件，stdin JSON 与 WorkBuddy 风格接近。本次已按用户要求在用户级配置中注册最小 probe，并通过 `/hooks` 完成审查信任；该配置是用户级环境入口，执行目标和 evidence 输出仍指向 LDVH 仓库。

      随后讨论了工作区级与项目级 Hook 的区别：`/Users/dmh2002/poker_hud_projects/.codex/hooks.json` 属于上层工作区项目配置，`/Users/dmh2002/poker_hud_projects/ld-vibe-harness/.codex/hooks.json` 属于 LDVH 仓库项目配置。若两层都部署相同 Hook，可能产生重复触发、来源难辨和未来业务副作用重复的问题；probe 阶段可以通过不同 evidence 目录把重复触发转化为兼容性证据，但长期业务 Hook 不宜无差别双份注册。

      Human 明确希望只在工作区安装或管理 Hook，但单独进入 LDVH 子项目工作时仍能生效，且不想在子项目再维护一份注册。当前收敛方向是：用户级或工作区级 Hook 只作为薄环境入口，真正是否对某项目生效应读取工作区根目录 `LDVH-GOVERNED-PROJECTS.yaml`，按 `projects[].path` 判断当前 cwd 或 payload 中的项目路径是否属于管辖项目。这样可以把“环境触发能力”和“LDVH 管辖范围”拆开：Hook 注册不在每个子项目复制，生效边界由管辖项目配置事实源控制。
  - at: '2026-06-25T10:07:00+08:00'
    summary: |
      三环境 Hook Probe 全部通过，Human 收口第二阶段终态设计：

      1. **Hook 注册**：每个环境各自在根配置中注册一次（用户级），不在子项目重复复制。
      2. **薄入口**：环境 Hook 只做一件事——调用 LDVH dispatcher，不承载业务逻辑。
      3. **LDVH 控制路由**：dispatcher 读取工作区根目录 `LDVH-GOVERNED-PROJECTS.yaml`，按 `projects[].path` 判断当前 cwd 是否命中管辖项目。命中则执行入口触发链；未命中则静默退出（no-op）。
      4. **不写日志**：生产环境不产生 evidence / 日志文件，避免膨胀。Probe 阶段的 evidence 采集仅用于测试验证。

      至此“环境触发能力”与“LDVH 管辖范围”完全拆离：环境只负责把事件送进 LDVH，LDVH 内部控制是否生效、对谁生效、做什么动作。
  - at: '2026-06-25T10:09:00+08:00'
    summary: |
      Human 追问 Hook 配置文件名冲突风险。结论：WorkBuddy（settings.json hooks 键）和 Codex（hooks.json）都不支持自定义文件名，直接写入可能与用户已有 Hook 冲突。收敛方案：**不做 Hook 注册，做 LDVH 插件**——插件自带 `hooks/hooks.json`，安装即生效、卸载即清除，不与用户主配置混在同一文件。这是三个阶段环境（WorkBuddy/Codex/Trae）的统一分发路径，避免在每个环境里直接改用户配置。
  - at: '2026-06-25T17:48:00+08:00'
    summary: |
      Human 要求调查 Codex 和 Trae 是否支持插件式 Hook 安装。调查结论：

      **Codex：✅ 完整支持插件自带 hooks/hooks.json**
      - 插件目录结构包含 `hooks/` 目录，`plugin.json` 可选 `hooks` 字段指向 `./hooks/hooks.json`；不写也会自动检测默认路径。
      - 插件 Hook 不被自动信任——用户需通过 `/hooks` 命令审查并信任当前 hook 定义后才生效。
      - Codex 注入 `PLUGIN_ROOT` 和 `PLUGIN_DATA` 环境变量到 Hook 命令。
      - 事件：SessionStart / UserPromptSubmit / PreToolUse / PostToolUse / Stop / PreCompact / PostCompact / PermissionRequest / SubagentStart / SubagentStop。
      - stdin 公共字段：session_id / transcript_path / cwd / hook_event_name / model / permission_mode。

      **Trae：❌ 当前问题不是“无插件系统”，而是不支持 AI Hook**
      - Trae 的关键限制应记录为：没有可由 AI Agent 生命周期自动触发、可承载 SessionStart / UserPromptSubmit / PreToolUse / PostToolUse 等语义的 AI Hook 能力。
      - 因此不能把 Trae 问题简化成“无插件机制”或“仅需手动 hooks.json”；即使存在本地配置、兼容配置或脚本入口，也不等价于 AI Hook。
      - Trae 侧应进入无 AI Hook 环境降级路径：由 AI 主动读取 LDVH 生命周期 Rules，自觉执行 ldvh_enter、Write/Edit 前握手确认和 Git commit 协议；这里仅区分 AI Hook 强制消费与 AI 自觉消费，不把 Git hook、MCP、CI、server-side gate 或 Human Gate 混入 AI Hook 分发判断。
      - Trae 的事件、stdin 字段、blocking 语义和上下文注入能力不得沿用 Codex / WorkBuddy / Claude Code Hook 假设，除非后续有真实 AI Hook 证据。

      **WorkBuddy：✅ 已确认支持插件 hooks/hooks.json（weixin-minigame-helper / godot-mcp 实例）**

      **LDVH 分发策略修正**：Codex 和 WorkBuddy 走插件分发（`hooks/hooks.json` 随插件）；Trae 的核心限制修正为“不支持 AI Hook”，不是“没有插件系统”。Trae 即使存在本地配置、兼容配置或脚本入口，也不能据此视为具备 AI Agent 生命周期 Hook。spark-0031 的适配矩阵只区分两类 AI 协议消费路径：有 AI Hook 环境强制消费，无 AI Hook 环境由 AI 主动消费生命周期 Rules。
  - at: '2026-06-25T17:53:00+08:00'
    summary: |
      Human 追问 Claude Code 的插件 Hook 支持。调查结论：

      **Claude Code：✅ 完整支持插件自带 hooks/hooks.json**
      - 默认路径：`hooks/hooks.json`，可通过 `plugin.json` 的 `hooks` 字段指定或内联。
      - 5 种 Hook 类型：command / http / mcp_tool / prompt / agent（远超其他环境）。
      - ~25 种生命周期事件，包括 TeammateIdle、PostToolUseFailure、Elicitation 等独特事件。
      - 环境变量：`CLAUDE_PLUGIN_ROOT`、`CLAUDE_PLUGIN_DATA`、`CLAUDE_PROJECT_DIR`。
      - 项目级插件需工作区信任对话框确认后才加载 Hook。
      - 插件清单：`.claude-plugin/plugin.json`。
      - 4 级安装范围：user / project / local / managed。

      **Trae ↔ Claude Code 兼容通道修正**：即使 Trae 存在读取 Claude Code 配置、脚本入口或其他兼容路径，也不能直接推导为支持 AI Hook。除非后续拿到 Trae 真实 AI Agent 生命周期 Hook 证据，否则 Trae 应按“不支持 AI Hook”处理；Claude Code 插件对 Trae 的潜在间接受益只能作为待验证降级路径，不能写成 Hook 能力事实。

      **四环境终态矩阵**：

      | 环境 | AI Hook 能力 | 信任机制 | LDVH 分发/消费方式 |
      |---|---|---|---|
      | WorkBuddy | ✅ 支持插件式 `hooks/hooks.json` | 插件自动放行 | 插件调用 dispatcher |
      | Codex | ✅ 支持插件式 `hooks/hooks.json` | `/hooks` 审查信任 | 插件调用 dispatcher |
      | Claude Code | ✅ 支持插件式 `hooks/hooks.json` | 工作区信任对话框 | 插件调用 dispatcher |
      | Trae | ❌ 不支持 AI Hook | 不适用；不能沿用 Hook 信任语义 | AI 主动消费生命周期 Rules |
  - at: '2026-06-25T18:42:00+08:00'
    summary: |
      Human 提出核心设计收敛：**协议层统一，执行层适配**。

      同一份 LDVH 生命周期 Rules 资产定义"SessionStart 做什么、PreToolUse 做什么、Git commit 做什么"的协议，两种消费路径：

      - **有 AI Hook 环境**（WorkBuddy/Codex/Claude Code）：环境自动调用 dispatcher，协议由 Hook 强制执行。
      - **无 AI Hook 环境**（Trae 等）：AI 通过 Agent 引入 LDVH 生命周期 Rules 资产，自觉按协议执行——"每次会话开始先跑 ldvh_enter，每次 Write/Edit 前确认已握手"。

      这意味着 LDVH 不需要为每种环境写不同的规则。同一个 Rules 文件，有 Hook 时环境消费，无 Hook 时 AI 自觉消费——规则描述的是同一件事，只有强制力层级不同。这是 spark-0031 适配矩阵的最终收敛：**Hook 注册只是协议的执行方式之一，不是协议本身**。
  - at: '2026-06-25T19:02:00+08:00'
    summary: |
      Human 纠正 Trae 适配判断：Trae 的问题不是“没有插件系统”，而是“不支持 AI Hook”。因此 spark-0031 不应把 Trae 写成“手动 hooks.json 或 Claude Code 兼容路径即可接入”的环境；本地脚本、兼容配置或插件机制都不能替代 AI Agent 生命周期 Hook。

      修正后的判断：Trae 归入无 AI Hook 环境。LDVH 协议仍保持统一，但 Trae 不能依赖环境自动 Hook 强制执行，只能由 AI 主动消费生命周期 Rules。这里的区分只发生在 AI 生命周期协议消费层：有 AI Hook 是强制消费，无 AI Hook 是自觉消费；Git hook 是 Git 提交层面的机制，不属于 AI Hook，也不应混入 AI Hook 分发判断。后续除非取得 Trae 真实 AI Hook 证据，否则不得沿用 Codex / WorkBuddy / Claude Code 的事件、stdin、blocking、上下文注入或信任机制假设。
