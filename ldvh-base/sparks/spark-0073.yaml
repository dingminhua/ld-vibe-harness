title: WorkCase 执行期 Human 输入处理规则——消除获批执行后 AI 非预期停止
status: implemented
intent: workcase-0091 Gate 1 批准后，AI 在 executing 阶段停下来询问 Human '是否开始执行 item-1'，而非按 34 §5.2 的 Controller 持续收敛链自动继续。审核与分析确认根因是回合制对话模型（Human 输入→AI 输出→停等）与 LDVH 的 Controller-owned 收敛链（读投影→消费 next_required_control_step→继续直到合法退出）不匹配。规则层面缺少一条针对 AI 回合制模型的显式指令：Human 在 executing 阶段的输入不自动成为交还信号，Controller 必须读投影判断是否到了合法退出点才停下。本 Spark 承接该缺口，在 34 §5.2 中增加显式执行期 Human 输入处理规则与单次回合执行边界判定，在 21 §9.3 投影表中补注 handoff_narrative_key 语义，并同步评估是否需要配合 Code 层微调。
summary: "## 已落实范围\n\n- 34 §5.2 执行循环已含「Gate 1 后统一 pre-yield 控制点」：Gate 1 获批后 executing 等 phase 处于同一条 Controller-owned 收敛链，只要刚回读快照仍为 status=open、投影仍指向 Controller-owned 结构步骤、且尚未形成 §5.4 合法退出，Controller 就继续处理；新的 Human 决策需求不构成 blocked/unresolved，也不得新增 Human Gate 或请求第三次确认。\n- 34 §5.4 合法退出明确唯一出口：closed / 真实外部·能力阻塞 / unresolved 读取缺口 / human_closure_confirming 的 gate2_waiting；新 Human 决策需求同样不是 blocked/unresolved 出口。\n- 21 §9.3 投影表含 executing → handoff_narrative_key=item_execution_in_progress / next_required_control_step=advance_current_work_item，并限定仅 gate2_waiting 可表达等待 Gate 2。\n- Code 层 code/ldvh/facts/workcase_presentation.py 的 PHASE_PRESENTATION 投影表与规范一致，executing 行已实现上述 key。\n\n## 时间与承接核对\n\n- 统一 Gate 1 至 Gate 2 交还控制（ac74c99b，2026-08-09，承接 workcase-0082 / spark-0071）先于本 Spark 创建（2026-08-10）落地。\n- workcase-0091（2026-08-10）执行链从 Gate 1 到关闭全程通畅，未再现本 Spark 记录的非预期停止。\n\n## 保留边界\n\n- 规则与 Code 覆盖存在，不机械证明真实会话中 AI 必然遵守；遵守性仍须在真实执行中持续观察。\n- 本 Spark 创建时自述的「规则缺口」与落地后现状不一致，该转折由本条 evolution 说明。\n\n## 当前结论\n\n本 Spark 限定的缺口已由既有规则与 Code 覆盖，按 Human 指示直接落实收口；范围内无剩余待处置内容。后续若在真实执行中再现该停止，应新建 open 入口承接，不重开本 Spark。"
disposition_summary: 本 Spark 限定的「获批执行后 AI 非预期停止」规则缺口，经核实已由 2026-08-09 落地的统一 Gate 1 至 Gate 2 交还控制覆盖：34 §5.2 执行期 pre-yield 控制点、§5.4 合法退出清单、21 §9.3 投影表及 code/ldvh/facts/workcase_presentation.py 实现一致；workcase-0091 于 2026-08-10 完整走通执行链至关闭，未再现该停止。已落实范围仅指规则与 Code 层覆盖，不机械证明真实会话中 AI 必然遵守；遵守性仍须真实执行观察。范围内无剩余待判断事项。
