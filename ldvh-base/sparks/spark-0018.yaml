title: 无环境 Hook 下的 LDVH 自约束运行
intent: 保留无环境 Hook 时 Agent 能否稳定发现、遵守、验证并交还 LDVH 约束的问题，避免把 Agent.md
  等规则文档存在、一次自觉执行或 Helper 可用误作自动注入、阻断与审计已经成立。后续需判断主动约束的最低可靠链路、失效面和可接受边界。
status: open
priority: P2
summary: "**当前问题**\n\n- 没有环境 Hook 的自动注入或阻断时，Agent 是否能仅凭 Agent.md 等规则、可发现的事实入口与 Helper，稳定完成项目识别、事实源读取、STOP/Human
  Gate 遵守、验证和交还。\n- 文档规则、Agent 主动执行责任与 Hook 提供的自动注入、阻断、审计是不同能力；规则存在、一次自觉执行或 Helper
  可用都不能证明自动约束成立。\n\n**应验证的最小主动链路**\n\n- 新会话、子 Agent、上下文压缩恢复、工作树切换与 Skill 调用时，规则和当前事实入口是否能被实际发现并继续消费，而非依赖主线程记忆。\n\
  - Agent 主动读取后，是否能在写入、提交或需要 Human 决定时保持真实的 STOP/Human Gate 边界，并可回收实际验证范围与未证明内容。\n\
  - Helper/规则失效、上下文不足或工作对象不明确时，系统是否明确交还缺口，而不是静默宣称已读取、已受约束或已完成。\n\n**边界与未决事项**\n\n\
  - 本 Spark 不把“由 Rules 模拟 Hook”预设为等价或正式替代；它只研究在缺少 Hook 强制力时可达到的主动行为约束及其局限。\n- 需要以实际运行场景建立最小证据矩阵，再判断是否形成
  WorkCase、补充能力资产，或明确某些场景必须依赖环境 Hook。"
evolution:
