type: change
title: 新增 LDVH 常用提示词模板文档
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户希望在 `specs/evals/` 下新增一个常用提示词模板文档，并重点提供一个可复制使用的提示词，用于检查 `specs/` 根目录 Markdown 文件是否符合 LDVH 自身规范要求。
  用户要求该提示词必须支持多角色参与，覆盖价值审核、规范审核，并参考 `specs/51.06-Contract.md` 判断角色选择和轻量或并行执行模式。
decision: |
  在 `specs/evals/09-LDVH常用提示词模板.md` 中新增常用提示词模板集合。
  文档说明 Markdown 无法提供跨所有编辑器通用的原生复制按钮，因此采用独立 Markdown 代码块承载提示词，以适配常见预览环境的代码块复制能力。
  核心模板为 specs 根目录规范一致性多角色检查提示词，要求先输出 RoleSelectionOutput，并等待用户确认采用主上下文轻量模式或多角色子 Agent 模式后再执行。
consequences: |
  - `specs/evals/` 增加一个内部辅助模板文档，便于后续快速发起 specs 根目录规范审查。
  - 模板不成为 LDVH 强制规范，执行时仍需回到 Rules、specs 正式规范和 `ldvh-base/` 事实实例。
  - 多角色检查入口显式引用 `specs/51.06-Contract.md` 的角色选择和报告契约，降低临时提示词遗漏角色、模式和 Human Gate 判断的风险。
affects:
  - specs/evals/09-LDVH常用提示词模板.md
related_rules:
  - specs/03-Specs文档规范.md
  - specs/10-事实源边界与承载规范.md
  - specs/51-multi-role-thinking-多角色思考.md
  - specs/51.06-Contract.md
human_gate:
  required: false
  confirmed_by: user
  confirmation_context: 用户明确要求创建该内部辅助文档；该文档位于 evals 内部辅助区，不修改正式规范规则正文、不改变编号体系或事实模型字段契约。
validation: |
  1. 已按 `specs/evals/` 现有评估文档风格设置头部元数据和执行效力边界。
  2. 已将核心提示词放入独立 Markdown 代码块，便于在支持代码块复制的 Markdown 环境中直接复制使用。
  3. 已在提示词中要求多角色思考、RoleSelectionOutput、MultiRoleReport、Human Gate 和 WriteBackSuggestion。
