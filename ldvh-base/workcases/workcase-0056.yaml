status: closed
title: 建立可审核候选绑定的两阶段 Git 受控提交能力
goal: 在不削弱 Human 授权、AI 对精确候选的一次语义与验证覆盖审核，以及 common-dir commit-msg 最终 Git Gate 的前提下，把普通非事实本地提交收敛为 prepare、一次 AI review、commit，并以一次性候选、真实事件 challenge、审计 witness、Index 排他保护和完整回读保证失败关闭。
scope: 修改下位规范 03、04、05、09、30 并新增 10《Git 受控提交服务规范》及必要授权附件；实现 source-only Helper 的 prepare/read/discard/commit prepared 操作、私有生命周期 store、check-fact-integrity 一次性 witness、managed commit-msg challenge/event attestation、真实 Index 锁内安全对齐；复用并重构现有 code/ldvh/commits 内核；增加真实 git commit、linked worktree、alternate Index、故障与性能测试；验证通过后仅升级当前 LDVH common-dir /Users/dmh2002/poker_hud_projects/ld-vibe-harness-v2/.git/hooks/commit-msg 并保留可恢复备份。排除 00、ADR、新 staged_index 模式、pip 打包或安装、其它 clone/common-dir、push/PR/release/deploy、用户现有 web/src/components/CommitPushStatusBadge.tsx 改动和其它无关文件。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 00 保持不变；03 明确下放且不复制提交契约；10、04、05、09、30 职责闭合，并通过规范身份、关系、责任重复、来源与独立规范复核。
- criterion_id: criterion-02
  statement: prepare 公开能力形成精确 working_tree candidate、完整 dossier、may_change_state 授权分层和 0700/0600 私有一次性状态机；精确路径、Index 冲突与候选漂移全部 fail closed。
- criterion_id: criterion-03
  statement: 只有独立公开 check-fact-integrity 调用返回 ok/complete 后生成且 issuer_operation 精确绑定的 opaque witness 可被事实 candidate prepare 消费；调用方 JSON、事实写操作内审、过期、重放或漂移 witness 均不可冒充。
- criterion_id: criterion-04
  statement: commit prepared 完成原子 claim 与 started journal、最终 CAS、标准真实 Index 排他锁、alternate Index 提交与条件对齐；真实 common-dir Hook 先独立完整执行唯一 validator，再核对 challenge 并生成一次性 event attestation。
- criterion_id: criterion-05
  statement: not_created、partial、indeterminate 边界成立；commit 已创建后的异常返回 commit_id 与实际状态，不自动 amend、reset 或 retry，不覆盖无关 staged、unstaged 或 untracked。
- criterion_id: criterion-06
  statement: 真实 git commit allow/block、alternate Index、linked worktree、detached/unborn、same-OID ref switch、rename/delete/symlink/submodule/binary/clean filter、Hook/config/rule drift、challenge、锁竞争、crash/replay/TTL 与特殊路径测试通过；直调 Hook 不替代真实事件。
- criterion_id: criterion-07
  statement: 非事实 happy path 的外部编排为 prepare、一次 AI review、commit，execute 不重复完整 precheck；记录 p50/p95，Git 观察子进程从当前约 21 次向不高于 12 次优化并以实测报告，不删除 Hook 完整检查。
- criterion_id: criterion-08
  statement: 当前唯一 common-dir Hook 通过受控部署升级，并在代表性主 worktree 与可用 linked worktree 完成真实 allow/block 验收；失败可恢复精确备份，未触及其它 common-dir。
