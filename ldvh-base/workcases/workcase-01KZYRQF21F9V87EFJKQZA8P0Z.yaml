title: Helper 只读操作失败诊断结构化提示（STNORJ 承接）
status: closed
goal: 针对 Helper 只读操作（read-action-template-content、read-action-template-candidates、read-fact-objects、find-fact-object-candidates 等）失败路径（invalid_request 类）缺少自解释修正提示的问题，在现有 gaps/diagnostics 契约闭集内提供结构化、可据以修正的提示（缺失字段名、允许闭集、参数形状、最小示例），使 AI 依据提示即可修正请求，无需反复翻规范试调；不改变任何成功路径输出契约、写操作契约或规范源。
scope: 仅修改 Helper 只读操作失败路径的诊断内容生成（code/ldvh/helper 下共同请求校验层与只读操作实现中 invalid_request 类响应的 gaps/diagnostics 内容），及对应测试。保证：不改变 gaps/diagnostics 字段闭集（04.Att.01）、不改变任何成功路径输出契约（06 §9.5/9.6、05 §11.2/§11.6）、不改变写操作（create/update/close/correct）契约或校验逻辑、不修改任何规范源（specs/ 与 specs/attachments/）、不修改事实对象 Schema/字段定义。排除：source_content 去重（06 §9.6 契约变更）与成功路径窄输出契约收缩——超出本 WC 授权，作为关闭时 follow_up 建议（需独立规范修订流程）；Git 提交/推送/发布；其它执行中 WorkCase 的事实文件。
success_criterion_definitions:
- criterion_id: criterion-structured-failure
  statement: 只读操作失败路径（invalid_request 类）在现有 gaps/diagnostics 闭集内提供结构化修正提示（缺失字段名、允许闭集、参数形状或最小示例），AI 依据该提示即可修正请求而不必翻规范。
- criterion_id: criterion-diagnostics-contract
  statement: 改动不改变 gaps/diagnostics 字段闭集与 04.Att.01 契约语义，只增强诊断内容；既有调用方消费的字段与形状保持不变。
- criterion_id: criterion-tests
  statement: 聚焦测试覆盖常见失败类别（缺失字段、闭集外值、形状错误）的结构化提示输出；既有 helper 测试回归通过；Ruff 通过。
- criterion_id: criterion-boundary
  statement: 改动不触及成功路径输出契约、写操作契约/校验、事实对象 Schema/字段定义、规范源或 Git 流程；回归测试证明既有调用方必需字段未破坏。
success_criterion_results:
- criterion_id: criterion-structured-failure
  outcome: satisfied
  summary: 只读操作失败路径（invalid_request 类）现已在 diagnostics[0].details.hints 提供结构化修正提示：missing_required_inputs 给出缺失/无效的必填字段名，allowed_inputs 给出该操作接受的字段闭集，minimal_examples 给出最小请求示例；read-fact-objects、read-action-template-content、find-fact-object-candidates、read-specification-content、git-hooks-status 等真实调用验证 AI 可据提示修正。
- criterion_id: criterion-diagnostics-contract
  outcome: satisfied
  summary: gaps 保持既有 shape（summary/scope/source_refs），diagnostics 条目字段闭集不变，只在 details 内部新增 hints 键；既有 problems 键与全部既有字段保留；533 个 helper 测试（含既有 invalid_request 断言）全部回归通过。
- criterion_id: criterion-tests
  outcome: satisfied
  summary: 新增 code/tests/helper/test_read_failure_hints.py 8 个测试，覆盖缺失字段、闭集外值、形状错误三类失败的结构化提示输出，及 minimal_examples、只读集合一致性、写操作/未知操作不变；helper 全量回归 533 passed / 5 skipped；Ruff 通过。
- criterion_id: criterion-boundary
  outcome: satisfied
  summary: 改动仅限 code/ldvh/helper/service.py 的只读操作失败诊断内容生成与新增测试文件；未触及成功路径输出契约、写操作契约/校验、事实对象 Schema/字段定义、规范源（specs/ 与 specs/attachments/）或 Git 流程；写操作 invalid_request 输出保持原样（无 hints）。
result_summary: Helper 只读操作失败路径（invalid_request 类）现已提供结构化修正提示：在 diagnostics[0].details.hints 内按 missing_required_inputs / allowed_inputs / minimal_examples 三类给出缺失字段名、允许闭集与最小示例，AI 依据提示即可修正请求；实现集中于 code/ldvh/helper/service.py（READ_ONLY_OPERATION_KEYS + _read_operation_fix_hints + invalid_request_result/_execution_response 消费注入），新增 8 个聚焦测试，helper 全量回归 533 passed。
validation_summary: 聚焦测试通过：新增 8 个测试覆盖缺失字段、闭集外值、形状错误的 hints 输出，写操作与未知操作输出不变；helper 全量回归 533 passed / 5 skipped；Ruff（service.py 与新增测试文件）通过；真实 CLI 试调 read-fact-objects / read-action-template-content / find-fact-object-candidates / read-specification-content / git-hooks-status / update-workcase 验证行为符合预期。
closure_outcome: completed
disposition_summary: 本 WorkCase 在授权范围内完成：Helper 只读操作失败路径（invalid_request 类）已在 diagnostics[0].details.hints 提供结构化修正提示（missing_required_inputs / allowed_inputs / minimal_examples），写操作与其它失败路径输出不变；新增 8 个聚焦测试，helper 全量回归 533 passed / 5 skipped，Ruff 通过；全部 4 项 success criterion satisfied，无剩余责任（proposed_outcome=completed），不设 residual decisions。
spark_suggestions:
- suggestion_id: suggestion-source-content-dedup
  suggestion_kind: follow_up_opportunity
  summary: source_content 去重与成功路径窄输出契约收缩（06 §9.6 契约变更）
  follow_up_summary: Helper 只读操作成功路径仍同时返回模板 content 与包含同一内容的完整 source_content，造成规则重复传输与输出膨胀；以及成功路径窄输出收缩。两者均超出本 WC 授权（需独立规范修订流程），建议日后经新 Spark/WorkCase 承接。
