id: CHG-20260601210000
title: 在 03 文档规范和 04 模型子文档规范中增加章节索引要求
date: 2026-06-01
changes: |
  1. specs/03 §4.1 新增"超过 200 行的正式规范文档必须提供章节索引"规则
  2. specs/03 §5.1 正式规范骨架模板中增加章节索引段落
  3. specs/04 §4.1 主文档部分增加章节索引引用
  4. specs/04 §4.2 子文档部分增加章节索引引用
reason: |
  章节索引要求之前仅在 specs/10 §6.5 中声明，但文档格式规则的权威位置是 specs/03。
  将章节索引要求纳入 03 的文档规范和骨架模板，使新文档创建时即遵循此要求。
  04 作为模型子文档规范，应引用 03 的章节索引要求，确保主文档和子文档均受约束。
impact: |
  - 超过 200 行的正式规范文档和子文档必须提供章节索引
  - 新建文档时按 03 §5.1 骨架模板自动包含章节索引
  - 04 的主文档和子文档均引用 03 的章节索引要求
validation: |
  1. specs/03 §4.1 已包含章节索引规则
  2. specs/03 §5.1 骨架模板已包含章节索引段落
  3. specs/04 §4.1 已引用 03 章节索引要求
  4. specs/04 §4.2 已引用 03 章节索引要求
project: ld-vibe-harness
tags:
  - chapter-index
  - reading-strategy
  - specs
