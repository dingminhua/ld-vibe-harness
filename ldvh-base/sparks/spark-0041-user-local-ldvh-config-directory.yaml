key_findings:
  - |
    配置生成入口不得静默写入固定目录。生成 `LDVH-GOVERNED-PROJECTS.yaml` 前必须让 Human 至少在工作区根目录、用户级 LDVH 配置目录、当前项目根目录三类位置中选择；当前推荐候选仍是工作区根目录。
  - |
    用户级 LDVH 配置目录可以作为本机默认值、默认工作区指针、个人路径和缓存候选，但不得承载 specs、正式事实对象实例、Human Gate 结论、Hook 安装授权或环境入口 integrated 状态。
  - |
    后续设计需要区分“用户级目录保存主登记”和“用户级目录只保存默认工作区指针”。更保守方向是用户级目录只保存默认工作区位置或个人默认值，主 `LDVH-GOVERNED-PROJECTS.yaml` 推荐仍放在工作区根目录。
  - |
    仍需决定 `LDVH_USER_HOME` / `LDVH_HOME`、跨平台默认目录、用户级 fallback、workspace pointer、repo / workspace 配置与用户配置冲突策略、Web 展示来源和测试覆盖。
