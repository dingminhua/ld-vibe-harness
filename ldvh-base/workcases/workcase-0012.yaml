title: 移除事实对象 supersedes 关系与 superseded 状态
created_at: '2026-07-24T09:46:14.094720+08:00'
updated_at: '2026-08-13T14:05:10.636999Z'
status: closed
goal: 在不改变规范模型自身的 supersedes 关系和 WorkCase 审核历史结构的前提下，按 ADR-0001 的来源先行顺序， 审计并收束已经发生的事实对象 supersedes 关系与 ADR/Pitfall superseded 状态清理，使当前 Specs、Code、Helper、Web、 测试和机械覆盖目录一致，并形成可验证结果。
scope: 覆盖事实模型及类型规则 specs/05、20、21、22、23、24，行动模板 specs/31、32，机械目录 specs/attachments/05.Att.02； 核对 code/ldvh/facts/contracts.py、validation.py、transitions.py、relations.py 和事实创建、读取、候选、更新相关 Helper 路径； 核对 Web 中当前事实生命周期的状态词汇、过滤和列表/详情展示，包括历史实际触及的 dashboard、workcaseStatus、ObjectStatusFilter、 ObjectDetail、locales 及对应文档和测试，但不扩大到无关通用 UI 兼容。历史审计输入包括提交 f1645554c、7ba29c6d7、7d2dd25aa 以及当时的 05.Att.02 测试引用修正；既有实现只有经 plan_version 2 重新审计后才能作为结果沿用。 明确排除 Specs 规范模型自身的 supersedes（Specs 01 与 code/ldvh/specs/*）、当时 WorkCase audit 的 superseded_plan/superseded_result、证明旧事实值会被拒绝的负向测试和“不得出现 superseded”的规范说明、 当时工作树中 Pitfall 及其它 Spark/ADR/WorkCase 的无关变更、新增关系类型，以及把普通字符串零命中作为完成证明。
success_criterion_definitions:
- criterion_id: criterion-01
  statement: 当前事实对象规则不再定义 supersedes relation_key，也不再把 superseded 作为 ADR、Pitfall、WorkCase 等当前事实状态或关闭结果； 规范模型关系、当时的 WorkCase audit 字段、负向测试和禁止性说明等不同语义域的合法名称仍被保留。
- criterion_id: criterion-02
  statement: Code、Helper 和 Web 的当前事实生命周期行为与规则一致；旧事实输入被明确拒绝，Web 不把已移除状态作为当前事实筛选或展示选项， 无关通用兼容不被误删。
- criterion_id: criterion-03
  statement: 05.Att.02 指向真实存在且覆盖相应机械责任的测试；相关 Python Specs、facts、Helper 与 Web 合约测试通过，并据实记录未运行或未覆盖范围。
- criterion_id: criterion-04
  statement: 结果包逐项区分历史实现、plan_version 2 获批后的实际审计、保留或修正、无关 Working Tree 差异和未验证范围， 不把历史提交或旧测试声明冒充本计划的执行结果。
success_criterion_results:
- criterion_id: criterion-01
  outcome: satisfied
  summary: 当时的事实生命周期规则已移除 supersedes relation_key 和 superseded 状态，规范模型、WorkCase audit、负向测试和禁止性说明中的 合法异义名称仍保留。
- criterion_id: criterion-02
  outcome: satisfied
  summary: Code 事实生命周期核心与规则一致，Web 端已清理当前事实筛选和展示的死代码，旧值拒绝负向测试通过。
- criterion_id: criterion-03
  outcome: satisfied
  summary: 05.Att.02 引用可定位；45 项 Python 核心测试通过，更正审核又确认 Web TypeScript 检查和 33 项 Web 测试通过。
- criterion_id: criterion-04
  outcome: satisfied
  summary: 结果包已区分历史提交 f1645554c/7ba29c6d7/7d2dd25aa、plan_version 2 下的审计与实施产出 d0528a610， 并保留合法残留和范围边界。
result_summary: 事实对象生命周期中的 supersedes relation_key 和 superseded 状态已从当时的规则与 Code/Helper/Web 行为中移除； 规范模型关系、WorkCase audit、负向测试与禁止性说明中的合法异义名称仍按当时边界保留，05.Att.02 引用与相关测试已收束。
validation_summary: 四项成功标准均已满足。规则源不再定义事实生命周期 supersedes/superseded，合法异义残留已区分；Code/Helper/Web 行为与规则一致； 05.Att.02 引用可定位；45 项 Python 核心测试、Web TypeScript 检查和 33 项 Web 测试均通过。 结果包已区分历史实现与 plan_version 2 产出。
closure_outcome: completed
disposition_summary: 目标已达成。事实对象规则不再定义 supersedes relation_key 和 superseded 状态。规范模型关系、当时的 WorkCase audit 字段、 负向测试和禁止性说明中的合法名称有明确边界，无需分流；原范围内没有未满足、未验证或仍适用的残余责任。
