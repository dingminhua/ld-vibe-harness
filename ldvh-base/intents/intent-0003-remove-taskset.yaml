  PyTools 实现生产对象 create/transition/delete 命令，Skill 不再直接写 YAML。

  '
constraints: '保留 Intent → Task → Change 主链路；TaskSet 不再新建；Evidence 不再作为默认独立对象创建；修改事实源和规范后按提交纪律处理。

  '
