title: 建立 WorkCase 控制契约与持续改进基础
status: closed
summary: Human 已批准 result_version 3 的完整结果和 completed 关闭报告；workcase-0003 正式关闭。
goal: 建立 A–E 共用的 WorkCase 控制契约基础：在不依赖中途 Git commit
  的情况下保留紧凑审核连续性和可核验审核对象，结构化表达成功标准结果、残余责任、非约束后续、31/32 行动分类与持续改进观察，并冻结供后续 Working
  Tree 证据生成和 Human 投影共同消费的唯一 evidence DTO。
scope: A 只建立规则契约及其直接机械保护。规则范围为 specs/21、31、32；为 current WorkCase 字段与事实领域绑定所必需的
  specs/05 和 05.Att.01；作为 Working Tree evidence DTO 唯一来源的 specs/07 及一个新授权附件；仅引用该
  DTO 的 specs/04 和 04.Att.01。实现范围限统一字段登记和派生 Schema 的直接消费者、code/ldvh/facts 中
  validation/transitions/relations、审核对象投影与指纹所需的最小纯函数、行动模板声明/发现的直接消费者及直接测试。现有
  workcase-0001/0002 保持 legacy、原样有效且不补造历史；A 本身按现行 legacy 生命周期完成。明确排除 B 的 Helper
  高层生命周期操作、统一事件时间、诊断和 compact 体验，C 的 Working Tree manifest 采集/比较实现，D 的
  Human/Helper/Web/Codex 展示实现，E 的隔离验收，修改 00，批量迁移工具，多对象原子能力实现，修改或路由
  spark-0008/0014/0019，以及 push/PR。创建由 fact-object-controlled-creation 组织；后续对象更新由
  fact-object-lifecycle-change 组织；普通规则和 Code 实施仍按各自来源求解。本地 commit
  不是成功标准，只能在验证后按既有授权精确隔离 A 文件与本 WorkCase 记录并另行遵循 git-commit；无法隔离则不提交。
success_criteria:
- 规则可机械区分 legacy 与 current WorkCase：生效边界前对象和 A 可按 legacy 生命周期原样有效；生效后新建对象必须使用
  current；legacy 升级是可选显式行动，涉及计划覆盖字段时必须升版、重审并回 Human Gate，closed legacy 不补造历史。
- current WorkCase 的成功标准具有稳定 criterion_id；结果对当前 criterion 完整且唯一覆盖。Code 只检查
  ID、引用、覆盖、状态和证据结构，不判断成功标准或满足结论的真实性。
- audit_summary、review_basis、projection_key 和 subject_fingerprint
  形成唯一闭集；创建时审核和主控处置完整，对象内结果审核遵循 Reviewer 记录后由 Controller 单独处置，任何审核结论都不自动推进或否决。
- 残余责任使用 WorkCase 内稳定 local ID，并只有显式 routed-to 映射才表示承接；nonbinding followup
  不自动建立关系、Spark 或 WorkCase，当前计划和结果可被确定性投影。
- 持续改进只登记影响成功标准、跨阶段恢复或有明确后续消费价值的观察；每项具有来源证据、去重与归属、V1–V8 净价值判断和四类终态处置，单一结果版本最多 20
  项且同主题压缩；普通推理不记录，观察不自动扩张计划或创建、更新、路由事实对象。
- 31 明确创建激活结果和交还，且只为 WorkCase 持久化 21 允许的字段；32 明确
  fact_correction、content_update、single_object_lifecycle、multi_object_disposition，区分单对象
  CAS、合法多步序列和真正多对象原子能力，不冒充未成立的原子成功。
- Working Tree evidence DTO 由 07 的单一授权附件唯一定义 manifest coverage、before/after
  fingerprints、complete/stale/incomplete、changes 和 include/exclude policy
  refs；04 只引用其 Helper 嵌入方式，05 不把非事实对象 DTO 误登记为事实字段，C 与 D 可据此独立实现而不复制 Schema。
- 隔离 fixture 的正反 contract、schema、validation、transitions、relations 和
  action-template 测试覆盖兼容、生效、升级、审核、指纹、成功标准、承接映射、观察收敛和禁止自动语义；聚焦验证与 full-v4 通过，A
  自身生命周期不作为新契约成立的证明。
- 除 A 规则、直接实现与测试、本 WorkCase 流程记录以及范围精确隔离的可选本地 commit 外，不修改 B/C/D/E 实现、00、三项来源
  Spark 或远端状态；未提交不影响 A 的审核、结果或关闭。
