    effect_scope: 允许向现有只读 collaboration Worker 发送当前被审版本并读取反馈；Reviewer 不得写文件、事实、Git 或外部系统；当前 WC 不因字段表达缺口降级到 native subagent 或 same-AI
    risk_summary: 当前 Schema 尚无 collaboration-worker-read-only 枚举和独立 agent/model 字段；bootstrap 只能在不伪造 subagent/same-AI 的前提下使用当前允许的 actual_method 省略，并明确保留实际 Worker 身份与范围
    rollback_summary: 停止派发并保留实际会话、版本和反馈边界；不以归档、删除或 same-AI 补审冒充回滚
