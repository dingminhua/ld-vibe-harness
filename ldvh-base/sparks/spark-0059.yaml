title: Windows 验收执行入口
status: implemented
intent: 保留 Windows 侧从 clone 源码到完成原生验证的完整验收执行入口，使 Windows 侧 Human 或 AI 读取本 Spark 后能独立展开 WorkCase 并推进执行。当前 spark-0004 已定义验收方向（入口引导测试为起点、原生 Windows runner 为证据来源），但缺乏一个给 Windows 执行者直接读取的行动入口——它需要知道：在 Windows 上依次做什么、每一步的成功标准是什么、发现问题后怎么记录。本 Spark 承接 spark-0004 的第一批执行面，不替代 spark-0004 的完整验收矩阵定义。
summary: "**当前状态**\n\n- macOS + 公共代码：已完成（filesystem.py 平台抽象层、git.py 身份解析、test_runs.py 测试运行管理、launcher Windows 回退路径、git_hooks/commit_msg.py 等全部已实现并验证）\n- Windows 侧代码：已实现但**从未在原生 Windows 上验证**（8 项 native_windows 测试、verify_native_windows.py 证据门、approved_writes sentinel）\n- 平台抽象层：`_PosixLockingApi`/`_WindowsLockingApi` 按 `os.name` 分发，Windows 路径问题检测已实现\n- 测试覆盖：8 项 Windows 原生测试（276 行）覆盖 junction/symlink 拒绝、msvcrt 锁、原子边界、drive letter 别名、UNC 拒绝等\n\n**Windows 执行步骤**\n\n步骤 1 — 环境准备\n- 在原生 Windows 机器上 clone 源码仓库\n- 安装 Python 依赖：`pip install -r requirements-dev.txt`\n- 确认入口可用：`python ldvh capabilities`（返回 18 项公开操作）\n- 这一步是 spark-0004 定义的验收起点\n\n步骤 2 — 核心验证\n- 运行平台无关测试：`pytest -m \"not native_windows\" -v`（确保公共代码无回归）\n- 运行 Windows 原生测试：`pytest -m native_windows -v`（8 项平台特定测试）\n- 运行人工证据门：`python tools/verify_native_windows.py`（输出 JSON 验证报告）\n\n步骤 3 — 受控写入验证\n- 在 Windows 上创建一个受控事实对象（如一条 change_log 记录），作为受控写链路完整性的验收证据\n- 写前 pull、写完即 push\n- 这是 spark-0004 方向决定的第二条验收项\n\n步骤 4 — 结果记录\n- 无论通过或失败，在 docs/ 下记录 Windows 验证报告\n- 若测试全过 → 创建 WorkCase 进入后续步骤（CI 配置、Git Gate 实现、approved writes 完成）\n- 若有失败 → 记录失败根因，创建 Pitfall 或修正后重试\n\n**边界**\n\n- 本 Spark 只定义执行入口，不定义验收矩阵的完整项（由 spark-0004 负责）\n- 步骤 2 中 `verify_native_windows.py` 的输出是 spark-0004 验收所需的正式证据\n- 代码层已无新编写需求，差的是环境接入、真实验收和 CI 基础设施\n- Git Gate 路径匹配（L1）和 trailer 格式校验（L2）需规范修订授权后才实现"
