type: change
title: 事实模型落地前决策补充读取与写入策略要求
author: ai
status: done
created: 2026-06-01
updated: 2026-06-01
context: |
  用户指出事实模型初始化决策不应只覆盖写入流程，也需要覆盖读取流程。
  现有 `specs/13-LDVH事实模型基础规范.md` 在落地前决策和落地初始化说明中强调 Rules、Skill、Agent、Tools、Web、契约和可机械化写入能力，但未明确要求同时定义读取策略和写入策略。
decision: |
  更新 `specs/13-LDVH事实模型基础规范.md` §4.7，明确落地前决策用于判断事实模型进入项目实践时的读取策略和写入策略。
  新增读取策略要求，覆盖读取场景、读取事实源、有效状态筛选、读取结果作为执行依据或历史参考的方式，以及读取后发现缺口、冲突或需变更时的分流流程。
  新增写入策略要求，覆盖创建、更新、状态流转、关联回写、废弃、推翻、升级、Change 记录、Human Gate、Tools 受控执行、人工写入和降级记录。
  更新落地初始化说明，要求确认读取入口、写入入口和状态适用规则，并将只读查询、契约校验和受控写入能力一并纳入 Tools 能力检查。
  更新完整方案形成流程，要求在落地前决策中同时定义读取策略和写入策略。
consequences: |
  - 后续 21-49 事实模型在落地前决策和初始化时必须同时覆盖读取链路与写入链路。
  - NN.01-Rules、NN.02-Skill、NN.04-Tools 和 NN.05-Web 的职责分工需要同时考虑读取提醒、读取流程、只读查询、状态适用和写入执行。
  - ADR 文档组后续整改应先依据该通用要求补齐 ADR 读取流程，再处理写入流程和 Skill 实体落地。
affects:
  - specs/13-LDVH事实模型基础规范.md
related_rules:
  - specs/03-Specs文档规范.md
  - specs/10-事实源边界与承载规范.md
  - specs/13-LDVH事实模型基础规范.md
human_gate:
  required: true
  confirmed_by: user
  confirmation_context: 用户要求在 13 事实模型基础规范中添加事实模型初始化决策需涵盖读写策略的规范。
validation: |
  已检查 `specs/13-LDVH事实模型基础规范.md` §4.7 和 §4.8，确认落地前决策、落地初始化和完整方案形成流程均已补充读取策略与写入策略要求。
