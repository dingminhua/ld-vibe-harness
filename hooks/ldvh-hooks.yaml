ldvh_asset:
  id: "ldvh-hook-registry"
  type: "hook"
  status: "active"
  canonical_path: "hooks/ldvh-hooks.yaml"
  source_specs:
    - "specs/03-行动编排规范.md"
    - "specs/31-git-commit-action-Git提交行动编排.md"
    - "specs/07-事实源边界与Git追溯规范.md"
    - "specs/06-运行时扩展规范.md"
    - "specs/attachments/06.Att.02-固定运行时扩展登记表.md"
  consumption_scenarios:
    - "LDVH 统一 Hook 事件登记"
    - "AI Hook 路径：环境通过 stdin 传入 event + payload 调用 dispatcher"
    - "Rules 路径：AI 通过 CLI run <event> 自觉调用 dispatcher"
    - "提交消息本地或环境前置校验"
  inputs:
    - "Hook event id 或 lifecycle protocol event"
    - "事件上下文参数，例如 cwd、target_paths、tool_input、repo root、staged paths、commit message 文件路径"
  outputs:
    - "统一 Hook dispatcher 执行结果"
    - "session-start: target-first governed 状态 + target_resolutions + knowledge-map receipt，可写入用户级 session receipt"
    - "acknowledge-read-plan: AI 回读 P0/P1 后写入 read_plan_consumed 证据"
    - "pre-tool-use: 工作对象管辖判定、receipt 查验、必要时补建 receipt；写类工具缺少 target 或 read_plan_consumed 时阻断，找到已有 receipt 时写入 last_pre_tool_use 可观测字段"
    - "commit-preflight: 提交准备阶段先判定 staged paths / target / repo root 是否命中管辖项目；命中时输出 31 行动入口和 ldvh-git-commit skill_plan"
    - "git.commit-msg: 以 repo root、Git common-dir 和 staged paths 判定提交工作对象；提交前先检查 read_plan_consumed，再执行底层 Code validator 输出和退出码"
  handoff: "环境适配层和 AI 自觉消费层均通过 code/hook_dispatch.py 执行；Hook 路径走 stdin（trigger_source=hook），且环境插件 / wrapper 必须保留并透传原始 payload，Rules 路径走 CLI（--trigger-source rules）。各 hook 的 dispatcher_command 是外部入口；command 是 dispatcher 完成 canonical context、管辖判定和门禁后调用的底层动作，不得作为环境入口绕过 dispatcher。失败时回到调用方修改输入或按对应规范回读事实源。"
  verification:
    - "python3 code/hook_dispatch.py run session-start --trigger-source rules --cwd <cwd> --target <target>"
    - "python3 code/hook_dispatch.py run acknowledge-read-plan --trigger-source rules --cwd <cwd>"
    - "python3 code/hook_dispatch.py run pre-tool-use --trigger-source rules --cwd <cwd> --target <target>"
    - "python3 code/hook_dispatch.py run commit-preflight --trigger-source rules --cwd <repo-root>"
    - "python3 code/hook_dispatch.py run git.commit-msg --trigger-source rules --message-file <message-file>"
    - "echo '{\"event\":\"SessionStart\",\"cwd\":\"<cwd>\",\"target\":\"<target>\",\"trigger_source\":\"hook\"}' | python3 code/hook_dispatch.py"
    - "printf '{\"hook_event_name\":\"PreToolUse\",\"cwd\":\"<cwd>\",\"tool_name\":\"Bash\",\"tool_input\":{\"file_path\":\"<target>\"},\"session_id\":\"smoke\"}' | python3 code/hook_dispatch.py"
    - "python3 code/specs_validate.py deployment-entries"
  sync_triggers:
    - "specs/31-git-commit-action-Git提交行动编排.md 提交行动编排或 Hook 边界变化"
    - "specs/07-事实源边界与Git追溯规范.md 提交格式或门禁规则变化"
    - "code/commit_validate.py CLI 参数或错误等级变化"
    - "code/hook_dispatch.py 事件参数、执行语义或 registry schema 变化"
    - "specs/06-运行时扩展规范.md Hook 资产规则变化"
    - "specs/attachments/06.Att.02-固定运行时扩展登记表.md Hook 登记变化"
  deprecation: "废弃或拆分前必须同步 03、06、07、deployment-entries 和所有环境适配入口。"

hooks:
  - id: "ldvh-git-commit-message"
    event: "git.commit-msg"
    status: "active"
    description: "校验 Git commit message 是否符合 specs/07。"
    blocking: true
    inputs:
      message_file:
        required: true
        description: "Git commit message 文件路径，或用户环境传入的等价消息文件。"
    command:
      - "python3"
      - "code/commit_validate.py"
      - "--check-message-file"
      - "{message_file}"
      - "--repo"
      - "{repo_root}"
    dispatcher_command:
      - "python3"
      - "code/hook_dispatch.py"
      - "run"
      - "git.commit-msg"
      - "--cwd"
      - "{repo_root}"
      - "--message-file"
      - "{message_file}"
    equivalent_manual_check: "python3 code/hook_dispatch.py run git.commit-msg --cwd <repo-root> --message-file <message-file>"
    underlying_validator_check: "python3 code/commit_validate.py --check-message '<message>'；仅校验提交消息格式，不等价于 dispatcher 门禁。"
    bypass_boundary: "环境可以不接入该事件；仓库 native Git hook 可通过 code/install_git_hooks.py install 安装并调用本事件。接入后仍应承认本地或用户侧 Hook 可被绕过，CI / server-side gate 仍是后续兜底方向。"

  - id: "ldvh-session-start"
    event: "session-start"
    status: "active"
    description: "生命周期协议步骤 1——握手：判定环境类型，补全入口链，返回 receipt。"
    blocking: false
    inputs:
      cwd:
        required: true
        description: "当前工作目录；target 缺失时作为 fallback。"
      target:
        required: false
        description: "本次操作实际工作对象路径，可多次传入。"
    command:
      - "python3"
      - "code/hook_dispatch.py"
      - "run"
      - "session-start"
      - "--cwd"
      - "{cwd}"
    dispatcher_command:
      - "python3"
      - "code/hook_dispatch.py"
      - "run"
      - "session-start"
      - "--cwd"
      - "{cwd}"
      - "--target"
      - "{target}"
    equivalent_manual_check: "python3 code/hook_dispatch.py run session-start --cwd <cwd> --target <target>"
    bypass_boundary: "无 AI Hook 环境由 AI 自觉执行同一命令；Hook 路径和 Rules 路径执行同一 handler。"

  - id: "ldvh-acknowledge-read-plan"
    event: "acknowledge-read-plan"
    status: "active"
    description: "生命周期协议步骤 2——消费确认：AI 按 receipt 回读 P0/P1 read_plan 后写入确认。"
    blocking: true
    inputs:
      cwd:
        required: true
        description: "当前工作目录。"
    command:
      - "python3"
      - "code/hook_dispatch.py"
      - "run"
      - "acknowledge-read-plan"
      - "--cwd"
      - "{cwd}"
    equivalent_manual_check: "python3 code/hook_dispatch.py run acknowledge-read-plan --cwd <path>"
    bypass_boundary: "该事件是 AI 消费 read_plan 的运行证据，不替代规范原文、事实源、验证证据或 Human Gate。"

  - id: "ldvh-pre-tool-use"
    event: "pre-tool-use"
    status: "active"
    description: "生命周期协议步骤 3——写前确认：检查管辖项目中是否已完成握手和 read_plan 消费确认。"
    blocking: true
    inputs:
      cwd:
        required: true
        description: "当前工作目录；target 缺失时作为 fallback。"
      target:
        required: false
        description: "本次工具调用实际工作对象路径，可多次传入；写类工具无法确定 target 时必须阻断。"
    command:
      - "python3"
      - "code/hook_dispatch.py"
      - "run"
      - "pre-tool-use"
      - "--cwd"
      - "{cwd}"
    dispatcher_command:
      - "python3"
      - "code/hook_dispatch.py"
      - "run"
      - "pre-tool-use"
      - "--cwd"
      - "{cwd}"
      - "--target"
      - "{target}"
    equivalent_manual_check: "python3 code/hook_dispatch.py run pre-tool-use --cwd <cwd> --target <target>"
    bypass_boundary: "PreToolUse 使用 Hook payload 中的 session_id 查验用户级 session receipt；缺失 SessionStart 可见输出时可补建 receipt；写类工具缺少 target 或 read_plan_consumed 时必须阻断。缺少 session_id 的环境使用最近匹配工作对象的 receipt 兜底，仍无法确认时由 AI 按 Runtime Protocol 自觉确认。"
