      批次 A：已在 `human_closure_confirming` 且成功标准全勾的 WorkCase，可提交 Human 批量关闭确认；范围为 0081、0082、0083、0085、0086。执行前提是 Human 明确确认关闭；执行动作是填写 `closed_at`、`closure_outcome` 和 `result_review.human_closure_confirmation`，状态改为 `closed`。

      批次 B：状态不一致但材料基本完成的 WorkCase，先补齐状态与结果复核材料，不直接关闭；范围为 0084、0087。0084 成功标准已全勾，但停在 `result_self_checking` 且 `controller_resolution` 为空；0087 已在关闭确认口，但仍有一条成功标准未勾，需要先补 closure 分流说明。

