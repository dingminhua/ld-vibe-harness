title: 薄引用 Skill 默认接入的闭环工作
intent: LDVH 环境接入形态已收敛为'单一薄引用 Skill 默认接入、行动模板承载过程检查、git Gate 唯一机械防线、环境插件证据触发的可选加固'，但该形态成立依赖多项尚未落地的前置工作与交付物，分散在规范修订、Code 实现、行动模板增补与发行物交付四个层面，当前没有承接位置逐项跟踪。需要保留该议题，以统一承载形态结论、事实依据、工作清单与残留边界；后续要判断各项工作的范围与顺序、验收方式与分流去向（哪些形成 WorkCase、哪些并入既有 Spark 或另行形成决定），以及'终闸'落地前对外接入故事应如何如实表述。若不跨行动保留，每次接入或交付讨论都需重新收敛形态、重新核对前置缺口并重复评估 Skill 与插件的取舍，增加重新分析、分流与上下文恢复负担。
status: open
priority: P1
summary: "**形态结论**\n\n- LDVH 的交付物为 pip 发行包与六个 console entry point；环境默认接入形态收敛为**单一薄引用 Skill**：只承担身份告知、启动时经 `ldvh-work-context` 取得规则引导、以及'动手落入 LDVH 领域时先经 CLI 取当次行动模板'的路由纪律；Skill 不复制规则正文、不写死模板清单、不猜测 Helper 字段。\n- 过程检查以行动模板中的明确强制项承载（事实写入后跑事实完整性校验、提交前 Helper 预检、直写 `ldvh-base/` 禁令与写后审计要求）；机械防线收敛到原生 git `commit-msg` Gate；环境插件降级为**证据触发的可选加固**，其不可替代价值仅是 PreToolUse guardrail 的载体；MCP 不做（无生命周期，与 shell 直调 CLI 等价）。\n- 分层判断：信息投递层 Skill 与环境 Hook 效果等价（差别在触发必然性、时机与执行痕迹）；约束层 Skill 永远不等价——能阻断的只有模型之外的机制（git Gate 为真终闸，PreToolUse deny 为覆盖不完整的 guardrail）。\n\n**关键事实依据**\n\n- 当前 `ldvh-git-commit-msg` 只校验 spec 03 的提交契约（message 结构、候选路径、管辖绑定与快照身份），**不校验事实对象内容**；绕过 Helper 直写的 schema-invalid 事实对象在 message 合规时会被原样放行，'提交终闸'对事实完整性当前不成立。\n- 事实完整性机械校验能力已存在于 Code 测试层并与事实读取同核，但不是公开入口、没有任何会话级触发。\n- 2026-07-23 已有 AI 直写 `ldvh-base/` 绕过 Helper CAS 与受控写入的实证（spark-0029 已记录）；pitfall-0001 记录插件已安装已注册但环境零实时触发，说明 Hook '必然注入'必须逐环境验证，hydrate 可伪装成已注入。\n\n**待做工作**\n\n1. git `commit-msg` Gate 增加事实机械校验：当 Index 候选包含 `ldvh-base/` 事实对象路径时，对候选执行与读取同核的 schema 校验；与 spark-0022 的 ID 冲突 Gate 合并评估为一个候选 WorkCase；遵循 09 的双入口模式（Helper 预检 + Gate 以真实事件输入复查同一检查实现）。\n2. 事实完整性校验一等化：升为 console entry 或 Helper 公开操作并合同化输出，供行动模板与 Skill 引用。\n3. 行动模板 30/31/32 增补检查强制项与直写禁令；01 §9.10 orientation profile 增补直写禁令与审计入口（走规范修订流程）。\n4. 设计 SKILL.md 模板（三条职责 + 四条边界），确定分发方式（静态随包附带或由 Helper 生成式渲染本机路径，当前倾向生成式）；09.Att.01 接入面与 33 行动模板增补 Skill 接入分支；README 接入段落改写。\n5. 建立 Skill 递达验证方法（cold start 观察、CLI 调用痕迹回查）与固定能力声明表述（劝告级写入保护、worktree 级 Gate 覆盖、语义污染残留风险）。\n6. 治理产物：本次形态决策应形成 ADR；spark-0018 在 Skill 落地并验证后评估关闭；spark-0029 保持 open 并标注 guardrail 的证据触发条件。\n\n**边界与残留风险**\n\n- Skill 替代的是信息投递层，不替代 git hook；受管项目 git hook 仍为必装项，覆盖按 worktree 计，存在 `--no-verify`、多 clone 未装与 Human 直接操作 git 的边界，长期可将同一检查放入 CI 作为终闸的终闸。\n- 未提交污染窗口只能压缩不能消除（模板强制检查 + 校验低成本化 + 读取路径对 schema-invalid 对象报警）；schema 合法但语义造假的事实对任何机械层不可判，为所有方案的共同残留，只能如实声明。\n- 触发条件：再次发生直写污染且跨会话消费后才被发现、无人值守或多 Agent 链路开始写事实对象、或 spark-0029 正式决定交付 guardrail 时，环境插件按 09 薄引用规则补齐。\n\n**未决事项**\n\n- 第 1、2 项是否合并为一个 WorkCase 及与 spark-0022 的合并边界；SKILL.md 静态或生成式分发的最终选择；orientation profile 修订的规范流程入口；'终闸'落地前对外接入故事的如实表述口径。"
