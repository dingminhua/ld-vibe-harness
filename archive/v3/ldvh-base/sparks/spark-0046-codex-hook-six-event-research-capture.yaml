description: |
  本 Spark 记录 Codex 环境插件需要覆盖六类 lifecycle hook 的研究入口：SessionStart、PreToolUse、PostToolUse、UserPromptSubmit、Stop 和 Notification。目标是在真实会话中保留最小事件样本，后续研究每类时机分别适合承载哪些 LDVH 行为，例如会话读计划、工具前阻断、工具后审计、用户输入分流、完成声明检查和通知类提示。

  该议题当前仍处于研究采样阶段。hook 写入 Spark 的样本只作为后续分析线索，不等同于规则、payload schema、安装完成证据或自动治理能力声明。若后续要把某类事件升级为稳定治理入口，应分流到 WorkCase、ADR、Study、docs 或 specs/Code 变更。
source: conversation
source_detail: |
  Human 指出：SessionStart、PreToolUse、PostToolUse、UserPromptSubmit、Stop 和 Notification 六种时机都应该被 hook 支持并写入 Spark，之后进行研究。当前实现把六类事件接入 Codex 插件 shim，并将事件元数据追加到本 Spark 的 evolution 中。
