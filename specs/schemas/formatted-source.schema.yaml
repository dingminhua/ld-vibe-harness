$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Formatted LDVH source"
type: object
additionalProperties: false
required:
  - kind
  - id
  - title
  - status
  - authority
  - source_refs
properties:
  kind:
    type: string
    enum:
      - spec
      - rule
      - hook
      - skill
      - fact_object
      - attachment
  id:
    type: string
    minLength: 1
  title:
    type: string
    minLength: 1
  status:
    type: string
    enum:
      - active
      - candidate
      - deprecated
      - archived
  authority:
    type: object
    additionalProperties: false
    required:
      - layer
      - can_authorize_actions
    properties:
      layer:
        type: string
        enum:
          - rule_authority
          - machine_contract
          - runtime_asset
          - factual_record
          - test_material
      can_authorize_actions:
        type: boolean
      notes:
        type: string
  source_refs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - path
        - role
      properties:
        path:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - authority
            - evidence
            - example
            - implementation
            - test
        line_hint:
          type: string
  relations:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - type
        - target
      properties:
        type:
          type: string
          enum:
            - inherits
            - refines
            - consumes
            - produces
            - validates
            - supersedes
            - blocks
        target:
          type: string
          minLength: 1
        note:
          type: string
  read_plan:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - order
        - target
        - reason
      properties:
        order:
          type: integer
          minimum: 1
        target:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        stop_after:
          type: boolean
  impact_judgment:
    type: array
    items:
      type: string
  stop_conditions:
    type: array
    items:
      type: string
  next_queries:
    type: array
    items:
      type: string
  action_hints:
    type: array
    items:
      type: string
