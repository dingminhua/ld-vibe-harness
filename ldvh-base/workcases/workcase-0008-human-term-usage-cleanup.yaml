updated: '2026-06-25T04:20:00+08:00'
priority: P0
plan_confirmed_at: '2026-06-25T03:30:52+08:00'
review_requested_at: ''
closure_requested_at: ''
description: |
  本 WorkCase 是 spark-0026 的并行执行线程 C 承接对象。任务要求先分类，不机械全局替换；真实 Human 介入、授权、确认、取舍保留或改为 Human/Human Gate；AI 回读、原文核对、文件事实源核对改为明确核对动作；命令行或环境操作改为手动命令、手动步骤或环境接入；Code 机械校验改为 Code/测试/确定性校验；含混或会触发 Human Gate 的只记录，不擅自改。

  首轮扫描覆盖 `specs/`、`rules/`、`code/`、`tests/`、`web/` 和 `ldvh-base/`，并完成低风险推荐表达清理。Human 随后明确要求历史旧表达也必须处理掉，尤其是“人工降级”这种同时混淆执行主体和旧降级概念的表达；主体命名原则必须沉淀到 specs，后续不能再有主语不清晰或主体错误的用法。

  因此本 WorkCase 不关闭，继续承接扩展范围：历史 Spark/Study/WorkCase 采用吸收式改写，Code 中 legacy “人工降级”检测标记采用改名策略，主体命名规范沉淀到 active specs，并补齐需求方案子 Agent 审核与完成后子 Agent 检查。
success_criteria: |
  - [x] 新建 workcase-0008，并与 spark-0026 建立关联。
  - [x] 全量扫描 `人工|Human|用户确认|手动|AI|Code|Web` 相关主体表达，并重点分类“人工”和“用户确认”命中。
  - [x] 对明确低风险的 active specs、attachments、draft/candidate 32、Code 输出文案和测试夹具做最小修改。
  - [ ] code 中用于识别 legacy “人工降级”旧表达的检测能力已改名，不再以“人工降级”作为变量名、诊断名、测试名或推荐输出；旧词只允许作为待检测输入样本或废止表达引用出现。
  - [x] 不修改 workcase-0006、workcase-0007、spark-0027 或 study-0011。
  - [x] 更新 spark-0026 evolution，记录清理结果、保留理由、未决项和后续承接。
  - [x] 运行事实源校验、相关扫描和 `python3 code/specs_validate.py all --fail-on-diagnostics`，并在验证证据中记录结果。
  - [ ] 历史 Spark/Study/WorkCase 中“人工降级”“人工降级检查”“人工核对/检查/复核”等旧表达完成吸收式改写：历史来源可追溯，但当前有效结论明确改为 Human、AI 回读、Code、Web、环境、手动命令或废止表达。
  - [ ] 主体命名原则已沉淀到 active specs 或附件，形成禁止项和推荐替代表达，明确默认执行主体、Human/Human Gate、Code、Web、环境/运行时扩展、手动命令和子 Agent 的主语边界。
  - [ ] 扩展方案已完成独立子 Agent 需求审核；完成后已完成独立子 Agent 结果复核，并由主控记录处理结论。
