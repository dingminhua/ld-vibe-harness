title: 环境安装、配置拓扑与 doctor/bootstrap
intent: 保留目标环境中安装、配置、验证与停用如何形成可诊断责任链的问题，避免把某项能力资产存在、一次有限安装、doctor 通过或触发成功误作跨环境安装闭环。后续需判断每个目标环境的配置位置、前置条件、验证边界、故障定位和 Human 决定分别由谁承接。
status: open
priority: P2
summary: |-
  **当前判断**

  - 环境落地不是单次安装命令：需要把可用资产、目标环境、配置位置、安装前条件、安装动作、安装后验证、停用/卸载和故障定位连成可回读的责任链。
  - 规范或能力资产变化可以提示需要复核的同步影响，但不能由此证明环境已部署，也不授权自动改写用户配置、Rules、Skill 或其它环境资产。
  - README 已提供新环境 AI 的最小接入指引，指向当前接入面、09 与 33；它只解决接入前的发现入口，不替代目标环境资料、Human 授权或真实触发验证。
  - 当前环境的有限安装、触发或 doctor 证据只能支持其实际覆盖范围；不能外推为其它环境、其它配置拓扑或完整生命周期已经成立。

  **ZCode 实际验证：五层状态**

  1. 资产完整性：初始失败。运行时实际选用的 data 目录曾缺少 `ldvh.json`；现已补入。文件存在只证明该资产完整，不能证明运行时会执行 Hook。
  2. 可执行性：通过。手动执行 hook 脚本可以返回 work-context；这不等于环境事件已调用该脚本。
  3. 实时触发验证：当前未通过。一轮新的 cold startup 中，ZCode 报告已注册一个 Hook，却没有 `hook_run_started` 或 `hook_run_completed`，执行目录为空。会话中出现的 work-context 可能来自 hydrate，不能当作本轮实时触发证据。
  4. 功能验证：降级为历史有限观察。补入 data 后曾有一次会话交付 work-context；新证据不能确认那次或当前会话由实时 Hook 产生，因此不能再写成当前功能已通过。
  5. 边界验证：未完成。已部署缓存缺少源码中定义的 SubagentStart；compact/resume、升级/重装、两个注册来源同时启用时的数据目录选择，以及 data 完整时仍不实时执行的原因，均未验证。

  上述案例已形成 `pitfall-0001`，只证明该已观察的 ZCode 安装场景；它不构成其它环境或配置拓扑的安装闭环。

  **需要形成的诊断闭环**

  - 选定环境的最低依赖、可接受配置位置、信任/启用前置条件，以及与已有用户配置的冲突或共存边界。
  - 安装前检查、安装后功能验证、停用或卸载后的残留检查分别证明什么；doctor/bootstrap 需要如实暴露未安装、部分安装、不可验证和故障定位，而不是制造成功结论。
  - 固定受管资产与现场配置/临时脚本分层：前者可作为受管资产核验，后者只能保留其实际安装或观察范围。

  **未决事项**

  - 不预设通用 CLI、Skill 或单一配置拓扑；先按目标环境形成最小闭环，再判断是否需要把稳定安装流程转为 WorkCase 或行动模板。
  - 哪些配置位置、风险接受和跨环境支持范围必须由 Human 决定，仍需在实际目标环境中明确。
  - 安装验证流程本身是否需要通过 Hook 自动化，由 `spark-0029` 承接。
