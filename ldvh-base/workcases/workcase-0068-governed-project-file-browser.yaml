    result_summary: |-
      verification: ## 验证计划

      实现后应运行：

      1. `npm run check`
      2. `npm run lint`
      3. `npm run build`
      4. 针对新增 API 的路径边界和 diff 输出做最小测试或手工验证
      5. 在浏览器中验证独立 tab 的项目文件浏览、Markdown 预览和待提交文件 diff 查看

      同时需要扫描 Web 写入风险，确认除 Spark 快速创建外没有新增事实源写入入口。

      ## 验证结果

      - 新增 `/project-files` 独立 Web tab，侧边栏显示“文件”入口。
      - `GET /api/project-files/projects` 可读取 `LDVH-GOVERNED-PROJECTS.yaml` 并返回管辖项目。
      - `GET /api/project-files/entries`、`/content`、`/git/status`、`/git/diff` 已做本地烟测通过。
      - 浏览器验证 `README.md` 可用通用 `MarkdownPreview` 阅读。
      - 浏览器验证待提交文件 `web/src/pages/ProjectFiles.tsx` 可打开 diff。
      - 浏览器验证桌面和 390px 窄视口下页面级 `scrollWidth` 等于视口宽度，无整页横向滚动。
      - `npm run check`、`npm run lint`、`npm run build` 通过。
      - `python3 -m pytest tests/test_fact_cli.py::test_list_json_output tests/test_fact_cli.py::test_list_json_includes_attention_summary_fields -q` 通过。
      - `python3 tools/fact_validate.py ldvh-base --format json` 通过，0 errors / 0 warnings。

      ## 结论

      任务完成。新增能力保持只读边界，没有新增 Git 写入、事实源写入、暂存、提交、回退或删除入口。

      closure_evidence: ## 交付内容

      - 新增 `web/api/routes/project-files.ts`，提供管辖项目、目录、文件内容、Git 状态和单文件 diff 的只读 API。
      - 在 `web/api/app.ts` 注册 `/api/project-files` 路由。
      - 新增 `web/src/pages/ProjectFiles.tsx`，提供项目文件浏览、Markdown 预览、文本预览、待提交文件列表和 diff 面板。
      - 在 `web/src/App.tsx` 和 `web/src/components/Sidebar.tsx` 接入 `/project-files` 独立 tab。
      - 在 `web/src/utils/api.ts` 增加新增 API 的类型和请求函数。

      ## 验证结果

      - API 烟测通过：`/projects`、`/entries`、`/content`、`/git/status`、`/git/diff` 均能返回预期数据。
      - 浏览器验证通过：`README.md` 可 Markdown 预览，待提交文件可打开 diff。
      - 桌面和 390px 窄视口下页面级宽度未超出视口，diff 横向滚动限制在 diff 面板内部。
      - `npm run check`、`npm run lint`、`npm run build` 通过。
      - `python3 -m pytest tests/test_fact_cli.py::test_list_json_output tests/test_fact_cli.py::test_list_json_includes_attention_summary_fields -q` 通过。
      - `python3 tools/fact_validate.py ldvh-base --format json` 在补齐关闭证据后通过。

      ## 结论

      task-0068 已完成并关闭。新增页面保持只读边界，没有新增事实源写入或 Git 写入入口。
