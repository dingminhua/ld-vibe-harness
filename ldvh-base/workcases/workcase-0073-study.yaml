id: workcase-0073
type: workcase
title: Study 状态与 Spark/Study 时间戳契约收口
goal: |
  Study 状态与 Spark/Study 时间戳契约收口
status: review_needed
created: '2026-06-18T17:08:44.743293'
updated: '2026-06-18T17:51:51+08:00'
priority: P2
description: |
  Study / 研究报告对象只应承载已经形成稳定阅读价值的报告产物，因此不应存在 `draft` 草稿状态；
  后续确认 Study 也不需要 `superseded` 已替代状态，有价值的报告保持 `active`，失去当前价值的报告进入 `archived`。
  本计划负责把 Study 状态机从 specs 到 Code、Web 和测试全链路收口为 `active`、`archived`，
  并确保当前 `/objects/study` 页面不再展示草稿或已替代筛选类别。

  后续用户指出 Spark 和 Study 的创建/更新时间应与其他工作对象一致记录并显示时间戳，而不是 date-only。
  本计划同步收口 `datetime` 字段规范、Validator、Web Spark 写入、事实源实例和 Web 显示测试。
success_criteria: |
  - [x] `specs/24-Study-研究报告.md` 不再把 `draft` 或 `superseded` 作为 Study 合法状态或合法流转
  - [x] `code/fact_cli.py` 创建 Study 时默认进入 `active`，并不再允许 Study `draft` 或 `superseded`
  - [x] `code/fact_validate.py` 校验 Study 时拒绝 `draft`、`superseded` 和 `superseded_by`
  - [x] Web Study 列表不再展示草稿或已替代筛选类别
  - [x] `specs/05.01` 明确 `datetime` 字段必须是至少包含小时和分钟的 ISO 8601 时间戳
  - [x] Validator 拒绝 `created/updated`、WorkCase 关闭时间和 Spark `evolution.at` 中的 date-only 值
  - [x] Web Spark 快速创建写入时间戳而非日期
  - [x] 当前事实源中的 date-only datetime 残留已迁移为可追溯时间戳
  - [x] Python、Web API 和 Web 类型检查通过
source: |
  用户在 2026-06-18 查看 `/objects/study` 时指出：研究报告这个对象不存在草稿类别。
  经检查，Study 当前规范、Code 和 Web 均保留了 `draft`，需要按工作对象契约全链路修正，而不是只隐藏 Web 筛选项。
  随后用户指出 Spark 和 Study 页面仍只显示日期，要求记录时即写入时间戳并按其他工作对象方式显示。
  用户进一步判断研究报告只需区分当前有价值的活跃报告和不再有当前价值的归档报告，因此 Study 不再需要已替代状态。
