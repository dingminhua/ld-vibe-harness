  result_summary: 已核对：09 已区分静态、直调与真实触发，但未将安装/部署/接入/验证四层和环境专属事件表责任收束为同一契约；33 缺少逐事件验证矩阵。直接迁移范围为 README 两处、09.Att.01 一处、33 自身标题/元数据/定义三处及 docs/specs 测试两处。既有并行脏差异已记录，未修改。
- item_id: item-02
  goal: 收束环境四层、环境专属事件表与逐事件验证矩阵，并迁移 33 标题/路径和入口引用。
  expected_result: 09、33、README 与 09.Att.01 形成一致契约；事件矩阵仅是本次行动交还，缺少真实事件证据即明确未验证；不新增 adapter。
  status: completed
  depends_on:
  - item-01
  approach_summary: 仅修改规则和文档；环境专属事件由对应环境来源维护，新增 manifest、script 或 adapter 转入独立 Code 计划；不改变稳定 spec_key/template_key。
  result_summary: 09 已收束四层、环境专属事件责任以及 AI 生命周期 Hook 的用户级原生插件交付边界；33 已迁移新路径、要求逐事件矩阵，并删除 Codex/ZCode、具体 manifest、图标和构建规则。具体目录、插件结构、缓存和构建验证下沉到目标环境来源。未新增 adapter、命令、环境状态或事实对象。
- item_id: item-03
  goal: 验证规则和文档迁移，回读差异并形成当前计划结果。
  expected_result: 规则解析和文档测试、标题/路径直接引用核对通过；实际验证范围、未运行和非环境结论清晰可追溯。
  status: completed
  depends_on:
  - item-02
  approach_summary: 运行范围内真实测试并核对差异；不以字符串零命中、静态部署或 Helper 直调代替真实环境事件验证。
  result_summary: 33 已补入：AI 对已声明事件先只读调查 Hook/等价机制的启用、信任、权限和用户级配置限制；若证实必须由 Human 操作，则先交还最小 Human 受限操作请求。请求明确不是默认指令或授权，禁止猜测厂商开关；Human 完成操作不等于部署或真实触发，缺 manifest/脚本/adapter 仍分流独立 Code 计划。README 仍提供人可复制的最简提示。直接文档测试 3 passed，`git diff --check` 通过；全量 docs/specs 为 127 passed、2 failed，失败为并行字段登记数量 122/121，未由本次改动修复或掩盖。
