id: task-0036
type: task
title: Task 意图归属内联编辑
status: planned
created: '2026-06-05T20:10:05.899771'
updated: '2026-06-05T20:15:00'
description: |
  在 Web 端支持编辑 Task 的 source_intent（意图归属），采用内联编辑方式。

  实现方案：
  1. 后端新增 PATCH /api/objects/:type/:id/field API，支持安全更新指定字段
  2. 修改 source_intent 时自动同步双向关联：旧 Intent 的 related_tasks 移除该 Task，新 Intent 的 related_tasks 添加该 Task
  3. 前端在 Task 详情页 source_intent 字段旁添加编辑按钮（铅笔图标）
  4. 点击后弹出 Intent 选择器（下拉列表，列出所有 active/draft 状态的 Intent）
  5. 选择后调用 API 更新，页面实时刷新

  这是 Web 展示层从纯只读向可交互演进的第一步，需要谨慎设计 API 安全边界。
source_intent: intent-0006
