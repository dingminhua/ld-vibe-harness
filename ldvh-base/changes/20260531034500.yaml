summary: 重写 41.01-41.05 五个模型实践子文档，消除形式化重复，突出各机制独特作用
changes:
  - 重写 41.01：聚焦 Rules 入口提醒职责，删除冗余术语表和待补齐事项，精简为决策表+内容边界+推荐摘要+门禁
  - 重写 41.02：聚焦 Skill 轻量执行入口，精简为使用场景+输入+流程+输出声明+迁移方案+门禁
  - 重写 41.03：聚焦 Agent 增强模式前提和调度，突出硬性前提检查表和主控汇总要点
  - 重写 41.04：聚焦 Tools 确定性校验能力，精简为职责表+Context包结构+四项校验清单+门禁
  - 重写 41.05：聚焦 Web 派生视图定位，精简为展示区域表+硬性边界+受控入口+门禁
  - 所有子文档统一删除重复的术语表、检查要求表、待补齐事项章节，改以正文中的决策表和门禁承载
reason: 原文档内容重点不突出，流于形式化的十章结构（术语、定义、流程、输出、迁移、门禁、检查、待补齐等），实际决策信息密度低。重写后每个文档突出该机制在多角色思考中的独特作用，用决策表替代空泛说明，保留必要门禁
impact:
  - 41.01-41.05 篇幅分别减少约 50-70%
  - 决策信息更集中，读者可快速判断何时使用/不使用某机制
  - 形式化重复的"检查要求""待补齐事项"等章节删除，检查项回归门禁和正文约束
