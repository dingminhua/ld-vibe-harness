title: 五类事实对象字段职责一致性
intent: 保留五类事实类型在公共或相近字段上的定义、绑定和实际记录是否一致的问题，避免 05 的统一字段登记与类型来源看似满足结构约束，但对象实践仍把状态、恢复、结论或承接写入错误字段，造成重复权威或终态残留。后续需区分哪些差异是类型语义所需，哪些是定义、绑定、验证或写入实践的偏离，并确定最小修正和迁移范围。
status: implemented
summary: "**当前结论**\n\n- 原触发案例 workcase-0011 已在 closed 对象中正确省略活动期 `summary`、`resume_from`、`waiting_on`、`phase`；终态保留的 `result_summary`、`validation_summary`、`disposition_summary` 三字段分别回答产物、验证覆盖与停止理由，无职责重叠。原 Spark 描述的\"顶层 summary 仍保留过期关闭确认文案\"触发事实已失效。\n- 05 §7.2 已完整规定字段准入四结论（复用/提升为 foundation/明确区分/新建 type），§7.2.1 强制\"合并无损重复、删除无消费价值字段\"；05.Att.01 统一字段登记为每个字段指定唯一 `definition_scope`、`applies_to`、`definition_ref`。规则缺口不存在。\n- 抽样五类对象各一代表性实例（spark-0033、workcase-0064、adr-0008、pitfall-0007、study-0025），逐类核对 `summary`/`abstract`/`decision`/`validation_summary`/`disposition_summary` 等相近信息位，均未发现状态、恢复、结论或承接写入错误字段、重复权威或终态残留。\n- 长文阅读与复制路径消费一致性已由 spark-0015（implemented）的 Web 阅读契约、实现与验证直接覆盖；Spark 规范 20 §5 也已固定区段标题（意图/摘要/演变/分流·落实·废弃）。\n\n**处置边界**\n\n五类对象字段职责一致性目前由「05 §7.2 字段准入四结论 + §7.2.1 无损重复合并规则 + 05.Att.01 统一字段登记 + 各类型来源的字段使用绑定/专属字段定义（not_meaning 明确禁止错位）+ 31/32 受控创建更新链路的机械校验与写后回读」五层机制完整保障。未来若在具体消费场景发现页面渲染退化或复制来源猜测，按独立 Bug/WorkCase 处理，不回归为本 Spark 的未处置内容。"
disposition_summary: 五类对象字段职责一致性经系统核查后确认：原触发案例 workcase-0011 已正确省略活动期字段且终态三 summary 分工无重叠；05 §7.2+§7.2.1+05.Att.01 已完整覆盖字段准入、查重与无损重复合并；五类代表性对象抽样未发现字段职责错位或权威重复；长文阅读与复制路径已由 spark-0015 implemented 覆盖。本范围无剩余未承接责任，未来具体消费场景问题按独立 Bug/WorkCase 处理。
