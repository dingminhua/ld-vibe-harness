name: CI

on:
  push:
  pull_request:

jobs:
  code:
    name: Code (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check code
      - name: Test (pytest)
        env:
          PYTHONPATH: code
        run: pytest code/tests

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc)
        run: npm run check
      - name: Test (tsx)
        run: npm test
      - name: Build (vite)
        run: npm run build
