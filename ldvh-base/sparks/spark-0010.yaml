title: Codex 多 Agent、工作树与角色协作治理
intent: 保留主控、子 Agent、新对话与隔离 worktree 如何在当前环境中安全协作的问题，避免把历史角色方案、一次环境能力观察或子 Agent
  输出误作稳定纪律、事实来源或主控验证结论。后续需判断委派条件、写入边界、回收责任和环境差异。
status: open
priority: P1
summary: "**当前判断**\n\n- WorkCase 保存目标、阶段工作项、当前推进、审核、证据和关闭判断；不保存平台线程、子 Agent API、工具状态或运行期编排实现。\n\
  \  - 子 Agent、角色、工作树和新对话可以提供协作手段，但历史候选做法与单次环境观察不构成 V4 当前纪律，也不证明所有客户端能力一致。\n\
  \  - 2026-07-24 术语审核中该风险实际发生：主控聚合三个审核子任务结论时，转述了“行动许可 12 处”等十余项未证实断言，Human\
  \  要求独立复核后全部证伪。由此形成一条具体纪律候选：主控转述子任务聚合结论前，必须对关键断言做原文抽样复核，否则只能如实标注为“未复核的转述”，不得陈述为已证实事实。\n\
  \n**需要形成的协作治理**\n  \n- 何时由主控直接完成，何时适合只读子 Agent、独立复核、新对话或隔离 worktree。\n- 每次委派的目标、输入、允许写入范围、禁止事项、验证与交还；主控如何等待、核对实际修改、处理冲突、重跑验证、吸收或拒绝结果，并保留最终整合责任。\n\
  \  - 抽样复核纪律的后续分流：执行并验证有效后可形成 Pitfall；沉淀为可复用流程则进入 WorkCase 或行动模板。\n\
  \  - 哪些角色契约可以环境无关，哪些只是 Codex 的可选投影；任何能力可用声明仍须当次真实调用验证。\n\n**边界**\n\n- 不把子 Agent、线程或\n\
  \  worktree 建成事实对象，不把 Agent 输出直接写成稳定事实，也不恢复固定角色清单、状态机或自动团队。\n- WorkCase 控制信息由 `spark-0008`\n\
  \  承接，整体 Harness 成熟度由 `spark-0009` 承接，能力资产准入由 `spark-0011` 承接。具体实现只有形成清楚目标、范围、成功标准和环境证据后，才进入\n\
  \  WorkCase。"
