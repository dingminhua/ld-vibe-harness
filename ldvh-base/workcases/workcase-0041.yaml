  suggestion_kind: follow_up_opportunity
  summary: 迁移延期的 WorkCase 页面到 current_snapshot_projection 并退出 legacy projector。
  follow_up_summary: 在新的获批 WorkCase 中修改本案 Gate1 禁止的 ObjectDetail、WorkCaseProgressTrack、ObjectList/reading layout 及相应契约测试，使可见标签和下一必经动作直接消费 source-bound projection；确认没有生产消费者后删除 projectWorkCaseCard 和 phase-only compatibility facade。
- suggestion_id: suggestion-controller-template-convergence
  suggestion_kind: follow_up_opportunity
  summary: 瘦身 34 并固定 Controller 回读投影后的连续受控写回流程。
  follow_up_summary: 以 21 为状态与 phase 权威，缩减 34 为前置读取、执行循环、稳定检查点、合法退出和恢复交还；要求 Controller 每次刚回读后消费 current_snapshot_projection，Reviewer pass 后连续完成关闭准备写回，但不让 Code 替 AI 判断授权、完成或 phase 推进。
- suggestion_id: suggestion-workcase-redundancy-cleanup
  suggestion_kind: follow_up_opportunity
  summary: 继续清理 WorkCase 派生字段、提交粒度和恢复字段冗余。
  follow_up_summary: 另案评估 continuation_required、execution_stalled、下一动作和 Web 分组不入 YAML，检查点写回与 Git commit 按语义单位解耦，并进一步验证顶层 resume_from/summary、item 级恢复入口和固定 quality gate 绑定能否在不误删不同职责结构的前提下简化。
