summary: 将模型实践子文档标题命名维度规则从 06/07 迁移至 01 §7.3.1
date: 2026-05-31
reason: |
  命名维度规则属于术语边界和命名纪律，01 §7.3 已是"模型实践子文档命名中的机制名"的权威位置。
  将命名维度规则从 06/07 §4.6 迁移至 01 §7.3.1，消除三文档并行维护同一规则的问题，
  符合 01 §八 引用纪律"每项稳定规则只能有一个权威定义位置"的原则。
actions:
  - 01 §7.3 新增 §7.3.1"模型实践子文档标题命名维度规则"，包含标题格式、4 条维度规则和权威声明
  - 07 §4.6 标题格式规则改为引用 01 §7.3.1，删除原内联的命名维度约束
  - 06 §4.6 标题格式规则改为引用 01 §7.3.1，删除原内联的命名维度约束
  - 06/07 §4.6 的语义定义表格保留不动（语义定义与模型类型绑定，属于各自领域）
affected_files:
  - specs/01-specs文档结构与术语规范.md
  - specs/07-LDVH行动模型基础规范.md
  - specs/06-LDVH生产对象基础规范.md
verification:
  - 01 §7.3.1 包含标题格式、4 条维度规则和权威声明
  - 07 §4.6 标题格式规则引用 01 §7.3.1，未并行维护命名维度约束
  - 06 §4.6 标题格式规则引用 01 §7.3.1，未并行维护命名维度约束
  - 06/07 §4.6 语义定义表格仍保留
