- item_id: item-establish-common-artifact-hygiene
  goal: 把 34 中跨模板重复的临时工件卫生收敛到 06 的最小共同行动边界。
  expected_result: 06 明确 Working Tree 外优先、归属/授权/继续价值判断、保留交还与非 clean-WT 判据；34 只回指该共同边界，不复制逐检查点清理流程。
  status: completed
