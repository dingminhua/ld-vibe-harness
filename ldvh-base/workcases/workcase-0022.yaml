  status: pending
  goal: specs/03 §9 契约扩展：commit-msg Gate 对事实候选的触发条件、校验层、结果并入 mechanical_outcome/issues、删除与改名的状态语义
  expected_result: §9 扩展文本与钉住测试一致描述新行为
  approach_summary: 在 §9 增补候选事实校验小节，明确触发（布局内+object_id 合法+有暂存内容）、同核复用边界、删除/改名语义、诊断并入位置
- item_id: item-02
